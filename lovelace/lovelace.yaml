                    \  100% {transform: rotate(40deg);}\n}\n"
                fill_container: true
                icon: mdi:cake-variant-outline
                icon_color: green
                layout: vertical
                primary_info: name
                secondary_info: state
                type: custom:mushroom-entity-card
              state: <4
          show_empty: false
          sort:
            count: 1
            method: state
            numeric: true
          type: custom:auto-entities
        conditions:
        - condition: or
          conditions:
          - below: 4
            condition: numeric_state
            entity: sensor.anniversary_katalin
          - below: 4
            condition: numeric_state
            entity: sensor.anniversary_stephan
          - below: 4
            condition: numeric_state
            entity: sensor.anniversary_enya
          - below: 4
            condition: numeric_state
            entity: sensor.anniversary_duncan
        type: conditional
