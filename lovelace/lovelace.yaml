          \ - timedelta(days=1) %}\n    {% set next_event = sunset %}\n  {% endif\
          \ %}\n  {% set total = (next_event - last_event).total_seconds() %}\n  {%\
          \ set elapsed = (now_time - last_event).total_seconds() %}\n  {{ ((elapsed\
          \ / total) * 100) | round(2) if total > 0 else 0 }}\n{% else %}\n  0\n{%\
