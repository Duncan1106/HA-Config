config:
  swipe_nav:
    animate: fade
    enable_on_subviews: false
    skip_subviews: true
    swipe_amount: 30
  title: Home
  views:
  - badges: []
    cards: []
    dense_section_placement: false
    icon: mdi:home
    max_columns: 3
    path: overview
    sections:
    - cards:
      - cards:
        - card:
            card_mod:
              style: "ha-card {\n  border: 2.5px outset red\n}\n"
            entity: sensor.stadt_rauenberg_aktuelle_warnstufe
            fill_container: true
            icon: ''
            multiline_secondary: true
            primary: '{{ state_attr(''sensor.stadt_rauenberg_aktuelle_warnstufe'',''warning_1_headline'')
              }}'
            secondary: '{% set start = state_attr(''sensor.stadt_rauenberg_aktuelle_warnstufe'',''warning_1_start'')
              %} {% set end = state_attr(''sensor.stadt_rauenberg_aktuelle_warnstufe'',''warning_1_end'')
              %} {{ start.strftime(''%d.%m %H:%M'') + '' - '' +  end.strftime(''%d.%m
