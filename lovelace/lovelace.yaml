          - color: green
            icon: mdi:recycle
            label: Wertstoff
            pattern: Wertstoff
            type: recycle
          - color: brown
            icon: mdi:bio
            label: "Biom\xFCll"
            pattern: Bio
            type: organic
          - color: grey
