config:
  views:
  - badges: []
    cards:
    - double_tap_action:
        action: more-info
      entity: sensor.cudy_uptime
      fill_container: true
      hold_action:
        action: more-info
      icon: ''
      layout: vertical
      primary: '{{ states("sensor.cudy_uptime") }}'
      secondary: ''
      tap_action:
        action: more-info
      type: custom:mushroom-template-card
    - cards:
      - cards:
        - align_header: center
          align_state: center
          cahce: true
          decimals: 3
          entities:
          - sensor.cudy_download_speed
          font_size: 65
          group: hour
          hour24: true
          hours_to_show: 24
          line_width: 2
          name: Download
          points_per_hour: 10
          show:
            average: true
            extrema: true
            icon: false
            labels: false
            points: false
          type: custom:mini-graph-card
        - align_header: center
          align_state: center
          cahce: true
          decimals: 3
          entities:
          - sensor.cudy_upload_speed
          font_size: 65
          group: hour
          hour24: true
          hours_to_show: 24
          line_width: 2
          name: Upload
          points_per_hour: 10
          show:
            average: true
            extrema: true
            icon: false
            labels: false
            points: false
          type: custom:mini-graph-card
        title: Speed
        type: horizontal-stack
      - cards:
        - aggregate_func: diff
          align_header: center
          align_state: center
          cahce: true
          decimals: 3
          entities:
          - sensor.cudy_data_received_daily
          font_size: 65
          group: hour
          hour24: true
          hours_to_show: 24
          line_width: 2
          name: Download
          points_per_hour: 10
          show:
            average: true
            extrema: true
            icon: false
            labels: false
            points: false
          type: custom:mini-graph-card
        - aggregate_func: diff
          align_header: center
          align_state: center
          cahce: true
          decimals: 3
          entities:
          - sensor.cudy_data_sent_daily
          font_size: 65
          group: hour
          hour24: true
          hours_to_show: 24
          line_width: 2
          name: Upload
          points_per_hour: 10
          show:
            average: true
            extrema: true
            icon: false
            labels: false
            points: false
          type: custom:mini-graph-card
        title: Daily Data
        type: horizontal-stack
      type: vertical-stack
    icon: mdi:router-wireless-settings
    title: Cudy
  - badges: []
    cards:
    - card:
        type: entities
      filter:
        include:
        - name: '*Firmware Version*'
      sort:
        ip: true
        method: none
      type: custom:auto-entities
    - card:
        type: entities
      filter:
        include:
        - device_manufacturer: Tasmota
          entity_id: sensor.*_ssid
      type: custom:auto-entities
    - card:
        type: entities
      filter:
        include:
        - device_manufacturer: Tasmota
          entity_id: sensor.*_rssi
      sort:
        method: state
        numeric: true
        reverse: false
      type: custom:auto-entities
    icon: mdi:power-socket-de
    path: tasmota
    title: Tasmota
  - badges: []
    cards:
    - cards:
      - double_tap_action:
          action: more-info
        entity: sensor.ha_uptime
        fill_container: true
        hold_action:
          action: more-info
        icon: ''
        layout: vertical
        primary: '{{ states(''sensor.ha_uptime'') }}'
        secondary: ''
        tap_action:
          action: more-info
        type: custom:mushroom-template-card
      - card:
          columns: 2
          square: false
          type: grid
        card_param: cards
        filter:
          include:
          - name: '*Home Assistant*'
            not:
              name: '*Swipe|go-eCharger|Neu|Sonnen|Eingabe*'
            options:
              align_header: center
              align_state: center
              cache: true
              entities:
              - this.entity_id
              entity: null
              font_size: 60
              hour24: true
              hours_to_show: 24
              line_width: 2
              points_per_hour: 1
              show:
                fill: fade
                icon: false
                labels: false
                points: false
              type: custom:mini-graph-card
            state: '>0'
        type: custom:auto-entities
      type: vertical-stack
    icon: mdi:raspberry-pi
    path: raspberr
    title: System Monitor
