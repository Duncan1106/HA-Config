config:
  views:
  - badges: []
    cards:
    - card:
        type: vertical-stack
      card_param: cards
      filter:
        include:
        - entity_id: sensor.*
          name: '*Power|power|Leistung|leistung|Lichter Automatic|Terrarium*'
          not:
            name: '*RU|RO|LU|LO|Humidity|Temperature|Luftfeuchtigkeit|Battery|forecast|average|Device
              Power|Power energy|ENERGY|WiFi|RSSI|MQTT|Last|Reason|Apparent|Reactive|Firmware|power
              Lieblingsplatz|Home Power all|Schreibtisch 2 Power|Schreibtisch Power|L1|L2|L3|DC|factor|scb|Insights|powercalc|Solar
              Power Monitor & Controller|Terrarium energy|Helligkeitslampe power|Solcast
              PV Forecast|esp32|Tibber Pulse|Tibber Bridge|ZbDongle|ZbDongel*'
          options:
            align_header: center
            align_state: center
            cache: true
            entities:
            - this.entity_id
            entity: null
            font_size: 60
            hour24: true
            hours_to_show: 24
            line_width: 2
            points_per_hour: 60
            show:
              fill: true
              icon: false
              labels: true
              points: hover
            state_adaptive_color: true
            type: custom:mini-graph-card
            update_interval: 60
          state: '>0.5'
      sort:
        ignore_case: false
        method: friendly_name
        numeric: false
        reverse: false
      type: custom:auto-entities
    title: Home
    type: panel
