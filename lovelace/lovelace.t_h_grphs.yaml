config:
  views:
  - badges: []
    cards:
    - card:
        type: vertical-stack
      card_param: cards
      filter:
        include:
        - entity_id: sensor.*
          name: '*Temperature|temperature|Humidity|humidity|Luftfeuchtigkeit|Temperatur|T&H*'
          not:
            name: '*ID|Battery|Batterie|LU|RU|LO|RO*|Current temperature limit|sensor
              2|sensor 1|localhost|WVGZZZE2ZPE005371|Linkquality|Spannung*'
          options:
            align_header: center
            align_state: center
            cache: true
            color_thresholds:
            - color: '#10FF10'
              value: 30
            - color: '#1010FF'
              value: 50
            - color: '#FF1010'
              value: 100
            entities:
            - this.entity_id
            entity: null
            font_size: 60
            hour24: true
            hours_to_show: 48
            line_width: 2
            points_per_hour: 30
            show:
              fill: true
              icon: false
              labels: true
              points: hover
            state_adaptive_color: true
            type: custom:mini-graph-card
            update_interval: 60
      type: custom:auto-entities
    title: Home
    type: panel
