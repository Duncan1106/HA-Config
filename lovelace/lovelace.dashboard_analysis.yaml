config:
  views:
  - badges: []
    cards:
    - cards:
      - double_tap_action:
          action: more-info
        entity: input_boolean.show_cudy_router_details
        fill_container: true
        hold_action:
          action: more-info
        icon: ''
        layout: vertical
        primary: '{{ time_since(now() - timedelta(seconds=(states(''sensor.cudy_router_betriebszeit'')
          | int(0))), 2) }}'
        secondary: Cudy Uptime
        tap_action:
          action: toggle
        type: custom:mushroom-template-card
      - card:
          cards:
          - cards:
            - align_header: center
              align_state: center
              cache: true
              decimals: 2
              entities:
              - sensor.cudy_router_upload_geschwindigkeit
              font_size: 65
              hour24: true
              hours_to_show: 24
              line_width: 2
              name: Upload
              points_per_hour: 10
              show:
                icon: false
                labels: false
                points: false
              type: custom:mini-graph-card
            - align_header: center
              align_state: center
              cache: true
              decimals: 2
              entities:
              - sensor.cudy_router_download_geschwindigkeit
              font_size: 65
              hour24: true
              hours_to_show: 24
              line_width: 2
              name: Download
              points_per_hour: 10
              show:
                icon: false
                labels: false
                points: false
              type: custom:mini-graph-card
            type: horizontal-stack
          - cards:
            - aggregate_func: diff
              align_header: center
              align_state: center
              cache: true
              decimals: 3
              entities:
              - sensor.cudy_data_sent_daily
              font_size: 65
              group_by: hour
              hour24: true
              hours_to_show: 24
              line_width: 2
              name: Upload (Daily)
              points_per_hour: 10
              show:
                icon: false
                labels: false
                points: false
              type: custom:mini-graph-card
            - aggregate_func: diff
              align_header: center
              align_state: center
              cache: true
              decimals: 3
              entities:
              - sensor.cudy_data_received_daily
              font_size: 65
              group_by: hour
              hour24: true
              hours_to_show: 24
              line_width: 2
              name: Download (Daily)
              points_per_hour: 10
              show:
                icon: false
                labels: false
                points: false
              type: custom:mini-graph-card
            type: horizontal-stack
          type: vertical-stack
        conditions:
        - entity: input_boolean.show_cudy_router_details
          state: 'on'
        type: conditional
      type: vertical-stack
    - cards:
      - double_tap_action:
          action: more-info
        entity: input_boolean.show_server_details
        fill_container: true
        hold_action:
          action: more-info
        icon: ''
        layout: vertical
        primary: '{{ time_since(as_datetime(states(''sensor.system_monitor_letzter_start'')),
          2)}}'
        secondary: Server Uptime
        tap_action:
          action: toggle
        type: custom:mushroom-template-card
      - card:
          cards:
          - bar_size: large
            entity: sensor.system_monitor_prozessornutzung
            layout: horizontal
            name: CPU %
            show_more_info: true
            theme: cpu
            type: custom:entity-progress-card
            unit: '%'
          - bar_size: large
            decimal: 0
            entity: sensor.system_monitor_prozessortemperatur
            layout: horizontal
            name: "CPU \xB0C"
            show_more_info: true
            theme: temperature
            type: custom:entity-progress-card
            unit: "\xB0C"
          - bar_size: large
            decimal: 0
            entity: sensor.system_monitor_speicherauslastung
            layout: horizontal
            max_value: 15409
            name: RAM
            show_more_info: true
            theme: memory
            type: custom:entity-progress-card
            unit: MB
          - bar_size: large
            decimal: 1
            entity: sensor.system_monitor_festplattennutzung_2
            icon: mdi:harddisk
            layout: horizontal
            name: ROM
            show_more_info: true
            type: custom:entity-progress-card
            unit: '%'
          type: vertical-stack
        conditions:
        - entity: input_boolean.show_server_details
          state: 'on'
        type: conditional
      type: vertical-stack
    - cards:
      - entity: input_boolean.show_ha_uptime
        fill_container: true
        icon: ''
        layout: vertical
        primary: '{{ time_since(as_datetime(states(''sensor.uptime'')), 2) }}'
        secondary: Homeassistent Uptime
        tap_action:
          action: toggle
        type: custom:mushroom-template-card
      - card:
          align_header: center
          align_state: center
          entities:
          - sensor.entities
          font_size: 60
          hour24: true
          hours_to_show: 24
          line_width: 2
          points_per_hour: 1
          show:
            fill: fade
            icon: false
            labels: false
            points: false
          type: custom:mini-graph-card
        conditions:
        - entity: input_boolean.show_ha_uptime
          state: 'on'
        type: conditional
      type: vertical-stack
    - cards:
      - entity: input_boolean.show_mariadb_graphs
        fill_container: true
        layout: vertical
        primary: '{% set rows = states(''sensor.maria_db_rows'') | int(0) %} {{ ((states(''sensor.maria_db_size'')
          | float(0)) * 1000000) | filesizeformat() }} @ {{ ''{:,.3f}''.format(rows
          / 1000).replace('','', ''.'') }} Rows'
        secondary: Maria DB Size
        tap_action:
          action: toggle
        type: custom:mushroom-template-card
      - card:
          cards:
          - align_header: center
            align_state: center
            entities:
            - entity: sensor.maria_db_size
              name: Maria DB Size
            font_size: 65
            hours_to_show: 96
            line_width: 2
            points_per_hour: 2
            show:
              fill: fade
              icon: false
              labels: true
              points: hover
            type: custom:mini-graph-card
          - align_header: center
            align_state: center
            entities:
            - entity: sensor.maria_db_rows
              name: Maria DB Rows
            font_size: 65
            hours_to_show: 96
            line_width: 2
            points_per_hour: 2
            show:
              fill: fade
              icon: false
              labels: true
              points: hover
            type: custom:mini-graph-card
          - cards:
            - align_header: center
              align_state: center
              entities:
              - entity: sensor.mariadb_cpu_prozent
                name: Maria DB Cpu Usage
              font_size: 65
              hours_to_show: 48
              line_width: 2
              points_per_hour: 1
              show:
                fill: fade
                icon: false
                labels: true
                points: hover
              type: custom:mini-graph-card
            - align_header: center
              align_state: center
              entities:
              - entity: sensor.mariadb_arbeitsspeicher_in_prozent
                name: Maria DB Ram Usage
              font_size: 65
              hours_to_show: 48
              line_width: 2
              points_per_hour: 1
              show:
                fill: fade
                icon: false
                labels: true
                points: hover
              type: custom:mini-graph-card
            type: horizontal-stack
          type: vertical-stack
        conditions:
        - entity: input_boolean.show_mariadb_graphs
          state: 'on'
        type: conditional
      type: vertical-stack
    - cards:
      - entity: input_boolean.show_folding_at_home
        fill_container: true
        icon: ''
        layout: vertical
        multiline_secondary: true
        primary: Folding@Home
        secondary: '{% set status = time_until(as_datetime(states(''sensor.192_168_2_205_00_estimated_time_finished'')),2)
          %}

          {% set running = is_state(''sensor.192_168_2_205_00_status'',''RUNNING'')
          %}

          {{ "Finished in: " + status if running else "Paused: " + status }}

          {{ states(''sensor.192_168_2_205_00_percentdone'') | float(0) | round(2)
          }} /{{ states(''sensor.192_168_2_205_00_total_frames'') }}'
        tap_action:
          action: toggle
        type: custom:mushroom-template-card
      - card:
          cards:
          - cards:
            - cards:
              - entity: sensor.192_168_2_205_00_status
                fill_container: true
                layout: vertical
                name: Status
                tap_action:
                  action: call-service
                  service: script.folding_home
                  target: {}
                type: custom:mushroom-entity-card
              - entity: select.192_168_2_205_select_power_level
                fill_container: true
                layout: vertical
                name: Power Level
                type: custom:mushroom-select-card
              type: horizontal-stack
            - bar_size: large
              decimal: 2
              entity: sensor.192_168_2_205_00_percentdone
              hide:
              - icon
              layout: horizontal
              name: Folding @ Home
              show_more_info: true
              theme: battery
              type: custom:entity-progress-card
            - cards:
              - cards:
                - entity: sensor.192_168_2_205_00_assigned
                  fill_container: true
                  icon: mdi:eye
                  icon_color: blue
                  layout: vertical
                  primary: Assigned since
                  secondary: '{{ time_since( as_datetime(states(''sensor.192_168_2_205_00_assigned'')),
                    2)}}'
                  tap_action:
                    action: more-info
                  type: custom:mushroom-template-card
                - entity: sensor.192_168_2_205_00_estimated_time_finished
                  fill_container: true
                  icon: mdi:eye
                  icon_color: blue
                  layout: vertical
                  primary: Finnished in
                  secondary: '{% set running = is_state(''sensor.192_168_2_205_00_status'',''RUNNING'')
                    %} {% set finish_time = time_until(as_datetime(states(''sensor.192_168_2_205_00_estimated_time_finished'')),
                    2) %} {{ "Paused" if not running else finish_time }}'
                  tap_action:
                    action: more-info
                  type: custom:mushroom-template-card
                - entity: sensor.192_168_2_205_00_deadline
                  fill_container: true
                  icon: mdi:eye
                  icon_color: blue
                  layout: vertical
                  primary: Deadline in
                  secondary: '{{ time_until( as_datetime(states(''sensor.192_168_2_205_00_deadline'')),
                    2)}}'
                  tap_action:
                    action: more-info
                  type: custom:mushroom-template-card
                type: horizontal-stack
              - cards:
                - entity: sensor.192_168_2_205_00_time_per_frame
                  fill_container: true
                  icon: mdi:clock
                  icon_color: blue
                  layout: vertical
                  primary: time / frame
                  secondary: '{% set uptime = states(''sensor.192_168_2_205_00_time_per_frame'')
                    | int(0) %} {% set finish = now() + timedelta(seconds=uptime)
                    %} {{ time_until(finish, 2) }}'
                  tap_action:
                    action: more-info
                  type: custom:mushroom-template-card
                - double_tap_action:
                    action: call-service
                    service: button.press
                    target:
                      entity_id:
                      - button.update_foldingathome
                  entity: sensor.folding_at_home_credits_scrape
                  fill_container: true
                  layout: vertical
                  name: Credits
                  type: custom:mushroom-entity-card
                - entity: sensor.192_168_2_205_00_creditestimate
                  fill_container: true
                  layout: vertical
                  name: Estimated credits
                  type: custom:mushroom-entity-card
                type: horizontal-stack
              - double_tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id:
                    - button.update_foldingathome
                entity: sensor.folding_at_home_rank_scrape
                fill_container: true
                layout: vertical
                type: custom:mushroom-entity-card
              type: vertical-stack
            - cards:
              - align_header: center
                align_state: center
                entities:
                - entity: sensor.folding_home_cpu_prozent
                  name: Folding@Home Cpu Usage
                font_size: 65
                hours_to_show: 48
                line_width: 2
                points_per_hour: 4
                show:
                  fill: fade
                  icon: false
                  lables: true
                  points: hover
                type: custom:mini-graph-card
              - align_header: center
                align_state: center
                entities:
                - entity: sensor.folding_home_arbeitsspeicher_in_prozent
                  name: Folding@Home RAM Usage
                font_size: 65
                hours_to_show: 48
                line_width: 2
                points_per_hour: 4
                type: custom:mini-graph-card
              type: horizontal-stack
            type: vertical-stack
          type: vertical-stack
        conditions:
        - entity: input_boolean.show_folding_at_home
          state: 'on'
        type: conditional
      type: vertical-stack
    - cards:
      - double_tap_action:
          action: call-service
          service: script.1707895746671
          target: {}
        entity: input_boolean.show_speedtest_details
        fill_container: true
        icon: ''
        layout: vertical
        primary: '{% set unavailable = is_state(''sensor.speedtest_download'',''unknown'')
          %} {% set text = "Ping: " + states(''sensor.speedtest_ping'') + "ms, " +
          states(''sensor.speedtest_upload'') + " Mbps, " + states(''sensor.speedtest_download'')
          + " Mbps" %} {{ "" if unavailable else text }}'
        secondary: '{% set script = is_state(''script.1707895746671'',''on'') %} {%
          set unavailable = is_state(''sensor.speedtest_download'',''unknown'') %}
          {% set last_run = states(''sensor.speedtest_last_run'') %} {{ "Start SpeedTest,
          Last: " + last_run + " ago" if not script else ("Testing" if unavailable
          else "Wrapping up") }}'
        tap_action:
          action: toggle
        type: custom:mushroom-template-card
      - card:
          cards:
          - cards:
            - align_header: center
              align_state: center
              cache: true
              decimals: 2
              entities:
              - sensor.speedtest_upload
              - entity: sensor.upload_avg_24h
              font_size: 65
              hour24: true
              hours_to_show: 24
              line_width: 2
              name: Upload
              points_per_hour: 30
              show:
                average: true
                extrema: true
                icon: false
                labels: false
                legend: false
                points: false
              type: custom:mini-graph-card
            - align_header: center
              align_state: center
              cache: true
              decimals: 2
              entities:
              - sensor.speedtest_download
              - entity: sensor.download_avg_24h
              font_size: 65
              hour24: true
              hours_to_show: 24
              line_width: 2
              name: Download
              points_per_hour: 30
              show:
                average: true
                extrema: true
                icon: false
                labels: false
                legend: false
                points: false
              type: custom:mini-graph-card
            type: horizontal-stack
          type: vertical-stack
        conditions:
        - entity: input_boolean.show_speedtest_details
          state: 'on'
        type: conditional
      type: vertical-stack
    - content: "{% set x = ['unavailable','unknown'] %}\n<details>\n{%- for d in states|groupby('domain')\
        \ %}\n  {% if loop.first %} \n  <summary><b>Domains: {{loop.length}}</b> </summary>\n\
        \  {% endif %}\n  <details>\n  <summary>{{- d[0] | title }}: <b>{{states[d[0]]|rejectattr('state','in',x)|list|count}}</b></summary>\n\
        \  {% for i in d[1] if i.state not in x -%}\n  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;-\
        \ {{i.name}}: <b>{{i.state}}</b><br>\n  {% endfor %}\n  </details>\n{%- endfor\
        \ -%}\n</details>"
      type: markdown
    - entity: sensor.backup_state
      fill_container: true
      icon: mdi:clipboard-check-multiple-outline
      layout: vertical
      multiline_secondary: true
      primary: 'Last Backup Size: {{ state_attr(''sensor.backup_state'', ''backups'')[-1][''size'']
        }}'
      secondary: '{% set uptime = (now().timestamp() - as_timestamp(state_attr(''sensor.backup_state'',
        ''backups'')[-1][''date''])) %}

        {% set months = (uptime % 31536000) // 2592000 %}

        {% set days = (uptime % 2592000) // 86400 %}

        {% set hours = (uptime % 86400) // 3600 %}

        {% set minutes = (uptime % 3600) // 60 %}

        {% set percent = state_attr(''sensor.backup_state'', ''backups'')[-1][''state'']
        %}

        Last Backup {{ ''%dm '' % months if months else '''' }}{{ ''%dd '' % days
        if days else '''' }}{{ ''%dh '' % hours if hours else '''' }}{{ ''%dm'' %
        minutes if minutes else '''' }} ago

        State: {{ "Uploaded" if percent == "Drive Only" else percent }}

        Total Space in Google Drive: {{state_attr(''sensor.backup_state'', ''size_in_google_drive'')}}

        Total Backups in Google Drive: {{state_attr(''sensor.backup_state'', ''backups_in_google_drive'')}}'
      tap_action:
        action: more-info
      type: custom:mushroom-template-card
    - entity: sensor.onedrivefilesync
      fill_container: true
      icon: ''
      layout: vertical
      multiline_secondary: true
      primary: 'Onedrive Filesync:

        {% set status_backup = states(''sensor.onedrivefilesync'') | string %}

        {% set percent = state_attr(''sensor.onedrivebackup'', ''Current file upload
        percentage'') %}

        {% set speed = state_attr(''sensor.onedrivebackup'',''Current file upload
        speed (KB/s)'')%}

        {{ "Uploaded" if status_backup == "Synced" else "Syncing" }}'
      secondary: ''
      tap_action:
        action: more-info
      type: custom:mushroom-template-card
    - entity: sensor.tibber_pulse_uptime
      fill_container: true
      icon: mdi:pulse
      icon_color: blue
      layout: vertical
      tap_action:
        action: more-info
      type: custom:mushroom-entity-card
    - entity: todo.to_do_duncan
      hide_completed: true
      type: todo-list
    icon: mdi:home-analytics
    title: Analytics
    type: masonry
  - badges: []
    cards:
    - cards:
      - badges:
        - entity: sensor.openbk7231t_app_newest_version
          type: entity
        entity: input_boolean.show_open_beken_updates
        heading: Open Beken
        heading_style: title
        icon: mdi:fridge
        tap_action:
          action: toggle
        type: heading
      - card:
          type: entities
        filter:
          template: "{% set latest = states('sensor.openbk7231t_app_newest_version').lstrip('v')\
            \ %} {% for e in states.sensor if 'build' in e.entity_id %}\n  {% set\
            \ parts = e.state.split(' ') %}\n  {% if parts | length > 1 %}\n    {%\
            \ set device_version = parts[1] %}\n    {% if device_version != latest\
            \ %}\n      {{ e.entity_id }}\n    {% endif %}\n  {% endif %}\n{% endfor\
            \ %}\n"
        sort:
          method: state
        type: custom:auto-entities
        visibility:
        - condition: state
          entity: input_boolean.show_open_beken_updates
          state: 'on'
      type: vertical-stack
    - cards:
      - badges:
        - entity: sensor.tasmota_newest_version
          type: entity
        entity: input_boolean.show_tasmota_updates
        heading: Tasmota
        heading_style: title
        icon: mdi:fridge
        tap_action:
          action: toggle
        type: heading
      - card:
          type: entities
        filter:
          template: '{% set latest = states(''sensor.tasmota_newest_version'').lstrip(''v'')
            %} {% for e in states.sensor %} {% if ''firmware_version'' in e.entity_id
            and not e.state.startswith(latest) %} {{ e.entity_id }} {% endif %} {%
            endfor %}

            '
        sort:
          method: state
        type: custom:auto-entities
        visibility:
        - condition: state
          entity: input_boolean.show_tasmota_updates
          state: 'on'
      type: vertical-stack
    icon: mdi:power-socket-de
    path: tasmota
    subview: false
    title: Tasmota
  - badges: []
    cards:
    - card:
        columns: 1
        square: false
        type: grid
      card_param: cards
      filter:
        include:
        - entity_id: '*battery_plus'
          options:
            tap_action:
              action: more-info
            theme: battery
            type: custom:entity-progress-card
      show_empty: true
      sort:
        ignore_case: true
        method: state
        numeric: true
      type: custom:auto-entities
    - card_mod:
        style:
          ha-markdown$: 'table { width: 100%; border-collapse: separate; border-spacing:
            0px; } tbody tr:nth-child(2n+1) { background-color: var(--table-row-background-color);
            } thead tr th, tbody tr td {padding: 4px 10px; }

            '
      content: "{% set ns_batteries = namespace(batteries={}) %}\n{% for entity_id\
        \ in integration_entities('battery_notes') if entity_id is search('_battery_type$',\
        \ ignorecase=False) -%}\n    {% set battery_type = states[entity_id].state\
        \ %}\n    {% set battery_split = battery_type.split('x') %}\n    {% if battery_split\
        \ | length > 1 %}\n      {% set battery_type = battery_split[-1] | trim %}\n\
        \      {% set battery_count = battery_split[0] | int(1) %}\n    {% else %}\n\
        \      {% set battery_count = 1 %}\n    {% endif %}\n    {% if battery_type\
        \ not in ns_batteries.batteries %}\n        {% set ns_batteries.batteries\
        \ = dict(ns_batteries.batteries, **{battery_type: battery_count}) %}\n   \
        \   {% else %}\n        {% set ns_batteries.batteries = dict(ns_batteries.batteries,\
        \ **{battery_type: ns_batteries.batteries[battery_type] + battery_count})\
        \ %}\n    {% endif %}\n{% endfor %}\n\n| Type | Count |\n| :-- | --: |\n{%\
        \ for bt in ns_batteries.batteries | dictsort(False, 'value') | reverse -%}\n\
        \  | {{ bt[0] }} | {{ [bt][0][1] }} |\n{% endfor %}\n"
      title: Battery Summary
      type: markdown
    - cards:
      - entities:
        - entity: input_text.batterie_suche
          icon: mdi:magnify
          name: Serch by battery type
          secondary_info: none
        state_color: false
        type: entities
      - content: "{% set search_term = states('input_text.batterie_suche') %}\n{%\
          \ if search_term != \"\" %}\n  {# 1. Alle _battery_plus\u2011Ger\xE4te #}\n\
          \  {% set devices = states\n     | selectattr('entity_id', 'search', '_battery_plus$')\n\
          \     | selectattr('attributes.battery_type_and_quantity', 'defined')\n\
          \     | list %}\n\n  {# 2. Mutable container anlegen #}\n  {% set ns = namespace(buffer=[])\
          \ %}\n\n  {# 3. Matches sammeln als dicts mit numeric lvl #}\n  {% for device\
          \ in devices %}\n    {% set bt_raw = device.attributes.battery_type_and_quantity\
          \ | replace('\xD7','x') %}\n    {% if search_term in bt_raw %}\n      {%\
          \ set entry = {\n        'lvl': device.state | int,\n        'line': bt_raw\
          \ ~ ': ' ~ device.name ~ ': ' ~ device.state ~ '%'\n      } %}\n      {%\
          \ set ns.buffer = ns.buffer + [ entry ] %}\n    {% endif %}\n  {% endfor\
          \ %}\n\n  {% if ns.buffer | length > 0 %}\n    {# 4. Numeric\u2011sortieren\
          \ und dann alle lines joined ausgeben #}\n    {{ ns.buffer\n       | sort(attribute='lvl')\n\
          \       | map(attribute='line')\n       | list\n       | join('\\n') }}\n\
          \  {% else %}\n    Keine Ger\xE4te mit diesem Batterietyp gefunden.\n  {%\
          \ endif %}\n{% else %}\n  Search result\n{% endif %}\n"
        type: markdown
      type: vertical-stack
    icon: mdi:battery
    path: batterys
    title: Batterys
    type: masonry
  - badges: []
    cards:
    - entity: sensor.mqtt_stats_uptime
      icon_type: none
      layout: vertical
      name: Uptime
      primary_info: state
      secondary_info: name
      type: custom:mushroom-entity-card
    - cards:
      - entity: sensor.mqtt_stats_bytes_received
        fill_container: true
        icon: mdi:call-received
        layout: vertical
        primary: '{{ states(''sensor.mqtt_stats_bytes_received'') | filesizeformat()
          }}'
        secondary: ''
        tap_action:
          action: more-info
        type: custom:mushroom-template-card
      - entity: sensor.mqtt_stats_bytes_sent
        fill_container: true
        icon: mdi:call-made
        layout: vertical
        primary: '{{ states(''sensor.mqtt_stats_bytes_sent'') | filesizeformat() }}'
        secondary: ''
