            template: "{%- set view = states('input_select.select_view_for_labels')\
              \ -%}\n{%- set all_retention = labels() | select('match', '^retention_')\
              \ | list -%}\n\n{%- if view == 'Rest' -%}\n  {# 1. PRE-CALCULATE ALL\
              \ COVERED ENTITIES #}\n  {%- set ns_covered = namespace(entities=[])\
              \ -%}\n  {%- for label in all_retention -%}\n    {%- set ns_covered.entities\
              \ = ns_covered.entities + label_entities(label) -%}\n    {%- set device_ents\
              \ = label_devices(label) | map('device_entities') | sum(start=[]) -%}\n\
              \    {%- set ns_covered.entities = ns_covered.entities + device_ents\
              \ -%}\n  {%- endfor -%}\n  {%- set covered_set = ns_covered.entities\
              \ | unique | list -%}\n\n  {# 2. Ignore domains handled by Recorder\
              \ defaults or UI helpers #}\n  {%- set ignore_domains = ['light', 'switch',\
              \ 'number', 'ai_task', 'device_tracker', 'person', 'automation', 'assist_satellite',\
              \ 'button', 'calendar', 'camera', 'conversation', 'datetime', 'event',\
