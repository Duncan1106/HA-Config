            \      {% set dev_retention = labels(dev_id) | select('in', all_retention)\
            \ | list if dev_id is not none else [] %}\n      {% if target in dev_retention\
            \ %}\n        {% set ns.final_ents = ns.final_ents + [ent_id] %}\n   \
            \   {% endif %}\n    {% endif %}\n  {% endif %}\n{% endfor %}\n{# ---\
            \ 3. DEVICE MAPPING --- #} {% set final_devices = ns.final_ents | map('device_id')\
            \ | reject('none') | unique | list %}\n### \U0001F4CA {{ target | replace('_',\
            \ ' ') | title }} Overview\n**Total Entities:** {{ ns.final_ents | count\
            \ }}\n**Devices Affected:** {{ final_devices | count }}"
