          action: toggle
        title: R1
        type: state-icon
      - entity: switch.esp32relayboard_relay1
        icon: mdi:lightbulb
        state_color: true
        style:
          left: 15%
          top: 32.5%
        tap_action:
          action: toggle
        title: R1
        type: state-icon
      - entity: switch.esp32relayboard_relay1
        icon: mdi:lightbulb
        state_color: true
        style:
          left: 32.5%
          top: 32.5%
        tap_action:
          action: toggle
        title: R1
        type: state-icon
