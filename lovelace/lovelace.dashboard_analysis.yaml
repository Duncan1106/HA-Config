config:
  views:
  - badges: []
    cards:
    - button-background: transparent
      cards:
      - cards:
        - cards:
          - align_header: center
            align_state: center
            cache: true
            decimals: 2
            entities:
            - sensor.cudy_router_upload_geschwindigkeit
            font_size: 65
            hour24: true
            hours_to_show: 24
            line_width: 2
            name: Upload
            points_per_hour: 10
            show:
              icon: false
              labels: false
              points: false
            type: custom:mini-graph-card
          - align_header: center
            align_state: center
            cache: true
            decimals: 2
            entities:
            - sensor.cudy_router_download_geschwindigkeit
            font_size: 65
            hour24: true
            hours_to_show: 24
            line_width: 2
            name: Download
            points_per_hour: 10
            show:
              icon: false
              labels: false
              points: false
            type: custom:mini-graph-card
          type: horizontal-stack
        - cards:
          - aggregate_func: diff
            align_header: center
            align_state: center
            cache: true
            decimals: 3
            entities:
            - sensor.cudy_data_sent_daily
            font_size: 65
            group_by: hour
            hour24: true
            hours_to_show: 24
            line_width: 2
            name: Upload
            points_per_hour: 30
            show:
              icon: false
              labels: false
              points: false
            type: custom:mini-graph-card
          - aggregate_func: diff
            align_header: center
            align_state: center
            cache: true
            decimals: 3
            entities:
            - sensor.cudy_data_received_daily
            font_size: 65
            group_by: hour
            hour24: true
            hours_to_show: 24
            line_width: 2
            name: Download
            points_per_hour: 30
            show:
              icon: false
              labels: false
              points: false
            type: custom:mini-graph-card
          type: horizontal-stack
        type: vertical-stack
      child-padding: 0.0em
      clear: false
      gap: 0.1em
      overlay-margin: 0em
      padding: 0.1em
      title: Expander
      title-card:
        double_tap_action:
          action: more-info
        entity: sensor.cudy_router_betriebszeit
        fill_container: true
        hold_action:
          action: more-info
        icon: ''
        layout: vertical
        primary: '{{ time_since(now() - timedelta(seconds=(states(''sensor.cudy_router_betriebszeit'')
          | int(0)) ),2) }}'
        secondary: Cudy Uptime
        tap_action:
          action: more-info
        type: custom:mushroom-template-card
      title-card-button-overlay: false
      type: custom:expander-card
    - button-background: transparent
      cards:
      - cards:
        - bar_size: large
          entity: sensor.system_monitor_prozessornutzung
          layout: horizontal
          name: CPU %
          show_more_info: true
          theme: cpu
          type: custom:entity-progress-card
          unit: '%'
        - bar_size: large
          decimal: 0
          entity: sensor.system_monitor_prozessortemperatur
          layout: horizontal
          name: "CPU \xB0C"
          show_more_info: true
          theme: temperature
          type: custom:entity-progress-card
          unit: "\xB0C"
        - bar_size: large
          decimal: 0
          entity: sensor.system_monitor_speicherauslastung
          layout: horizontal
          max_value: 15409
          name: RAM
          show_more_info: true
          theme: memory
          type: custom:entity-progress-card
          unit: MB
        - bar_size: large
          decimal: 1
          entity: sensor.system_monitor_festplattennutzung_2
          icon: mdi:harddisk
          layout: horizontal
          name: ROM
          show_more_info: true
          type: custom:entity-progress-card
          unit: '%'
        - card:
            columns: 1
            square: false
            type: grid
          card_param: cards
          filter:
            exclude:
            - state: 'off'
            include:
            - entity_id: update.*
              options:
                type: tile
          show_empty: false
          type: custom:auto-entities
        type: vertical-stack
      child-padding: 0.0em
      clear: false
      gap: 0.1em
      overlay-margin: 0em
      padding: 0.1em
      title: Expander
      title-card:
        double_tap_action:
          action: more-info
        entity: sensor.system_monitor_letzter_start
        fill_container: true
        hold_action:
          action: more-info
        icon: ''
        layout: vertical
        primary: '{{ time_since( as_datetime(states(''sensor.system_monitor_letzter_start'')),
          2)}}'
        secondary: Server Uptime
        tap_action:
          action: more-info
        type: custom:mushroom-template-card
      title-card-button-overlay: false
      type: custom:expander-card
    - button-background: transparent
      cards:
      - button-background: transparent
        cards:
        - card:
            columns: 1
            square: false
            type: grid
          card_param: cards
          filter:
            include:
            - integration: spook
              not:
                name: "*Repairs|Entit\xE4ten*"
              options:
                decimal: 0
                type: custom:entity-progress-card
                unit: ' '
              state: '>0'
          sort:
            method: state
            numeric: true
            reverse: true
          type: custom:auto-entities
        child-padding: 0.0em
        clear: false
        gap: 0.1em
        overlay-margin: 0em
        padding: 0.1em
        title-card:
          cards:
          - align_header: center
            align_state: center
            entities:
            - sensor.entities
            font_size: 60
            hour24: true
            hours_to_show: 48
            line_width: 2
            points_per_hour: 10
            show:
              fill: fade
              icon: false
              labels: false
              points: false
            type: custom:mini-graph-card
          type: vertical-stack
        title-card-button-overlay: true
        type: custom:expander-card
      child-padding: 0.0em
      clear: false
      gap: 0.1em
      overlay-margin: 0em
      padding: 0.1em
      title: Expander
      title-card:
        entity: sensor.uptime
        fill_container: true
        icon: ''
        layout: vertical
        primary: '

          {{ time_since( as_datetime(states(''sensor.uptime'')), 2)}}'
        secondary: Homeassistent Uptime
        tap_action:
          action: more-info
        type: custom:mushroom-template-card
      type: custom:expander-card
    - button-background: transparent
      cards:
      - align_header: center
        align_state: center
        entities:
        - entity: sensor.maria_db_size
          name: Maria DB Size
        font_size: 65
        hours_to_show: 96
        line_width: 2
        points_per_hour: 2
        show:
          fill: fade
          icon: false
          lables: true
          points: hover
        type: custom:mini-graph-card
      - align_header: center
        align_state: center
        entities:
        - entity: sensor.maria_db_rows
          name: Maria DB Rows
        font_size: 65
        hours_to_show: 96
        line_width: 2
        points_per_hour: 2
        show:
          fill: fade
          icon: false
          lables: true
          points: hover
        type: custom:mini-graph-card
      - cards:
        - align_header: center
          align_state: center
          entities:
          - entity: sensor.mariadb_cpu_prozent
            name: Maria DB Cpu Usage
          font_size: 65
          hours_to_show: 48
          line_width: 2
          points_per_hour: 1
          show:
            fill: fade
            icon: false
            lables: true
            points: hover
          type: custom:mini-graph-card
        - align_header: center
          align_state: center
          entities:
          - entity: sensor.mariadb_arbeitsspeicher_in_prozent
            name: Maria DB Ram Usage
          font_size: 65
          hours_to_show: 48
          line_width: 2
          points_per_hour: 1
          show:
            fill: fade
            icon: false
            lables: true
            points: hover
          type: custom:mini-graph-card
        type: horizontal-stack
      child-padding: 0.0em
      clear: false
      gap: 0.1em
      overlay-margin: 0em
      padding: 0.1em
      title: Expander
      title-card:
        entity: sensor.maria_db_size
        fill_container: true
        icon: ''
        layout: vertical
        primary: '{% set rows = states(''sensor.maria_db_rows'') | int(0)%}

          {{ ((states(''sensor.maria_db_size'') | float(0)) * 1000000) | filesizeformat()
          }} @ {{ ''{:,.3f}''.format(rows / 1000 ).replace('','',''.'')}} Rows'
        secondary: Maria DB Size
        tap_action:
          action: more-info
        type: custom:mushroom-template-card
      title-card-button-overlay: false
      type: custom:expander-card
    - button-background: transparent
      cards:
      - cards:
        - cards:
          - entity: sensor.192_168_2_205_00_status
            fill_container: true
            layout: vertical
            name: Status
            tap_action:
              action: call-service
              service: script.folding_home
              target: {}
            type: custom:mushroom-entity-card
          - entity: select.192_168_2_205_select_power_level
            fill_container: true
            layout: vertical
            name: Power Level
            type: custom:mushroom-select-card
          type: horizontal-stack
        - bar_size: large
          decimal: 2
          entity: sensor.192_168_2_205_00_percentdone
          hide:
          - icon
          layout: horizontal
          name: Folding @ Home
          show_more_info: true
          theme: battery
          type: custom:entity-progress-card
        - cards:
          - cards:
            - entity: sensor.192_168_2_205_00_assigned
              fill_container: true
              icon: mdi:eye
              icon_color: blue
              layout: vertical
              primary: Assigned since
              secondary: '{{ time_since( as_datetime(states(''sensor.192_168_2_205_00_assigned'')),
                2)}}'
              tap_action:
                action: more-info
              type: custom:mushroom-template-card
            - entity: sensor.192_168_2_205_00_estimated_time_finished
              fill_container: true
              icon: mdi:eye
              icon_color: blue
              layout: vertical
              primary: Finnished in
              secondary: '{% set running = is_state(''sensor.192_168_2_205_00_status'',''RUNNING'')
                %} {% set finish_time = time_until(as_datetime(states(''sensor.192_168_2_205_00_estimated_time_finished'')),
                2)%} {{ "Paused" if not running else finish_time }}'
              tap_action:
                action: more-info
              type: custom:mushroom-template-card
            - entity: sensor.192_168_2_205_00_deadline
              fill_container: true
              icon: mdi:eye
              icon_color: blue
              layout: vertical
              primary: Deadline in
              secondary: '{{ time_until( as_datetime(states(''sensor.192_168_2_205_00_deadline'')),
                2)}}'
              tap_action:
                action: more-info
              type: custom:mushroom-template-card
            type: horizontal-stack
          - cards:
            - entity: sensor.192_168_2_205_00_time_per_frame
              fill_container: true
              icon: mdi:clock
              icon_color: blue
              layout: vertical
              primary: time / frame
              secondary: '{% set uptime = states(''sensor.192_168_2_205_00_time_per_frame'')
                | int(0) %} {% set finish = now() + timedelta(seconds=uptime)%} {{
                time_until(finish, 2) }}'
              tap_action:
                action: more-info
              type: custom:mushroom-template-card
            - double_tap_action:
                action: call-service
                service: button.press
                target:
                  entity_id:
                  - button.update_foldingathome
              entity: sensor.folding_at_home_credits_scrape
              fill_container: true
              layout: vertical
              name: Credits
              type: custom:mushroom-entity-card
            - entity: sensor.192_168_2_205_00_creditestimate
              fill_container: true
              layout: vertical
              name: Estimated credits
              type: custom:mushroom-entity-card
            type: horizontal-stack
          - double_tap_action:
              action: call-service
              service: button.press
              target:
                entity_id:
                - button.update_foldingathome
            entity: sensor.folding_at_home_rank_scrape
            fill_container: true
            layout: vertical
            type: custom:mushroom-entity-card
          type: vertical-stack
        - cards:
          - align_header: center
            align_state: center
            entities:
            - entity: sensor.folding_home_cpu_prozent
              name: Folding@Home Cpu Usage
            font_size: 65
            hours_to_show: 48
            line_width: 2
            points_per_hour: 4
            show:
              fill: fade
              icon: false
              lables: true
              points: hover
            type: custom:mini-graph-card
          - align_header: center
            align_state: center
            entities:
            - entity: sensor.folding_home_arbeitsspeicher_in_prozent
              name: Folding@Home RAM Usage
            font_size: 65
            hours_to_show: 48
            line_width: 2
            points_per_hour: 4
            show:
              fill: fade
              icon: false
              lables: true
              points: hover
            type: custom:mini-graph-card
          type: horizontal-stack
        type: vertical-stack
      child-padding: 0.0em
      clear: false
      gap: 0.1em
      overlay-margin: 0em
      padding: 0.1em
      title: Expander
      title-card:
        entity: sensor.192_168_2_205_00_percentdone
        fill_container: true
        icon: ''
        layout: vertical
        multiline_secondary: true
        primary: Folding@Home
        secondary: " \n    {% set status = time_until(as_datetime(states('sensor.192_168_2_205_00_estimated_time_finished')),2)%}\n\
          \    {% set running = is_state('sensor.192_168_2_205_00_status','RUNNING')\
          \ %}\n    {{ \"Finished in: \" + status if running else \"Paused: \" + status\
          \ }}\n    {{ states('sensor.192_168_2_205_00_percentdone') | float(0) |\
          \ round(2) }} /{{ states('sensor.192_168_2_205_00_total_frames') }}"
        tap_action:
          action: more-info
        type: custom:mushroom-template-card
      type: custom:expander-card
    - button-background: transparent
      cards:
      - cards:
        - cards:
          - align_header: center
            align_state: center
            cache: true
            decimals: 2
            entities:
            - sensor.speedtest_upload
            - entity: sensor.upload_avg_24h
            font_size: 65
            hour24: true
            hours_to_show: 24
            line_width: 2
            name: Upload
            points_per_hour: 30
            show:
              average: true
              extrema: true
              icon: false
              labels: false
              legend: false
              points: false
            type: custom:mini-graph-card
          - align_header: center
            align_state: center
            cache: true
            decimals: 2
            entities:
            - sensor.speedtest_download
            - entity: sensor.download_avg_24h
            font_size: 65
            hour24: true
            hours_to_show: 24
            line_width: 2
            name: Download
            points_per_hour: 30
            show:
              average: true
              extrema: true
              icon: false
              labels: false
              legend: false
              points: false
            type: custom:mini-graph-card
          type: horizontal-stack
        type: vertical-stack
      child-padding: 0.0em
      clear: false
      gap: 0.1em
      overlay-margin: 0em
      padding: 0.1em
      title: Expander
      title-card:
        entity: script.1707895746671
        fill_container: true
        icon: ''
        layout: vertical
        primary: '{% set unavailable = is_state(''sensor.speedtest_download'',''unknown'')%}

          {% set text = "Ping: " + states(''sensor.speedtest_ping'') + "ms, " + states(''sensor.speedtest_upload'')
          + " Mbps, " + states(''sensor.speedtest_download'') + " Mbps"%}

          {{  "" if unavailable else text }}'
        secondary: '{% set script = is_state(''script.1707895746671'',''on'') %}

          {% set unavailable = is_state(''sensor.speedtest_download'',''unknown'')%}

          {% set last_run = states(''sensor.speedtest_last_run'') %}

          {{ "Start SpeedTest, Last: " + last_run + " ago" if not script else ("Testing"
          if unavailable else "Wrapping up") }}'
        tap_action:
          action: call-service
          service: script.1707895746671
          target: {}
        type: custom:mushroom-template-card
      title-card-button-overlay: false
      type: custom:expander-card
    - button-background: transparent
      cards:
      - card_mod:
          style: "ha-card.type-markdown {\n  box-shadow: none;\n  margin: 0px -16px\
            \ -16px -16px;\n  overflow-y: scroll;\n  height: 1000px;\n}\n"
        card_type: markdown
        content: "{% set x = ['unavailable','unknown'] %} {%- for d in states|groupby('domain')\
          \ %} {% if loop.first %} ### Domains: {{loop.length}}{% endif %}\n  **{{-\
          \ d[0]}}:** *({{states[d[0]]\n                      |rejectattr('state','in',x)\n\
          \                      |list|count}})*\n  {% for i in d[1] if i.state not\
          \ in x -%}\n  > {{i.name}}: *{{i.state}}*\n  {% endfor %}\n{%- endfor -%}\n"
        type: custom:hui-element
      child-padding: 0.0em
      clear: false
      gap: 0.1em
      overlay-margin: 0.0em
      padding: 0.1em
      title: Domains & their Entities
      title-card-button-overlay: false
      type: custom:expander-card
    - entity: sensor.backup_state
      fill_container: true
      icon: mdi:clipboard-check-multiple-outline
      layout: vertical
      multiline_secondary: true
      primary: 'Last Backup Size: {{ state_attr(''sensor.backup_state'', ''backups'')[-1][''size'']
        }}'
      secondary: '{% set uptime = (now().timestamp() - as_timestamp(state_attr(''sensor.backup_state'',
        ''backups'')[-1][''date''])) %}

        {% set months = (uptime % 31536000) // 2592000 %}

        {% set days = (uptime % 2592000) // 86400 %}

        {% set hours = (uptime % 86400) // 3600 %}

        {% set minutes = (uptime % 3600) // 60 %}

        {% set percent = state_attr(''sensor.backup_state'', ''backups'')[-1][''state'']
        %}

        Last Backup {{ ''%dm '' % months if months else '''' }}{{ ''%dd '' % days
        if days else '''' }}{{ ''%dh '' % hours if hours else '''' }}{{ ''%dm'' %
        minutes if minutes else '''' }} ago

        State: {{ "Uploaded" if percent == "Drive Only" else percent }}

        Total Space in Google Drive: {{state_attr(''sensor.backup_state'', ''size_in_google_drive'')}}

        Total Backups in Google Drive: {{state_attr(''sensor.backup_state'', ''backups_in_google_drive'')}}'
      tap_action:
        action: more-info
      type: custom:mushroom-template-card
    - entity: sensor.onedrivefilesync
      fill_container: true
      icon: ''
      layout: vertical
      multiline_secondary: true
      primary: 'Onedrive Filesync:

        {% set status_backup = states(''sensor.onedrivefilesync'') | string %}

        {% set percent = state_attr(''sensor.onedrivebackup'', ''Current file upload
        percentage'') %}

        {% set speed = state_attr(''sensor.onedrivebackup'',''Current file upload
        speed (KB/s)'')%}

        {{ "Uploaded" if status_backup == "Synced" else "Syncing" }}'
      secondary: ''
      tap_action:
        action: more-info
      type: custom:mushroom-template-card
    - entity: sensor.tibber_pulse_uptime
      fill_container: true
      icon: mdi:pulse
      icon_color: blue
      layout: vertical
      tap_action:
        action: more-info
      type: custom:mushroom-entity-card
    - entity: todo.to_do_duncan
      hide_completed: true
      type: todo-list
    - cards:
      - all_series_config:
          unit: rows
        apex_config:
          grid:
            borderColor: '#E0E0E0'
            forceNiceScale: false
            show: true
          tooltip:
            enabled: true
            fixed:
              enabled: true
            followCursor: false
            x:
              show: true
          xaxis:
            labels:
              show: false
        cache: true
        graph_span: 23h
        header:
          colorize_states: true
          show: true
          show_states: true
          standard_format: false
          title: Top 15 Entities
        series:
        - curve: stepline
          data_generator: "const noon = new Date()\nnoon.setHours(0, 0, 0, 0)\nconst\
            \ counts = entity.attributes.counts.split(';');\nconst name = entity.attributes.entity_ids.split(';');\n\
            const data = [];\nfor(let i = 0; i < counts.length; i++) {\n  data.push([noon.getTime()\
            \ + i * 1000 * 3600, counts[i]])\n}\nreturn data;\n"
          entity: sensor.top_15_entites
          extend_to: false
          show:
            in_header: false
            legend_value: false
            name_in_header: false
          stroke_width: 3
          type: column
        span:
          start: day
        type: custom:apexcharts-card
      - content: '* {{ state_attr(''sensor.top_15_entites'',''entity_ids'').replace('';'',''\n
          * '') }}'
        type: markdown
      - double_tap_action:
          action: none
        hold_action:
          action: none
        icon: mdi:update
        primary: Update Top 15 Entites
        secondary: ''
        tap_action:
          action: perform-action
          data:
            entity_id:
            - sensor.top_15_entites
          perform_action: homeassistant.update_entity
          target: {}
        type: custom:mushroom-template-card
      type: vertical-stack
      visibility:
      - condition: user
        users: []
    - elements:
      - entity: switch.esp32relayboard_relay1
        icon: mdi:lightbulb
        state_color: true
        style:
          left: 15%
          top: 15%
        tap_action:
          action: toggle
        title: R1
        type: state-icon
      - entity: switch.esp32relayboard_relay5
