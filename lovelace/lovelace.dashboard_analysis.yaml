config:
  views:
  - badges: []
    cards:
    - cards:
      - double_tap_action:
          action: more-info
        entity: input_boolean.show_cudy_router_details
        features_position: bottom
        hold_action:
          action: more-info
        icon: ''
        primary: '{{ time_since(now() - timedelta(seconds=(states(''sensor.cudy_router_betriebszeit'')
          | int(0))), 2) }}'
        secondary: 'Cudy Uptime '
        tap_action:
          action: toggle
        type: custom:mushroom-template-card
        vertical: true
      - card:
          cards:
          - cards:
            - align_header: center
              align_state: center
              cache: true
              decimals: 2
              entities:
              - sensor.cudy_router_upload_geschwindigkeit
              font_size: 65
              hour24: true
              hours_to_show: 24
              line_width: 2
              name: Upload
              points_per_hour: 10
              show:
                icon: false
                labels: false
                points: false
              type: custom:mini-graph-card
            - align_header: center
              align_state: center
              cache: true
              decimals: 2
              entities:
              - sensor.cudy_router_download_geschwindigkeit
              font_size: 65
              hour24: true
              hours_to_show: 24
              line_width: 2
              name: Download
              points_per_hour: 10
              show:
                icon: false
                labels: false
                points: false
              type: custom:mini-graph-card
            type: horizontal-stack
          - cards:
            - aggregate_func: diff
              align_header: center
              align_state: center
              cache: true
              decimals: 2
              entities:
              - sensor.cudy_data_sent_daily
              font_size: 65
              group_by: hour
              hour24: true
              hours_to_show: 24
              line_width: 2
              name: Upload (Daily)
              points_per_hour: 10
              show:
                icon: false
                labels: false
                points: false
              type: custom:mini-graph-card
            - aggregate_func: diff
              align_header: center
              align_state: center
              cache: true
              decimals: 2
              entities:
              - sensor.cudy_data_received_daily
              font_size: 65
              group_by: hour
              hour24: true
              hours_to_show: 24
              line_width: 2
              name: Download (Daily)
              points_per_hour: 10
              show:
                icon: false
                labels: false
                points: false
              type: custom:mini-graph-card
            type: horizontal-stack
          type: vertical-stack
        conditions:
        - entity: input_boolean.show_cudy_router_details
          state: 'on'
        type: conditional
      type: vertical-stack
    - cards:
      - double_tap_action:
          action: more-info
        entity: input_boolean.show_server_details
        fill_container: true
        hold_action:
          action: more-info
        icon: ''
        layout: vertical
        primary: '{{ time_since(as_datetime(states(''sensor.system_monitor_letzter_start'')),
          2)}}'
        secondary: 'Server Uptime '
        tap_action:
          action: toggle
        type: custom:mushroom-template-card
      - card:
          cards:
          - bar_size: large
            entity: sensor.system_monitor_prozessornutzung
            layout: horizontal
            name: CPU %
            show_more_info: true
            theme: cpu
            type: custom:entity-progress-card
            unit: '%'
          - bar_size: large
            decimal: 0
            entity: sensor.system_monitor_prozessortemperatur
            layout: horizontal
            name: "CPU \xB0C"
            show_more_info: true
            theme: temperature
            type: custom:entity-progress-card
            unit: "\xB0C"
          - bar_size: large
            decimal: 0
            entity: sensor.system_monitor_speicherauslastung
            layout: horizontal
            max_value: 16384
            name: RAM
            show_more_info: true
            theme: memory
            type: custom:entity-progress-card
            unit: MB
          - bar_size: large
            decimal: 1
            entity: sensor.system_monitor_festplattennutzung_2
            icon: mdi:harddisk
            layout: horizontal
            name: ROM
            show_more_info: true
            type: custom:entity-progress-card
            unit: '%'
          type: vertical-stack
        conditions:
        - entity: input_boolean.show_server_details
          state: 'on'
        type: conditional
      type: vertical-stack
    - cards:
      - entity: input_boolean.show_ha_uptime
        fill_container: true
        icon: ''
        layout: vertical
        primary: '{{ time_since(as_datetime(states(''sensor.uptime'')), 2) }}'
        secondary: 'Homeassistent Uptime '
        tap_action:
          action: toggle
        type: custom:mushroom-template-card
      - card:
          align_header: center
          align_state: center
          entities:
          - sensor.entities
          font_size: 60
          hour24: true
          hours_to_show: 24
          line_width: 2
          points_per_hour: 1
          show:
            fill: fade
            icon: false
            labels: false
            points: false
          type: custom:mini-graph-card
        conditions:
        - entity: input_boolean.show_ha_uptime
          state: 'on'
        type: conditional
      type: vertical-stack
    - cards:
      - entity: input_boolean.show_mariadb_graphs
        features_position: bottom
        primary: '{% set rows = states(''sensor.maria_db_rows'') | int(0) %} {{ ((states(''sensor.maria_db_size'')
          | float(0)) * 1000000) | filesizeformat() }} @ {{ ''{:,.3f}''.format(rows
          / 1000).replace('','', ''.'') }} Rows @ {{ states(''sensor.db_purges_success_rate'',
          with_unit=true) }} Purge Success'
        secondary: 'Maria DB Size '
        tap_action:
          action: toggle
        type: custom:mushroom-template-card
        vertical: true
      - card:
          cards:
          - align_header: center
            align_state: center
            entities:
            - entity: sensor.maria_db_size
              name: Maria DB Size
            font_size: 65
            hours_to_show: 96
            line_width: 2
            points_per_hour: 2
            show:
              fill: fade
              icon: false
              labels: true
              points: hover
            type: custom:mini-graph-card
          - align_header: center
            align_state: center
            entities:
            - entity: sensor.maria_db_rows
              name: Maria DB Rows
            font_size: 65
            hours_to_show: 96
            line_width: 2
            points_per_hour: 2
            show:
              fill: fade
              icon: false
              labels: true
              points: hover
            type: custom:mini-graph-card
          - cards:
            - align_header: center
              align_state: center
              entities:
              - entity: sensor.mariadb_cpu_prozent
                name: Maria DB Cpu Usage
              font_size: 65
              hours_to_show: 48
              line_width: 2
              points_per_hour: 1
              show:
                fill: fade
                icon: false
                labels: true
                points: hover
              type: custom:mini-graph-card
            - align_header: center
              align_state: center
              entities:
              - entity: sensor.mariadb_arbeitsspeicher_in_prozent
                name: Maria DB Ram Usage
              font_size: 65
              hours_to_show: 48
              line_width: 2
              points_per_hour: 1
              show:
                fill: fade
                icon: false
                labels: true
                points: hover
              type: custom:mini-graph-card
            type: horizontal-stack
          - cards:
            - entity: counter.db_purge_success
              features_position: bottom
              show_entity_picture: false
              type: tile
              vertical: false
            - entity: sensor.db_purges_success_rate
              features_position: bottom
              icon: mdi:percent
              name: Success Rate
              show_entity_picture: false
              type: tile
              vertical: false
            - entity: counter.db_purge_failure
              features_position: bottom
              show_entity_picture: false
              type: tile
              vertical: false
            type: horizontal-stack
          - entities:
            - entity: counter.db_purge_success
              show_state: true
            - entity: counter.db_purge_failure
              show_state: true
            hours_to_show: 24
            line_width: 2
            points_per_hour: 100
            show:
              fill: false
              graph: line
            type: custom:mini-graph-card
          type: vertical-stack
        conditions:
        - entity: input_boolean.show_mariadb_graphs
          state: 'on'
        type: conditional
      type: vertical-stack
    - cards:
      - entity: input_boolean.show_mqtt_details
        features_position: bottom
        icon: ''
        primary: '{{ time_since(now() - timedelta(days=states(''sensor.mqtt_stats_uptime'')|float(0)),
          2)}}'
        secondary: 'MQTT Uptime '
        tap_action:
          action: toggle
        type: custom:mushroom-template-card
        vertical: true
      - card:
          cards:
          - cards:
            - entity: sensor.mqtt_stats_bytes_received
              fill_container: true
              icon: mdi:call-received
              layout: vertical
              primary: '{{ states(''sensor.mqtt_stats_bytes_received'') | filesizeformat()
                }}'
              secondary: ''
              tap_action:
                action: more-info
              type: custom:mushroom-template-card
            - entity: sensor.mqtt_stats_bytes_sent
              fill_container: true
              icon: mdi:call-made
              layout: vertical
              primary: '{{ states(''sensor.mqtt_stats_bytes_sent'') | filesizeformat()
                }}'
              secondary: ''
              tap_action:
                action: more-info
              type: custom:mushroom-template-card
            type: horizontal-stack
          - aggregate_func: diff
            align_header: center
            entities:
            - entity: sensor.mqtt_stats_messages_received
              name: Received
              show_state: true
            - entity: sensor.mqtt_stats_messages_sent
              name: Sent
              show_state: true
              show_unit: false
            group_by: hour
            height: 100
            hour24: true
            hours_to_show: 48
            name: 'Messages: Received / Sent'
            points_per_hour: 10
            show:
              icon: false
              labels: false
              legend: false
            type: custom:mini-graph-card
            unit: ' '
          type: vertical-stack
        conditions:
        - condition: state
          entity: input_boolean.show_mqtt_details
          state: 'on'
        type: conditional
      type: vertical-stack
    - cards:
      - double_tap_action:
          action: call-service
          service: script.1707895746671
          target: {}
        entity: input_boolean.show_speedtest_details
        fill_container: true
        icon: ''
        layout: vertical
        primary: '{% set unavailable = is_state(''sensor.speedtest_download'',''unknown'')
          %} {% set text = "Ping: " + states(''sensor.speedtest_ping'') + "ms, " +
          states(''sensor.speedtest_upload'') + " Mbps, " + states(''sensor.speedtest_download'')
          + " Mbps" %} {{ "" if unavailable else text }}'
        secondary: '{% set script = is_state(''script.1707895746671'',''on'') %} {%
          set unavailable = is_state(''sensor.speedtest_download'',''unknown'') %}
          {% set last_run = states(''sensor.speedtest_last_run'') %} {{ "Start SpeedTest,
          Last: " + last_run + " ago" if not script else ("Testing" if unavailable
          else "Wrapping up") }}'
        tap_action:
          action: toggle
        type: custom:mushroom-template-card
      - card:
          cards:
          - cards:
            - align_header: center
              align_state: center
              cache: true
              decimals: 2
              entities:
              - sensor.speedtest_upload
              - entity: sensor.upload_avg_24h
              font_size: 65
              hour24: true
              hours_to_show: 24
              line_width: 2
              name: Upload
              points_per_hour: 30
              show:
                average: true
                extrema: true
                icon: false
                labels: false
                legend: false
                points: false
              type: custom:mini-graph-card
            - align_header: center
              align_state: center
              cache: true
              decimals: 2
              entities:
              - sensor.speedtest_download
              - entity: sensor.download_avg_24h
              font_size: 65
              hour24: true
              hours_to_show: 24
              line_width: 2
              name: Download
              points_per_hour: 30
              show:
                average: true
                extrema: true
                icon: false
                labels: false
                legend: false
                points: false
              type: custom:mini-graph-card
            type: horizontal-stack
          type: vertical-stack
        conditions:
        - entity: input_boolean.show_speedtest_details
          state: 'on'
        type: conditional
      type: vertical-stack
    - content: "{% set x = ['unavailable','unknown'] %}\n<details>\n{%- for d in states|groupby('domain')\
        \ %}\n  {% if loop.first %} \n  <summary><b>Domains: {{loop.length}}</b> </summary>\n\
        \  {% endif %}\n  <details>\n  <summary>{{- d[0] | title }}: <b>{{states[d[0]]|rejectattr('state','in',x)|list|count}}</b></summary>\n\
        \  {% for i in d[1] if i.state not in x -%}\n  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;-\
        \ {{i.name}}: <b>{{i.state}}</b><br>\n  {% endfor %}\n  </details>\n{%- endfor\
        \ -%}\n</details>"
      type: markdown
    - entity: sensor.backup_state
      fill_container: true
      icon: mdi:clipboard-check-multiple-outline
      layout: vertical
      multiline_secondary: true
      primary: 'Last Backup Size: {{ state_attr(''sensor.backup_state'', ''backups'')[-1][''size'']
        }}'
      secondary: '{% set uptime = (now().timestamp() - as_timestamp(state_attr(''sensor.backup_state'',
        ''backups'')[-1][''date''])) %}

        {% set months = (uptime % 31536000) // 2592000 %}

        {% set days = (uptime % 2592000) // 86400 %}

        {% set hours = (uptime % 86400) // 3600 %}

        {% set minutes = (uptime % 3600) // 60 %}

        {% set percent = state_attr(''sensor.backup_state'', ''backups'')[-1][''state'']
        %}

        Last Backup {{ ''%dm '' % months if months else '''' }}{{ ''%dd '' % days
        if days else '''' }}{{ ''%dh '' % hours if hours else '''' }}{{ ''%dm'' %
        minutes if minutes else '''' }} ago

        State: {{ "Uploaded" if percent == "Drive Only" else percent }}

        Total Space in Google Drive: {{state_attr(''sensor.backup_state'', ''size_in_google_drive'')}}

        Total Backups in Google Drive: {{state_attr(''sensor.backup_state'', ''backups_in_google_drive'')}}'
      tap_action:
        action: more-info
      type: custom:mushroom-template-card
    - entity: sensor.onedrivefilesync
      fill_container: true
      icon: ''
      layout: vertical
      multiline_secondary: true
      primary: 'Onedrive Filesync:

        {% set status_backup = states(''sensor.onedrivefilesync'') | string %}

        {% set percent = state_attr(''sensor.onedrivebackup'', ''Current file upload
        percentage'') %}

        {% set speed = state_attr(''sensor.onedrivebackup'',''Current file upload
        speed (KB/s)'')%}

        {{ "Uploaded" if status_backup == "Synced" else "Syncing" }}'
      secondary: ''
      tap_action:
        action: more-info
      type: custom:mushroom-template-card
    - color: blue
      entity: sensor.tibber_node_battery_voltage
      features_position: bottom
      icon: mdi:pulse
      multiline_secondary: false
      primary: 'Tibber Pulse Uptime: {{ state_attr(''sensor.tibber_node_battery_voltage'',''uptime_human'')|
        replace('' days'',''d'') | replace('' hours'',''h'') | replace('' minutes'',''m'')
        | replace('' month'',''m'') | replace(''months'',''m'') }}'
      secondary: '{{ states(''sensor.tibber_node_battery_voltage'', with_unit=True)
        }}'
      tap_action:
        action: more-info
      type: custom:mushroom-template-card
      vertical: true
    - entity: todo.to_do_duncan
      hide_completed: true
      type: todo-list
    - cards:
      - entity: sensor.home_assistant_beta_release_notes
        tap_action:
          action: perform-action
          perform_action: input_button.press
          target:
            entity_id: input_button.update_beta_release_notes
        type: custom:mushroom-entity-card
      - content: '## [Beta Release]({{ state_attr(''sensor.home_assistant_beta_release_notes'',''beta_url'')}}):
          {{states(''sensor.home_assistant_beta_release_notes'')}}

          {{ state_attr("sensor.home_assistant_beta_release_notes","ai_summary")

          }}'
        type: markdown
      type: vertical-stack
    - card_mod:
        style:
          ha-markdown:
            $: "ha-markdown-element:first-of-type hr{\n  border-color: #303030;\n\
              }\n"
      content: '<h2> <img src="https://brands.home-assistant.io/watchman/icon.png"
        alt="WM Logo" width="32" height="32"> Watchman report</h2> <h3>Missing Entities:
        {{ states.sensor.watchman_missing_entities.state }} </h3> {%- for item in
        state_attr("sensor.watchman_missing_entities", "entities") %} <hr> <table><tr>
        <td> <ha-icon icon=''mdi:{%- if item.state=="missing"-%}cloud-alert'' {%-
        elif item.state=="unavail" -%}cloud-off-outline'' {%- else-%}cloud-question''
        {%- endif -%} ></ha-icon> {{ item.id }} [{{item.state}}] <a title="{{item.occurrences}}">
        {{item.occurrences.split(''/'')[-1]}}</a> </td></tr></table> {%- endfor %}'
      type: markdown
    - collapsed_sections:
      - switches
      device_id: f25566ea435365c5d4c37837584d186c
      exclude_sections:
      - actions
      pause_durations:
      - 60s
      - 5m
      - 15m
      switch_spacing: space-between
      type: custom:adguard-card
    icon: mdi:home-analytics
    title: Analytics
    type: masonry
  - badges: []
    cards:
    - cards:
      - badges:
        - entity: sensor.openbk7231t_app_newest_version
          type: entity
        entity: input_boolean.show_open_beken_updates
        heading: Open Beken
        heading_style: title
        icon: mdi:fridge
        tap_action:
          action: toggle
        type: heading
      - card:
          type: entities
        filter:
          template: "{% set latest = states('sensor.openbk7231t_app_newest_version').lstrip('v')\
            \ %} {% for e in states.sensor if 'build' in e.entity_id %}\n  {% set\
            \ parts = e.state.split(' ') %}\n  {% if parts | length > 1 %}\n    {%\
            \ set device_version = parts[1] %}\n    {% if device_version != latest\
            \ %}\n      {{ e.entity_id }}\n    {% endif %}\n  {% endif %}\n{% endfor\
            \ %}\n"
        sort:
          method: state
        type: custom:auto-entities
        visibility:
        - condition: state
          entity: input_boolean.show_open_beken_updates
          state: 'on'
      type: vertical-stack
    - cards:
      - badges:
        - entity: sensor.tasmota_newest_version
          tap_action:
            action: more-info
          type: entity
        entity: input_boolean.show_tasmota_updates
        heading: Tasmota
        heading_style: title
        icon: mdi:fridge
        tap_action:
          action: toggle
        type: heading
      - card:
          type: entities
        filter:
          template: '{% set latest = states(''sensor.tasmota_newest_version'').lstrip(''v'')
            %} {% for e in states.sensor %} {% if ''firmware_version'' in e.entity_id
            and not e.state.startswith(latest) %} {{ e.entity_id }} {% endif %} {%
            endfor %}

            '
        sort:
          method: state
        type: custom:auto-entities
        visibility:
        - condition: state
          entity: input_boolean.show_tasmota_updates
          state: 'on'
      - content: '{{ state_attr(''sensor.tasmota_newest_version'',''body'')}}'
        type: markdown
        visibility:
        - condition: state
          entity: input_boolean.show_tasmota_updates
          state: 'on'
      type: vertical-stack
    icon: mdi:power-socket-de
    path: tasmota
    subview: false
    title: Tasmota
  - badges: []
    cards: []
    icon: mdi:battery
    max_columns: 2
    path: batterys
    sections:
    - cards:
      - card:
          columns: 1
          square: false
          type: grid
        card_param: cards
        filter:
          include:
          - entity_id: sensor.*_battery_plus
            options:
              bar_color: "{% set level = states(entity) | int %} {% if level > 80\
                \ %}\n linear-gradient(90deg, lightgreen, green)\n{% elif level >\
                \ 20 %}\n linear-gradient(90deg, yellow, orange)\n{% else %}\n linear-gradient(90deg,\
                \ orange, red)\n{% endif %}"
              color: "{% set level = states(entity) | int %} {% if level < 30 %}\n\
                \ red\n{% elif level < 60 %}\n orange\n{% else %}\n green\n{% endif\
                \ %}"
              icon: "{% if states(entity) | int > 50 %}\n  mdi:battery-high\n{% else\
                \ %}\n  mdi:battery-low\n{% endif %}"
              name: '{{ entity | replace(''zigbee'','''') | replace(''battery_plus'','''')|
                replace(''sensor.'','''')| replace(''_'','' '') | title }}: {{ states(entity)
                }}%'
              percent: '{{ states(entity) }}'
              secondary: '{{ states(entity|replace(''plus'',''type''))}}'
              tap_action:
                action: more-info
              type: custom:entity-progress-card-template
        show_empty: false
        sort:
          ignore_case: true
          method: state
          numeric: true
        type: custom:auto-entities
      type: grid
    - cards:
      - card_mod:
          style:
            ha-markdown$: 'table { width: 100%; border-collapse: separate; border-spacing:
              0px; } tbody tr:nth-child(2n+1) { background-color: var(--table-row-background-color);
              } thead tr th, tbody tr td {padding: 4px 10px; }

              '
        content: "{% set ns_batteries = namespace(batteries={}) %}\n{% for entity_id\
          \ in integration_entities('battery_notes') if entity_id is search('_battery_type$',\
          \ ignorecase=False) -%}\n    {% set battery_raw = states[entity_id].state\
          \ %}\n    \n    {# Support both \xD7 and x as multipliers #}\n    {% if\
          \ \"\xD7\" in battery_raw %}\n        {% set battery_split = battery_raw.split(\"\
          \xD7\") %}\n    {% elif \"x\" in battery_raw %}\n        {% set battery_split\
          \ = battery_raw.split(\"x\") %}\n    {% else %}\n        {% set battery_split\
          \ = [battery_raw] %}\n    {% endif %}\n    \n    {% if battery_split | length\
          \ > 1 %}\n        {% set battery_count = battery_split[0] | trim | int(1)\
          \ %}\n        {% set battery_type = battery_split[1] | trim | upper %}\n\
          \    {% else %}\n        {% set battery_count = 1 %}\n        {% set battery_type\
          \ = battery_split[0] | trim | upper %}\n    {% endif %}\n    \n    {% if\
          \ battery_type not in ns_batteries.batteries %}\n        {% set ns_batteries.batteries\
          \ = dict(ns_batteries.batteries, **{battery_type: battery_count}) %}\n \
          \   {% else %}\n        {% set ns_batteries.batteries = dict(ns_batteries.batteries,\
          \ **{battery_type: ns_batteries.batteries[battery_type] + battery_count})\
          \ %}\n    {% endif %}\n{% endfor %}\n\n| Type | Count |\n| :-- | --: |\n\
          {% for bt in ns_batteries.batteries | dictsort(False, 'value') | reverse\
          \ -%}\n  | {{ bt[0] }} | {{ bt[1] }} |\n{% endfor %}\n\n---\n\n**Total**:\
          \ {{ ns_batteries.batteries.values() | sum }}"
        title: Battery Summary
        type: markdown
      - cards:
        - entities:
          - entity: input_text.batterie_suche
            icon: mdi:magnify
            name: Search by battery type
            secondary_info: none
          state_color: false
          type: entities
        - content: "{% set search_term = states('input_text.batterie_suche') %}\n\
            {% set devices = states\n   | selectattr('entity_id', 'search', '_battery_plus$')\n\
            \   | selectattr('attributes.battery_type_and_quantity', 'defined')\n\
            \   | list %}\n\n{% set ns = namespace(buffer=[]) %}\n\n{% for device\
            \ in devices %}\n  {% set bt_raw = device.attributes.battery_type_and_quantity\
            \ | replace('\xD7','x') %}\n  {% if search_term == \"\" or search_term|lower\
            \ in bt_raw|lower %}\n    {% set lvl = device.state | int(0) %}\n    {%\
            \ set entry = {\n      'type': bt_raw,\n      'lvl': lvl,\n      'line':\
            \ bt_raw ~ ': ' ~ device.name ~ ': ' ~ device.state ~ '%',\n      'sort_key':\
            \ bt_raw ~ '-' ~ (\"%03d\"|format(lvl))\n    } %}\n    {% set ns.buffer\
            \ = ns.buffer + [ entry ] %}\n  {% endif %}\n{% endfor %}\n\n{% if ns.buffer\
            \ | length > 0 %}\n  {% if search_term != \"\" %}\n    {{ ns.buffer\n\
            \       | sort(attribute='lvl')\n       | map(attribute='line')\n    \
            \   | list\n       | join('\\n') }}\n  {% else %}\n    {{ ns.buffer\n\
            \       | sort(attribute='sort_key')\n       | map(attribute='line')\n\
            \       | list\n       | join('\\n') }}\n  {% endif %}\n{% else %}\n \
            \ Keine Ger\xE4te gefunden.\n{% endif %}"
          type: markdown
        type: vertical-stack
