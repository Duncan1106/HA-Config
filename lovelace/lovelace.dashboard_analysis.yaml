    sections:
    - cards:
      - content: "~~~~\nI want you to act as a Home Assistant Documentation Expert.\n\
          \nI will provide YAML for an automation. Your task is to generate a high-quality,\n\
          professional Markdown description suitable for the Home Assistant automation\n\
          description field.\n\n### Structural Requirements\n\n1. **Header & Intro**\n\
          \   - Start with a single relevant emoji and a **bold title**\n   - Follow\
          \ with a section titled: `\U0001F4CB Intelligent [System Name] Control`\n\
          \   - Explain:\n     - High-level intent\n     - Operational strategy (e.g.\
          \ solar-based, safety-first)\n     - Reliability mechanisms (e.g. retry\
          \ scripts)\n\n2. **Trigger Overview Table**\n   - Markdown table with columns:\n\
          \     - Type\n     - Entity / Condition\n     - ID\n     - Purpose\n   -\
          \ Translate technical triggers into human-readable goals\n   - Do not invent\
