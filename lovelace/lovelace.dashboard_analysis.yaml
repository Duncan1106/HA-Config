        - content: "{% set view = states('input_select.select_view_for_labels') %}\
            \ {% set day = view.split(' ')[0] %} {% set target = 'retention_' ~ day\
            \ ~ 'd' %} {% set all_retention = labels() | select('match', '^retention_')\
            \ | list %}\n{# --- 1. POOL GENERATION --- #} {% set device_ents = label_devices(target)\
            \ | map('device_entities') | sum(start=[]) %} {% set raw_pool = (label_entities(target)\
            \ + device_ents) | unique | list %}\n{# --- 2. VALIDATION WITH OVERRIDE\
            \ LOGIC --- #} {% set ns = namespace(final_ents=[]) %} {% for ent_id in\
            \ raw_pool %}\n  {% if has_value(ent_id) %}\n    {% set ent_retention\
            \ = labels(ent_id) | select('in', all_retention) | list %}\n    {% if\
            \ ent_retention | count > 0 %}\n      {% if target in ent_retention %}\n\
            \        {% set ns.final_ents = ns.final_ents + [ent_id] %}\n      {%\
