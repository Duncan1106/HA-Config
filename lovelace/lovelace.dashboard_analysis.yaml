  - cards: []
    icon: mdi:text-box-outline
    max_columns: 1
    path: documentation-help
    sections:
    - cards:
      - content: "~~~~\nI want you to act as a Home Assistant Documentation Expert.\n\
          \nI will provide YAML for an automation. Your task is to generate a high-quality,\n\
          professional Markdown description suitable for the Home Assistant automation\n\
          description field.\n\n### Structural Requirements\n\n1. **Header & Intro**\n\
          \   - Start with a single relevant emoji and a **bold title**\n   - Follow\
          \ with a section titled: `\U0001F4CB Intelligent [System Name] Control`\n\
          \   - Explain:\n     - High-level intent\n     - Operational strategy (e.g.\
          \ solar-based, safety-first)\n     - Reliability mechanisms (e.g. retry\
          \ scripts)\n\n2. **Trigger Overview Table**\n   - Markdown table with columns:\n\
          \     - Type\n     - Entity / Condition\n     - ID\n     - Purpose\n   -\
          \ Translate technical triggers into human-readable goals\n   - Do not invent\
          \ triggers or logic not present in the YAML\n\n3. **Operational Logic Sections**\n\
          \   - Use `####` headers for each operational mode (e.g. Daytime, Night,\
          \ Emergency)\n   - For each mode include:\n     - **Purpose**\n     - **Logic\
          \ Overview** (conditions required, summarized)\n     - **Effect** (entities\
          \ switched, variables affected)\n\n4. **Technical Overview**\n   - Automation\
          \ **Mode**\n   - **Execution method** (scripts used)\n   - **Key Inputs**\n\
          \   - **Controlled Entities**\n   - **Safety Mechanisms**\n\n5. **\U0001F4A1\
          \ Notes**\n   - Highlight clever logic, fail-safes, and rationale behind\
          \ thresholds\n   - Avoid speculation or invented reasoning\n\n### Tone &\
          \ Formatting\n- Professional, clean, and technical\n- Bold entity names,\
          \ states, and key values\n- Use horizontal rules (`---`) between major sections\n\
          - Limit emojis to section headers only\n\n### Output Requirements\n- Output\
          \ **only** the final documentation\n- Wrap everything in a **single Markdown\
          \ code block**\n- Do not include commentary or analysis\n\n### YAML Input\n\
          ~~~~"
        type: markdown
      type: grid
    title: Documentation Help
    type: sections
  - cards:
    - content: "{%- set x = ['unavailable','unknown'] -%}\n{%- set ignore_int = ['Planta']\
        \ -%}\n\n{# Calculate totals for the top header #}\n{%- set totals = namespace(entities=0,\
        \ devices=[]) -%}\n{%- for i in states if i.state not in x -%}\n  {%- set\
        \ c_id = config_entry_id(i.entity_id) -%}\n  {%- set c_title = config_entry_attr(c_id,\
        \ 'title') if c_id else none -%}\n  \n  {%- if c_title not in ignore_int -%}\n\
        \    {%- set totals.entities = totals.entities + 1 -%}\n    {%- set d_id =\
        \ device_id(i.entity_id) -%}\n    {%- if d_id -%}\n      {%- set totals.devices\
        \ = totals.devices + [d_id] -%}\n    {%- endif -%}\n  {%- endif -%}\n{%- endfor\
        \ -%}\n\n{%- set total_devices = totals.devices | unique | list | count -%}\n\
        \n{%- for d in states | groupby('domain') -%}\n  {%- if loop.first -%} \n\
        \    <details>\n      <summary>\n        <b>Domains: {{loop.length}} ({{ total_devices\
        \ }} Devices / {{ totals.entities }} Entities)</b>\n      </summary>\n  {%-\
        \ endif -%}\n   \n   {%- set items = namespace(visible=[]) -%}\n   {%- for\
        \ i in d[1] if i.state not in x -%}\n     {%- set c_id = config_entry_id(i.entity_id)\
        \ -%}\n     {%- set c_title = config_entry_attr(c_id, 'title') if c_id else\
        \ none -%}\n     {%- if c_title not in ignore_int -%}\n       {%- set items.visible\
        \ = items.visible + [i] -%}\n     {%- endif -%}\n   {%- endfor -%}\n\n   {%-\
        \ set entity_count = items.visible | count -%}\n\n   {%- if entity_count >\
        \ 0 -%}\n   <details>\n    <summary>{{ d[0] | title }}: <b>{{ entity_count\
        \ }}</b></summary>\n    {%- for i in items.visible -%}\n      {{- i.name -}}:\
        \ <b>{{- i.state -}}</b><br>\n    {%- endfor -%}\n   </details>\n   {%- endif\
        \ -%}\n{%- endfor -%}\n</details>"
      type: markdown
    max_columns: 4
    path: test
    sections:
    - cards:
      - content: "{%- set x = ['unavailable', 'unknown'] -%}\n{%- set ignore_int =\
          \ ['Planta'] -%}\n\n{# Single-pass filtering & counting #}\n{%- set ns =\
          \ namespace(entities=[], devices=[]) -%}\n{%- for i in states if i.state\
          \ not in x -%}\n  {%- set c_id = config_entry_id(i.entity_id) -%}\n  {%-\
          \ set c_title = config_entry_attr(c_id, 'title') if c_id else none -%}\n\
          \  {%- if c_title not in ignore_int -%}\n    {%- set ns.entities = ns.entities\
          \ + [i] -%}\n    {%- set d_id = device_id(i.entity_id) -%}\n    {%- if d_id\
          \ -%}\n      {%- set ns.devices = ns.devices + [d_id] -%}\n    {%- endif\
          \ -%}\n  {%- endif -%}\n{%- endfor -%}\n\n{%- set total_entities = ns.entities\
          \ | count -%}\n{%- set total_devices = ns.devices | unique | list | count\
          \ -%}\n{%- set domains = ns.entities | groupby('domain') -%}\n\n<details>\n\
          <summary>\n  <b>Domains: {{ domains | count }} ({{ total_devices }} Devices\
          \ / {{ total_entities }} Entities)</b>\n</summary>\n\n{%- for d in domains\
          \ -%}\n  {%- set domain_name = d[0] -%}\n  {%- set items = d[1] -%}\n  <details>\n\
          \    <summary>{{ domain_name | title }}: <b>{{ items | count }}</b></summary>\n\
          \    {%- for i in items -%}\n      {{ i.name }}: <b>{{ i.state }}</b><br>\n\
          \    {%- endfor -%}\n  </details>\n{%- endfor -%}\n</details>"
        type: markdown
      - type: custom:ha-trace-viewer
