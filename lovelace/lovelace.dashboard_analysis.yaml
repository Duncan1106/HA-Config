              \ 'zone', 'input_number', 'input_boolean', 'input_datetime', 'input_button',\
              \ 'notify'] -%}\n\n  {# 3. Regex: Matches wachstumsmedium AND any scheduled\
              \ (geplante/geplantes) attributes #}\n  {%- set exclude_pattern = '^(sensor\\\
              ..*_(wachstumsmedium|geplante_.*|geplantes_.*).*|sensor\\.known_power|sensor\\\
              .known_energy|sensor\\.unmonitored|sensor\\.unmonitored_consumption|sensor\\\
              .exclude_from_power_ranking|sensor\\.power_consumption_ranking|sensor\\\
              .grid_import|sensor\\.grid_export|sensor\\.grid_export_negative|sensor\\\
              .smart_meter_mqtt_data|sensor\\.grid_consumption|sensor\\.grid_production|sensor\\\
              .smart_meter_mqtt_grid_power|sensor\\.tibber_bridge_0100100700ff|sensor\\\
              .energy_summary_1st_block|sensor\\.energy_summary_1st_block_2|sensor\\\
              .appliance_used|sensor\\.tavascan_remaining_charging_time|sensor\\.zoe_remaining_charging_time|sensor\\\
              .tavascan_status|sensor\\.zoe_status|sensor\\.mg4_status|sensor\\.total_print_time|sensor\\\
              .remaining_time|sensor\\.elapsed_time|sensor\\.finish_time|sensor\\\
              .wind_direction|sensor\\.speedtest_last_run|sensor\\.solar_forecast_text_tomorrow|sensor\\\
              .solar_forecast_text_today|sensor\\.boiler_remaining_time|sensor\\..*uptime.*|sensor\\\
              .herd_ct_klemme_zigbee_power_a|sensor\\.herd_ct_klemme_zigbee_power_b|sensor\\\
              .system_monitor_letzter_start|sensor\\.go_echarger_252682_nrg|sensor\\\
              .go_echarger_270862_nrg|automation\\.publish_to_mqtt_grid_export|sensor\\\
              .stephans_iphone_next_update|sensor\\.enyas_iphone_next_update|sensor\\\
              .stephans_iphone_travel_time_hhmm|sensor\\.enyas_iphone_travel_time_hhmm|sensor\\\
              .stephans_iphone_arrival_time|sensor\\.enyas_iphone_arrival_time|sensor\\\
              .enyas_iphone_last_update|sensor\\.enyas_iphone_last_located|sensor\\\
              .stephans_iphone_last_located|sensor\\.stephans_iphone_last_update|sensor\\\
              .enyas_iphone_info|sensor\\.stephans_iphone_info|sensor\\.papa_to_arbeit_travel_time|binary_sensor\\\
              .show_papa_travel_dashboard|sensor\\.forecast_text|sensor\\.remainingtototalforecast|automation\\\
              .15s_ping_update|sensor\\.pool_pumpe_energy_power|sensor\\.stadt_rauenberg_vorwarnstufe|sensor\\\
              .stadt_rauenberg_aktuelle_warnstufe|sensor\\.evs_home_and_ready_to_charge|sensor\\\
              .issues|sensor\\.ignored_issues|sensor\\.active_issues|sensor\\.icloud3_event_log|sensor\\\
              .icloud3_wazehist_track|sensor\\.kellervorrate_combined_filtered_items|sensor\\\
              .kellervorrate_combined_filtered_items_hash|switch\\.153931628718174_prompt_tone|sensor\\\
              .home_assistant_beta_release_notes|sensor\\.cudy_data_sent|sensor\\\
              .cudy_data_received|sensor\\.cudy_router_betriebszeit|sensor\\.dreamebot_d10_plus_.*|sensor\\\
              .d9_max_white_.*|sensor\\.dwd_weather_warnings_.*|sensor\\.192_168_2_205_.*|sensor\\\
              ..*_rssi|sensor\\..*signal|sensor\\..*_signal_db|sensor\\.1st_max.*|sensor\\\
              .2nd_max_.*|sensor\\.m2101k6g.*|sensor\\.m2010j19cg.*|sensor\\.24069pc21g.*|sensor\\\
              .redmi_note_8t.*|sensor\\.fp4.*|sensor\\.mi_9t.*|sensor\\.poco_f6_.*|sensor\\\
              .iphone_von_.*|sensor\\..*_firmware_version|sensor\\..*build|sensor\\\
              .irauen33.*|sensor\\.localhost_.*|sensor\\..*uptime|sensor\\..*linkquality|sensor.everything_presence_lite_f1c0d0_*|sensor\\\
              .tasmota_newest_version|sensor\\.openbk7231t_app_newest_version|binary_sensor\\\
              .upcoming_birthdays|sensor\\.voltage_l.*|sensor\\.local_ip.*|switch\\\
              .schedule.*|.*\\.bodypetscale.*|.*(battery_plus|battery_type|battery_replaced|battery_last_replaced).*|sensor\\\
              ..*_pulse_status|binary_sensor\\..*_pulse_problem)$' -%}\n\n  {%- set\
              \ ns = namespace(final=[]) -%}\n  {%- for ent_state in states -%}\n\
              \    {%- set ent_id = ent_state.entity_id -%}\n    {%- if ent_state.domain\
              \ not in ignore_domains and not ent_id | regex_search(exclude_pattern)\
              \ -%}\n      {%- if ent_id not in covered_set -%}\n        {%- set ns.final\
              \ = ns.final + [ent_id] -%}\n      {%- endif -%}\n    {%- endif -%}\n\
              \  {%- endfor -%}\n  {{- ns.final -}}\n{%- else -%}\n  {%- set day =\
              \ view.split(' ')[0] -%}\n  {%- set target = 'retention_' ~ day ~ 'd'\
              \ -%}\n  {%- set device_ents = label_devices(target) | map('device_entities')\
              \ | sum(start=[]) -%}\n  {%- set raw_pool = (label_entities(target)\
              \ + device_ents) | unique | list -%}\n  {%- set ns = namespace(final=[])\
              \ -%}\n  {%- for ent_id in raw_pool -%}\n    {%- if has_value(ent_id)\
              \ -%}\n      {%- if not labels(ent_id) | select('in', all_retention)\
              \ | reject('eq', target) | list -%}\n        {%- set ns.final = ns.final\
              \ + [ent_id] -%}\n      {%- endif -%}\n    {%- endif -%}\n  {%- endfor\
              \ -%}\n  {{- ns.final -}}\n{%- endif -%}"
          show_empty: false
          type: custom:auto-entities
        type: vertical-stack
      type: grid
