config:
  views:
  - badges: []
    cards:
    - cards:
      - entity: input_boolean.show_cudy_router_details
        features_position: bottom
        hold_action:
          action: more-info
        icon: ''
        primary: '{{ time_since(now() - timedelta(seconds=(states(''sensor.cudy_router_betriebszeit'')
          | int(0))), 2) }}'
        secondary: Cudy Uptime
        tap_action:
          action: toggle
        type: custom:mushroom-template-card
        vertical: true
      - card:
          cards:
          - cards:
            - align_header: center
              align_state: center
              cache: true
              decimals: 2
              entities:
              - sensor.cudy_router_upload_geschwindigkeit
              font_size: 65
              hour24: true
              hours_to_show: 24
              line_width: 2
              name: Upload
              points_per_hour: 10
              show:
                icon: false
                labels: false
                points: false
              type: custom:mini-graph-card
            - align_header: center
              align_state: center
              cache: true
              decimals: 2
              entities:
              - sensor.cudy_router_download_geschwindigkeit
              font_size: 65
              hour24: true
              hours_to_show: 24
              line_width: 2
              name: Download
              points_per_hour: 10
              show:
                icon: false
                labels: false
                points: false
              type: custom:mini-graph-card
            type: horizontal-stack
          - cards:
            - aggregate_func: diff
              align_header: center
              align_state: center
              cache: true
              decimals: 2
              entities:
              - sensor.cudy_data_sent_daily
              font_size: 65
              group_by: hour
              hour24: true
              hours_to_show: 24
              line_width: 2
              name: Upload (Daily)
              points_per_hour: 10
              show:
                icon: false
                labels: false
                points: false
              type: custom:mini-graph-card
            - aggregate_func: diff
              align_header: center
              align_state: center
              cache: true
              decimals: 2
              entities:
              - sensor.cudy_data_received_daily
              font_size: 65
              group_by: hour
              hour24: true
              hours_to_show: 24
              line_width: 2
              name: Download (Daily)
              points_per_hour: 10
              show:
                icon: false
                labels: false
                points: false
              type: custom:mini-graph-card
            type: horizontal-stack
          - aggregate_func: diff
            align_header: center
            align_state: center
            cache: true
            decimals: 2
            entities:
            - sensor.cudy_data_total_monthly
            font_size: 65
            group_by: hour
            hour24: true
            hours_to_show: 24
            line_width: 2
            name: Total Data (Monthly)
            points_per_hour: 10
            show:
              icon: false
              labels: false
              points: false
            type: custom:mini-graph-card
          type: vertical-stack
        conditions:
        - entity: input_boolean.show_cudy_router_details
          state: 'on'
        type: conditional
      type: vertical-stack
    - cards:
      - entity: input_boolean.show_server_details
        features_position: bottom
        hold_action:
          action: more-info
        icon: ''
        primary: '{{ time_since(as_datetime(states(''sensor.system_monitor_letzter_start'')),
          2)}}'
        secondary: Server Uptime
        tap_action:
          action: toggle
        type: custom:mushroom-template-card
        vertical: true
      - card:
          cards:
          - bar_size: large
            entity: sensor.system_monitor_prozessornutzung
            layout: horizontal
            name: CPU %
            show_more_info: true
            theme: cpu
            type: custom:entity-progress-card
            unit: '%'
          - bar_size: large
            decimal: 0
            entity: sensor.system_monitor_prozessortemperatur
            layout: horizontal
            name: "CPU \xB0C"
            show_more_info: true
            theme: temperature
            type: custom:entity-progress-card
            unit: "\xB0C"
          - bar_size: large
            decimal: 0
            entity: sensor.system_monitor_speicherauslastung
            layout: horizontal
            max_value: 16384
            name: RAM
            show_more_info: true
            theme: memory
            type: custom:entity-progress-card
            unit: MB
          - bar_size: large
            decimal: 1
            entity: sensor.system_monitor_massenspeicher_auslastung
            icon: mdi:harddisk
            layout: horizontal
            name: ROM
            show_more_info: true
            type: custom:entity-progress-card
            unit: '%'
          - cards:
            - aggregate_func: diff
              align_header: center
              align_state: center
              cache: true
              decimals: 2
              entities:
              - sensor.netzwerkausgang_today
              font_size: 65
              group_by: hour
              hour24: true
              hours_to_show: 24
              line_width: 2
              name: Ausgang
              points_per_hour: 10
              show:
                icon: false
                labels: false
                points: false
              type: custom:mini-graph-card
            - aggregate_func: diff
              align_header: center
              align_state: center
              cache: true
              decimals: 2
              entities:
              - sensor.netzwerkeingang_today
              font_size: 65
              group_by: hour
              hour24: true
              hours_to_show: 24
              line_width: 2
              name: Eingang
              points_per_hour: 10
              show:
                icon: false
                labels: false
                points: false
              type: custom:mini-graph-card
            type: horizontal-stack
          type: vertical-stack
        conditions:
        - entity: input_boolean.show_server_details
          state: 'on'
        type: conditional
      type: vertical-stack
    - cards:
      - entity: input_boolean.show_ha_uptime
        features_position: bottom
        icon: ''
        primary: '{{ time_since(as_datetime(states(''sensor.uptime'')), 2) }}'
        secondary: Home Assistant Uptime
        tap_action:
          action: toggle
        type: custom:mushroom-template-card
        vertical: true
      - card:
          align_header: center
          align_state: center
          entities:
          - sensor.entities
          font_size: 60
          hour24: true
          hours_to_show: 24
          line_width: 2
          points_per_hour: 1
          show:
            fill: fade
            icon: false
            labels: false
            points: false
          type: custom:mini-graph-card
        conditions:
        - entity: input_boolean.show_ha_uptime
          state: 'on'
        type: conditional
      type: vertical-stack
    - cards:
      - entity: input_boolean.show_mariadb_graphs
        features_position: bottom
        primary: '{% set rows = states(''sensor.maria_db_rows'') | int(0) %} {{ ((states(''sensor.maria_db_size'')
          | float(0)) * 1000000) | filesizeformat() }} @ {{ ''{:,.3f}''.format(rows
          / 1000).replace('','', ''.'') }} Rows @ {{ states(''sensor.db_purges_success_rate'',
          with_unit=true) }} Purge Success'
        secondary: Maria DB Size
        tap_action:
          action: toggle
        type: custom:mushroom-template-card
        vertical: true
      - card:
          cards:
          - align_header: center
            align_state: center
            entities:
            - entity: sensor.maria_db_size
              name: Maria DB Size
            font_size: 65
            hours_to_show: 72
            line_width: 2
            points_per_hour: 2
            show:
              fill: fade
              icon: false
              labels: true
              points: hover
            type: custom:mini-graph-card
          - align_header: center
            align_state: center
            entities:
            - entity: sensor.maria_db_rows
              name: Maria DB Rows
            font_size: 65
            hours_to_show: 72
            line_width: 2
            points_per_hour: 2
            show:
              fill: fade
              icon: false
              labels: true
              points: hover
            type: custom:mini-graph-card
          - cards:
            - align_header: center
              align_state: center
              entities:
              - entity: sensor.mariadb_cpu_prozent
                name: Maria DB Cpu Usage
              font_size: 65
              hours_to_show: 24
              line_width: 2
              points_per_hour: 1
              show:
                fill: fade
                icon: false
                labels: true
                points: hover
              type: custom:mini-graph-card
            - align_header: center
              align_state: center
              entities:
              - entity: sensor.mariadb_arbeitsspeicher_in_prozent
                name: Maria DB Ram Usage
              font_size: 65
              hours_to_show: 24
              line_width: 2
              points_per_hour: 1
              show:
                fill: fade
                icon: false
                labels: true
                points: hover
              type: custom:mini-graph-card
            type: horizontal-stack
          - cards:
            - entity: counter.db_purge_success
              features_position: bottom
              show_entity_picture: false
              type: tile
              vertical: false
            - entity: sensor.db_purges_success_rate
              features_position: bottom
              icon: mdi:percent
              name: Success Rate
              show_entity_picture: false
              type: tile
              vertical: false
            - entity: counter.db_purge_failure
              features_position: bottom
              show_entity_picture: false
              type: tile
              vertical: false
            type: horizontal-stack
          - entities:
            - entity: counter.db_purge_success
              show_state: true
            - entity: counter.db_purge_failure
              show_state: true
            hours_to_show: 24
            line_width: 2
            points_per_hour: 100
            show:
              fill: false
              graph: line
            type: custom:mini-graph-card
          type: vertical-stack
        conditions:
        - entity: input_boolean.show_mariadb_graphs
          state: 'on'
        type: conditional
      type: vertical-stack
    - cards:
      - entity: input_boolean.show_mqtt_details
        features_position: bottom
        icon: ''
        primary: '{{ time_since(now() - timedelta(days=states(''sensor.mqtt_stats_uptime'')|float(0)),
          2)}}'
        secondary: MQTT Uptime
        tap_action:
          action: toggle
        type: custom:mushroom-template-card
        vertical: true
      - card:
          cards:
          - cards:
            - entity: sensor.mqtt_stats_bytes_received
              fill_container: true
              icon: mdi:call-received
              layout: vertical
              primary: '{{ states(''sensor.mqtt_stats_bytes_received'') | filesizeformat()
                }}'
              secondary: ''
              tap_action:
                action: more-info
              type: custom:mushroom-template-card
            - entity: sensor.mqtt_stats_bytes_sent
              fill_container: true
              icon: mdi:call-made
              layout: vertical
              primary: '{{ states(''sensor.mqtt_stats_bytes_sent'') | filesizeformat()
                }}'
              secondary: ''
              tap_action:
                action: more-info
              type: custom:mushroom-template-card
            type: horizontal-stack
          - aggregate_func: diff
            align_header: center
            entities:
            - entity: sensor.mqtt_stats_messages_received
              name: Received
              show_state: true
            - entity: sensor.mqtt_stats_messages_sent
              name: Sent
              show_state: true
              show_unit: false
            group_by: hour
            height: 100
            hour24: true
            hours_to_show: 48
            name: 'Messages: Received / Sent'
            points_per_hour: 10
            show:
              icon: false
              labels: false
              legend: false
            type: custom:mini-graph-card
            unit: ' '
          type: vertical-stack
        conditions:
        - condition: state
          entity: input_boolean.show_mqtt_details
          state: 'on'
        type: conditional
      type: vertical-stack
    - color: blue
      entity: sensor.tibber_node_battery_voltage
      features_position: bottom
      icon: mdi:pulse
      multiline_secondary: false
      primary: 'Tibber Pulse Uptime: {{ state_attr(entity,''uptime_human'') }}'
      secondary: '{{ states(entity, with_unit=True) }}'
      tap_action:
        action: more-info
      type: custom:mushroom-template-card
      vertical: true
    - content: "{%- set x = ['unavailable','unknown'] -%}\n{%- set ignore_int = ['Planta']\
        \ -%}\n\n{# Calculate totals for the top header #}\n{%- set totals = namespace(entities=0,\
        \ devices=[]) -%}\n{%- for i in states if i.state not in x -%}\n  {%- set\
        \ c_id = config_entry_id(i.entity_id) -%}\n  {%- set c_title = config_entry_attr(c_id,\
        \ 'title') if c_id else none -%}\n  \n  {%- if c_title not in ignore_int -%}\n\
        \    {%- set totals.entities = totals.entities + 1 -%}\n    {%- set d_id =\
        \ device_id(i.entity_id) -%}\n    {%- if d_id -%}\n      {%- set totals.devices\
        \ = totals.devices + [d_id] -%}\n    {%- endif -%}\n  {%- endif -%}\n{%- endfor\
        \ -%}\n\n{%- set total_devices = totals.devices | unique | list | count -%}\n\
        \n{%- for d in states | groupby('domain') -%}\n  {%- if loop.first -%} \n\
        \    <details>\n      <summary>\n        <b>Domains: {{loop.length}} ({{ total_devices\
        \ }} Devices / {{ totals.entities }} Entities)</b>\n      </summary>\n  {%-\
        \ endif -%}\n   \n   {%- set items = namespace(visible=[]) -%}\n   {%- for\
        \ i in d[1] if i.state not in x -%}\n     {%- set c_id = config_entry_id(i.entity_id)\
        \ -%}\n     {%- set c_title = config_entry_attr(c_id, 'title') if c_id else\
        \ none -%}\n     {%- if c_title not in ignore_int -%}\n       {%- set items.visible\
        \ = items.visible + [i] -%}\n     {%- endif -%}\n   {%- endfor -%}\n\n   {%-\
        \ set entity_count = items.visible | count -%}\n\n   {%- if entity_count >\
        \ 0 -%}\n   <details>\n    <summary>{{ d[0] | title }}: <b>{{ entity_count\
        \ }}</b></summary>\n    {%- for i in items.visible -%}\n      {{- i.name -}}:\
        \ <b>{{- i.state -}}</b><br>\n    {%- endfor -%}\n   </details>\n   {%- endif\
        \ -%}\n{%- endfor -%}\n</details>"
      type: markdown
    - entity: todo.to_do_duncan
      hide_completed: true
      type: todo-list
    - cards:
      - entities:
        - entity: sensor.home_assistant_beta_release_notes
          hold_action:
            action: more-info
          tap_action:
            action: perform-action
            perform_action: input_button.press
            target:
              entity_id: input_button.update_beta_release_notes
        type: entities
      - content: '## [Beta Release]({{ state_attr("sensor.home_assistant_beta_release_notes",''beta_url'')}}):
          {{states("sensor.home_assistant_beta_release_notes") }}

          {{ state_attr("sensor.home_assistant_beta_release_notes","ai_summary")

          }}'
        type: markdown
      - entity: input_select.conversation_agents
        secondary_info: none
        type: custom:mushroom-select-card
      type: vertical-stack
      visibility:
      - condition: state
        entity: binary_sensor.home_assistant_beta_release_notes_window
        state: 'on'
    - cards:
      - entity: sensor.system_ha_global_health_score
        name: HAGHS
        needle: true
        severity:
          green: 90
          red: 0
          yellow: 75
        type: gauge
        unit: ' '
      - content: "{% set e = 'sensor.system_ha_global_health_score' %} {% set hw =\
          \ state_attr(e, 'hardware_score') | int(0) %} {% set app = state_attr(e,\
          \ 'application_score') | int(0) %} {% set score = states(e) | int(0) %}\n\
          | Hardware | Application |\n|----------------|-----------------|\n| **{{\
          \ hw }}**/100 | **{{ app }}**/100 | \n\n**Global Formula:** ({{ hw }} \xD7\
          \ 0.4) + ({{ app }} \xD7 0.6) = **{{ score }}**\n"
        title: Score Breakdown
        type: markdown
      - content: "{% set e = 'sensor.system_ha_global_health_score' %} {% set rec\
          \ = state_attr(e, 'recommendations') | default('', true) %}\n{% if states(e)\
          \ in ['unavailable', 'unknown'] %}\n  \u26A0\uFE0F **Error:** Health Advisor\
          \ sensor is offline.\n{% elif rec not in [none, 'unknown', 'unavailable']\
          \ and '\u2705' not in rec %}\n  {{ rec }}\n{% else %}\n  \u2705 System healthy.\
          \ No recommendations.\n{% endif %}\n"
        title: "\U0001F6E1\uFE0F Advisor"
        type: markdown
      - card:
          content: "{% set e = 'sensor.system_ha_global_health_score' %} {% set updates\
            \ = state_attr(e, 'pending_updates') | default([], true) | list %} {%\
            \ set db_mb = state_attr(e, 'db_size_mb') | float(0) %} {% set keep =\
            \ state_attr(e, 'recorder_keep_days') %} {% set filter = state_attr(e,\
            \ 'recorder_filter_active') | default(false, true) %} {% set psi = state_attr(e,\
            \ 'psi_available') | default(false, true) %}\n{% if updates | length >\
            \ 0 %}  **{{ updates | length }} Update(s) pending:**  {% for u in updates\
            \ %} \n  &nbsp;&nbsp; \u2022 {{ u }}\n  \n{% endfor %} [\u2192 Open Updates](/config/updates)\
            \ {% else %} \u2705 All updates installed {% endif %}\n---\nDatabase:\
            \ {% if db_mb > 2500 %}{% elif db_mb > 1000 %}{% else %}{% endif %} {{\
            \ db_mb | round(1) }} MB {% if db_mb == 0.0 %}*(external DB detected)*{%\
            \ endif %}\nRecorder: {% if keep not in [none, 'unknown'] %}  Purge active\
            \ ({{ keep }} days) {% else %}  No purge configured \u2014 DB may grow\
            \ indefinitely {% endif %}\n{{ 'Entity filter active' if filter else '\
            \ No entity filter' }}\n---\n**Metric Source:** {% if psi %} \U0001F7E2\
            \ PSI active\n(CPU + RAM + I/O + Disk) \u2014 Hardware score uses 4 components\
            \  {% else %} \u2699\uFE0F Classic sensors (CPU + RAM + Disk) \u2014 Hardware\
            \ score uses 3 components  {% endif %}\n"
          title: "\U0001F4E6 Updates & Maintenance"
          type: markdown
        conditions:
        - above: -1
          attribute: zombie_count
          condition: numeric_state
          entity: sensor.system_ha_global_health_score
        type: conditional
      - content: "{% set e = 'sensor.system_ha_global_health_score' %} {% set z_raw\
          \ = state_attr(e, 'zombie_entities') | default([], true) %} {% set z_count\
          \ = state_attr(e, 'zombie_count') | int(0) %}\n{% if z_count == 0 %}\n \
          \ \u2705 **No zombie entities detected.**\n{% else %}\n  {% if z_raw is\
          \ string %} {% set z_list = z_raw.split(',') |\n  map('trim') | list %}\
          \ {% else %} {% set z_list = z_raw | list %} {%\n  endif %}\n  {% set grouped\
          \ = expand(z_list) | groupby('domain') %}\n\n  **{{ z_count }} Zombie(s)**\
          \ across **{{ grouped | length }}** domain(s)\n  {% if z_count > 20 %}*(showing\
          \ first 20 \u2014 {{ z_count - 20 }} more hidden)*{% endif %}\n\n  [\u2192\
          \ Check Entities](/config/entities)\n\n  {% for domain in grouped %}\n \
          \ <details>\n  <summary><b>{{ domain[0] | title }}: {{ domain[1] | count\
          \ }}</b></summary>\n  {% for item in domain[1] %}\n  &nbsp;&nbsp; \u2022\
          \ {{ device_attr(item.entity_id, 'name') | default('unknown device', true)\
          \ }} \u2014 {{ item.name }}: <b>{{ item.state\n  }}</b>\n  {% endfor %}\n\
          \  </details>\n  {% endfor %}\n{% endif %}\n"
        title: "\U0001F9DF Zombie Entities"
        type: markdown
      type: vertical-stack
    icon: mdi:home-analytics
    title: Analytics
    type: masonry
  - badges: []
    cards:
    - cards:
      - badges:
        - entity: sensor.openbk7231t_app_newest_version
          type: entity
        entity: input_boolean.show_open_beken_updates
        heading: Open Beken
        heading_style: title
        icon: mdi:fridge
        tap_action:
          action: toggle
        type: heading
      - card:
          type: entities
        filter:
          template: "{% set latest = states('sensor.openbk7231t_app_newest_version').lstrip('v')\
            \ %} {% for e in states.sensor if 'build' in e.entity_id %}\n  {% set\
            \ parts = e.state.split(' ') %}\n  {% if parts | length > 1 %}\n    {%\
            \ set device_version = parts[1] %}\n    {% if device_version != latest\
            \ %}\n      {{ e.entity_id }}\n    {% endif %}\n  {% endif %}\n{% endfor\
            \ %}\n"
        sort:
          method: state
        type: custom:auto-entities
        visibility:
        - condition: state
          entity: input_boolean.show_open_beken_updates
          state: 'on'
      - content: '{{ state_attr(''sensor.openbk7231t_app_newest_version'',''body'')}}'
        type: markdown
        visibility:
        - condition: state
          entity: input_boolean.show_open_beken_updates
          state: 'on'
      type: vertical-stack
    - cards:
      - badges:
        - entity: sensor.tasmota_newest_version
          tap_action:
            action: more-info
          type: entity
        entity: input_boolean.show_tasmota_updates
        heading: Tasmota
        heading_style: title
        icon: mdi:fridge
        tap_action:
          action: toggle
        type: heading
      - card:
          type: entities
        filter:
          template: '{% set latest = states(''sensor.tasmota_newest_version'').lstrip(''v'')
            %} {% for e in states.sensor %} {% if ''firmware_version'' in e.entity_id
            and not e.state.startswith(latest) %} {{ e.entity_id }} {% endif %} {%
            endfor %}

            '
        sort:
          method: state
        type: custom:auto-entities
        visibility:
        - condition: state
          entity: input_boolean.show_tasmota_updates
          state: 'on'
      - content: '{{ state_attr(''sensor.tasmota_newest_version'',''body'')}}'
        type: markdown
        visibility:
        - condition: state
          entity: input_boolean.show_tasmota_updates
          state: 'on'
      type: vertical-stack
    icon: mdi:power-socket-de
    path: tasmota
    subview: false
    title: Tasmota
  - badges: []
    cards: []
    icon: mdi:battery
    max_columns: 2
    path: batterys
    sections:
    - cards:
      - card:
          columns: 1
          square: false
          type: grid
        card_param: cards
        filter:
          include:
          - entity_id: sensor.*_battery_plus
            options:
              bar_color: "{% set level = states(entity) | int %} {% if level > 80\
                \ %}\n linear-gradient(90deg, red, orange, yellow, lightgreen, green)\n\
                {% elif level > 20 %}\n linear-gradient(90deg, red, orange, yellow,\
                \ lightgreen)\n{% else %}\n linear-gradient(90deg, red, orange)\n\
                {% endif %}"
              color: "{% set level = states(entity) | int %} {% if level < 30 %}\n\
                \ red\n{% elif level < 60 %}\n orange\n{% else %}\n green\n{% endif\
                \ %}"
              icon: "{% if states(entity) | int > 50 %}\n  mdi:battery-high\n{% else\
                \ %}\n  mdi:battery-low\n{% endif %}"
              name: '{{ entity | replace(''zigbee'','''') | replace(''battery_plus'','''')|
                replace(''sensor.'','''')| replace(''_'','' '') | title }}: {{ states(entity)
                }}%'
              percent: '{{ states(entity) }}'
              secondary: '{{ states(entity|replace(''plus'',''type''))}}'
              tap_action:
                action: more-info
              type: custom:entity-progress-card-template
        show_empty: false
        sort:
          ignore_case: true
          method: state
          numeric: true
        type: custom:auto-entities
      column_span: 1
      type: grid
    - cards:
      - card_mod:
          style:
            ha-markdown$: 'table { width: 100%; border-collapse: separate; border-spacing:
              0px; } tbody tr:nth-child(2n+1) { background-color: var(--table-row-background-color);
              } thead tr th, tbody tr td {padding: 4px 10px; }

              '
        content: "{% set ns_batteries = namespace(batteries={}) %}\n{% for entity_id\
          \ in integration_entities('battery_notes') if entity_id is search('_battery_type$',\
          \ ignorecase=False) -%}\n    {% set battery_raw = states[entity_id].state\
          \ %}\n    \n    {# Support both \xD7 and x as multipliers #}\n    {% if\
          \ \"\xD7\" in battery_raw %}\n        {% set battery_split = battery_raw.split(\"\
          \xD7\") %}\n    {% elif \"x\" in battery_raw %}\n        {% set battery_split\
          \ = battery_raw.split(\"x\") %}\n    {% else %}\n        {% set battery_split\
          \ = [battery_raw] %}\n    {% endif %}\n    \n    {% if battery_split | length\
          \ > 1 %}\n        {% set battery_count = battery_split[0] | trim | int(1)\
          \ %}\n        {% set battery_type = battery_split[1] | trim | upper %}\n\
          \    {% else %}\n        {% set battery_count = 1 %}\n        {% set battery_type\
          \ = battery_split[0] | trim | upper %}\n    {% endif %}\n    \n    {% if\
          \ battery_type not in ns_batteries.batteries %}\n        {% set ns_batteries.batteries\
          \ = dict(ns_batteries.batteries, **{battery_type: battery_count}) %}\n \
          \   {% else %}\n        {% set ns_batteries.batteries = dict(ns_batteries.batteries,\
          \ **{battery_type: ns_batteries.batteries[battery_type] + battery_count})\
          \ %}\n    {% endif %}\n{% endfor %}\n\n| Type | Count |\n| :-- | --: |\n\
          {% for bt in ns_batteries.batteries | dictsort(False, 'value') | reverse\
          \ -%}\n  | {{ bt[0] }} | {{ bt[1] }} |\n{% endfor %}\n\n---\n\n**Total**:\
          \ {{ ns_batteries.batteries.values() | sum }}"
        title: Battery Summary
        type: markdown
      - cards:
        - entities:
          - entity: input_text.batterie_suche
            icon: mdi:magnify
            name: Search by battery type
            secondary_info: none
          state_color: false
          type: entities
        - content: "{% set search_term = states('input_text.batterie_suche') %}\n\
            {% set devices = states\n   | selectattr('entity_id', 'search', '_battery_plus$')\n\
            \   | selectattr('attributes.battery_type_and_quantity', 'defined')\n\
            \   | list %}\n\n{% set ns = namespace(buffer=[], output=\"\") %}\n\n\
            {% for device in devices %}\n  {% set bt_raw = device.attributes.battery_type_and_quantity\
            \ | replace('\xD7','x') %}\n  {% if search_term == \"\" or search_term|lower\
            \ in bt_raw|lower %}\n    {% set lvl = device.state | int(0) %}\n    {%\
            \ set entry = {\n      'type': bt_raw,\n      'line': (device.name | replace('Batterie+',''))\
            \ ~ ': ' ~ device.state ~ '%',\n      'sort_key': bt_raw ~ '-' ~ (\"%03d\"\
            |format(lvl))\n    } %}\n    {% set ns.buffer = ns.buffer + [ entry ]\
            \ %}\n  {% endif %}\n{% endfor %}\n\n{% if ns.buffer | length > 0 %}\n\
            \  {% set sorted_list = ns.buffer | sort(attribute='sort_key') %}\n  {%\
            \ for i in range(sorted_list | length) %}\n    {% set current_item = sorted_list[i]\
            \ %}\n    {% if i == 0 or current_item.type != sorted_list[i-1].type %}\n\
            \      {% set prefix = '\\n\\n' if i > 0 else '' %}\n      {% set ns.output\
            \ = ns.output ~ prefix ~ '**' ~ current_item.type ~ '**\\n' %}\n    {%\
            \ endif %}\n    {% set ns.output = ns.output ~ current_item.line ~ '\\\
            n' %}\n  {% endfor %}\n  {{ ns.output | trim }}\n{% else %}\n  Keine Ger\xE4\
            te gefunden.\n{% endif %}"
          type: markdown
        type: vertical-stack
      type: grid
