config:
  views:
  - badges: []
    cards:
    - button-background: transparent
      cards:
      - cards:
        - cards:
          - align_header: center
            align_state: center
            cache: true
            decimals: 2
            entities:
            - sensor.cudy_router_upload_geschwindigkeit
            font_size: 65
            hour24: true
            hours_to_show: 24
            line_width: 2
            name: Upload
            points_per_hour: 10
            show:
              icon: false
              labels: false
              points: false
            type: custom:mini-graph-card
          - align_header: center
            align_state: center
            cache: true
            decimals: 2
            entities:
            - sensor.cudy_router_download_geschwindigkeit
            font_size: 65
            hour24: true
            hours_to_show: 24
            line_width: 2
            name: Download
            points_per_hour: 10
            show:
              icon: false
              labels: false
              points: false
            type: custom:mini-graph-card
          type: horizontal-stack
        - cards:
          - aggregate_func: diff
            align_header: center
            align_state: center
            cache: true
            decimals: 3
            entities:
            - sensor.cudy_data_sent_daily
            font_size: 65
            group_by: hour
            hour24: true
            hours_to_show: 24
            line_width: 2
            name: Upload
            points_per_hour: 30
            show:
              icon: false
              labels: false
              points: false
            type: custom:mini-graph-card
          - aggregate_func: diff
            align_header: center
            align_state: center
            cache: true
            decimals: 3
            entities:
            - sensor.cudy_data_received_daily
            font_size: 65
            group_by: hour
            hour24: true
            hours_to_show: 24
            line_width: 2
            name: Download
            points_per_hour: 30
            show:
              icon: false
              labels: false
              points: false
            type: custom:mini-graph-card
          type: horizontal-stack
        type: vertical-stack
      child-padding: 0.0em
      clear: false
      gap: 0.1em
      overlay-margin: 0em
      padding: 0.1em
      title: Expander
      title-card:
        double_tap_action:
          action: more-info
        entity: sensor.cudy_router_betriebszeit
        fill_container: true
        hold_action:
          action: more-info
        icon: ''
        layout: vertical
        primary: '{{ time_since(now() - timedelta(seconds=(states(''sensor.cudy_router_betriebszeit'')
          | int(0)) ),2) }}'
        secondary: Cudy Uptime
        tap_action:
          action: more-info
        type: custom:mushroom-template-card
      title-card-button-overlay: false
      type: custom:expander-card
    - button-background: transparent
      cards:
      - cards:
        - bar_size: large
          entity: sensor.system_monitor_prozessornutzung
          layout: horizontal
          name: CPU %
          show_more_info: true
          theme: cpu
          type: custom:entity-progress-card
          unit: '%'
        - bar_size: large
          decimal: 0
          entity: sensor.system_monitor_prozessortemperatur
          layout: horizontal
          name: "CPU \xB0C"
          show_more_info: true
          theme: temperature
          type: custom:entity-progress-card
          unit: "\xB0C"
        - bar_size: large
          decimal: 0
          entity: sensor.system_monitor_speicherauslastung
          layout: horizontal
          max_value: 15409
          name: RAM
          show_more_info: true
          theme: memory
          type: custom:entity-progress-card
          unit: MB
        - bar_size: large
          decimal: 1
          entity: sensor.system_monitor_festplattennutzung_2
          icon: mdi:harddisk
          layout: horizontal
          name: ROM
          show_more_info: true
          type: custom:entity-progress-card
          unit: '%'
        - card:
            columns: 1
            square: false
            type: grid
          card_param: cards
          filter:
            exclude:
            - state: 'off'
            include:
            - entity_id: update.*
              options:
                type: tile
          show_empty: false
          type: custom:auto-entities
        type: vertical-stack
      child-padding: 0.0em
      clear: false
      gap: 0.1em
      overlay-margin: 0em
      padding: 0.1em
      title: Expander
      title-card:
        double_tap_action:
          action: more-info
        entity: sensor.system_monitor_letzter_start
        fill_container: true
        hold_action:
          action: more-info
        icon: ''
        layout: vertical
        primary: '{{ time_since( as_datetime(states(''sensor.system_monitor_letzter_start'')),
          2)}}'
        secondary: Server Uptime
        tap_action:
          action: more-info
        type: custom:mushroom-template-card
      title-card-button-overlay: false
      type: custom:expander-card
    - button-background: transparent
      cards:
      - button-background: transparent
        cards:
        - card:
            columns: 1
            square: false
            type: grid
          card_param: cards
          filter:
            include:
            - integration: spook
              not:
                name: "*Repairs|Entit\xE4ten*"
              options:
                decimal: 0
                type: custom:entity-progress-card
                unit: ' '
              state: '>0'
          sort:
            method: state
            numeric: true
            reverse: true
          type: custom:auto-entities
        child-padding: 0.0em
        clear: false
        gap: 0.1em
        overlay-margin: 0em
        padding: 0.1em
        title-card:
          cards:
          - align_header: center
            align_state: center
            entities:
            - sensor.entities
            font_size: 60
            hour24: true
            hours_to_show: 48
            line_width: 2
            points_per_hour: 10
            show:
              fill: fade
              icon: false
              labels: false
              points: false
            type: custom:mini-graph-card
          type: vertical-stack
        title-card-button-overlay: true
        type: custom:expander-card
      child-padding: 0.0em
      clear: false
      gap: 0.1em
      overlay-margin: 0em
      padding: 0.1em
      title: Expander
      title-card:
        entity: sensor.uptime
        fill_container: true
        icon: ''
        layout: vertical
        primary: '

          {{ time_since( as_datetime(states(''sensor.uptime'')), 2)}}'
        secondary: Homeassistent Uptime
        tap_action:
          action: more-info
        type: custom:mushroom-template-card
      type: custom:expander-card
    - button-background: transparent
      cards:
      - align_header: center
        align_state: center
        entities:
        - entity: sensor.maria_db_size
          name: Maria DB Size
        font_size: 65
        hours_to_show: 96
        line_width: 2
        points_per_hour: 2
        show:
          fill: fade
          icon: false
          lables: true
          points: hover
        type: custom:mini-graph-card
      - align_header: center
        align_state: center
        entities:
        - entity: sensor.maria_db_rows
          name: Maria DB Rows
        font_size: 65
        hours_to_show: 96
        line_width: 2
        points_per_hour: 2
        show:
          fill: fade
          icon: false
          lables: true
          points: hover
        type: custom:mini-graph-card
      - cards:
        - align_header: center
          align_state: center
          entities:
          - entity: sensor.mariadb_cpu_prozent
            name: Maria DB Cpu Usage
          font_size: 65
          hours_to_show: 48
          line_width: 2
          points_per_hour: 1
          show:
            fill: fade
            icon: false
            lables: true
            points: hover
          type: custom:mini-graph-card
        - align_header: center
          align_state: center
          entities:
          - entity: sensor.mariadb_arbeitsspeicher_in_prozent
            name: Maria DB Ram Usage
          font_size: 65
          hours_to_show: 48
          line_width: 2
          points_per_hour: 1
          show:
            fill: fade
            icon: false
            lables: true
            points: hover
          type: custom:mini-graph-card
        type: horizontal-stack
      child-padding: 0.0em
      clear: false
      gap: 0.1em
      overlay-margin: 0em
      padding: 0.1em
      title: Expander
      title-card:
        entity: sensor.maria_db_size
        fill_container: true
        icon: ''
        layout: vertical
        primary: '{% set rows = states(''sensor.maria_db_rows'') | int(0)%}

          {{ ((states(''sensor.maria_db_size'') | float(0)) * 1000000) | filesizeformat()
          }} @ {{ ''{:,.3f}''.format(rows / 1000 ).replace('','',''.'')}} Rows'
        secondary: Maria DB Size
        tap_action:
          action: more-info
        type: custom:mushroom-template-card
      title-card-button-overlay: false
      type: custom:expander-card
    - button-background: transparent
      cards:
      - cards:
        - cards:
          - entity: sensor.192_168_2_205_00_status
            fill_container: true
            layout: vertical
            name: Status
            tap_action:
              action: call-service
              service: script.folding_home
              target: {}
            type: custom:mushroom-entity-card
          - entity: select.192_168_2_205_select_power_level
            fill_container: true
            layout: vertical
            name: Power Level
            type: custom:mushroom-select-card
          type: horizontal-stack
        - bar_size: large
          decimal: 2
          entity: sensor.192_168_2_205_00_percentdone
          hide:
          - icon
          layout: horizontal
          name: Folding @ Home
          show_more_info: true
          theme: battery
          type: custom:entity-progress-card
        - cards:
          - cards:
            - entity: sensor.192_168_2_205_00_assigned
              fill_container: true
              icon: mdi:eye
              icon_color: blue
              layout: vertical
              primary: Assigned since
              secondary: '{{ time_since( as_datetime(states(''sensor.192_168_2_205_00_assigned'')),
                2)}}'
              tap_action:
                action: more-info
              type: custom:mushroom-template-card
            - entity: sensor.192_168_2_205_00_estimated_time_finished
              fill_container: true
              icon: mdi:eye
              icon_color: blue
              layout: vertical
              primary: Finnished in
              secondary: '{% set running = is_state(''sensor.192_168_2_205_00_status'',''RUNNING'')
                %} {% set finish_time = time_until(as_datetime(states(''sensor.192_168_2_205_00_estimated_time_finished'')),
                2)%} {{ "Paused" if not running else finish_time }}'
              tap_action:
                action: more-info
              type: custom:mushroom-template-card
            - entity: sensor.192_168_2_205_00_deadline
              fill_container: true
              icon: mdi:eye
              icon_color: blue
              layout: vertical
              primary: Deadline in
              secondary: '{{ time_until( as_datetime(states(''sensor.192_168_2_205_00_deadline'')),
                2)}}'
              tap_action:
                action: more-info
              type: custom:mushroom-template-card
            type: horizontal-stack
          - cards:
            - entity: sensor.192_168_2_205_00_time_per_frame
              fill_container: true
              icon: mdi:clock
              icon_color: blue
              layout: vertical
              primary: time / frame
              secondary: '{% set uptime = states(''sensor.192_168_2_205_00_time_per_frame'')
                | int(0) %} {% set finish = now() + timedelta(seconds=uptime)%} {{
                time_until(finish, 2) }}'
              tap_action:
                action: more-info
              type: custom:mushroom-template-card
            - double_tap_action:
                action: call-service
                service: button.press
                target:
                  entity_id:
                  - button.update_foldingathome
              entity: sensor.folding_at_home_credits_scrape
              fill_container: true
              layout: vertical
              name: Credits
              type: custom:mushroom-entity-card
            - entity: sensor.192_168_2_205_00_creditestimate
              fill_container: true
              layout: vertical
              name: Estimated credits
              type: custom:mushroom-entity-card
            type: horizontal-stack
          - double_tap_action:
              action: call-service
              service: button.press
              target:
                entity_id:
                - button.update_foldingathome
            entity: sensor.folding_at_home_rank_scrape
            fill_container: true
            layout: vertical
            type: custom:mushroom-entity-card
          type: vertical-stack
        - cards:
          - align_header: center
            align_state: center
            entities:
            - entity: sensor.folding_home_cpu_prozent
              name: Folding@Home Cpu Usage
            font_size: 65
            hours_to_show: 48
            line_width: 2
            points_per_hour: 4
            show:
              fill: fade
              icon: false
              lables: true
              points: hover
            type: custom:mini-graph-card
          - align_header: center
            align_state: center
            entities:
            - entity: sensor.folding_home_arbeitsspeicher_in_prozent
              name: Folding@Home RAM Usage
            font_size: 65
            hours_to_show: 48
            line_width: 2
            points_per_hour: 4
            show:
              fill: fade
              icon: false
              lables: true
              points: hover
            type: custom:mini-graph-card
          type: horizontal-stack
        type: vertical-stack
      child-padding: 0.0em
      clear: false
      gap: 0.1em
      overlay-margin: 0em
      padding: 0.1em
      title: Expander
      title-card:
        entity: sensor.192_168_2_205_00_percentdone
        fill_container: true
        icon: ''
        layout: vertical
        multiline_secondary: true
        primary: Folding@Home
        secondary: " \n    {% set status = time_until(as_datetime(states('sensor.192_168_2_205_00_estimated_time_finished')),2)%}\n\
          \    {% set running = is_state('sensor.192_168_2_205_00_status','RUNNING')\
          \ %}\n    {{ \"Finished in: \" + status if running else \"Paused: \" + status\
          \ }}\n    {{ states('sensor.192_168_2_205_00_percentdone') | float(0) |\
          \ round(2) }} /{{ states('sensor.192_168_2_205_00_total_frames') }}"
        tap_action:
          action: more-info
        type: custom:mushroom-template-card
      type: custom:expander-card
    - button-background: transparent
      cards:
      - cards:
        - cards:
          - align_header: center
            align_state: center
            cache: true
            decimals: 2
            entities:
            - sensor.speedtest_upload
            - entity: sensor.upload_avg_24h
            font_size: 65
            hour24: true
            hours_to_show: 24
            line_width: 2
            name: Upload
            points_per_hour: 30
            show:
              average: true
              extrema: true
              icon: false
              labels: false
              legend: false
              points: false
            type: custom:mini-graph-card
          - align_header: center
            align_state: center
            cache: true
            decimals: 2
            entities:
            - sensor.speedtest_download
            - entity: sensor.download_avg_24h
            font_size: 65
            hour24: true
            hours_to_show: 24
            line_width: 2
            name: Download
            points_per_hour: 30
            show:
              average: true
              extrema: true
              icon: false
              labels: false
              legend: false
              points: false
            type: custom:mini-graph-card
          type: horizontal-stack
        type: vertical-stack
      child-padding: 0.0em
      clear: false
      gap: 0.1em
      overlay-margin: 0em
      padding: 0.1em
      title: Expander
      title-card:
        entity: script.1707895746671
        fill_container: true
        icon: ''
        layout: vertical
        primary: '{% set unavailable = is_state(''sensor.speedtest_download'',''unknown'')%}

          {% set text = "Ping: " + states(''sensor.speedtest_ping'') + "ms, " + states(''sensor.speedtest_upload'')
          + " Mbps, " + states(''sensor.speedtest_download'') + " Mbps"%}

          {{  "" if unavailable else text }}'
        secondary: '{% set script = is_state(''script.1707895746671'',''on'') %}

          {% set unavailable = is_state(''sensor.speedtest_download'',''unknown'')%}

          {% set last_run = states(''sensor.speedtest_last_run'') %}

          {{ "Start SpeedTest, Last: " + last_run + " ago" if not script else ("Testing"
          if unavailable else "Wrapping up") }}'
        tap_action:
          action: call-service
          service: script.1707895746671
          target: {}
        type: custom:mushroom-template-card
      title-card-button-overlay: false
      type: custom:expander-card
    - button-background: transparent
      cards:
      - content: "{% set x = ['unavailable','unknown'] %}\n{%- for d in states|groupby('domain')\
          \ %}\n  {% if loop.first %} \n  Domains: {{loop.length}}\n  {% endif %}\n\
          \  <details>\n  <summary>{{- d[0] | title }}: <b>{{states[d[0]]|rejectattr('state','in',x)|list|count}}</b></summary>\n\
          \  {% for i in d[1] if i.state not in x -%}\n  &nbsp;&nbsp;&nbsp;&nbsp;-\
          \ {{i.name}}: <b>{{i.state}}</b><br>\n  {% endfor %}\n  </details>\n{%-\
          \ endfor -%}"
        type: markdown
      child-padding: 0.0em
      clear: false
      gap: 0.1em
      overlay-margin: 0.0em
      padding: 0.1em
      title: Domains & their Entities
      title-card-button-overlay: false
      type: custom:expander-card
    - entity: sensor.backup_state
      fill_container: true
      icon: mdi:clipboard-check-multiple-outline
      layout: vertical
      multiline_secondary: true
      primary: 'Last Backup Size: {{ state_attr(''sensor.backup_state'', ''backups'')[-1][''size'']
        }}'
      secondary: '{% set uptime = (now().timestamp() - as_timestamp(state_attr(''sensor.backup_state'',
        ''backups'')[-1][''date''])) %}

        {% set months = (uptime % 31536000) // 2592000 %}

        {% set days = (uptime % 2592000) // 86400 %}

        {% set hours = (uptime % 86400) // 3600 %}

        {% set minutes = (uptime % 3600) // 60 %}

        {% set percent = state_attr(''sensor.backup_state'', ''backups'')[-1][''state'']
        %}

        Last Backup {{ ''%dm '' % months if months else '''' }}{{ ''%dd '' % days
        if days else '''' }}{{ ''%dh '' % hours if hours else '''' }}{{ ''%dm'' %
        minutes if minutes else '''' }} ago

        State: {{ "Uploaded" if percent == "Drive Only" else percent }}

        Total Space in Google Drive: {{state_attr(''sensor.backup_state'', ''size_in_google_drive'')}}

        Total Backups in Google Drive: {{state_attr(''sensor.backup_state'', ''backups_in_google_drive'')}}'
      tap_action:
        action: more-info
      type: custom:mushroom-template-card
    - entity: sensor.onedrivefilesync
      fill_container: true
      icon: ''
      layout: vertical
      multiline_secondary: true
      primary: 'Onedrive Filesync:

        {% set status_backup = states(''sensor.onedrivefilesync'') | string %}

        {% set percent = state_attr(''sensor.onedrivebackup'', ''Current file upload
        percentage'') %}

        {% set speed = state_attr(''sensor.onedrivebackup'',''Current file upload
        speed (KB/s)'')%}

        {{ "Uploaded" if status_backup == "Synced" else "Syncing" }}'
      secondary: ''
      tap_action:
        action: more-info
      type: custom:mushroom-template-card
    - entity: sensor.tibber_pulse_uptime
      fill_container: true
      icon: mdi:pulse
      icon_color: blue
      layout: vertical
      tap_action:
        action: more-info
      type: custom:mushroom-entity-card
    - entity: todo.to_do_duncan
      hide_completed: true
      type: todo-list
    - bar_orientation: ltr
      bar_size: large
      custom_info: "{% set temp = states('sensor.boiler_temperature') | float()%}\
        \ {% if temp > 50 %}\n  <span style=\"color: orangered;\">{{ temp }} \xB0\
        C - </span>\n{% elif temp > 40 %}\n  <span style=\"color: yellow;\">{{ temp\
        \ }} \xB0C - </span>\n{% else %}\n  <span style=\"color: lightblue;\">{{ temp\
        \ }} \xB0C - </span>\n{% endif %}"
      decimal: 1
      disable_unit: true
      double_tap_action:
        action: perform-action
        perform_action: script.auto_boiler_off_300s
        target: {}
      entity: timer.boiler_on_demand
      force_circular_background: true
      hold_action:
        action: none
      icon_double_tap_action:
        action: more-info
      icon_hold_action:
        action: none
      icon_tap_action:
        action: none
      name: Boiler Remaining Time
      reverse: true
      tap_action:
        action: none
      theme: optimal_when_high
      type: custom:entity-progress-card
      unit: flextimer
    icon: mdi:home-analytics
    title: Analytics
  - badges: []
    cards:
    - button-background: transparent
      cards:
      - cards:
        - button-background: transparent
          cards:
          - card:
              type: entities
            filter:
              template: '{% set latest = states(''sensor.tasmota_newest_version'').lstrip(''v'')
                %} {% for e in states.sensor %} {% if ''firmware_version'' in e.entity_id
                and not e.state.startswith(latest) %} {{ e.entity_id }} {% endif %}
                {% endfor %}

                '
            sort:
              method: state
            type: custom:auto-entities
          child-padding: 0.0em
          clear: false
          gap: 0.1em
          overlay-margin: 0em
          padding: 0.1em
          title: Updates
          title-card:
            entity: sensor.tasmota_newest_version
            features_position: bottom
            icon: mdi:update
            type: tile
            vertical: false
          type: custom:expander-card
        - button-background: transparent
          cards:
          - card:
              columns: 1
              square: false
              type: grid
            card_param: cards
            filter:
              include:
              - entity_id: '*rssi|signal'
                options:
                  max_state: 0
                  min_state: -100
                  tap_action:
                    action: more-info
                  theme: optimal_when_low
                  type: custom:entity-progress-card
            show_empty: true
            sort:
              ignore_case: true
              method: state
              numeric: true
            type: custom:auto-entities
          child-padding: 0.0em
          clear: false
          gap: 0.1em
          overlay-margin: 0em
          padding: 0.1em
          title: Tasmota RSSIs
          type: custom:expander-card
        type: vertical-stack
      child-padding: 0.0em
      clear: false
      gap: 0.1em
      overlay-margin: 0em
      padding: 0.1em
      title: Tasmota
      type: custom:expander-card
    - cards:
      - button-background: transparent
        cards:
        - card:
            type: entities
          filter:
            template: "{% set latest = states('sensor.openbk7231t_app_newest_version').lstrip('v')\
              \ %} {% for e in states.sensor if 'build' in e.entity_id %}\n  {% set\
              \ parts = e.state.split(' ') %}\n  {% if parts | length > 1 %}\n   \
              \ {% set device_version = parts[1] %}\n    {% if device_version != latest\
              \ %}\n      {{ e.entity_id }}\n    {% endif %}\n  {% endif %}\n{% endfor\
              \ %}\n"
          sort:
            method: state
          type: custom:auto-entities
        child-padding: 0.0em
        clear: false
        gap: 0.1em
        overlay-margin: 0em
        padding: 0.1em
        title: Updates
        title-card:
          entity: sensor.openbk7231t_app_newest_version
          features_position: bottom
          type: tile
          vertical: false
        type: custom:expander-card
      type: vertical-stack
    icon: mdi:power-socket-de
    path: tasmota
    subview: false
    title: Tasmota
  - badges: []
    cards:
    - entity: sensor.mqtt_stats_uptime
      icon_type: none
      layout: vertical
      name: Uptime
      primary_info: state
      secondary_info: name
      type: custom:mushroom-entity-card
    - cards:
      - entity: sensor.mqtt_stats_bytes_received
        fill_container: true
        icon: mdi:call-received
        layout: vertical
        primary: '{{ states(''sensor.mqtt_stats_bytes_received'') | filesizeformat()
          }}'
        secondary: ''
        tap_action:
          action: more-info
        type: custom:mushroom-template-card
      - entity: sensor.mqtt_stats_bytes_sent
        fill_container: true
        icon: mdi:call-made
        layout: vertical
        primary: '{{ states(''sensor.mqtt_stats_bytes_sent'') | filesizeformat() }}'
        secondary: ''
        tap_action:
          action: more-info
        type: custom:mushroom-template-card
      type: horizontal-stack
    - aggregate_func: dif
