config:
  views:
  - cards:
    - cards:
      - tab: home
        type: custom:sem-tab-header
      - type: custom:sem-onboarding-banner
      - compact: true
        entity: sensor.sem_tariff_current_import_rate
        type: custom:sem-price-card
      - entity: sensor.sem_charging_state
        type: custom:sem-today-plan-card
      - entity_prefix: sensor.sem_
        type: custom:sem-system-diagram-card
      - entity_prefix: sensor.sem_
        type: custom:sem-home-status-card
      - card_mod:
          style: "ha-card {\n  background-color: var(--card-background-color) !important;\n\
            \  color: var(--primary-text-color) !important;\n  border: 1px solid var(--divider-color)\
            \ !important;\n  border-radius: 16px !important;\n  box-shadow: var(--ha-card-box-shadow,\
            \ 0 2px 8px rgba(0,0,0,0.08)) !important;\n  max-width: 900px !important;\n\
            \  font-family: 'Segoe UI','Roboto',sans-serif !important;\n  transition:\
            \ box-shadow 0.3s cubic-bezier(0.4,0,0.2,1), border-color 0.3s cubic-bezier(0.4,0,0.2,1)\
            \ !important;\n  --chip-background: var(--secondary-background-color);\n\
            \  --primary-font-family: 'Segoe UI','Roboto',sans-serif;\n}\nha-card:hover\
            \ {\n  box-shadow: var(--ha-card-box-shadow, 0 4px 16px rgba(0,0,0,0.12))\
            \ !important;\n}\n"
        entity_prefix: sensor.sem_
        type: custom:sem-solar-card
      - card_mod:
          style: "ha-card {\n  background-color: var(--card-background-color) !important;\n\
            \  color: var(--primary-text-color) !important;\n  border: 1px solid var(--divider-color)\
            \ !important;\n  border-radius: 16px !important;\n  box-shadow: var(--ha-card-box-shadow,\
            \ 0 2px 8px rgba(0,0,0,0.08)) !important;\n  max-width: 900px !important;\n\
            \  font-family: 'Segoe UI','Roboto',sans-serif !important;\n  transition:\
            \ box-shadow 0.3s cubic-bezier(0.4,0,0.2,1), border-color 0.3s cubic-bezier(0.4,0,0.2,1)\
            \ !important;\n  --chip-background: var(--secondary-background-color);\n\
            \  --primary-font-family: 'Segoe UI','Roboto',sans-serif;\n}\nha-card:hover\
            \ {\n  box-shadow: var(--ha-card-box-shadow, 0 4px 16px rgba(0,0,0,0.12))\
            \ !important;\n}\n"
        entity: weather.irauen33
        type: custom:sem-weather-card
      - preset: energy
        title: Letzte 7 Tage
        type: custom:sem-chart-card
      type: vertical-stack
    icon: mdi:home-lightning-bolt
    path: home
    title: Haus
    type: panel
  - cards:
    - cards:
      - tab: energy
        type: custom:sem-tab-header
      - card_mod:
          style: "ha-card {\n  background-color: var(--card-background-color) !important;\n\
            \  color: var(--primary-text-color) !important;\n  border: 1px solid var(--divider-color)\
            \ !important;\n  border-radius: 16px !important;\n  box-shadow: var(--ha-card-box-shadow,\
            \ 0 2px 8px rgba(0,0,0,0.08)) !important;\n  max-width: 900px !important;\n\
            \  font-family: 'Segoe UI','Roboto',sans-serif !important;\n  transition:\
            \ box-shadow 0.3s cubic-bezier(0.4,0,0.2,1), border-color 0.3s cubic-bezier(0.4,0,0.2,1)\
            \ !important;\n  --chip-background: var(--secondary-background-color);\n\
            \  --primary-font-family: 'Segoe UI','Roboto',sans-serif;\n}\nha-card:hover\
            \ {\n  box-shadow: var(--ha-card-box-shadow, 0 4px 16px rgba(0,0,0,0.12))\
            \ !important;\n}\n"
        height: 280
        round: 2
        sections:
        - entities:
          - children:
            - sensor.sem_flow_solar_to_home_energy
            - sensor.sem_flow_solar_to_ev_energy
            - sensor.sem_flow_solar_to_battery_energy
            - sensor.sem_flow_solar_to_grid_energy
            color: '#ff9800'
            entity_id: sensor.sem_daily_solar_energy
            name: Solar
          - children:
            - sensor.sem_flow_grid_to_home_energy
            - sensor.sem_flow_grid_to_ev_energy
            - sensor.sem_flow_grid_to_battery_energy
            color: '#488fc2'
            entity_id: sensor.sem_daily_grid_import_energy
            name: Netz
          - children:
            - sensor.sem_flow_battery_to_home_energy
            - sensor.sem_flow_battery_to_ev_energy
            color: '#4db6ac'
            entity_id: sensor.sem_daily_battery_discharge_energy
            name: Batterie
        - entities:
          - children:
            - sensor.sem_daily_home_energy
            color: '#ff9800'
            entity_id: sensor.sem_flow_solar_to_home_energy
            name: Sol>Haus
          - children:
            - sensor.sem_daily_ev_energy
            color: '#ff9800'
            entity_id: sensor.sem_flow_solar_to_ev_energy
            name: Sol>EV
          - children:
            - sensor.sem_daily_battery_charge_energy
            color: '#ff9800'
            entity_id: sensor.sem_flow_solar_to_battery_energy
            name: Sol>Bat
          - children:
            - sensor.sem_daily_grid_export_energy
            color: '#ff9800'
            entity_id: sensor.sem_flow_solar_to_grid_energy
            name: Sol>Netz
          - children:
            - sensor.sem_daily_home_energy
            color: '#488fc2'
            entity_id: sensor.sem_flow_grid_to_home_energy
            name: Netz>Haus
          - children:
            - sensor.sem_daily_ev_energy
            color: '#488fc2'
            entity_id: sensor.sem_flow_grid_to_ev_energy
            name: Netz>EV
          - children:
            - sensor.sem_daily_battery_charge_energy
            color: '#488fc2'
            entity_id: sensor.sem_flow_grid_to_battery_energy
            name: Netz>Bat
          - children:
            - sensor.sem_daily_home_energy
            color: '#4db6ac'
            entity_id: sensor.sem_flow_battery_to_home_energy
            name: Bat>Haus
          - children:
            - sensor.sem_daily_ev_energy
            color: '#4db6ac'
            entity_id: sensor.sem_flow_battery_to_ev_energy
            name: Bat>EV
        - entities:
          - color: '#5BC8D8'
            entity_id: sensor.sem_daily_home_energy
            name: Haus
          - color: '#8DC892'
            entity_id: sensor.sem_daily_ev_energy
            name: EV
          - color: '#f06292'
            entity_id: sensor.sem_daily_battery_charge_energy
            name: Batterie
          - color: '#8353d1'
            entity_id: sensor.sem_daily_grid_export_energy
            name: Einspeisung
        show_icons: true
        show_names: true
        show_states: true
        type: custom:sankey-chart
        unit_prefix: k
        wide: true
      - cards:
        - color: '#4db6ac'
          entity: sensor.sem_self_consumption_rate
          name: Eigenverbrauch
          type: custom:sem-gauge-card
        - color: '#8DC892'
          entity: sensor.sem_autarky_rate
          name: Autarkie
          type: custom:sem-gauge-card
        type: horizontal-stack
      - preset: power
        title: 24h Leistung
        type: custom:sem-chart-card
      - entity_prefix: sensor.sem_
        type: custom:sem-energy-impact-card
      - preset: energy
        title: "Eigenverbrauch \u2014 30-Tage-Trend"
        type: custom:sem-chart-card
      type: vertical-stack
    icon: mdi:lightning-bolt
    path: energy
    title: Energie
    type: panel
  - cards:
    - cards:
      - tab: battery
        type: custom:sem-tab-header
      - entity_prefix: sensor.sem_
        type: custom:sem-battery-card
      - preset: battery
        title: Batterie 24h
        type: custom:sem-chart-card
      - type: custom:sem-battery-zones-card
      type: vertical-stack
    icon: mdi:battery-charging-80
    path: battery
    title: Batterie
    type: panel
  - cards:
    - cards:
      - tab: ev
        type: custom:sem-tab-header
      - entity_prefix: sensor.sem_
        type: custom:sem-ev-status-card
      - series:
        - color: '#8DC892'
          entity: sensor.sem_charger_ev_charger_power
          group_by:
            duration: 5m
            func: avg
          name: Go-e 22kW
          opacity: 0.5
          stroke_width: 2
          type: area
        - color: '#64B5F6'
          entity: sensor.sem_charger_ev_charger_1_power
          group_by:
            duration: 5m
            func: avg
          name: Go-e 11kW
          opacity: 0.5
          stroke_width: 2
          type: area
        stacked: true
        title: EV-Ladeleistung
        type: custom:sem-chart-card
        y_label: W
      - entity_prefix: sensor.sem_
        type: custom:sem-ev-progress-card
      type: vertical-stack
    icon: mdi:car-electric
    path: ev
    title: EV
    type: panel
  - cards:
    - cards:
      - tab: control
        type: custom:sem-tab-header
      - entity_prefix: sensor.sem_
        type: custom:sem-control-card
      - subtitle: "Tarifzeitfenster \xB7 Nachtladen \xB7 \xDCberschussprognose"
        title: Heutiger Zeitplan
        type: custom:sem-title-card
      - entity_prefix: sensor.sem_
        type: custom:sem-schedule-card
      - subtitle: "Ger\xE4tepriorit\xE4t"
        title: Lastmanagement
        type: custom:sem-title-card
      - entity_prefix: sensor.sem_
        type: custom:sem-load-priority-card
      type: vertical-stack
    icon: mdi:tune-vertical
    path: control
    title: Steuerung
    type: panel
  - cards:
    - cards:
      - tab: config
        type: custom:sem-tab-header
      - entity_prefix: sensor.sem_
        type: custom:sem-config-card
      type: vertical-stack
    icon: mdi:cog-outline
    path: config
    title: Konfiguration
    type: panel
  - cards:
    - cards:
      - tab: costs
        type: custom:sem-tab-header
      - entity: sensor.sem_tariff_current_import_rate
        type: custom:sem-price-card
      - type: custom:sem-costs-card
      - card_mod:
          style: "ha-card {\n  background-color: var(--card-background-color) !important;\n\
            \  color: var(--primary-text-color) !important;\n  border: 1px solid var(--divider-color)\
            \ !important;\n  border-radius: 16px !important;\n  box-shadow: var(--ha-card-box-shadow,\
            \ 0 2px 8px rgba(0,0,0,0.08)) !important;\n  max-width: 900px !important;\n\
            \  font-family: 'Segoe UI','Roboto',sans-serif !important;\n  transition:\
            \ box-shadow 0.3s cubic-bezier(0.4,0,0.2,1), border-color 0.3s cubic-bezier(0.4,0,0.2,1)\
            \ !important;\n  --chip-background: var(--secondary-background-color);\n\
            \  --primary-font-family: 'Segoe UI','Roboto',sans-serif;\n}\nha-card:hover\
            \ {\n  box-shadow: var(--ha-card-box-shadow, 0 4px 16px rgba(0,0,0,0.12))\
            \ !important;\n}\n"
        default_period: week
        type: custom:sem-period-selector-card
      - card_mod:
          style: "ha-card {\n  background-color: var(--card-background-color) !important;\n\
            \  color: var(--primary-text-color) !important;\n  border: 1px solid var(--divider-color)\
            \ !important;\n  border-radius: 16px !important;\n  box-shadow: var(--ha-card-box-shadow,\
            \ 0 2px 8px rgba(0,0,0,0.08)) !important;\n  max-width: 900px !important;\n\
            \  font-family: 'Segoe UI','Roboto',sans-serif !important;\n  transition:\
            \ box-shadow 0.3s cubic-bezier(0.4,0,0.2,1), border-color 0.3s cubic-bezier(0.4,0,0.2,1)\
            \ !important;\n  --chip-background: var(--secondary-background-color);\n\
            \  --primary-font-family: 'Segoe UI','Roboto',sans-serif;\n}\nha-card:hover\
            \ {\n  box-shadow: var(--ha-card-box-shadow, 0 4px 16px rgba(0,0,0,0.12))\
            \ !important;\n}\n"
        preset: costs
        type: custom:sem-chart-card
      - card_mod:
          style: "ha-card {\n  background-color: var(--card-background-color) !important;\n\
            \  color: var(--primary-text-color) !important;\n  border: 1px solid var(--divider-color)\
            \ !important;\n  border-radius: 16px !important;\n  box-shadow: var(--ha-card-box-shadow,\
            \ 0 2px 8px rgba(0,0,0,0.08)) !important;\n  max-width: 900px !important;\n\
            \  font-family: 'Segoe UI','Roboto',sans-serif !important;\n  transition:\
            \ box-shadow 0.3s cubic-bezier(0.4,0,0.2,1), border-color 0.3s cubic-bezier(0.4,0,0.2,1)\
            \ !important;\n  --chip-background: var(--secondary-background-color);\n\
            \  --primary-font-family: 'Segoe UI','Roboto',sans-serif;\n}\nha-card:hover\
            \ {\n  box-shadow: var(--ha-card-box-shadow, 0 4px 16px rgba(0,0,0,0.12))\
            \ !important;\n}\n"
        preset: savings
        type: custom:sem-chart-card
      - entity_prefix: sensor.sem_
        type: custom:sem-costs-detail-card
      type: vertical-stack
    icon: mdi:cash-multiple
    path: costs
    title: Kosten
    type: panel
  - cards:
    - cards:
      - tab: system
        type: custom:sem-tab-header
      - entity_prefix: sensor.sem_
        type: custom:sem-system-card
      - type: custom:sem-grid-card
      - preset: power
        title: "Prognose vs Tats\xE4chlich"
        type: custom:sem-chart-card
      type: vertical-stack
    icon: mdi:heart-pulse
    path: system
    title: System
    type: panel
