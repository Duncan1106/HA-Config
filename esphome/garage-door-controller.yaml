substitutions:
  name: "garage-door-controller"
  friendly_name: Garage Door Controller

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false

esp8266:
  board: esp01_1m

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      priority: 10
      manual_ip: 
        gateway: 192.168.2.1
        dns1: 192.168.2.1
        static_ip: 192.168.2.43
        subnet: 255.255.255.0
    - ssid: !secret wifi_ssid2
      password: !secret wifi_password
      priority: 8
      manual_ip: 
        gateway: 192.168.2.1
        dns1: 192.168.2.1
        static_ip: 192.168.2.43
        subnet: 255.255.255.0

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "GarageController"
    password: !secret ap_password

captive_portal:

logger:
  baud_rate: 0
  level: INFO

api:
  encryption: 
    key: "1hpqf+EXz5zZDzt0CuNgoJxXqRoLlZJbJRXychQc3tE="

ota:
  - platform: esphome
    password: !secret ota_password

time:
  - platform: homeassistant
    on_time: 
      days_of_week: SUN
      hours: 3
      minutes: 0
      then: 
        - button.press: restart_btn

uart:
  baud_rate: 115200
  tx_pin: GPIO1
  rx_pin: GPIO3

button:
  - platform: restart
    id: restart_btn
    name: "Restart"

binary_sensor:
  - platform: homeassistant
    entity_id: binary_sensor.garagedoor_zigbee_contact
    id: garagedoor_sensor
    entity_category: diagnostic

  - platform: status
    name: "Status"

switch:
  - platform: template
    name: Open Confirm
    internal: True
    id: open_confirm
    optimistic: True
    on_turn_on: 
      then:
        - delay: 5s
        - switch.turn_off: open_confirm           

  - platform: template
    id: cc
    name: Close
    turn_on_action:
      - uart.write: [0xA0, 0x01, 0x01, 0xA2]
    turn_off_action:
      - uart.write: [0xA0, 0x01, 0x00, 0xA1]
    internal: True

  - platform: template
    id: oc
    name: Open
    turn_on_action:
      - uart.write: [0xA0, 0x02, 0x01, 0xA3]
    turn_off_action:
      - uart.write: [0xA0, 0x02, 0x00, 0xA2]
    internal: True

cover:
  - platform: template
    name: "Garage Door"
    lambda: |-
      if (id(garagedoor_sensor).state) {
        return COVER_OPEN;
      } else {
        return COVER_CLOSED;
      }
    open_action:
      - if: 
          condition:
            - switch.is_off: open_confirm
          then:
            - switch.turn_on: open_confirm
          else:
            # Cancel any previous action
            - switch.turn_off: cc
            # Turn the OPEN switch on briefly
            - switch.turn_on: oc
            - delay: 0.1s
            - switch.turn_off: oc
            - switch.turn_off: open_confirm
    close_action:
            # Cancel any previous action
            - switch.turn_off: oc
            # Turn the OPEN switch on briefly
            - switch.turn_on: cc
            - delay: 0.1s
            - switch.turn_off: cc
    # stop_action: 
    #   then:
    #     - switch.turn_on: cc
    #     - delay: 0.01s 
    #     - switch.turn_on: oc
    #     - delay: 0.2s
    #     - switch.turn_off: cc
    #     - delay: 0.01s
    #     - switch.turn_off: oc
    #optimistic: True
    assumed_state: true
    device_class: garage

text_sensor:
  - platform: wifi_info
    ip_address: 
      name: IP Address

sensor:
  - platform: uptime
    name: Uptime
    device_class: duration
    state_class: total
    update_interval: 5s
    filters: 
      - or: 
        - throttle: 60s
        - delta: 5%

  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: WiFi Signal
    id: wifi_signal_db
    update_interval: 120s
    entity_category: "diagnostic"