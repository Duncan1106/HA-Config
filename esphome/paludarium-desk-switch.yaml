substitutions:
  manufacturer: Tuya
  model: HC-S050-WIFI

esphome:
  name: usb-relay-adapter
  friendly_name: Paludarium Desk
  comment: bk72xx, usb, HC-S050-WIFI
  on_boot: 
    then:
      - delay: 120s
      - if: 
          condition: 
            - sun.is_above_horizon:    
          then:
          - switch.turn_on: relay
          else:
            - switch.turn_off: relay


bk72xx:
  board: generic-bk7231n-qfn32-tuya

logger:
  baud_rate: 0
  level: INFO

# Enable Home Assistant API
api:
  encryption:
    key: "ZRREM2ML8xtwkvhE4WS/RtjR2xqye2fOEKYJLn9Kv9o="

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  reboot_timeout: 5min
  #fast_connect: True
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      manual_ip: 
        static_ip: 192.168.2.39
        gateway: 192.168.2.1
        dns1: 192.168.2.1
        subnet: 255.255.255.0
    - ssid: !secret wifi_ssid2
      password: !secret wifi_password
      manual_ip: 
        gateway: 192.168.2.1
        dns1: 192.168.2.1
        static_ip: 192.168.2.39
        subnet: 255.255.255.0

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Paludarium-Desk-Switch"
    password: !secret ap_password

captive_portal:

interval:
  interval: 
    minutes: 5
  then:
    - if:
        condition:
          - sun.is_above_horizon:
              elevation: 5°
        then:
          - switch.turn_on: relay
        else:
          - switch.turn_off: relay


time:
  - platform: homeassistant

sun:
  latitude: !secret latitude
  longitude: !secret longitude
  on_sunrise:
    elevation: 5°
    then:
      - switch.turn_on: relay 

  on_sunset: 
    elevation: 5°
    then:
      - switch.turn_off: relay

button:
  - platform: restart
    name: Restart

switch:
  - platform: gpio
    id: relay
    name: "Relay"
    pin: P7
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on: 
      then:
        - if: 
            condition: 
              - sun.is_below_horizon: 
                  elevation: 5°
            then:
              - delay: 1s
              - switch.turn_off: relay
    on_turn_off: 
      then:
        - if: 
            condition: 
              - sun.is_above_horizon:
                  elevation: 5°
            then: 
              - delay: 1s 
              - switch.turn_on: relay

light:
  - platform: status_led
    name: "Status LED"
    disabled_by_default: true
    entity_category: diagnostic
    pin:
      number: P6
      inverted: true

text_sensor:
  - platform: wifi_info
    ip_address: 
      name: IP Address
    ssid: 
      name: SSID

sensor:
  - platform: uptime
    name: Uptime
  - platform: wifi_signal
    name: Wifi Signal

binary_sensor:
  - platform: status
    name: Status
  - platform: gpio
    id: btn
    pin:
      number: P8
      inverted: true
      mode:
        input: true
        pullup: true
    name: Side button
    on_release:
      then:
        - switch.toggle: relay