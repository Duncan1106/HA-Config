substitutions:
  name: esp32-c3-mini--terrarium-lights
  friendly_name: esp32 c3 mini - Terrarium Lights

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2024.6.0
  name_add_mac_suffix: false

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

# Enable logging
logger:
  level: VERBOSE
  initial_level: INFO

select:
  - platform: logger
    name: Logger Level 
    id: logger_select

# Enable Home Assistant API
api:
  encryption:
    key: "6Gbz4ylFizzAHNikY+lJKB4/75n31KvmBIjRudqOXoQ="

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      priority: 10
      # manual_ip: 
      #   gateway: 192.168.2.1
      #   dns1: 192.168.2.1
      #   static_ip: 192.168.2.45
      #   subnet: 255.255.255.0
    - ssid: !secret wifi_ssid2
      password: !secret wifi_password
      priority: 8
      # manual_ip: 
      #   gateway: 192.168.2.1
      #   dns1: 192.168.2.1
      #   static_ip: 192.168.2.45
      #   subnet: 255.255.255.0

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Terrarium Light Fallback Hotspot"
    password: !secret ap_password

captive_portal:

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP Address

output:
  - platform: gpio
    pin: 
      number: GPIO8
      ignore_strapping_warning: True
      inverted: True
    id: led_blue
  
  - platform: ledc
    pin: 
      number: GPIO9
      ignore_strapping_warning: True
    frequency: 600
    zero_means_zero: True
    id: pin_9_out
    min_power: 0.05

  - platform: ledc
    pin: GPIO7
    frequency: 600
    zero_means_zero: True
    id: pin_7_out
    min_power: 0.05

light:
  - platform: cwww
    name: Light Bar
    cold_white: pin_9_out
    warm_white: pin_7_out
    constant_brightness: True
    cold_white_color_temperature: 6500K
    warm_white_color_temperature: 2700K

button:
  - platform: output
    output: led_blue
    name: Status LED
    duration: 
      milliseconds: 250

  - platform: restart
    name: Restart

binary_sensor:
  - platform: status
    name: Status

sensor:  
  - platform: uptime
    name: Uptime
    update_interval: 5s
    filters:
      - or:
        - throttle: 60s
        - delta: 5%

  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 5s
    entity_category: "diagnostic"
    filters: 
        - or: 
          - throttle: 120s
          - delta: 2%