substitutions:
  max_brightness: "100%"

esphome:
  name: esp32-c6-zero--paludarium
  friendly_name: esp32 c6 zero - paludarium
  on_boot:
    then:
      - delay: 15s
      - if:
          condition:
            - sun.is_above_horizon:
          then:
            - light.turn_on:
                id: ws2812led
                red: 100%
                green: 75%
                blue: 55%
                brightness: ${max_brightness}
                transition_length: 10s

esp32:
  board: esp32-c6-devkitc-1
  variant: ESP32C6
  framework:
    type: esp-idf

packages:
  - !include common/logger.yaml
  - !include common/common_things.yaml

api:
  encryption:
    key: UVFhTlmB6FPiBpVS3T8B12vC3wXal8IPevUv8YtQ++M=
ota:
  - platform: esphome
    encryption: 

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Esp32-C6-Zero--Paludarium
    password: !secret ap_password
  enable_btm: true
  enable_rrm: true

captive_portal:

time:
  - platform: sntp

sun:
  latitude: !secret latitude
  longitude: !secret longitude
  on_sunrise:
    elevation: 2°
    then:
      - button.press: sunrise
  on_sunset:
    elevation: 2°
    then:
      - button.press: sunset

i2c:
  sda: GPIO21
  scl: GPIO22

# --- Pumpe (IN1/IN2) und Lüfter (IN3/IN4) am DRV8833 ---
output:
  - platform: ledc
    id: pumpe_a
    pin: GPIO0
    frequency: 20kHz
  - platform: ledc
    id: pumpe_b
    pin: GPIO1
    frequency: 20kHz
  - platform: ledc
    id: luefter_a
    pin: GPIO3
    frequency: 500Hz
  - platform: ledc
    id: luefter_b
    pin:
      number: GPIO4
      ignore_strapping_warning: true
    frequency: 500Hz

fan:
  - platform: hbridge
    id: pumpe
    name: "Pumpe"
    pin_a: pumpe_a
    pin_b: pumpe_b
    decay_mode: slow
    speed_count: 10
  - platform: hbridge
    id: luefter
    name: "Lüfter"
    pin_a: luefter_a
    pin_b: luefter_b
    decay_mode: slow
    speed_count: 10

# --- LED-Ring 12 + 3 in der Mitte (Ring zuerst, dann die 3 Mittel-LEDs) ---
light:
  - platform: esp32_rmt_led_strip
    id: ws2812led
    name: LED
    pin: GPIO14
    num_leds: 9
    channel_colors: GRB
    chipset: WS2812
    on_turn_on:
      then:
        - if:
            condition:
              - switch.is_on: enable_day_cycle
              - sun.is_below_horizon:
                  elevation: 2°
            then:
              - delay: 1s
              - light.turn_off: ws2812led
    on_turn_off:
      then:
        - if:
            condition:
              - switch.is_on: enable_day_cycle
              - sun.is_above_horizon:
                  elevation: 2°
            then:
              - delay: 1s
              - light.turn_on:
                  id: ws2812led
                  red: 100%
                  green: 75%
                  blue: 55%
                  brightness: ${max_brightness}
                  transition_length: 10s

button:
  - platform: restart
    name: "Sensor Restart"

  - platform: template
    id: sunrise
    name: Sunrise
    on_press:
      then:
        - if:
            condition:
              light.is_off: ws2812led
            then:
              - light.turn_on:
                  id: ws2812led
                  brightness: 15%
                  red: 100%
                  green: 75%
                  blue: 55%
                  transition_length: 10s
              - delay: 5s
              - light.turn_on:
                  id: ws2812led
                  brightness: ${max_brightness}
                  red: 100%
                  green: 75%
                  blue: 55%
                  transition_length: 300s
            else:
              - light.turn_on:
                  id: ws2812led
                  brightness: ${max_brightness}
                  red: 100%
                  green: 75%
                  blue: 55%

  - platform: template
    id: sunset
    name: Sunset
    on_press:
      then:
        - light.turn_on:
            id: ws2812led
            brightness: ${max_brightness}
            red: 100%
            green: 75%
            blue: 55%
        - light.control:
            id: ws2812led
            brightness: 0%
            transition_length: 300s
            state: false

# --- Einstellungen (bleiben im ESP gespeichert) ---
number:
  - platform: template
    id: glas_temp_annahme
    name: "Glastemperatur Annahme"
    unit_of_measurement: "°C"
    device_class: temperature
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 20
    min_value: 5
    max_value: 35
    step: 0.5

  - platform: template
    id: abstand_ein
    name: "Lüfter Abstand Taupunkt"
    unit_of_measurement: "K"
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 2
    min_value: 0
    max_value: 10
    step: 0.5

  - platform: template
    id: luefter_stufe
    name: "Lüfter Stufe"
    optimistic: true
    restore_value: true
    initial_value: 4
    min_value: 1
    max_value: 10
    step: 1

  - platform: template
    id: pumpe_stufe
    name: "Pumpe Stufe"
    optimistic: true
    restore_value: true
    initial_value: 5
    min_value: 1
    max_value: 10
    step: 1

  - platform: template
    id: pumpe_an_s
    name: "Pumpe an (s von 10)"
    unit_of_measurement: "s"
    optimistic: true
    restore_value: true
    initial_value: 3
    min_value: 1
    max_value: 9
    step: 1

switch:
  - platform: template
    id: enable_day_cycle
    name: Enable LED Daycycle
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: luefter_auto
    name: "Lüfter Automatik"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_off_action:
      - fan.turn_off: luefter

  - platform: template
    id: pumpe_auto
    name: "Pumpe Automatik"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_off_action:
      - fan.turn_off: pumpe

globals:
  - id: fan_wanted
    type: bool
    initial_value: 'false'

