substitutions:
  name: "esp32-s3-zero-lichtschranke"
  friendly_name: s3-zero-lichtschranke
  update_interval: 45ms
  max_clamp: '1.10'

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  platformio_options:
    board_build.flash_mode: dio
  on_boot: 
    then:
      - delay: 10s
      - light.turn_on:
          id: big_led
          transition_length: 0.1s
          brightness: !lambda return id(led_brightness).state / 100;
          
esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

# Enable logging
logger:
  level: VERY_VERBOSE
  initial_level: INFO

# Enable Home Assistant API
api:

# Allow Over-The-Air updates
ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  output_power: 8.5dB
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip: 
    gateway: 192.168.2.1
    dns1: 192.168.2.1
    static_ip: 192.168.2.46
    subnet: 255.255.255.0

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Lichtschranke Fallback Hotspot"
    password: !secret ap_password
    
captive_portal:

i2c:
  - scl: GPIO1
    sda: GPIO2
    scan: False
    id: bus_a
  - id: bus_b
    scl: 
      number: GPIO3
      ignore_strapping_warning: true
    sda: GPIO4
    scan: False

script:
  - id: turn_off_led_after_x_minutes
    mode: restart
    then:
      - if:
          condition:
            - switch.is_on: test_occupancy
          then:
            - delay: !lambda return (id(led_on_time).state) * 1000;
            - light.turn_off: big_led

time:
  - platform: homeassistant

sun:
  latitude: !secret latitude
  longitude: !secret longitude
      
button:
  - platform: restart
    id: restart_btn
    name: "Sensor Restart"
    
light: 
  - platform: esp32_rmt_led_strip
    num_leds: 7
    pin: GPIO5
    name: Big Led
    id: big_led
    rgb_order: GRB
    chipset: WS2812
    restore_mode: RESTORE_DEFAULT_OFF
    effects:
      - addressable_rainbow:
      - addressable_color_wipe:
      - addressable_scan:
      - addressable_twinkle:
      - addressable_flicker:
      - addressable_fireworks:
          name: Fireworks
      - addressable_fireworks:
          name: Fireworks Effect Color
          update_interval: 75ms
          spark_probability: 20%
          use_random_color: true
          fade_out_rate: 200
    on_turn_on: 
      then:
        - script.execute: turn_off_led_after_x_minutes

select:
  - platform: logger
    id: logger_select
    name: Logger Level

switch:
  - platform: template
    optimistic: True
    id: test_occupancy
    name: Enable Occupancy
    restore_mode: RESTORE_DEFAULT_ON

binary_sensor:
  - platform: homeassistant
    id: chair_occupied
    name: Chair Occupied
    entity_id: binary_sensor.nous_chair_sensor_zigbee_water_leak
    internal: True
    trigger_on_initial_state: True
    device_class: occupancy

  - platform: template
    id: room_occupied
    name: "Room Occupied"
    condition:
      - and:
        - switch.is_on: test_occupancy
        - or:
          - number.in_range:
              id: person_counter
              above: 0.5
          - binary_sensor.is_on: chair_occupied
    filters: 
      - delayed_off: 2s
          
  - platform: status
    name: Status

  - platform: template
    id: detect_on_aussen
    internal: False
    name: "detect_on_aussen"
    filters:
      - delayed_off: 400ms
    lambda: !lambda |-
        return id(distance1).state < (id(detection_threshold).state);
    on_state_change: 
      then:
        - if: 
            condition:
              for:
                time: 2min
                condition: 
                  - binary_sensor.is_on: detect_on_aussen
            then:
              - button.press: restart_btn
    on_state:
      - if: 
          condition:
            - switch.is_on: test_occupancy
          then:
            - if:
                condition:
                  - binary_sensor.is_on: detect_on_aussen
                  - binary_sensor.is_off: detect_on_innen
                then:
                  - wait_until:
                      timeout: !lambda return id(timeout_detection).state * 1000;
                      condition: 
                        - binary_sensor.is_on: detect_on_innen 
                  - if:
                      condition: 
                        - binary_sensor.is_on: detect_on_innen
                      then:
                        - number.increment:
                            id: person_counter
                            cycle: False
                  - delay: 100ms
          
  - platform: template
    id: detect_on_innen
    internal: False
    name: "detect_on_innen"
    filters:
      - delayed_off: 400ms
    lambda: !lambda |-
        return id(distance2).state < (id(detection_threshold).state);
    on_state_change: 
      then:
        - if: 
            condition:
              for:
                time: 2min
                condition:
                  - binary_sensor.is_on: detect_on_innen
            then:
              - button.press: restart_btn
    on_state:
      - if: 
          condition:
            - switch.is_on: test_occupancy
          then:
            - if:
                condition:
                  - binary_sensor.is_on: detect_on_innen
                  - binary_sensor.is_off: detect_on_aussen
                then:
                  - wait_until:
                      timeout: !lambda return id(timeout_detection).state * 1000;
                      condition: 
                        - binary_sensor.is_on: detect_on_aussen
                  - if: 
                      condition:
                        - binary_sensor.is_on: detect_on_aussen
                      then:
                        - number.decrement: 
                            id: person_counter
                            cycle: false
                  - delay: 100ms

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP Address

number:
  - platform: template
    max_value: 100
    min_value: 0
    step: 1
    name: Min Brightness
    id: min_brightness
    optimistic: True
    restore_value: True
    disabled_by_default: True
    initial_value: 20
    unit_of_measurement: '%'

  - platform: template
    max_value: 10
    min_value: 1
    step: 0.5
    unit_of_measurement: s
    name: Timeout Detection
    id: timeout_detection
    mode: BOX
    optimistic: True
    restore_value: True
    disabled_by_default: True

  - platform: template
    min_value: 10
    max_value: 180
    step: 5
    unit_of_measurement: s
    optimistic: True
    restore_value: True
    mode: BOX
    name: Led On Time
    id: led_on_time
    disabled_by_default: True

  - platform: template
    max_value: 1.5
    min_value: 0.1
    initial_value: 0.9
    step: 0.01
    name: "Detection Threshold"
    optimistic: True
    id: detection_threshold
    mode: BOX
    restore_value: True
    unit_of_measurement: m
    disabled_by_default: True
  
  - platform: template
    restore_value: True
    name: "Person Counter"
    optimistic: True
    min_value: 0
    max_value: 5
    initial_value: 0
    step: 1
    unit_of_measurement: "person(s)"
    id: person_counter
    on_value_range: 
      - below: 0.5
        then:
          - light.turn_off: big_led
          - delay: 50ms
          - light.turn_on:
              id: big_led
              transition_length: 0.01s
              brightness: !lambda return id(led_brightness).state / 100;
              red: 100%
              green: 100%
              blue: 100%
      - above: 0.5
        below: 1.5
        then:
          - light.turn_off: big_led
          - delay: 50ms
          - light.turn_on: 
              id: big_led
              transition_length: 0.01s
              brightness: !lambda return id(led_brightness).state / 100;
              red: 10%
              green: 100%
              blue: 10%
      - above: 1.5
        below: 2.5
        then:
          - light.turn_off: big_led
          - delay: 50ms
          - light.turn_on:
              id: big_led
              transition_length: 0.01s
              brightness: !lambda return id(led_brightness).state / 100;
              red: 70%
              green: 10%
              blue: 100%
      - above: 2.5
        below: 3.5
        then:
          - light.turn_off: big_led
          - delay: 50ms
          - light.turn_on: 
              id: big_led
              transition_length: 0.01s
              brightness: !lambda return id(led_brightness).state / 100;
              red: 10%
              green: 10%
              blue: 100%
      - above: 3.5
        below: 4.5
        then:
          - light.turn_off: big_led
          - delay: 50ms
          - light.turn_on: 
              id: big_led
              transition_length: 0.01s
              brightness: !lambda return id(led_brightness).state / 100;
              red: 80%
              green: 60%
              blue: 40%
      - above: 4.5
        then:
          - light.turn_off: big_led
          - delay: 50ms
          - light.turn_on: 
              id: big_led
              transition_length: 0.01s
              brightness: !lambda return id(led_brightness).state / 100;
              red: 100%
              green: 10%
              blue: 10%
              
sensor:
  - platform: template
    name: "Brightness Percentage"
    unit_of_measurement: "%"
    id: led_brightness
    accuracy_decimals: 1
    lambda: |-
      float min_brightness_var = id(min_brightness).state;
      float elevation_brightness = (id(elevation).state / 30.0) * 100.0;
      return (elevation_brightness < min_brightness_var) ? min_brightness_var : elevation_brightness;
    update_interval: 5s
    filters:
      - clamp: 
          min_value: 0
          max_value: 100
      - or:
        - delta: 1%
        - throttle: 60s
             
  - platform: sun
    name: Sun Elevation
    internal: True
    id: elevation
    type: elevation
    update_interval: 1s
    filters:
      - offset: 10
      - clamp: 
          min_value: 0
      - round: 0
      - or:
        - throttle: 30s
        - delta: 20%

  - platform: vl53l0x
    name: "Aussen"
    id: distance1
    address: 0x29
    timeout: 500us
    signal_rate_limit: 0.5
    update_interval: ${update_interval}
    unit_of_measurement: "m"
    long_range: False
    accuracy_decimals: 3
    internal: False
    disabled_by_default: True
    i2c_id: bus_a
    filters:
      - filter_out: nan
      - clamp:
          min_value: 0.1
          max_value: ${max_clamp}

  - platform: vl53l0x
    name: "Innen"
    id: distance2
    address: 0x29
    timeout: 500us
    signal_rate_limit: 0.5
    update_interval: ${update_interval}
    unit_of_measurement: "m"
    long_range: False
    accuracy_decimals: 3
    internal: False
    disabled_by_default: True
    i2c_id: bus_b
    filters:
      - filter_out: nan
      - clamp:
          min_value: 0.1
          max_value: ${max_clamp}

  - platform: wifi_signal
    accuracy_decimals: 1
    name: Wifi Signal
    update_interval: 5s
    filters: 
      - or: 
        - delta: 5%
        - throttle: 120s
  
  - platform: uptime
    name: Uptime
    update_interval: 3s
    device_class: duration
    accuracy_decimals: 1
    state_class: total
    unit_of_measurement: min
    filters:
      - lambda: !lambda 'return x / 60;' 
      - or:
        - delta: 5%
        - throttle: 120s