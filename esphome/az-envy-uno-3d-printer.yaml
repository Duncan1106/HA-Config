substitutions:
  name: esphome-az-envy-3
  room: 3D Printer
  boardPlatform: ESP8266
  boardName: nodemcuv2
  temperature_offset: "-10.0"
  humidity_offset: "8.0"

esphome:
  name: ${name}
  friendly_name: AZ-Envy Uno ${room}

esp8266:
  board: ${boardName}

# Enable logging
logger:
  level: INFO

# Enable Home Assistant API
api:
  encryption: 
    key: !secret az_envy_3d

ota:
  - platform: esphome

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      manual_ip: 
        gateway: 192.168.2.1
        subnet: 255.255.255.0
        dns1: 192.168.2.1
        static_ip: 192.168.2.47
    - ssid: !secret wifi_ssid2
      password: !secret wifi_password
      manual_ip: 
        gateway: 192.168.2.1
        subnet: 255.255.255.0
        dns1: 192.168.2.1
        static_ip: 192.168.2.47

  ap:
    ssid: "AZENVY-AP-${room}"
    password: !secret ap_password

i2c:
  - sda: GPIO4
    scl: GPIO5
    scan: False
    id: bus_a

sensor:
  - platform: absolute_humidity
    humidity: humidity
    temperature: temperature
    name: Absolute Humidity
    unit_of_measurement: g/m³
    state_class: measurement
    entity_category: diagnostic

  - platform: sht3xd
    i2c_id: bus_a
    address: 0x44
    
    temperature:
      name: "Temperature ${room}" 
      id: "temperature"
      filters:
        - offset: ${temperature_offset}
        - or:
          - throttle: 60s
          - delta: 3%
    humidity:
      name: "Humidity ${room}"
      id: "humidity"
      filters:
        - offset: ${humidity_offset}
        - or:
          - throttle: 60s
          - delta: 3%
    update_interval: 5s

  - platform: adc
    pin: A0
    name: "Gas Sensor ${room}"
    id: "gas_sensor"
    update_interval: 2s
    filters:
      - lambda: !lambda return (x * 1024/5);
      - or:
        - throttle: 60s
        - delta: 3% 
    unit_of_measurement: "ppm"
    device_class: gas
    icon: "mdi:meter-gas"

  - platform: adc
    pin: VCC
    name: "VCC Voltage ${name} ${room}"
    entity_category: diagnostic
    state_class: measurement
    device_class: voltage

  - platform: uptime
    name: Uptime
    entity_category: diagnostic

  # WiFi Signal sensor.
  - platform: wifi_signal
    name: ${name} ${room} WiFi Signal
    update_interval: 60s
    entity_category: diagnostic

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP Address

binary_sensor:
  - platform: analog_threshold
    name: "Dangerous Gas ${room}"
    sensor_id: gas_sensor
    threshold: 500.0

  - platform: status
    entity_category: diagnostic
    name: "${name} ${room} Status"

button:
  - platform: restart
    name: "Restart ${name} ${room}"

  - platform: shutdown
    name: "Shutdown ${name} ${room}"