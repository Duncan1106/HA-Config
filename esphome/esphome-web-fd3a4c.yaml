substitutions:
  name: esp32-c3-mini--boiler
  friendly_name: esp32 c3 mini - boiler

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2024.6.0
  name_add_mac_suffix: false

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

# Enable logging
logger:
  level: VERBOSE
  initial_level: INFO

select:
  - platform: logger
    name: Logger Level 
    id: logger_select

# Enable Home Assistant API
api:
  encryption:
    key: "IvriLmLg0wr1qbjcyDo6VTGAMUovlf9m6MXTcgv/aZ0="

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      priority: 10
      manual_ip: 
        gateway: 192.168.2.1
        dns1: 192.168.2.1
        static_ip: 192.168.2.45
        subnet: 255.255.255.0
    - ssid: !secret wifi_ssid2
      password: !secret wifi_password
      priority: 8
      manual_ip: 
        gateway: 192.168.2.1
        dns1: 192.168.2.1
        static_ip: 192.168.2.45
        subnet: 255.255.255.0

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Boiler Fallback Hotspot"
    password: !secret ap_password

captive_portal:

mqtt:
  broker: 192.168.2.204
  discovery: false
  log_topic: null

one_wire:
  - platform: gpio
    pin: GPIO5

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP Address
      state_topic: null

output:
  - platform: gpio
    pin: 
      number: GPIO8
      ignore_strapping_warning: True
      inverted: True
    id: led_blue

button:
  - platform: output
    output: led_blue
    name: Status LED
    duration: 
      milliseconds: 250

  - platform: restart
    name: Restart
    state_topic: null

binary_sensor:
  - platform: status
    name: Status
    state_topic: null

sensor:  
  - platform: dht
    update_interval: 15s
    pin: GPIO4
    temperature: 
      accuracy_decimals: 2
      name: "Heizraum Temperature"
      id: heizraum_temperature
      state_topic: null
      filters:
        - or:
          - throttle: 120s
          - delta: 4%
    humidity: 
      accuracy_decimals: 2
      name: "Heizraum Humidity"
      id: heizraum_humidity
      state_topic: null
      filters:
        - or:
          - throttle: 120s
          - delta: 4%

  - platform: dallas_temp
    resolution: 12
    address: 0xeb01206323092928
    name: "Heizraum Boiler Temperature"
    accuracy_decimals: 2
    update_interval: 5s
    force_update: True
    state_topic: "sensor/boiler/temperature"
    retain: True
    filters: 
      - filter_out: 85.0
      - clamp:
          min_value: 0.0
          max_value: 100.0
      - or:
        - throttle: 120s
        - delta: 10%

  - platform: uptime
    name: Uptime
    state_topic: null
    update_interval: 60s

  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 5s
    entity_category: "diagnostic"
    state_topic: null
    filters: 
        - or: 
          - throttle: 120s
          - delta: 2%
