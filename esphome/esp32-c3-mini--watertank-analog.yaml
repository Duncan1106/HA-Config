esphome:
  name: esp32-c3-mini--watertank-analog
  friendly_name: esp32 c3 mini - watertank Analog

substitutions:
  threshold: "1.15"
  update_interval: 1s
  delay_on_off: 1000ms

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

# Enable logging
logger:
  level: DEBUG
  logs:
    component: ERROR

# Enable Home Assistant API
api:
  encryption:
    key: "HPlni4PXpVCegx3vWuGTn2wFu05FaFJFEpXd4zy6Gxg="

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      priority: 10
      manual_ip: 
        gateway: 192.168.2.1
        subnet: 255.255.255.0
        dns1: 192.168.2.1
        static_ip: 192.168.2.8

    - ssid: !secret wifi_ssid2
      password: !secret wifi_password
      priority: 8
      manual_ip: 
        gateway: 192.168.2.1
        subnet: 255.255.255.0
        dns1: 192.168.2.1
        static_ip: 192.168.2.8

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Esp32-C3-Mini--Watertank"
    password: !secret ap_password

captive_portal:
  
light:  
  - platform: status_led    
    name: "Status LED"    
    id: esp_status_led    
    icon: "mdi:alarm-light"    
    pin:      
      number: GPIO8      
      inverted: true
      ignore_strapping_warning: True
    restore_mode: ALWAYS_OFF

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP Address
    ssid:
      name: SSID
  
button:
  - platform: restart
    name: "Restart"
  - platform: shutdown
    name: "Shutdown"

number:
  - platform: template
    max_value: 100
    min_value: 0
    step: 10
    internal: True
    optimistic: True
    restore_value: True
    mode: BOX
    name: Number Watertank Level
    id: number_watertank_level
  
  - platform: template
    min_value: 0.1
    max_value: 3.3
    step: 0.05
    name: Threshold
    initial_value: 1.15
    optimistic: True
    id: threshold
    restore_value: True
    mode: BOX

cd74hc4067:
  - id: cd74hc4067_1
    delay: 500ms
    pin_s0: GPIO0
    pin_s1: GPIO1
    pin_s2: GPIO2
    pin_s3: GPIO3

sensor:
  - platform: adc
    id: adc_sensor
    attenuation: 12db
    pin: GPIO4
    update_interval: 50ms
    samples: 10

  - platform: cd74hc4067
    number: 0
    accuracy_decimals: 2
    sensor: adc_sensor
    id: number_10
    update_interval: ${update_interval}
    name: Number 10 ADC
    filters:
      - clamp: 
          max_value: 2
          min_value: 0
          ignore_out_of_range: true
  - platform: cd74hc4067
    number: 1
    accuracy_decimals: 2
    sensor: adc_sensor
    id: number_20
    update_interval: ${update_interval}
    name: Number 20 ADC
    filters:
      - clamp: 
          max_value: 2
          min_value: 0
          ignore_out_of_range: true
  - platform: cd74hc4067
    number: 2
    accuracy_decimals: 2
    sensor: adc_sensor
    id: number_30
    update_interval: ${update_interval}
    name: Number 30 ADC
    filters:
      - clamp: 
          max_value: 2
          min_value: 0
          ignore_out_of_range: true
  - platform: cd74hc4067
    number: 3
    accuracy_decimals: 2
    sensor: adc_sensor
    id: number_40
    update_interval: ${update_interval}
    name: Number 40 ADC
    filters:
      - clamp: 
          max_value: 2
          min_value: 0
          ignore_out_of_range: true
  - platform: cd74hc4067
    number: 4
    accuracy_decimals: 2
    sensor: adc_sensor
    id: number_50
    update_interval: ${update_interval}
    name: Number 50 ADC
    filters: 
      - clamp: 
          max_value: 2
          min_value: 0
          ignore_out_of_range: true
  - platform: cd74hc4067
    number: 5
    accuracy_decimals: 2
    sensor: adc_sensor
    id: number_60
    update_interval: ${update_interval}
    name: Number 60 adc
    filters: 
      - clamp: 
          max_value: 2
          min_value: 0
          ignore_out_of_range: true
  - platform: cd74hc4067
    number: 6
    accuracy_decimals: 2
    sensor: adc_sensor
    id: number_70
    update_interval: ${update_interval}
    name: Number 70 ADC
    filters: 
      - clamp: 
          max_value: 2
          min_value: 0
          ignore_out_of_range: true
  - platform: cd74hc4067
    number: 7
    accuracy_decimals: 2
    sensor: adc_sensor
    id: number_80
    update_interval: ${update_interval}
    name: Number 80 ADC
    filters: 
      - clamp: 
          max_value: 2
          min_value: 0
          ignore_out_of_range: true
  - platform: cd74hc4067
    number: 8
    accuracy_decimals: 2
    sensor: adc_sensor
    id: number_90
    update_interval: ${update_interval}
    name: Number 90 ADC
    filters:
      - clamp: 
          max_value: 2
          min_value: 0
          ignore_out_of_range: true
  - platform: cd74hc4067
    number: 9
    accuracy_decimals: 2
    sensor: adc_sensor
    id: number_100
    update_interval: ${update_interval}
    name: Number 99 ADC
    filters: 
      - clamp: 
          max_value: 2
          min_value: 0
          ignore_out_of_range: true
  - platform: cd74hc4067
    number: 15
    accuracy_decimals: 2
    sensor: adc_sensor
    update_interval: ${update_interval}
    name: Return
    filters: 
      - clamp: 
          max_value: 2
          min_value: 0
          ignore_out_of_range: true

  - platform: uptime
    name: Uptime

  - platform: template
    accuracy_decimals: 0
    name: Wasserstand
    id: waterlevel
    unit_of_measurement: '%'
    state_class: measurement
    update_interval: 5s
    filters: 
      - or:
        - delta: 10%
        - throttle: 60s           
    lambda: !lambda return id(number_watertank_level).state;

binary_sensor:
  - platform: status
    name: "Sensor Status"

  - platform: analog_threshold
    sensor_id: number_10
    threshold: ${threshold}
    id: bin_10
    name : 10%
    filters:
      - delayed_on_off: ${delay_on_off}
    on_press: 
      then: 
        - script.execute: get_water_level

  - platform: analog_threshold
    sensor_id: number_20
    threshold: ${threshold}
    id: bin_20
    name: 20%
    filters: 
      - delayed_on_off: ${delay_on_off}
    on_press: 
      then: 
        - script.execute: get_water_level

  - platform: analog_threshold
    sensor_id: number_30
    threshold: ${threshold}
    id: bin_30
    name: 30%
    filters: 
      - delayed_on_off: ${delay_on_off} 
    on_press: 
      then: 
        - script.execute: get_water_level

  - platform: analog_threshold
    sensor_id: number_40
    threshold: ${threshold}
    id: bin_40
    name: 40%
    filters: 
      - delayed_on_off: ${delay_on_off}
    on_press: 
      then: 
        - script.execute: get_water_level

  - platform: analog_threshold
    sensor_id: number_50
    threshold: ${threshold}
    id: bin_50
    name: 50%
    filters: 
      - delayed_on_off: ${delay_on_off}
    on_press: 
      then: 
        - script.execute: get_water_level

  - platform: analog_threshold
    sensor_id: number_60
    threshold: ${threshold}
    id: bin_60
    name: 60%
    filters: 
      - delayed_on_off: ${delay_on_off}
    on_press: 
      then: 
        - script.execute: get_water_level

  - platform: analog_threshold
    sensor_id: number_70
    threshold: ${threshold}
    id: bin_70
    name: 70%
    filters: 
      - delayed_on_off: ${delay_on_off}
    on_press: 
      then: 
        - script.execute: get_water_level

  - platform: analog_threshold
    sensor_id: number_80
    threshold: ${threshold}
    id: bin_80
    name: 80%
    filters: 
      - delayed_on_off: ${delay_on_off}
    on_press: 
      then: 
        - script.execute: get_water_level

  - platform: analog_threshold
    sensor_id: number_90
    threshold: 0.8
    id: bin_90
    name: 90%
    filters: 
      - delayed_on_off: ${delay_on_off}
    on_press: 
      then: 
        - script.execute: get_water_level

  - platform: analog_threshold
    sensor_id: number_100
    threshold: 0.8
    id: bin_100
    name: 99%
    filters: 
      - delayed_on_off: ${delay_on_off}
    on_press: 
      then: 
        - script.execute: get_water_level

script:
  - id: get_water_level
    mode: restart  # Sets script mode to restart on re-trigger
    then:
      - lambda: |-
          int max_value = 0;
          if (id(bin_10).state) { max_value = 10; }
          if (id(bin_20).state) { max_value = 20; }
          if (id(bin_30).state) { max_value = 30; }
          if (id(bin_40).state) { max_value = 40; }
          if (id(bin_50).state) { max_value = 50; }
          if (id(bin_60).state) { max_value = 60; }
          if (id(bin_70).state) { max_value = 70; }
          if (id(bin_80).state) { max_value = 80; }
          if (id(bin_90).state) { max_value = 90; }
          if (id(bin_100).state) { max_value = 100; }
          auto call = id(number_watertank_level).make_call();
          call.set_value(max_value);
          call.perform();