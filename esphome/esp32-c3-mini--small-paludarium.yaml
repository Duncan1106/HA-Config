esphome:
  name: esp32-c3-mini--small-paludarium
  friendly_name: esp32 c3 mini - small paludarium
  platformio_options:
    board_build.flash_mode: dio  
  on_boot:
    then:
      - deep_sleep.prevent: deep_sleep_id
      - delay: 15s
      - if:
          condition:
            - sun.is_above_horizon:
          then:
            - light.turn_on: 
                id: ws2812led
                red: 100%
                green: 75%
                blue: 55%
                brightness: 100%
                transition_length: 10s
      # - delay: 60s
      # - deep_sleep.allow: deep_sleep_id

esp32:
  board: esp32-c3-devkitm-1
  variant: ESP32C3
  framework:
    type: esp-idf

packages:
  - !include common/logger.yaml

deep_sleep:
  run_duration: 2d
  id: deep_sleep_id 
  sleep_duration: 
    minutes: 15

# Enable Home Assistant API
api:
  encryption:
    key: "DWa3VP4c80xtdYR3KIWBUAVljsIrBzuCvlzkPI+5o2g="

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Esp32-C3-Mini--Small-Paludarium
    password: !secret ap_password
  enable_btm: true
  enable_rrm: true
captive_portal:

time:
  - platform: homeassistant

sun:
  latitude: !secret latitude
  longitude: !secret longitude
  on_sunrise:
    elevation: 2°
    then:
      - button.press: sunrise

  on_sunset: 
    elevation: 2°
    then:
      - button.press: sunset

output:
  - platform: gpio
    id: led_status
    pin: 
      number: GPIO8
      inverted: True
      ignore_strapping_warning: True

light:
  - platform: esp32_rmt_led_strip
    num_leds: 7
    id: ws2812led
    #rmt_channel: 0
    pin: GPIO4
    name: LED
    rgb_order: GRB
    chipset: WS2812
    on_turn_on: 
      then:
        - if: 
            condition: 
              - sun.is_below_horizon: 
                  elevation: 2°
            then:
              - delay: 1s
              - light.turn_off: ws2812led
    on_turn_off: 
      then:
        - if: 
            condition: 
              - sun.is_above_horizon:
                  elevation: 2°
            then: 
              - delay: 1s
              - light.turn_on: 
                  id: ws2812led
                  red: 100%
                  green: 75%
                  blue: 55%
                  brightness: 100%
                  transition_length: 10s
  
  - platform: status_led
    name: "Status LED"
    id: esp_status_led
    icon: "mdi:alarm-light"
    output: led_status
    restore_mode: ALWAYS_OFF

button:
  - platform: restart
    name: "Sensor Restart"

  - platform: template
    id: sunrise
    name: Sunrise
    on_press: 
      then:
        - if:
            condition:
              light.is_off: ws2812led
            then:
              - light.turn_on:
                  id: ws2812led
                  brightness: 15%
                  blue: 55%
                  green: 75%
                  red: 100%
                  transition_length: 10s
              - delay: 5s
              - light.turn_on: 
                  id: ws2812led
                  brightness: 100%
                  transition_length: 300s
                  color_brightness: 100%
                  red: 100%
                  green: 75%
                  blue: 55%
            else: 
              - light.turn_on: 
                  id: ws2812led
                  brightness: 100%
                  color_brightness: 100%
                  blue: 55%
                  green: 75%
                  red: 100%

  - platform: template
    id: sunset
    name: Sunset
    on_press: 
      then:
        - light.turn_on:
            id: ws2812led
            brightness: 100%
            color_brightness: 100%
            blue: 55%
            green: 75%
            red: 100%
        - light.control: 
            id: ws2812led
            brightness: 0%
            transition_length: 300s
            state: False
        - delay: 300s
        - delay: 5s
        - deep_sleep.enter: deep_sleep_id


binary_sensor:
  - platform: status
    name: "Sensor Status"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP Address

sensor:
  - platform: wifi_signal
    accuracy_decimals: 1
    name: Wifi Signal
    update_interval: 5s
    filters: 
      - or: 
        - delta: 5%
        - throttle: 120s
  
  - platform: uptime
    name: Uptime
    update_interval: 3s
    device_class: duration
    accuracy_decimals: 1
    state_class: total
    unit_of_measurement: min
    filters:
      - lambda: !lambda 'return x / 60;' 
      - or:
        - delta: 5%
        - throttle: 120s