substitutions:
  name: esp32-c3-mini--picture-light
  friendly_name: esp32 c3 mini - picture light

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2024.6.0
  name_add_mac_suffix: false
  platformio_options:
    board_build.flash_mode: dio  
  on_boot: 
    then:
      - delay: 5s 
      - button.press: button_led_blue

esp32:
  board: esp32-c3-devkitm-1
  variant: ESP32C3
  framework:
    type: esp-idf

packages:
  - !include common/logger.yaml

# Enable Home Assistant API
api:
  encryption:
    key: "lSuTdwPKtxMJ6exak38it7OozeK+Gk+JCYuGyDoHJGs="

# Allow Over-The-Air updates
ota:
- platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    gateway: 192.168.2.1
    dns1: 192.168.2.1
    subnet: 255.255.255.0
    static_ip: 192.168.2.36
  ap:
    ssid: Esp32-C3-Mini--Picture-Light
    password: !secret ap_password
  enable_btm: true
  enable_rrm: true
captive_portal:

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP Address

button:
  - platform: restart
    name: Restart
  - platform: output
    id: button_led_blue
    duration: 
      milliseconds: 100
    output: led_blue
    name: Status LED

binary_sensor:
  - platform: status
    name: Status

output:
  - platform: gpio
    id: led_blue
    pin: 
      number: GPIO8
      ignore_strapping_warning: true
      inverted: True
  - platform: ledc
    pin: GPIO3
    zero_means_zero: True
    frequency: 19531 Hz
    id: light_one

light:
  - platform: monochromatic
    name: "Licht"
    output: light_one
    id: led_pwm
    restore_mode: RESTORE_DEFAULT_OFF

sensor:
  - platform: wifi_signal
    accuracy_decimals: 1
    name: Wifi Signal
    update_interval: 5s
    filters: 
      - or: 
        - delta: 5%
        - throttle: 120s
  
  - platform: uptime
    name: Uptime
    update_interval: 3s
    device_class: duration
    accuracy_decimals: 1
    state_class: total
    unit_of_measurement: min
    filters:
      - lambda: !lambda 'return x / 60;' 
      - or:
        - delta: 5%
        - throttle: 120s