substitutions:
  name: esp32-c3-mini--picture-light
  friendly_name: esp32 c3 mini - picture light

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2024.6.0
  name_add_mac_suffix: false
  platformio_options:
    board_build.flash_mode: dio  
  on_boot: 
    then:
      - delay: 5s 
      - button.press: button_led_blue

esp32:
  board: esp32-c3-devkitm-1
  variant: ESP32C3
  framework:
    type: esp-idf

# Enable logging
logger:
  level: INFO
# Enable Home Assistant API
api:
  encryption:
    key: "lSuTdwPKtxMJ6exak38it7OozeK+Gk+JCYuGyDoHJGs="

# Allow Over-The-Air updates
ota:
- platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip: 
    gateway: 192.168.2.1
    dns1: 192.168.2.1
    subnet: 255.255.255.0
    static_ip: 192.168.2.36

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Esp32-C3-Mini--Picture-Light"
    password: !secret ap_password

captive_portal:

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP Address

button:
  - platform: restart
    name: Restart
  - platform: output
    id: button_led_blue
    duration: 
      milliseconds: 100
    output: led_blue
    name: Status LED

binary_sensor:
  - platform: status
    name: Status

output:
  - platform: gpio
    id: led_blue
    pin: 
      number: GPIO8
      ignore_strapping_warning: true
      inverted: True
  - platform: ledc
    pin: GPIO3
    zero_means_zero: True
    frequency: 100 Hz
    id: light_one

light:
  - platform: monochromatic
    name: "Licht"
    output: light_one
    id: led_pwm
    restore_mode: RESTORE_DEFAULT_OFF

sensor:
  - platform: uptime
    name: Uptime
    device_class: duration

  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: WiFi Signal
    id: wifi_signal_db
    update_interval: 120s
    entity_category: "diagnostic"