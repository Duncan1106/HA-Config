# Combinations
  - platform: combination
    id: bat_soc_avg
    name: SOC Avg
    type: median
    accuracy_decimals: 2
    state_class: measurement
    sources: 
      - source: bat1_soc
      - source: bat2_soc
    filters:
      - clamp: 
          min_value: 0
          max_value: 100
          ignore_out_of_range: true
      - or:
        - throttle: 30s
        - delta: 0.5

  - platform: combination
    id: bat_volt_avg
    name: Voltage Avg
    type: median
    accuracy_decimals: 2
    state_class: measurement
    sources: 
      - source: bat1_volt
      - source: bat2_volt
    filters:
      - clamp: 
          min_value: 40
          max_value: 60
          ignore_out_of_range: true
      - or:
        - throttle: 30s
        - delta: 0.5

