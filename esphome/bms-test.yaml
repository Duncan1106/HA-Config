substitutions:
  friendly_name: "Felicity LiFePO4"
  name: "felicity-ess"

esphome:
  name: $name
  friendly_name: $friendly_name
  devices: 
    - id: bms_bat1
      name: Battery 1
    - id: bms_bat2
      name: Battery 2

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

# Enable Home Assistant API
api:
  encryption:
    key: "q5XLCvBZP/QLn+6hQ37kNs7Ip2C1Tj9m4nNQXBDfiFE="

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  networks: 
    - ssid: !secret wifi_ssid2
      password: !secret wifi_password
      priority: 10
      manual_ip:
        static_ip: 192.168.2.48
        gateway: 192.168.2.1
        subnet: 255.255.255.0
        dns1: 192.168.2.1
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      priority: 6
      manual_ip:
        static_ip: 192.168.2.48
        gateway: 192.168.2.1
        subnet: 255.255.255.0
        dns1: 192.168.2.1
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Bms-Test Fallback Hotspot"
    password: !secret ap_password

captive_portal:

# Enable logging
logger:
  level: DEBUG
  initial_level: INFO

select:
  - platform: logger
    id: logger_select
    name: Logger Level

button: 
  - platform: restart
    name: Restart
    id: restart_btn

uart:
  id: mod_uart
  tx_pin: GPIO21
  rx_pin: GPIO20
  baud_rate: 9600
  parity: NONE
  data_bits: 8
  stop_bits: 1

modbus:
  send_wait_time: 500ms
  uart_id: mod_uart
  id: mod_bus

modbus_controller:
- id: m1
  address: 1
  modbus_id: mod_bus
  command_throttle: 200ms
  setup_priority: -10
  update_interval: 10s

- id: m2
  address: 2
  modbus_id: mod_bus
  command_throttle: 200ms
  setup_priority: -10
  update_interval: 10s

binary_sensor:
  - platform: template
    name: Bat1 Breaker Popped
    id: bat1_breaker_popped_switch
    device_id: bms_bat1
    entity_category: diagnostic
    lambda: |-
      float b1 = id(bat1_curr).state;
      float b2 = id(bat2_curr).state;
      float b1_soc = id(bat1_soc).state;
      float b2_soc = id(bat2_soc).state;
      float b1_volt = id(bat1_volt).state;
      float b2_volt = id(bat2_volt).state;

      // Check for valid numbers (no NANs)
      if (isnan(b1) || isnan(b2) || isnan(b1_soc) || isnan(b2_soc) || isnan(b1_volt) || isnan(b2_volt)) {
        return false;
      }

      // True if Bat1 is dead/isolated while Bat2 is working and has lower potential
      return (b1 == 0.00f && b2 != 0.00f && b1_soc > b2_soc && b1_volt > b2_volt);

  - platform: template
    name: Bat2 Breaker Popped
    id: bat2_breaker_popped_switch
    device_id: bms_bat2
    entity_category: diagnostic
    lambda: |-
      float b1 = id(bat1_curr).state;
      float b2 = id(bat2_curr).state;
      float b1_soc = id(bat1_soc).state;
      float b2_soc = id(bat2_soc).state;
      float b1_volt = id(bat1_volt).state;
      float b2_volt = id(bat2_volt).state;

      if (isnan(b1) || isnan(b2) || isnan(b1_soc) || isnan(b2_soc) || isnan(b1_volt) || isnan(b2_volt)) {
        return false;
      }

      return (b2 == 0.00f && b1 != 0.00f && b2_soc > b1_soc && b2_volt > b1_volt);

  - platform: status
    id: status_connected
    name: Status
    on_release: 
      then:
        - delay: 
            minutes: 1
        - if: 
            condition:
              - binary_sensor.is_off: status_connected
            then:
              - button.press: restart_btn

  # Binary Sensor for Bit 0: Charge enable (0b0001)
  - platform: modbus_controller
    modbus_controller_id: m1
    name: "Bat1 Charge Enabled"
    register_type: holding
    address: 0x1302
    device_id: bms_bat1
    entity_category: diagnostic
    bitmask: 0x01 # Checks if bit 0 is set (Value 1)

  # Binary Sensor for Bit 2: Discharge enable (0b0100)
  - platform: modbus_controller
    modbus_controller_id: m1
    name: "Bat1 Discharge Enabled"
    register_type: holding
    address: 0x1302
    device_id: bms_bat1
    entity_category: diagnostic
    bitmask: 0x04 # Checks if bit 2 is set (Value 4)

  # Binary Sensor for Bit 0: Charge enable (0b0001)
  - platform: modbus_controller
    modbus_controller_id: m2
    name: "Bat2 Charge Enabled"
    register_type: holding
    address: 0x1302
    device_id: bms_bat2
    entity_category: diagnostic
    bitmask: 0x01 # Checks if bit 0 is set (Value 1)

  # Binary Sensor for Bit 2: Discharge enable (0b0100)
  - platform: modbus_controller
    modbus_controller_id: m2
    name: "Bat2 Discharge Enabled"
    register_type: holding
    address: 0x1302
    device_id: bms_bat2
    entity_category: diagnostic
    bitmask: 0x04 # Checks if bit 2 is set (Value 4)

text_sensor:
  - platform: wifi_info
    ip_address: 
      name: IP

  - platform: modbus_controller
    modbus_controller_id: m1
    name: "Bat1 Status Text"
    register_type: holding
    address: 0x1302
    raw_encode: HEXBYTES
    entity_category: diagnostic
    device_id: bms_bat1
    filters:
      - lambda: |-
          uint16_t status = std::stoul(x, nullptr, 16);  // Wandelt den Hex-String in eine Ganzzahl um

          // Prüft die einzelnen Bits und gibt den Text als std::string zurück
          if (status & 0b00000001) return std::string("Charge Enabled");
          if (status & 0b00000010) return std::string("Charge Immediately");
          if (status & 0b00000100) return std::string("Discharge Enabled");
          return std::string("Idle");  // Standardwert, wenn keine Bedingung erfüllt ist

  - platform: modbus_controller
    modbus_controller_id: m1
    name: "Bat1 Fault Status"
    register_type: holding
    address: 0x1304
    raw_encode: HEXBYTES
    entity_category: diagnostic
    device_id: bms_bat1
    filters:
      - lambda: |-
          uint16_t status = std::stoul(x, nullptr, 16);  // Wandelt den Hex-String in eine Ganzzahl um

          // Fehlerprüfung basierend auf den einzelnen Bits
          if (status & 0b0000001000000000) return std::string("Cell Temperature High Fault");
          if (status & 0b0000000100000000) return std::string("Cell Temperature Low Fault");
          if (status & 0b0000000010000000) return std::string("BMS Temperature High Fault");
          if (status & 0b0000000001000000) return std::string("Discharge Current High Fault");
          if (status & 0b0000000000100000) return std::string("Charge Current High Fault");
          if (status & 0b0000000000010000) return std::string("Cell Voltage Low Fault");
          if (status & 0b0000000000001000) return std::string("Cell Voltage High Fault");
          return std::string("No Fault");  // Standardwert, wenn keine Bedingung erfüllt ist

  - platform: modbus_controller
    modbus_controller_id: m2
    name: "Bat2 Status Text"
    register_type: holding
    address: 0x1302
    raw_encode: HEXBYTES
    entity_category: diagnostic
    device_id: bms_bat2
    filters:
      - lambda: |-
          uint16_t status = std::stoul(x, nullptr, 16);  // Wandelt den Hex-String in eine Ganzzahl um

          // Prüft die einzelnen Bits und gibt den Text als std::string zurück
          if (status & 0b00000001) return std::string("Charge Enabled");
          if (status & 0b00000010) return std::string("Charge Immediately");
          if (status & 0b00000100) return std::string("Discharge Enabled");
          return std::string("Idle");  // Standardwert, wenn keine Bedingung erfüllt ist

  - platform: modbus_controller
    modbus_controller_id: m2
    name: "Bat2 Fault Status"
    register_type: holding
    address: 0x1304
    raw_encode: HEXBYTES
    entity_category: diagnostic
    device_id: bms_bat2
    filters:
      - lambda: |-
          uint16_t status = std::stoul(x, nullptr, 16);  // Wandelt den Hex-String in eine Ganzzahl um

          // Fehlerprüfung basierend auf den einzelnen Bits
          if (status & 0b0000001000000000) return std::string("Cell Temperature High Fault");
          if (status & 0b0000000100000000) return std::string("Cell Temperature Low Fault");
          if (status & 0b0000000010000000) return std::string("BMS Temperature High Fault");
          if (status & 0b0000000001000000) return std::string("Discharge Current High Fault");
          if (status & 0b0000000000100000) return std::string("Charge Current High Fault");
          if (status & 0b0000000000010000) return std::string("Cell Voltage Low Fault");
          if (status & 0b0000000000001000) return std::string("Cell Voltage High Fault");
          return std::string("No Fault");  // Standardwert, wenn keine Bedingung erfüllt ist

number:
  - platform: template
    max_value: 250
    min_value: 0
    id: bat1_cap_original
    name: Battery1 Capacity
    unit_of_measurement: Ah
    initial_value: 250
    step: 1
    mode: BOX
    restore_value: True
    optimistic: True
    device_id: bms_bat1
    entity_category: diagnostic

  - platform: template
    max_value: 250
    min_value: 0
    id: bat2_cap_original
    name: Battery2 Capacity
    unit_of_measurement: Ah
    initial_value: 250
    step: 1
    mode: BOX
    optimistic: True
    restore_value: True
    device_id: bms_bat2
    entity_category: diagnostic

sensor:
  - platform: wifi_signal
    accuracy_decimals: 1
    name: Wifi Signal
    entity_category: diagnostic
    update_interval: 5s
    filters: 
      - or: 
        - delta: 5%
        - throttle: 120s
  
  - platform: uptime
    name: Uptime
    update_interval: 3s
    device_class: duration
    accuracy_decimals: 1
    state_class: total
    unit_of_measurement: min
    entity_category: diagnostic
    filters:
      - lambda: !lambda 'return x / 60;' 
      - or:
        - delta: 5%
        - throttle: 120s
            
# Battery Module 1
  - platform: modbus_controller
    modbus_controller_id: m1
    name: "Bat1 BMS Version"
    register_type: holding
    skip_updates: 100
    address: 0xF80B
    value_type: U_WORD
    entity_category: diagnostic
    device_id: bms_bat1

  - platform: modbus_controller
    modbus_controller_id: m1
    name: "Bat1 Voltage"
    id: bat1_volt
    register_type: holding
    skip_updates: 1
    address: 0x1306  # 0x1302 + 8/2
    unit_of_measurement: "V"
    device_class: voltage
    accuracy_decimals: 2
    value_type: U_WORD
    device_id: bms_bat1
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: m1
    name: "Bat1 Current"
    id: bat1_curr
    register_type: holding
    skip_updates: 1
    address: 0x1307  # 0x1302 + 10/2
    unit_of_measurement: "A"
    device_class: current
    accuracy_decimals: 2
    value_type: S_WORD
    device_id: bms_bat1
    filters:
      - multiply: 0.1

  # BMS Temperatur für Bat1
  - platform: modbus_controller
    modbus_controller_id: m1
    name: "Bat1 BMS Temperature"
    register_type: holding
    address: 0x130A  # Beispieladresse für die BMS-Temperatur
    unit_of_measurement: "°C"
    accuracy_decimals: 2
    value_type: U_WORD
    device_id: bms_bat1

  - platform: modbus_controller
    modbus_controller_id: m1
    name: "Bat1 SOC"
    id: bat1_soc
    register_type: holding
    skip_updates: 2
    device_class: battery
    address: 0x130B  # 0x1302 + 18/2
    unit_of_measurement: "%"
    value_type: U_WORD
    device_id: bms_bat1

  - platform: template
    accuracy_decimals: 2
    name: Bat1 Remaining Energy
    unit_of_measurement: Ah
    id: bat1_remaining_energy
    lambda: |-
      float cap = id(bat1_cap_original).state;
      float soc = id(bat1_soc).state;
      return (cap > 0 && !isnan(soc)) ? soc/100.0 * cap : NAN;
    update_interval: 5s
    device_id: bms_bat1

  - platform: template
    accuracy_decimals: 2
    state_class: measurement
    device_class: power
    unit_of_measurement: W
    id: bat1_power
    name: "Bat1 Power"
    lambda: !lambda return id(bat1_curr).state * id(bat1_volt).state;
    update_interval: 5s
    device_id: bms_bat1
    filters: 
      - round: 2
      - or:
          - throttle: 30s
          - delta: 5%            

  - platform: modbus_controller
    modbus_controller_id: m1
    name: "Bat1 Cycle Count"
    register_type: holding
    address: 0x130D
    skip_updates: 100
    unit_of_measurement: "cycles"
    state_class: total_increasing
    value_type: U_WORD
    accuracy_decimals: 0
    device_id: bms_bat1

  - platform: modbus_controller
    modbus_controller_id: m1
    name: "Bat1 State of Health"
    address: 0x130C
    register_type: holding
    skip_updates: 100
    value_type: U_WORD
    unit_of_measurement: "%"
    state_class: measurement
    icon: "mdi:heart-pulse"
    device_id: bms_bat1

# Battery Module 2
  - platform: modbus_controller
    modbus_controller_id: m2
    name: "Bat2 BMS Version"
    register_type: holding
    skip_updates: 100
    address: 0xF80B
    value_type: U_WORD
