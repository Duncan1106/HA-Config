  - platform: template
    accuracy_decimals: 1
    name: SOC Avg
    update_interval: 5s
    unit_of_measurement: '%'
    state_class: measurement
    device_class: battery
    lambda: !lambda return ((id(bat1_soc).state)+(id(bat2_soc).state))/2;
    filters:
      - clamp: 
          min_value: 0
          max_value: 100
          ignore_out_of_range: true
      - or:
        - throttle: 30s
        - delta: 0.5