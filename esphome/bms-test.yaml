  - platform: template
    name: "Bat1 Average Cell Voltage"
    id: b1_average_voltage
    unit_of_measurement: "V"
    update_interval: 5s
    device_class: voltage
    accuracy_decimals: 3
    entity_category: diagnostic
    device_id: bms_bat1
    lambda: |-
      float total = 0.0;
      int valid_cells = 0;
      float cells[] = {
        id(b1_c1).state, id(b1_c2).state, id(b1_c3).state, id(b1_c4).state,
        id(b1_c5).state, id(b1_c6).state, id(b1_c7).state, id(b1_c8).state,
        id(b1_c9).state, id(b1_c10).state, id(b1_c11).state, id(b1_c12).state,
        id(b1_c13).state, id(b1_c14).state, id(b1_c15).state, id(b1_c16).state
      };

      for (int i = 0; i < 16; i++) {
        float v = cells[i];
        if (!isnan(v) && v > 1.5 && v < 4.5) {
          total += v;
          valid_cells += 1;
        }
      }

      if (valid_cells >= 10) {
        return total / valid_cells;
      } else {
        return NAN;
      }

