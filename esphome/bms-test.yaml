  - platform: template
    name: "Bat2 Average Cell Voltage"
    id: b2_average_voltage
    unit_of_measurement: "V"
    update_interval: 5s
    device_class: voltage
    entity_category: diagnostic
    accuracy_decimals: 3
    lambda: |-
      float total = 0.0;
      int valid_cells = 0;
      float cells[] = {
        id(b2_c1).state, id(b2_c2).state, id(b2_c3).state, id(b2_c4).state,
        id(b2_c5).state, id(b2_c6).state, id(b2_c7).state, id(b2_c8).state,
        id(b2_c9).state, id(b2_c10).state, id(b2_c11).state, id(b2_c12).state,
        id(b2_c13).state, id(b2_c14).state, id(b2_c15).state, id(b2_c16).state
      };

      for (int i = 0; i < 16; i++) {
        float v = cells[i];
        if (!isnan(v) && v > 1.5 && v < 4.5) {
          total += v;
          valid_cells += 1;
        }
      }

      if (valid_cells >= 10) {
        return total / valid_cells;
      } else {
        return NAN;
      }

  - platform: template
    name: "Bat2 Cell Voltage Difference"
    id: b2_cell_diff
    unit_of_measurement: "V"
    device_class: voltage
    update_interval: 5s
    accuracy_decimals: 3
    entity_category: diagnostic
    lambda: |-
      float min_v = 999.0;
      float max_v = -1.0;
      int valid_cells = 0;

      float cells[] = {
        id(b2_c1).state, id(b2_c2).state, id(b2_c3).state, id(b2_c4).state,
        id(b2_c5).state, id(b2_c6).state, id(b2_c7).state, id(b2_c8).state,
        id(b2_c9).state, id(b2_c10).state, id(b2_c11).state, id(b2_c12).state,
        id(b2_c13).state, id(b2_c14).state, id(b2_c15).state, id(b2_c16).state
      };

      for (int i = 0; i < 16; i++) {
        float v = cells[i];
        if (!isnan(v) && v > 1.5 && v < 4.5) {
          if (v < min_v) min_v = v;
          if (v > max_v) max_v = v;
          valid_cells += 1;
        }
      }

      if (valid_cells >= 10) {
        return max_v - min_v;
      } else {
        return NAN;
      }

