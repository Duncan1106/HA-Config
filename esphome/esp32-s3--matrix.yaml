esphome:
  name: esp32-s3--matrix
  friendly_name: esp32 s3 - matrix
  comment: "ESP32-S3 with 8x8 LED Pixel matrix and QMI8658 accelerometer"
  platformio_options:
    board_build.flash_mode: dio
  libraries:
    - "Wire"
    - "SPI"
    - "SensorLib"
    # - "SensorLib@0.2.1"  # Some change after v0.2.1 makes compiling fail

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

# Enable logging
logger:
  level: VERBOSE
  initial_level: INFO

select:
  - platform: logger
    id: logger_select
    name: Logger Level

# Enable Home Assistant API
api:
  encryption:
    key: "/cCoFjSYNFupuAoQnBrMj481u4AUBxUmxTHzis/2wWQ="

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Esp32-S3--Matrix"
    password: !secret ap_password

captive_portal:

light:
  - platform: neopixelbus
    name: "NeoPixel Light"
    id: pixel_matrix
    type: RGB
    variant: WS2811
    pin: GPIO14
    num_leds: 64
    #color_correct: [60%, 60%, 60%]
    effects:
      - addressable_rainbow:
      - addressable_color_wipe:
      - addressable_scan:
      - addressable_twinkle:
      - addressable_flicker:
      - addressable_fireworks:
          name: Fireworks
      - addressable_fireworks:
          name: Fireworks Effect Color
          update_interval: 100ms
          spark_probability: 20%
          use_random_color: true
          fade_out_rate: 255

