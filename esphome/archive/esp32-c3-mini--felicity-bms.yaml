  # BMS 1 Cell Voltage Difference
  - platform: template
    name: "BMS1 Max Cell Voltage Difference"
    unit_of_measurement: "V"
    accuracy_decimals: 3
    lambda: |-
      float min_voltage = 5.0;
      float max_voltage = 0.0;
      for (int i = 0; i < 16; i++) {
        float cell_voltage = id(bms1_cell_voltage_1 + i).state;
        if (cell_voltage < min_voltage) min_voltage = cell_voltage;
        if (cell_voltage > max_voltage) max_voltage = cell_voltage;
      }
      return max_voltage - min_voltage;

