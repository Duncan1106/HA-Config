substitutions:
  modbus_controller_id1: bms1
  modbus_controller_id2: bms2

esphome:
  name: esp32-c3-zero--felicity-bms
  friendly_name: esp32 c3 zero - felicity BMS
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-c3-devkitm-1
  variant: ESP32C3
  framework:
    type: arduino

# Enable logging
logger:
  level: INFO

# Enable Home Assistant API
api:
  encryption:
    key: "JyGIONT7VGrFltomBjt9NWeWQkfjKF4j+sKyW7kOovo="

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: 192.168.2.117
  ap:
    ssid: "Esp32-C3-Mini--Felicity-Bms"
    password: !secret ap_password

captive_portal:

uart:
  tx_pin: GPIO21
  rx_pin: GPIO20
  baud_rate: 9600
  stop_bits: 1

modbus:
  id: modbus1

modbus_controller:
  - id: ${modbus_controller_id1}
    address: 0x1
    modbus_id: modbus1
    #setup_priority: -10
    update_interval: 5sec

  - id: ${modbus_controller_id2}
    address: 0x2
    modbus_id: modbus1
    #setup_priority: -10
    update_interval: 5sec

sensor:
  - platform: uptime
    name: Uptime
  - platform: wifi_signal
    accuracy_decimals: 1
    name: Wifi Signal
    
  # BMS 1 Cell Information
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id1}
    name: "BMS1 Cell Information"
    id: bms1_cell_info
    register_type: read
    address: 0x132A
    register_count: 20
    # raw_encode: HEXBYTES
    lambda: |-
      for (int i = 0; i < 16; i++) {
        float cell_voltage = (float)((data[i*2] << 8) | data[i*2 + 1]) * 0.001f;
        id(bms1_cell_voltage_1 + i).publish_state(cell_voltage);
      }
      for (int i = 0; i < 8; i++) {
        float temp = (float)((data[32 + i*2] << 8) | data[32 + i*2 + 1]);
        id(bms1_temperature_1 + i).publish_state(temp);
      }
      return 0;

  # BMS 1 Battery Information
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id1}
    name: "BMS1 Battery Information"
    id: bms1_battery_info
    register_type: read
    address: 0x1302
    register_count: 10
    # raw_encode: HEXBYTES
    lambda: |-
      uint16_t battery_status = (data[0] << 8) | data[1];
      uint16_t fault_status = (data[4] << 8) | data[5];
      float battery_voltage = (float)((data[8] << 8) | data[9]) * 0.01f;
      int16_t battery_current = (int16_t)((data[10] << 8) | data[11]);
      float current = (float)battery_current * 0.1f;
      float bms_temp = (float)((data[16] << 8) | data[17]);
      uint8_t soc = data[19];
      
      id(bms1_total_voltage).publish_state(battery_voltage);
      id(bms1_current).publish_state(current);
      id(bms1_soc).publish_state(soc);
      id(bms1_temperature_1).publish_state(bms_temp);
      
      std::string fault_status_report = "normal";
      if (fault_status != 0) {
        fault_status_report = "Fault Statuses:";
        if (fault_status & (1 << 2)) fault_status_report += " Cell Voltage High;";
        if (fault_status & (1 << 3)) fault_status_report += " Cell Voltage Low;";
        if (fault_status & (1 << 4)) fault_status_report += " Charge Current High;";
        if (fault_status & (1 << 5)) fault_status_report += " Discharge Current High;";
        if (fault_status & (1 << 6)) fault_status_report += " BMS Temperature High;";
        if (fault_status & (1 << 8)) fault_status_report += " Cell Temperature High;";
        if (fault_status & (1 << 9)) fault_status_report += " Cell Temperature Low;";
      }
      id(bms1_fault_status).publish_state(fault_status_report);
      
      std::string battery_status_report = "";
      if (battery_status & (1 << 0)) battery_status_report += "Charge Enabled; ";
      if (battery_status & (1 << 1)) battery_status_report += "Charge Immediately Requested; ";
      if (battery_status & (1 << 2)) battery_status_report += "Discharge Enabled; ";
      id(bms1_battery_status).publish_state(battery_status_report);
      
      return 0;

  # BMS 2 Cell Information
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id2}
    name: "BMS2 Cell Information"
    id: bms2_cell_info
    register_type: read
    address: 0x132A
    register_count: 20
    # raw_encode: HEXBYTES
    lambda: |-
      for (int i = 0; i < 16; i++) {
        float cell_voltage = (float)((data[i*2] << 8) | data[i*2 + 1]) * 0.001f;
        id(bms2_cell_voltage_1 + i).publish_state(cell_voltage);
      }
      for (int i = 0; i < 4; i++) {
        float temp = (float)((data[32 + i*2] << 8) | data[32 + i*2 + 1]);
        id(bms2_temperature_1 + i).publish_state(temp);
      }
      return 0;

  # BMS 2 Battery Information
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id2}
    name: "BMS2 Battery Information"
    id: bms2_battery_info
    register_type: read
    address: 0x1302
    register_count: 10
    # raw_encode: HEXBYTES
    lambda: |-
      uint16_t battery_status = (data[0] << 8) | data[1];
      uint16_t fault_status = (data[4] << 8) | data[5];
      float battery_voltage = (float)((data[8] << 8) | data[9]) * 0.01f;
      int16_t battery_current = (int16_t)((data[10] << 8) | data[11]);
      float current = (float)battery_current * 0.1f;
      float bms_temp = (float)((data[16] << 8) | data[17]);
      uint8_t soc = data[19];
      
      id(bms2_total_voltage).publish_state(battery_voltage);
      id(bms2_current).publish_state(current);
      id(bms2_soc).publish_state(soc);
      id(bms2_temperature_1).publish_state(bms_temp);
      
      std::string fault_status_report = "normal";
      if (fault_status != 0) {
        fault_status_report = "Fault Statuses:";
        if (fault_status & (1 << 2)) fault_status_report += " Cell Voltage High;";
        if (fault_status & (1 << 3)) fault_status_report += " Cell Voltage Low;";
        if (fault_status & (1 << 4)) fault_status_report += " Charge Current High;";
        if (fault_status & (1 << 5)) fault_status_report += " Discharge Current High;";
        if (fault_status & (1 << 6)) fault_status_report += " BMS Temperature High;";
        if (fault_status & (1 << 8)) fault_status_report += " Cell Temperature High;";
        if (fault_status & (1 << 9)) fault_status_report += " Cell Temperature Low;";
      }
      id(bms2_fault_status).publish_state(fault_status_report);
      
      std::string battery_status_report = "";
      if (battery_status & (1 << 0)) battery_status_report += "Charge Enabled; ";
      if (battery_status & (1 << 1)) battery_status_report += "Charge Immediately Requested; ";
      if (battery_status & (1 << 2)) battery_status_report += "Discharge Enabled; ";
      id(bms2_battery_status).publish_state(battery_status_report);
      
      return 0;

