substitutions:
  name: esp32-c3-super-mini
  friendly_name: ESP32 C3 Super Mini

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  project:
    name: esphome.web
    version: '1.0'

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

# Enable logging
logger:
  level: INFO

# Enable Home Assistant API
api:

# Allow Over-The-Air updates
ota:

# Allow provisioning Wi-Fi via serial
improv_serial:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "ESP32 Super C3 Fallback Hotspot"
    password: !secret ap_password

# interval:
#   interval: 
#     hours: 1
#   then:
#     - switch.turn_on: measure1 

captive_portal:

binary_sensor:
  - platform: status
    name: Status

  - platform: template
    name: Soil Sensor
    device_class: moisture
    lambda: if(id(soil_moisture_1).state < id(dry_threshold).state) { return false; } else { return true; }

number:
  - platform: template
    max_value: 60
    min_value: 0
    step: 1
    initial_value: 15
    restore_value: True
    optimistic: True
    name: Dry Threshold
    id: dry_threshold

  - platform: template
    max_value: 60
    min_value: 0
    step: 1
    initial_value: 15
    restore_value: True
    optimistic: True
    name: Measure Time
    id: measure_time

  # - platform: template
  #   max_value: 100
  #   min_value: 0
  #   step: 0.1
  #   restore_value: True
  #   name: Soil Moisture 1 
  #   id: soil_moisture_1_1
  #   optimistic: True

# switch:
#   - platform: gpio
#     pin: GPIO6
#     name: Measure
#     id: measure1
#     on_turn_on:
#       then:
#         - delay: !lambda return id(measure_time).state * 1000;
#         - number.set: 
#             id: soil_moisture_1_1
#             value: !lambda return id(soil_moisture_1).state; 
#         - switch.turn_off: measure1 
             
light:
  - platform: status_led
    pin: 
      number: GPIO8
      inverted: True
    name: Status Led

sensor:
  - platform: adc
    pin: GPIO4
    name: "Soil Moisture 1"
    id: soil_moisture_1
    update_interval: 10s
    attenuation: 11db
    unit_of_measurement: "V"
    internal: False
    filters:
    - median:
        window_size: 13
        send_every: 6
        send_first_at: 1
    # - calibrate_linear:
    #     - 1.7 -> 100.
    #     - 2.7 -> 0.0
    # - clamp:
    #     min_value: 0
    #     max_value: 100
    - round: 1
    accuracy_decimals: 1

  - platform: uptime
    name: Uptime Sensor

  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 120s
    entity_category: "diagnostic"
