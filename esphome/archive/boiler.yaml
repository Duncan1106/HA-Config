esphome:
  name: "esp32-wroom--watertank-active"
  friendly_name: esp32 wroom - watertank active
  # platformio_options:
  #   board_build.flash_mode: dio

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable Home Assistant API
api:
  encryption:
    key: "TA/C/2/aY5jcPN1ZZkAB4FGAsrnOYFxgsuguDtz7Y7U="

ota:
  - platform: esphome
    password: !secret ota_password

# Enable logging
logger:
  level: INFO

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      priority: 10
      manual_ip: 
        gateway: 192.168.2.1
        subnet: 255.255.255.0
        dns1: 192.168.2.1
        static_ip: 192.168.2.8

    - ssid: !secret wifi_ssid2
      password: !secret wifi_password
      priority: 8
      manual_ip: 
        gateway: 192.168.2.1
        subnet: 255.255.255.0
        dns1: 192.168.2.1
        static_ip: 192.168.2.8
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Esp32-C3-Mini--Watertank"
    password: !secret ap_password

captive_portal:

binary_sensor:
  - platform: status
    name: "Sensor Status"

  - platform: gpio
    pin: 
      number: GPIO15
      mode:
        input: True
    id: read_pin_switch
    name: "Read Water Level"


text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP Address
    ssid:
      name: Connected SSID
    bssid:
      name: Connected BSSID

light:
  - platform: status_led
    name: "Status LED"
    pin:
      number: GPIO2
      ignore_strapping_warning: true

button:
  - platform: restart
    name: "Restart"
  - platform: shutdown
    name: "Shutdown"

sensor:
  - platform: uptime
    name: Uptime
  - platform: template
    accuracy_decimals: 0
    name: Wasserstand
    id: waterlevel
    unit_of_measurement: '%'
    state_class: measurement
    icon: mdi:water

switch:
  - platform: gpio
    pin: 
      number: GPIO4
    name: 10%
    id: switch_10

  - platform: gpio
    pin: 
      number: GPIO16
    name: 20%
    id: switch_20

  - platform: gpio
    pin: 
      number: GPIO32
    name: 30%
    id: switch_30

  - platform: gpio
    pin: 
      number: GPIO33
    name: 40%
    id: switch_40

  - platform: gpio
    pin: 
      number: GPIO25
    name: 50%
    id: switch_50

  - platform: gpio
    pin: 
      number: GPIO26
    name: 60%
    id: switch_60

  - platform: gpio
    pin: 
      number: GPIO27
    name: 70%
    id: switch_70

  - platform: gpio
    pin: 
      number: GPIO14
    name: 80%
    id: switch_80

  - platform: gpio
    pin: 
      number: GPIO12
    name: 90%
    id: switch_90

  - platform: gpio
    pin: 
      number: GPIO13
    name: 99%
    id: switch_100