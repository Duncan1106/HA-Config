esphome:
  name: "esp32-wroom--watertank-passive"
  friendly_name: esp32 wroom - watertank passive 
  # platformio_options:
  #   board_build.flash_mode: dio

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable Home Assistant API
api:
  encryption:
    key: "TA/C/2/aY5jcPN1ZZkAB4FGAsrnOYFxgsuguDtz7Y7U="

ota:
  - platform: esphome
    password: !secret ota_password

# Enable logging
logger:
  level: INFO

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      priority: 10
      manual_ip: 
        gateway: 192.168.2.1
        subnet: 255.255.255.0
        dns1: 192.168.2.1
        static_ip: 192.168.2.7

    - ssid: !secret wifi_ssid2
      password: !secret wifi_password
      priority: 8
      manual_ip: 
        gateway: 192.168.2.1
        subnet: 255.255.255.0
        dns1: 192.168.2.1
        static_ip: 192.168.2.7

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Esp32-C3-Mini--Watertank"
    password: !secret ap_password

captive_portal:

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP Address
    ssid:
      name: Connected SSID
    bssid:
      name: Connected BSSID

light:
  - platform: status_led
    name: "Status LED"
    pin:
      number: GPIO2
      ignore_strapping_warning: true

button:
  - platform: restart
    name: "Restart"
  - platform: shutdown
    name: "Shutdown"

sensor:
  - platform: uptime
    name: Uptime
  - platform: template
    accuracy_decimals: 0
    name: Wasserstand
    id: waterlevel
    unit_of_measurement: '%'
    state_class: measurement
    icon: mdi:water

binary_sensor:
  - platform: status
    name: "Sensor Status"

  - platform: gpio
    pin: 
      number: GPIO34
    name: 10%
    filters:
      - delayed_on: 10ms
      - delayed_off: 5s
    on_press: 
      then: 
        - sensor.template.publish:
            id: waterlevel
            state: 10

  - platform: gpio
    pin: 
      number: GPIO35
    name: 20%
    filters: 
      - delayed_on_off: 40ms
    on_press: 
      then: 
        - sensor.template.publish:
            id: waterlevel
            state: 20

  - platform: gpio
    pin: 
      number: GPIO32
    name: 30%
    filters: 
      - delayed_on_off: 60ms 
    on_press: 
      then: 
        - sensor.template.publish:
            id: waterlevel
            state: 30

  - platform: gpio
    pin: 
      number: GPIO33
    name: 40%
    filters: 
      - delayed_on_off: 80ms 
    on_press: 
      then: 
        - sensor.template.publish:
            id: waterlevel
            state: 40

  - platform: gpio
    pin: 
      number: GPIO25
    name: 50%
    filters: 
      - delayed_on_off: 100ms 
    on_press: 
      then: 
        - sensor.template.publish:
            id: waterlevel
            state: 50

  - platform: gpio
    pin: 
      number: GPIO26
    name: 60%
    filters: 
      - delayed_on_off: 120ms
    on_press: 
      then: 
        - sensor.template.publish:
            id: waterlevel
            state: 60

  - platform: gpio
    pin: 
      number: GPIO27
    name: 70%
    filters: 
      - delayed_on_off: 140ms
    on_press: 
      then: 
        - sensor.template.publish:
            id: waterlevel
            state: 70

  - platform: gpio
    pin: 
      number: GPIO14
    name: 80%
    filters: 
      - delayed_on_off: 160ms
    on_press: 
      then: 
        - sensor.template.publish:
            id: waterlevel
            state: 80

  - platform: gpio
    pin: 
      number: GPIO12
    name: 90%
    filters: 
      - delayed_on_off: 180ms
    on_press: 
      then: 
        - sensor.template.publish:
            id: waterlevel
            state: 90

  - platform: gpio
    pin: 
      number: GPIO13
    name: 100%
    filters: 
      - delayed_on_off: 200ms
    on_press: 
      then: 
        - sensor.template.publish:
            id: waterlevel
            state: 100