        - light.turn_off: leds_120_127

binary_sensor:
  - platform: status
    name: "Status"

text_sensor:
  - platform: wifi_info
    ssid: 
      name: SSID
    bssid: 
      name: BSSID
    ip_address: 
      name: IP Address

sensor:
  - platform: uptime
    name: Uptime Sensor

  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 120s
    entity_category: "diagnostic"    