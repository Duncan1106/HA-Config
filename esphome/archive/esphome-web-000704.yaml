substitutions:
  name: 128-pxl-leds
  friendly_name: ESP01M 128 Pixel Leds

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  project:
    name: esphome.web
    version: '1.0'

esp8266:
  board: esp01_1m

# Enable logging
logger:
  level: INFO

# Enable Home Assistant API
api:

# Allow Over-The-Air updates
ota:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # # Enable fallback hotspot (captive portal) in case wifi connection fails
  # ap:
  #   ssid: "64Pxl-Board-Esp01S"
  #   password: !secret ap_password

# captive_portal:

light:
  - platform: neopixelbus
    num_leds: 128
    pin: 
      number: GPIO2
    variant: ws2812x
    name: 128Pixel Board
    default_transition_length: 0.5s
    id: pxl_64
    effects: 
                    - random:
                    - random:
                        name: "Slow Random Effect"
                        transition_length: 30s
                        update_interval: 20s
                    - random:
                        name: "Fast Random Effect"
                        transition_length: 4s
                        update_interval: 5s
                    - addressable_fireworks:
                    - addressable_fireworks:
                        name: "Fireworks Effect"
                        update_interval: 32ms
                        spark_probability: 10%
                        use_random_color: true
                        fade_out_rate: 120
                    - addressable_random_twinkle:
                    - addressable_random_twinkle:
                        name: Random "Twinkle Effect"
                        twinkle_probability: 15%
                        progress_interval: 32ms

  - platform: partition
    segments:
      id: pxl_64
      from: 0
      to: 7
    name: 01-0-7 Leds
    id: leds_0_7
  - platform: partition
    segments:
      id: pxl_64
      from: 8
      to: 15
    name: 02-8-15 Leds
    id: leds_8_15
  - platform: partition
    segments:
      id: pxl_64
      from: 16
      to: 23
    name: 03-16-23 Leds
    id: leds_16_23
  - platform: partition
    segments:
      id: pxl_64
      from: 24
      to: 31
    name: 04-24-31 Leds
    id: leds_24_31
  - platform: partition
    segments:
      id: pxl_64
      from: 32
      to: 39
    name: 05-32-39 Leds
    id: leds_32_39
  - platform: partition
    segments:
      id: pxl_64
      from: 40
      to: 47
    name: 06-40-47 Leds
    id: leds_40_47
  - platform: partition
    segments:
      id: pxl_64
      from: 48
      to: 55
    name: 07-48-55 Leds
    id: leds_48_55
  - platform: partition
    segments:
      id: pxl_64
      from: 56
      to: 63
    name: 08-56-63 Leds
    id: leds_56_63
  - platform: partition
    segments:
      id: pxl_64
      from: 64
      to: 71
    name: 09-64-71 Leds
    id: leds_64_71
  - platform: partition
    segments:
      id: pxl_64
      from: 72
      to: 79
    name: 10-72-79 Leds
    id: leds_72_79
  - platform: partition
    segments:
      id: pxl_64
      from: 80
      to: 87
    name: 11-80-87 Leds
    id: leds_80_87
  - platform: partition
    segments:
      id: pxl_64
      from: 88
      to: 95
    name: 12-88-95 Leds
    id: leds_88_95
  - platform: partition
    segments:
      id: pxl_64
      from: 96
      to: 103
    name: 13-96-103 Leds
    id: leds_96_103
  - platform: partition
    segments:
      id: pxl_64
      from: 104
      to: 111
    name: 14-104-111 Leds
    id: leds_104_111
  - platform: partition
    segments:
      id: pxl_64
      from: 112
      to: 119
    name: 15-112-119 Leds
    id: leds_112_119
  - platform: partition
    segments:
      id: pxl_64
      from: 120
      to: 127
    name: 16-120-127 Leds
    id: leds_120_127

button:
  - platform: restart
    name: "Restart"
  - platform: shutdown
    name: "Shutdown"

  - platform: template
    name: Cycle
    on_press: 
      then:
        - delay: 0.5s 
        - light.turn_on: leds_0_7
        - delay: 0.01s
        - light.turn_on: leds_64_71
        - delay: 0.75s
        - light.turn_on: leds_8_15
        - delay: 0.01s
        - light.turn_on: leds_72_79
        - delay: 0.25s
        - light.turn_off: leds_0_7
        - delay: 0.01s
        - light.turn_off: leds_64_71
        - delay: 0.75s
        - light.turn_on: leds_16_23
        - delay: 0.01s
        - light.turn_on: leds_80_87
        - delay: 0.25s
        - light.turn_off: leds_8_15  
        - delay: 0.01s
        - light.turn_off: leds_72_79
        - delay: 0.75s
        - light.turn_on: leds_24_31
        - delay: 0.01s
        - light.turn_on: leds_88_95
        - delay: 0.25s
        - light.turn_off: leds_16_23  
        - delay: 0.01s
        - light.turn_off: leds_80_87
        - delay: 0.75s
        - light.turn_on: leds_32_39
        - delay: 0.01s
        - light.turn_on: leds_96_103
        - delay: 0.25s
        - light.turn_off: leds_24_31 
        - delay: 0.01s 
        - light.turn_off: leds_88_95
        - delay: 0.75s
        - light.turn_on: leds_40_47
        - delay: 0.01s
        - light.turn_on: leds_104_111
        - delay: 0.25s
        - light.turn_off: leds_32_39 
        - delay: 0.01s
        - light.turn_off: leds_96_103
        - delay: 0.75s
        - light.turn_on: leds_48_55
        - delay: 0.01s
        - light.turn_on: leds_112_119
        - delay: 0.25s
        - light.turn_off: leds_40_47  
        - delay: 0.01s
        - light.turn_off: leds_104_111
        - delay: 0.75s
        - light.turn_on: leds_56_63
        - delay: 0.01s
        - light.turn_on: leds_120_127
        - delay: 0.25s
        - light.turn_off: leds_48_55  
