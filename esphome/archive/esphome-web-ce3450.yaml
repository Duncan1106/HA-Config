substitutions:
  name: esp32-s3-paludarium
  friendly_name: Esp32 S3 Paludarium

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  platformio_options:
    board_build.flash_mode: dio
  project:
    name: esphome.web
    version: '1.0'

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

# Enable logging
logger:
  level: INFO

# Enable Home Assistant API
api:

# Allow Over-The-Air updates
ota:

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      priority: 10
    - ssid: !secret wifi_ssid2
      password: !secret wifi_password
      priority: 8

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Paludarium Fallback Hotspot"
    password: !secret ap_password

captive_portal:

time:
  - platform: homeassistant

sun:
  latitude: !secret latitude
  longitude: !secret longitude
  on_sunrise:
    elevation: 5°
    then:
      - button.press: sunrise

  on_sunset: 
    elevation: 0°
    then:
      - button.press: sunset

i2c:
  sda: GPIO8
  scl: GPIO9
  scan: False
  id: bus_a

output:
  - platform: ledc
    id: pwm_output
    pin: GPIO14
    inverted: True
  
light:
  - platform: neopixelbus
    variant: ws2812x
    pin: GPIO48
    name: LED
    num_leds: 1

  - platform: monochromatic
    output: pwm_output
    id: light_one
    restore_mode: RESTORE_DEFAULT_OFF
    name: "Paludarium Light"

button:
  - platform: restart
    name: "Sensor Restart"

  - platform: template
    id: sunrise
    name: Sunrise
    on_press: 
      then:
        - if:
            condition:
              light.is_off: light_one
            then:
              - light.turn_on:
                  id: light_one
                  brightness: 0.1%
              - repeat:
                  count: 1000
                  then:
                      - light.dim_relative:
                          id: light_one
                          relative_brightness: 0.1%
                          transition_length: 1s
                      - number.set:
                          id: brightness_led          
                          value: !lambda |-
                              float brightness;
                              id(light_one).current_values.as_brightness(&brightness);
                              return brightness * 100.0f;
                      - delay: 1s
              - light.turn_on:
                  id: light_one
                  brightness: 100%
                  transition_length: 0.1s
              - number.set:
                  id: brightness_led
                  value: 100.0
     

            else: 
              - number.set:
                  id: brightness_led
                  value: 100.0
              - light.turn_on: 
                  id: light_one
                  brightness: 100%

  - platform: template
    id: sunset
    name: Sunset
    on_press: 
      then:
        - light.turn_on:
            id: light_one
            brightness: 100%
        - repeat:
            count: 1000
            then:
                - light.dim_relative:
                    id: light_one
                    relative_brightness: -0.1%
                    transition_length: 1s
                - number.set:
                    id:
                    value: !lambda |-
                        float brightness;
                        id(light_one).current_values.as_brightness(&brightness);
                        return brightness * 100.0f;
                - delay: 1s
        - light.turn_off: 
            id: light_one
        - number.set:
            id:
            value: 0.0

number:
  - platform: template
    name: "Brightness"
    id: brightness_led
    min_value: 0.0
    max_value: 100.0
    step: 0.0001
    optimistic: True
    restore_value: True
    internal: True

binary_sensor:
  - platform: status
    name: "Sensor Status"

text_sensor:
  - platform: sun
    name: Sun Next Sunrise
    type: sunrise
  - platform: sun
    name: Sun Next Sunset
    type: sunset

  - platform: wifi_info
    ip_address:
      name: IP Address
    ssid:
      name: Connected SSID
    bssid:
      name: Connected BSSID
    mac_address:
      name: Mac Wifi Address


sensor:
  - platform: sun
    name: Sun Azimuth
    type: azimuth
  - platform: sun
    name: Sun elevation
    type: elevation

  - platform: template
    accuracy_decimals: 3
    name: Paludarium Light Brightness
    id: led_brightness
    unit_of_measurement: '%'
    lambda: |-
      return id(brightness_led).state;
    update_interval: 0.2s
    filters: 
      - or:
         - throttle: 30s
         - delta: 0.5%

  - platform: bh1750
    name: "BH1750 Illuminance"
    address: 0x23
    update_interval: 3s
    filters:
        - or:
          - throttle: 60s
          - delta: 2%
    
  - platform: dht
    model: DHT22
    pin: GPIO4
    temperature:
      name: "Paludarium Temperature"
    humidity:
      name: "Paludarium Humidity"
    update_interval: 60s

  - platform: uptime
    name: Uptime Sensor
    
  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 120s
    entity_category: "diagnostic"

  - platform: copy # Reports the WiFi signal strength in %
    source_id: wifi_signal_db
    name: "WiFi Signal Percent"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: "diagnostic"
    device_class: ""    