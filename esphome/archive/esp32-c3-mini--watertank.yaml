esphome:
  name: esp32-c3-mini--watertank
  friendly_name: esp32 c3 mini - watertank
  platformio_options:    
    board_build.flash_mode: dio

esp32:  
  board: esp32-c3-devkitm-1  
  variant: ESP32C3  
  framework:    
    type: esp-idf

# Enable Home Assistant API
api:
  encryption:
    key: "FVnAC+c5y8rAvi5/X6Whj7tp/j+1qNsydQFGyv9ENLY="


ota:
  - platform: esphome
    password: !secret ota_password

# Enable logging
logger:
  level: INFO

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      priority: 10
      manual_ip: 
        gateway: 192.168.2.1
        subnet: 255.255.255.0
        dns1: 192.168.2.1
        static_ip: 192.168.2.7

    - ssid: !secret wifi_ssid2
      password: !secret wifi_password
      priority: 8
      manual_ip: 
        gateway: 192.168.2.1
        subnet: 255.255.255.0
        dns1: 192.168.2.1
        static_ip: 192.168.2.7

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Esp32-C3-Mini--Watertank"
    password: !secret ap_password

captive_portal:
  
light:  
  - platform: status_led    
    name: "Status LED"    
    id: esp_status_led    
    icon: "mdi:alarm-light"    
    pin:      
      number: GPIO8      
      inverted: true
      ignore_strapping_warning: True
    restore_mode: ALWAYS_OFF

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP Address
    ssid:
      name: Connected SSID
    bssid:
      name: Connected BSSID
  
button:
  - platform: restart
    name: "Restart"
  - platform: shutdown
    name: "Shutdown"

number:
  - platform: template
    max_value: 100
    min_value: 0
    step: 1
    internal: True
    optimistic: True
    restore_value: True
    id: number_watertank_level

sensor:
  - platform: uptime
    name: Uptime

  - platform: template
    accuracy_decimals: 0
    name: Wasserstand
    id: waterlevel
    unit_of_measurement: '%'
    state_class: measurement
    lambda: !lambda return id(number_watertank_level).state;

binary_sensor:
  - platform: status
    name: "Sensor Status"

  - platform: gpio
    pin: 
      number: GPIO0
    name: 10%
    filters:
      - delayed_on_off: 10ms
    on_press: 
      then: 
        - number.set:
            id: number_watertank_level
            value: 10

  - platform: gpio
    pin: 
      number: GPIO1
    name: 20%
    filters: 
      - delayed_on_off: 40ms
    on_press: 
      then: 
        - number.set:
            id: number_watertank_level
            value: 20

  - platform: gpio
    pin: 
      number: GPIO3
    name: 30%
    filters: 
      - delayed_on_off: 60ms 
    on_press: 
      then: 
        - number.set:
            id: number_watertank_level
            value: 30

  - platform: gpio
    pin: 
      number: GPIO4
    name: 40%
    filters: 
      - delayed_on_off: 80ms 
    on_press: 
      then: 
        - number.set:
            id: number_watertank_level
            value: 40

  - platform: gpio
    pin: 
      number: GPIO5
    name: 50%
    filters: 
      - delayed_on_off: 100ms 
    on_press: 
      then: 
        - number.set:
            id: number_watertank_level
            value: 50

  - platform: gpio
    pin: 
      number: GPIO6
    name: 60%
    filters: 
      - delayed_on_off: 120ms
    on_press: 
      then: 
        - number.set:
            id: number_watertank_level
            value: 60

  - platform: gpio
    pin: 
      number: GPIO7
    name: 70%
    filters: 
      - delayed_on_off: 140ms
    on_press: 
      then: 
        - number.set:
            id: number_watertank_level
            value: 70

  - platform: gpio
    pin: 
      number: GPIO10
    name: 80%
    filters: 
      - delayed_on_off: 160ms
    on_press: 
      then: 
        - number.set:
            id: number_watertank_level
            value: 80

  - platform: gpio
    pin: 
      number: GPIO20
    name: 90%
    filters: 
      - delayed_on_off: 180ms
    on_press: 
      then: 
        - number.set:
            id: number_watertank_level
            value: 90

  - platform: gpio
    pin: 
      number: GPIO21
    name: 99%
    filters: 
      - delayed_on_off: 200ms
    on_press: 
      then: 
        - number.set:
            id: number_watertank_level
            value: 100