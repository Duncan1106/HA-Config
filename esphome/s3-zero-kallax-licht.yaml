# Board: Waveshare ESP32-S3-Zero (Waveshare)
# Definition: definitions/boards/waveshare_esp32_s3_zero/manifest.yaml

esphome:
  name: s3-zero-kallax-licht
  friendly_name: S3 Zero - Kallax Licht

esp32:
  variant: esp32s3
  flash_size: 4MB
  framework:
    type: esp-idf

packages:
  - !include common/logger.yaml
  - !include common/common_things.yaml

api:
  encryption:
    key: "BiICvPW2AlovLADmRKyt4sZkJXL4h6OGOAP0XUZ+WA4="

ota:
  - platform: esphome
    encryption: 

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    gateway: 192.168.2.1
    subnet: 255.255.255.0
    dns1: 192.168.2.1
    static_ip: 192.168.2.37
  ap:
    ssid: Kallax-Beleuchtung
    password: !secret ap_password
  enable_rrm: true
  enable_btm: true

captive_portal:
  
output:
  - platform: ledc
    pin:
      number: GPIO1
      mode:
        output: true
    frequency: 19531Hz
    id: light_one

light:
  - platform: esp32_rmt_led_strip
    chipset: WS2812
    num_leds: 1
    pin: GPIO21
    id: status_led
    channel_colors: RGB
    
  - platform: monochromatic
    restore_mode: RESTORE_AND_OFF
    name: Kallax Licht
    output: light_one
    id: kallax_licht
