esphome:
  name: esp32-c3-mini--kallax-light
  friendly_name: esp32 c3 mini - kallax light
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-c3-devkitm-1
  variant: ESP32C3
  framework:
    type: esp-idf

packages:
  - !include common/logger.yaml
  - !include common/common_things.yaml
  
# Enable Home Assistant API
api:
  encryption:
    key: "9ap4LHGH2lmOpJABaNQdyin1uvOebYhw0tIGywI5gRI="

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    gateway: 192.168.2.1
    subnet: 255.255.255.0
    dns1: 192.168.2.1
    static_ip: 192.168.2.37
  ap:
    ssid: Kallax-Beleuchtung
    password: !secret ap_password
  enable_rrm: true
  enable_btm: true
captive_portal:

binary_sensor:
  - platform: status
    name: Status

output:
  - platform: gpio
    id: led_blue
    pin: 
      number: GPIO8
      ignore_strapping_warning: true
      inverted: True
  - platform: ledc
    pin: GPIO4
    frequency: 19531Hz
    id: light_one

button:
  - platform: output
    id: button_led_blue
    duration: 
      milliseconds: 100
    output: led_blue
    name: Status LED
    disabled_by_default: true
    entity_category: diagnostic

light:
  - platform: monochromatic
    restore_mode: RESTORE_AND_OFF
    name: Kallax Licht
    output: light_one
    id: kallax_licht