    name: Real Battery SoC

  - platform: copy
    source_id: battery_capacity
    name: Battery SOC Corrected Polynomial
    id: battery_capacity_corrected_polynomial
    unit_of_measurement: "%"
    state_class: measurement
    filters: 
      - calibrate_polynomial:
          degree: 7
          datapoints:  
            - 0.0 -> 0.0
            - 26.0 -> 24.0
            - 29.0 -> 26.0
            - 31.0 -> 27.0
            - 35.0 -> 30.0
            - 37.0 -> 32.0
            - 38.0 -> 33.0
            - 39.0 -> 33.5
            - 40.0 -> 34.5
            - 54.0 -> 46.5
            - 55.0 -> 47.0
            - 56.0 -> 48.0
            - 57.0 -> 49.0
            - 58.0 -> 50.5
            - 59.0 -> 51.5
            - 60.0 -> 52.5
            - 61.0 -> 53.5
            - 62.0 -> 55.0
            - 63.0 -> 56.0
            - 64.0 -> 57.0
            - 65.0 -> 58.5
            - 66.0 -> 59.0
            - 78.0 -> 79.0
            - 84.0 -> 79.5
            - 85.0 -> 80.5
            - 87.0 -> 82.0
            - 88.0 -> 83.0
            - 89.0 -> 85.0
            - 93.0 -> 92.0
            - 95.0 -> 93.0
            - 98.0 -> 98.0
            - 100.0 -> 100.0
      - clamp:
          min_value: 0.0
          max_value: 100.0

