binary_sensor:
   - platform: status
     name: Status
     #state_topic: null

   - platform: modbus_controller
     modbus_controller_id: ${modbus_controller_id}
     skip_updates: 2
     name: AC INV relay # bit 0
     id: AC_INV_relay
     register_type: holding
     address: 552
     bitmask: 0x1
     entity_category: diagnostic
     disabled_by_default: True
     #state_topic: null
 
   - platform: modbus_controller
     modbus_controller_id: ${modbus_controller_id}
     skip_updates: 2
     name: AC Load relay Reserved # bit 1
     id: AC_Load_relay_Reserved
     register_type: holding
     address: 552
     bitmask: 0x2
     entity_category: diagnostic
     disabled_by_default: True
     #state_topic: null
 
   - platform: modbus_controller
     modbus_controller_id: ${modbus_controller_id}
     skip_updates: 2
     name: AC grid relay # bit 2
     id: AC_grid_relay
     register_type: holding
     address: 552
     bitmask: 0x4
     entity_category: diagnostic
     disabled_by_default: True
     #state_topic: null
 
   - platform: modbus_controller
     modbus_controller_id: ${modbus_controller_id}
     skip_updates: 2
     name: AC Generator relay # bit 3
     id: AC_Generator_relay
     register_type: holding
     address: 552
     bitmask: 0x8
     entity_category: diagnostic
     disabled_by_default: True
     #state_topic: null
 
   - platform: modbus_controller
