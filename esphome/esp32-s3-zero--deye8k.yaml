substitutions:
  device_description: "Esp32 S3 Zero component for Deye sun-8k-sg04lp3-eu"
  modbus_controller_id: sg04lp3

esphome:
  name: esp32-s3-zero--deye8k
  friendly_name: esp32 s3 zero - deye8k
  min_version: 2024.6.0
  name_add_mac_suffix: false
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

# Enable Home Assistant API
api:
  encryption:
    key: "ZsxpxBRUl5mPTgRbiQ+4ScujWlgTYTG6yofkxQxKbsQ="

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: True
  manual_ip: 
    gateway: 192.168.2.1
    static_ip: 192.168.2.33
    dns1: 192.168.2.1
    subnet: 255.255.255.0

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Esp32-C3-Mini--Deye8K"
    password: !secret ap_password

captive_portal:

# Enable logging
logger:
  level: DEBUG
  initial_level: INFO
  logs: 
    modbus: ERROR
    component: ERROR

time:
  - platform: homeassistant
    id: ha_time
    on_time:
      - seconds: 0
        minutes: 0
        hours: 0
        then:
          - switch.turn_off: enable_solar_grid_charge
          - switch.turn_on: enable_charge_automations

light:
  - platform: esp32_rmt_led_strip
    #state_topic: null
    num_leds: 1
    pin: GPIO21
    id: led
    name: Status LED
    rgb_order: RGB
    chipset: WS2812

script:
  - id: turn_off_time_slots_script
    mode: queued
    max_runs: 5
    then:
            - if:
                condition: 
                  - switch.is_on: tou_1_charge
                then: 
                  - switch.turn_off: tou_1_charge 
                  - number.set: 
                      id: Time_point_1_capacity
                      value: !lambda return id(time_point_soc).state;
                  - delay: 10s
            - if:
                condition: 
                  - switch.is_on: tou_2_charge
                then: 
                  - switch.turn_off: tou_2_charge 
                  - number.set: 
                      id: Time_point_2_capacity
                      value: !lambda return id(time_point_soc).state;
                  - delay: 10s
            - if:
                condition: 
                  - switch.is_on: tou_3_charge
                then: 
                  - switch.turn_off: tou_3_charge 
                  - number.set: 
                      id: Time_point_3_capacity
                      value: !lambda return id(time_point_soc).state;
                  - delay: 10s
            - if:
                condition: 
                  - switch.is_on: tou_4_charge
                then: 
                  - switch.turn_off: tou_4_charge 
                  - number.set: 
                      id: Time_point_4_capacity
                      value: !lambda return id(time_point_soc).state;
                  - delay: 10s
            - if:
                condition: 
                  - switch.is_on: tou_5_charge
                then: 
                  - switch.turn_off: tou_5_charge 
                  - number.set: 
                      id: Time_point_5_capacity
                      value: !lambda return id(time_point_soc).state;
                  - delay: 10s
            - if:
                condition: 
                  - switch.is_on: tou_6_charge
                then: 
                  - switch.turn_off: tou_6_charge         
                  - number.set: 
                      id: Time_point_6_capacity
                      value: !lambda return id(time_point_soc).state;
                  - delay: 10s 
            - number.set:
                id: time_point_soc
                value: !lambda return id(time_point_soc).state;

  - id: select_right_timeslot_script
    mode: restart
    #max_runs: 30
    then:
      # Timeslot 1
      - if:
          condition:
            lambda: |
              return id(int_time).state >= id(Time_point_1).state && id(int_time).state < id(Time_point_2).state;
          then:
            - if: 
                condition: 
                  - switch.is_on: tou_6_charge
                then:
                  - switch.turn_off: tou_6_charge
                  - delay: 5s
            - if:
                condition: 
                  - switch.is_off: tou_1_charge 
                then:
                  - switch.turn_on: tou_1_charge
                  - delay: 5s
            - if:
                condition:
                  - number.in_range:
                      id: Time_point_1_capacity 
                      below: 100.0
                then:
                  - number.set: 
                      id: Time_point_1_capacity
                      value: 100
                  - delay: 10s 
            - if:
                condition: 
                  - lambda: !lambda return (id(Time_point_6_capacity).state != id(time_point_soc).state); 
                then:    
                  - number.set: 
                      id: Time_point_6_capacity
                      value: !lambda return id(time_point_soc).state;
                  - delay: 5s
      # Timeslot 2
      - if:
          condition:
            lambda: |
              return id(int_time).state >= id(Time_point_2).state && id(int_time).state < id(Time_point_3).state;
          then:
            - if: 
                condition: 
                  - switch.is_on: tou_1_charge
                then:
                  - switch.turn_off: tou_1_charge
                  - delay: 5s
            - if:
                condition: 
                  - switch.is_off: tou_2_charge 
                then:
                  - switch.turn_on: tou_2_charge
                  - delay: 5s
            - if:
                condition:
                  - number.in_range:
                      id: Time_point_2_capacity 
                      below: 100.0
                then:
                  - number.set: 
                      id: Time_point_2_capacity
                      value: 100
                  - delay: 10s 
            - if:
                condition: 
                  - lambda: !lambda return (id(Time_point_1_capacity).state != id(time_point_soc).state); 
                then:    
                  - number.set: 
                      id: Time_point_1_capacity
                      value: !lambda return id(time_point_soc).state;
                  - delay: 5s
      # Timeslot 3
      - if:
          condition:
            lambda: |
              return id(int_time).state >= id(Time_point_3).state && id(int_time).state < id(Time_point_4).state;
          then:
            - if: 
                condition: 
                  - switch.is_on: tou_2_charge
                then:
                  - switch.turn_off: tou_2_charge
                  - delay: 5s
            - if:
                condition: 
                  - switch.is_off: tou_3_charge 
                then:
                  - switch.turn_on: tou_3_charge
                  - delay: 5s
            - if:
                condition:
                  - number.in_range:
                      id: Time_point_3_capacity 
                      below: 100.0
                then:
                  - number.set: 
                      id: Time_point_3_capacity
                      value: 100
                  - delay: 10s 
            - if:
                condition: 
                  - lambda: !lambda return (id(Time_point_2_capacity).state != id(time_point_soc).state); 
                then:    
                  - number.set: 
                      id: Time_point_2_capacity
                      value: !lambda return id(time_point_soc).state;
                  - delay: 5s
      # Timeslot 4
      - if:
          condition:
            lambda: |
              return id(int_time).state >= id(Time_point_4).state && id(int_time).state < id(Time_point_5).state;
          then:
            - if: 
                condition: 
                  - switch.is_on: tou_3_charge
                then:
                  - switch.turn_off: tou_3_charge
                  - delay: 5s
            - if:
                condition: 
                  - switch.is_off: tou_4_charge 
                then:
                  - switch.turn_on: tou_4_charge
                  - delay: 5s
            - if:
                condition:
                  - number.in_range:
                      id: Time_point_4_capacity 
                      below: 100.0
                then:
                  - number.set: 
                      id: Time_point_4_capacity
                      value: 100
                  - delay: 10s 
            - if:
                condition: 
                  - lambda: !lambda return (id(Time_point_3_capacity).state != id(time_point_soc).state); 
                then:    
                  - number.set: 
                      id: Time_point_3_capacity
                      value: !lambda return id(time_point_soc).state;
                  - delay: 5s
      # Timeslot 5
      - if:
          condition:
            lambda: |
              return id(int_time).state >= id(Time_point_5).state && id(int_time).state < id(Time_point_6).state;
          then:
            - if: 
                condition: 
                  - switch.is_on: tou_4_charge
                then:
                  - switch.turn_off: tou_4_charge
                  - delay: 5s
            - if:
                condition: 
                  - switch.is_off: tou_5_charge 
                then:
                  - switch.turn_on: tou_5_charge
                  - delay: 5s
            - if:
                condition:
                  - number.in_range:
                      id: Time_point_5_capacity 
                      below: 100.0
                then:
                  - number.set: 
                      id: Time_point_5_capacity
                      value: 100
                  - delay: 10s 
            - if:
                condition: 
                  - lambda: !lambda return (id(Time_point_4_capacity).state != id(time_point_soc).state); 
                then:    
                  - number.set: 
                      id: Time_point_4_capacity
                      value: !lambda return id(time_point_soc).state;
                  - delay: 5s
      # Timeslot 6
      - if:
          condition:
            lambda: |
              return id(int_time).state >= id(Time_point_6).state || id(int_time).state < id(Time_point_1).state;
          then:
            - if: 
                condition: 
                  - switch.is_on: tou_5_charge
                then:
                  - switch.turn_off: tou_5_charge
                  - delay: 5s
            - if:
                condition: 
                  - switch.is_off: tou_6_charge 
                then:
                  - switch.turn_on: tou_6_charge
                  - delay: 5s
            - if:
                condition:
                  - number.in_range:
                      id: Time_point_6_capacity 
                      below: 100.0
                then:
                  - number.set: 
                      id: Time_point_6_capacity
                      value: 100
                  - delay: 10s 
            - if:
                condition: 
                  - lambda: !lambda return (id(Time_point_5_capacity).state != id(time_point_soc).state); 
                then:    
                  - number.set: 
                      id: Time_point_5_capacity
                      value: !lambda return id(time_point_soc).state;
                  - delay: 5s
      - number.set: 
          id: grid_charge_point
          value: 100.0

  - id: grid_solar_charge_script
    mode: queued
    max_runs: 10
    then:
      - if:
          condition:
            - switch.is_on: battery_charge_from_grid
          then: 
            - script.stop: grid_solar_charge_script
      #- if:
      #    condition:
      #      - sensor.in_range: 
      #          id: battery_capacity
      #          above: 99.99
      #    then: 
      #      - switch.turn_off: enable_solar_grid_charge
      #      - script.stop: grid_solar_charge_script
      - if:
          condition:
            - switch.is_off: enable_solar_grid_charge
          then:
            - switch.turn_off: grid_charge
            - button.press: turn_off_time_slots
      - if: 
          condition:
            for: 
              time: 5min
              condition: 
                - sensor.in_range: 
                    id: battery_capacity
                    above: 99.99
          then:
            - switch.turn_off: enable_solar_grid_charge
      - if:
          condition:
            - and:
               - or:
                  - lambda: "return (id(grid_power).state > id(max_grid_power).state);"
                  - lambda: "return (id(battery_capacity).state > 99.99);"
               - switch.is_on: grid_charge
          then:
            - while:
                condition: 
                  - switch.is_on: grid_charge  
                then:
                  - switch.turn_off: grid_charge
                  - delay: 0.125s
            - delay: 0.25s
            - switch.turn_off: enable_solar_grid_charge
            - script.execute: turn_off_time_slots_script
               
      - if: 
          condition:
            and:
              - lambda: "return (id(grid_power).state < -100);"
              - lambda: "return (id(battery_capacity).state < 100.0);"
              - switch.is_on: enable_solar_grid_charge
          then:
            - script.execute: select_right_timeslot_script
            - number.set: 
                id: grid_charge_point
                value: 100.0
            - button.press: use_solar_reference
            - if:
                condition: 
                  - switch.is_off: grid_charge
                then:
                  - while: 
                      condition: 
                        - switch.is_off: grid_charge
                      then: 
                        - switch.turn_on: grid_charge 
                        - delay: 0.25s
  
  - id: charge_from_grid
    mode: queued
    max_runs: 10
    then:
      - if:
          condition:
            - switch.is_on: battery_charge_from_grid
          then:
            - if:
                condition: 
                  - lambda: return id(battery_capacity).state >= id(battery_charge_from_grid_upto).state;
                then:
                  - switch.turn_off: battery_charge_from_grid
                  - number.set: 
                      id: grid_charge_buffer_power
                      value: !lambda return id(set_grid_charge_power_to_when_solar_charge).state;
            - script.execute: select_right_timeslot_script
            - button.press: use_grid_reference 
            - number.set: 
                id: grid_charge_point
                value: !lambda 'return id(battery_charge_from_grid_upto).state;'
            - if:
                condition: 
                  - number.in_range: 
                      id: grid_charge_buffer_power
                      above: -1000
                then: 
                  - number.set: 
                      id: grid_charge_buffer_power
                      value: !lambda return id(set_grid_charge_power_to_when_grid_charge).state;
            - if:
                condition: 
                  - switch.is_off: grid_charge
                then:
                  - while: 
                      condition: 
                        - switch.is_off: grid_charge
                      then:
                        - switch.turn_on: grid_charge
                        - delay: 0.25s

# psram:
#   id: psram_id
#   mode: octal
#   enable_ecc: true

interval:
  interval: 
    seconds: 5
  then: 
    - if:
        condition:
          - switch.is_on: enable_charge_automations
        then:
          - script.execute: grid_solar_charge_script
          - script.execute: charge_from_grid

uart:
  id: mod_bus
  tx_pin: GPIO43
  rx_pin: GPIO44
  baud_rate: 9600
  stop_bits: 1

button:
  - platform: restart
    #state_topic: null
    name: "Restart"

  - platform: template
    #state_topic: null
    id: select_time_slot
    name: Select Time Slot
    on_press: 
      then:
        - script.execute: select_right_timeslot_script

  - platform: template
    #state_topic: null
    id: turn_off_time_slots
    name: Turn Off Time Slots
    on_press: 
      then:
        - script.execute: turn_off_time_slots_script
  
  - platform: template
    name: Use Solar Reference
    id: use_solar_reference
    on_press: 
      then:
        - number.set: 
            id: grid_charge_buffer_power
            value: !lambda return id(set_grid_charge_power_to_when_solar_charge).state;  

  - platform: template
    name: Use Grid Reference
    id: use_grid_reference
    on_press: 
      then:
        - number.set: 
            id: grid_charge_buffer_power
            value: !lambda return id(set_grid_charge_power_to_when_grid_charge).state;  

