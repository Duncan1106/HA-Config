sensor:
  - platform: wifi_signal
    accuracy_decimals: 1
    name: Wifi Signal
    update_interval: 5s
    filters: 
      - or: 
        - delta: 5%
        - throttle: 120s
  
  - platform: uptime
    name: Uptime
    update_interval: 3s
    device_class: duration
    accuracy_decimals: 1
    state_class: total
    unit_of_measurement: min
    filters:
      - lambda: !lambda 'return x / 60;' 
      - or:
        - delta: 5%
        - throttle: 120s

  - platform: dallas_temp
    address: 0x1cf024b60a646128
    name: Air Temperature
    #state_topic: null
    update_interval: 5s
    filters:
      - filter_out: 85.0
      - or:
        - delta: 1%
        - throttle: 60s

  - platform: template
    accuracy_decimals: 0
    id: int_time
    name: Int Time
    unit_of_measurement: 'time'
    #state_topic: null
    internal: True
    lambda: !lambda return atoi(id(ha_time).now().strftime("%H%M").c_str());
    filters: 
      - or:
        - throttle: 60s
        - delta: 1
            
  - platform: homeassistant
    entity_id: sensor.grid_power
    id: grid_power
    accuracy_decimals: 1
    #state_topic: null

  - platform: template
    accuracy_decimals: 2
    unit_of_measurement: A
    id: theoretical_grid_charge_current
    lambda: !lambda return ((((id(grid_power).state + id(grid_charge_buffer_power).state) / id(battery_voltage).state) *-1) + ((floor(id(Battery_output_current).state)) *-1));
    name: Theoretical Grid Charge Current
    update_interval: 3s
    filters: 
      - round: 0
      - clamp: 
          min_value: 0
          max_value: 120
      - or:
        - throttle: 60s
        - delta: 1
    #state_topic: null
    entity_category: diagnostic
    on_value: 
      then:
        - if:
            condition: 
              - switch.is_off: battery_amps_external
            then:
              - number.set: 
                 id: Maximum_battery_grid_charge_current
                 value: !lambda if (x + id(amp_offset).state > 0) { return ( x + id(amp_offset).state); } else { return 0; }

