select:
  #######################################
  ## Under developmnet - still testing ##
  #######################################
  # 98 - 1 / 111 - 0 -> Lithium (BMS)
  # 98 - 0 / 111 - 0 -> Use V
  # 98 - 0 / 111 - 1 -> Use %
  # 98 - 0 / 111 - 2 -> No Bat
  - platform: logger
    id: logger_select
    name: Log Level

  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: "Control Mode"
    id: control_mode
    address: 98
    value_type: U_WORD
    optionsmap:
      "Lead Battery": 0
      "Lithium Battery": 1
    #state_topic: null

  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: "Battery Operation"
    id: battery_operation
    address: 111
    value_type: U_WORD
    optionsmap:
      "Use V": 0
      "Use %": 1
      "No Bat": 2
    #state_topic: null

  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: Energy priority
    address: 141
    value_type: U_WORD
    optionsmap:
      "Battery first": 0
      "Load first": 1
    #state_topic: null

  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: "Limit control mode"
    address: 142
    value_type: U_WORD
    optionsmap:
      "Selling first": 0
      "Zero export to load": 1
      "Zero export to CT": 2
    #state_topic: null

  ## Gen Settings / SmartLoad
  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: "Grid Port Setting"
    address: 133
    value_type: U_WORD
    optionsmap:
      "Gen use": 0
      "Smart Load Output": 1
      "Microinverter": 2
    disabled_by_default: True
    #state_topic: null