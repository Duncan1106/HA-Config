modbus:
  id: modbus1
  # flow_control_pin: 4
 
modbus_controller:
  - id: ${modbus_controller_id}
    address: 0x1
    modbus_id: modbus1
    setup_priority: -10
    update_interval: 5sec

sun:
  latitude: !secret latitude
  longitude: !secret longitude
  on_sunset: 
    then:
      - switch.turn_off: enable_solar_grid_charge

switch:
  - platform: template
    optimistic: True
    id: enable_charge_automations
    name: Enable Charge Automations
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: diagnostic

  - platform: template
    name: Battery Charge Grid
    id: battery_charge_from_grid
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: True
    entity_category: diagnostic
    on_turn_off: 
      then:
        - button.press: select_time_slot
        - switch.turn_off: grid_charge
        - delay: 5s
        - button.press: use_solar_reference
  
  - platform: template
    optimistic: True
    name: Battery Charge External Amp Control
    restore_mode: RESTORE_DEFAULT_OFF
    id: battery_amps_external
    entity_category: diagnostic
    
  - platform: template
    #state_topic: solarcontrol/grid_charge
    name: Battery Charge Solar
    id: enable_solar_grid_charge
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: True
    entity_category: diagnostic
    on_turn_off: 
      then:
        - button.press: turn_off_time_slots
        - switch.turn_off: grid_charge

  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: Solar_sell
    register_type: holding
    address: 145
    bitmask: 1
    entity_category: config
    icon: "mdi:toggle-switch"
    #state_topic: null
 
