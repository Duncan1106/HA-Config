text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP Address
      id: ip_address
      disabled_by_default: true

button:
  - platform: restart
    name: Restart
    id: restart_btn
    
sensor:
  - platform: wifi_signal
    accuracy_decimals: 1
    name: Wifi Signal
    id: wifi_signal_sensor
    disabled_by_default: true
    update_interval: 5s
    filters: 
      - or: 
        - delta: 5%
        - throttle: 120s
  
  - platform: uptime
    name: Uptime
    id: uptime_sensoe
    update_interval: 3s
    device_class: duration
    accuracy_decimals: 1
    state_class: total
    unit_of_measurement: h
    filters:
      - lambda: !lambda 'return (x / 60) / 60;' 
      - or:
        - delta: 5%
        - throttle: 120s