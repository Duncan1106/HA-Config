  - platform: uptime
    name: Uptime
    update_interval: 5s
    disabled_by_default: True
    filters: 
      - or:
        - delta: 5%
        - throttle: 120s
    
  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 5s
    entity_category: "diagnostic"
    filters: 
      - or:
        - delta: 5%
        - throttle: 120s