# Enable Home Assistant API
api:
  encryption:
    key: "XfWpzxAuLMAWQBirchAhegmcAP39RFeduGn7Nrl6Guo="

ota:
  - platform: esphome
    # pwd: "390f7264bdd7fef29ef78c078b2de6d0"
    password: !secret ota_password
    id: my_ota

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip: 
    gateway: 192.168.2.1
    dns1: 192.168.2.1
    static_ip: 192.168.2.30
    subnet: 255.255.255.0

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Gosund-P1 Fallback Hotspot"
    password: !secret ap_password

captive_portal:
   
esphome:
  name: p1-01

esp8266:
  board: esp8285
  early_pin_init: False
  restore_from_flash: True

substitutions:
  plug_name: Gosund_P1_01

# Enable logging
logger:
  #level: VERY_VERBOSE
  #baud_rate: 0
  level: INFO
  baud_rate: 0
  logs:
    adc: INFO

time:
  - platform: homeassistant
    id: homeassistant_time

uart:
  rx_pin: GPIO03
  #tx_pin: GPIO01
  parity: EVEN
  baud_rate: 4800

light:
  - platform: status_led
    id: statusled
    pin: 
      number: GPIO2
      inverted: True
    name: '${plug_name} - Status LED'

button:
  - platform: restart
    entity_category: diagnostic
    name: "${plug_name} - Restart"

  # - platform: template
  #   entity_category: diagnostic
  #   name: '${plug_name} - Switch off 60s (reset!)'
  #   on_press:
  #       - switch.turn_off: relay3
  #       - delay: 60s
  #       - switch.turn_on: relay3

text_sensor:
  - platform: wifi_info
    ssid: 
      name: "${plug_name} - SSID"
    ip_address: 
      name: "${plug_name} - IP Address"

sensor:
  - platform: wifi_signal
    name: "${plug_name} - WiFi Signal"
    update_interval: 60s
  - platform: uptime
    name: "${plug_name} - Uptime"
    icon: mdi:clock-outline
    update_interval: 60s
  - platform: cse7766
    #current:
    #  name: "${plug_name} - Ampere"
    #  unit_of_measurement: A
    #  accuracy_decimals: 5
    #  icon: mdi:flash-outline
    #  filters:
    #    - or:
    #       - throttle: 30s
    #       - delta: 5%
    # voltage:
    #   name: "${plug_name} - Volt"
    #   unit_of_measurement: V
    #   accuracy_decimals: 2
    #   icon: mdi:flash-outline
    #   filters:
    #     - lambda: return x * 2.34245;
    #     - or:
    #        - throttle: 30s
    #        - delta: 5%
    power:
      name: "${plug_name} - Watt"
      unit_of_measurement: W
      id: "${plug_name}_Wattage"
      accuracy_decimals: 2
      icon: mdi:flash-outline
      filters:
        - lambda: return x * 2.34245;
        - or:
           - throttle_average: 30s
           - delta: 5%
               
  - platform: total_daily_energy
    name: "${plug_name} - Tagesverbrauch"
    power_id: "${plug_name}_Wattage"
    filters:
        # Multiplication factor from Wh to kWh is 0.001
        - multiply: 0.001
        - or:
           - throttle: 30s
           - delta: 5%
    unit_of_measurement: kWh
    icon: mdi:clock-alert

  - platform: integration
    time_unit: h
    sensor: ${plug_name}_Wattage
    name: "${plug_name} - Gesamtverbrauch"
    restore: True
    integration_method: left
    unit_of_measurement: kWh
    filters: 
      - multiply: 0.001
      #- or:
      #  - throttle: 30s
      #  - delta: 5%
            
  - platform: adc
    pin: GPIO17
    id: gpio17
    internal: true
    update_interval: 0.1s
    filters:
      - lambda: |-
          if(x >= 0.60 && x < 0.90){
            id(buttonrelay1).publish_state(true);
          } else if(x >= 0.30 && x < 0.60){
            id(buttonrelay2).publish_state(true);
          }
          else if(x > 0.10 && x < 0.30){
            id(buttonrelay3).publish_state(true);
          } else {
            id(buttonrelay1).publish_state(false);
            id(buttonrelay2).publish_state(false);
            id(buttonrelay3).publish_state(false);
          }
          return{};

binary_sensor:
  - platform: gpio
    id: bigbutton
    internal: true
    pin:
      number: GPIO16
      mode: 
        input: True
      inverted: true
    on_press:
      - switch.toggle: relay4
  - platform: template
    id: buttonrelay1
    internal: true
    on_press:
      - switch.toggle: relay3
    filters:
      - delayed_off: 100ms
  - platform: template
    id: buttonrelay2
    internal: true
    on_press:
      - switch.toggle: relay2
    filters:
      - delayed_off: 100ms
  - platform: template
    id: buttonrelay3
    internal: true
    on_press:
      - switch.toggle: relay3
    filters:
      - delayed_off: 100ms

switch:
  - platform: gpio
    pin: GPIO14
    id: relay1
    restore_mode: RESTORE_DEFAULT_ON
    name: '${plug_name} - Switch1'
    icon: mdi:power-socket-eu
  - platform: gpio
    pin: GPIO12
    id: relay2
    restore_mode: RESTORE_DEFAULT_ON
    name: '${plug_name} - Switch2'
    icon: mdi:power-socket-eu
  - platform: gpio
    pin: GPIO13
    id: relay3
    restore_mode: RESTORE_DEFAULT_ON
    name: '${plug_name} - Switch3'
    icon: mdi:power-socket-eu
  - platform: gpio
    pin: GPIO05
    id: relay4
    restore_mode: RESTORE_DEFAULT_OFF
    name: '${plug_name} - Switch USB'
    icon: mdi:power-socket-eu
    inverted: yes