substitutions:
  light_brightness: '60%'

esphome:
  name: esp32-c3-mini--large-paludarium
  friendly_name: esp32 c3 mini - large Paludarium
  platformio_options:
    board_build.flash_mode: dio  
  on_boot: 
    then:
      - deep_sleep.prevent: deep_sleep_id
      - delay: 15s
      - if:
          condition:
            - sun.is_above_horizon:
          then:
            - light.turn_on: 
                id: ws2812led
                red: 100%
                green: 75%
                blue: 55%
                brightness: ${light_brightness}
                color_brightness: 100%
                transition_length: 10s

esp32:
  board: esp32-c3-devkitm-1
  variant: ESP32C3
  framework:
    type: esp-idf

deep_sleep:
  run_duration: 1d
  id: deep_sleep_id 
  sleep_duration: 
    minutes: 30

# Enable Home Assistant API
api:
  encryption:
    key: "lQTypC5piM0YWcZ2uNXpVJP9USNgO+W+8XPArtcGfDY="

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  level: INFO

wifi:
  output_power: 10dB
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip: 
    gateway: 192.168.2.1
    dns1: 192.168.2.1
    subnet: 255.255.255.0
    static_ip: 192.168.2.39

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Esp32-C3-Mini--Large-Paludarium"
    password: !secret ap_password

captive_portal:
  
time:
  - platform: homeassistant

sun:
  latitude: !secret latitude
  longitude: !secret longitude
  on_sunrise:
    elevation: 3°
    then:
      - button.press: sunrise

  on_sunset: 
    elevation: 2°
    then:
      - button.press: sunset

output:
  - platform: gpio
    id: led_status
    pin: 
      number: GPIO8
      inverted: True
      ignore_strapping_warning: True

light:
  - platform: esp32_rmt_led_strip
    num_leds: 64
    id: ws2812led
    #rmt_channel: 0
    pin: GPIO7
    name: LED
    rgb_order: GRB
    chipset: WS2812
    on_turn_on: 
      then:
        - if: 
            condition: 
              - sun.is_below_horizon: 
                  elevation: 2°
            then:
              - delay: 1s
              - light.turn_off: ws2812led
    on_turn_off: 
      then:
        - if: 
            condition: 
              - sun.is_above_horizon:
                  elevation: 2°
            then: 
              - delay: 1s
              - light.turn_on:
                  id: ws2812led
                  red: 100%
                  green: 75%
                  blue: 55%
                  brightness: ${light_brightness}
                  color_brightness: 100%
                  transition_length: 10s

  - platform: status_led
    name: Status LED
    id: esp_status_led
    icon: "mdi:alarm-light"
    output: led_status
    restore_mode: ALWAYS_OFF

button:
  - platform: restart
    name: Restart

  - platform: template
    id: sunrise
    name: Sunrise
    on_press: 
      then:
        - if:
            condition:
              light.is_off: ws2812led
            then:
              - light.turn_on:
                  id: ws2812led
                  brightness: 15%
                  blue: 55%
                  green: 75%
                  red: 100%
                  #color_brightness: 100%
                  transition_length: 10s
              - delay: 5s
              - light.turn_on: 
                  id: ws2812led
                  brightness: ${light_brightness}
                  transition_length: 300s
                  color_brightness: 100%
                  red: 100%
                  green: 75%
                  blue: 55%
            else: 
              - light.turn_on: 
                  id: ws2812led
                  brightness: ${light_brightness}
                  color_brightness: 100%
                  blue: 55%
                  green: 75%
                  red: 100%

  - platform: template
    id: sunset
    name: Sunset
    on_press: 
      then:
        - light.turn_on:
            id: ws2812led
            brightness: ${light_brightness}
            color_brightness: 100%
            blue: 55%
            green: 75%
            red: 100%
        - light.control: 
            id: ws2812led
            brightness: 0%
            transition_length: 300s
            state: False
        - delay: 300s
        - delay: 5s
        - deep_sleep.enter: deep_sleep_id

binary_sensor:
  - platform: status
    name: Status

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP Address

i2c:
  - id: i2c_1
    sda: GPIO5
    scl: GPIO6
    scan: False

sensor:
  - platform: wifi_signal
    accuracy_decimals: 1
    name: Wifi Signal
    update_interval: 5s
    filters: 
      - or: 
        - delta: 5%
        - throttle: 120s
  
  - platform: uptime
    name: Uptime
    update_interval: 3s
    device_class: duration
    accuracy_decimals: 1
    state_class: total
    unit_of_measurement: min
    filters:
      - lambda: !lambda 'return x / 60;' 
      - or:
        - delta: 5%
        - throttle: 120s
  
  - platform: bmp280_i2c
    temperature:
      name: Temperature BMP280
      oversampling: 16x
      filters: 
        - or:
          - delta: 2%
          - throttle: 30s 
    pressure:
      name: Pressure BMP280
      filters: 
        - or:
          - delta: 2%
          - throttle: 30s 
    address: 0x77
    update_interval: 5s
  
  - platform: aht10
    variant: AHT10
    temperature:
      name: Temperature AHT10
      id: tem
      filters: 
        - or:
          - delta: 2%
          - throttle: 30s 
    humidity:
      name: Humidity AHT10
      id: hum
      filters: 
        - or:
          - delta: 2%
          - throttle: 30s 
    update_interval: 5s

  - platform: absolute_humidity
    name: Absolute Humidity
    temperature: tem
    humidity: hum