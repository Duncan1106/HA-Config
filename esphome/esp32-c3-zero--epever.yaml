i2c:
  sda: GPIO6 #green
  scl: GPIO7 # yellow
  scan: False
  id: bus_a

sensor:
  ## BME280
  - platform: bme280_i2c
    temperature:
      name: "BME280 Temperature"
      id: bme280_temperature
      filters: 
        - or: 
          - delta: 2%
          - throttle: 30s
    pressure:
      name: "BME280 Pressure"
      id: bme280_pressure
      filters: 
        - or: 
          - delta: 2%
          - throttle: 30s
    humidity:
      name: "BME280 Relative Humidity"
      id: bme280_humidity
      filters: 
        - or: 
          - delta: 2%
          - throttle: 30s
    address: 0x76
    iir_filter: 16x
    update_interval: 10s

  ## DIAGNOSTICS
  - platform: wifi_signal
    accuracy_decimals: 1
    name: Wifi Signal
    update_interval: 5s
    filters: 
      - or: 
        - delta: 5%
        - throttle: 120s
  - platform: uptime
    name: Uptime
    update_interval: 3s
    device_class: duration
    accuracy_decimals: 1
    state_class: total
    unit_of_measurement: min
    filters:
      - lambda: !lambda 'return x / 60;' 
      - or:
        - delta: 5%
        - throttle: 120s

  ## LOAD DATA
  - platform: modbus_controller
    modbus_controller_id: epever
    id: load_voltage
    name: "Load voltage"
    address: 0x310C
    unit_of_measurement: "V"
    register_type: read
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: epever
    id: load_current
    name: "Load Current"
    address: 0x310D
    unit_of_measurement: "A"
    register_type: read
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: epever
    id: load_power
    name: "Load power"
    address: 0x310E
    unit_of_measurement: "W"
    register_type: read
    value_type: U_DWORD_R
    accuracy_decimals: 1
    filters:
      - multiply: 0.01
      - throttle_average: 20s 
          
  ## PV DATA
  - platform: modbus_controller
    modbus_controller_id: epever
    id: pv_input_voltage
    name: "PV array input voltage"
    address: 0x3100
    unit_of_measurement: "V" ## for any other unit the value is returned in minutes
    register_type: read
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.01
    device_class: voltage

  - platform: modbus_controller
    modbus_controller_id: epever
    id: pv_input_current
    name: "PV array input current"
    address: 0x3101
    unit_of_measurement: "A" ## for any other unit the value is returned in minutes
    register_type: read
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.01
    device_class: current

  - platform: modbus_controller
    modbus_controller_id: epever
    id: pv_input_power
    name: "PV array input power"
    address: 0x3102
    unit_of_measurement: "W" ## for any other unit the value is returned in minutes
    register_type: read
    value_type: U_DWORD_R
    accuracy_decimals: 1
    filters:
      - multiply: 0.01
    device_class: power

  ## CHARGER DATA
  - platform: modbus_controller
    modbus_controller_id: epever
    id: charging_voltage
    name: "Charging voltage"
    address: 0x3104
    unit_of_measurement: "V"
    register_type: read
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.01
    device_class: voltage

  - platform: modbus_controller
    modbus_controller_id: epever
    id: charging_current
    name: "Charging current"
    address: 0x3105
    unit_of_measurement: "A"
    register_type: read
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.01
    device_class: current

  - platform: modbus_controller
    modbus_controller_id: epever
    id: charging_power
    name: "Charging power"
    address: 0x3106
    unit_of_measurement: "W"
    register_type: read
    value_type: U_DWORD_R
    accuracy_decimals: 1
    filters:
      - multiply: 0.01
    device_class: power

  ## TEMPERATURES
  - platform: modbus_controller
    modbus_controller_id: epever
    id: battery_temperature
    name: "Battery temperature"
    address: 0x3110
    unit_of_measurement: °C
    state_class: measurement
    device_class: temperature
    register_type: read
    value_type: S_WORD
    accuracy_decimals: 1
    entity_category: "diagnostic"
    filters:
      - multiply: 0.01
      - or:
        - throttle: 30s
        - delta: 4% 
            

  - platform: modbus_controller
    modbus_controller_id: epever
    id: device_temperature
    name: "Device temperature"
    address: 0x3111
    unit_of_measurement: °C
    register_type: read
    value_type: S_WORD
    accuracy_decimals: 1
    entity_category: "diagnostic"
    filters:
      - multiply: 0.01
      - or:
        - throttle: 30s
        - delta: 4%

  - platform: modbus_controller
    modbus_controller_id: epever
    id: power_components_temperature
    name: "Power components temperature"
    entity_category: "diagnostic"
    address: 0x3112
    unit_of_measurement: °C
    register_type: read
    value_type: S_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.01
      - or:
        - throttle: 30s
        - delta: 4%

  ## BATTERY
  - platform: modbus_controller
    modbus_controller_id: epever
    id: battery_soc
    name: "Battery SOC"
    address: 0x311A
    unit_of_measurement: "%"
    register_type: read
    value_type: U_WORD
    accuracy_decimals: 0
    device_class: battery
    on_value_range: 
      below: 10
      then:
        - switch.turn_off: manual_control_load

  - platform: modbus_controller
    modbus_controller_id: epever
    id: battery_voltage
    name: "Battery voltage"
    address: 0x331A
    register_type: read
    value_type: U_WORD
    accuracy_decimals: 2
    unit_of_measurement: "V"
    filters:
      - multiply: 0.01
    device_class: voltage

  - platform: modbus_controller
    modbus_controller_id: epever
    id: battery_current
    name: "Battery current"
    address: 0x331B
    register_type: read
    value_type: S_DWORD_R
    register_count: 2
    accuracy_decimals: 2
    unit_of_measurement: "A"
    filters:
      - multiply: 0.01
    device_class: current

  - platform: template
    device_class: power
    accuracy_decimals: 2
    name: Battery Power
    id: battery_power
    unit_of_measurement: W
    update_interval: 5s
    lambda: !lambda return (id(battery_current).state * id(battery_voltage).state);
    filters:
      - round: 2
      - multiply: -1
          
  ## MINs & MAXs
  # min & Max Voltage PV
  - platform: modbus_controller
    modbus_controller_id: epever
    id: max_pv_voltage_today
    name: "Maximum PV voltage today"
    address: 0x3300
    register_type: read
    value_type: U_WORD
    accuracy_decimals: 1
    unit_of_measurement: "V"
    filters:
      - multiply: 0.01
    device_class: voltage
    entity_category: "diagnostic"

  - platform: modbus_controller
    modbus_controller_id: epever
    id: min_pv_voltage_today
    name: "Minimum PV voltage today"
    address: 0x3301
    register_type: read
    value_type: U_WORD
    accuracy_decimals: 1
    unit_of_measurement: "V"
    filters:
      - multiply: 0.01
    device_class: voltage
    entity_category: "diagnostic"

  # Min & Max Battery Voltage
  - platform: modbus_controller
    modbus_controller_id: epever
    id: max_battery_voltage_today
    name: "Maximum battery voltage today"
    address: 0x3302
    register_type: read
    value_type: U_WORD
    accuracy_decimals: 1
    unit_of_measurement: "V"
    filters:
      - multiply: 0.01
    device_class: voltage
    entity_category: "diagnostic"

  - platform: modbus_controller
    modbus_controller_id: epever
    id: min_battery_today
    name: "Minimum battery voltage today"
    address: 0x3303
    register_type: read
    value_type: U_WORD
    accuracy_decimals: 1
    unit_of_measurement: "V"
    filters:
      - multiply: 0.01
    device_class: voltage
    entity_category: "diagnostic"

  ## ENERGY
  # Consumed Energy
  - platform: modbus_controller
    modbus_controller_id: epever
    id: consumed_energy_today
    name: "Consumed energy today"
    address: 0x3304
    register_type: read
    value_type: U_DWORD_R
    accuracy_decimals: 2
    unit_of_measurement: "kWh"
    state_class: total_increasing
    device_class: energy
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: epever
    id: consumed_energy_month
    name: "Consumed Energy Month"
    address: 0x3306
    register_type: read
    value_type: U_DWORD_R
    accuracy_decimals: 2
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: epever
    id: consumed_energy_year
    name: "Consumed energy year"
    address: 0x3308
    register_type: read
    value_type: U_DWORD_R
    accuracy_decimals: 1
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: epever
    id: consumed_energy_total
    name: "Consumed energy total"
    address: 0x330A
    register_type: read
    value_type: U_DWORD_R
    accuracy_decimals: 1
    unit_of_measurement: "kWh"
    state_class: total_increasing
    device_class: energy
    filters:
      - multiply: 0.01

  # Generated Energy
  - platform: modbus_controller
    modbus_controller_id: epever
    id: generated_energy_today
    name: "Generated energy today"
    address: 0x330C
    register_type: read
    value_type: U_DWORD_R
    accuracy_decimals: 2
    unit_of_measurement: "kWh"
    state_class: total_increasing
    filters:
      - multiply: 0.01
    device_class: energy

  - platform: modbus_controller
    modbus_controller_id: epever
    id: generated_energy_month
    name: "Generated energy month"
    address: 0x330E
    register_type: read
    value_type: U_DWORD_R
    accuracy_decimals: 2
    unit_of_measurement: "kWh"
    filters:
      - multiply: 0.01
    device_class: energy
    state_class: total_increasing

  - platform: modbus_controller
    modbus_controller_id: epever
    id: generated_energy_year
    name: "Generated energy year"
    address: 0x3310
    register_type: read
    value_type: U_DWORD_R
    accuracy_decimals: 1
    unit_of_measurement: "kWh"
    filters:
      - multiply: 0.01
    device_class: energy
    state_class: total_increasing

  - platform: modbus_controller
    modbus_controller_id: epever
    id: generated_energy_total
    name: "Generated energy total"
    address: 0x3312
    register_type: read
    value_type: U_DWORD_R
    accuracy_decimals: 1
    unit_of_measurement: "kWh"
    device_class: "energy"
    state_class: "total_increasing"
    filters:
      - multiply: 0.01

  #Length of night
  - platform: modbus_controller
    modbus_controller_id: epever
    id: length_of_night_minutes
    address: 0x9065
    internal: True
    bitmask: 0xFF
    unit_of_measurement: m
    name: "Length of night-mins"
    register_type: holding
    value_type: U_WORD
    entity_category: "diagnostic"

  - platform: modbus_controller
    modbus_controller_id: epever
    id: length_of_night
    address: 0x9065
    bitmask: 0xFF00
    internal: False
    unit_of_measurement: h
    name: "Nighttime Duration"
    register_type: holding
    device_class: duration
    state_class: total
    value_type: U_WORD
    skip_updates: 50
    accuracy_decimals: 2
    filters:
