modbus:
  #flow_control_pin: 23
  send_wait_time: 100ms
  id: mod_bus_epever

modbus_controller:
  - id: epever
    ## the Modbus device addr
    address: 0x1
    modbus_id: mod_bus_epever
    #command_throttle: 200ms
    setup_priority: -10
    update_interval: 2s

