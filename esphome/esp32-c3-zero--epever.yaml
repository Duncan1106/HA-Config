text_sensor:
  - platform: modbus_controller
    modbus_controller_id: epever
    name: "rtc_clock"
    id: rtc_clock
    internal: true
    register_type: holding
    address: 0x9013
    register_count: 3
    raw_encode: HEXBYTES
    response_size: 6
    #                /*
    #                E20 Real time clock 9013 D7-0 Sec, D15-8 Min
    #                E21 Real time clock 9014 D7-0 Hour, D15-8 Day
    #                E22 Real time clock 9015 D7-0 Month, D15-8 Year
    #                */
    on_value:
      then:
        - lambda: |-
            ESP_LOGV("main", "decoding rtc hex encoded raw data: %s", x.c_str());
            uint8_t h=0,m=0,s=0,d=0,month_=0,y = 0 ;
            m = esphome::modbus_controller::byte_from_hex_str(x,0);
            s = esphome::modbus_controller::byte_from_hex_str(x,1);
            d = esphome::modbus_controller::byte_from_hex_str(x,2);
            h = esphome::modbus_controller::byte_from_hex_str(x,3);
            y = esphome::modbus_controller::byte_from_hex_str(x,4);
            month_ = esphome::modbus_controller::byte_from_hex_str(x,5);
            // Now check if the rtc time of the controller is ok and correct it
            time_t now = ::time(nullptr);
            struct tm *time_info = ::localtime(&now);
            int seconds = time_info->tm_sec;
            int minutes = time_info->tm_min;
            int hour = time_info->tm_hour;
            int day = time_info->tm_mday;
            int month = time_info->tm_mon + 1;
            int year = time_info->tm_year % 100;
            // correct time if needed (ignore seconds)
            if (d != day || month_ != month || y != year || h != hour || m != minutes) {
              // create the payload
              std::vector<uint16_t> rtc_data = {uint16_t((minutes << 8) | seconds), uint16_t((day << 8) | hour),
                                                uint16_t((year << 8) | month)};
              // Create a modbus command item with the time information as the payload
              esphome::modbus_controller::ModbusCommandItem set_rtc_command = esphome::modbus_controller::ModbusCommandItem::create_write_multiple_command(epever, 0x9013, 3, rtc_data);
              // Submit the command to the send queue
              epever->queue_command(set_rtc_command);
              ESP_LOGI("ModbusLambda", "EPSOLAR RTC set to %02d:%02d:%02d %02d.%02d.%04d", hour, minutes, seconds, day, month, year + 2000);
            }
            char buffer[20];
            // format time as YYYY-mm-dd hh:mm:ss
            sprintf(buffer,"%04d-%02d-%02d %02d:%02d:%02d",y+2000,month_,d,h,m,s);
            id(template_rtc).publish_state(buffer);

  - platform: template
    name: "RTC Time Sensor"
    id: template_rtc
    disabled_by_default: True

  - platform: modbus_controller
    modbus_controller_id: epever
    id: battery_status_text
    register_type: read
    address: 0x3200
    raw_encode: HEXBYTES
    name: "Battery Status"
    entity_category: "diagnostic"
    lambda: |-
      uint16_t value = modbus_controller::word_from_hex_str(x, 0);
      std::string status;

      // D15: Wrong identification
      if (value & (1 << 15)) status += "Wrong rated voltage; ";

      // D8: Battery internal resistance
      if (value & (1 << 8)) status += "Internal resistance abnormal; ";

      // D7-D4: Temperature
      uint8_t temp = (value >> 4) & 0x0F;
      switch (temp) {
        case 0: status += "Temperature normal; "; break;
        case 1: status += "Temperature over warning; "; break;
        case 2: status += "Temperature under warning; "; break;
      }

      // D3-D0: Voltage / discharge
      uint8_t volt = value & 0x0F;
      switch (volt) {
        case 0: status += "Voltage normal; "; break;
        case 1: status += "Over voltage; "; break;
        case 2: status += "Under voltage; "; break;
        case 3: status += "Over discharge; "; break;
        case 4: status += "Fault; "; break;
      }

      if (status.empty()) return std::string("Unknown");

      // Trim last "; "
      if (status.size() >= 2) status.erase(status.size() - 2);
      return status;

  - platform: modbus_controller
    modbus_controller_id: epever
    id: Charger_status
    name: "Charger status"
    address: 0x3201
    register_type: read
    entity_category: "diagnostic"
    raw_encode: HEXBYTES
    lambda: |-
      uint16_t value = modbus_controller::word_from_hex_str(x, 0);
      std::string status;

      // D15-D14: Input voltage status
      uint8_t input_voltage = (value >> 14) & 0x03;
      switch (input_voltage) {
        case 0: status += "Input voltage normal; "; break;
        case 1: status += "No input power connected; "; break;
        case 2: status += "Higher input voltage; "; break;
        case 3: status += "Input voltage error; "; break;
      }

      // Single-bit flags
      if (value & (1 << 13)) status += "Charging MOSFET short circuit; ";
      if (value & (1 << 12)) status += "Charging/Anti-reverse MOSFET open circuit; ";
      if (value & (1 << 11)) status += "Anti-reverse MOSFET short circuit; ";
      if (value & (1 << 10)) status += "Input over current; ";
      if (value & (1 << 9))  status += "Load over current; ";
      if (value & (1 << 8))  status += "Load short circuit; ";
      if (value & (1 << 7))  status += "Load MOSFET short circuit; ";
      if (value & (1 << 6))  status += "Disequilibrium in three circuits; ";
      if (value & (1 << 4))  status += "PV input short circuit; ";

      // D3-D2: Charging status
      uint8_t charge_status = (value >> 2) & 0x03;
      switch (charge_status) {
        case 0: status += "No charging; "; break;
        case 1: status += "Float charging; "; break;
        case 2: status += "Boost charging; "; break;
        case 3: status += "Equalization charging; "; break;
      }

      // D1 and D0: Normal/Fault + Running/Standby
      bool fault = value & (1 << 1);
      bool running = value & (1 << 0);

      if (!fault && !running) status += "Standby (Normal); ";
      else if (!fault && running) status += "Running (Normal); ";
      else if (fault && !running) status += "Standby (Fault); ";
      else if (fault && running) status += "Running (Fault); ";

      if (status.empty()) return std::string("Unknown");
      
      // trim last "; " 
      if (status.size() >= 2) status.erase(status.size()-2);
      return status;

  - platform: modbus_controller
    modbus_controller_id: epever
    id: discharger_status
    name: "Discharger status"
    address: 0x3202
    register_type: read
    raw_encode: HEXBYTES
    entity_category: "diagnostic"
    lambda: |-
      uint16_t value = modbus_controller::word_from_hex_str(x, 0);
      std::string status;

      // D15-D14: Input voltage
      uint8_t input_voltage = (value >> 14) & 0x03;
      switch (input_voltage) {
        case 0: status += "Input voltage normal; "; break;
        case 1: status += "Input voltage low; "; break;
        case 2: status += "Input voltage high; "; break;
        case 3: status += "No access; "; break;
      }

      // D13-D12: Output power
      uint8_t output_power = (value >> 12) & 0x03;
      switch (output_power) {
        case 0: status += "Light load; "; break;
        case 1: status += "Moderate load; "; break;
        case 2: status += "Rated load; "; break;
        case 3: status += "Overload; "; break;
      }

      // Single-bit flags
      if (value & (1 << 11)) status += "Short circuit; ";
      if (value & (1 << 10)) status += "Unable to discharge; ";
      if (value & (1 << 9))  status += "Unable to stop discharging; ";
      if (value & (1 << 8))  status += "Output voltage abnormal; ";
      if (value & (1 << 7))  status += "Input over voltage; ";
      if (value & (1 << 6))  status += "Short circuit in high voltage side; ";
      if (value & (1 << 5))  status += "Boost over voltage; ";
      if (value & (1 << 4))  status += "Output over voltage; ";

      // D1 and D0 combined give normal/fault + running/standby
      bool fault = value & (1 << 1);
      bool running = value & (1 << 0);

      if (!fault && !running) status += "Standby (Normal); ";
      else if (!fault && running) status += "Running (Normal); ";
      else if (fault && !running) status += "Standby (Fault); ";
      else if (fault && running) status += "Running (Fault); ";

      if (status.empty()) return std::string("Unknown");
      
      // trim last "; " 
      if (status.size() >= 2) status.erase(status.size()-2);
      return status;


  # Management modes of battery charge and discharge, voltage compensation : 0 and SOC : 1
  - platform: modbus_controller
    modbus_controller_id: epever
    id: Charging_Mode
    name: "Charging Mode"
    address: 0x9070
    register_type: holding
    raw_encode: HEXBYTES
    entity_category: "diagnostic"
    lambda: |-
      uint16_t value = modbus_controller::word_from_hex_str(x, 0);
      switch (value) {
        case 0: return std::string("Voltage Compensation");
        case 1: return std::string("SOC Cmpensation");
        default: return std::string("Unknown");
      }
      return x;