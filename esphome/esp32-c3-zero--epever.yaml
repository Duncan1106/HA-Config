packages:
  - !include common/logger.yaml
  - !include common/common_things.yaml

# Enable Home Assistant API
api:
  encryption:
    key: "Bx/CVee4FXuG3rdAxwGJaESkEdW0/mCbpbJtmS5iPbc="

ota:
  - platform: esphome
    encryption:

wifi:
  output_power: 15dB
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip: 
    gateway: 192.168.2.1
    subnet: 255.255.255.0
    dns1: 192.168.2.1
    static_ip: 192.168.2.42
  ap:
    ssid: "Esp32-C3-Zero--Epever"
    password: !secret ap_password

captive_portal:

esphome:
  name: esp32-c3-zero--epever
  friendly_name: esp32 c3 zero - epever

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino
  variant: ESP32C3

light:
  - platform: esp32_rmt_led_strip
    pin: GPIO10
    id: led_status
    chipset: WS2812
    channel_colors: RGB
    num_leds: 1
    name: Status LED

i2c:
  sda: GPIO6 #green
  scl: GPIO7 # yellow
  scan: False
  id: bus_a

sensor:
  ## BME280
  - platform: bme280_i2c
    temperature:
      name: "BME280 Temperature"
      id: bme280_temperature
      filters: 
        - or: 
          - delta: 2%
          - throttle: 30s
    pressure:
      name: "BME280 Pressure"
      id: bme280_pressure
      filters: 
        - or: 
          - delta: 2%
          - throttle: 30s
    humidity:
      name: "BME280 Relative Humidity"
      id: bme280_humidity
      filters: 
        - or: 
          - delta: 2%
          - throttle: 30s
    address: 0x76
    iir_filter: 16x
    update_interval: 10s