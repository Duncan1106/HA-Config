styles: |
  :host([expanded]) ha-md-list {
    display: grid;
    grid-template-columns: repeat(4, 25%);
    grid-template-rows: auto auto auto auto auto 1fr auto;
    overflow: visible !important;
  }
  
  :host([expanded]) ha-md-list > ha-md-list-item {
    grid-column: 1 / 5;
    height: 48px;
  }
  
  :host([expanded]) ha-md-list > ha-md-list-item[tp] {
    width: 100% !important;
    position: relative;
    overflow: visible !important;
    --md-list-item-leading-space: 0px !important;
    --md-list-item-trailing-space: 0px !important;
  }

  /* 1. Force the inner container to use the full width and center content */
  :host([expanded]) ha-md-list-item[tp]::part(inner) {
    display: flex !important;
    justify-content: center !important;
    align-items: center !important;
    width: 100% !important;
    padding: 0 !important;
  }

  /* 2. Target the 'start' slot specifically to stop it from hugging the left */
  :host([expanded]) ha-md-list-item[tp] [slot="start"] {
    margin: 0 !important;
    display: flex !important;
    justify-content: center !important;
    width: 100% !important;
  }

  /* 3. Ensure the icon itself has no alignment margins */
  :host([expanded]) ha-md-list-item[tp] ha-svg-icon {
    margin: 0 !important;
    position: relative !important;
  }

  :host([expanded]) ha-md-list-item[tp] > .item-text {
    display: none !important;
  }

  /* 4. Badge Logic (HACS and Config) */
  :host([expanded]) ha-md-list-item[tp] .badge {
    display: none !important;
  }

  :host([expanded]) ha-md-list-item[tp="hacs"] .badge:not(:empty),
  :host([expanded]) ha-md-list-item[tp="config"] .badge:not(:empty) {
    display: flex !important;
    position: absolute !important;
    /* Anchor to the center of the grid cell */
    left: 50% !important;
    top: 50% !important;
    /* Adjust translate to put it on the icon's top-right corner */
    transform: translate(4px, -18px) !important; 
    
    width: auto !important;
    min-width: 18px !important;
    height: 18px !important;
    padding: 0 4px !important;
    justify-content: center !important;
    align-items: center !important;
    background-color: var(--accent-color, #ff5252) !important;
    color: white !important;
    border-radius: 10px !important;
    font-size: 11px !important;
    font-weight: bold !important;
    z-index: 5 !important;
    pointer-events: none;
  }

  /* Row Mapping */
  :host([expanded]) ha-md-list-item[tp="zigbee2mqtt"] { grid-column: 1 / 2; }
  :host([expanded]) ha-md-list-item[tp="z2m-map"] { grid-column: 2 / 3; }
  :host([expanded]) ha-md-list-item[tp="frigate"] { grid-column: 3 / 4; }
  :host([expanded]) ha-md-list-item[tp="file-editor"] { grid-column: 4 / 5; }

  :host([expanded]) ha-md-list-item[tp="hacs"] { grid-column: 1 / 2; }
  :host([expanded]) ha-md-list-item[tp="integrations"] { grid-column: 2 / 3; }
  :host([expanded]) ha-md-list-item[tp="automations"] { grid-column: 3 / 4; }
  :host([expanded]) ha-md-list-item[tp="cafe"] { grid-column: 4 / 5; }

  :host([expanded]) ha-md-list-item[tp="info"] { grid-column: 1 / 2; }
  :host([expanded]) ha-md-list-item[tp="dev-to"] { grid-column: 2 / 3; }
  :host([expanded]) ha-md-list-item[tp="config"] { grid-column: 3 / 4; }