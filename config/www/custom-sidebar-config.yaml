id: main_sidebar
title: "Hallo {{ user_name }}"
subtitle: "Reif für die 550"
sidebar_editable: false
order:
  - item: /dashboard-enya
    match: href
    hide: true
  - item: /calendar
    match: href
    hide: true
  - item: /todo
    match: href
    hide: true
  - item: /logbook
    match: href
    hide: true
  - item: /map
    match: href
    hide: true
  - item: /history
    match: href
    hide: true
  - item: /lovelace
    order: 0
    match: href
  - item: /fire-hd-8
    match: href
    order: 1
  - item: /energy
    icon: mdi:home-lightning-bolt-outline
    match: href
    order: 2
  - item: /test-sankey
    match: href
    icon: mdi:chart-sankey
    order: 3
    info: |
        Haus: {{states('sensor.home_power', with_unit=True)}} | Netz: {{states('sensor.grid_power', with_unit=True)}}
  - item: /media-browser
    match: href
    order: 4
    info: |
        Size: {{ states('sensor.media_folder_size', with_unit=True) }}
    divider: true
    divider_color: 'var(--secondary-text-color)'
  - item: /config
    order: 5
    match: href
    hide: '[[[ user_is_admin ]]]'
  - item: /45df7312_zigbee2mqtt
    match: href
    name: Z2M
    order: 5
    bottom: true
    hide: '[[[ !user_is_admin ]]]'
    attributes:
      tp: zigbee2mqtt
  - item: /zigbee-map
    match: href
    name: Z2M Map
    order: 6
    bottom: true
    hide: '[[[ !user_is_admin ]]]'
    attributes:
      tp: z2m-map
  - item: /ccab4aaf_frigate-fa
    match: href
    order: 7
    bottom: true
    hide: '[[[ !user_is_admin ]]]'
    attributes:
      tp: frigate
  - item: /core_configurator
    bottom: true
    match: href
    order: 8
    hide: '[[[ !user_is_admin ]]]'
    attributes:
      tp: file-editor
  - item: /hacs
    match: href
    order: 9
    bottom: true
    hide: '[[[ !user_is_admin ]]]'
    attributes:
      tp: hacs
    notification: |
      [[[
        const outdatedHacsEntities = Object.values(entities.update).filter(
          (entity) => entity.platform === 'hacs' && is_state(entity.entity_id, 'on')
        );
        return outdatedHacsEntities.length || '';
      ]]]
  - item: Integrationen
    icon: mdi:puzzle
    order: 10
    bottom: true
    new_item: true
    href: "/config/integrations"
    hide: '[[[ !user_is_admin ]]]'
    attributes:
      tp: integrations
  - item: Automationen
    icon: mdi:robot
    order: 11
    bottom: true
    new_item: true
    href: "/config/automation"
    hide: '[[[ !user_is_admin ]]]'
    attributes:
      tp: automations
  - item: /dashboard-analysis
    order: 12
    match: href
    bottom: true
    hide: '[[[ !user_is_admin ]]]'
    attributes:
      tp: analytics
    divider: true
    divider_color: 'var(--secondary-text-color)'
  - item: 'Developer Tools'
    href: '/developer-tools'
    new_item: true
    icon: mdi:tools
    order: 13
    bottom: true
    hide: '[[[ !user_is_admin ]]]'
    attributes:
      tp: dev-to
    divider: true
    divider_color: 'var(--secondary-text-color)'
  - item: /config
    match: href
    order: 14
    bottom: true
    hide: '[[[ !user_is_admin ]]]'
    attributes:
      tp: config
    divider: true
    divider_color: 'var(--secondary-text-color)'
  - item: notifications
    hide: |
      [[[
        const notifications = states('sensor.persistent_notifications');
        return !notifications || notifications === '0'
      ]]]

styles: |
  :host([expanded]) ha-md-list {
    display: grid;
    grid-template-columns: repeat(4, 25%);
    grid-template-rows: auto auto auto auto 1fr auto;
    overflow: visible !important;
  }
  
  :host([expanded]) ha-md-list > ha-md-list-item {
    grid-column: 1 / 5;
    height: 48px;
  }
  
  :host([expanded]) ha-md-list > ha-md-list-item[tp] {
    width: 100% !important;
    position: relative;
    overflow: visible !important;
    --md-list-item-leading-space: 0px !important;
    --md-list-item-trailing-space: 0px !important;
  }

  /* 1. Force the inner container to use the full width and center content */
  :host([expanded]) ha-md-list-item[tp]::part(inner) {
    display: flex !important;
    justify-content: center !important;
    align-items: center !important;
    width: 100% !important;
    padding: 0 !important;
  }

  /* 2. Target the 'start' slot specifically to stop it from hugging the left */
  :host([expanded]) ha-md-list-item[tp] [slot="start"] {
    margin: 0 !important;
    display: flex !important;
    justify-content: center !important;
    width: 100% !important;
  }

  /* 3. Ensure the icon itself has no alignment margins */
  :host([expanded]) ha-md-list-item[tp] ha-svg-icon {
    margin: 0 !important;
    position: relative !important;
  }

  :host([expanded]) ha-md-list-item[tp] > .item-text {
    display: none !important;
  }

  /* 4. Badge Logic (HACS and Config) */
  :host([expanded]) ha-md-list-item[tp] .badge {
    display: none !important;
  }

  :host([expanded]) ha-md-list-item[tp="hacs"] .badge:not(:empty),
  :host([expanded]) ha-md-list-item[tp="config"] .badge:not(:empty) {
    display: flex !important;
    position: absolute !important;
    /* Anchor to the center of the grid cell */
    left: 50% !important;
    top: 50% !important;
    /* Adjust translate to put it on the icon's top-right corner */
    transform: translate(4px, -18px) !important; 
    
    width: auto !important;
    min-width: 18px !important;
    height: 18px !important;
    padding: 0 4px !important;
    justify-content: center !important;
    align-items: center !important;
    background-color: var(--accent-color, #ff5252) !important;
    color: white !important;
    border-radius: 10px !important;
    font-size: 11px !important;
    font-weight: bold !important;
    z-index: 5 !important;
    pointer-events: none;
  }

  /* Row Mapping */
  :host([expanded]) ha-md-list-item[tp="zigbee2mqtt"] { grid-column: 1 / 2; }
  :host([expanded]) ha-md-list-item[tp="z2m-map"] { grid-column: 2 / 3; }
  :host([expanded]) ha-md-list-item[tp="frigate"] { grid-column: 3 / 4; }
  :host([expanded]) ha-md-list-item[tp="file-editor"] { grid-column: 4 / 5; }

  :host([expanded]) ha-md-list-item[tp="hacs"] { grid-column: 1 / 2; }
  :host([expanded]) ha-md-list-item[tp="integrations"] { grid-column: 2 / 3; }
  :host([expanded]) ha-md-list-item[tp="automations"] { grid-column: 3 / 4; }

  :host([expanded]) ha-md-list-item[tp="analytics"] { grid-column: 1 / 2; }
  :host([expanded]) ha-md-list-item[tp="dev-to"] { grid-column: 2 / 3; }
  :host([expanded]) ha-md-list-item[tp="config"] { grid-column: 3 / 4; }