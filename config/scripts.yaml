restart_internet:
  sequence:
  - sequence:
    - action: automation.turn_off
      metadata: {}
      data:
        stop_actions: true
      target:
        entity_id: automation.restart_o2_router_if_internet_down_for_5_minutes
    - action: switch.turn_off
      metadata: {}
      data: {}
      target:
        entity_id:
        - switch.o2_router
    - delay:
        hours: 0
        minutes: 0
        seconds: 20
        milliseconds: 0
    - action: switch.turn_on
      metadata: {}
      data: {}
      target:
        entity_id:
        - switch.o2_router
    - wait_for_trigger:
      - entity_id:
        - binary_sensor.internet_connection
        from: 'off'
        to: 'on'
        for:
          hours: 0
          minutes: 0
          seconds: 30
        trigger: state
      timeout:
        hours: 0
        minutes: 15
        seconds: 0
        milliseconds: 0
      continue_on_timeout: false
    - action: notify.duncan
      metadata: {}
      data:
        title: Internet
        message: Connection restored
    - action: automation.turn_on
      metadata: {}
      target:
        entity_id: automation.restart_o2_router_if_internet_down_for_5_minutes
  alias: Restart Internet
  description: ''
