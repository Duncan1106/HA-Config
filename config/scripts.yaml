luftbefeuchter:
  alias: Luftbefeuchter
  sequence:
  - if:
    - condition: and
      conditions:
      - condition: sun
        after: sunrise
        before: sunset
        before_offset: -01:00:00
        after_offset: +01:00:00
      - condition: state
        entity_id: input_boolean.terrarium_on
        state: 'on'
      - condition: numeric_state
        entity_id: sensor.esp32_c3_mini_terra_terrarium_humidity_average
        below: input_number.terrarium_humidity_control_threshold
        enabled: true
      - condition: device
        type: is_off
        device_id: cb754e11257e7b140e732b51b3457d49
        entity_id: 0da0445bb1137737a147e4ab96e26655
        domain: switch
    then:
    - alias: Reset
      metadata: {}
      data:
        topic: cmnd/tasmota_18F373/pulsetime3
        payload: '0'
      action: mqtt.publish
    - alias: '10 Minuten '
      metadata: {}
      data:
        topic: cmnd/tasmota_18F373/pulsetime3
        payload: '700'
      action: mqtt.publish
    - type: turn_on
      device_id: cb754e11257e7b140e732b51b3457d49
      entity_id: 0da0445bb1137737a147e4ab96e26655
      domain: switch
    - metadata: {}
      data: {}
      target:
        entity_id: counter.luftbefeuchter
      action: counter.increment
    alias: If air dry -> humidifier on
  - if:
    - condition: template
      value_template: '{% set hum = states(''sensor.esp32_c3_mini_terra_terrarium_humidity_average'')
        | float(0) %}

        {% set offset = states(''input_number.terrarium_humidity_control_threshold_offset'')
        | float(0) %}

        {% set threshold = (states(''input_number.terrarium_humidity_control_threshold'')
        | float(0) ) %}

        {% set compare = threshold + offset %}

        {{ hum >= compare}}'
    then:
    - type: turn_off
      device_id: cb754e11257e7b140e732b51b3457d49
      entity_id: 0da0445bb1137737a147e4ab96e26655
      domain: switch
    - alias: '0 Minuten '
      metadata: {}
      data:
        topic: cmnd/tasmota_18F373/pulsetime3
        payload: '0'
      action: mqtt.publish
    alias: If air moist -> humidifier off
  mode: single
