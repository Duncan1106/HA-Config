          - condition: state
            entity_id: light.esp32_c3_mini_bett_nachtlicht_bettlicht
            state:
            - 'off'
      then:
      - metadata: {}
        data: {}
        target:
          entity_id: light.esp32_s3_zero_lichtschranke_big_led
        action: light.turn_on
      - metadata: {}
        data:
          brightness_pct: 90
        target:
          entity_id:
          - light.esp32_c3_mini_kallax_light_kallax_licht
