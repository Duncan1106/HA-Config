adjust_input_number:
  alias: Adjust Input Number
  description: Modify any numeric helper by a specific amount.
  fields:
    target_entity:
      name: Target Entity
      description: Select the input_number to modify.
      required: true
      selector:
        entity:
          domain: input_number
    operation:
      name: Operation
      description: Add to or subtract from the current value.
      default: add
      selector:
        select:
          options:
          - label: Add (+)
            value: add
          - label: Subtract (-)
            value: subtract
    amount:
      name: Value
      description: The amount to use for the adjustment.
      required: true
      selector:
        number:
          min: 0
          max: 1000000
          step: 0.01
          mode: box
  sequence:
  - action: input_number.set_value
    target:
      entity_id: '{{ target_entity }}'
    data:
      value: '{% set current = states(target_entity) | float(0) %} {% set val = amount
        | float(0) %} {{ current + val if operation == ''add'' else current - val
        }}

        '
notify_people_at_home_with_fallbacks:
  alias: Notify People at Home (With Fallbacks)
  description: Sends a notification to people home, with default values if fields
    are missing.
  fields:
    message:
      description: The main body of the notification
      example: The garage is open
      required: true
      selector:
        text:
      name: Message
    title:
      description: '''Fallback: ''Home Assistant'''
      example: Security
      selector:
        text:
      name: Title
    tag:
      description: 'Fallback: ''general_notification'''
      example: garage_status
      selector:
        text:
      name: Notification Tag
    color:
      selector:
        text: {}
    notification_icon:
      description: Optional notification icon (e.g. mdi:alert)
      selector:
        text:
      name: Notification Icon
    channel:
      description: Notification Channel
      selector:
        text:
      name: Channel
  sequence:
  - variables:
      final_title: "{{ title if title is defined and title | trim | length > 0\n   else
        'Home Assistant' }}"
      final_tag: "{{ tag if tag is defined and tag | trim | length > 0\n   else 'general_notification'
        }}"
      notify_data: "{% set base_data = dict(tag=final_tag) %} {% if color is defined
        and color %}\n  {% set base_data = base_data | combine(dict(color=color))
        %}\n{% endif %}  {% if notification_icon is defined and notification_icon
        %}\n  {% set base_data = base_data | combine(dict(notification_icon=notification_icon))
        %}\n{% endif %}  {% if channel is defined and channel %}\n  {% set base_data
        = base_data | combine(dict(channel=channel)) %}\n{% endif %} {{ dict(message=message,
        title=final_title, data=base_data) }}"
  - if:
    - condition: template
      value_template: '{{ message == ''clear_notification'' }}'
    then:
    - action: notify.familie
      data:
        message: '{{ message }}'
        data:
          tag: '{{ final_tag }}'
    else:
    - if:
      - condition: state
        entity_id: binary_sensor.anyone_home
        state:
        - 'on'
      then:
      - repeat:
          for_each:
          - person: person.stephan
            service: mobile_app_stephan_iphone
          - person: person.katalin
            service: mobile_app_fp4
          - person: person.enya
            service: mobile_app_iphone_von_enya
          - person: person.duncan
            service: duncan
          sequence:
          - if:
            - condition: template
              value_template: '{{ is_state(repeat.item.person, ''home'') }}'
            then:
            - action: notify.{{ repeat.item.service }}
              continue_on_error: true
              data: '{{ notify_data }}'
      else:
      - action: notify.familie
        metadata: {}
        data: '{{ notify_data }}'
  mode: parallel
  max: 50
shawn_weekly_edge_cut:
  alias: 'Shawn: Weekly Edge Cut'
  description: "\U0001F4CB Intelligent Mowing Maintenance Control\n---\n#### **High-Level
    Intent**\nThis script orchestrates a specialized dual-pass edge cutting routine
    for the robotic mower, \"Shawn.\" It ensures that the perimeter is maintained
    with high precision by running the edge-specific program twice in a controlled
    loop.\n\n#### **Operational Strategy**\nThe routine utilizes a state-aware deployment
    strategy. Rather than relying on simple timers, it monitors the mower's real-time
    status to confirm successful deployment and docking before proceeding to the next
    phase of the cycle.\n\n#### **Reliability Mechanisms**\nTo prevent the automation
    from hanging indefinitely due to hardware or connectivity issues, every transitional
    phase is protected by strict **timeout** constraints (ranging from 5 to 15 minutes).
    The system provides mobile notifications at the start and conclusion of the process
    for remote monitoring.\n\n---\n\n### Sequence & Logic Overview\n\n| Type | Entity
    / Condition | ID | Purpose |\n| :--- | :--- | :--- | :--- |\n| Action | **button.shawn_kanten_mahen**
    | Start Command | Triggers the specific edge-cutting hardware routine. |\n| Wait
    | **sensor.shawn_rasenmaher_status** | Exit Dock | Confirms mower has transitioned
    out of **standby** or **charging**. |\n| Wait | **sensor.shawn_rasenmaher_status**
    | Active Work | Monitors for **mowing** or **on_the_way_home** to verify movement.
    |\n| Action | **button.shawn_zum_dock_fahren** | Return Home | Commands the mower
    to return to the charging station. |\n| Wait | **sensor.shawn_rasenmaher_status**
    | Dock Confirmation | Ensures the mower is **charging** before initiating the
    second pass. |\n\n---\n\n#### Edge Cutting Routine (2x Loop)\n- **Purpose**\n
    \ To execute two consecutive edge-trimming passes to ensure complete coverage
    and a clean finish.\n- **Logic Overview**\n  The system triggers the edge cut
    and enters a \"watchdog\" mode. It first waits for the mower to physically leave
    the base (not **standby**/**charging**). Once the mower is confirmed to be in
    an active state (**mowing** or **on_the_way_home**), the system instructs it to
    return to the dock to reset for the next pass.\n- **Effect**\n  Cycles the **button.shawn_kanten_mahen**
    and **button.shawn_zum_dock_fahren** entities; updates user via **notify.duncan**.\n\n---\n\n###
    Technical Overview\n- **Sceipt Mode**: Single (Default)\n- **Execution Method**:
    Scripted sequence with a **repeat** loop (Count: 2)\n- **Key Inputs**: **sensor.shawn_rasenmaher_status**\n-
    **Controlled Entities**: **button.shawn_kanten_mahen**, **button.shawn_zum_dock_fahren**,
    **notify.duncan**\n- **Safety Mechanisms**: \n    - **5-minute timeout** for initial
    dock exit.\n    - **15-minute timeout** for work completion and return-to-dock
    transitions.\n\n---\n\n### \U0001F4A1 Notes\n- **State Transition Logic**: The
    script uses a clever \"not in standby/charging\" wait template. This ensures that
    the mower has actually acknowledged the command and begun movement before the
    logic proceeds to look for active working states.\n- **Fail-Safe**: If the mower
    becomes stuck or fails to reach the next state within 15 minutes, the sequence
    will terminate, preventing the script from running in the background indefinitely.\n-
    **Notification**: The use of **notify.duncan** provides a clear audit trail of
    when the routine started and whether it reached the final completion stage."
  sequence:
  - action: notify.duncan
    data:
      title: '✂️ Shawn: Weekly Edge Cut'
      message: Starting dual edge cut routine.
      data:
        tag: shawn_edge_cut
  - repeat:
      count: 2
      sequence:
      - action: button.press
        target:
          entity_id: button.shawn_kanten_mahen
        data: {}
      - wait_for_trigger:
        - trigger: state
          entity_id:
          - lawn_mower.shawn
          to:
          - mowing_border
        timeout:
          hours: 0
          minutes: 15
          seconds: 0
          milliseconds: 0
        alias: Wait for border start
      - alias: Wait for returning or working -> border is finished
        wait_for_trigger:
        - trigger: state
          entity_id:
          - lawn_mower.shawn
          to:
          - returning
          - return
          - mowing
        timeout:
          hours: 0
          minutes: 15
          seconds: 0
          milliseconds: 0
      - action: button.press
        target:
          entity_id: button.shawn_zum_dock_fahren
        data: {}
      - alias: Wait for Charging
        wait_for_trigger:
        - trigger: state
          entity_id:
          - lawn_mower.shawn
          to:
          - charging
        timeout:
          hours: 0
          minutes: 15
          seconds: 0
          milliseconds: 0
      - delay:
          hours: 0
          minutes: 0
          seconds: 30
          milliseconds: 0
        alias: 'Wait between Iterations '
  - action: notify.duncan
    data:
      title: '✅ Shawn: Task Complete'
      message: Dual edge cut routine finished successfully.
      data:
        tag: shawn_edge_cut
pool_secure_pulsetime_update:
  alias: Pool - Secure PulseTime Update
  description: Disables auto-adjust, updates Tasmota, and holds the automation lock
    safely in a background thread.
  fields:
    payload:
      description: The Tasmota PulseTime payload string or template calculation
      example: '28895'
      required: true
    lock_duration:
      description: How long to keep the auto-adjust automation disabled (HH:MM:SS)
      example: 00:05:00
      required: true
  sequence:
  - action: automation.turn_off
    data:
      stop_actions: true
    target:
      entity_id: automation.pool_pulsetime_auto_adjust
  - action: mqtt.publish
    data:
      topic: cmnd/tasmota_837238/pulsetime1
      payload: '{{ payload }}'
    continue_on_error: true
  - delay: '{{ lock_duration }}'
    continue_on_error: true
  - action: automation.turn_on
    target:
      entity_id: automation.pool_pulsetime_auto_adjust
toggle_goe11_key:
  alias: Toggle GoE11 Key
  fields:
    key_name:
      name: Key Name
      description: The JSON key to toggle (e.g. pv_active)
      selector:
        text:
      required: true
  sequence:
  - action: input_text.set_value
    target:
      entity_id: input_text.goe11_cache
    data:
      value: '{% set c = states(''input_text.goe11_cache'') | from_json(default={})
        %} {% set c = c if c is mapping else {} %} {% set new_val = not c.get(key_name,
        false) %} {{ c | combine({key_name: new_val}) | to_json }}

        '
retry_action_with_backoff_power_monitoring:
  alias: Retry Action with Backoff Power Monitoring
  description: 'Retries a service call until the entity reaches the desired state
    or max retries are reached, using simple, linear, or exponential backoff. Supports
    custom action domain and custom action type.

    '
  mode: parallel
  fields:
    entity_id:
      name: Entity
      description: The entity to monitor and act on.
      required: true
      selector:
        entity: {}
    target_state:
      name: Target State
      description: The desired state for the entity (e.g., on, off, open, closed,
        or custom).
      required: true
      selector:
        select:
          options:
          - label: 'On'
            value: 'on'
          - label: 'Off'
            value: 'off'
          - label: Open
            value: open
          - label: Closed
            value: closed
          - label: Custom
            value: custom
    custom_target_state:
      name: Custom Target State
      description: Specify a custom state if Target State is 'Custom'.
      required: false
      selector:
        text: {}
    action_domain:
      name: Action Domain
      description: Domain for the service call (e.g., light, switch). Defaults to
        'homeassistant'.
      required: false
      default: homeassistant
      selector:
        select:
          options:
          - label: Home Assistant (default)
            value: homeassistant
          - label: Switch
            value: switch
          - label: Light
            value: light
          - label: Custom
            value: custom
    custom_action_domain:
      name: Custom Action Domain
      description: Specify a custom domain if 'Custom' is selected above (e.g., cover,
        climate)
      required: false
      selector:
        text: {}
    action_type:
      name: Action Type
      description: Action to perform (e.g., turn_on, turn_off, toggle, open, close,
        or custom)
      default: turn_on
      selector:
        select:
          options:
          - label: Turn On
            value: turn_on
          - label: Turn Off
            value: turn_off
          - label: Toggle
            value: toggle
          - label: Custom
            value: custom
    custom_action_type:
      name: Custom Action Type
      description: Specify a custom action type if 'Custom' is selected above (e.g.,
        lock, set_temperature)
      required: false
      selector:
        text: {}
    service_data:
      name: Service Data
      description: 'Optional additional data for the service call (e.g., {"option":
        "Charge"} for select.select_option). Must be valid YAML/dict format.'
      required: false
      selector:
        text: {}
    custom_action:
      name: Custom Action
      description: Optional override default action with a custom one.
      required: false
      selector:
        action: {}
    max_retries:
      name: Max Retries
      description: Maximum number of attempts.
      default: 10
      selector:
        number:
          min: 1
          max: 20
          mode: box
          step: 1
    base_delay:
      name: Base Delay
      description: Base delay in seconds for backoff calculation.
      default: 5
      selector:
        number:
          min: 1
          max: 60
          mode: box
          step: 1
          unit_of_measurement: seconds
    max_delay:
      name: Max Delay
      description: Maximum delay in seconds for any backoff type.
      default: 60
      selector:
        number:
          min: 1
          max: 600
          mode: box
          step: 1
          unit_of_measurement: seconds
    backoff_type:
      name: Backoff Type
      description: Strategy for retry delays (simple, linear, exponential).
      default: simple
      selector:
        select:
          options:
          - label: Simple
            value: simple
          - label: Linear
            value: linear
          - label: Exponential
            value: exponential
    notify_on_failure:
      name: Notify on Failure
      description: Send a notification if the target state was not reached after max_retries.
      required: false
      default: true
      selector:
        boolean: {}
    notify_service:
      name: Notify Service
      description: Service to use for failure notifications (e.g., notify.duncan).
      required: false
      default: notify.duncan
      selector:
        text: {}
    enable_power_controller:
      name: Enable Power Controller
      description: Monitor power consumption to confirm the device actually turned
        on or off.
      default: false
      selector:
        boolean: {}
    power_sensor:
      name: Power Sensor (Optional)
      description: Explicit power sensor entity. If left blank, it will attempt auto-detection.
      required: false
      selector:
        entity:
          domain: sensor
          device_class: power
    power_threshold_off:
      name: Power Threshold (Off Validation)
      description: Power level (Watts) below which the device is considered fully
        off.
      default: 2
      selector:
        number:
          min: 0.1
          max: 100
          step: 0.1
          mode: box
          unit_of_measurement: W
    power_threshold_on:
      name: Power Threshold (On Validation)
      description: Minimum power level (Watts) expected when the device is turned
        on.
      default: 5
      selector:
        number:
          min: 0.1
          max: 5000
          step: 0.1
          mode: box
          unit_of_measurement: W
    power_report_delay:
      name: Power Report Delay
      description: Time to wait (seconds) for the sensor to update its reading after
        a state change.
      default: 0
      selector:
        number:
          min: 0
          max: 300
          step: 1
          mode: box
          unit_of_measurement: seconds
    power_wait_timeout:
      name: Power Wait Timeout
      description: Additional time to wait (seconds) for power to clear the threshold
        after the report delay.
      default: 10
      selector:
        number:
          min: 1
          max: 60
          step: 1
          mode: box
          unit_of_measurement: seconds
  sequence:
  - alias: Define Base Variables
    variables:
      effective_target_state: "{% if target_state == \"custom\" %}\n  {{ custom_target_state
        | default('') }}\n{% else %}\n  {{ target_state }}\n{% endif %}"
      effective_action_domain: "{% set d = action_domain | default('homeassistant')
        %} {% if d == 'custom' %}\n  {{ custom_action_domain | default('') }}\n{%
        else %}\n  {{ d }}\n{% endif %}"
      effective_action_type: "{% set t = action_type | default('turn_on') %} {% if
        t == 'custom' %}\n  {{ custom_action_type | default('') }}\n{% else %}\n  {{
        t }}\n{% endif %}"
      effective_service_data: "{% set data_str = service_data | default('') | string
        %} {% if data_str and data_str != 'None' and data_str.strip() %}\n  {% if
        data_str.startswith('{') and data_str.endswith('}') %}\n    {{ data_str }}\n
        \ {% else %}\n    {{ {} }}\n  {% endif %}\n{% else %}\n  {{ {} }}\n{% endif
        %}"
      power_threshold_off_val: '{{ power_threshold_off | default(2.0) | float }}'
      power_threshold_on_val: '{{ power_threshold_on | default(5.0) | float }}'
      power_timeout_val: '{{ power_wait_timeout | default(10) | int }}'
      power_report_delay_val: '{{ power_report_delay | default(0) | int }}'
      effective_power_sensor: "{% if enable_power_controller | default(false) %}\n
        \ {% if power_sensor is defined and power_sensor != none and power_sensor
        | string | trim != '' %}\n    {{ power_sensor }}\n  {% else %}\n    {% set
        dev_id = device_id(entity_id) %}\n    {% if dev_id %}\n      {% set entities
        = device_entities(dev_id) %}\n      {% set ns = namespace(sensors=[]) %}\n
        \     {% for e in entities %}\n        {% if e.startswith('sensor.') and state_attr(e,
        'device_class') == 'power' %}\n          {% set ns.sensors = ns.sensors +
        [e] %}\n        {% endif %}\n      {% endfor %}\n      {{ ns.sensors[0] if
        ns.sensors | length == 1 else 'none' }}\n    {% else %}\n      none\n    {%
        endif %}\n  {% endif %}\n{% else %}\n  none\n{% endif %}"
      power_enabled: '{{ enable_power_controller | default(false) and effective_power_sensor
        != ''none'' and effective_target_state in [''on'', ''off''] }}'
      has_service_data: '{{ service_data is defined and service_data not in [none,
        '''', {}] }}'
  - alias: Validate entity exists
    condition: template
    value_template: '{{ entity_id is defined and states(entity_id) is not none }}'
  - alias: Calculate Initial Step Variables
    variables:
      target_match: '{{ is_state(entity_id, effective_target_state) }}'
      current_power: '{{ states(effective_power_sensor) | float(0) if power_enabled
        else 0 }}'
      power_invalid: "{{ power_enabled and target_match and (\n  (effective_target_state
        == 'off' and current_power >= power_threshold_off_val) or\n  (effective_target_state
        == 'on' and current_power < power_threshold_on_val)\n) }}"
      power_ok: '{{ not power_enabled or not target_match or not power_invalid }}'
  - alias: Skip if already in target state (power monitoring disabled)
    condition: template
    value_template: '{{ not target_match or power_enabled or has_service_data }}'
  - alias: Skip if power signature is already valid
    condition: template
    value_template: '{{ not target_match or power_invalid or has_service_data }}'
  - alias: Skip if already in target state
    condition: template
    value_template: '{{ not target_match or not power_ok or has_service_data }}'
  - repeat:
      until:
      - condition: template
        value_template: "{% set p_ok = true %} {% if power_enabled and is_state(entity_id,
          effective_target_state) %}\n  {% set cur = states(effective_power_sensor)
          | float(0) %}\n  {% set p_ok = (effective_target_state == 'off' and cur
          < power_threshold_off_val) or\n                (effective_target_state ==
          'on' and cur >= power_threshold_on_val) %}\n{% endif %}  {{ (is_state(entity_id,
          effective_target_state) and p_ok) or\n   has_service_data or \n   repeat.index
          >= (max_retries | int(10)) or \n   states(entity_id) in ['unavailable','unknown']
          }}"
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ custom_action is defined and custom_action != none
              }}'
          sequence:
          - repeat:
              for_each: '{{ custom_action }}'
              sequence:
              - choose:
                - conditions:
                  - condition: template
                    value_template: '{{ repeat.item.target is defined and repeat.item.data
                      is defined }}'
                  sequence:
                  - target: '{{ repeat.item.target }}'
                    data: '{{ repeat.item.data }}'
                    action: '{{ repeat.item.action }}'
                - conditions:
                  - condition: template
                    value_template: '{{ repeat.item.target is defined }}'
                  sequence:
                  - target: '{{ repeat.item.target }}'
                    action: '{{ repeat.item.action }}'
                - conditions:
                  - condition: template
                    value_template: '{{ repeat.item.data is defined }}'
                  sequence:
                  - data: '{{ repeat.item.data }}'
                    action: '{{ repeat.item.action }}'
                default:
                - action: '{{ repeat.item.action }}'
        default:
        - action: '{{ effective_action_domain }}.{{ effective_action_type }}'
          target:
            entity_id: '{{ entity_id }}'
          data: '{{ effective_service_data }}'
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ not is_state(entity_id, effective_target_state) }}'
          sequence:
          - wait_template: '{{ is_state(entity_id, effective_target_state) }}'
            timeout: "{% set bd = base_delay | default(5, true) | float %}  {% set
              md = max_delay | default(60, true) | float %} {% set idx = repeat.index
              %} {% if backoff_type == 'linear' %}\n  {{ [idx * bd, md] | min }}\n{%
              elif backoff_type == 'exponential' %}\n  {{ [2**(idx-1) * bd, md] |
              min }}\n{% else %}\n  {{ [bd, md] | min }}\n{% endif %}"
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ power_enabled and is_state(entity_id, effective_target_state)
              }}'
          sequence:
          - alias: Wait for power to hit the target threshold direction
            wait_template: "{% set cur = states(effective_power_sensor) | float(0)
              %} {{ (effective_target_state == 'off' and cur < power_threshold_off_val)
              or\n   (effective_target_state == 'on' and cur >= power_threshold_on_val)
              }}"
            timeout: '{{ power_report_delay_val + power_timeout_val }}'
            continue_on_timeout: true
          - choose:
            - conditions:
              - condition: template
                value_template: "{% set cur = states(effective_power_sensor) | float(0)
                  %} {{ (effective_target_state == 'off' and cur >= power_threshold_off_val)
                  or\n   (effective_target_state == 'on' and cur < power_threshold_on_val)
                  }}"
              sequence:
              - alias: Power signature invalid - Run inverted cycle step to force
                  retry
                action: '{{ ''homeassistant.turn_on'' if effective_target_state ==
                  ''off'' else ''homeassistant.turn_off'' }}'
                target:
                  entity_id: '{{ entity_id }}'
              - alias: Short delay before next loop iteration
                delay: 2
  - alias: Calculate Notification Variables
    variables:
      final_state: '{{ states(entity_id) }}'
      power_failed: "{% set cur = states(effective_power_sensor) | float(0) %} {{
        power_enabled and final_state == effective_target_state and (\n     (effective_target_state
        == 'off' and cur >= power_threshold_off_val) or\n     (effective_target_state
        == 'on' and cur < power_threshold_on_val)\n   ) }}"
      now_str: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
      friendly: '{{ state_attr(entity_id, ''friendly_name'') or entity_id | replace(''.'',
        '' '') | replace(''_'', '' '') }}'
      params_line: action={{ effective_action_domain }}.{{ effective_action_type }},
        target={{ effective_target_state }}, retries={{ max_retries | default(10)
        }}, base={{ base_delay | default(5) }}s, max={{ max_delay | default(60) }}s,
        backoff={{ backoff_type | default('simple') }}, {{ "custom_action=" + custom_action|string
        if custom_action is defined and custom_action != none else "" }}
      tag_value: retry_action_with_backoff__{{ entity_id | replace('.', '_') }}
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ final_state in [''unavailable'',''unknown''] }}'
      - condition: template
        value_template: '{{ notify_on_failure | default(true) }}'
      sequence:
      - action: '{{ notify_service | default(''notify.duncan'') }}'
        data:
          title: 'Entity: {{ friendly }} - {{ final_state }}'
          message: '{{ now_str }} | entity={{ entity_id }} (state={{ final_state }})
            | {{ params_line }}'
          data:
            tag: '{{ tag_value }}'
    - conditions:
      - condition: template
        value_template: '{{ notify_on_failure | default(true) }}'
      - condition: template
        value_template: '{{ final_state != effective_target_state or power_failed
          }}'
      sequence:
      - action: '{{ notify_service | default(''notify.duncan'') }}'
        data:
          title: 'Retry failed: {{ friendly }}'
          message: '{{ now_str }} | entity={{ entity_id }} (state={{ final_state }})
            | {{ params_line }}'
          data:
            tag: '{{ tag_value }}'
