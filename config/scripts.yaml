5_min_turn_off_ganglicht:
  sequence:
  - sequence:
    - wait_for_trigger:
      - type: turned_on
        device_id: 65dc6f7c36b0f6afa7943d9f2f12368e
        entity_id: 564e927e962a99447ddb8d55d189ca32
        domain: light
        trigger: device
      timeout:
        hours: 0
        minutes: 0
        seconds: 10
        milliseconds: 0
      continue_on_timeout: true
    - alias: Wait 5min if light is on and turn off
      if:
      - condition: device
        type: is_on
        device_id: 65dc6f7c36b0f6afa7943d9f2f12368e
        entity_id: 564e927e962a99447ddb8d55d189ca32
        domain: light
      then:
      - delay:
          hours: 0
          minutes: 4
          seconds: 50
          milliseconds: 0
      - if:
        - condition: template
          enabled: true
          value_template: '{{ state_attr(''light.esp32_c3_mini_treppenhaus_licht'',''brightness'')|
            int(1) < 28 }}'
        then:
        - action: light.turn_off
          metadata: {}
          data: {}
          target:
            entity_id: light.esp32_c3_mini_treppenhaus_licht
        - repeat:
            sequence:
            - type: turn_off
              device_id: 65dc6f7c36b0f6afa7943d9f2f12368e
              entity_id: 564e927e962a99447ddb8d55d189ca32
              domain: light
            - delay:
                hours: 0
                minutes: 0
                seconds: 5
                milliseconds: 0
            until:
            - condition: state
              entity_id: light.ganglicht_zigbee_led
              state: 'off'
  alias: 5 Min Turn Off Ganglicht
  description: ''
  mode: restart
  max_exceeded: silent
