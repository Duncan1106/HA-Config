        data:
          action_domain: light
          action_type: turn_off
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: simple
          notify_on_failure: true
          notify_service: notify.duncan
          target_state: 'off'
          entity_id: light.esp32_c3_mini_bett_nachtlicht_bettlicht
  - alias: Nightime
