warmelampe:
  alias: Wärmelampe
  sequence:
  - alias: If Temp < 24 -> heat on
    if:
    - condition: numeric_state
      entity_id: sensor.esp32_c3_mini_terra_terrarium_temperature_average
      below: 25
    then:
    - action: script.retry_action_with_backoff
      metadata: {}
      data:
        action_domain: switch
        action_type: turn_on
        max_retries: 10
        base_delay: 5
        max_delay: 60
        backoff_type: simple
        notify_on_failure: true
        notify_service: notify.duncan
        entity_id: switch.terrarium_zigbee_strip_l3
        target_state: 'on'
      continue_on_error: true
  - alias: If Temp > 32 -> heat off
    if:
    - condition: or
      conditions:
      - condition: numeric_state
        entity_id: sensor.esp32_c3_mini_terra_terrarium_temperature_average
        above: 33
      - condition: numeric_state
        entity_id: sensor.t_h_terrarium_temperature
        above: 27
    then:
    - action: script.retry_action_with_backoff
      metadata: {}
      data:
        action_domain: switch
        action_type: turn_off
        max_retries: 10
        base_delay: 5
        max_delay: 60
        backoff_type: simple
        notify_on_failure: true
        notify_service: notify.duncan
        entity_id: switch.terrarium_zigbee_strip_l3
        target_state: 'off'
      continue_on_error: true
    else: []
  mode: queued
'1716068747270':
  alias: Ambient Daytime Lighting Control
  sequence:
  - alias: Daytime
    if:
    - condition: sun
      before: sunset
      after: sunrise
    then:
    - if:
      - condition: and
        conditions:
        - condition: state
          entity_id: binary_sensor.esphome_web_529778_room_occupied
          state:
          - 'on'
        - condition: or
          conditions:
          - condition: state
            entity_id: light.esp32_c3_mini_picture_light_licht
            state:
            - 'off'
          - condition: state
            entity_id: binary_sensor.esp32_c3_mini_bett_nachtlicht_master_bed_occupied
            state:
            - 'off'
      then:
      - metadata: {}
        data:
          brightness_pct: 75
        target:
          entity_id:
          - light.esp32_c3_mini_picture_light_licht
        action: light.turn_on
      - metadata: {}
        data:
          brightness_pct: 80
        target:
          entity_id:
          - light.esp32_c3_mini_kallax_light_kallax_licht
        action: light.turn_on
      else:
      - action: script.retry_action_with_backoff
        metadata: {}
        data:
          action_domain: light
          action_type: turn_off
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: simple
          notify_on_failure: true
          notify_service: notify.duncan
          target_state: 'off'
          entity_id: light.esp32_c3_mini_picture_light_licht
      - action: script.retry_action_with_backoff
