retry_action_with_backoff:
  alias: Retry Action with Backoff
  description: 'Retries a service call until the entity reaches the desired state
    or max retries are reached, using simple, linear, or exponential backoff. Supports
    custom action domain and custom action type.

    '
  mode: parallel
  fields:
    entity_id:
      name: Entity
      description: The entity to monitor and act on.
      required: true
      selector:
        entity: {}
    target_state:
      name: Target State
      description: The desired state for the entity (e.g., on, off, open, closed,
        or custom).
      required: true
      selector:
        select:
          options:
          - label: 'On'
            value: 'on'
          - label: 'Off'
            value: 'off'
          - label: Open
            value: open
          - label: Closed
            value: closed
          - label: Custom
            value: custom
    custom_target_state:
      name: Custom Target State
      description: Specify a custom state if Target State is 'Custom'.
      required: false
      selector:
        text: {}
    action_domain:
      name: Action Domain
      description: Domain for the service call (e.g., light, switch). Defaults to
        'homeassistant'.
      required: false
      default: homeassistant
      selector:
        select:
          options:
          - label: Home Assistant (default)
            value: homeassistant
          - label: Switch
            value: switch
          - label: Light
            value: light
          - label: Custom
            value: custom
    custom_action_domain:
      name: Custom Action Domain
      description: Specify a custom domain if 'Custom' is selected above (e.g., cover,
        climate)
      required: false
      selector:
        text: {}
    action_type:
      name: Action Type
      description: Action to perform (e.g., turn_on, turn_off, toggle, open, close,
        or custom)
      default: turn_on
      selector:
        select:
          options:
          - label: Turn On
            value: turn_on
          - label: Turn Off
            value: turn_off
          - label: Toggle
            value: toggle
          - label: Custom
            value: custom
    custom_action_type:
      name: Custom Action Type
      description: Specify a custom action type if 'Custom' is selected above (e.g.,
        lock, set_temperature)
      required: false
      selector:
        text: {}
    service_data:
      name: Service Data
      description: 'Optional additional data for the service call (e.g., {"option":
        "Charge"} for select.select_option). Must be valid YAML/dict format.'
      required: false
      selector:
        text: {}
    custom_action:
      name: Custom Action
      description: Optional override default action with a custom one.
      required: false
      selector:
        action: {}
    max_retries:
      name: Max Retries
      description: Maximum number of attempts.
      default: 10
      selector:
        number:
          min: 1
          max: 20
          mode: box
          step: 1
    base_delay:
      name: Base Delay
      description: Base delay in seconds for backoff calculation.
      default: 5
      selector:
        number:
          min: 1
          max: 60
          mode: box
          step: 1
          unit_of_measurement: seconds
    max_delay:
      name: Max Delay
      description: Maximum delay in seconds for any backoff type.
      default: 60
      selector:
        number:
          min: 1
          max: 600
          mode: box
          step: 1
          unit_of_measurement: seconds
    backoff_type:
      name: Backoff Type
      description: Strategy for retry delays (simple, linear, exponential).
      default: simple
      selector:
        select:
          options:
          - label: Simple
            value: simple
          - label: Linear
            value: linear
          - label: Exponential
            value: exponential
    notify_on_failure:
      name: Notify on Failure
      description: Send a notification if the target state was not reached after max_retries.
      required: false
      default: true
      selector:
        boolean: {}
    notify_service:
      name: Notify Service
      description: Service to use for failure notifications (e.g., notify.duncan).
      required: false
      default: notify.duncan
      selector:
        text: {}
  variables:
    effective_target_state: "{% if target_state == \"custom\" %}\n  {{ custom_target_state
      | default('') }}\n{% else %}\n  {{ target_state }}\n{% endif %}\n"
    effective_action_domain: "{% set d = action_domain | default('homeassistant')
      %} {% if d == 'custom' %}\n  {{ custom_action_domain | default('') }}\n{% else
      %}\n  {{ d }}\n{% endif %}\n"
    effective_action_type: "{% set t = action_type | default('turn_on') %} {% if t
      == 'custom' %}\n  {{ custom_action_type | default('') }}\n{% else %}\n  {{ t
      }}\n{% endif %}\n"
    effective_service_data: "{% set data_str = service_data | default('') | string
      %}\n{% if data_str and data_str != 'None' and data_str.strip() %}\n  {% if data_str.startswith('{')
      and data_str.endswith('}') %}\n    {{ data_str }}\n  {% else %}\n    {{ {} }}\n
      \ {% endif %}\n{% else %}\n  {{ {} }}\n{% endif %}\n"
  sequence:
  - condition: template
    value_template: '{{ entity_id is defined and states(entity_id) is not none }}'
    alias: Validate entity exists
  - alias: Skip if already in target state
    condition: template
    value_template: '{{ (not is_state(entity_id, effective_target_state)) or (service_data
      is defined) }}'
  - repeat:
      until:
      - condition: template
        value_template: "{{ ((is_state(entity_id, effective_target_state) or service_data
          is defined) or repeat.index >= max_retries | int(10)) or states(entity_id)
          is in\n      ['unavailable','unknown'] }}\n"
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ custom_action is defined and custom_action != none
              }}'
          sequence:
          - repeat:
              for_each: '{{ custom_action }}'
              sequence:
              - choose:
                - conditions:
                  - condition: template
                    value_template: '{{ repeat.item.target is defined and repeat.item.data
                      is defined }}'
                  sequence:
                  - target: '{{ repeat.item.target }}'
                    data: '{{ repeat.item.data }}'
                    action: '{{ repeat.item.action }}'
                - conditions:
                  - condition: template
                    value_template: '{{ repeat.item.target is defined }}'
                  sequence:
                  - target: '{{ repeat.item.target }}'
                    action: '{{ repeat.item.action }}'
                - conditions:
                  - condition: template
                    value_template: '{{ repeat.item.data is defined }}'
                  sequence:
                  - data: '{{ repeat.item.data }}'
                    action: '{{ repeat.item.action }}'
                default:
                - action: '{{ repeat.item.action }}'
        default:
        - target:
            entity_id: '{{ entity_id }}'
          data: '{{ effective_service_data }}'
          action: '{{ (effective_action_domain | default(''homeassistant'')) }}.{{
            effective_action_type }}

            '
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ not is_state(entity_id, effective_target_state) }}'
          sequence:
          - wait_template: '{{ is_state(entity_id, effective_target_state) }}'
            timeout: "{% set bd = base_delay | default(5, true) | float() %} {% set
              md = max_delay |default(60, true) | float() %} {% if backoff_type ==
              'simple' %}\n  {{ [bd, md] | min }}\n{% elif backoff_type == 'linear'
              %}\n  {{ [repeat.index * bd, md] | min }}\n{% elif backoff_type == 'exponential'
              %}\n  {{ [2**(repeat.index-1) * bd, md] | min }}\n{% else %}\n  {{ [bd,
              md] | min }}\n{% endif %}\n"
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ states(entity_id) is in\n      ['unavailable','unknown']
          }}"
      - condition: template
        value_template: '{{ notify_on_failure | default(true) }}'
      sequence:
      - variables:
          now_str: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
          friendly: '{{ state_attr(entity_id, ''friendly_name'') or entity_id | replace(''.'',
            '' '') | replace(''_'', '' '')}}'
          params_line: "action={{ effective_action_domain }}.{{ effective_action_type
            }}, target={{ effective_target_state }}, retries={{ max_retries }}, base={{
            base_delay }}s, max={{ max_delay }}s, backoff={{ backoff_type }},\n {{
            \"custom_action=\" + custom_action|string if custom_action is defined
            and custom_action != none else \"\" }}"
          tag_value: retry_action_with_backoff__{{ (entity_id | replace('.', '_'))
            }}
      - action: '{{ notify_service | default(''notify.duncan'') }}'
        data:
          title: 'Entity: {{ friendly }} - {{states(entity_id)}}'
          message: '{{ now_str }} | entity={{ entity_id }} (state={{ states(entity_id)
            }}) | {{ params_line }}'
          data:
            tag: '{{ tag_value }}'
    - conditions:
      - condition: template
        value_template: '{{ notify_on_failure | default(true) }}'
      - condition: template
        value_template: '{{ not is_state(entity_id, effective_target_state) }}'
      sequence:
      - variables:
          now_str: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
          friendly: '{{ state_attr(entity_id, ''friendly_name'') or entity_id | replace(''.'',
            '' '') | replace(''_'', '' '')}}'
          params_line: "action={{ effective_action_domain }}.{{ effective_action_type
            }},  target={{ effective_target_state }}, retries={{ max_retries | default(10)
            }},  base={{ base_delay | default(5) }}s, max={{ max_delay | default(60)
            }}s,  backoff={{ backoff_type | default('simple') }},\n {{ \"custom_action=\"
            + custom_action|string if custom_action is defined and custom_action !=
            none else \"\" }}"
          tag_value: retry_action_with_backoff__{{ (entity_id | replace('.', '_'))
            }}
      - action: '{{ notify_service | default(''notify.duncan'') }}'
        data:
          title: 'Retry failed: {{ friendly }}'
          message: '{{ now_str }} | entity={{ entity_id }} (state={{ states(entity_id)
            }}) | {{ params_line }}'
          data:
            tag: '{{ tag_value }}'
  max: 256
