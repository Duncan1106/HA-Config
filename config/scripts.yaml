charge_ev_message_with_optional_disable:
  mode: restart
  sequence:
  - alias: Set up variables
    variables:
      action_confirm: '{{ ''CONFIRM_'' ~ context.id }}'
      action_dismiss: '{{ ''DISMISS_'' ~ context.id }}'
  - alias: Send notification
    domain: mobile_app
    type: notify
    device_id: 905c163dcc62544838edb078413723b2
    title: ☀️ EV Charging ☀️
    message: 'Plug in a Car to charge with Solar:

      {{ states(''sensor.evs_home_and_ready_to_charge'') }}  {# Shows the Evs based
      on device tracker and their soc, if not full and at home then the ouput is for
      example Zoe: 99% or Zoe: 99%\nID.4: 87% #}'
    data:
      tag: ev_duncan
      actions:
      - action: '{{ action_confirm }}'
        title: Will do
      - action: '{{ action_dismiss }}'
        title: Car Full or no Car
    enabled: true
  - alias: Awaiting response
    wait_for_trigger:
    - event_type: mobile_app_notification_action
      event_data:
        action: '{{ action_confirm }}'
      trigger: event
    - event_type: mobile_app_notification_action
      event_data:
        action: '{{ action_dismiss }}'
      trigger: event
    timeout:
      hours: 2
      minutes: 30
      seconds: 0
      milliseconds: 0
    continue_on_timeout: false
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ wait.trigger.event.data.action == action_confirm }}'
      sequence:
      - action: script.retry_action_with_backoff
        metadata: {}
        data:
          action_domain: switch
          action_type: turn_on
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: simple
          notify_on_failure: true
          notify_service: notify.duncan
          entity_id: switch.schreibtisch_links_power_strip_l3
          target_state: 'on'
    - conditions:
      - condition: template
        value_template: '{{ wait.trigger.event.data.action == action_dismiss }}'
      sequence:
      - metadata: {}
        data:
          value: 10
        target:
          entity_id: counter.ev_charging_messages
        action: counter.set_value
  alias: Charge EV Message with optional Disable Poco F6
  description: ''
