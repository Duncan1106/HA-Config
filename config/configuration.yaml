cover:
  - platform: template
    covers:
      wintergarten_dachfenster:
        device_class: window
        unique_id: wintergarten_dachfenster
        optimistic: false
        friendly_name: "Wintergarten Dachfenster"
        value_template: "{{ is_state('binary_sensor.dachfenster_wintergarten','on') }}"
        open_cover:
          action: script.wintergarten_dachfenster_open
        close_cover:
          action: script.wintergarten_dachfenster_close
        stop_cover:
          action: script.wintergarten_dachfenster_stop
      
      wintergarten_rolladen_dachfenster:
        device_class: blind
        unique_id: wintergarten_rolladen_dachfenster
        optimistic: true
        friendly_name: "Wintergarten Rolladen Dachfenster"
        #value_template: "{{ states('sensor.garage_door')|float > 0 }}"
        open_cover:
          action: script.wintergarten_dachfenster_rolladen_open
        close_cover:
          action: script.wintergarten_dachfenster_rolladen_close
        stop_cover:
          action: script.wintergarten_dachfenster_rolladen_stop

binary_sensor:
  - platform: rest
    verify_ssl: false
    scan_interval: 60
    method: POST
    resource: "http://192.168.2.205:8080/api/device/fxs500pro234920229/details"
    name: "HDD - SMART Status"
    unique_id: hdd_smart_status
    value_template: "{{ bool(value_json['data']['smart_results'][0]['Status']) }}"
    device_class: problem

mqtt:
  switch:
    - name: "Tasmota Rule 1"
      unique_id: tasmota_157F88_rule1_switch
      command_topic: "cmnd/tasmota_157F88/Rule1"
      payload_on: "ON"
      payload_off: "OFF"
      state_topic: "stat/tasmota_157F88/RESULT"
      value_template: >
        {% if value_json.Rule1 is defined and value_json.Rule1.State in ['ON', 'OFF'] %}
          {{ value_json.Rule1.State }}
        {% else %}
          ON
        {% endif %}
      optimistic: false
      icon: mdi:script
      device:
        connections:
          - ["mac", "C8C9A3157F88"]
        identifiers:
          - "C8C9A3157F88"
        manufacturer: "NOUS"
        name: "Kaffeemaschine Solis"
        model: "A1T"

    - name: "Tasmota Rule 2"
      unique_id: tasmota_157F88_rule2_switch
      command_topic: "cmnd/tasmota_157F88/Rule2"
      payload_on: "ON"
      payload_off: "OFF"
      state_topic: "stat/tasmota_157F88/RESULT"
      value_template: >
        {% if value_json.Rule2 is defined and value_json.Rule2.State in ['ON', 'OFF'] %}
          {{ value_json.Rule2.State }}
        {% else %}
          ON
        {% endif %}
      optimistic: false
      icon: mdi:script
      device:
        connections:
          - ["mac", "C8C9A3157F88"]
        identifiers:
          - "C8C9A3157F88"
        manufacturer: "NOUS"
        name: "Kaffeemaschine Solis"
        model: "A1T"

    - name: "Tasmota Rule 3"
      unique_id: tasmota_157F88_rule3_switch
      command_topic: "cmnd/tasmota_157F88/Rule3"
      payload_on: "ON"
      payload_off: "OFF"
      state_topic: "stat/tasmota_157F88/RESULT"
      value_template: >
        {% if value_json.Rule3 is defined and value_json.Rule3.State in ['ON', 'OFF'] %}
          {{ value_json.Rule3.State }}
        {% else %}
          ON
        {% endif %}
      optimistic: false
      icon: mdi:script
      device:
        connections:
          - ["mac", "C8C9A3157F88"]
        identifiers:
          - "C8C9A3157F88"
        manufacturer: "NOUS"
        name: "Kaffeemaschine Solis"
        model: "A1T"

  sensor:
    - state_topic: fully-single-app/deviceInfo/a9641507-a9641507
      name: Fully Kiosk Device Info
      unique_id: fully_kiosk_device_info
      json_attributes_topic: fully-single-app/deviceInfo/a9641507-a9641507
      force_update: true
      value_template: "{{ value_json['deviceName'] }}"

    - name: "Smart Meter MQTT Data"
      state_topic: "smartmeter-em420/"
      value_template: "{{ value_json['smart-meter']['status'] }}"
      unique_id: smart_meter_mqtt_data
      json_attributes_topic: "smartmeter-em420/"
      json_attributes_template: "{{ value_json['smart-meter'] | tojson }}"
      device:
        name: "Smart Meter"
        identifiers: 
         - "em420"
  
    - name: "MQTT_Stats_Messages_Received"
      state_topic: "$SYS/brokers/emqx@homeassistant.local/metrics/messages/received"
      state_class: total
      unit_of_measurement: messages
      unique_id: mqtt_stats_messages_received
    - name: "MQTT_Stats_Messages_Sent"
      state_topic: "$SYS/brokers/emqx@homeassistant.local/metrics/messages/sent"
      state_class: total
      unit_of_measurement: messages
      unique_id: mqtt_stats_messages_sent
    - name: "MQTT_Stats_Bytes_Received"
      state_topic: "$SYS/brokers/emqx@homeassistant.local/metrics/bytes/received"
      device_class: data_size
      state_class: total
      unit_of_measurement: B
      unique_id: mqtt_stats_bytes_received
    - name: "MQTT_Stats_Bytes_Sent"
      state_topic: "$SYS/brokers/emqx@homeassistant.local/metrics/bytes/sent"
      device_class: data_size
      state_class: total
      unit_of_measurement: B
      unique_id: mqtt_stats_bytes_sent
    - name: "MQTT_Stats_Uptime"
      state_topic: "$SYS/brokers/emqx@homeassistant.local/uptime"
      state_class: total
      device_class: duration
      unit_of_measurement: ms
      unique_id: mqtt_stats_uptime
    
    - name: Zigbee2mqtt Networkmap
      # if you change base_topic of Zigbee2mqtt, change state_topic accordingly
      state_topic: zigbee2mqtt/bridge/response/networkmap
      value_template: >-
        {{ now().strftime('%Y-%m-%d %H:%M:%S') }}
      # again, if you change base_topic of Zigbee2mqtt, change json_attributes_topic accordingly
      json_attributes_topic: zigbee2mqtt/bridge/response/networkmap
      json_attributes_template: "{{ value_json.data.value | tojson }}"

