multiscrape:
  - name: LNGInventory
    resource: "https://alsi.gie.eu/api?date=today"
    log_response: false
    button:
      - name: 'Refresh LNG'
        unique_id: refesh_lng_sensors
    scan_interval: 3600
    headers:
      content-type: "application/json"
      x-key: !secret gas_token
    sensor:
      - unique_id: eu_lng_inventory
        name: EU LNG Inventory
        value_template: "{{ value_json.data[0].inventory.lng }}"
        unit_of_measurement: "10³ m³ LNG"
        state_class: measurement
        attributes:
          - name: name
            value_template: "{{ value_json.data[0].name }}"
          - name: code
            value_template: "{{ value_json.data[0].code }}"
          - name: lng_inventory_gwh
            value_template: "{{ value_json.data[0].inventory.gwh }}"
          - name: lng_inventory_lng
            value_template: "{{ value_json.data[0].inventory.lng }}"
          - name: sendOut
            value_template: "{{ value_json.data[0].sendOut }}"
          - name: dtmi_gwh
            value_template: "{{ value_json.data[0].dtmi.gwh }}"
          - name: dtmi_lng
            value_template: "{{ value_json.data[0].dtmi.lng }}"
          - name: dtrs
            value_template: "{{ value_json.data[0].dtrs }}"
          - name: contractedCapacity
            value_template: "{{ value_json.data[0].contractedCapacity }}"
          - name: availableCapacity
            value_template: "{{ value_json.data[0].availableCapacity }}"
          - name: coveredCapacity
            value_template: "{{ value_json.data[0].coveredCapacity }}"
          - name: status
            value_template: "{{ value_json.data[0].status }}"

      - unique_id: germany_lng_inventory
        name: Germany LNG Inventory
        value_template: >
          {% set germany = value_json.data[0].children | selectattr('name', 'equalto', 'Germany') | list | first %}
          {{ germany.inventory.lng }}
        unit_of_measurement: "10³ m³ LNG"
        state_class: measurement
        attributes:
          - name: name
            value_template: >
              {% set germany = value_json.data[0].children | selectattr('name', 'equalto', 'Germany') | list | first %}
              {{ germany.name }}
          - name: code
            value_template: >
              {% set germany = value_json.data[0].children | selectattr('name', 'equalto', 'Germany') | list | first %}
              {{ germany.code }}
          - name: lng_inventory_gwh
            value_template: >
              {% set germany = value_json.data[0].children | selectattr('name', 'equalto', 'Germany') | list | first %}
              {{ germany.inventory.gwh }}
          - name: lng_inventory_lng
            value_template: >
              {% set germany = value_json.data[0].children | selectattr('name', 'equalto', 'Germany') | list | first %}
              {{ germany.inventory.lng }}
          - name: sendOut
            value_template: >
              {% set germany = value_json.data[0].children | selectattr('name', 'equalto', 'Germany') | list | first %}
              {{ germany.sendOut }}
          - name: dtmi_gwh
            value_template: >
              {% set germany = value_json.data[0].children | selectattr('name', 'equalto', 'Germany') | list | first %}
              {{ germany.dtmi.gwh }}
          - name: dtmi_lng
            value_template: >
              {% set germany = value_json.data[0].children | selectattr('name', 'equalto', 'Germany') | list | first %}
              {{ germany.dtmi.lng }}
          - name: dtrs
            value_template: >
              {% set germany = value_json.data[0].children | selectattr('name', 'equalto', 'Germany') | list | first %}
              {{ germany.dtrs }}
