multiscrape:
  - name: Tibber Pulse Metrics
    resource: !secret tibber_pulse_url
    method: GET
    scan_interval: 900
    headers:
      Content-Type: application/json
      User-Agent: REST
    button:
      - name: 'Refresh Tibber Node'
        unique_id: refresh_tibber_node
    sensor:
       - unique_id: tibber_pulse_metrics
         name: Tibber Pulse Metrics
         state_class: measurement
         device_class: voltage
         unit_of_measurement: V
         value_template: "{{ value_json.node_status.node_battery_voltage | float(0) }}"
         attributes:
           - name: payload
             value_template: "{{ value_json }}"
           - name: Uptime ms
             value_template: "{{ value_json.node_status.node_uptime_ms | float(0) }}"
           - name: RSSI
             value_template: "{{ value_json.node_status.node_avg_rssi | float(0) }}"
           - name: LQI
             value_template: "{{ value_json.node_status.node_avg_lqi | float(0) }}"
           - name: Temperature
             value_template: "{{ value_json.node_status.node_temperature | float(0) }}"
           - name: Uptime
             value_template: >
                {% set uptime = value_json.node_status.node_uptime_ms | float(0) / 1000 %}
                {% set boot_time = now() - timedelta(seconds=uptime) %}
                {{ boot_time | time_since(2) }}

  - name: Tibber Bridge Metrics
    resource: !secret tibber_bridge_url
    method: GET
    scan_interval: 900
    headers:
      Content-Type: application/json
      User-Agent: REST
    button:
      - name: 'Refresh Tibber Bridge'
        unique_id: refresh_tibber_bridge
    binary_sensor:
       - unique_id: tibber_bridge_metrics
         name: Tibber Bridge Metrics
         value_template: "{{ value_json.pairing_status }}"
         attributes:
           - name: payload
             value_template: "{{ value_json }}"
           - name: Uptime
             value_template: >
                {% set uptime = value_json.up_time | float(0) / 1000 %}
                {% set boot_time = now() - timedelta(seconds=uptime) %}
                {{ boot_time | time_since(2) }}

  - name: NVME SSD
    resource: "http://192.168.2.205:8080/api/device/fxs500pro234920229/details"
    scan_interval: 60
    headers:
      Content-Type: application/json
      User-Agent: REST
    method: GET
    button:
      - name: 'Refresh NVME SSD'
        unique_id: refresh_nvme_ssd
    binary_sensor:
      - unique_id: nvme_ssd_status
        name: NVME SSD Status
        device_class: problem
        value_template: "{{ bool(value_json.data.device.device_status) }}"
        attributes:          
          - name: "Model Name"
            value_template: >-
              {% set sr = value_json.data.device | default([], true) %}
              {{ (sr.model_name if sr|length>0 and sr.model_name is defined else 'unavailable') }}
          - name: "Device Name"
            value_template: >-
              {% set sr = value_json.data.device | default([], true) %}
              {{ (sr.device_name if sr|length>0 and sr.device_name is defined else 'unavailable') }}
          - name: "Serial Number"
            value_template: >-
              {% set sr = value_json.data.device | default([], true) %}
              {{ (sr.serial_number if sr|length>0 and sr.serial_number is defined else 'unavailable') }}
          - name: "Updated At"
            value_template: >-
              {% set sr = value_json.data.device | default([], true) %}
              {{ (sr.UpdatedAt if sr|length>0 and sr.UpdatedAt is defined else 'unavailable') }}
          - name: "Device Status"
            value_template: >-
              {% set sr = value_json.data.device | default([], true) %}
              {{ (sr.device_status if sr|length>0 and sr.device_status is defined else 'unavailable') }}
          - name: "Capacity"
            value_template: >-
