              {{ ((sr.capacity|filesizeformat) if sr|length>0 and sr.capacity is defined else 'unavailable') }}
          - name: "Temperature"
            value_template: >-
              {% set sr = value_json.data.smart_results | default([], true) %}
              {{ (sr[0].temp if sr|length>0 and sr[0].temp is defined else 'unavailable') }}
          - name: "Power on Hours"
