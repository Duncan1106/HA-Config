sensor:
  - platform: history_stats
    unique_id: time_in_bed_night
    name: 'Time in Bed last 24h'
    entity_id: binary_sensor.esp32_c3_mini_bett_nachtlicht_master_bed_occupied
    state: "on"
    type: time
    start: "{{ today_at() - timedelta(hours=4) }}"
    end: "{{ now() }}"
    
  - platform: history_stats
    unique_id: time_on_schreibtischstuhl
    name: 'Schreibtischstuhl Besetz Dauer'
    entity_id: binary_sensor.nous_chair_sensor_zigbee_water_leak
    state: "on"
    type: time
    end: "{{ now() }}"
    duration:
      hours: 24

  - platform: rest
    scan_interval: 43200
    name: Tasmota - newest version
    resource: https://api.github.com/repos/arendst/Sonoff-Tasmota/releases/latest
    value_template: "{{ value_json.tag_name | replace('v','' ) }}"
    headers:
      Accept: application/vnd.github.v3+json
      Content-Type: application/json
      User-Agent: Home Assistant REST sensor

  - platform: rest
    scan_interval: 43200
    name: OpenBK7231T App - newest version
    resource: https://api.github.com/repos/openshwprojects/OpenBK7231T_App/releases/latest
    value_template: "{{ value_json.tag_name | replace('v','' ) }}"
    headers:
      Accept: application/vnd.github.v3+json
      Content-Type: application/json
      User-Agent: Home Assistant REST sensor

  - platform: rest
    name: Tibber Pulse Metrics
    unique_id: tibber_pulse_metrics
    resource: !secret tibber_bridge_url
    method: GET
    json_attributes_path: "node_status"
    json_attributes:
      - node_temperature
      - node_avg_rssi
      - node_uptime_ms
    value_template: "{{ value_json.node_status.node_battery_voltage | float(0) }}"
    scan_interval: 300
    state_class: measurement
    device_class: voltage
    headers:
      Content-Type: application/json
      User-Agent: REST
    unit_of_measurement: V

multiscrape:
  - name: LNGInventory
    resource: "https://alsi.gie.eu/api?date=today"
    log_response: false
    button:
      - name: 'Refresh LNG'
        unique_id: refesh_lng_sensors
    scan_interval: 3600
    headers:
      content-type: "application/json"
      x-key: !secret gas_token
    sensor:
      - unique_id: eu_lng_gwh
        name: EU LNG GWh
        value_template: "{{ value_json.data[0].inventory.gwh | float(0) }}"
        unit_of_measurement: GWh
        state_class: total
        device_class: energy
      - unique_id: eu_lng_inventory
        name: EU LNG Inventory
        value_template: "{{ value_json.data[0].inventory.lng | float(0) * 1000 }}"
        unit_of_measurement: m³
        state_class: measurement
        device_class: volume
        attributes:
          - name: name
            value_template: "{{ value_json.data[0].name }}"
          - name: code
            value_template: "{{ value_json.data[0].code }}"
          - name: sendOut
            value_template: "{{ value_json.data[0].sendOut }}"
          - name: dtmi_gwh
            value_template: "{{ value_json.data[0].dtmi.gwh }}"
          - name: dtmi_lng
            value_template: "{{ value_json.data[0].dtmi.lng }}"
          - name: dtrs
            value_template: "{{ value_json.data[0].dtrs }}"
          - name: contractedCapacity
            value_template: "{{ value_json.data[0].contractedCapacity }}"
          - name: availableCapacity
            value_template: "{{ value_json.data[0].availableCapacity }}"
          - name: coveredCapacity
            value_template: "{{ value_json.data[0].coveredCapacity }}"
          - name: status
            value_template: "{{ value_json.data[0].status }}"

      - unique_id: germany_lng_gwh
        name: Germany LNG GWh
        value_template: >
          {% set germany = value_json.data[0].children | selectattr('name', 'equalto', 'Germany') | list | first %}
          {{ germany.inventory.gwh | float(0) }}
        unit_of_measurement: GWh
        state_class: total
        device_class: energy
      - unique_id: germany_lng_inventory
        name: Germany LNG Inventory
        value_template: >
          {% set germany = value_json.data[0].children | selectattr('name', 'equalto', 'Germany') | list | first %}
          {{ germany.inventory.lng | float(0) * 1000 }}
        unit_of_measurement: m³
        state_class: measurement
        attributes:
          - name: name
            value_template: >
              {% set germany = value_json.data[0].children | selectattr('name', 'equalto', 'Germany') | list | first %}
              {{ germany.name }}
          - name: code
            value_template: >
              {% set germany = value_json.data[0].children | selectattr('name', 'equalto', 'Germany') | list | first %}
              {{ germany.code }}
          - name: sendOut
            value_template: >
              {% set germany = value_json.data[0].children | selectattr('name', 'equalto', 'Germany') | list | first %}
              {{ germany.sendOut }}
          - name: dtmi_gwh
            value_template: >
              {% set germany = value_json.data[0].children | selectattr('name', 'equalto', 'Germany') | list | first %}
              {{ germany.dtmi.gwh }}
          - name: dtmi_lng
            value_template: >
              {% set germany = value_json.data[0].children | selectattr('name', 'equalto', 'Germany') | list | first %}
              {{ germany.dtmi.lng }}
          - name: dtrs
            value_template: >
              {% set germany = value_json.data[0].children | selectattr('name', 'equalto', 'Germany') | list | first %}
              {{ germany.dtrs }}
          - name: contractedCapacity
            value_template: >
              {% set germany = value_json.data[0].children | selectattr('name', 'equalto', 'Germany') | list | first %}
              {{ germany.contractedCapacity }}
          - name: availableCapacity
            value_template: >
              {% set germany = value_json.data[0].children | selectattr('name', 'equalto', 'Germany') | list | first %}
              {{ germany.availableCapacity }}
          - name: coveredCapacity
            value_template: >
              {% set germany = value_json.data[0].children | selectattr('name', 'equalto', 'Germany') | list | first %}
