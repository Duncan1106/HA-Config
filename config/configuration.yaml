      value_template: "{{ value_json['deviceName'] }}"

    - name: "Smart Meter MQTT Data"
      state_topic: "smartmeter-em420/"
      value_template: "{{ value_json['smart-meter']['status'] }}"
      unique_id: smart_meter_mqtt_data
      json_attributes_topic: "smartmeter-em420/"
      json_attributes_template: "{{ value_json['smart-meter'] | tojson }}"
      device:
        name: "Smart Meter"
        identifiers: 
         - "em420"
  
    - name: "MQTT_Stats_Messages_Received"
      state_topic: "$SYS/brokers/emqx@homeassistant.local/metrics/messages/received"
      state_class: total
      unit_of_measurement: messages
      unique_id: mqtt_stats_messages_received
    - name: "MQTT_Stats_Messages_Sent"
      state_topic: "$SYS/brokers/emqx@homeassistant.local/metrics/messages/sent"
      state_class: total
      unit_of_measurement: messages
      unique_id: mqtt_stats_messages_sent
    - name: "MQTT_Stats_Bytes_Received"
      state_topic: "$SYS/brokers/emqx@homeassistant.local/metrics/bytes/received"
      device_class: data_size
      state_class: total
      unit_of_measurement: B
      unique_id: mqtt_stats_bytes_received
    - name: "MQTT_Stats_Bytes_Sent"
      state_topic: "$SYS/brokers/emqx@homeassistant.local/metrics/bytes/sent"
      device_class: data_size
      state_class: total
      unit_of_measurement: B
      unique_id: mqtt_stats_bytes_sent
    - name: "MQTT_Stats_Uptime"
      state_topic: "$SYS/brokers/emqx@homeassistant.local/uptime"
      state_class: total
      device_class: duration
      unit_of_measurement: ms
      unique_id: mqtt_stats_uptime
    
    - name: Zigbee2mqtt Networkmap
      # if you change base_topic of Zigbee2mqtt, change state_topic accordingly
      state_topic: zigbee2mqtt/bridge/response/networkmap
      value_template: >-
        {{ now().strftime('%Y-%m-%d %H:%M:%S') }}
      json_attributes_topic: zigbee2mqtt/bridge/response/networkmap
      json_attributes_template: "{{ value_json.data.value | tojson }}"

