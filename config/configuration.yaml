sensor:
  - platform: history_stats
    unique_id: time_in_bed_night
    name: 'Time in Bed last 24h'
    entity_id: binary_sensor.esp32_c3_mini_bett_nachtlicht_master_bed_occupied
    state: "on"
    type: time
    start: "{{ today_at() - timedelta(hours=4) }}"
    end: "{{ now() }}"
    
  - platform: history_stats
    unique_id: time_on_schreibtischstuhl
    name: 'Schreibtischstuhl Besetz Dauer'
    entity_id: binary_sensor.nous_chair_sensor_zigbee_water_leak
    state: "on"
    type: time
    end: "{{ now() }}"
    duration:
      hours: 24

  - platform: rest
    scan_interval: 43200
    name: Tasmota - newest version
    resource: https://api.github.com/repos/arendst/Sonoff-Tasmota/releases/latest
    value_template: "{{ value_json.tag_name | replace('v','' ) }}"
    headers:
      Accept: application/vnd.github.v3+json
      Content-Type: application/json
      User-Agent: Home Assistant REST sensor

  - platform: rest
    scan_interval: 43200
    name: OpenBK7231T App - newest version
    resource: https://api.github.com/repos/openshwprojects/OpenBK7231T_App/releases/latest
    value_template: "{{ value_json.tag_name | replace('v','' ) }}"
    headers:
      Accept: application/vnd.github.v3+json
      Content-Type: application/json
      User-Agent: Home Assistant REST sensor

  - platform: rest
    name: Tibber Pulse Metrics
    unique_id: tibber_pulse_metrics
    resource: !secret tibber_bridge_url
    method: GET
    json_attributes_path: "node_status"
    json_attributes:
      - node_temperature
      - node_avg_rssi
      - node_uptime_ms
    value_template: "{{ value_json.node_status.node_battery_voltage | float(0) }}"
    scan_interval: 300
    state_class: measurement
    device_class: voltage
    headers:
      Content-Type: application/json
      User-Agent: REST
    unit_of_measurement: V

