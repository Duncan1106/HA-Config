template:
  - triggers:
      - platform: time_pattern
        seconds: "/30"
      - platform: state
        entity_id: input_boolean.rollo_summer_override
      - platform: state
        entity_id: sensor.sun_solar_azimuth
      - platform: state
        entity_id: sensor.sun_solar_elevation
    binary_sensor:
      - name: "Rollo Summer Should Close"
        unique_id: rollo_summer_should_close
        state: >
          {% set manual = this.attributes.manual_mode | int(0) %}
          {% set summer = this.attributes.summer | int(0) %}
          {% set within_daylight = this.attributes.within_daylight | int(0) %}
          {% set sun_hits_window = this.attributes.sun_hits_window | int(0) %}
          {% set not_raining = this.attributes.not_raining | int(0) %}
          
          {% if manual > 0 %}
            false
          {% elif ( ( summer + within_daylight + sun_hits_window + not_raining ) < 4 ) %}
            false
          {% else %}
            {% set strong_uv_index = this.attributes.strong_uv_index | int(0) %}
            {% set strong_uv_lux = this.attributes.strong_uv_lux | int(0) %}
            {% set high_temp_diff = this.attributes.high_temp_diff | int(0) %}
            {% set extreme_temp = this.attributes.extreme_temp | int(0) %}
            {% set sum = strong_uv_index + strong_uv_lux + high_temp_diff + extreme_temp %}
            {% if sum > 1 %}
              true
            {% endif %}
          {% endif %}

        attributes:
          manual_mode: "{{ 1 if is_state('input_boolean.rollo_summer_override', 'on') else 0 }}"
          first_blockers: ''
          summer: >
            {% set summer_months = [5,6,7,8] %}
            {% set month = now().month %}
            {{ 1 if (month in summer_months) else 0 }}

          within_daylight: >
            {% set SUNRISE_OPEN_DELAY_MINUTES = 15 %}
            {% set SUNSET_CLOSE_DELAY_MINUTES = 15 %}
            {% set current_time = now() | as_timestamp | timestamp_local | as_datetime %}
            {% set next_rising_raw_dt = states('sensor.sun_next_rising') | as_timestamp | timestamp_local | as_datetime %}
            {% set next_setting_raw_dt = states('sensor.sun_next_setting') | as_timestamp | timestamp_local | as_datetime %}
            {% set relevant_sunrise_dt = next_rising_raw_dt if next_rising_raw_dt.day == current_time.day else (next_rising_raw_dt - timedelta(days=1)) %}
            {% set relevant_sunset_dt = next_setting_raw_dt if next_setting_raw_dt.day == current_time.day else (next_setting_raw_dt - timedelta(days=1)) %}
            {% set open_after = relevant_sunrise_dt + timedelta(minutes=SUNRISE_OPEN_DELAY_MINUTES) %}
            {% set close_before = relevant_sunset_dt - timedelta(minutes=SUNSET_CLOSE_DELAY_MINUTES) %}
            {{ 1 if ((current_time > open_after) and (current_time < close_before)) else 0 }}

          sun_hits_window: >
            {% set SUN_WINDOW_AZIMUTH_THRESHOLD = 150 %}
            {% set SUN_WINDOW_ELEVATION_THRESHOLD = 16 %}
            {% set azimuth = states('sensor.sun_solar_azimuth') | float(0) %}
            {% set elevation = states('sensor.sun_solar_elevation') | float(0) %}
            {{ 1 if ((azimuth > SUN_WINDOW_AZIMUTH_THRESHOLD) and (elevation > SUN_WINDOW_ELEVATION_THRESHOLD)) else 0 }}

          not_raining: >
              {% set RAIN_RATE_THRESHOLD = 0.1 %}
              {% set RAIN_KEYWORDS = ['rain', 'shower'] %}
            
              {% set rain_rate = states('sensor.gw1100a_rain_rate') | float(0) %}
              {% set sunflower_wet = is_state('binary_sensor.rain_sun_flower_rain', 'on') %}
              {% set weather_condition = states('weather.irauen33') | lower | default('') %}
              {% set weather_says_rain = RAIN_KEYWORDS | select('in', weather_condition) | list | count > 0 %}
            
              {% set rain_conditions = [
                rain_rate > RAIN_RATE_THRESHOLD,
                sunflower_wet,
                weather_says_rain
              ] %}
            
              {% set count_true = rain_conditions | select('equalto', true) | list | count %}
            
              {{ 1 if (count_true < 2) else 0 }}
          heat_reasons: ''
          strong_uv_index: >
            {% set UV_INDEX_THRESHOLD_STRONG = 4 %}
            {% set TEMP_OUTSIDE_THRESHOLD = 22 %}
            {% set uv = states('sensor.gw1100a_solar_lux') | float(0) %}
            {% set uv_index = states('sensor.gw1100a_uv_index') | float(0) %}
            {% set temp_outside = states('sensor.gw1100a_outdoor_temperature') | float(0) %}
            {{ 1 if (uv_index > UV_INDEX_THRESHOLD_STRONG and temp_outside > TEMP_OUTSIDE_THRESHOLD) else 0 }}
            
          strong_uv_lux: >
            {% set UV_THRESHOLD_STRONG = 60000 %}
            {% set TEMP_OUTSIDE_THRESHOLD = 22 %}
            {% set uv = states('sensor.gw1100a_solar_lux') | float(0) %}
            {% set uv_index = states('sensor.gw1100a_uv_index') | float(0) %}
            {% set temp_outside = states('sensor.gw1100a_outdoor_temperature') | float(0) %}
            {{ 1 if (uv > UV_THRESHOLD_STRONG and temp_outside > TEMP_OUTSIDE_THRESHOLD) else 0 }}
            
          high_temp_diff: >
            {% set TEMP_DIFF_THRESHOLD = 2.5 %}
            {% set TEMP_OUTSIDE_THRESHOLD_TEMP_DIFF = 22 %}
            {% set UV_THRESHOLD_TEMP_DIFF = 25000 %}
            {% set temp_inside = states('sensor.gw1100a_indoor_temperature') | float(0) %}
            {% set temp_outside = states('sensor.gw1100a_outdoor_temperature') | float(0) %}
            {% set uv = states('sensor.gw1100a_solar_lux') | float(0) %}
            {{ 1 if (((temp_outside - temp_inside) > TEMP_DIFF_THRESHOLD) and
               (temp_outside > TEMP_OUTSIDE_THRESHOLD_TEMP_DIFF) and
               (uv > UV_THRESHOLD_TEMP_DIFF)) else 0 }}

          extreme_temp: >
            {% set EXTREME_TEMP_THRESHOLD = 28 %}
            {% set temp_outside = states('sensor.gw1100a_outdoor_temperature') | float(0) %}
            {{ 1 if temp_outside > EXTREME_TEMP_THRESHOLD else 0}}
          Reason: ''
          reason: >
              {% set ns = namespace(reasons=[]) %}
            
              {# Manual override #}
              {% if is_state('input_boolean.rollo_summer_override', 'on') %}
                {% set ns.reasons = ns.reasons + ['Manual override active, auto close disabled.'] %}
              {% else %}
                {# Summer check #}
                {% set summer_months = [5,6,7,8] %}
                {% set month = now().month %}
                {% if month not in summer_months %}
                  {% set ns.reasons = ns.reasons + ['Not summer month'] %}
                {% endif %}
            
                {# Within daylight #}
                {% set SUNRISE_OPEN_DELAY_MINUTES = 15 %}
                {% set SUNSET_CLOSE_DELAY_MINUTES = 15 %}
                {% set current_time = now() | as_timestamp | timestamp_local | as_datetime %}
                {% set next_rising_raw_dt = states('sensor.sun_next_rising') | as_timestamp | timestamp_local | as_datetime %}
                {% set next_setting_raw_dt = states('sensor.sun_next_setting') | as_timestamp | timestamp_local | as_datetime %}
                {% set relevant_sunrise_dt = next_rising_raw_dt if next_rising_raw_dt.day == current_time.day else (next_rising_raw_dt - timedelta(days=1)) %}
                {% set relevant_sunset_dt = next_setting_raw_dt if next_setting_raw_dt.day == current_time.day else (next_setting_raw_dt - timedelta(days=1)) %}
                {% set open_after = relevant_sunrise_dt + timedelta(minutes=SUNRISE_OPEN_DELAY_MINUTES) %}
                {% set close_before = relevant_sunset_dt - timedelta(minutes=SUNSET_CLOSE_DELAY_MINUTES) %}
                {% if not (current_time > open_after and current_time < close_before) %}
                  {% set ns.reasons = ns.reasons + ['Outside daylight window'] %}
                {% endif %}
            
                {# Sun hits window #}
                {% set SUN_WINDOW_AZIMUTH_THRESHOLD = 150 %}
                {% set SUN_WINDOW_ELEVATION_THRESHOLD = 16 %}
                {% set azimuth = states('sensor.sun_solar_azimuth') | float(0) %}
                {% set elevation = states('sensor.sun_solar_elevation') | float(0) %}
                {% if not ((azimuth > SUN_WINDOW_AZIMUTH_THRESHOLD) and (elevation > SUN_WINDOW_ELEVATION_THRESHOLD)) %}
                  {% set ns.reasons = ns.reasons + ['Sun not hitting window'] %}
                {% endif %}
            
                {# Not raining - new logic with two conditions needed #}
                {% set RAIN_RATE_THRESHOLD = 0.1 %}
                {% set RAIN_KEYWORDS = ['rain', 'shower'] %}
            
                {% set rain_rate = states('sensor.gw1100a_rain_rate') | float(0) %}
                {% set sunflower_wet = is_state('binary_sensor.rain_sun_flower_rain', 'on') %}
                {% set weather_condition = states('weather.irauen33') | lower | default('') %}
                {% set weather_says_rain = RAIN_KEYWORDS | select('in', weather_condition) | list | count > 0 %}
            
                {% set rain_conditions = [
                  rain_rate > RAIN_RATE_THRESHOLD,
                  sunflower_wet,
                  weather_says_rain
                ] %}
            
                {% set count_true = rain_conditions | select('equalto', true) | list | count %}
                {% set rain_risk_count = rain_conditions | list | count %}
                {% set count_true_rain = rain_conditions | select('equalto', true) | list | count %}
                {% if count_true >= 2 %}
                  {% set ns.reasons = ns.reasons + ['Raining detected: ' ~ count_true_rain ~ ' of ' ~ rain_risk_count] %}
                {% endif %}
            
                {# Heat risks #}
                {% set UV_THRESHOLD_STRONG = 60000 %}
                {% set UV_INDEX_THRESHOLD_STRONG = 4 %}
                {% set TEMP_OUTSIDE_THRESHOLD_HIGH_UV = 22 %}
                {% set temp_outside = states('sensor.gw1100a_outdoor_temperature') | float(0) %}
                {% set uv = states('sensor.gw1100a_solar_lux') | float(0) %}
                {% set uv_index = states('sensor.gw1100a_uv_index') | float(0) %}
                {% set strong_uv_index = uv_index > UV_INDEX_THRESHOLD_STRONG and temp_outside > TEMP_OUTSIDE_THRESHOLD_HIGH_UV %}
                {% set strong_uv_lux = uv > UV_THRESHOLD_STRONG and temp_outside > TEMP_OUTSIDE_THRESHOLD_HIGH_UV %}
            
                {% set TEMP_DIFF_THRESHOLD = 2.5 %}
                {% set TEMP_OUTSIDE_THRESHOLD_TEMP_DIFF = 22 %}
                {% set UV_THRESHOLD_TEMP_DIFF = 25000 %}
                {% set temp_inside = states('sensor.gw1100a_indoor_temperature') | float(0) %}
                {% set high_temp_diff = ((temp_outside - temp_inside) > TEMP_DIFF_THRESHOLD) and (temp_outside > TEMP_OUTSIDE_THRESHOLD_TEMP_DIFF) and (uv > UV_THRESHOLD_TEMP_DIFF) %}
            
                {% set EXTREME_TEMP_THRESHOLD = 28 %}
                {% set extreme_temp = temp_outside > EXTREME_TEMP_THRESHOLD %}
            
                {% set heat_risks = [strong_uv_index, strong_uv_lux, high_temp_diff, extreme_temp] %}
                {% set heat_risk_count = heat_risks | list | count %}
                {% set count_true_heat = heat_risks | select('equalto', true) | list | count %}
            
                {% set ns.reasons = ns.reasons + ['Heat risks met: ' ~ count_true_heat ~ ' of ' ~ heat_risk_count] %}
                {% if strong_uv_index or strong_uv_lux or high_temp_diff or extreme_temp %}
                    {% if strong_uv_index %}
                      {% set ns.reasons = ns.reasons + [' - Strong UV condition met'] %}
                    {% else %}
                      {% set ns.reasons = ns.reasons + [' - Strong UV NOT met'] %}
                    {% endif %}
                    {% if strong_uv_lux %}
                      {% set ns.reasons = ns.reasons + [' - Strong Lux condition met'] %}
                    {% else %}
                      {% set ns.reasons = ns.reasons + [' - Strong Lux NOT met'] %}
                    {% endif %}
                    {% if high_temp_diff %}
                      {% set ns.reasons = ns.reasons + [' - High temperature difference met'] %}
                    {% else %}
                      {% set ns.reasons = ns.reasons + [' - High temperature difference NOT met'] %}
                    {% endif %}
                    {% if extreme_temp %}
                      {% set ns.reasons = ns.reasons + [' - Extreme temperature met'] %}
                    {% else %}
                      {% set ns.reasons = ns.reasons + [' - Extreme temperature NOT met'] %}
                    {% endif %}
                {% else %}
                   {% set ns.reasons = ns.reasons + [' - Heat Conditions NOT met'] %}
                {% endif %}
              {% endif %}
              {{ ns.reasons | join(',\n') }}
          Time: ''
          current_time: "{{ now().strftime('%H:%M') }}"
          open_after: >
            {% set SUNRISE_OPEN_DELAY_MINUTES = 15 %}
            {% set current_time = now() | as_timestamp | timestamp_local | as_datetime | default(now(), true) %}
            {% set next_rising_raw_dt = states('sensor.sun_next_rising') | as_timestamp | timestamp_local | as_datetime | default(none, true) %}

            {% set relevant_sunrise_dt = next_rising_raw_dt if next_rising_raw_dt is not none and next_rising_raw_dt.day == current_time.day else (next_rising_raw_dt - timedelta(days=1) if next_rising_raw_dt is not none else none) %}

            {{ (relevant_sunrise_dt + timedelta(minutes=SUNRISE_OPEN_DELAY_MINUTES)).strftime('%H:%M') if relevant_sunrise_dt is not none else 'unavailable' }}
          close_before: >
            {% set SUNSET_CLOSE_DELAY_MINUTES = 15 %}
            {% set current_time = now() | as_timestamp | timestamp_local | as_datetime | default(now(), true) %}
            {% set next_setting_raw_dt = states('sensor.sun_next_setting') | as_timestamp | timestamp_local | as_datetime | default(none, true) %}

            {% set relevant_sunset_dt = next_setting_raw_dt if next_setting_raw_dt is not none and next_setting_raw_dt.day == current_time.day else (next_setting_raw_dt - timedelta(days=1) if next_setting_raw_dt is not none else none) %}

            {{ (relevant_sunset_dt - timedelta(minutes=SUNSET_CLOSE_DELAY_MINUTES)).strftime('%H:%M') if relevant_sunset_dt is not none else 'unavailable' }}
          Sensors: ''
          temp_inside: >
              {% set val = states('sensor.gw1100a_indoor_temperature') | float(0) %}
              {{ val | round(1) }}
          temp_outside: >
              {% set val = states('sensor.gw1100a_outdoor_temperature') | float(0) %}
              {% set threshold = 28 %}
              {{ val | round(1) }} (> {{ threshold }})
          temp_diff: >
              {% set temp_outside = states('sensor.gw1100a_outdoor_temperature') | float(0) %}
              {% set temp_inside = states('sensor.gw1100a_indoor_temperature') | float(0) %}
              {% set diff = temp_outside - temp_inside %}
              {% set threshold = 2.5 %}
              {{ diff| round(1) }} (> {{ threshold }})
          rain_rate: >
              {% set val = states('sensor.gw1100a_rain_rate') | float(0) %}
              {% set threshold = 0.1 %}
              {{ val }} (> {{ threshold }})
          rain_sunflower: >
            {% set wet = is_state('binary_sensor.rain_sun_flower_rain', 'on') %}
            {{ 'Wet' if wet else 'Dry' }} (= Wet)
          weather: >
            {{ states('weather.irauen33') | lower | default('') }} 
          uv_lux: >
            {% set val = states('sensor.gw1100a_solar_lux') | float(0) %}
            {% set threshold = 60000 %}
            {{ val | round(0) }} (> {{ threshold }})
          uv_index: >
            {% set val = states('sensor.gw1100a_uv_index') | float(0) %}
            {% set threshold = 4 %}
            {{ val | round(0) }} (> {{ threshold }})
          elevation: >
            {% set val = states('sensor.sun_solar_elevation') | float(0) %}
            {% set threshold = 16 %}
            {{ val | round(0) }} (> {{ threshold }})
          azimuth: >
            {% set val = states('sensor.sun_solar_azimuth') | float(0) %}
            {% set threshold = 150 %}
            {{ val | round(0) }} (> {{ threshold }})
           

  - trigger:
      - platform: time_pattern
        seconds: "/5"
    sensor:
      - name: "Home Power"
        unique_id: home_power
        unit_of_measurement: "W"
        state_class: measurement
        device_class: power
        state: |
          {% set grid_import = states('sensor.grid_import') | float(0) %}
          {% set grid_export = states('sensor.grid_export') | float(0) %}
          {% set battery_charge = states('sensor.battery_charge') | float(0) %}
          {% set battery_discharge = states('sensor.battery_discharge') | float(0) %}
          {% set losses = states('sensor.inverter_power_losses') | float(0) %}
          {% set deye = states('sensor.inverter_pv_power') | float(0) %}
          {% set kostal = states('sensor.scb_ac_power') | float(0) %}
          {% set solar = (deye + kostal) | round(2) %}
          {% set bkw = states('sensor.bkw_outlet_1_energy_power') | float(0) %}
          {% set known_power = states('sensor.known_power') | float(0) %}
          {% set home = (solar - grid_export + grid_import + bkw - battery_charge + (battery_discharge - losses) ) | round(2) %}
          {{ home if home > known_power else known_power }}
          

cover:
  - platform: template
    covers:
      wintergarten_dachfenster:
        device_class: window
        unique_id: wintergarten_dachfenster
        optimistic: false
        friendly_name: "Wintergarten Dachfenster"
        value_template: "{{ is_state('binary_sensor.dachfenster_wintergarten','on') }}"
        open_cover:
          action: script.wintergarten_dachfenster_open
        close_cover:
          action: script.wintergarten_dachfenster_close
        stop_cover:
          action: script.wintergarten_dachfenster_stop
      
      wintergarten_rolladen_dachfenster:
        device_class: blind
        unique_id: wintergarten_rolladen_dachfenster
        optimistic: true
        friendly_name: "Wintergarten Rolladen Dachfenster"
        open_cover:
          action: script.wintergarten_dachfenster_rolladen_open
        close_cover:
          action: script.wintergarten_dachfenster_rolladen_close
        stop_cover:
          action: script.wintergarten_dachfenster_rolladen_stop

binary_sensor:
  - platform: rest
    verify_ssl: false
    scan_interval: 60
    method: POST
    resource: "http://192.168.2.205:8080/api/device/fxs500pro234920229/details"
    name: "HDD - SMART Status"
    unique_id: hdd_smart_status
