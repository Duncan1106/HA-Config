# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes
  extra_module_url:
    #- /local/card-mod.js
    #- /www/community/lovelace-card-mod/card-mod.js
    - /hacsfiles/lovelace-card-mod/card-mod.js
    - /hacsfiles/custom-sidebar/custom-sidebar-yaml.js

homeassistant:
  media_dirs:
    recordings: "/media/tapo"
    3dprinter: "/media/m5ccam"
    usbdrive: "/media/USBMEDIABACKUP_Media"
  allowlist_external_dirs:
    - "/media/"

readme:

battery_notes:
  show_all_devices: true
  default_battery_low_threshold: 5
  battery_increase_threshold: 75
  round_battery: true

# Text to speech
tts:
  - platform: google_translate

shell_command:
  timelapse_webcam1: "ffmpeg -framerate 8 -pattern_type glob -i '/media/m5ccam/*.jpg' -c:v libx264 -crf 30 -pix_fmt yuv420p -y /media/m5ccam/video_`date +%d_%m_%Y_%X`.mp4 > /dev/null 2>&1 &"
  call_timelapse_script: /config/Ffmpeg_timeplase.sh {{output_filename}}
  delete_files_webcam1: 'rm -f /media/m5ccam/pictures/*.jpg'
  delete_old_backups_disk: "find /share/USBMEDIABACKUP_Share/Backup/ -name 'DailyBackup*' -type f -mtime +14 -delete"
  delete_old_weekly_backups_disk: "find /share/USBMEDIABACKUP_Share/Backup/ -name 'WeeklyBackup*.tar' -type f -mtime +30 -delete"

ingress:
  o2:
    title: O2
    ui_mode: toolbar
    icon: mdi:signal-4g
    url: http://192.168.3.1/
    require_admin: True

  router:
    title: Router
    icon: mdi:router-wireless-settings
    url: http://192.168.2.1/
    require_admin: true
    ui_mode: toolbar
    rewrite:
      # for HTML response
      - mode: body
        match: >-
          /(luci-static|cgi-bin)/
        replace: >-
          $http_x_ingress_path/\1/
      # for JS init code
      - mode: body
        match: >-
          \\/(luci-static|cgi-bin|ubus)\\/
        replace: >-
          $http_x_ingress_path\/\1\/
      # for login response
      - mode: header
        name: "(Location|Set-Cookie)"
        match: /cgi-bin/
        replace: $http_x_ingress_path/cgi-bin/

