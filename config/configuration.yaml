binary_sensor:
  - platform: rest
    verify_ssl: false
    scan_interval: 60
    method: POST
    resource: "http://192.168.2.205:8080/api/device/fxs500pro234920229/details"
    name: "HDD - SMART Status"
    unique_id: hdd_smart_status
    value_template: "{{ bool(value_json['data']['smart_results'][0]['Status']) }}"
    device_class: problem

template:
  - binary_sensor:
      - name: "Rollo Summer Should Close"
        unique_id: rollo_summer_should_close
        state: >
          {% set month = now().month %}
          {% set summer = month in [5,6,7,8] %}

          {% set temp_inside = states('sensor.gw1100a_indoor_temperature') | float(0) %}
          {% set temp_outside = states('sensor.gw1100a_outdoor_temperature') | float(0) %}
          {% set uv = states('sensor.gw1100a_solar_lux') | float(0) %}
          {% set uv_index = states('sensor.gw1100a_uv_index') | float(0) %}
          {% set elevation = states('sensor.sun_solar_elevation') | float(0) %}
          {% set azimuth = states('sensor.sun_solar_azimuth') | float(0) %}

          {% set sun_hits_windows = elevation > 16 and (135 <= azimuth <= 225) %}
          {% set sun_hits_windows = (azimuth > 150) and (elevation > 16) %}
          {% set strong_uv_condition = (uv > 75000 or uv_index >= 5) and temp_outside > 22 %}
          {% set temp_diff_condition = (temp_outside - temp_inside) > 5 and temp_outside > 22 and uv > 25000 %}
          {% set heat_risk = strong_uv_condition or temp_diff_condition %}

          {{ summer and sun_hits_windows and heat_risk }}
        attributes:
          temp_inside: "{{ states('sensor.gw1100a_indoor_temperature') }}"
          temp_outside: "{{ states('sensor.gw1100a_outdoor_temperature') }}"
          lux: "{{ states('sensor.gw1100a_solar_lux') }}"
          uv_index: "{{ states('sensor.gw1100a_uv_index') }}"
          elevation: "{{ states('sensor.sun_solar_elevation') }}"
          azimuth: "{{ states('sensor.sun_solar_azimuth') }}"
          sun_hitting_window: >
            {% set elevation = states('sensor.sun_solar_elevation') | float(0) %}
            {% set azimuth = states('sensor.sun_solar_azimuth') | float(0) %}
            {% set sun_hits_windows = (azimuth > 150) and (elevation > 16) %}
            {{ iif(sun_hits_windows,'Yes','No')}}
          reason: >
            {% set month = now().month %}
            {% set summer = month in [5,6,7,8] %}

            {% set temp_inside = states('sensor.gw1100a_indoor_temperature') | float(0) %}
            {% set temp_outside = states('sensor.gw1100a_outdoor_temperature') | float(0) %}
            {% set uv = states('sensor.gw1100a_solar_lux') | float(0) %}
            {% set uv_index = states('sensor.gw1100a_uv_index') | float(0) %}
            {% set elevation = states('sensor.sun_solar_elevation') | float(0) %}
            {% set azimuth = states('sensor.sun_solar_azimuth') | float(0) %}

            {% set sun_hits_windows = (azimuth > 150) and (elevation > 16) %}
            {% set strong_uv_condition = (uv > 75000 or uv_index >= 5) and temp_outside > 22 %}
            {% set temp_diff_condition = (temp_outside - temp_inside) > 5 and temp_outside > 22 and uv > 25000 %}
            {% set heat_risk = strong_uv_condition or temp_diff_condition %}

            {% if not summer %}
              Not summer months
            {% elif not sun_hits_windows %}
              Sun not hitting windows
            {% elif not heat_risk %}
              No heat/UV risk (Temp out: {{ temp_outside }}, In: {{ temp_inside }}, UV: {{ uv }}, Index: {{ uv_index }})
            {% else %}
              All conditions met
            {% endif %}
          

mqtt:
  switch:
    - name: "Tasmota Rule 1"
      unique_id: tasmota_157F88_rule1_switch
      command_topic: "cmnd/tasmota_157F88/Rule1"
      payload_on: "ON"
      payload_off: "OFF"
      state_topic: "stat/tasmota_157F88/RESULT"
      value_template: >
        {% if value_json.Rule1 is defined and value_json.Rule1.State in ['ON', 'OFF'] %}
          {{ value_json.Rule1.State }}
        {% else %}
          ON
        {% endif %}
      optimistic: false
      icon: mdi:script
      device:
        connections:
          - ["mac", "C8C9A3157F88"]
        identifiers:
          - "C8C9A3157F88"
        manufacturer: "NOUS"
        name: "Kaffeemaschine Solis"
        model: "A1T"

    - name: "Tasmota Rule 2"
      unique_id: tasmota_157F88_rule2_switch
      command_topic: "cmnd/tasmota_157F88/Rule2"
      payload_on: "ON"
      payload_off: "OFF"
      state_topic: "stat/tasmota_157F88/RESULT"
      value_template: >
        {% if value_json.Rule2 is defined and value_json.Rule2.State in ['ON', 'OFF'] %}
          {{ value_json.Rule2.State }}
        {% else %}
          ON
        {% endif %}
      optimistic: false
      icon: mdi:script
      device:
        connections:
          - ["mac", "C8C9A3157F88"]
        identifiers:
          - "C8C9A3157F88"
        manufacturer: "NOUS"
        name: "Kaffeemaschine Solis"
        model: "A1T"

    - name: "Tasmota Rule 3"
      unique_id: tasmota_157F88_rule3_switch
      command_topic: "cmnd/tasmota_157F88/Rule3"
      payload_on: "ON"
      payload_off: "OFF"
      state_topic: "stat/tasmota_157F88/RESULT"
      value_template: >
        {% if value_json.Rule3 is defined and value_json.Rule3.State in ['ON', 'OFF'] %}
          {{ value_json.Rule3.State }}
        {% else %}
          ON
        {% endif %}
      optimistic: false
      icon: mdi:script
      device:
        connections:
          - ["mac", "C8C9A3157F88"]
        identifiers:
          - "C8C9A3157F88"
        manufacturer: "NOUS"
        name: "Kaffeemaschine Solis"
        model: "A1T"

  sensor:
    - state_topic: fully-single-app/deviceInfo/a9641507-a9641507
      name: Fully Kiosk Device Info
      unique_id: fully_kiosk_device_info
      json_attributes_topic: fully-single-app/deviceInfo/a9641507-a9641507
      force_update: true
      value_template: "{{ value_json['deviceName'] }}"

    - name: "Smart Meter MQTT Data"
      state_topic: "smartmeter-em420/"
      value_template: "{{ value_json['smart-meter']['status'] }}"
      unique_id: smart_meter_mqtt_data
      json_attributes_topic: "smartmeter-em420/"
      json_attributes_template: "{{ value_json['smart-meter'] | tojson }}"
      device:
        name: "Smart Meter"
        identifiers: 
         - "em420"
  
    - name: "MQTT_Stats_Messages_Received"
      state_topic: "$SYS/brokers/emqx@homeassistant.local/metrics/messages/received"
      state_class: total
      unit_of_measurement: messages
      unique_id: mqtt_stats_messages_received
    - name: "MQTT_Stats_Messages_Sent"
      state_topic: "$SYS/brokers/emqx@homeassistant.local/metrics/messages/sent"
      state_class: total
      unit_of_measurement: messages
      unique_id: mqtt_stats_messages_sent
    - name: "MQTT_Stats_Bytes_Received"
      state_topic: "$SYS/brokers/emqx@homeassistant.local/metrics/bytes/received"
      device_class: data_size
      state_class: total
      unit_of_measurement: B
      unique_id: mqtt_stats_bytes_received
    - name: "MQTT_Stats_Bytes_Sent"
      state_topic: "$SYS/brokers/emqx@homeassistant.local/metrics/bytes/sent"
      device_class: data_size
      state_class: total
      unit_of_measurement: B
      unique_id: mqtt_stats_bytes_sent
    - name: "MQTT_Stats_Uptime"
      state_topic: "$SYS/brokers/emqx@homeassistant.local/uptime"
      state_class: total
      device_class: duration
      unit_of_measurement: ms
      unique_id: mqtt_stats_uptime
    
    - name: Zigbee2mqtt Networkmap
      # if you change base_topic of Zigbee2mqtt, change state_topic accordingly
      state_topic: zigbee2mqtt/bridge/response/networkmap
      value_template: >-
        {{ now().strftime('%Y-%m-%d %H:%M:%S') }}
      json_attributes_topic: zigbee2mqtt/bridge/response/networkmap
      json_attributes_template: "{{ value_json.data.value | tojson }}"

