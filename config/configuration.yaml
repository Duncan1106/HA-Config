template:
  - binary_sensor:
      - name: "Luftbefeuchter On-Windows"
        unique_id: humidifier_trigger_window
        state: >
          {% set nr = as_datetime(state_attr('sun.sun','next_rising')) | as_local + timedelta(hours=2) %}
          {% set ns = as_datetime(state_attr('sun.sun','next_setting')) | as_local - timedelta(hours=1.25) %}
          {% if nr > ns %}
            {% set nr = nr - timedelta(hours=24) %}
          {% endif %}
          {% set current_time = now() %}
          {% set actual_triggers_today = states('sensor.daily_luftbefeuchter') | int(0) %}
          {% set max_activations_per_day = states('input_number.max_humidifier_activations_per_day') | int(15) %}
          {% set remaining_activations = [0, max_activations_per_day - actual_triggers_today] | max %}
          {% set match_window_seconds = 120 %}
          {% set ns_test_output = namespace(trigger_times = [], current_match = false) %}
    
          {% if actual_triggers_today == 0 %}
            {% set distribution_anchor_time = nr %}
          {% else %}
            {% set last_changed_utility_meter = as_datetime(states.sensor.daily_luftbefeuchter.last_changed) | as_local %}
            {% set distribution_anchor_time = [last_changed_utility_meter, nr] | max %}
          {% endif %}
    
          {% if remaining_activations > 0 and current_time < ns %}
            {% set duration_for_all_remaining_slots = (ns - distribution_anchor_time) %}
            {% if duration_for_all_remaining_slots.total_seconds() > 0 %}
              {% set interval_duration = duration_for_all_remaining_slots / (remaining_activations + 1) %}
              {% for i in range(remaining_activations) %}
                {% set potential_trigger_time = distribution_anchor_time + ((i + 1) * interval_duration) %}
                {% if potential_trigger_time > current_time and potential_trigger_time <= ns %}
                  {% if ((potential_trigger_time - timedelta(seconds=match_window_seconds)) <= current_time)
                     and (current_time <= (potential_trigger_time + timedelta(seconds=match_window_seconds))) %}
                    {% set ns_test_output.current_match = true %}
                  {% endif %}
                {% endif %}
              {% endfor %}
            {% endif %}
          {% endif %}
          {{ ns_test_output.current_match }}
        attributes:
          next_sunrise_offset_start: >
             {% set nr = (as_datetime(state_attr('sun.sun','next_rising')) | as_local + timedelta(hours=2)) %}
             {% set ns = as_datetime(state_attr('sun.sun','next_setting')) | as_local - timedelta(hours=1.25) %}
             {% if nr > ns %}
                {% set nr = nr - timedelta(hours=24) %}
             {% endif %}
             {{ nr.strftime('%Y-%m-%d %H:%M:%S') }}
          next_sunset_offset_end: "{{ (as_datetime(state_attr('sun.sun','next_setting')) | as_local - timedelta(hours=1.25)).strftime('%Y-%m-%d %H:%M:%S') }}"
          current_time: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          actual_triggers_today: "{{ states('sensor.daily_luftbefeuchter') | int(0) }}"
          max_activations_per_day: "{{ states('input_number.max_humidifier_activations_per_day') | int(15) }}"
          remaining_activations: >
            {% set max = states('input_number.max_humidifier_activations_per_day') | int(15) %}
            {% set current = states('sensor.daily_luftbefeuchter') | int(0) %}
            {{ [0, max - current] | max }}
          distribution_anchor_time: >
            {% set nr = as_datetime(state_attr('sun.sun','next_rising')) | as_local + timedelta(hours=2) %}
            {% set ns = as_datetime(state_attr('sun.sun','next_setting')) | as_local - timedelta(hours=1.25) %}
            {% if nr > ns %}{% set nr = nr - timedelta(hours=24) %}{% endif %}
            {% set actual = states('sensor.daily_luftbefeuchter') | int(0) %}
            {% if actual == 0 %}
              {{ nr.strftime('%Y-%m-%d %H:%M:%S') }}
            {% else %}
              {% set last_changed = as_datetime(states.sensor.daily_luftbefeuchter.last_changed) | as_local %}
              {{ ([last_changed, nr] | max).strftime('%Y-%m-%d %H:%M:%S') }}
            {% endif %}
          window_duration: >
              {% set nr = as_datetime(state_attr('sun.sun','next_rising')) | as_local + timedelta(hours=2) %}
              {% set ns = as_datetime(state_attr('sun.sun','next_setting')) | as_local - timedelta(hours=1.25) %}
              {% if nr > ns %}
                {% set nr = nr - timedelta(hours=24) %}
              {% endif %}
              {% set diff = ns - nr %}
              {% set hours = (diff.total_seconds() // 3600) | int %}
              {% set minutes = ((diff.total_seconds() % 3600) // 60) | int %}
              {{ '{}h {}m'.format(hours, minutes) }}
          trigger_interval: >
              {% set nr = as_datetime(state_attr('sun.sun','next_rising')) | as_local + timedelta(hours=2) %}
              {% set ns = as_datetime(state_attr('sun.sun','next_setting')) | as_local - timedelta(hours=1.25) %}
              {% if nr > ns %}
                {% set nr = nr - timedelta(hours=24) %}
              {% endif %}
              {% set actual = states('sensor.daily_luftbefeuchter') | int(0) %}
              {% set max = states('input_number.max_humidifier_activations_per_day') | int(15) %}
              {% set remaining = [0, max - actual] | max %}
              {% set anchor = nr if actual == 0 else [as_datetime(states.sensor.daily_luftbefeuchter.last_changed) | as_local, nr] | max %}
              {% set span = ns - anchor %}
              {% if remaining > 0 and span.total_seconds() > 0 %}
                {% set interval = span.total_seconds() / (remaining + 1) %}
                {% set hours = (interval // 3600) | int %}
                {% set minutes = ((interval % 3600) // 60) | int %}
                {% set seconds = (interval % 60) | round(0) | int %}
                {{ '{}h {}m {}s'.format(hours, minutes, seconds) }}
              {% else %}
                'N/A'
              {% endif %}
          trigger_times: >
            {% set nr = as_datetime(state_attr('sun.sun','next_rising')) | as_local + timedelta(hours=2) %}
            {% set ns = as_datetime(state_attr('sun.sun','next_setting')) | as_local - timedelta(hours=1.25) %}
            {% if nr > ns %}{% set nr = nr - timedelta(hours=24) %}{% endif %}
            {% set current_time = now() %}
            {% set actual = states('sensor.daily_luftbefeuchter') | int(0) %}
            {% set max = 15 %}
            {% set remaining = [0, max - actual] | max %}
            {% set out = namespace(times=[]) %}
            {% if actual == 0 %}
              {% set anchor = nr %}
            {% else %}
              {% set changed = as_datetime(states.sensor.daily_luftbefeuchter.last_changed) | as_local %}
              {% set anchor = [changed, nr] | max %}
            {% endif %}
            {% if remaining > 0 and current_time < ns %}
              {% set span = ns - anchor %}
              {% if span.total_seconds() > 0 %}
                {% set interval = span / (remaining + 1) %}
                {% for i in range(remaining) %}
                  {% set t = anchor + ((i + 1) * interval) %}
                  {% if t > current_time and t <= ns %}
                    {% set out.times = out.times + [t.strftime('%H:%M:%S')] %}
                  {% endif %}
                {% endfor %}
              {% endif %}
            {% else %}
              {% set out.times = ["No valid trigger times"] %}
            {% endif %}
            {{ out.times }}

  - trigger:
      - platform: state
        entity_id: input_text.search_todo_list
      - platform: time_pattern
        seconds: "/1"
      - platform: state
        entity_id:
          - todo.kellervorrate
          - todo.kellervorrate_katzenfutter
          - todo.kellervorrate_safe
          - todo.kellervorrate_marmelade_selbstgemachtes
    action:
      - action: todo.get_items
        data:
          status: needs_action
        target:
          entity_id:
            - todo.kellervorrate
            - todo.kellervorrate_safe
            - todo.kellervorrate_katzenfutter
            - todo.kellervorrate_marmelade_selbstgemachtes
        response_variable: all_todo_items
    sensor:
      - name: "Kellervorrate Combined Filtered Items"
        unique_id: kellervorrate_combined_filtered_items
        state: >
            {% set input = states('input_text.search_todo_list') | default('') | lower %}
            {% set has_filter = 'todo:' in input %}
            {% set filter_key = (input.split('todo:')[1].split(' ')[0]) if has_filter else '' %}
            {% set search_term = input.split('todo:' ~ filter_key)[1] | trim if has_filter else input %}
            
            {% set lists = [
              'todo.kellervorrate',
              'todo.kellervorrate_safe',
              'todo.kellervorrate_katzenfutter',
              'todo.kellervorrate_marmelade_selbstgemachtes'
            ] %}
            
            {% set filtered_lists = lists
              | select('search', filter_key)
              | list if filter_key else lists %}
            
            {% if filtered_lists | length == 0 %}
              {% set filtered_lists = lists %}
            {% endif %}
            
            {% set count = namespace(total=0) %}
            {% for list_id in filtered_lists %}
              {% set items = all_todo_items[list_id]['items'] | default([]) %}
              {% for item in items %}
                {% if item.summary is defined and (search_term in item.summary | lower) %}
                  {% set count.total = count.total + 1 %}
                {% endif %}
              {% endfor %}
            {% endfor %}
            
            {{ count.total }}
        attributes:
          source_map: >
            {
              "1": "todo.kellervorrate",
              "2": "todo.kellervorrate_safe",
              "3": "todo.kellervorrate_katzenfutter",
              "4": "todo.kellervorrate_marmelade_selbstgemachtes"
            }
          filtered_items: >
            {% set input = states('input_text.search_todo_list') | default('') | lower %}
            {% set has_filter = 'todo:' in input %}
            {% set filter_key = (input.split('todo:')[1].split(' ')[0]) if has_filter else '' %}
            {% set search_term = input.split('todo:' ~ filter_key)[1] | trim if has_filter else input %}
            
            {% set lists = [
              'todo.kellervorrate',
              'todo.kellervorrate_safe',
              'todo.kellervorrate_katzenfutter',
              'todo.kellervorrate_marmelade_selbstgemachtes'
            ] %}
            
            {% set source_map = {
              'todo.kellervorrate': 1,
              'todo.kellervorrate_safe': 2,
              'todo.kellervorrate_katzenfutter': 3,
              'todo.kellervorrate_marmelade_selbstgemachtes': 4
            } %}
            
            {% set filtered_lists = lists
              | select('search', filter_key)
              | list if filter_key else lists %}
            
            {% if filtered_lists | length == 0 %}
              {% set filtered_lists = lists %}
            {% endif %}
            
            {% set combined = namespace(items=[]) %}
            
            {% for list_id in filtered_lists %}
              {% set items = all_todo_items[list_id]['items'] | default([]) %}
              {% for item in items %}
                {% if item.summary is defined and item.summary is string %}
                  {% if search_term == '' or (search_term in (item.summary | lower)) %}
                    {% set minimal_item = {
                      'u': item.uid,
                      's': item.summary,
                      'd': item.description,
                      'c': source_map[list_id]
                    } %}
                    {% set combined.items = combined.items + [minimal_item] %}
                  {% endif %}
                {% endif %}
              {% endfor %}
            {% endfor %}
            
            {{ combined.items }}


  - triggers:
      - platform: time_pattern
        seconds: "/15"
      - platform: state
        entity_id: input_boolean.rollo_summer_override
      - platform: state
        entity_id: sensor.sun_solar_azimuth
      - platform: state
        entity_id: sensor.sun_solar_elevation
    binary_sensor:
      - name: "Rollo Summer Should Close"
        unique_id: rollo_summer_should_close
        state: >
          {% set manual = this.attributes.manual_mode | int(0) %}
          {% set summer = this.attributes.summer | int(0) %}
          {% set within_daylight = this.attributes.within_daylight | int(0) %}
          {% set sun_hits_window = this.attributes.sun_hits_window | int(0) %}
          {% set not_raining = this.attributes.not_raining | int(0) %}
          
          {% if manual > 0 %}
            false
          {% elif ( ( summer + within_daylight + sun_hits_window + not_raining ) < 4 ) %}
            false
          {% else %}
            {% set strong_uv_index = this.attributes.strong_uv_index | int(0) %}
            {% set strong_uv_lux = this.attributes.strong_uv_lux | int(0) %}
            {% set high_temp_diff = this.attributes.high_temp_diff | int(0) %}
            {% set extreme_temp = this.attributes.extreme_temp | int(0) %}
            {% set sum = strong_uv_index + strong_uv_lux + high_temp_diff + extreme_temp %}
            {% if sum > 1 %}
              true
            {% endif %}
          {% endif %}

        attributes:
          manual_mode: "{{ 1 if is_state('input_boolean.rollo_summer_override', 'on') else 0 }}"
          first_blockers: ''
          summer: >
            {% set summer_months = [5,6,7,8] %}
            {% set month = now().month %}
            {{ 1 if (month in summer_months) else 0 }}

          within_daylight: >
            {% set SUNRISE_OPEN_DELAY_MINUTES = 15 %}
            {% set SUNSET_CLOSE_DELAY_MINUTES = 15 %}
            {% set current_time = now() | as_timestamp | timestamp_local | as_datetime %}
            {% set next_rising_raw_dt = states('sensor.sun_next_rising') | as_timestamp | timestamp_local | as_datetime %}
            {% set next_setting_raw_dt = states('sensor.sun_next_setting') | as_timestamp | timestamp_local | as_datetime %}
            {% set relevant_sunrise_dt = next_rising_raw_dt if next_rising_raw_dt.day == current_time.day else (next_rising_raw_dt - timedelta(days=1)) %}
            {% set relevant_sunset_dt = next_setting_raw_dt if next_setting_raw_dt.day == current_time.day else (next_setting_raw_dt - timedelta(days=1)) %}
            {% set open_after = relevant_sunrise_dt + timedelta(minutes=SUNRISE_OPEN_DELAY_MINUTES) %}
            {% set close_before = relevant_sunset_dt - timedelta(minutes=SUNSET_CLOSE_DELAY_MINUTES) %}
            {{ 1 if ((current_time > open_after) and (current_time < close_before)) else 0 }}

          sun_hits_window: >
            {% set SUN_WINDOW_AZIMUTH_THRESHOLD = 150 %}
            {% set SUN_WINDOW_ELEVATION_THRESHOLD = 16 %}
            {% set azimuth = states('sensor.sun_solar_azimuth') | float(0) %}
            {% set elevation = states('sensor.sun_solar_elevation') | float(0) %}
            {{ 1 if ((azimuth > SUN_WINDOW_AZIMUTH_THRESHOLD) and (elevation > SUN_WINDOW_ELEVATION_THRESHOLD)) else 0 }}

          not_raining: >
              {% set RAIN_RATE_THRESHOLD = 0.1 %}
              {% set RAIN_KEYWORDS = ['rain', 'shower'] %}
            
              {% set rain_rate = states('sensor.gw1100a_rain_rate') | float(0) %}
              {% set sunflower_wet = is_state('binary_sensor.rain_sun_flower_rain', 'on') %}
              {% set weather_condition = states('weather.irauen33') | lower | default('') %}
              {% set weather_says_rain = RAIN_KEYWORDS | select('in', weather_condition) | list | count > 0 %}
            
              {% set rain_conditions = [
                rain_rate > RAIN_RATE_THRESHOLD,
                sunflower_wet,
                weather_says_rain
              ] %}
            
              {% set count_true = rain_conditions | select('equalto', true) | list | count %}
            
              {{ 1 if (count_true < 2) else 0 }}
          heat_reasons: ''
          strong_uv_index: >
            {% set UV_INDEX_THRESHOLD_STRONG = 4 %}
            {% set TEMP_OUTSIDE_THRESHOLD = 22 %}
            {% set uv = states('sensor.gw1100a_solar_lux') | float(0) %}
            {% set uv_index = states('sensor.gw1100a_uv_index') | float(0) %}
            {% set temp_outside = states('sensor.gw1100a_outdoor_temperature') | float(0) %}
            {{ 1 if (uv_index > UV_INDEX_THRESHOLD_STRONG and temp_outside > TEMP_OUTSIDE_THRESHOLD) else 0 }}
            
          strong_uv_lux: >
            {% set UV_THRESHOLD_STRONG = 60000 %}
            {% set TEMP_OUTSIDE_THRESHOLD = 22 %}
            {% set uv = states('sensor.gw1100a_solar_lux') | float(0) %}
            {% set uv_index = states('sensor.gw1100a_uv_index') | float(0) %}
            {% set temp_outside = states('sensor.gw1100a_outdoor_temperature') | float(0) %}
            {{ 1 if (uv > UV_THRESHOLD_STRONG and temp_outside > TEMP_OUTSIDE_THRESHOLD) else 0 }}
            
          high_temp_diff: >
            {% set TEMP_DIFF_THRESHOLD = 2.5 %}
            {% set TEMP_OUTSIDE_THRESHOLD_TEMP_DIFF = 22 %}
            {% set UV_THRESHOLD_TEMP_DIFF = 25000 %}
            {% set temp_inside = states('sensor.gw1100a_indoor_temperature') | float(0) %}
            {% set temp_outside = states('sensor.gw1100a_outdoor_temperature') | float(0) %}
            {% set uv = states('sensor.gw1100a_solar_lux') | float(0) %}
            {{ 1 if (((temp_outside - temp_inside) > TEMP_DIFF_THRESHOLD) and
               (temp_outside > TEMP_OUTSIDE_THRESHOLD_TEMP_DIFF) and
               (uv > UV_THRESHOLD_TEMP_DIFF)) else 0 }}

          extreme_temp: >
            {% set EXTREME_TEMP_THRESHOLD = 28 %}
            {% set temp_outside = states('sensor.gw1100a_outdoor_temperature') | float(0) %}
            {{ 1 if temp_outside > EXTREME_TEMP_THRESHOLD else 0}}
          Reason: ''
          reason: >
              {% set ns = namespace(reasons=[]) %}
            
              {# Manual override #}
              {% if is_state('input_boolean.rollo_summer_override', 'on') %}
                {% set ns.reasons = ns.reasons + ['Manual override active, auto close disabled.'] %}
              {% else %}
                {# Summer check #}
                {% set summer_months = [5,6,7,8] %}
                {% set month = now().month %}
                {% if month not in summer_months %}
                  {% set ns.reasons = ns.reasons + ['Not summer month'] %}
                {% endif %}
            
                {# Within daylight #}
                {% set SUNRISE_OPEN_DELAY_MINUTES = 15 %}
                {% set SUNSET_CLOSE_DELAY_MINUTES = 15 %}
                {% set current_time = now() | as_timestamp | timestamp_local | as_datetime %}
                {% set next_rising_raw_dt = states('sensor.sun_next_rising') | as_timestamp | timestamp_local | as_datetime %}
                {% set next_setting_raw_dt = states('sensor.sun_next_setting') | as_timestamp | timestamp_local | as_datetime %}
                {% set relevant_sunrise_dt = next_rising_raw_dt if next_rising_raw_dt.day == current_time.day else (next_rising_raw_dt - timedelta(days=1)) %}
                {% set relevant_sunset_dt = next_setting_raw_dt if next_setting_raw_dt.day == current_time.day else (next_setting_raw_dt - timedelta(days=1)) %}
                {% set open_after = relevant_sunrise_dt + timedelta(minutes=SUNRISE_OPEN_DELAY_MINUTES) %}
                {% set close_before = relevant_sunset_dt - timedelta(minutes=SUNSET_CLOSE_DELAY_MINUTES) %}
                {% if not (current_time > open_after and current_time < close_before) %}
                  {% set ns.reasons = ns.reasons + ['Outside daylight window'] %}
                {% endif %}
            
                {# Sun hits window #}
                {% set SUN_WINDOW_AZIMUTH_THRESHOLD = 150 %}
                {% set SUN_WINDOW_ELEVATION_THRESHOLD = 16 %}
                {% set azimuth = states('sensor.sun_solar_azimuth') | float(0) %}
                {% set elevation = states('sensor.sun_solar_elevation') | float(0) %}
                {% if not ((azimuth > SUN_WINDOW_AZIMUTH_THRESHOLD) and (elevation > SUN_WINDOW_ELEVATION_THRESHOLD)) %}
                  {% set ns.reasons = ns.reasons + ['Sun not hitting window'] %}
                {% endif %}
            
                {# Not raining - new logic with two conditions needed #}
                {% set RAIN_RATE_THRESHOLD = 0.1 %}
                {% set RAIN_KEYWORDS = ['rain', 'shower'] %}
            
                {% set rain_rate = states('sensor.gw1100a_rain_rate') | float(0) %}
                {% set sunflower_wet = is_state('binary_sensor.rain_sun_flower_rain', 'on') %}
                {% set weather_condition = states('weather.irauen33') | lower | default('') %}
                {% set weather_says_rain = RAIN_KEYWORDS | select('in', weather_condition) | list | count > 0 %}
            
                {% set rain_conditions = [
                  rain_rate > RAIN_RATE_THRESHOLD,
                  sunflower_wet,
                  weather_says_rain
                ] %}
            
                {% set count_true = rain_conditions | select('equalto', true) | list | count %}
                {% set rain_risk_count = rain_conditions | list | count %}
                {% set count_true_rain = rain_conditions | select('equalto', true) | list | count %}
                {% if count_true >= 2 %}
                  {% set ns.reasons = ns.reasons + ['Raining detected: ' ~ count_true_rain ~ ' of ' ~ rain_risk_count] %}
                {% endif %}
            
                {# Heat risks #}
                {% set UV_THRESHOLD_STRONG = 60000 %}
                {% set UV_INDEX_THRESHOLD_STRONG = 4 %}
                {% set TEMP_OUTSIDE_THRESHOLD_HIGH_UV = 22 %}
                {% set temp_outside = states('sensor.gw1100a_outdoor_temperature') | float(0) %}
                {% set uv = states('sensor.gw1100a_solar_lux') | float(0) %}
                {% set uv_index = states('sensor.gw1100a_uv_index') | float(0) %}
                {% set strong_uv_index = uv_index > UV_INDEX_THRESHOLD_STRONG and temp_outside > TEMP_OUTSIDE_THRESHOLD_HIGH_UV %}
                {% set strong_uv_lux = uv > UV_THRESHOLD_STRONG and temp_outside > TEMP_OUTSIDE_THRESHOLD_HIGH_UV %}
            
                {% set TEMP_DIFF_THRESHOLD = 2.5 %}
                {% set TEMP_OUTSIDE_THRESHOLD_TEMP_DIFF = 22 %}
                {% set UV_THRESHOLD_TEMP_DIFF = 25000 %}
                {% set temp_inside = states('sensor.gw1100a_indoor_temperature') | float(0) %}
                {% set high_temp_diff = ((temp_outside - temp_inside) > TEMP_DIFF_THRESHOLD) and (temp_outside > TEMP_OUTSIDE_THRESHOLD_TEMP_DIFF) and (uv > UV_THRESHOLD_TEMP_DIFF) %}
            
                {% set EXTREME_TEMP_THRESHOLD = 28 %}
                {% set extreme_temp = temp_outside > EXTREME_TEMP_THRESHOLD %}
            
                {% set heat_risks = [strong_uv_index, strong_uv_lux, high_temp_diff, extreme_temp] %}
                {% set heat_risk_count = heat_risks | list | count %}
                {% set count_true_heat = heat_risks | select('equalto', true) | list | count %}
            
                {% set ns.reasons = ns.reasons + ['Heat risks met: ' ~ count_true_heat ~ ' of ' ~ heat_risk_count] %}
                {% if strong_uv_index or strong_uv_lux or high_temp_diff or extreme_temp %}
                    {% if strong_uv_index %}
                      {% set ns.reasons = ns.reasons + [' - Strong UV condition met'] %}
                    {% else %}
                      {% set ns.reasons = ns.reasons + [' - Strong UV NOT met'] %}
                    {% endif %}
                    {% if strong_uv_lux %}
                      {% set ns.reasons = ns.reasons + [' - Strong Lux condition met'] %}
                    {% else %}
                      {% set ns.reasons = ns.reasons + [' - Strong Lux NOT met'] %}
                    {% endif %}
                    {% if high_temp_diff %}
                      {% set ns.reasons = ns.reasons + [' - High temperature difference met'] %}
                    {% else %}
                      {% set ns.reasons = ns.reasons + [' - High temperature difference NOT met'] %}
                    {% endif %}
                    {% if extreme_temp %}
                      {% set ns.reasons = ns.reasons + [' - Extreme temperature met'] %}
                    {% else %}
                      {% set ns.reasons = ns.reasons + [' - Extreme temperature NOT met'] %}
                    {% endif %}
                {% else %}
                   {% set ns.reasons = ns.reasons + [' - Heat Conditions NOT met'] %}
                {% endif %}
              {% endif %}
              {{ ns.reasons | join(',\n') }}
          Time: ''
          current_time: "{{ now().strftime('%H:%M') }}"
          open_after: >
            {% set SUNRISE_OPEN_DELAY_MINUTES = 15 %}
            {% set current_time = now() | as_timestamp | timestamp_local | as_datetime | default(now(), true) %}
            {% set next_rising_raw_dt = states('sensor.sun_next_rising') | as_timestamp | timestamp_local | as_datetime | default(none, true) %}

            {% set relevant_sunrise_dt = next_rising_raw_dt if next_rising_raw_dt is not none and next_rising_raw_dt.day == current_time.day else (next_rising_raw_dt - timedelta(days=1) if next_rising_raw_dt is not none else none) %}

            {{ (relevant_sunrise_dt + timedelta(minutes=SUNRISE_OPEN_DELAY_MINUTES)).strftime('%H:%M') if relevant_sunrise_dt is not none else 'unavailable' }}
          close_before: >
            {% set SUNSET_CLOSE_DELAY_MINUTES = 15 %}
            {% set current_time = now() | as_timestamp | timestamp_local | as_datetime | default(now(), true) %}
            {% set next_setting_raw_dt = states('sensor.sun_next_setting') | as_timestamp | timestamp_local | as_datetime | default(none, true) %}

            {% set relevant_sunset_dt = next_setting_raw_dt if next_setting_raw_dt is not none and next_setting_raw_dt.day == current_time.day else (next_setting_raw_dt - timedelta(days=1) if next_setting_raw_dt is not none else none) %}

            {{ (relevant_sunset_dt - timedelta(minutes=SUNSET_CLOSE_DELAY_MINUTES)).strftime('%H:%M') if relevant_sunset_dt is not none else 'unavailable' }}
          Sensors: ''
          temp_inside: >
              {% set val = states('sensor.gw1100a_indoor_temperature') | float(0) %}
              {{ val | round(1) }}
          temp_outside: >
              {% set val = states('sensor.gw1100a_outdoor_temperature') | float(0) %}
              {% set threshold = 28 %}
              {{ val | round(1) }} (> {{ threshold }})
          temp_diff: >
              {% set temp_outside = states('sensor.gw1100a_outdoor_temperature') | float(0) %}
              {% set temp_inside = states('sensor.gw1100a_indoor_temperature') | float(0) %}
              {% set diff = temp_outside - temp_inside %}
              {% set threshold = 2.5 %}
              {{ diff| round(1) }} (> {{ threshold }})
          rain_rate: >
              {% set val = states('sensor.gw1100a_rain_rate') | float(0) %}
              {% set threshold = 0.1 %}
              {{ val }} (> {{ threshold }})
          rain_sunflower: >
            {% set wet = is_state('binary_sensor.rain_sun_flower_rain', 'on') %}
            {{ 'Wet' if wet else 'Dry' }} (== Wet)
          weather: >
            {{ states('weather.irauen33') | lower | default('') }} 
          uv_lux: >
            {% set val = states('sensor.gw1100a_solar_lux') | float(0) %}
            {% set threshold = 60000 %}
            {{ val | round(0) }} (> {{ threshold }})
          uv_index: >
            {% set val = states('sensor.gw1100a_uv_index') | float(0) %}
            {% set threshold = 4 %}
            {{ val | round(0) }} (> {{ threshold }})
          elevation: >
            {% set val = states('sensor.sun_solar_elevation') | float(0) %}
            {% set threshold = 16 %}
            {{ val | round(0) }} (> {{ threshold }})
          azimuth: >
            {% set val = states('sensor.sun_solar_azimuth') | float(0) %}
            {% set threshold = 150 %}
            {{ val | round(0) }} (> {{ threshold }})

  - trigger:
      - platform: time_pattern
        minutes: "/1"
    sensor:
      - name: "Gesamt Kosten Pv Active Moving"
        unique_id: gesamtkosten_pv
        unit_of_measurement: "€"
        state_class: total
        state: |
          {% set solar_home = states('sensor.solar_to_home_daily_energy_cost') | float(0) %}
          {% set solar_bat = states('sensor.battery_charge_from_solar_daily_energy_cost') | float(0) %}
          {% set bat_home = states('sensor.inverter_total_battery_discharge_daily_energy_cost') | float(0) %}
          {% set solar_grid = states('sensor.daily_money_generated_solar') | float(0) %}
          {% set bkw = states('sensor.bkw_outlet_1_total_daily_energy_cost') | float(0) %}
          {% set gesamt = states('input_number.gesamte_pv_kosten') | float(0) %}
          {{ (gesamt - solar_home - solar_bat - bat_home - solar_grid - bkw) | round(2) }}

  - trigger:
      - platform: time_pattern
        seconds: "/5"
    sensor:
      - name: "Home Power"
        unique_id: home_power
        unit_of_measurement: "W"
        state_class: measurement
        device_class: power
        state: |
          {% set grid_import = states('sensor.grid_import') | float(0) %}
          {% set grid_export = states('sensor.grid_export') | float(0) %}
          {% set battery_charge = states('sensor.battery_charge') | float(0) %}
          {% set battery_discharge = states('sensor.battery_discharge') | float(0) %}
          {% set losses = states('sensor.inverter_power_losses') | float(0) %}
          {% set deye = states('sensor.inverter_pv_power') | float(0) %}
          {% set kostal = states('sensor.scb_ac_power') | float(0) %}
          {% set solar = (deye + kostal) | round(2) %}
          {% set bkw = states('sensor.bkw_outlet_1_energy_power') | float(0) %}
          {% set known_power = states('sensor.known_power') | float(0) %}
          {% set home = (solar - grid_export + grid_import + bkw - battery_charge + (battery_discharge - losses) ) | round(2) %}
          {{ home if home > known_power else known_power }}

      - name: "Home Consumption Total Day"
        unique_id: home_consumption_total_day
        unit_of_measurement: "kWh"
        state_class: total
        device_class: energy
        state: |
            {% set pv = states('sensor.daily_solar_production') | float(0) %}
            {% set bkw = states('sensor.bkw_outlet_1_energy_today') | float(0) %}
            {% set bat_charge = states('sensor.inverter_today_battery_charge') | float(0) %}
            {% set bat_discharge = states('sensor.daily_battery_discharged_energy') | float(0) %}
            {% set grid_import = states('sensor.daily_netzbezug') | float(0) %}
            {% set grid_export = states('sensor.daily_netzeinspeisung') | float(0) %}
            {% set loss_deye= states('sensor.inverter_today_energy_losses') | float(0) %}
            {% set losses = loss_deye %} 
            {{ ((pv + bkw + grid_import + bat_discharge) - (grid_export + bat_charge + losses )) | round(3) }}


