      - sensor.*linkquality
      - sensor.everything_presence_lite_f1c0d0_*
      
# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes
  extra_module_url:
    - /hacsfiles/lovelace-card-mod/card-mod.js
    - /hacsfiles/custom-sidebar/custom-sidebar-yaml.js

homeassistant:
  packages: !include_dir_named packages
  media_dirs:
    recordings: "/media/frigate"
    3dprinter: "/media/m5ccam"
    usbdrive: "/media/USBMEDIABACKUP_Media"
    chime: "/media/sounds"
    timemachine: "/media/timemachine"
  allowlist_external_dirs:
    - "/media/"

go2rtc:
  url: http://192.168.2.205:1984

readme:

# Text to speech
tts:
  - platform: google_translate

notify:
  - platform: group
    name: "Duncan"
    services:
      - action: mobile_app_poco_f7
      - action: mobile_app_mi_9t

  - platform: group
    name: "Admin"
    services:
      - action: mobile_app_poco_f7
      - action: mobile_app_stephan_iphone

  - platform: group
    name: "Familie"
    services:
      - action: mobile_app_poco_f7
      - action: mobile_app_fp4
      - action: mobile_app_iphone_von_enya
      - action: mobile_app_stephan_iphone

command_line:
  - sensor:
      name: Jellyfin Media Size
      unit_of_measurement: GB
      unique_id: jellyfin_media_size
      scan_interval: 300
      device_class: data_size
      command: 'du -sm /media/USBMEDIABACKUP_Media/Movies/ | awk ''{print $1}'''
      value_template: "{{ (value|int(0) / 1024) | round(3) }}"

  - sensor:
      name: Frigate Folder Size
      unit_of_measurement: GB
      unique_id: frigate_folder_size
      scan_interval: 300
      device_class: data_size
      command: 'du -sm /media/frigate | awk ''{print $1}'''
      value_template: "{{ (value|int(0) / 1024) | round(3) }}"

  - sensor:
      name: M5C Cam Folder Size
      unit_of_measurement: GB
      unique_id: m5ccam_folder_size
      scan_interval: 300
      device_class: data_size
      command: 'du -sm /media/m5ccam/ | awk ''{print $1}'''
      value_template: "{{ (value|int(0) / 1024) | round(3) }}"

  - sensor:
      name: Time-Maschine Folder Size
      unit_of_measurement: GB
      unique_id: time_maschine_folder_size
      scan_interval: 300
      device_class: data_size
      command: 'du -sm /media/timemachine/ | awk ''{print $1}'''
      value_template: "{{ (value|int(0) / 1024) | round(3) }}"
      
sensor:
  # Tasmota newest Version
  - platform: rest
    scan_interval: 43200
    name: Tasmota - newest version
    resource: https://api.github.com/repos/arendst/Sonoff-Tasmota/releases/latest
    value_template: "{{ value_json.tag_name | replace('v','' ) }}"
    headers:
      Accept: application/vnd.github.v3+json
      Content-Type: application/json
      User-Agent: Home Assistant REST sensor
    json_attributes:
      - body
      
  # OpenBeken newest Version
  - platform: rest
    scan_interval: 43200
    name: OpenBK7231T App - newest version
    resource: https://api.github.com/repos/openshwprojects/OpenBK7231T_App/releases/latest
    value_template: "{{ value_json.tag_name | replace('v','' ) }}"
    headers:
      Accept: application/vnd.github.v3+json
      Content-Type: application/json
      User-Agent: Home Assistant REST sensor
    json_attributes:
      - body

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
