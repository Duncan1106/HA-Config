  max: 10
boiler_save_energy_script:
  alias: Boiler Save Energy Script
  description: Locks in timings at start based on temperature and status
  fields: {}
  variables:
    on_seconds: "{% set temp = states('sensor.boiler_temperature') | float(0) %} {%
      if temp >= 60 and now().isoweekday() == 5 %}\n  {{ 5 * 60 }}\n{% elif is_state('input_select.smart_home_status',
      'Vacation') %}\n  {{ 1.5 * 60 }}\n{% else %}\n  {{ 3 * 60 }}\n{% endif %}\n"
    off_seconds: "{% set temp = states('sensor.boiler_temperature') | float(0) %}
      {% if temp >= 60 and now().isoweekday() == 5 %}\n  {{ 5 * 60 }}\n{% elif is_state('input_select.smart_home_status',
      'Vacation') %}\n  {{ 8.5 * 60 }}\n{% else %}\n  {{ 7 * 60 }}\n{% endif %}\n"
  sequence:
  - action: script.retry_action_with_backoff
    data:
      action_domain: switch
      action_type: turn_on
      max_retries: 10
      base_delay: 5
      max_delay: 60
      backoff_type: simple
      notify_on_failure: true
      notify_service: notify.duncan
      entity_id: switch.zirkulationspumpe_zigbee
      target_state: 'on'
  - delay:
      seconds: '{{ on_seconds }}'
  - action: script.retry_action_with_backoff
    data:
      action_domain: switch
      action_type: turn_off
      max_retries: 10
      base_delay: 5
      max_delay: 60
      backoff_type: simple
      notify_on_failure: true
      notify_service: notify.duncan
      entity_id: switch.zirkulationspumpe_zigbee
      target_state: 'off'
  - delay:
      seconds: '{{ off_seconds }}'
5_min_turn_off_ganglicht:
  sequence:
  - sequence:
    - wait_for_trigger:
      - trigger: state
        entity_id:
        - light.ganglicht_zigbee_led
        to:
        - 'on'
      timeout:
        hours: 0
        minutes: 0
        seconds: 10
        milliseconds: 0
      continue_on_timeout: true
    - alias: Wait 5min if light is on and turn off
      if:
      - condition: state
        entity_id: light.ganglicht_zigbee_led
        state:
        - 'on'
      then:
      - delay:
          hours: 0
          minutes: 4
          seconds: 50
          milliseconds: 0
      - if:
        - condition: not
          conditions:
          - condition: or
            conditions:
            - condition: state
              entity_id: binary_sensor.gang_bewegung_presence
              state: 'on'
            - condition: state
              entity_id: binary_sensor.gang_bewegung_keller_tur_occupancy
              state: 'on'
            - condition: state
              entity_id: binary_sensor.treppenhaus_presence
              state: 'on'
          alias: No Motion
        - condition: numeric_state
          entity_id: sensor.light_brighness
          below: 0.1
          alias: Not in Time Based Mode
        then:
        - action: script.retry_action_with_backoff
          metadata: {}
          data:
            action_domain: light
            action_type: turn_off
            max_retries: 10
            base_delay: 5
            max_delay: 60
            backoff_type: simple
            notify_on_failure: true
            notify_service: notify.duncan
            target_state: 'off'
            entity_id: light.esp32_c3_mini_treppenhaus_licht
  alias: 5 Min Turn Off Ganglicht
  description: ''
  mode: restart
  max_exceeded: silent
test_duncan_notify_response_echo:
  alias: Notify Duncan about Trockner Confirm & Deny with Clear Notification
  mode: restart
  sequence:
  - alias: Send confirmable notification via notify.duncan
    data:
      title: Trockner fertig
      message: Bitte ausräumen
      data:
        tag: confirmable_notify_trockner
        actions:
        - action: CONFIRM
          title: Erledigt
        - action: DENY
          title: Muss man noch machen
    action: notify.duncan
  - alias: Wait for button click
    wait_for_trigger:
    - event_type: mobile_app_notification_action
      event_data:
        action: CONFIRM
      trigger: event
    - event_type: mobile_app_notification_action
      event_data:
        action: DENY
      trigger: event
  - alias: Custom action based on button
    choose:
    - conditions:
      - condition: template
        value_template: '{{ wait.trigger.event.data.action == ''CONFIRM'' }}'
      sequence:
      - action: input_boolean.turn_off
        metadata: {}
        data: {}
        target:
          entity_id: input_boolean.trockner_fertig
      - data:
          title: Trockner ausgeräumt
          message: Danke {{ states.person|selectattr('attributes.user_id', '==',wait.trigger.event.context.user_id)|map(attribute='attributes.friendly_name')|first|
            default('dir', true) }}
          data:
            tag: confirmable_notify_trockner
        action: notify.duncan
      - delay: 00:00:15
      - data:
          message: clear_notification
          data:
            tag: confirmable_notify_trockner
        action: notify.duncan
      alias: Trockner ausgeräumt
run_fan_for_duration:
  alias: Run Fan For Duration
  mode: parallel
  max: 50
  fields:
    fan_entity:
      description: The switch entity of the fan to run (e.g., switch.right_fan)
      example: switch.left_fan
      required: true
      selector:
        entity:
          domain: switch
      name: Fan Entity
    duration:
      selector:
        duration: {}
      default:
        hours: 0
        minutes: 2
        seconds: 30
      name: Duration
  sequence:
  - repeat:
      until:
      - condition: template
        value_template: '{{ is_state(fan_entity, "on")}}'
      sequence:
      - target:
          entity_id: '{{ fan_entity }}'
        action: switch.turn_on
        data: {}
      - delay:
          hours: 0
          minutes: 0
          seconds: 1
          milliseconds: 0
  - delay: '{{ duration | default(''00:02:30'', true) }}'
  - repeat:
      until:
      - condition: template
        value_template: '{{ is_state(fan_entity, "off")}}'
      sequence:
      - target:
          entity_id: '{{ fan_entity }}'
        action: switch.turn_off
        data: {}
      - delay:
          hours: 0
          minutes: 0
          seconds: 1
          milliseconds: 0
  description: ''
