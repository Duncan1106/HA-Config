terra_sunrise:
  alias: Terra sunrise
  sequence:
  - target:
      entity_id: input_boolean.terrarium_on
    data: {}
    action: input_boolean.turn_on
    continue_on_error: true
  - action: script.retry_action_with_backoff
    metadata: {}
    data:
      action_domain: switch
      action_type: turn_on
      base_delay: 5
      max_delay: 60
      backoff_type: simple
      notify_on_failure: true
      notify_service: notify.duncan
      entity_id: switch.terrarium_zigbee_strip_l2
      target_state: 'on'
      max_retries: 5
    continue_on_error: true
  - data: {}
    action: script.luftbefeuchter
    continue_on_error: true
  - action: script.retry_action_with_backoff
    metadata: {}
    data:
      action_domain: switch
      action_type: turn_on
      max_retries: 5
      base_delay: 5
      max_delay: 60
      backoff_type: simple
      notify_on_failure: true
      notify_service: notify.duncan
      entity_id: switch.terrarium_zigbee_strip_l3
      target_state: 'on'
    continue_on_error: true
  mode: single
luftbefeuchter:
  alias: Luftbefeuchter
  sequence:
  - alias: If air moist -> humidifier off
    if:
    - condition: template
      value_template: '{% set hum1 = states(''sensor.esp32_c3_mini_terra_terrarium_humidity_average'')
        | float(0) %}

        {% set hum2 = states(''sensor.t_h_terrarium_humidity'') | float(0) %}

        {% set offset = states(''input_number.terrarium_humidity_control_threshold_offset'')
        | float(0) %}

        {% set threshold = (states(''input_number.terrarium_humidity_control_threshold'')
        | float(0) ) %}

        {% set compare = threshold + offset %}

        {{ hum1 >= compare or hum2 >= compare }}'
    then:
    - action: script.retry_action_with_backoff
      metadata: {}
      data:
        action_domain: switch
        action_type: turn_off
        max_retries: 10
        base_delay: 5
        max_delay: 60
        backoff_type: simple
        notify_on_failure: true
        notify_service: notify.duncan
        entity_id: switch.terrarium_zigbee_strip_l1
        target_state: 'off'
  - alias: If air dry -> humidifier on
    if:
    - condition: and
      conditions:
      - condition: sun
        after: sunrise
        before: sunset
        before_offset: -01:00:00
        after_offset: +01:00:00
      - condition: state
        entity_id: input_boolean.terrarium_on
        state: 'on'
      - condition: state
        entity_id: switch.terrarium_zigbee_strip_l1
        state:
        - 'off'
      - condition: template
        value_template: "  {% set threshold = states('input_number.terrarium_humidity_control_threshold')
          | float(0) %}\n  {% set hum1 = states('sensor.esp32_c3_mini_terra_terrarium_humidity_average')
          | float(0) %}\n  {% set hum2 = states('sensor.t_h_terrarium_humidity') |
          float(0) %}\n  {{ (hum1 <= threshold) or (hum2 <= threshold) }}"
    then:
    - action: input_boolean.turn_on
      metadata: {}
      data: {}
      target:
        entity_id: input_boolean.luftbefeuchter_aktiv
    - delay:
        hours: 0
        minutes: 1
        seconds: 0
        milliseconds: 0
    - action: script.retry_action_with_backoff
      metadata: {}
      data:
        action_domain: switch
        action_type: turn_on
        max_retries: 10
        base_delay: 5
        max_delay: 60
        backoff_type: simple
        notify_on_failure: true
        notify_service: notify.duncan
        entity_id: switch.terrarium_zigbee_strip_l1
        target_state: 'on'
    - action: number.set_value
      metadata: {}
      target:
        entity_id: number.terrarium_zigbee_strip_countdown_l1
      data:
        value: '600'
    - wait_for_trigger:
      - trigger: state
        entity_id:
        - input_boolean.luftbefeuchter_aktiv
        from: 'on'
        to: 'off'
      timeout:
        hours: 0
        minutes: 5
        seconds: 0
        milliseconds: 0
      continue_on_timeout: false
    - metadata: {}
      data: {}
      target:
        entity_id: counter.luftbefeuchter
      action: counter.increment
    - action: input_boolean.turn_off
      metadata: {}
      data: {}
      target:
        entity_id: input_boolean.luftbefeuchter_aktiv
  mode: single
terra_sunset:
  alias: Terra sunset
  sequence:
  - target:
      entity_id: input_boolean.terrarium_on
    data: {}
    action: input_boolean.turn_off
    continue_on_error: true
  - action: script.retry_action_with_backoff
    metadata: {}
    data:
      action_domain: switch
      action_type: turn_off
      max_retries: 10
      base_delay: 5
      max_delay: 60
      backoff_type: simple
      notify_on_failure: true
      notify_service: notify.duncan
      entity_id: switch.terrarium_zigbee_strip_l3
      target_state: 'off'
    continue_on_error: true
  - data: {}
    action: script.luftbefeuchter
    continue_on_error: true
  - action: script.retry_action_with_backoff
    metadata: {}
    data:
      action_domain: switch
      action_type: turn_off
      max_retries: 10
      base_delay: 5
      max_delay: 60
      backoff_type: simple
      notify_on_failure: true
      notify_service: notify.duncan
      entity_id: switch.terrarium_zigbee_strip_l2
      target_state: 'off'
    continue_on_error: true
  mode: single
warmelampe:
  alias: Wärmelampe
  sequence:
  - alias: If Temp < 24 -> heat on
    if:
    - condition: numeric_state
      entity_id: sensor.esp32_c3_mini_terra_terrarium_temperature_average
      below: 25
    then:
    - action: script.retry_action_with_backoff
      metadata: {}
      data:
        action_domain: switch
        action_type: turn_on
        max_retries: 10
        base_delay: 5
        max_delay: 60
        backoff_type: simple
        notify_on_failure: true
        notify_service: notify.duncan
        entity_id: switch.terrarium_zigbee_strip_l3
        target_state: 'on'
      continue_on_error: true
  - alias: If Temp > 32 -> heat off
    if:
    - condition: or
      conditions:
      - condition: numeric_state
        entity_id: sensor.esp32_c3_mini_terra_terrarium_temperature_average
        above: 33
      - condition: numeric_state
        entity_id: sensor.t_h_terrarium_temperature
        above: 27
    then:
    - action: script.retry_action_with_backoff
      metadata: {}
      data:
        action_domain: switch
        action_type: turn_off
        max_retries: 10
        base_delay: 5
        max_delay: 60
        backoff_type: simple
        notify_on_failure: true
        notify_service: notify.duncan
        entity_id: switch.terrarium_zigbee_strip_l3
        target_state: 'off'
      continue_on_error: true
    else: []
  mode: queued
