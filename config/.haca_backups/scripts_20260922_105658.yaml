        - trigger: state
          entity_id:
          - lawn_mower.shawn
          to:
          - mowing_border
        timeout:
          hours: 0
          minutes: 15
          seconds: 0
          milliseconds: 0
      - alias: Wait for returning or working -> border is finished
        wait_for_trigger:
        - trigger: state
          entity_id:
          - lawn_mower.shawn
          to:
          - returning
          - working
          - return
          - mowing
        timeout:
          hours: 0
          minutes: 15
          seconds: 0
          milliseconds: 0
      - action: button.press
        target:
          entity_id: button.shawn_zum_dock_fahren
        data: {}
      - alias: Wait for Charging
        wait_for_trigger:
        - trigger: state
          entity_id:
          - lawn_mower.shawn
          to:
          - charging
        timeout:
          hours: 0
          minutes: 15
          seconds: 0
          milliseconds: 0
      - variables:
          battery_docked: '{{ states("sensor.shawn_batterie") | int(0) }}'
          mow_duration: '{{ (now() - as_datetime(round_start_time)).total_seconds()
            | int }}'
          battery_used: '{{ battery_start - battery_docked }}'
          recharge_start_time: '{{ now() }}'
      - alias: Wait for battery to recharge used capacity
        wait_template: '{{ repeat.last or (states("sensor.shawn_batterie") | int(0)
          >= ((battery_start + 1)| clamp(0,100))) }}'
        timeout:
          hours: 0
          minutes: 30
          seconds: 0
          milliseconds: 0
      - variables:
          battery_recharged: '{{ (states("sensor.shawn_batterie") | int(0)) - battery_docked
            }}'
          recharge_duration: '{{ (now() - as_datetime(recharge_start_time)).total_seconds()
            | int }}'
      - action: notify.duncan
        data:
          title: "{% if repeat.last %}\n  ✅ Shawn: Task Complete\n{% else %}\n  ⏱️
            Shawn: Runde {{ repeat.index }} abgeschlossen\n{% endif %}"
          message: "{% set m_min = mow_duration // 60 %} {% set m_sec = mow_duration
            % 60 %} Runde {{ repeat.index }} von {{ total_rounds }} beendet. \nMähdauer:
            {{ m_min }} Min. {{ m_sec }} Sek. \nVerbrauch: {{ battery_used }}% {%
            if not repeat.last %} {% set r_min = recharge_duration // 60 %} {% set
            r_sec = recharge_duration % 60 %} \nWieder aufgeladen: +{{ battery_recharged
            }}% in {{ r_min }} Min. {{ r_sec }} Sek. (bereit für Runde {{ repeat.index
            + 1 }}) {% else %}\n\U0001F389 Edge-Cut-Routine erfolgreich nach {{ total_rounds
            }} Runden beendet. {% endif %}"
          data:
            tag: shawn_edge_cut
  description: "\U0001F4CB Intelligent Robotic Mower Edge Control\n\n- **High-level
    intent**: Automates a high-precision, triple-pass lawn border trimming routine
    to ensure consistent and thorough edge maintenance.\n- **Operational strategy**:
    Executes a 3-iteration repeat loop that triggers edge cutting, monitors state
    transitions, returns the mower to dock, and enforces intermediate recharge holds
    before starting subsequent passes.\n- **Reliability mechanisms**: Incorporates
    explicit state-transition timeouts across all operational stages and dynamically
    tracks battery baselines to guarantee adequate energy capacity prior to each run.\n\n---\n\n####
    Edge Cutting Phase\n\n- **Purpose**: Initiates border mowing and monitors execution
    until the edge trimming pass completes.\n- **Logic Overview**: Presses **button.shawn_kanten_mahen**
    and waits for **lawn_mower.shawn** to transition to state **mowing_border** (timeout:
    **15 minutes**). Subsequently monitors for transition to **returning**, **working**,
    **return**, or **mowing** (timeout: **15 minutes**).\n- **Effect**: Triggers **button.shawn_kanten_mahen**;
    logs **round_start_time** and records baseline capacity in **battery_start**.\n\n####
    Docking & Recovery Phase\n\n- **Purpose**: Commands mower to dock and halts loop
    execution until power consumed during the pass is restored.\n- **Logic Overview**:
    Presses **button.shawn_zum_dock_fahren** and waits for **lawn_mower.shawn** to
    reach state **charging** (timeout: **15 minutes**). Evaluates **sensor.shawn_batterie**
    via template wait until capacity equals/exceeds **battery_start** or **repeat.last**
    evaluates to **true** (timeout: **30 minutes**).\n- **Effect**: Activates **button.shawn_zum_dock_fahren**;
    calculates **battery_docked**, **mow_duration**, **battery_used**, **battery_recharged**,
    and **recharge_duration**.\n\n#### Progress & Telemetry Phase\n\n- **Purpose**:
    Dispatches real-time operational statistics and completion alerts to the notification
    system.\n- **Logic Overview**: Evaluates iteration state (**repeat.index** and
    **repeat.last**) to format and publish pass telemetry or final routine completion
    summaries.\n- **Effect**: Calls **notify.duncan** with calculated runtime (minutes
    and seconds), battery percentage consumed, and recharge durations.\n\n---\n\n###
    Technical Overview\n\n- **Script Mode**: **single**\n- **Execution Method**: Repeat
    loop with inline variable calculations, state-trigger wait conditions, and template
    wait evaluations.\n- **Key Inputs**: **sensor.shawn_batterie**, **lawn_mower.shawn**\n-
    **Controlled Entities**: **button.shawn_kanten_mahen**, **button.shawn_zum_dock_fahren**,
    **notify.duncan**\n- **Safety Mechanisms**: **15-minute** timeouts on mower state
    transitions (**mowing_border**, active completion, **charging**) and a **30-minute**
    timeout on battery recovery holds.\n\n---\n\n### \U0001F4A1 Notes\n\n- **Dynamic
    Baseline Recharging**: Records **battery_start** capacity prior to each pass and
    holds execution until **sensor.shawn_batterie** recovers to that exact level,
    preventing battery exhaustion across repeated passes.\n- **Final Iteration Bypass**:
    Evaluates `repeat.last` within the recharge wait template to bypass unnecessary
    recharge delays after the 3rd pass, concluding the script immediately upon docking.\n-
    **State-Driven Synchronization**: Relies on explicit state machine triggers rather
    than hardcoded sleep delays, making execution responsive to actual mowing speeds
    while guarding against deadlocks via strict timeout limits.\n"
pool_secure_pulsetime_update:
  alias: Pool - Secure PulseTime Update
  description: Disables auto-adjust, updates Tasmota, and holds the automation lock
    safely in a background thread.
  fields:
    payload:
      description: The Tasmota PulseTime payload string or template calculation
      example: '28895'
      required: true
    lock_duration:
      description: How long to keep the auto-adjust automation disabled (HH:MM:SS)
      example: 00:05:00
      required: true
  sequence:
  - action: automation.turn_off
    data:
      stop_actions: true
    target:
      entity_id: automation.pool_pulsetime_auto_adjust
  - action: mqtt.publish
    data:
      topic: cmnd/tasmota_837238/pulsetime1
      payload: '{{ payload }}'
    continue_on_error: true
  - delay: '{{ lock_duration }}'
    continue_on_error: true
  - action: automation.turn_on
    target:
      entity_id: automation.pool_pulsetime_auto_adjust
toggle_goe11_key:
  alias: Toggle GoE11 Key
  fields:
    key_name:
      name: Key Name
      description: The JSON key to toggle (e.g. pv_active)
      selector:
        text:
      required: true
  sequence:
  - action: input_text.set_value
    target:
      entity_id: input_text.goe11_cache
    data:
      value: '{% set c = states(''input_text.goe11_cache'') | from_json(default={})
        %} {% set c = c if c is mapping else {} %} {% set new_val = not c.get(key_name,
        false) %} {{ c | combine({key_name: new_val}) | to_json }}

        '
retry_action_with_backoff_power_monitoring:
  alias: Retry Action with Backoff Power Monitoring
  description: 'Retries a service call until the entity reaches the desired state
    or max retries are reached, using simple, linear, or exponential backoff. Supports
    custom action domain and custom action type.

    '
  mode: parallel
  fields:
    entity_id:
      name: Entity
      description: The entity to monitor and act on.
      required: true
      selector:
        entity: {}
    target_state:
      name: Target State
      description: The desired state for the entity (e.g., on, off, open, closed,
        or custom).
      required: true
      selector:
        select:
          options:
          - label: 'On'
            value: 'on'
          - label: 'Off'
            value: 'off'
          - label: Open
            value: open
          - label: Closed
            value: closed
          - label: Custom
            value: custom
    custom_target_state:
      name: Custom Target State
      description: Specify a custom state if Target State is 'Custom'.
      required: false
      selector:
        text: {}
    action_domain:
      name: Action Domain
      description: Domain for the service call (e.g., light, switch). Defaults to
        'homeassistant'.
      required: false
      default: homeassistant
      selector:
        select:
          options:
          - label: Home Assistant (default)
            value: homeassistant
          - label: Switch
            value: switch
          - label: Light
            value: light
          - label: Custom
            value: custom
    custom_action_domain:
      name: Custom Action Domain
      description: Specify a custom domain if 'Custom' is selected above (e.g., cover,
        climate)
      required: false
      selector:
        text: {}
    action_type:
      name: Action Type
      description: Action to perform (e.g., turn_on, turn_off, toggle, open, close,
        or custom)
      default: turn_on
      selector:
        select:
          options:
          - label: Turn On
            value: turn_on
          - label: Turn Off
            value: turn_off
          - label: Toggle
            value: toggle
          - label: Custom
            value: custom
    custom_action_type:
      name: Custom Action Type
      description: Specify a custom action type if 'Custom' is selected above (e.g.,
        lock, set_temperature)
      required: false
      selector:
        text: {}
    service_data:
      name: Service Data
      description: 'Optional additional data for the service call (e.g., {"option":
        "Charge"} for select.select_option). Must be valid YAML/dict format.'
      required: false
      selector:
        text: {}
    custom_action:
      name: Custom Action
      description: Optional override default action with a custom one.
      required: false
      selector:
        action: {}
    max_retries:
      name: Max Retries
      description: Maximum number of attempts.
      default: 10
      selector:
        number:
          min: 1
          max: 20
          mode: box
          step: 1
    base_delay:
      name: Base Delay
      description: Base delay in seconds for backoff calculation.
      default: 5
      selector:
        number:
          min: 1
          max: 60
          mode: box
          step: 1
          unit_of_measurement: seconds
    max_delay:
      name: Max Delay
      description: Maximum delay in seconds for any backoff type.
      default: 60
      selector:
        number:
          min: 1
          max: 600
          mode: box
          step: 1
          unit_of_measurement: seconds
    backoff_type:
      name: Backoff Type
      description: Strategy for retry delays (simple, linear, exponential).
      default: simple
      selector:
        select:
          options:
          - label: Simple
            value: simple
          - label: Linear
            value: linear
          - label: Exponential
            value: exponential
    notify_on_failure:
      name: Notify on Failure
      description: Send a notification if the target state was not reached after max_retries.
      required: false
      default: true
      selector:
        boolean: {}
    notify_service:
      name: Notify Service
      description: Service to use for failure notifications (e.g., notify.duncan).
      required: false
      default: notify.duncan
      selector:
        text: {}
    enable_power_controller:
      name: Enable Power Controller
      description: Monitor power consumption to confirm the device actually turned
        on or off.
      default: false
      selector:
        boolean: {}
    power_sensor:
      name: Power Sensor (Optional)
      description: Explicit power sensor entity. If left blank, it will attempt auto-detection.
      required: false
      selector:
        entity:
          domain: sensor
          device_class: power
    power_threshold_off:
      name: Power Threshold (Off Validation)
      description: Power level (Watts) below which the device is considered fully
        off.
      default: 2
      selector:
        number:
          min: 0.1
          max: 100
          step: 0.1
          mode: box
          unit_of_measurement: W
    power_threshold_on:
      name: Power Threshold (On Validation)
      description: Minimum power level (Watts) expected when the device is turned
        on.
      default: 5
      selector:
        number:
          min: 0.1
          max: 5000
          step: 0.1
          mode: box
          unit_of_measurement: W
    power_report_delay:
      name: Power Report Delay
      description: Time to wait (seconds) for the sensor to update its reading after
        a state change.
      default: 0
      selector:
        number:
          min: 0
          max: 300
          step: 1
          mode: box
          unit_of_measurement: seconds
    power_wait_timeout:
      name: Power Wait Timeout
      description: Additional time to wait (seconds) for power to clear the threshold
        after the report delay.
      default: 10
      selector:
        number:
          min: 1
          max: 60
          step: 1
          mode: box
          unit_of_measurement: seconds
  sequence:
  - alias: Define Base Variables
    variables:
      effective_target_state: "{% if target_state == \"custom\" %}\n  {{ custom_target_state
        | default('') }}\n{% else %}\n  {{ target_state }}\n{% endif %}"
      effective_action_domain: "{% set d = action_domain | default('homeassistant')
        %} {% if d == 'custom' %}\n  {{ custom_action_domain | default('') }}\n{%
        else %}\n  {{ d }}\n{% endif %}"
      effective_action_type: "{% set t = action_type | default('turn_on') %} {% if
        t == 'custom' %}\n  {{ custom_action_type | default('') }}\n{% else %}\n  {{
        t }}\n{% endif %}"
      effective_service_data: "{% set data_str = service_data | default('') | string
        %} {% if data_str and data_str != 'None' and data_str.strip() %}\n  {% if
        data_str.startswith('{') and data_str.endswith('}') %}\n    {{ data_str }}\n
        \ {% else %}\n    {{ {} }}\n  {% endif %}\n{% else %}\n  {{ {} }}\n{% endif
        %}"
      power_threshold_off_val: '{{ power_threshold_off | default(2.0) | float }}'
      power_threshold_on_val: '{{ power_threshold_on | default(5.0) | float }}'
      power_timeout_val: '{{ power_wait_timeout | default(10) | int }}'
      power_report_delay_val: '{{ power_report_delay | default(0) | int }}'
      effective_power_sensor: "{% if enable_power_controller | default(false) %}\n
        \ {% if power_sensor is defined and power_sensor != none and power_sensor
        | string | trim != '' %}\n    {{ power_sensor }}\n  {% else %}\n    {% set
        dev_id = device_id(entity_id) %}\n    {% if dev_id %}\n      {% set entities
        = device_entities(dev_id) %}\n      {% set ns = namespace(sensors=[]) %}\n
        \     {% for e in entities %}\n        {% if e.startswith('sensor.') and state_attr(e,
        'device_class') == 'power' %}\n          {% set ns.sensors = ns.sensors +
        [e] %}\n        {% endif %}\n      {% endfor %}\n      {{ ns.sensors[0] if
        ns.sensors | length == 1 else 'none' }}\n    {% else %}\n      none\n    {%
        endif %}\n  {% endif %}\n{% else %}\n  none\n{% endif %}"
      power_enabled: '{{ enable_power_controller | default(false) and effective_power_sensor
        != ''none'' and effective_target_state in [''on'', ''off''] }}'
      has_service_data: '{{ service_data is defined and service_data not in [none,
        '''', {}] }}'
  - alias: Validate entity exists
    condition: template
    value_template: '{{ entity_id is defined and states(entity_id) is not none }}'
  - alias: Calculate Initial Step Variables
    variables:
      target_match: '{{ is_state(entity_id, effective_target_state) }}'
      current_power: '{{ states(effective_power_sensor) | float(0) if power_enabled
        else 0 }}'
      power_invalid: "{{ power_enabled and target_match and (\n  (effective_target_state
        == 'off' and current_power >= power_threshold_off_val) or\n  (effective_target_state
        == 'on' and current_power < power_threshold_on_val)\n) }}"
      power_ok: '{{ not power_enabled or not target_match or not power_invalid }}'
  - alias: Skip if already in target state (power monitoring disabled)
    condition: template
    value_template: '{{ not target_match or power_enabled or has_service_data }}'
  - alias: Skip if power signature is already valid
    condition: template
    value_template: '{{ not target_match or power_invalid or has_service_data }}'
  - alias: Skip if already in target state
    condition: template
    value_template: '{{ not target_match or not power_ok or has_service_data }}'
  - repeat:
      until:
      - condition: template
        value_template: "{% set p_ok = true %} {% if power_enabled and is_state(entity_id,
          effective_target_state) %}\n  {% set cur = states(effective_power_sensor)
          | float(0) %}\n  {% set p_ok = (effective_target_state == 'off' and cur
          < power_threshold_off_val) or\n                (effective_target_state ==
          'on' and cur >= power_threshold_on_val) %}\n{% endif %}  {{ (is_state(entity_id,
          effective_target_state) and p_ok) or\n   has_service_data or \n   repeat.index
          >= (max_retries | int(10)) or \n   states(entity_id) in ['unavailable','unknown']
          }}"
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ custom_action is defined and custom_action != none
              }}'
          sequence:
          - repeat:
              for_each: '{{ custom_action }}'
              sequence:
              - choose:
                - conditions:
                  - condition: template
                    value_template: '{{ repeat.item.target is defined and repeat.item.data
                      is defined }}'
                  sequence:
                  - target: '{{ repeat.item.target }}'
                    data: '{{ repeat.item.data }}'
                    action: '{{ repeat.item.action }}'
                - conditions:
                  - condition: template
                    value_template: '{{ repeat.item.target is defined }}'
                  sequence:
                  - target: '{{ repeat.item.target }}'
                    action: '{{ repeat.item.action }}'
                - conditions:
                  - condition: template
                    value_template: '{{ repeat.item.data is defined }}'
                  sequence:
                  - data: '{{ repeat.item.data }}'
                    action: '{{ repeat.item.action }}'
                default:
                - action: '{{ repeat.item.action }}'
        default:
        - action: '{{ effective_action_domain }}.{{ effective_action_type }}'
          target:
            entity_id: '{{ entity_id }}'
          data: '{{ effective_service_data }}'
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ not is_state(entity_id, effective_target_state) }}'
          sequence:
          - wait_template: '{{ is_state(entity_id, effective_target_state) }}'
            timeout: "{% set bd = base_delay | default(5, true) | float %}  {% set
              md = max_delay | default(60, true) | float %} {% set idx = repeat.index
              %} {% if backoff_type == 'linear' %}\n  {{ [idx * bd, md] | min }}\n{%
              elif backoff_type == 'exponential' %}\n  {{ [2**(idx-1) * bd, md] |
              min }}\n{% else %}\n  {{ [bd, md] | min }}\n{% endif %}"
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ power_enabled and is_state(entity_id, effective_target_state)
              }}'
          sequence:
          - alias: Wait for power to hit the target threshold direction
            wait_template: "{% set cur = states(effective_power_sensor) | float(0)
              %} {{ (effective_target_state == 'off' and cur < power_threshold_off_val)
              or\n   (effective_target_state == 'on' and cur >= power_threshold_on_val)
              }}"
            timeout: '{{ power_report_delay_val + power_timeout_val }}'
            continue_on_timeout: true
          - choose:
            - conditions:
              - condition: template
                value_template: "{% set cur = states(effective_power_sensor) | float(0)
                  %} {{ (effective_target_state == 'off' and cur >= power_threshold_off_val)
                  or\n   (effective_target_state == 'on' and cur < power_threshold_on_val)
                  }}"
              sequence:
              - alias: Power signature invalid - Run inverted cycle step to force
                  retry
                action: '{{ ''homeassistant.turn_on'' if effective_target_state ==
                  ''off'' else ''homeassistant.turn_off'' }}'
                target:
                  entity_id: '{{ entity_id }}'
              - alias: Short delay before next loop iteration
                delay: 2
  - alias: Calculate Notification Variables
    variables:
      final_state: '{{ states(entity_id) }}'
      power_failed: "{% set cur = states(effective_power_sensor) | float(0) %} {{
        power_enabled and final_state == effective_target_state and (\n     (effective_target_state
        == 'off' and cur >= power_threshold_off_val) or\n     (effective_target_state
        == 'on' and cur < power_threshold_on_val)\n   ) }}"
      now_str: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
      friendly: '{{ state_attr(entity_id, ''friendly_name'') or entity_id | replace(''.'',
        '' '') | replace(''_'', '' '') }}'
      params_line: action={{ effective_action_domain }}.{{ effective_action_type }},
        target={{ effective_target_state }}, retries={{ max_retries | default(10)
        }}, base={{ base_delay | default(5) }}s, max={{ max_delay | default(60) }}s,
        backoff={{ backoff_type | default('simple') }}, {{ "custom_action=" + custom_action|string
        if custom_action is defined and custom_action != none else "" }}
      tag_value: retry_action_with_backoff__{{ entity_id | replace('.', '_') }}
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ final_state in [''unavailable'',''unknown''] }}'
      - condition: template
        value_template: '{{ notify_on_failure | default(true) }}'
      sequence:
      - action: '{{ notify_service | default(''notify.duncan'') }}'
        data:
          title: 'Entity: {{ friendly }} - {{ final_state }}'
          message: '{{ now_str }} | entity={{ entity_id }} (state={{ final_state }})
            | {{ params_line }}'
          data:
            tag: '{{ tag_value }}'
    - conditions:
      - condition: template
        value_template: '{{ notify_on_failure | default(true) }}'
      - condition: template
        value_template: '{{ final_state != effective_target_state or power_failed
          }}'
      sequence:
      - action: '{{ notify_service | default(''notify.duncan'') }}'
        data:
          title: 'Retry failed: {{ friendly }}'
          message: '{{ now_str }} | entity={{ entity_id }} (state={{ final_state }})
            | {{ params_line }}'
          data:
            tag: '{{ tag_value }}'
save_counts_and_notify_purge_status_and_self_correction:
  alias: Save Counts and Notify Purge Status and Self Correction
  description: Stores current DB row count, calculates purge threshold using a self-correcting
    multiplier derived from the k-history, waits for drop, and notifies on status
    or multiplier changes.
  fields:
    block_id:
      name: Bucket id
      selector:
        text:
      default: 2d
    count:
      name: Entity Count
      selector:
        number:
          min: 1
          max: 10000000
          step: 1
    timeout_minutes:
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: min
      default: 30
      name: Wait Timeout
      description: How many minutes to wait for the purge to reduce DB rows
  variables:
    fallback_multipliers: '{{ {"1d": 50, "2d": 150, "3d": 250, "7d": 100} }}'
    stats: '{% set raw = states(''input_text.db_purge_bucket_stats'') %} {{ (raw if
      raw | length > 2 and raw.startswith(''{'') else ''{}'') | from_json }}'
    history_k: '{{ stats.get(block_id, []) }}'
    entity_count: '{{ count | int(0) }}'
    multiplier: "{% if history_k | length > 0 and entity_count > 0 %}\n  {% set mk
      = history_k | median %}\n  {{ [(mk * 1000 / entity_count) | round(0) | int,
      2500] | min }}\n{% else %}\n  {{ fallback_multipliers.get(block_id, 200) }}\n{%
      endif %}"
    calculated_offset: '{{ (([entity_count * multiplier, 2500] | max) * 0.85) | int(0)
      }}'
    current_count: '{{ states(''sensor.maria_db_rows'') | int(0) }}'
    threshold: '{{ current_count - calculated_offset }}'
  sequence:
  - if:
    - condition: template
      value_template: '{{ not is_number(states(''sensor.maria_db_rows'')) }}'
    then:
    - stop: sensor.maria_db_rows is not numeric; aborting purge status tracking.
  - alias: Save start row count for debugging
    action: input_number.set_value
    target:
      entity_id: input_number.db_row_count_start
    data:
      value: '{{ current_count }}'
  - alias: Wait for purge to complete
    wait_for_trigger:
    - trigger: template
      value_template: '{% set rows = states(''sensor.maria_db_rows'') %} {{ is_number(rows)
        and (rows | int(0)) < threshold }}'
    timeout:
      minutes: '{{ timeout_minutes | int(60) }}'
    continue_on_timeout: true
  - alias: Evaluate Base Results
    variables:
      final_count: '{{ states(''sensor.maria_db_rows'') | int(0) }}'
      removed_rows: '{{ current_count - final_count }}'
      positive_removed_rows: '{{ [removed_rows, 0] | max }}'
  - alias: Calculate Derived Stats
    variables:
      is_partial_success: '{{ not wait.completed and removed_rows > (calculated_offset
        * 0.15) }}'
      is_success: '{{ wait.completed or is_partial_success }}'
      purge_score: '{% set target = calculated_offset | float %} {{ ((positive_removed_rows
        / target) * 100) | round(1) if target > 0 else 0.0 }}'
      new_history_k: "{% if is_success %}\n  {% set removed_k = (positive_removed_rows
        / 1000) | round(0) | int %}\n  {{ (history_k + [removed_k])[-11:] }}\n{% else
        %}\n  {{ history_k }}\n{% endif %}"
      new_multiplier: "{% if is_success and new_history_k | length > 0 and entity_count
        > 0 %}\n  {% set mk = new_history_k | median %}\n  {{ [(mk * 1000 / entity_count)
        | round(0) | int, 2500] | min }}\n{% elif not is_success %}\n  {{ [(multiplier
        * 0.95) | round(0) | int, 50] | max }}\n{% else %}\n  {{ multiplier }}\n{%
        endif %}"
      new_stats: '{{ dict(stats, **{block_id: new_history_k}) | to_json }}'
  - alias: Save Updated JSON Stats (Run Once)
    action: input_text.set_value
    target:
      entity_id: input_text.db_purge_bucket_stats
    data:
      value: '{{ new_stats }}'
  - alias: Increment Correct Target Counter (Run Once)
    action: counter.increment
    target:
      entity_id: '{{ ''counter.db_purge_success'' if is_success else ''counter.db_purge_failure''
        }}'
  - alias: Notifications
    choose:
    - alias: Notify on Failure
      conditions:
      - condition: template
        value_template: '{{ not is_success }}'
      sequence:
      - action: notify.duncan
        data:
          title: ⚠️ DB Purge Failed — {{ block_id }}
          message: "The DB purge for block '{{ block_id }}' likely failed (timed out
            with no significant drop).\n • Efficiency Score: {{ purge_score }}%\n
            • Entities targeted: {{ entity_count }}\n • Start: {{ current_count }}\n
            • Target drop: {{ calculated_offset }} rows (Mult: {{ multiplier }})\n
            • Threshold: {{ threshold }}\n • Final: {{ final_count }}\n • {{'Added:
            +' if removed_rows <= 0 else 'Removed: '}}{{ removed_rows | abs }} rows\n
            • Timed out after {{ timeout_minutes }} minutes.\n\nConsider checking
            your recorder and DB status manually.\n"
          data:
            tag: db_purge_failure_{{ block_id }}
    - alias: Notify on Success
      conditions:
      - condition: template
        value_template: '{{ is_success }}'
      sequence:
      - alias: Check if Multiplier Changed
        if:
        - condition: template
          value_template: '{% set diff = (new_multiplier - multiplier) | abs %} {{
            diff > (multiplier * 0.10) and diff > 15 }}'
        then:
        - action: notify.duncan
          data:
            title: "\U0001F504 DB Purge Multiplier Updated — {{ block_id }}"
            message: "The self-correcting loop adapted the multiplier for '{{ block_id
              }}'.\n • Old Multiplier: {{ multiplier }}\n • New Multiplier: {{ new_multiplier
              }}\n • Recent Removes (k): {{ new_history_k | join(', ') }}\n • Current
              Entities: {{ entity_count }}\n"
            data:
              tag: db_purge_multiplier_{{ block_id }}
      - alias: Conditional Success Notification
        if:
        - condition: state
          entity_id: input_boolean.automation_enable_purge_success_notification
          state: 'on'
        then:
        - action: notify.duncan
          data:
            title: '{% if is_partial_success %}⚠️ DB Purge Partial Success{% else
              %}✅ DB Purge Succeeded{% endif %} — {{ block_id }}'
            message: "The DB purge for block '{{ block_id }}' completed {% if is_partial_success
              %}partially (timed out, but removed rows){% else %}successfully{% endif
              %}.\n • Efficiency Score: {{ purge_score }}%\n • Entities targeted:
              {{ entity_count }}\n • Start: {{ current_count }}\n • Target drop: {{
              calculated_offset }} rows\n • Final: {{ final_count }}\n • Removed:
              {{ positive_removed_rows }} rows (Mult: {{ new_multiplier }})\n • Finished
              in {% if is_partial_success %}{{ timeout_minutes }}{% else %}under {{
              timeout_minutes }}{% endif %} minutes.\n"
            data:
              tag: db_purge_success_{{ block_id }}
  mode: queued
  max: 2
ha_start_settle_delay:
  alias: HA Start Settle Delay
  description: Waits for a specified duration if the automation trigger matches the
    target ID.
  mode: parallel
  fields:
    actual_trigger_id:
      name: Actual Trigger ID
      description: The trigger ID from the calling automation (pass {{ trigger.id
        }}).
      required: true
      example: ha_start
      default: '{{ trigger.id }}'
      selector:
        text: {}
    target_trigger_id:
      name: Target Trigger ID
      description: The trigger ID that requires waiting.
      default: ha_start
      selector:
        text: {}
    delay_duration:
      selector:
        duration: {}
      default:
        hours: 0
        minutes: 0
        seconds: 30
  sequence:
  - if:
    - condition: template
      value_template: '{{ actual_trigger_id == target_trigger_id }}'
    then:
    - delay: '{{ delay_duration }}'
    - delay:
        milliseconds: '{{ range(500, 2501) | random }}'
lichtschalter_betriebsmodus_verzogert_zurucksetzen_2:
  alias: Lichtschalter Betriebsmodus verzögert zurücksetzen
  mode: parallel
  max: 10
  fields:
    switch_entity:
      description: Die Switch-Entität des Schalters
      selector:
        entity: {}
      required: true
      default: switch.duncan_lichtschalter_left
    select_entity:
      description: DieDie Select-Entität des Betriebsmodus
      selector:
        entity: {}
      required: true
      default: select.duncan_lichtschalter_operation_mode_left
  sequence:
  - delay: "{% set min_off_time = 10 %} {% set last_chg = states(switch_entity) |
      default(none) and states[switch_entity].last_changed %} {% if last_chg %}\n
      \ {% set elapsed = (now() - last_chg).total_seconds() %}\n  {% set remaining
      = min_off_time - elapsed %}\n  {{ [0, remaining] | max | round(1) }}\n{% else
      %}\n  10\n{% endif %}"
  - condition: template
    value_template: '{{ is_state(switch_entity, ''off'') }}'
  - action: select.select_option
    target:
      entity_id: '{{ select_entity }}'
    data:
      option: control_relay
charge_ev_message_combined:
  alias: Charge EV Message (Combined)
  description: Sends EV charging notification to Duncan and Stephan and handles response.
  mode: restart
  sequence:
  - alias: Set up variables
    variables:
      action_confirm: '{{ ''CONFIRM_'' ~ context.id }}'
      action_dismiss: '{{ ''DISMISS_'' ~ context.id }}'
  - parallel:
    - alias: Send notification to Duncan
      domain: mobile_app
      type: notify
      device_id: 905c163dcc62544838edb078413723b2
      title: ☀️ EV Charging ☀️
      message: 'Plug in a Car to charge with Solar:

        {{ states(''sensor.evs_home_and_ready_to_charge'') }}'
      data:
        tag: ev_duncan
        actions:
        - action: '{{ action_confirm }}'
          title: Will do
        - action: '{{ action_dismiss }}'
          title: Car Full or no Car
    - alias: Send notification to Stephan if home
      if:
      - condition: state
        entity_id: person.stephan
        state: home
      then:
      - domain: mobile_app
        type: notify
        device_id: 3b177c6db2b7618a07b7cf691b4a3a9c
        title: ☀️ E-Auto Laden ☀️
        message: 'Lade dein Auto mit Solar:

          {{ states(''sensor.evs_home_and_ready_to_charge'') }}'
        data:
          tag: ev_stephan
          actions:
          - action: '{{ action_confirm }}'
            title: Mach ich
          - action: '{{ action_dismiss }}'
            title: Kein Auto oder alle voll
  - alias: Awaiting response from either device
    wait_for_trigger:
    - event_type: mobile_app_notification_action
      event_data:
        action: '{{ action_confirm }}'
      trigger: event
    - event_type: mobile_app_notification_action
      event_data:
        action: '{{ action_dismiss }}'
      trigger: event
    timeout:
      hours: 2
      minutes: 30
      seconds: 0
      milliseconds: 0
    continue_on_timeout: true
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ wait.trigger is defined and wait.trigger.event.data.action
          == action_confirm }}'
      sequence:
      - action: script.retry_action_with_backoff
        metadata: {}
        data:
          action_domain: switch
          action_type: turn_on
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: simple
          notify_on_failure: true
          notify_service: notify.duncan
          entity_id: switch.schreibtisch_links_power_strip_l3
          target_state: 'on'
    - conditions:
      - condition: template
        value_template: '{{ wait.trigger is defined and wait.trigger.event.data.action
          == action_dismiss }}'
      sequence:
      - metadata: {}
        data:
          value: 10
        target:
          entity_id: counter.ev_charging_messages
        action: counter.set_value
  - alias: Clear notifications on both devices
    parallel:
    - domain: mobile_app
      type: notify
      device_id: 905c163dcc62544838edb078413723b2
      message: clear_notification
      data:
        tag: ev_duncan
    - domain: mobile_app
      type: notify
      device_id: 3b177c6db2b7618a07b7cf691b4a3a9c
      message: clear_notification
      data:
        tag: ev_stephan
laundry_reminder_loop:
  alias: Laundry Reminder Loop
  description: Loops repeating notifications and TTS announcements until the appliance
    flag turns off.
  mode: parallel
  max: 4
  fields:
    title:
      description: Title for the notification
      example: Waschmaschine fertig
    boolean_entity:
      description: Input boolean entity to monitor
      example: input_boolean.waschmaschine_fertig
    tag:
      description: Notification tag for updates and clearing
      example: waschmaschine_fertig
    icon:
      description: MDI icon string
      example: mdi:washing-machine
    messages:
      description: List of custom messages to pick from randomly
      example: '[''Räum das Ding aus'', ''Ab in den Keller'']'
  sequence:
  - repeat:
      sequence:
      - variables:
          selected_message: '{{ messages | random }}'
      - action: script.notify_people_at_home_with_fallbacks
        data:
          title: '{{ title }}'
          message: '{{ selected_message }}'
          tag: '{{ tag }}'
          color: yellow
          notification_icon: '{{ icon }}'
      - action: chime_tts.say
        target:
          entity_id: media_player.lenovo_lenovo_tb_j606f
        data:
          chime_path: classical
          tts_platform: tts.google_ai_tts
          offset: -750
          cache: true
          volume_level: 0.65
          message: '{{ selected_message }}'
      - wait_template: '{{ is_state(boolean_entity, ''off'') }}'
        timeout:
          minutes: 10
        continue_on_timeout: true
      until:
      - condition: template
        value_template: '{{ is_state(boolean_entity, ''off'') }}'
  - action: notify.familie
    metadata: {}
    data:
      data:
        tag: '{{ tag }}'
      message: clear_notification
