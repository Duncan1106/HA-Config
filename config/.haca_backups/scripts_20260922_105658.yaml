adjust_input_number:
  alias: Adjust Input Number
  description: Modify any numeric helper by a specific amount.
  fields:
    target_entity:
      name: Target Entity
      description: Select the input_number to modify.
      required: true
      selector:
        entity:
          domain: input_number
    operation:
      name: Operation
      description: Add to or subtract from the current value.
      default: add
      selector:
        select:
          options:
          - label: Add (+)
            value: add
          - label: Subtract (-)
            value: subtract
    amount:
      name: Value
      description: The amount to use for the adjustment.
      required: true
      selector:
        number:
          min: 0
          max: 1000000
          step: 0.01
          mode: box
  sequence:
  - action: input_number.set_value
    target:
      entity_id: '{{ target_entity }}'
    data:
      value: '{% set current = states(target_entity) | float(0) %} {% set val = amount
        | float(0) %} {{ current + val if operation == ''add'' else current - val
        }}

        '
notify_people_at_home_with_fallbacks:
  alias: Notify People at Home (With Fallbacks)
  description: Sends a notification to people home, with default values if fields
    are missing.
  fields:
    message:
      description: The main body of the notification
      example: The garage is open
      required: true
      selector:
        text:
      name: Message
    title:
      description: '''Fallback: ''Home Assistant'''
      example: Security
      selector:
        text:
      name: Title
    tag:
      description: 'Fallback: ''general_notification'''
      example: garage_status
      selector:
        text:
      name: Notification Tag
    color:
      selector:
        text: {}
    notification_icon:
      description: Optional notification icon (e.g. mdi:alert)
      selector:
        text:
      name: Notification Icon
    channel:
      description: Notification Channel
      selector:
        text:
      name: Channel
  sequence:
  - variables:
      final_title: "{{ title if title is defined and title | trim | length > 0\n   else
        'Home Assistant' }}"
      final_tag: "{{ tag if tag is defined and tag | trim | length > 0\n   else 'general_notification'
        }}"
      notify_data: "{% set base_data = dict(tag=final_tag) %} {% if color is defined
        and color %}\n  {% set base_data = base_data | combine(dict(color=color))
        %}\n{% endif %}  {% if notification_icon is defined and notification_icon
        %}\n  {% set base_data = base_data | combine(dict(notification_icon=notification_icon))
        %}\n{% endif %}  {% if channel is defined and channel %}\n  {% set base_data
        = base_data | combine(dict(channel=channel)) %}\n{% endif %} {{ dict(message=message,
        title=final_title, data=base_data) }}"
  - if:
    - condition: template
      value_template: '{{ message == ''clear_notification'' }}'
    then:
    - action: notify.familie
      data:
        message: '{{ message }}'
        data:
          tag: '{{ final_tag }}'
    else:
    - if:
      - condition: state
        entity_id: binary_sensor.anyone_home
        state:
        - 'on'
      then:
      - repeat:
          for_each:
          - person: person.stephan
            service: mobile_app_stephan_iphone
          - person: person.katalin
            service: mobile_app_fp4
          - person: person.enya
            service: mobile_app_iphone_von_enya
          - person: person.duncan
            service: duncan
          sequence:
          - if:
            - condition: template
              value_template: '{{ is_state(repeat.item.person, ''home'') }}'
            then:
            - action: notify.{{ repeat.item.service }}
              continue_on_error: true
              data: '{{ notify_data }}'
      else:
      - action: notify.familie
        metadata: {}
        data: '{{ notify_data }}'
  mode: parallel
  max: 50
shawn_weekly_edge_cut:
  alias: 'Shawn: Edge Cut'
  fields:
    total_rounds:
      name: Total Rounds
      description: Number of edge cut passes to perform
      default: 5
      selector:
        number:
          min: 1
          max: 10
          mode: box
  sequence:
  - variables:
      total_rounds: '{{ total_rounds | default(5) | int() }}'
  - action: notify.duncan
    data:
      title: '✂️ Shawn: Edge Cut gestartet'
      message: Edge-Cut-Routine gestartet ({{ total_rounds }} Runden).
      data:
        tag: shawn_edge_cut
  - repeat:
      count: '{{ total_rounds }}'
      sequence:
      - variables:
          round_start_time: '{{ now() }}'
          battery_start: '{{ states("sensor.shawn_batterie") | int(0) }}'
