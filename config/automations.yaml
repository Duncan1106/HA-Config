- id: '1750706221080'
  alias: Adjust Grow Light Brightness from Sensor
  description: "## \U0001F4A1 Adjust Grow Light Brightness from Sensor\n\n### \U0001F4CB
    Purpose\nDynamically adjusts the brightness and color temperature of the grow
    light\nbased on sensor readings, ensuring optimal plant lighting while the light
    is\navailable.\n\n---\n\n### ⏰ Triggers\n| Trigger Type | Details                          |\n|--------------|---------------------------------|\n|
    State Change | `sensor.grow_light_temperature` |\n| State Change | `sensor.grow_light_brightness_raw`
    |\n\n---\n\n### ✅ Conditions\n- Only execute if the grow light entity (`light.regal_big_led_light`)
    is not\n  `unavailable` or `unknown`.\n\n---\n\n### \U0001F3AF Actions / Workflow\n-
    Updates light brightness using `sensor.grow_light_brightness_raw`.\n- Updates
    color temperature using `sensor.grow_light_temperature`.\n- Turns on the light
    with the updated settings.\n\n---\n\n### \U0001F527 Technical Specs\n- **Mode:**
    `queued` to handle multiple state changes in sequence.\n- Uses template conversion
    to ensure sensor values are integers for Home\n  Assistant."
  triggers:
  - entity_id:
    - sensor.grow_light_temperature
    - sensor.grow_light_brightness_raw
    trigger: state
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: light.regal_big_led_light
      state: unavailable
    - condition: state
      entity_id: light.regal_big_led_light
      state: unknown
  actions:
  - target:
      entity_id: light.regal_big_led_light
    data:
      brightness: '{{ states(''sensor.grow_light_brightness_raw'') | int(0) }}'
      color_temp_kelvin: '{{ states(''sensor.grow_light_temperature'') | int(0) }}'
    action: light.turn_on
  mode: queued
- id: '1750928722036'
  alias: Reboot Host System on 1st of the Month
  description: "\n  ## \U0001F504 Monthly Host Reboot Automation\n\n  ### \U0001F4CB
    Purpose\n\n  Automatically reboots the Home Assistant host system on the **first
    day of\n  every month**, providing an advance notification one hour prior to the
    reboot\n  for awareness.\n\n  Adds a **safety condition** ensuring the host has
    been running for **at least\n  10 days** since the last system start, preventing
    unnecessary reboots after\n  recent restarts.\n\n  ---\n\n  ### ⏱ Triggers\n\n
    \ - `12:00:00` → Sends pre-notification one hour before reboot.\n\n  - `13:00:00`
    → Executes the actual host system reboot.\n\n  ---\n\n  ### ✅ Conditions\n\n  -
    Current day must be the **1st of the month**.\n    ```jinja\n    {{ now().day
    == 1 }}\n    ```\n\n  - The last system boot must be **10 or more days ago**.\n
    \   ```jinja\n    {{ (as_timestamp(now()) -\n            (as_timestamp(states('sensor.system_monitor_letzter_start'))
    |\n            float(0))) >= 864000 }}\n    ```\n\n  ---\n\n  ### \U0001F3AF Actions
    / Workflow\n\n  #### 12:00 Notification\n\n  - Send a notification to the user
    that the host system will reboot at 13:00.\n\n  #### 13:00 Reboot\n\n  - Verify
    that the system has been up for at least 10 days.\n  - Notify the user that the
    host system is now rebooting.\n  - Trigger `hassio.host_reboot` to reboot the
    Home Assistant host.\n\n  ---\n\n  ### \U0001F527 Technical Specs\n\n  - Mode:
    `choose` structure based on which trigger fired.\n  - Notifications use plain
    text for clarity."
  triggers:
  - at: '12:00:00'
    trigger: time
    id: '12'
  - at: '13:00:00'
    trigger: time
    id: '13'
  conditions:
  - condition: template
    value_template: '{{ now().day == 1 }}'
  - alias: Last Host Reboot is more than 10 Days ago
    condition: template
    value_template: '{% set boot = as_timestamp(states(''sensor.system_monitor_letzter_start''))
      %}

      {{ boot is number and (as_timestamp(now()) - boot) >= 864000 }}'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - '12'
      sequence:
      - metadata: {}
        data:
          message: Rebooting Hostsystem at 13 o'clock
          data:
            tag: reboot_hostsystem_warning
        action: notify.duncan
    - conditions:
      - condition: trigger
        id:
        - '13'
      sequence:
      - metadata: {}
        data:
          message: ' '
          title: Rebooting Hostsystem
          data:
            tag: reboot_hostsystem
        action: notify.duncan
      - data: {}
        action: hassio.host_reboot
- id: '1751198541612'
  alias: Router Restart on Internet Outage (with Backoff)
  description: Restarts the O2 router upon internet failure, with several attempts
    and an exponential backoff timer.
  triggers:
  - trigger: state
    entity_id: binary_sensor.internet_connection
    from: 'on'
    to: 'off'
    for: 00:02:30
    id: internet_offline
  - trigger: state
    entity_id: schedule.restart_o2_router_schedule
    from: 'off'
    to: 'on'
    for: 00:00:10
    id: scheduled_restart
  conditions:
  - condition: state
    entity_id: switch.o2_router
    state: 'on'
    alias: Router ist eingeschaltet
  - alias: Router verbraucht >4W
    condition: template
    value_template: '{{ states(''sensor.o2_router_power'') | float(0) > 4.0 }}'
  actions:
  - alias: Wiederhole Neustartversuche bis Internet da oder max_retries erreicht
    repeat:
      until:
      - condition: or
        conditions:
        - condition: state
          entity_id: binary_sensor.internet_connection
          state: 'on'
          alias: Internet wiederhergestellt
        - condition: template
          value_template: '{{ repeat.index >= max_retries }}'
          alias: Maximale Anzahl Neustartversuche erreicht
      sequence:
      - action: script.restart_internet
        data:
          called_by_automation: true
        alias: Router neu starten
      - if:
        - condition: state
          entity_id: binary_sensor.internet_connection
          state:
          - 'off'
        then:
        - wait_for_trigger:
          - trigger: state
            entity_id: binary_sensor.internet_connection
            to: 'on'
            for: 00:00:30
          timeout: 00:05:00
          continue_on_timeout: true
          alias: Warte auf Internet nach Neustart
        alias: Wait for reconnect if not already reconnected
      - if:
        - condition: state
          entity_id: binary_sensor.internet_connection
          state: 'off'
        then:
        - delay:
            minutes: '{% set delay = 2 ** (repeat.index - 1) * 2 %} {{ [delay, 15]
              | min }}

              '
          alias: Backoff vor nächstem Versuch
  - alias: Benachrichtigung bei endgültigem Fehler
    sequence:
    - condition: not
      conditions:
      - condition: state
        entity_id: binary_sensor.internet_connection
        state: 'on'
      alias: Benachrichtigung bei Fehlschlag aller Neustartversuche
    - action: persistent_notification.create
      metadata: {}
      data:
        notification_id: router_restart_failed
        title: Router Neustart fehlgeschlagen
        message: Nach {{ max_retries }} Versuchen konnte keine Internetverbindung   wiederhergestellt
          werden. Bitte überprüfe den O2 Router manuell.
    - alias: Spätere Push-Benachrichtigung bei Rückkehr des Internets
      wait_for_trigger:
      - entity_id: binary_sensor.internet_connection
        to: 'on'
        trigger: state
      timeout: 01:00:00
      continue_on_timeout: false
    - action: persistent_notification.dismiss
      metadata: {}
      data:
        notification_id: router_restart_failed
    - alias: Push-Nachricht bei verspätetem Erfolg
      data:
        title: Internet zurück nach Fehler
        message: 'Das Internet war über längere Zeit nicht verfügbar. Bitte prüfe
          den Router oder die Verbindung, es waren {{ max_retries }} Neustartversuche
          nötig.

          '
      action: notify.duncan
  mode: restart
  variables:
    max_retries: 10
- id: '1751225518081'
