- id: '1708932016459'
  alias: Update System Metrics Sensors
  description: "## ⚙️ System Metrics Update Automation\n\n### \U0001F4CB Purpose\nAutomates
    the update of system metrics and device states at different intervals:\n\n- Every
    **5 minutes**: Forces a data refresh for system metrics sensors.\n- Every **2
    hours**: Reloads AnkerMake controller if it is running.\n- Every **3 hours**:
    Placeholder for future scheduled updates.\n\n---\n\n### ⏱ Triggers\n- **5-minute
    interval**: `time_pattern` trigger every 5 minutes (`minutes: /5`).\n- **2-hour
    interval**: `time_pattern` trigger every 2 hours (`hours: /2`).\n- **3-hour interval**:
    `time_pattern` trigger every 3 hours (`hours: /3`), currently enabled but no actions
    defined.\n\n---\n\n### ✅ Conditions\n- None globally; each action block checks
    the corresponding trigger ID to ensure correct execution.\n- For the 2-hour action,
    also checks that `binary_sensor.ankerctl_lauft` is \"on\" before reloading the
    AnkerMake controller.\n\n---\n\n### \U0001F3AF Actions\n- **5-minute trigger (`5m`)**:\n
    \   - Turns on `switch.wvgzzze2zpe005371_force_data_refresh` to refresh system
    metrics.\n- **2-hour trigger (`2h`)**:\n    - If AnkerMake is running (`binary_sensor.ankerctl_lauft`
    == \"on\"), presses `button.ankermake_m5c_reload_ankerctl` to reload the controller.\n-
    **3-hour trigger (`3h`)**:\n    - Currently empty; reserved for future use.\n\n---\n\n###
    \U0001F527 Technical Notes\n- Mode: `queued` with `max: 10` to handle overlapping
    triggers safely.\n- Individual action blocks are conditionally executed based
    on the trigger ID.\n- Designed to minimize unnecessary actions while keeping devices
    and sensors up-to-date."
  triggers:
  - minutes: /5
    id: 5m
    trigger: time_pattern
  - hours: /2
    id: 2h
    trigger: time_pattern
  - id: 3h
    hours: /3
    trigger: time_pattern
    enabled: true
  conditions: []
  actions:
  - alias: 5m
    if:
    - condition: trigger
      id:
      - 5m
    then:
    - action: homeassistant.turn_on
      metadata: {}
      data: {}
      target:
        entity_id: switch.wvgzzze2zpe005371_force_data_refresh
      enabled: true
  - alias: 2h
    if:
    - condition: trigger
      id:
      - 2h
    then:
    - if:
      - condition: state
        entity_id: binary_sensor.ankerctl_lauft
        state: 'on'
      then:
      - metadata: {}
        data: {}
        target:
          entity_id: button.ankermake_m5c_reload_ankerctl
        action: button.press
        enabled: true
  - alias: 3h
    if:
    - condition: trigger
      id:
      - 3h
    then: []
    enabled: true
  mode: queued
  max: 10
- id: '1709073413848'
  alias: Auto Boiler
  description: "## \U0001F525 Auto Boiler  \n\n### \U0001F4CB **Boiler Automation
    and Energy Management**  \nThis automation controls the boiler based on a schedule,
    optimizes energy usage, and notifies if the water temperature is too low.  \n\nIt
    automatically runs the energy-saving script when the boiler turns on and ensures
    notifications are sent if the water temperature drops below 30°C.  \n\n---\n\n###
    ⏰ **Triggers**  \n\n| Trigger Entity | Event / Condition | Trigger ID |\n|----------------|-----------------|------------|\n|
    `schedule.boiler_pumpe` | State changes from `null` → `on` | \"On\" |\n| `schedule.boiler_pumpe`
    | State changes from `null` → `off` | \"Off\" |\n| `script.boiler_save_energy_script`
    | State changes from `on` → `off` | \"Script finished\" |\n\n> **Note:** The first
    trigger starts the automation when the boiler schedule turns on, the second triggers
    when the schedule turns off, and the third ensures the energy-saving script is
    re-executed if needed.  \n\n---\n\n### ✅ **Conditions**  \n- No explicit conditions;
    triggers execute actions directly.  \n- Internal checks exist in actions, e.g.,
    numeric state for water temperature.  \n\n---\n\n### \U0001F3AF **Actions / Workflow**
    \ \n\n1. **On Trigger** (`schedule.boiler_pumpe` → on)  \n   - Checks if `sensor.boiler_temperature`
    < 30°C  \n     - Sends notification:  \n       `Das Wasser hat nur {{ states('sensor.boiler_temperature')
    | float(0)| round(0) }}°C!`  \n   - Executes `script.boiler_save_energy_script`
    to optimize energy usage  \n\n2. **Off Trigger** (`schedule.boiler_pumpe` → off)
    \ \n   - Turns off the boiler switch (`switch.zirkulationspumpe_zigbee`)  \n\n3.
    **Script Finished Trigger** (`script.boiler_save_energy_script` → off)  \n   -
    If `schedule.boiler_pumpe` is still on, re-executes the energy-saving script  \n
    \  - Ensures boiler remains optimized if still in the scheduled timeframe  \n\n---\n\n###
    \U0001F527 **Technical Specs**  \n- **Mode:** `queued` (max 10 concurrent)  \n-
    **Energy Management:** Uses `script.boiler_save_energy_script` to optimize consumption
    \ \n- **Notifications:** Sends a message to `notify.duncan` if water < 30°C  \n-
    **Devices Controlled:** Boiler switch device (`switch.zirkulationspumpe_zigbee`)
    \ \n\n---\n\n### ⚡ **Notes / Best Practices**  \n- Minimizes energy waste by automating
    the boiler only when needed.  \n- Notification threshold can be adjusted for personal
    preference.  \n- Queued mode prevents overlapping executions if triggers occur
    in rapid succession.\n"
  triggers:
  - entity_id:
    - schedule.boiler_pumpe
    from:
    to: 'on'
    id: 'On'
    for:
      hours: 0
      minutes: 0
      seconds: 0
    trigger: state
  - entity_id:
    - schedule.boiler_pumpe
    from:
    to: 'off'
    id: 'Off'
    trigger: state
  - trigger: state
    entity_id:
    - script.boiler_save_energy_script
    to: 'off'
    from: 'on'
    id: Script finished
  conditions: []
  actions:
  - alias: 'On'
    if:
    - condition: trigger
      id:
      - 'On'
    then:
    - alias: Notify of not enough warm water
      if:
      - condition: numeric_state
        entity_id: sensor.boiler_temperature
        below: 30
      then:
      - metadata: {}
        data:
          message: Das Wasser hat nur {{ states('sensor.boiler_temperature') | float(0)|
            round(0) }}°C!
        action: notify.duncan
    - action: script.boiler_save_energy_script
      metadata: {}
      data: {}
  - alias: 'Off'
    if:
    - condition: trigger
      id:
      - 'Off'
    then:
    - action: switch.turn_off
      metadata: {}
      data: {}
      target:
        entity_id: switch.zirkulationspumpe_zigbee
  - if:
    - condition: trigger
      id:
      - Script finished
    - condition: state
      entity_id: schedule.boiler_pumpe
      state: 'on'
    then:
    - action: script.boiler_save_energy_script
      metadata: {}
      data: {}
    alias: Re Execute if Still in Time Frame
  mode: queued
  max: 10
- id: '1710427927351'
  alias: 'Daily Energy Summary '
  description: "## \U0001F31E Daily Energy Summary Automation\n\n### \U0001F4CB **Purpose**\n\nThis
    automation provides a comprehensive daily energy summary for your household. It
    sends notifications at sunrise, sunset, and midnight with summaries of energy
    usage, appliance activity, EV charging, and solar forecasts. The automation can
    be selectively enabled or disabled via input booleans.\n\n---\n\n### ⏰ **Triggers**\n\n|
    Trigger | Description | Trigger ID |\n|---------|------------|------------|\n|
    Time | 23:59:55 (end of day) | Day End |\n| Sun | Sunrise | Rise |\n| Sun | Sunset
    | Set |\n\n> Note: Sunrise and sunset triggers provide summaries and forecasts,
    while the midnight trigger ensures end-of-day summaries and appliance logging.\n\n---\n\n###
    ✅ **Conditions**\n\n- Conditional notifications are controlled via input booleans:
    \ \n  - `input_boolean.automation_enable_sunrise`  \n  - `input_boolean.automation_enable_sunset`
    \ \n  - `input_boolean.automation_enable_midnight`  \n  - `input_boolean.automation_enable_appliance`
    \ \n  - `input_boolean.automation_enable_go_echarger`  \n  - `input_boolean.automation_enable_forecast`
    \ \n\n---\n\n### \U0001F3AF **Actions / Workflow**\n\n1. **Sunrise Message**  \n
    \  - Sends `sensor.energy_summary_1st_block` and `sensor.energy_summary_1st_block_2`
    if enabled.  \n\n2. **Sunset Message**  \n   - Sends the same energy summary as
    sunrise if enabled.  \n\n3. **Midnight Message**  \n   - Sends energy summary
    at day end if enabled.  \n\n4. **Appliance Summary (Day End)**  \n   - Sends `sensor.appliance_used`
    if appliance reporting is enabled.  \n\n5. **EV Charging Notification (Sunset)**
    \ \n   - Checks `sensor.daily_energy_goe_11kw` and `sensor.daily_energy_goe_22kw`.
    \ \n   - Sends notification detailing 11kW, 22kW, and total charged energy if
    enabled.  \n   - Adds a 5-second delay before reporting to ensure data availability.
    \ \n\n6. **Reset EV Messages Counter (Day End)**  \n   - Resets `counter.ev_charging_messages`
    to 0.  \n\n7. **Solar Forecast Notifications**  \n   - Sunset: Sends tomorrow's
    solar forecast (`sensor.solar_forecast_text_tomorrow`) if enabled.  \n   - Sunrise:
    Sends today's solar forecast (`sensor.solar_forecast_text_today`) if enabled.
    \ \n\n---\n\n### \U0001F527 **Technical Specs**\n\n- **Mode:** `parallel` (max
    10 concurrent notifications)  \n- **Notification Target:** `notify.duncan`  \n-
    **Controlled Input Booleans:** Enables/disables specific message categories.  \n-
    **Counters:** Tracks EV charging messages and resets daily.\n\n---\n\n### ⚡ **Notes
    / Best Practices**\n\n- Conditional triggers prevent unnecessary messages if certain
    summaries are disabled.  \n- Includes slight delays where necessary to ensure
    sensor data is accurate before notification.  \n- Forecast and EV notifications
    provide actionable insights for daily energy planning.  \n- Easily extendable
    with new summary sensors or notification channels.\n"
  triggers:
  - at: '23:59:55'
    id: Day End
    trigger: time
  - event: sunrise
    offset: 0
    id: Rise
    trigger: sun
  - event: sunset
    offset: 0
    id: Set
    trigger: sun
  conditions: []
  actions:
  - alias: 'Message rise '
    if:
    - condition: trigger
      id:
      - Rise
    - condition: state
      entity_id: input_boolean.automation_enable_sunrise
      state: 'on'
    then:
    - data:
        title: 'Daily Energy Summary:'
        message: '{{ states(''sensor.energy_summary_1st_block'') }}


          {{ states(''sensor.energy_summary_1st_block_2'') }}

          '
      action: notify.duncan
  - alias: 'Message sunset '
    if:
    - condition: trigger
      id:
      - Set
    - condition: state
      entity_id: input_boolean.automation_enable_sunset
      state: 'on'
    then:
    - data:
        title: 'Daily Energy Summary:'
        message: '{{ states(''sensor.energy_summary_1st_block'') }}


          {{ states(''sensor.energy_summary_1st_block_2'') }}

          '
      action: notify.duncan
  - alias: 'Message midnight '
    if:
    - condition: trigger
      id:
      - Day End
    - condition: state
      entity_id: input_boolean.automation_enable_midnight
      state: 'on'
    then:
    - data:
        title: 'Daily Energy Summary:'
        message: '{{ states(''sensor.energy_summary_1st_block'') }}


          {{ states(''sensor.energy_summary_1st_block_2'') }}

          '
      action: notify.duncan
  - alias: Appliances
    if:
    - condition: trigger
      id:
      - Day End
    - condition: state
      entity_id: input_boolean.automation_enable_appliance
      state: 'on'
    then:
    - data:
        title: 'Appliance Summary:'
        message: '{{ states(''sensor.appliance_used'') }}

          '
      action: notify.duncan
  - alias: Sunset Notification
    if:
    - condition: trigger
      id:
      - Set
    then:
    - if:
      - condition: state
        entity_id: input_boolean.automation_enable_go_echarger
        state: 'on'
      then:
      - delay:
          hours: 0
          minutes: 0
          seconds: 5
          milliseconds: 0
      - alias: Goe
        if:
        - condition: or
          conditions:
          - condition: numeric_state
            entity_id: sensor.daily_energy_goe_11kw
            above: 0
          - condition: numeric_state
            entity_id: sensor.daily_energy_goe_22kw
            above: 0
        then:
        - metadata: {}
          data:
            title: Charged Energy
            message: '{{ "- 11kW: " + states(''sensor.daily_energy_goe_11kw'')|float(0)|round(2)|string
              + ''kWh'' if states(''sensor.daily_energy_goe_11kw'')|float(0)|round(2)
              > 0 else ''''}}

              {{ "- 22kW: " + states(''sensor.daily_energy_goe_22kw'')|float(0)|round(2)|string
              + ''kWh'' if states(''sensor.daily_energy_goe_22kw'')|float(0)|round(2)
              > 0 else ''''}}

              {{ " Total: " + (states(''sensor.daily_energy_goe_22kw'')|float(0)|round(2)
              + states(''sensor.daily_energy_goe_11kw'')|float(0)|round(2))|round(2)|string
              + "kWh" if states(''sensor.daily_energy_goe_22kw'')|float(0)|round(2)
              > 0 and states(''sensor.daily_energy_goe_11kw'')|float(0)|round(2) >
              0}}

              '
          action: notify.duncan
      alias: 'Go-eCharger '
  - alias: Reset EV Messages Counter
    if:
    - condition: trigger
      id:
      - Day End
    then:
    - metadata: {}
      data: {}
      target:
        entity_id: counter.ev_charging_messages
      action: counter.reset
    - action: counter.reset
      metadata: {}
      data: {}
      target:
        entity_id:
        - counter.db_purge_failure
        - counter.db_purge_success
  - alias: Forecast tomorrow
    if:
    - condition: trigger
      id:
      - Set
    - condition: state
      entity_id: input_boolean.automation_enable_forecast
      state: 'on'
    then:
    - data:
        title: 'Solar Forecast Tomorrow:'
        message: '{{ states(''sensor.solar_forecast_text_tomorrow'') }}

          '
      action: notify.duncan
  - alias: Forecast today
    if:
    - condition: trigger
      id:
      - Rise
    - condition: state
      entity_id: input_boolean.automation_enable_forecast
      state: 'on'
    then:
    - data:
        title: 'Solar Forecast Today:'
        message: '{{ states(''sensor.solar_forecast_text_today'') }}

          '
      action: notify.duncan
  mode: parallel
  max: 10
- id: '1710589916637'
  alias: Fire Detection from Temperature Sensors
  description: This automation monitors temperature sensors for potential fire conditions.
    It sends notifications if the temperature exceeds a specified threshold, helping
    to ensure safety by alerting when fire risk is detected.
  triggers:
  - seconds: /15
    trigger: time_pattern
  conditions:
  - condition: template
    value_template: '{{ sensors != '''' }}'
  actions:
  - choose: []
    default:
    - metadata: {}
      data:
        message: Fire detected in {{sensors}}
      action: notify.duncan
    - metadata: {}
      data:
        message: Feuer erkannt bei {{sensors}}
      action: notify.mobile_app_stephan_iphone
  variables:
    threshold: 45
    include:
      entity_id:
      - sensor.esp32_c3_mini_terra_duncan_room_temperature
      - sensor.esp32_c3_zero_epever_bme280_temperature
      - sensor.inverter_battery_temperature
      - sensor.esphome_az_envy_2_temperature_gartenhaus
      - sensor.esphome_az_envy_1_temperature_heizraum
      - sensor.esphome_az_envy_3_temperature_3d_printer
      - sensor.gw1100a_indoor_temperature
      - sensor.t_h_duncan_zigbee_temperature
      - sensor.t_h_waschkuche_zigbee_temperature
      - sensor.weinkeller_temperature
      - sensor.t_h_bad_zigbee_temperature
      - sensor.t_h_kinderbad_zigbee_temperature
      - sensor.inverter_battery_temperature
      - sensor.t_h_garage_zigbee_temperature
      - sensor.esp32_c3_zero_epever_battery_temperature
    sensors: "{% set result = namespace(sensors=[]) %} {% for state in states.sensor
      | selectattr('attributes.device_class', '==', 'temperature') %}\n  {% if 0 <=
      state.state | int(-1) > threshold | int and state.entity_id in include.entity_id
      %}\n    {% set result.sensors = result.sensors + [state.name ~ ' (' ~ state.state
      ~ ' °C)'] %}\n  {% endif %}\n{% endfor %} {% for state in states.binary_sensor
      | selectattr('attributes.device_class', '==', 'temperature') | selectattr('state',
      '==', 'on') %}\n  {% if state.entity_id in include.entity_id %}\n    {% set
      result.sensors = result.sensors + [state.name] %}\n  {% endif %}\n{% endfor
      %} {{result.sensors|join(', ')}}"
  mode: single
- id: '1710856538174'
  alias: Count Battery Full
  description: "  ## \U0001F50B Count Battery Full Automation\n\n  ### \U0001F4CB
    **Battery State Monitoring**\n  Monitors `sensor.esp32_c3_zero_epever_battery_voltage`
    to track **battery full/empty states**.  \n  Updates `input_boolean.battery_full`
    and logs charged energy when full.\n\n  ---\n\n  ### ⏰ **Triggers**\n  - **Full:**
    Voltage rises above **28.3 V**  \n  - **Empty:** Voltage drops below **24 V**
    \ \n\n  ---\n\n  ### ✅ **Conditions**\n  - **Full Trigger:** Executes if `battery_full`
    is **off**.  \n  - **Empty Trigger:** Executes only if `battery_full` is **on**.\n\n
    \ ---\n\n  ### \U0001F3AF **Actions**\n  - **Full:**  \n    - Turn on `input_boolean.battery_full`.
    \ \n    - Save current charged energy to `input_number.last_charged_energy_to_bkw_battery`.
    \ \n  - **Empty:**  \n    - Turn off `input_boolean.battery_full`.  \n\n  ---\n\n
    \ ### \U0001F527 **Specs**\n  - **Mode:** `single`  \n  - **Controlled Entities:**
    \ \n    - `input_boolean.battery_full`  \n    - `input_number.last_charged_energy_to_bkw_battery`
    \ \n  - **Monitored Entities:**  \n    - `sensor.esp32_c3_zero_epever_battery_voltage`
    \ \n    - `sensor.charged_energy_to_bkw_battery`"
  triggers:
  - entity_id:
    - sensor.esp32_c3_zero_epever_battery_voltage
    above: 28.3
    id: Full
    trigger: numeric_state
  - entity_id:
    - sensor.esp32_c3_zero_epever_battery_voltage
    below: 24
    id: Empty
    trigger: numeric_state
  conditions: []
  actions:
  - alias: Full
    if:
    - condition: trigger
      id:
      - Full
    - condition: state
      entity_id: input_boolean.battery_full
      state: 'off'
    then:
    - target:
        entity_id:
        - input_boolean.battery_full
      data: {}
      action: input_boolean.turn_on
    - action: input_number.set_value
      metadata: {}
      data:
        value: '{{ states(''sensor.charged_energy_to_bkw_battery'') | float(0) | round(2)
          }}

          '
      target:
        entity_id: input_number.last_charged_energy_to_bkw_battery
  - alias: Empty
    if:
    - condition: state
      entity_id: input_boolean.battery_full
      state: 'on'
    - condition: trigger
      id:
      - Empty
    then:
    - metadata: {}
      data: {}
      target:
        entity_id: input_boolean.battery_full
      action: input_boolean.turn_off
  mode: single
- id: '1711468239502'
  alias: BKw Control
  description: "  ## ⚡ BKW Control Automation\n\n  ### \U0001F4CB **Optimized Outlet
    Control for Solar & Battery System**\n\n  This automation manages the BKW outlet
    based on solar production, battery\n  state-of-charge (SoC) and voltage, inverter
    state, sunrise/sunset times, \n  device temperature, and energy usage. Its primary
    goals are:\n\n  - Optimize charging and discharging to maximize solar self-consumption.\n
    \ - Protect battery health by enforcing SoC/voltage thresholds.\n  - Ensure nightly
    shutdown if energy has been used.\n  - Increment counters for monitoring energy
    events.\n\n  ---\n\n  ### ⏰ **Triggers**\n\n  | Trigger Entity | Condition / Threshold
    | Trigger ID |\n  |----------------|-----------------------|------------|\n  |
    `sensor.inverter_pv_power` | Above 2250 W | on day |\n  | `sensor.esp32_c3_zero_epever_battery_voltage`
    | Below 23 V | off night |\n  | `sensor.esp32_c3_zero_epever_pv_array_input_power`
    | Below 200 / 175 / 125 / 75 W | off day |\n  | `sensor.inverter_pv_power` | Below
    2250 / 2000 W | off day |\n  | Sun | Sunset offset -00:15 | on night |\n  | Sun
    | Sunrise offset +00:15 | off night |\n  | `time_pattern` | Every minute | on
    day |\n  | `sensor.bkw_outlet_1_energy_power` | Below 50 W | off night |\n\n  >
    Note: Multiple `off day` and `off night` triggers are defined, each with\n  the
    same ID, to cover a wide range of solar, battery, and night-time states.\n\n  ---\n\n
    \ ### ✅ **Conditions**\n\n  - The automation requires **one of the following**:\n
    \   - Battery is full (`input_boolean.battery_full = on`), OR\n      Battery SoC
    ≥ 95% / Voltage ≥ 27.75 V.\n    - OR inverter PV power has dropped < 2001 W **while
    the outlet is on**.\n\n  This ensures:\n  - Outlets only turn on under safe/high
    battery conditions.\n  - Outlets turn off when PV is weak but still active.\n\n
    \ ---\n\n  ### \U0001F3AF **Actions / Workflow**\n\n  1. **On Day Trigger**\n
    \    - Executes if:\n       - Trigger ID = `on day`\n       - Inverter state =
    `FeedIn`\n       - Battery marked full (`input_boolean.battery_full = on`)\n       -
    Battery SoC ≥ 80%\n       - PV power > 2000 W\n       - Device temperature < 44°C\n
    \    - Turns on:\n       - `switch.esp32_c3_zero_epever_manual_control_the_load`\n
    \      - `switch.bkw_outlet_1_bkw_outlet_1`\n\n  2. **Off Day Trigger**\n     -
    Executes if Trigger ID = `off day` during daytime \n       (between sunrise+15
    and sunset-15).\n     - Turns off the BKW outlet when PV power/array input drops.\n\n
    \ 3. **On Night Trigger**\n     - Executes if Trigger ID = `on night` and battery
    is full.\n     - Turns on the load + BKW outlet.\n     - Increments `counter.battery_full`.\n
    \    - Resets utility meters for charged/discharged energy.\n     - Waits up to
    30s for load > 10W.  \n       - If not reached, sends notification.\n\n  4. **Off
    Night Trigger**\n     - Executes if Trigger ID = `off night`, \n       time between
    00:00–09:00, \n       and energy consumption > 0.001 kWh.\n     - Repeats `turn_off`
    until outlet is confirmed off.\n     - Resets `input_boolean.battery_full`.\n
    \    - If discharged energy > 0:\n       - Increments `counter.battery_empty`\n
    \      - Updates `input_number.last_discharged_energy_from_bkw_battery`\n       -
    Resets discharged energy utility meter\n     - Adds small delays for stability.\n\n
    \ ---\n\n  ### \U0001F527 **Technical Specs**\n\n  - **Mode:** `queued` (max 15
    concurrent)\n  - **Devices Controlled:**\n    - `switch.bkw_outlet_1_bkw_outlet_1`\n
    \   - `switch.esp32_c3_zero_epever_manual_control_the_load`\n  - **Monitored Entities:**\n
    \   - PV power, PV array input power, battery voltage & SoC,\n      inverter state,
    outlet energy, device temperature.\n  - **Counters:** \n    - `counter.battery_full`\n
    \   - `counter.battery_empty`\n  - **Utility Meters:** \n    - Charged/discharged
    energy recalibrated nightly.\n\n  ---\n\n  ### ⚡ **Notes / Best Practices**\n\n
    \ - Battery must be explicitly marked full (`battery_full = on`) **and**\n    SoC
    ≥ 80% before daytime activation.\n  - Nighttime activation checks full battery
    state at sunset.\n  - Multiple `off day` triggers ensure reliability in varying
    solar output."
  triggers:
  - entity_id:
    - sensor.inverter_pv_power
    id: on day
    above: 2250
    trigger: numeric_state
  - entity_id:
    - sensor.esp32_c3_zero_epever_battery_voltage
    id: off night
    below: 23
    trigger: numeric_state
  - entity_id:
    - sensor.esp32_c3_zero_epever_pv_array_input_power
    below: 200
    id: off day
    trigger: numeric_state
  - entity_id:
    - sensor.esp32_c3_zero_epever_pv_array_input_power
    below: 175
    id: off day
    trigger: numeric_state
  - entity_id:
    - sensor.esp32_c3_zero_epever_pv_array_input_power
    below: 125
    id: off day
    trigger: numeric_state
  - entity_id:
    - sensor.esp32_c3_zero_epever_pv_array_input_power
    below: 75
    id: off day
    trigger: numeric_state
  - entity_id:
    - sensor.inverter_pv_power
    id: off day
    below: 2250
    trigger: numeric_state
  - entity_id:
    - sensor.inverter_pv_power
    id: off day
    below: 2000
    trigger: numeric_state
  - event: sunrise
    offset: +00:15:00
    id: off night
    trigger: sun
    enabled: true
  - event: sunset
    offset: -00:15:00
    id: on night
    trigger: sun
  - id: on day
    enabled: true
    trigger: time_pattern
    minutes: '*'
  - trigger: numeric_state
    entity_id:
    - sensor.bkw_outlet_1_energy_power
    below: 50
    id: off night
  conditions:
  - condition: or
    conditions:
    - condition: or
      conditions:
      - condition: state
        entity_id: input_boolean.battery_full
        state: 'on'
      - condition: or
        conditions:
        - condition: numeric_state
          entity_id: sensor.esp32_c3_zero_epever_battery_soc
          above: 95
        - condition: numeric_state
          entity_id: sensor.esp32_c3_zero_epever_battery_voltage
          above: 27.75
    - condition: and
      conditions:
      - condition: numeric_state
        entity_id: sensor.inverter_pv_power
        below: 2001
      - condition: state
        entity_id: switch.bkw_outlet_1_bkw_outlet_1
        state: 'on'
  actions:
  - alias: on day
    if:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - on day
      - condition: state
        entity_id: sensor.scb_inverter_state
        state: FeedIn
      - condition: state
        entity_id: input_boolean.battery_full
        state: 'on'
      - condition: numeric_state
        entity_id: sensor.esp32_c3_zero_epever_battery_soc
        above: 80
      - condition: numeric_state
        entity_id: sensor.inverter_pv_power
        above: 2000
      - condition: numeric_state
        entity_id: sensor.esp32_c3_zero_epever_device_temperature
        below: 44
    then:
    - metadata: {}
      data: {}
      target:
        entity_id:
        - switch.esp32_c3_zero_epever_manual_control_the_load
        - switch.bkw_outlet_1_bkw_outlet_1
      enabled: true
      action: switch.turn_on
  - alias: off day
    if:
    - condition: and
      conditions:
      - condition: sun
        before: sunset
        after: sunrise
        after_offset: -00:16:00
      - condition: trigger
        id:
        - off day
    then:
    - action: switch.turn_off
      metadata: {}
      data: {}
      target:
        entity_id: switch.bkw_outlet_1_bkw_outlet_1
  - alias: on night
    if:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - on night
      - condition: state
        entity_id: input_boolean.battery_full
        state: 'on'
    then:
    - metadata: {}
      data: {}
      target:
        entity_id:
        - switch.esp32_c3_zero_epever_manual_control_the_load
        - switch.bkw_outlet_1_bkw_outlet_1
      enabled: true
      action: switch.turn_on
    - metadata: {}
      data: {}
      target:
        entity_id: counter.battery_full
      action: counter.increment
    - action: utility_meter.calibrate
      metadata: {}
      data:
        value: '0.0'
      target:
        entity_id:
        - sensor.charged_energy_to_bkw_battery
        - sensor.discharged_energy_from_bkw_battery
    - wait_for_trigger:
      - trigger: numeric_state
        entity_id:
        - sensor.bkw_outlet_1_energy_power
        above: 10
      timeout:
        hours: 0
        minutes: 0
        seconds: 30
        milliseconds: 0
      continue_on_timeout: true
    - if:
      - condition: template
        value_template: '{{ not wait.completed }}'
      then:
      - action: notify.duncan
        data:
          message: ⚠️ The load did not rise above 10W within 1 minute after turning
            on at night.
          title: BKW Error
  - alias: off night
    if:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - off night
      - condition: numeric_state
        entity_id: sensor.bkw_outlet_1_energy_today
        above: 0.001
      - condition: time
        after: 00:00:00
        before: 09:00:00
    then:
    - alias: Repeat off cmd until OFF
      repeat:
        sequence:
        - action: switch.turn_off
          metadata: {}
          data: {}
          target:
            entity_id: switch.bkw_outlet_1_bkw_outlet_1
        - delay:
            hours: 0
            minutes: 0
            seconds: 5
            milliseconds: 0
        until:
        - condition: state
          entity_id: switch.bkw_outlet_1_bkw_outlet_1
          state: 'off'
    - metadata: {}
      data: {}
      target:
        entity_id: input_boolean.battery_full
      action: input_boolean.turn_off
    - if:
      - condition: numeric_state
        entity_id: sensor.discharged_energy_from_bkw_battery
        above: 0
      then:
      - metadata: {}
        data: {}
        target:
          entity_id: counter.battery_empty
        action: counter.increment
      - action: input_number.set_value
        metadata: {}
        data:
          value: '{{ states(''sensor.discharged_energy_from_bkw_battery'') | float(0)
            | round(2) }}

            '
        target:
          entity_id: input_number.last_discharged_energy_from_bkw_battery
      - delay:
          hours: 0
          minutes: 0
          seconds: 0
          milliseconds: 100
      - action: utility_meter.calibrate
        metadata: {}
        data:
          value: '0.0'
        target:
          entity_id: sensor.discharged_energy_from_bkw_battery
    - delay:
        hours: 0
        minutes: 0
        seconds: 5
        milliseconds: 0
  mode: queued
  max: 15
