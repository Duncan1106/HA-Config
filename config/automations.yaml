- id: '1754293444382'
  alias: Paludarium Pump & Fan Cycle (Daytime, Combined Zones)
  description: Runs left, Kallax, and right paludarium pumps in a 15-minute on/off
    cycle during daytime; on pump turn-off, starts a fan cooldown. Includes 1‑minute
    failsafe time pattern trigger and power strip availability checks.
  triggers:
  - minutes: /1
    trigger: time_pattern
  - trigger: state
    entity_id:
    - switch.desk_paludarium_links_l2
    - switch.desk_paludarium_turm_rechts_l1
    - switch.desk_paludarium_turm_links_l3
    to: 'off'
    for:
      hours: 0
      minutes: 15
      seconds: 0
  - trigger: state
    entity_id:
    - switch.desk_paludarium_links_l2
    - switch.desk_paludarium_turm_rechts_l1
    - switch.desk_paludarium_turm_links_l3
    to: 'on'
    for:
      hours: 0
      minutes: 15
      seconds: 0
  conditions:
  - condition: sun
    before: sunset
    after: sunrise
  actions:
  - variables:
      pump_on_duration: 00:14:55
      pump_off_duration: 00:14:55
      fan_duration: 00:02:30
      pump_left: switch.desk_paludarium_turm_links_l3
      fan_left: switch.desk_paludarium_turm_links_l1
      pump_kallax: switch.desk_paludarium_links_l2
      fan_kallax: switch.desk_paludarium_links_l3
      pump_right: switch.desk_paludarium_turm_rechts_l1
      fan_right: switch.desk_paludarium_turm_rechts_l2
  - choose:
    - alias: Left Zone Control
      conditions:
      - condition: state
        entity_id: switch.schreibtisch_links_power_strip_l1
        state: 'on'
      - condition: or
        conditions:
        - condition: state
          entity_id: switch.desk_paludarium_turm_links_l3
          state: 'on'
          for: '{{ pump_on_duration }}'
        - condition: state
          entity_id: switch.desk_paludarium_turm_links_l3
          state: 'off'
          for: '{{ pump_off_duration }}'
      sequence:
      - choose:
        - alias: Left Pump ON duration elapsed - Turn pump OFF and start fan cooldown
          conditions:
          - condition: state
            entity_id: switch.desk_paludarium_turm_links_l3
            state: 'on'
            for: '{{ pump_on_duration }}'
          sequence:
          - action: switch.turn_off
            data: {}
            target:
              entity_id: '{{ pump_left }}'
          - data:
              fan_entity: '{{ fan_left }}'
              duration: '{{ fan_duration }}'
            action: script.run_fan_for_duration
        - alias: Left Pump OFF duration elapsed - Turn pump ON
          conditions:
          - condition: state
            entity_id: switch.desk_paludarium_turm_links_l3
            state: 'off'
            for: '{{ pump_off_duration }}'
          sequence:
          - action: switch.turn_on
            data: {}
            target:
              entity_id: '{{ pump_left }}'
    - alias: Kallax Zone Control
      conditions:
      - condition: state
        entity_id: switch.terrarium_tasmota4
        state: 'on'
      - condition: or
        conditions:
        - condition: state
          entity_id: switch.desk_paludarium_links_l2
          state: 'on'
          for: '{{ pump_on_duration }}'
        - condition: state
          entity_id: switch.desk_paludarium_links_l2
          state: 'off'
          for: '{{ pump_off_duration }}'
      sequence:
      - choose:
        - alias: Kallax Pump ON duration elapsed - Turn pump OFF and start fan cooldown
          conditions:
          - condition: state
            entity_id: switch.desk_paludarium_links_l2
            state: 'on'
            for: '{{ pump_on_duration }}'
          sequence:
          - target:
              entity_id: '{{ pump_kallax }}'
            action: switch.turn_off
            data: {}
          - data:
              fan_entity: '{{ fan_kallax }}'
              duration: '{{ fan_duration }}'
            action: script.run_fan_for_duration
        - alias: Kallax Pump OFF duration elapsed - Turn pump ON
          conditions:
          - condition: state
            entity_id: switch.desk_paludarium_links_l2
            state: 'off'
            for: '{{ pump_off_duration }}'
          sequence:
          - target:
              entity_id: '{{ pump_kallax }}'
            action: switch.turn_on
            data: {}
    - alias: Right Zone Control
      conditions:
      - condition: state
        entity_id: switch.schreibtisch_rechts_power_strip_l5
        state: 'on'
      - condition: or
        conditions:
        - condition: state
          entity_id: switch.desk_paludarium_turm_rechts_l1
          state: 'on'
          for: '{{ pump_on_duration }}'
        - condition: state
          entity_id: switch.desk_paludarium_turm_rechts_l1
          state: 'off'
          for: '{{ pump_off_duration }}'
      sequence:
      - choose:
        - alias: Right Pump ON duration elapsed - Turn pump OFF and start fan cooldown
          conditions:
          - condition: state
            entity_id: switch.desk_paludarium_turm_rechts_l1
            state: 'on'
            for: '{{ pump_on_duration }}'
          sequence:
          - target:
              entity_id: '{{ pump_right }}'
            action: switch.turn_off
            data: {}
          - data:
              fan_entity: '{{ fan_right }}'
              duration: '{{ fan_duration }}'
            action: script.run_fan_for_duration
        - alias: Right Pump OFF duration elapsed - Turn pump ON
          conditions:
          - condition: state
            entity_id: switch.desk_paludarium_turm_rechts_l1
            state: 'off'
            for: '{{ pump_off_duration }}'
          sequence:
          - target:
              entity_id: '{{ pump_right }}'
            action: switch.turn_on
            data: {}
  mode: parallel
  max: 10
