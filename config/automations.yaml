- id: '1721219665412'
  alias: Pool Pulsetime Auto Adjust
  description: ''
  triggers:
  - entity_id:
    - input_number.pulsetimeactualvalue
    from:
    to:
    trigger: state
  conditions:
  - condition: device
    type: is_on
    device_id: 7f4653a91cd2ef69cb48aa494a983be8
    entity_id: 3d65e9bcde794b0149fb7d576edd1bb9
    domain: switch
  actions:
  - if:
    - condition: template
      value_template: "{{ \n  (trigger.to_state.state | int(0)) > (trigger.from_state.state
        | int(0)) \n    and \n  ((trigger.from_state.state|int() != 0)\n    or\n  (trigger.to_state.state|int()
        > 1000 ))\n}}"
    then:
    - type: turn_off
      device_id: 7f4653a91cd2ef69cb48aa494a983be8
      entity_id: 3d65e9bcde794b0149fb7d576edd1bb9
      domain: switch
    - delay:
        hours: 0
        minutes: 0
        seconds: 5
        milliseconds: 0
    - metadata: {}
      data:
        topic: cmnd/tasmota_837238/pulsetime1
        payload: '{{ trigger.from_state.state | int(0) }}'
      action: mqtt.publish
    - delay:
        hours: 0
        minutes: 0
        seconds: 5
        milliseconds: 0
    - type: turn_on
      device_id: 7f4653a91cd2ef69cb48aa494a983be8
      entity_id: 3d65e9bcde794b0149fb7d576edd1bb9
      domain: switch
  - if:
    - condition: and
      conditions:
      - condition: template
        value_template: '{{ (trigger.to_state.state | int(0)) == 0 }}'
      - condition: template
        value_template: '{{ (trigger.from_state.state | int(0)) == 0 }}'
    then:
    - type: turn_off
      device_id: 7f4653a91cd2ef69cb48aa494a983be8
      entity_id: 3d65e9bcde794b0149fb7d576edd1bb9
      domain: switch
  mode: single
