- id: '1753221152708'
  alias: Restart Frigate at 1 o'clock
  description: "## \U0001F504 Frigate Daily Restart Automation\n\n### \U0001F4CB Purpose\nThis
    automation ensures that the Frigate add-on is either started or restarted every
    day at **01:00 AM** depending on its current state. This guarantees that Frigate
    is running properly and prevents issues from prolonged uptime or unexpected crashes.\n\n---\n\n###
    ⏱ Trigger\n- Daily at `01:00:00`.\n\n---\n\n### ✅ Conditions\n- No additional
    conditions; the automation handles both \"not running\" and \"already running\"
    states.\n\n---\n\n### \U0001F3AF Actions / Workflow\n1. **Check if Frigate is
    running** using `binary_sensor.frigate_full_access_aktiv`.\n2. **If Frigate is
    not running** (sensor `off`):\n   - Start the Frigate add-on.\n3. **If Frigate
    is running** (sensor `on`):\n   - Restart the Frigate add-on to refresh its service.\n\n---\n\n###
    \U0001F527 Technical Notes\n- Mode: `single` prevents overlapping execution.\n-
    Uses `choose` statements to differentiate between the add-on states and act accordingly."
  triggers:
  - trigger: time
    at: 01:00:00
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: binary_sensor.frigate_full_access_aktiv
        state: 'off'
      sequence:
      - action: hassio.addon_start
        metadata: {}
        data:
          addon: ccab4aaf_frigate-fa
      alias: Start Frigate if not running
    - conditions:
      - condition: state
        entity_id: binary_sensor.frigate_full_access_aktiv
        state: 'on'
      sequence:
      - action: hassio.addon_restart
        metadata: {}
        data:
          addon: ccab4aaf_frigate-fa
      alias: Restart Frigate if running
  mode: single
- id: '1753267693777'
