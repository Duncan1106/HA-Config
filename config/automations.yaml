- id: '1757273749465'
  alias: Garage Oven Vacuum Power Control
  description: "# ⚡ **Garage Oven Vacuum Power Control**\n\n### \U0001F4CB Intelligent
    Power Management System Control\n\nThis automation manages the operational state
    of high-drain or specialized garage appliances, specifically the **Garage Door**,
    **Vacuum**, and **Oven**. It is designed to optimize energy usage by enforcing
    a nighttime \"deep sleep\" period while ensuring devices are ready for use during
    the day.\n\n**Operational Strategy:**\n* **Status-Aware Execution:** Logic branches
    based on whether the home is in **Daily** or **Vacation** mode.\n* **Persistence
    & Reliability:** Instead of single commands, this system utilizes a `retry_action_with_backoff`
    script. This ensures that even if a device is momentarily unavailable (common
    with Tasmota/Wi-Fi devices), the system will attempt to reach the target state
    up to **10 times** with escalating delays.\n* **Startup Recovery:** Includes a
    synchronization phase after Home Assistant restarts to ensure entities are fully
    initialized before commands are dispatched.\n\n---\n\n### Trigger Overview Table\n\n|
    Type | Entity / Condition | ID | Purpose |\n| :--- | :--- | :--- | :--- |\n| **Time**
    | 23:00:00 | 23 | Initiates nighttime power-down sequence. |\n| **Time** | 04:00:00
    | 4 | Initiates early morning power-up sequence. |\n| **Home Assistant** | Start
    | Start | Ensures device states are corrected after a system reboot. |\n\n---\n\n###
    Operational Logic Sections\n\n#### \U0001F319 Nighttime Shutdown (Daily Mode)\n*
    **Purpose:** Conserve energy by disabling devices during late-night hours.\n*
    **Logic Overview:** Triggered at **23:00** or **Startup** (if between 23:00 and
    04:00), provided `input_select.smart_home_status` is set to **Daily**.\n* **Effect:**
    Sets **switch.garagentor_tasmota**, **switch.sauger_tasmota**, and **switch.backofen_tasmota**
    to **off** using a simple backoff retry logic.\n\n#### ☀️ Daytime Activation (Daily
    Mode)\n* **Purpose:** Restore power to garage appliances for daily use.\n* **Logic
    Overview:** Triggered at **04:00** or **Startup** (if between 04:00 and 22:59),
    provided the status is **Daily**.\n* **Effect:** Restores power (**on**) to all
    three Tasmota switches. If triggered by a system start, the automation waits up
    to 1 minute for entities to report a valid state before proceeding.\n\n#### ✈️
    Vacation Mode\n* **Purpose:** Maximum safety and energy savings during extended
    absence.\n* **Logic Overview:** Evaluated whenever the automation triggers if
    `input_select.smart_home_status` is set to **Vacation**.\n* **Effect:** Immediately
    forces **switch.garagentor_tasmota** and **switch.sauger_tasmota** to **off**.\n\n---\n\n###
    Technical Overview\n\n* **Automation Mode:** `queued` (Max: 3) - Ensures sequential
    processing of state changes if multiple triggers occur rapidly.\n* **Execution
    Method:** External script `script.retry_action_with_backoff` for robust command
    delivery.\n* **Key Inputs:** `input_select.smart_home_status`\n* **Controlled
    Entities:** * **switch.garagentor_tasmota**\n    * **switch.sauger_tasmota**\n
    \   * **switch.backofen_tasmota**\n* **Safety Mechanisms:** * **Linear Backoff:**
    Used during power-on to prevent electrical inrush/network congestion.\n    * **Notification:**
    Failure to reach the target state after 10 retries triggers a notification to
    **notify.duncan**.\n    * **Availability Wait:** Uses a template to verify entities
    are not `unavailable` or `unknown` before executing post-restart actions.\n\n---\n\n###
    \U0001F4A1 Notes\n* **Reliability:** The use of `continue_on_error: true` combined
    with the retry script prevents one unresponsive device from blocking the entire
    sequence.\n* **Start-up Logic:** The \"Wait for entities\" template is a critical
    fail-safe that prevents the automation from firing commands into a \"void\" while
    Tasmota devices are still reconnecting to the Wi-Fi after a power cycle or reboot.\n"
  triggers:
  - trigger: time
    at: '23:00:00'
    id: 'Off'
  - trigger: time
    at: 04:00:00
    id: 'On'
  - trigger: homeassistant
    event: start
    id: Start
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - 'Off'
        - 'On'
      - condition: state
        entity_id: input_select.smart_home_status
        state: Daily
      sequence:
      - if:
        - condition: time
          after: '22:59:00'
          before: 03:59:00
        then:
        - action: script.retry_action_with_backoff
          continue_on_error: true
          metadata: {}
          data:
            action_domain: switch
            action_type: turn_off
            max_retries: 10
            base_delay: 5
            max_delay: 60
            backoff_type: simple
            notify_on_failure: true
            notify_service: notify.duncan
            entity_id: switch.garagentor_tasmota
            target_state: 'off'
          enabled: false
        - action: script.retry_action_with_backoff
          continue_on_error: true
          metadata: {}
          data:
            action_domain: switch
            action_type: turn_off
            max_retries: 10
            base_delay: 5
            max_delay: 60
            backoff_type: simple
            notify_on_failure: true
            notify_service: notify.duncan
            entity_id: switch.sauger_tasmota
            target_state: 'off'
        - action: script.retry_action_with_backoff
          continue_on_error: true
          metadata: {}
          data:
            action_domain: switch
            action_type: turn_off
            max_retries: 10
            base_delay: 5
            max_delay: 60
            backoff_type: simple
            notify_on_failure: true
            notify_service: notify.duncan
            entity_id: switch.backofen_tasmota
            target_state: 'off'
        else:
        - action: script.retry_action_with_backoff
          continue_on_error: true
          metadata: {}
          data:
            action_domain: switch
            action_type: turn_on
            max_retries: 10
            base_delay: 5
            max_delay: 60
            backoff_type: linear
            notify_on_failure: true
            notify_service: notify.duncan
            entity_id: switch.garagentor_tasmota
            target_state: 'on'
          enabled: false
        - action: script.retry_action_with_backoff
          continue_on_error: true
          metadata: {}
          data:
            action_domain: switch
            action_type: turn_on
            max_retries: 10
            base_delay: 5
            max_delay: 60
            backoff_type: linear
            notify_on_failure: true
            notify_service: notify.duncan
            entity_id: switch.sauger_tasmota
            target_state: 'on'
        - action: script.retry_action_with_backoff
          continue_on_error: true
          metadata: {}
          data:
            action_domain: switch
            action_type: turn_on
            max_retries: 10
            base_delay: 5
            max_delay: 60
            backoff_type: linear
            notify_on_failure: true
            notify_service: notify.duncan
            entity_id: switch.backofen_tasmota
            target_state: 'on'
      alias: Daily on or off
    - conditions:
      - condition: trigger
        id:
        - Start
      sequence:
      - wait_for_trigger:
        - trigger: template
          value_template: "        {% set entities = expand(\n          'switch.garagentor_tasmota',\n
            \         'switch.sauger_tasmota',\n          'switch.backofen_tasmota'\n
            \       ) %}\n        {{ (entities | selectattr('state','in',['on','off'])
            | list | length) == (entities | length) }}"
          for:
            hours: 0
            minutes: 1
            seconds: 0
        continue_on_timeout: true
        timeout:
          hours: 0
          minutes: 5
          seconds: 0
          milliseconds: 0
      - if:
        - condition: time
          after: '22:59:00'
          before: 03:59:00
        then:
        - action: script.retry_action_with_backoff
          continue_on_error: true
          metadata: {}
          data:
            action_domain: switch
            action_type: turn_off
            max_retries: 10
            base_delay: 5
            max_delay: 60
            backoff_type: simple
            notify_on_failure: true
            notify_service: notify.duncan
            entity_id: switch.garagentor_tasmota
            target_state: 'off'
          enabled: false
        - action: script.retry_action_with_backoff
          continue_on_error: true
          metadata: {}
          data:
            action_domain: switch
            action_type: turn_off
            max_retries: 10
            base_delay: 5
            max_delay: 60
            backoff_type: simple
            notify_on_failure: true
            notify_service: notify.duncan
            entity_id: switch.sauger_tasmota
            target_state: 'off'
        - action: script.retry_action_with_backoff
          continue_on_error: true
          metadata: {}
          data:
            action_domain: switch
            action_type: turn_off
            max_retries: 10
            base_delay: 5
            max_delay: 60
            backoff_type: simple
            notify_on_failure: true
            notify_service: notify.duncan
            entity_id: switch.backofen_tasmota
            target_state: 'off'
        else:
        - action: script.retry_action_with_backoff
          continue_on_error: true
          metadata: {}
          data:
            action_domain: switch
            action_type: turn_on
            max_retries: 10
            base_delay: 5
            max_delay: 60
            backoff_type: linear
            notify_on_failure: true
            notify_service: notify.duncan
            entity_id: switch.garagentor_tasmota
            target_state: 'on'
          enabled: false
        - action: script.retry_action_with_backoff
          continue_on_error: true
          metadata: {}
          data:
            action_domain: switch
            action_type: turn_on
            max_retries: 10
            base_delay: 5
            max_delay: 60
            backoff_type: linear
            notify_on_failure: true
            notify_service: notify.duncan
            entity_id: switch.sauger_tasmota
            target_state: 'on'
        - action: script.retry_action_with_backoff
          continue_on_error: true
          metadata: {}
          data:
            action_domain: switch
            action_type: turn_on
            max_retries: 10
            base_delay: 5
            max_delay: 60
            backoff_type: linear
            notify_on_failure: true
            notify_service: notify.duncan
            entity_id: switch.backofen_tasmota
            target_state: 'on'
    - conditions:
      - condition: state
        entity_id: input_select.smart_home_status
        state: Vacation
      sequence:
      - action: script.retry_action_with_backoff
        continue_on_error: true
        metadata: {}
        data:
          action_domain: switch
          action_type: turn_off
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: linear
          notify_on_failure: true
          notify_service: notify.duncan
          entity_id: switch.garagentor_tasmota
          target_state: 'off'
      - action: script.retry_action_with_backoff
        continue_on_error: true
        metadata: {}
        data:
          action_domain: switch
          action_type: turn_off
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: linear
          notify_on_failure: true
          notify_service: notify.duncan
          entity_id: switch.sauger_tasmota
          target_state: 'off'
      alias: Vacation Power off all the way
  mode: queued
  max: 3
- id: '1757687903185'
  alias: Heizraum Zuluft Steuerung
  description: "## \U0001F32C Heizraum Zuluft Steuerung Automation\n### \U0001F4CB
    **Purpose**\n\nDiese Automation steuert den Zuluft-Lüfter (`switch.heizraum_lufter_zuluft`)
    basierend auf dem **binary_sensor `heizraum_zuluft_trigger`**, Sperrzeit, Retry-Script
    und optionalem Nachtmodus.  \nZiel ist es, den Lüfter nur bei Bedarf laufen zu
    lassen, um **Energie zu sparen** und **unnötigen Verschleiß** zu vermeiden.  \n\n---\n\n###
    ⏰ **Triggers**\n\n| Trigger Type | Entity / Event | Beschreibung |\n|--------------|----------------|--------------|\n|
    State | `binary_sensor.heizraum_zuluft_trigger` | Prüft Änderungen am Zuluft-Bedarf
    |\n| Home Assistant Start | n/a | Prüft beim Systemstart |\n| Time Pattern | alle
    30 Minuten | Periodische Prüfung, um verpasste Änderungen zu erkennen |\n\n---\n\n###
    ✅ **Conditions**\n\n1. **Sensor-Verfügbarkeit**  \n   - Der Sensor darf nicht
    `unknown` oder `unavailable` sein.  \n\n2. **Sperrzeit**  \n   - Mindestens **5 Minuten**
    seit letztem Trigger, um schnelle Schaltvorgänge zu verhindern.  \n\n3. **Nachtmodus
    / Außentemperatur**  \n   - Optional: Zuluft nur aktiv, wenn Uhrzeit zwischen
    6 – 22 Uhr oder Außentemperatur über 10 °C.  \n\n---\n\n### \U0001F3AF **Actions
    / Workflow**\n\n1. **Zuluft nötig (`on`)**  \n   - Prüft, ob der Sensor `on` meldet.
    \ \n   - Ruft das **Retry-Script** auf, um den Lüfter einzuschalten.  \n   - Wiederholt
    bis zu **10 mal**, mit **Base Delay 5 Sekunden**, bis der Lüfter eingeschaltet
    ist.  \n   - Benachrichtigung über `notify.duncan` bei Fehlschlägen.  \n\n2. **Zuluft
    nicht nötig (`off`)**  \n   - Prüft, ob der Sensor `off` meldet.  \n   - Ruft
    das **Retry-Script** auf, um den Lüfter auszuschalten.  \n   - Wiederholt bis
    zu **10 mal**, mit **Base Delay 5 Sekunden**, bis der Lüfter ausgeschaltet ist.
    \ \n   - Benachrichtigung über `notify.duncan` bei Fehlschlägen.  \n\n---\n\n###
    \U0001F527 **Technical Specs**\n\n- **Mode:** `single` (Verhindert parallele Aktionen)
    \ \n- **Target Switch:** `switch.heizraum_lufter_zuluft`  \n- **Retry Script:**
    `script.retry_action_with_backoff`  \n- **Retry Parameters:**  \n  - Max Retries:
    10  \n  - Base Delay: 5 Sekunden  \n  - Max Delay: 60 Sekunden  \n  - Backoff
    Type: Simple  \n  - Notify on Failure: True  \n  - Notify Service: `notify.duncan`
    \ \n\n---\n\n### ⚡ **Notes / Best Practices**\n\n- State-Trigger auf dem Sensor
    + Time Pattern Trigger decken **alle Änderungen zuverlässig** ab.  \n- Sperrzeit
    verhindert zu häufiges Schalten bei kleinen Schwankungen.  \n- Retry-Script sorgt
    für **zuverlässiges Ein-/Ausschalten**, selbst bei transienten Fehlern.  \n- Nachtmodus
    / Außentemperatur schützt vor unnötigem Lüften im Winter."
  triggers:
  - entity_id:
    - binary_sensor.heizraum_zuluft_trigger
    trigger: state
    to:
    - 'on'
    - 'off'
  - event: start
    trigger: homeassistant
  - minutes: /30
    trigger: time_pattern
  conditions:
  - condition: template
    value_template: '{{ states(''binary_sensor.heizraum_zuluft_trigger'') not in [''unknown'',''unavailable'']
      }}

      '
  - condition: template
    value_template: "{{ now() - (state_attr(this.entity_id, 'last_triggered')\n            |
      default(as_datetime('1970-01-01T00:00:00'), true)) > timedelta(minutes=5) }}\n"
  - condition: template
    value_template: "{% set hour = now().hour %} \n{% set outdoor = states('sensor.gw1100a_outdoor_temperature')
      | float(0) %}\n{{ (6 <= hour < 22) or (outdoor > 10) }}\n"
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: binary_sensor.heizraum_zuluft_trigger
        state: 'on'
      sequence:
      - data:
          entity_id: switch.heizraum_lufter_zuluft
          target_state: 'on'
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: simple
          notify_on_failure: true
          notify_service: notify.duncan
          action_domain: switch
          action_type: turn_on
        action: script.retry_action_with_backoff
    - conditions:
      - condition: state
        entity_id: binary_sensor.heizraum_zuluft_trigger
        state: 'off'
      sequence:
      - data:
          entity_id: switch.heizraum_lufter_zuluft
          target_state: 'off'
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: simple
          notify_on_failure: true
          notify_service: notify.duncan
          action_type: turn_off
          action_domain: switch
        action: script.retry_action_with_backoff
  mode: single
- id: '1758358981299'
  alias: Wasserenthärtung – Salz Erinnerung mit Bestätigung
  description: Erinnert bei niedrigem Salz und zum Klopfen.
  triggers:
  - entity_id: sensor.wasserenthartung
    id: usage_change
    not_from:
    - unknown
    - unavailable
    not_to:
    - unknown
    - unavailable
    trigger: state
  - entity_id: input_boolean.salz_nachgefullt
    from: 'on'
    to: 'off'
    id: confirm_reset
    trigger: state
  conditions:
  - condition: template
    value_template: '{{ trigger.id == ''confirm_reset'' or crossed_10 or refill_needed
      }}'
  actions:
  - if:
    - condition: trigger
      id:
      - usage_change
    then:
    - if:
      - condition: template
        value_template: '{{ refill_needed }}'
      then:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.salz_nachgefullt
    - action: notify.admin
      data:
        title: "{% if crossed_10 and refill_needed %}\n  \U0001F4A7\U0001F528 Wasserenthärtung:
          Salz & Klopfen fällig\n{% elif refill_needed %}\n  \U0001F4A7 Erinnerung:
          Salz nachfüllen\n{% else %}\n  \U0001F528 Zeit zum Klopfen!\n{% endif %}"
        message: 'Der Wasserzähler steht jetzt auf {{ new }} m³. {% if refill_needed
          %}

          Bitte Salz nachfüllen und danach den Schalter ''Salz nachgefüllt'' ausschalten.
          {% endif %} {% if crossed_10 %}

          Bitte kurz gegen den Enthärtungsbehälter klopfen, um Salzbrücken zu lösen.
          {% endif %}'
        data:
          tag: wasserenthaertung_info
    alias: 'Usage '
  - if:
    - condition: trigger
      id: confirm_reset
    then:
    - action: utility_meter.calibrate
      target:
        entity_id: sensor.wasserenthartung
      data:
        value: '0'
    - action: notify.admin
      data:
        message: clear_notification
        data:
          tag: wasserenthaertung_info
    alias: Reset
  variables:
    is_usage: '{{ trigger.id == ''usage_change'' }}'
    old: '{{ trigger.from_state.state | float(none) if is_usage else none }}'
    new: '{{ trigger.to_state.state | float(none) if is_usage else none }}'
    crossed_10: '{{ is_usage and old is not none and new is not none and (new // 10)
      > (old // 10) and is_state(''input_boolean.salz_nachgefullt'', ''off'') }}'
    refill_needed: '{{ is_usage and new is not none and new > 52 and (now() - (this.attributes.last_triggered
      | default(as_datetime(0), true)) > timedelta(days=1)) }}'
  mode: single
- id: '1759414302396'
  alias: Daily Agenda
  description: "  ## \U0001F4C5 Daily Agenda  \n\n  ### \U0001F4CB **Personalized
    Daily Briefing**  \n\n  This automation generates a daily summary for a smartphone,
    combining weather\n  forecasts and calendar events, processed through an AI. The
    message is\n  concise, in German, and personalized per individual or event when\n
    \ applicable. If AI processing fails, a fallback message lists existing\n  calendar
    events only.\n\n  ---\n\n  ### ⏰ **Triggers**  \n\n  | Time | Event |\n  |------|-------|\n
    \ | `08:00:00` | Daily scheduled briefing |\n\n  ---\n\n  ### ✅ **Conditions**
    \ \n\n  - No additional conditions; the automation runs daily at 08:00.  \n\n
    \ ---\n\n  ### \U0001F3AF **Workflow / Logic**  \n\n  1. **Fetch Calendar Events**
    \ \n     - Supports up to three calendars:  \n       - `calendar.familie`\n       -
    `calendar.apps_by_abfall`\n     - Fetched in a loop for efficiency, with events
    for a **duration of 16 hours**.  \n     - If a calendar has no upcoming events,
    it is simply skipped in the fallback notification.\n\n  2. **Fetch Weather Forecast**
    \ \n     - Uses `weather.forecast_home` for hourly forecasts.  \n     - Includes
    condition, temperature, precipitation, UV index, wind speed, and optional daily
    summary.\n\n  3. **Prepare AI Prompt**  \n     - Combines calendar events and
    weather data into a concise prompt.  \n     - Instructions to AI:  \n       -
    Provide short, precise messages without Home Assistant internal details.  \n       -
    Highlight unusual or notable events or weather.  \n       - Include recommendations
    if weather or temperature requires action (e.g., coat, umbrella).  \n       -
    Format per individual if events concern multiple people.  \n       - Output in
    **German**, in a precise, efficient style.\n\n  4. **AI Processing**  \n     -
    Uses `conversation.google_generative_ai` to generate the notification text.  \n
    \    - Retries up to 10 times if the response contains failure phrases like:  \n
    \      - `\"Unable to get response\"`  \n       - `\"Sorry, I had a problem getting
    a response from Google Generative AI.\"`  \n     - Small 5-second delay between
    retries.\n\n  5. **Send Notification**  \n     - On success: sends AI-generated
    message to `notify.duncan`.  \n     - On repeated failure: sends a fallback message
    with only existing calendar events, omitting calendars without upcoming events.\n\n
    \ ---\n\n  ### \U0001F527 **Technical Specs**  \n\n  - **Calendars Used:** \n
    \   - `calendar.familie`  \n    - `calendar.apps_by_abfall`  \n\n  - **Weather
    Entity:** `weather.forecast_home`  \n\n  - **AI Agent:** `conversation.google_generative_ai`
    \ \n\n  - **Target Notification:** `notify.duncan`  \n\n  - **Mode:** `single`
    \ \n\n  - **Retries:** Up to 10 attempts for AI response  \n\n  - **Delay Between
    Retries:** 5 seconds  \n\n  ---\n\n  ### ⚡ **Notes / Best Practices**  \n\n  -
    The prompt instructs the AI to avoid generic or trivial information.  \n\n  -
    Fallback notifications only display events if calendars have events; empty calendars
    are skipped.  \n\n  - Messages are tailored per individual if calendar events
    indicate multiple people.  \n\n  - Weather summary emphasizes unusual conditions
    or important recommendations.  \n\n  - The automation can be expanded to include
    more calendars or different notification channels if desired.\n"
  triggers:
  - at: 08:00:00
    trigger: time
  actions:
  - variables:
      title: '{% set weekdays = {''Monday'':''Montag'',''Tuesday'':''Dienstag'',''Wednesday'':''Mittwoch'',''Thursday'':''Donnerstag'',''Friday'':''Freitag'',''Saturday'':''Samstag'',''Sunday'':''Sonntag''}
        %} {{ weekdays[now().strftime(''%A'')] }} Agenda und Wetter'
      weather_entity: weather.forecast_home
      calendars:
      - entity: calendar.familie
      - entity: calendar.apps_by_abfall
      calendar_duration:
        hours: 16
        minutes: 0
        seconds: 0
      agendas: {}
      prompt: "Please generate text for a notification that will be sent to the users
        smartphone with helpful information. keep it simple and short but precise.
        simply provide the notification and nothing else! don't use any Benachrichtigung
        or something like that just the message! if you like you can format it to
        make it more readable \n\n- Your answers are not technical, and do not include
        Home Assistant internal details such as entities in responses.\n- Your messages
        help the user prepare for their day\n  - use the event name to refer to single
        persons, provide individual recommendations for each person and seperate them
        if needed per person.\n  - Making note of unusual weather for the location
        and time of year (but not mundane details like \"0% chance of precipitation\")
        also make sure to only tell the condition and temperature and maybe what I
        should bring when I go outside if the condition or temperature makes it needed.
        don't tell me to got for a walk or something like that \n  - Anything that
        may be special or unique, such as celebrating a birthday\nProvide your answer
        in German and make it precise and efficient as a German would like it. Bitte
        Duzen nicht Siezen"
  - alias: Fetch Calendar Events
    repeat:
      for_each: '{{ calendars }}'
      sequence:
      - action: calendar.get_events
        target:
          entity_id: '{{ repeat.item.entity }}'
        data:
          duration: '{{ calendar_duration }}'
        response_variable: fetched
      - variables:
          agendas: '{% set fetched_events = fetched[repeat.item.entity][''events'']
            %} {{ dict(agendas, **{ repeat.item.entity: fetched_events }) }}            '
  - alias: Fetch Weather Forecast
    action: weather.get_forecasts
    data:
      type: hourly
    target:
      entity_id: '{{ weather_entity }}'
    response_variable: daily_forecast
  - variables:
      forecast_entity: "{% if daily_forecast is defined and weather_entity in daily_forecast
        %}\n  {{ daily_forecast[weather_entity] }}\n{% else %}\n  none\n{% endif %}"
      forecast: "{% if forecast_entity is defined and forecast_entity.forecast is
        defined and forecast_entity.forecast | length > 0 %}\n  {{ forecast_entity.forecast[0]
        }}\n{% else %}\n  none\n{% endif %}"
      calendar_prompt: "Time: {{ now().strftime(\"%A %B %d %H:%M %p\") }}  {%- if
        weather_entity is defined %}         \n  {%- set temperature_unit = state_attr(weather_entity,
        'temperature_unit') -%} \n  {%- if forecast is defined %}\n    Current Weather:
        {{ forecast.condition if forecast.condition is defined else 'N/A' }}\n    (Temperature:
        {{ forecast.temperature if forecast.temperature is defined else 'N/A' }}{{
        temperature_unit if temperature_unit is defined else '' }},\n    Precipitation:
        {{ forecast.precipitation if forecast.precipitation is defined else 'N/A'
        }}%,\n    UV Index: {{ forecast.uv_index if forecast.uv_index is defined else
        'N/A' }},\n    Wind Speed: {{ forecast.wind_speed if forecast.wind_speed is
        defined else 'N/A' }},\n    Temp Low: {{ forecast.templow if forecast.templow
        is defined else 'N/A' }})\n  {%- else %}\n    Wetterdaten nicht verfügbar.\n
        \ {%- endif %}\n  Todays Overall Weather: {{ states(weather_entity) if states(weather_entity)
        not in ['unknown', 'unavailable'] else 'N/A' }}\n{%- endif %}   {%- for cal
        in calendars %}\n  Calendar \"{{ state_attr(cal.entity, 'friendly_name') or
        cal.entity.split('.')[-1] }}\" events for the next {{ calendar_duration.hours
        }} hours:\n  {% set agenda = agendas[cal.entity] if cal.entity in agendas
        else [] %}\n  {% if agenda | length > 0 %}\n    {%- for event in agenda %}\n
        \     - Summary: {{ event.summary if event.summary is defined else 'Unbenannt'
        }}\n        Start-End: {% if event.start is defined %}{{ event.start }} to
        {{ event.end if event.end is defined else 'N/A' }}{% else %}All Day{% endif
        %}\n        {%- if event.description is defined and event.description | trim
        != '' %}\n          Description: {{ event.description }}\n        {%- endif
        %}\n        {%- if event.location is defined and event.location | trim !=
        '' %}\n          Location: {{ event.location }}\n        {%- endif %}\n    {%-
        endfor %}\n  {% else %}\n    - No upcoming events (Daten nicht verfügbar).\n
        \ {% endif %}\n{%- endfor %}"
  - repeat:
      sequence:
      - alias: Conversation Agent Notification Text
        data:
          text: '{{ calendar_prompt | string }}


            {{ prompt }}'
          agent_id: '{{ states(''input_select.conversation_agents'')}}'
        response_variable: agent_gemini
        action: conversation.process
      - delay:
          hours: 0
          minutes: 0
          seconds: 5
          milliseconds: 0
      until:
      - condition: template
        value_template: "{% set bad_phrases = [\n    \"Unable to get response\",\n
          \   \"Sorry, I had a problem getting a response\",\n    \"Error talking
          to API\"\n] %}\n{{ (bad_phrases | select('in', agent_gemini.response.speech.plain.speech)
          | list | count == 0)\n   or repeat.index >= 10 }}"
  - choose:
    - conditions:
      - condition: template
        value_template: "{% set bad_phrases = [\n  \"Unable to get response\",\n  \"Sorry,
          I had a problem getting a response\",\n  \"Error talking to API\"\n] %}\n{{
          (bad_phrases | select('in', agent_gemini.response.speech.plain.speech) |
          list | count) > 0 }}"
      sequence:
      - variables:
          fallback_text: "{%- for cal in calendars -%}\n  {%- set agenda = agendas[cal.entity]
            if cal.entity in agendas else [] -%}\n  {%- if agenda | length > 0 -%}\n
            \   {{ state_attr(cal.entity, 'friendly_name') or cal.entity.split('.')[-1]
            }} events:\n    {%- for event in agenda -%}\n      - {{ event.summary
            if event.summary is defined else 'Unbenannt' }} (Start: {% if event.start
            is defined %}{{ event.start }} to {{ event.end if event.end is defined
            else 'N/A' }}{% else %}All Day{% endif %}{%- if event.description is defined
            and event.description | trim != '' %}, Desc: {{ event.description }}{%
            endif %}{%- if event.location is defined and event.location | trim !=
            '' %}, Loc: {{ event.location }}{% endif %})\n    {%- endfor -%}\n  {%-
            endif -%}\n{%- endfor -%}"
      - action: notify.duncan
        metadata: {}
        data:
          title: '{{ title }}'
          message: 'Heute konnte leider keine Nachricht generiert werden.

            Events: {{ fallback_text }}

            '
          data:
            tag: agenda_failure
    default:
    - alias: Send notification
      data:
        title: '{{ title }}'
        message: '{{ agent_gemini.response.speech.plain.speech }}'
        data:
          tag: agenda
      action: notify.duncan
  mode: single
- id: '1760873847404'
  alias: Auto Waschmaschine Fertig
  description: " ## \U0001F9FA Auto Waschmaschine Fertig\n\n  ### ⚙️ **Purpose**  \n\n
    \ This automation automatically switches **on** the\n  `input_boolean.waschmaschine_fertig`
    when the washing machine has **finished\n  its cycle**.  \n\n  It determines this
    by analyzing the washing machine’s **power usage pattern**\n  over the **past
    20 minutes** — when the runtime value drops below a threshold,\n  the machine
    is considered done.  \n\n  ---\n\n  ### \U0001F9E9 **How It Works**  \n\n  1.
    **Runtime Tracking**  \n     - The sensor `sensor.waschmaschine_lauft_seit` measures
    how many minutes\n       during the **last 20-minute window** the washer has drawn
    power.  \n     - While running, this value remains high (close to 20).  \n     -
    After the wash cycle ends, the value gradually decreases as power\n       consumption
    stops.\n\n  2. **Trigger Condition**  \n     - The automation triggers when  \n
    \      `sensor.waschmaschine_lauft_seit` drops **below 16.8 minutes**,  \n       **or**
    when `binary_sensor.waschmaschine_lauft` stays **off** for\n       **2 minutes**.\n\n
    \ 3. **Safety Conditions**  \n     - The boolean `input_boolean.waschmaschine_fertig`
    must currently be **off**  \n       (prevents repeated notifications).  \n     -
    The automation must **not have triggered in the last 20 minutes**,  \n       avoiding
    premature reactivation.  \n     - For the 2‑minute off trigger only: `sensor.waschmaschine_lauft_seit`
    must be **above 14.75** (ensures ≥14.75 min of activity to avoid early/scheduled
    false positives). The numeric threshold path (`<16.8`) does not require this guard.\n\n\n
    \ 4. **Action**  \n     - Turns **on** the boolean `input_boolean.waschmaschine_fertig`.
    \ \n\n  ---\n\n  ### \U0001F4CA **Technical Summary**  \n\n  | Component | Description
    |\n  |------------|-------------|\n  | **Trigger** | `numeric_state`: `sensor.waschmaschine_lauft_seit
    < 16.8`<br>`state`: `binary_sensor.waschmaschine_lauft` off for 2 min |\n  | **Conditions**
    | Boolean off, last triggered > 20 min ago, runtime above 14.75 only for 2m off
    trigger |\n  | **Action** | `input_boolean.turn_on` → `input_boolean.waschmaschine_fertig`
    |\n  | **Tracking Window** | 20 minutes of power draw |\n  | **Mode** | `single`
    |\n\n  ---\n\n  ### \U0001F9E0 **Notes & Recommendations**  \n\n  - The **16.8-minute
    threshold** corresponds to roughly 85 % of the 20-minute\n    monitoring window
    — adjust to match your washer’s power usage pattern.  \n  - The logic assumes
    that the washing machine draws **no noticeable power** at\n    the end of its
    cycle.  "
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.waschmaschine_lauft_seit
    below: 16.8
    id: drop
  - trigger: state
    entity_id:
    - binary_sensor.waschmaschine_lauft
    to: 'off'
    from: 'on'
    for:
      hours: 0
      minutes: 2
      seconds: 0
    id: 2m
  conditions:
  - condition: template
    value_template: "{{ now() - (state_attr(this.entity_id, 'last_triggered') | default(\n
      \     as_datetime('0'), true)) > timedelta(minutes=20) }}"
  - condition: state
    entity_id: input_boolean.waschmaschine_fertig
    state: 'off'
  - condition: or
    conditions:
    - condition: and
      conditions:
      - condition: numeric_state
        entity_id: sensor.waschmaschine_lauft_seit
        above: 14.75
      - condition: trigger
        id:
        - 2m
    - condition: trigger
      id:
      - drop
  actions:
  - action: input_boolean.turn_on
    metadata: {}
    data: {}
    target:
      entity_id: input_boolean.waschmaschine_fertig
  - action: button.press
    metadata: {}
    target:
      entity_id: button.washing_machine_force_end_cycle
    data: {}
  mode: single
- id: '1760874193253'
  alias: Auto Trockner Fertig
  description: "## \U0001F506 Trockner Fertig Automatik  \n\n### ⚙️ **Purpose**  \nThis
    automation automatically activates the `input_boolean.trockner_fertig` when the
    dryer has **finished its cycle**.  \nIt uses the runtime sensor to detect when
    the dryer stops drawing power within a **20-minute observation window**.  \n\n---\n\n###
    \U0001F9E9 **How It Works**  \n\n1. **Runtime Tracking**  \n   - The sensor `sensor.trockner_lauft_seit`
    measures how many minutes within the **last 20 minutes** the dryer has been consuming
    power.  \n   - While the dryer is active, the value remains close to 20 minutes.
    \ \n   - After the cycle ends, the power usage stops, and this value gradually
    decreases.  \n\n2. **Trigger Condition**  \n   - The automation triggers once
    `sensor.trockner_lauft_seit` falls **below 19.75 minutes**, indicating the dryer
    has not used power for a short while — signaling the end of a drying cycle.  \n\n3.
    **Safety Condition**  \n   - Only runs if `input_boolean.trockner_fertig` is currently
    **off**, ensuring it only activates once per cycle and doesn’t re-trigger unnecessarily.
    \ \n\n4. **Action**  \n   - Turns **on** the boolean `input_boolean.trockner_fertig`.
    \ \n   - This boolean can be used in companion automations to send notifications,
    flash LEDs, or announce via TTS that the drying is done.  \n\n---\n\n### \U0001F4CA
    **Technical Summary**  \n\n| Component | Description |\n|------------|-------------|\n|
    **Trigger** | `numeric_state` → `sensor.trockner_lauft_seit` < `19.5` |\n| **Condition**
    | `input_boolean.trockner_fertig` = `off` |\n| **Action** | `input_boolean.turn_on`
    → `input_boolean.trockner_fertig` |\n| **Tracking Window** | Last 20 minutes of
    power draw |\n| **Mode** | `single` |\n\n---\n\n### \U0001F9E0 **Notes & Recommendations**
    \ \n- The **19.5-minute threshold** is optimized for a 20-minute rolling window
    — fine-tune it based on how your sensor updates.  \n- This setup assumes the dryer
    stops drawing significant power once finished.  \n- For completeness, pair it
    with a **reset automation** that turns `input_boolean.trockner_fertig` back **off**
    when a new cycle begins (e.g., when runtime exceeds 2–3 minutes again).  \n- Useful
    for smart notifications, visual indicators, or spoken alerts when the dryer cycle
    is complete.\n"
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.trockner_lauft_seit
    below: 19.5
  conditions:
  - condition: state
    entity_id: input_boolean.trockner_fertig
    state: 'off'
  actions:
  - action: input_boolean.turn_on
    metadata: {}
    data: {}
    target:
      entity_id: input_boolean.trockner_fertig
  - action: button.press
    metadata: {}
    target:
      entity_id: button.trockner_force_end_cycle
    data: {}
  mode: single
- id: '1761086236371'
  alias: Tibber Pulse Bridge Auto Restart
  description: "## ⚙️ Tibber Pulse Bridge Auto Restart\n\n### \U0001F9ED **Purpose**\nEnsures
    reliable operation of the **Tibber Pulse Bridge** by automatically\nrestarting
    it **every day at 12:00**, or when its **uptime** exceeds\n2.5 days. This prevents
    MQTT lockups and stale data readings.\n\n### \U0001F9E9 **Trigger Logic**\n- **\U0001F551
    Time Trigger:** Executes exactly at `12:00:00` every day.  \n- **\U0001F4C8 Uptime
    Trigger:** Activates if `sensor.tibber_node_bridge_status`\n  reports `uptime_days
    > 2.5`, providing a safety fallback.\n\n### \U0001F680 **Action Flow**\n1. **Publish
    MQTT Reset Command**  \n   Sends `reset` to topic `tibber/in` to trigger the bridge
    restart.\n2. **Verification Delay (120s)**  \n   Allows the bridge time to reconnect
    and update its uptime attribute.\n3. **Validation & Notification**  \n   If the
    bridge **has not reset** (`uptime_days > 0.5`) or is\n   **unavailable**, sends
    a notification via `notify.duncan`\n   to flag a manual check.\n\n### \U0001F512
    **Execution Mode**\n- `mode: single` — prevents overlapping restarts, ensuring
    clean execution.\n"
  triggers:
  - trigger: time
    at: '12:00:00'
  - trigger: numeric_state
    entity_id: sensor.tibber_node_bridge_status
    attribute: uptime_days
    above: 2.5
  actions:
  - action: mqtt.publish
    metadata: {}
    data:
      topic: tibber/in
      payload: reset
  - alias: Wait for the uptime to drop below 0.1 days (indicating a fresh restart)
    wait_for_trigger:
    - trigger: numeric_state
      entity_id: sensor.tibber_node_bridge_status
      attribute: uptime_days
      below: 0.1
    timeout:
      minutes: 2
    continue_on_timeout: true
  - alias: Check if the wait timed out or if the sensor is broken
    if:
    - condition: or
      conditions:
      - condition: template
        value_template: '{{ not wait.completed }}'
      - condition: state
        entity_id: sensor.tibber_node_bridge_status
        state: unavailable
    then:
    - action: notify.duncan
      data:
        title: ⚠️ Tibber Bridge Restart Check Failed
        message: 'The Tibber Pulse Bridge did not reset properly within 2 minutes  or
          is currently unavailable. Manual intervention may be required.

          '
  mode: single
- id: '1761770991521'
  alias: Beta Release Notification
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - sensor.home_assistant_beta_release_notes
    attribute: ai_summary_short
    for:
      hours: 0
      minutes: 5
      seconds: 0
  conditions:
  - condition: state
    entity_id: binary_sensor.home_assistant_beta_release_notes_window
    state:
    - 'on'
  actions:
  - action: notify.duncan
    metadata: {}
    data:
      title: Beta Release {{ states('sensor.home_assistant_beta_release_notes') }}
      message: '{{ state_attr(''sensor.home_assistant_beta_release_notes'',''ai_summary_short'')}}'
