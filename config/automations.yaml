- id: '1704466926541'
  alias: Appliance Auto Count
  description: "## ⚡ Appliance Auto Count  \n\n### \U0001F4CB **Appliance Usage Tracking**
    \ \nThis automation tracks and counts the usage of household appliances, including
    coffee machines and refrigerators, based on their power consumption.  \n\nIt increments
    dedicated Home Assistant counters whenever an appliance is powered on and actively
    consuming energy above a defined threshold.  \n\n---\n\n### ⏰ **Triggers**  \n\n|
    Trigger Entity | Threshold / Event | Appliance |\n|----------------|-----------------|-----------|\n|
    `sensor.kaffeemaschine_philips_energy_power` | > 10 W | Coffee Machine (Philips)
    |\n| `sensor.kaffeemaschine_energy_power` | > 300 W | Coffee Machine |\n| `sensor.kuhlschrank_drinnen_energy_power`
    | > 30 W | Refrigerator (Inside) |\n| `sensor.kuhlschrank_draussen_energy_power`
    | > 30 W | Refrigerator (Outside) |\n\n> **Note:** Each trigger is a numeric state
    trigger that activates when the power consumption rises above the defined threshold.
    \ \n\n---\n\n### ✅ **Conditions**  \n- None. This automation runs whenever any
    trigger threshold is exceeded.  \n\n---\n\n### \U0001F3AF **Actions / Workflow**
    \ \n\n1. **Increment Counters**  \n   - `sensor.kuhlschrank_drinnen_energy_power`
    → `counter.kuhlschrank`  \n   - `sensor.kuhlschrank_draussen_energy_power` → `counter.kuhlschrank_draussen`
    \ \n   - `sensor.kaffeemaschine_energy_power` → `counter.kaffeemaschine`  \n\nEach
    action only runs if its corresponding trigger fired, ensuring accurate appliance
    usage counting.  \n\n---\n\n### \U0001F527 **Technical Specs**  \n- **Mode:**
    `parallel` (max 10 concurrent executions)  \n- **Counters Used:**  \n  - `counter.kaffeemaschine`
    \ \n  - `counter.kuhlschrank`  \n  - `counter.kuhlschrank_draussen`  \n- **Power
    Thresholds:** Configurable per appliance as numeric state triggers  \n\n---\n\n###
    ⚡ **Notes / Best Practices**  \n- Useful for monitoring appliance usage patterns
    over time.  \n- Running in parallel mode allows multiple appliances to trigger
    simultaneously without blocking other counts.  \n- Ensure that energy sensors
    are accurate and reflect true appliance usage to avoid false counts.  \n"
  triggers:
  - entity_id:
    - sensor.kaffeemaschine_philips_energy_power
    above: 10
    id: Kaffeemaschine
    trigger: numeric_state
  - entity_id:
    - sensor.kaffeemaschine_energy_power
    above: 300
    id: Kaffeemaschine
    trigger: numeric_state
  - entity_id:
    - sensor.kuhlschrank_drinnen_energy_power
    above: 30
    id: 'Kühlschrank '
    trigger: numeric_state
  - entity_id:
    - sensor.kuhlschrank_draussen_energy_power
    above: 30
    id: 'Kühlschrank Draußen '
    trigger: numeric_state
  conditions: []
  actions:
  - if:
    - condition: trigger
      id:
      - 'Kühlschrank '
    then:
    - data: {}
      target:
        entity_id: counter.kuhlschrank
      action: counter.increment
    alias: 'Kühlschrank '
  - alias: 'Kühlschrank  Draußen '
    if:
    - condition: trigger
      id:
      - 'Kühlschrank Draußen '
    then:
    - target:
        entity_id: counter.kuhlschrank_draussen
      data: {}
      action: counter.increment
  - alias: 'Kaffeemaschine '
    if:
    - condition: trigger
      id:
      - Kaffeemaschine
    then:
    - data: {}
      target:
        entity_id: counter.kaffeemaschine
      action: counter.increment
  mode: parallel
  max: 10
- id: '1705389061375'
  alias: Homeassistent Start & Stop
  description: "## \U0001F504 Home Assistant Start & Stop Automation\n\n### \U0001F4CB
    Purpose\nMonitors Home Assistant startup and shutdown events, sends notifications,
    \nrestarts backup add-ons, and locates iCloud devices to ensure the system \nand
    critical backups are always operational.\n\n---\n\n### ⏱ Triggers\n- `homeassistant.start`:
    Fires when Home Assistant starts.\n- `homeassistant.shutdown`: Fires when Home
    Assistant stops.\n\n---\n\n### ✅ Conditions\n- None. Actions execute unconditionally
    based on the trigger.\n\n---\n\n### \U0001F3AF Actions / Workflow\n\n#### Startup
    Actions\n- Notify user that Home Assistant is online including the local IP and
    port.\n- Restart key backup add-ons:\n  - `hassio_onedrive_backup`\n  - `hassio_google_drive_backup`\n-
    Wait 1 minute.\n- Locate iCloud devices sequentially with 15-second delay between
    devices.\n\n#### Shutdown Actions\n- Notify user that Home Assistant is down.\n-
    Include uptime duration in notification using `sensor.uptime`.\n\n---\n\n### \U0001F527
    Technical Specs\n- Mode: `single` to prevent overlapping execution.\n- Notifications
    use icon: `mdi:restart`.\n- iCloud device identifiers:\n  - `3675fe049f5a257fe6eebb6533252e74`\n
    \ - `e146d7ea7dd792848fa6d8090a91ff6c`"
  triggers:
  - event: start
    id: Start
    trigger: homeassistant
  - event: shutdown
    id: Stop
    trigger: homeassistant
  conditions: []
  actions:
  - alias: Start
    if:
    - condition: trigger
      id:
      - Start
    then:
    - metadata: {}
      data:
        title: Homeassistent is Up
        message: Homeassistant is online and reachable at http://{{ states('sensor.local_ip')
          }}:8123
        data:
          notification_icon: mdi:restart
          tag: ha_start
      action: notify.duncan
    - delay:
        hours: 0
        minutes: 1
        seconds: 0
        milliseconds: 0
    - action: icloud3.action
      metadata: {}
      data:
        command: Locate Device(s) using iCloud
        device_name: 3675fe049f5a257fe6eebb6533252e74
    - action: icloud3.action
      metadata: {}
      data:
        command: Locate Device(s) using iCloud
        device_name: e146d7ea7dd792848fa6d8090a91ff6c
  - alias: Stop
    if:
    - condition: trigger
      id:
      - Stop
    then:
    - metadata: {}
      data:
        title: Homeassistent is Down
        message: 'Homeassistant was up for: {{ time_since( as_datetime(states(''sensor.uptime'')),
          2)}}'
        data:
          notification_icon: mdi:restart
          tag: ha_stop
      action: notify.duncan
  mode: single
