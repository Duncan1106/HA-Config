    - switch.esp32_c3_mini_bett_nachtlicht_was_in_bed
    from: 'on'
    to: 'off'
    trigger: state
  conditions:
  - condition: and
    conditions:
    - condition: sun
      after: sunrise
      before: sunset
      enabled: true
  actions:
  - metadata: {}
    data:
      message: Du warst {{ time_since(now() - timedelta(hours=states('sensor.time_in_bed_last_24h')|float(0)),
        2)}} im Bett
      title: Zeit im Bett
    action: notify.duncan
  mode: single
- id: '1712941263468'
  alias: Save Pool Pulse Time
  description: This automation saves the current pulse time of the pool pump when
    it is in operation and triggers an MQTT message. It updates the input number representing
    the actual pulse time value based on the received MQTT payload, provided the pump
    has been on for at least 5 minutes.
  triggers:
  - id: frommqtt
    topic: stat/tasmota_837238/RESULT
    trigger: mqtt
  conditions:
  - condition: template
    value_template: '{{ ''PulseTime1'' in  trigger.payload }}'
  - condition: not
    conditions:
    - condition: state
      entity_id: switch.pool_pumpe
      state: 'off'
      for:
        hours: 0
        minutes: 5
        seconds: 0
  actions:
  - target:
      entity_id: input_number.pulseTimeActualValue
    data:
      value: "{% set pulseTime = trigger.payload_json.PulseTime1.Remaining | int(0)
        %}\n{% if  pulseTime < 112 %}\n  {{ pulseTime / 10 | round(0) }}\n{% else
        %}\n  {{ ( pulseTime | int - 100 ) }}\n{% endif %}\n"
    action: input_number.set_value
  mode: single
- id: '1713031049792'
  alias: Get Pool PulseTime
  description: Periodically retrieves the pool pump's pulse time, ensuring it is operational,
    while avoiding downtime during specific conditions.
  triggers:
  - seconds: /10
    trigger: time_pattern
  - event: start
    trigger: homeassistant
  conditions:
  - condition: sun
    before: sunset
    after: sunrise
  - condition: not
    conditions:
    - condition: or
      conditions:
      - condition: state
        entity_id: switch.pool_pumpe
        state: unavailable
      - condition: state
        entity_id: switch.pool_pumpe
        state: 'off'
        for:
          hours: 0
          minutes: 5
          seconds: 0
  actions:
  - metadata: {}
    data:
      topic: cmnd/tasmota_837238/pulsetime1
    action: mqtt.publish
  mode: single
- id: '1714554450926'
  alias: Terrarium Humidifier Empty Detection
  description: Monitors the power consumption of the terrarium humidifier to detect
    when its water tank is empty and sends a notification. Also tracks the number
    of times it was used.
  triggers:
  - trigger: state
    entity_id:
    - switch.terrarium_tasmota3
    to: 'on'
    from: 'off'
  conditions:
  - condition: state
    entity_id: switch.terrarium_tasmota3
    state: 'on'
  actions:
  - alias: Heat on
    if:
    - condition: state
      entity_id: switch.terrarium
      state: 'on'
    then:
    - wait_for_trigger:
      - trigger: numeric_state
        entity_id:
        - sensor.terrarium_energy_power
        above: 95
      continue_on_timeout: true
      timeout:
        hours: 0
        minutes: 1
        seconds: 0
        milliseconds: 0
    - if:
      - condition: numeric_state
        entity_id: sensor.terrarium_energy_power
        below: 95
      - condition: state
        entity_id: switch.terrarium
        state: 'on'
      - condition: state
        entity_id: switch.terrarium_tasmota3
        state: 'on'
      then:
      - metadata: {}
        data:
          message: 'Wassertank auffüllen '
          title: Luftbefeuchter leer
        action: notify.duncan
      - metadata: {}
        data:
          message: ' Der Luftbefeuchter war {{ states(''counter.luftbefeuchter'')}}
            Mal an'
          title: Luftbefeuchter Counter
        action: notify.duncan
      - metadata: {}
        data: {}
        target:
          entity_id: counter.luftbefeuchter
        action: counter.reset
  - alias: Heat off
    if:
    - condition: state
      entity_id: switch.terrarium
      state: 'off'
    then:
    - wait_for_trigger:
      - trigger: numeric_state
        entity_id:
        - sensor.terrarium_energy_power
        above: 20
        for:
          hours: 0
          minutes: 0
          seconds: 5
      continue_on_timeout: true
      timeout:
        hours: 0
        minutes: 1
        seconds: 0
        milliseconds: 0
    - if:
      - condition: numeric_state
        entity_id: sensor.terrarium_energy_power
        below: 20
      then:
      - metadata: {}
        data:
          message: 'Wassertank auffüllen '
          title: Luftbefeuchter leer
        action: notify.duncan
      - metadata: {}
        data:
          message: ' Der Luftbefeuchter war {{ states(''counter.luftbefeuchter'')}}
            Mal an'
          title: Luftbefeuchter Counter
        action: notify.duncan
      - metadata: {}
        data: {}
        target:
          entity_id: counter.luftbefeuchter
        action: counter.reset
  mode: single
- id: '1714558482048'
  alias: Notify on Overcurrent Phase
  description: This automation sends a notification if an overcurrent is detected
    on any phase (L1, L2, or L3) of the smart meter. It checks if the current goes
    above a predefined limit and alerts the user with the current value and the threshold.
    Additionally, it disables charging on specific EV chargers if an overcurrent is
    detected.
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.smart_meter_mqtt_data
    attribute: current_L1
    above: input_number.fuselimit
    id: overcurrent_l1
  - trigger: numeric_state
    entity_id:
    - sensor.smart_meter_mqtt_data
    for:
      hours: 0
      minutes: 0
      seconds: 30
    attribute: current_L2
    above: input_number.fuselimit
    id: overcurrent_l2
  - trigger: numeric_state
    entity_id:
    - sensor.smart_meter_mqtt_data
    for:
      hours: 0
      minutes: 0
      seconds: 30
    attribute: current_L3
    above: input_number.fuselimit
    id: overcurrent_l3
  conditions: []
  actions:
  - alias: Message on Overcurrent
    if:
    - condition: trigger
      id:
      - overcurrent_l1
      - overcurrent_l2
      - overcurrent_l3
    then:
    - metadata: {}
      data:
        title: '!!! OVERCURRENT !!!'
        message: "⚡ Phase: {{ trigger.id.replace('overcurrent_l', 'L') }}   Aktueller
          Strom: {{\n  (trigger.to_state.attributes['current_' ~ trigger.id.replace('overcurrent_',
          '').upper()] | float(0) / 1000) | round(2)\n}} A (Grenzwert: {{ ((states('input_number.fuselimit')
          | float(0)) / 1000.0) | round(2) }} A)"
      action: notify.duncan
    - metadata: {}
      data:
        option: Don't charge
      target:
        entity_id:
        - select.go_echarger_252682_frc
        - select.go_echarger_270862_frc
      action: select.select_option
      enabled: true
  mode: parallel
  max: 10
- id: '1716307846138'
  alias: Pool Runtime Control
  description: Controls the runtime of the pool and extends it if the weather is nice,
    based on the solar power available.
  triggers:
  - hours: '9'
    minutes: /2
    id: On early
    trigger: time_pattern
  - hours: '10'
    minutes: /2
    id: On early
    trigger: time_pattern
  - hours: '11'
    minutes: /2
    id: Force Start
    trigger: time_pattern
    enabled: true
  - entity_id:
    - input_number.pulsetimeactualvalue
    below: 250
    id: Extend
    trigger: numeric_state
  - entity_id:
    - input_number.pulsetimeactualvalue
    below: 150
    id: Extend
    trigger: numeric_state
  - trigger: state
    entity_id:
    - switch.pool_pumpe
    to: 'off'
    from: 'on'
    id: Stopped
  - hours: '20'
    minutes: '*'
    id: Force Stop
    trigger: time_pattern
  conditions:
  - condition: or
    conditions:
    - alias: Early Start Condition
      condition: and
      conditions:
      - condition: time
        after: 09:30:00
        before: '10:59:00'
      - condition: device
        type: is_off
        device_id: 7f4653a91cd2ef69cb48aa494a983be8
        entity_id: 3d65e9bcde794b0149fb7d576edd1bb9
        domain: switch
    - condition: and
      conditions:
      - condition: device
        type: is_off
        device_id: 7f4653a91cd2ef69cb48aa494a983be8
        entity_id: 3d65e9bcde794b0149fb7d576edd1bb9
        domain: switch
      - condition: time
        after: '10:59:59'
        before: '12:00:00'
      alias: Force Start Condition
    - alias: 'Extend Condition '
      condition: numeric_state
      entity_id: input_number.pulsetimeactualvalue
      below: 401
    - condition: state
      entity_id: switch.pool_pumpe
      state: 'off'
      alias: Stopped Condition
    - condition: and
      conditions:
      - condition: time
        after: '14:00:00'
        before: '21:00:00'
      alias: Stop Condition
  actions:
  - alias: Early Start
    if:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - On early
      - alias: Confirm enough solar or power
        condition: or
        conditions:
        - condition: numeric_state
          entity_id: sensor.inverter_pv_power
          above: 1800
        - condition: numeric_state
          entity_id: sensor.grid_export
          above: 2000
      - condition: device
        type: is_off
        device_id: 7f4653a91cd2ef69cb48aa494a983be8
        entity_id: 3d65e9bcde794b0149fb7d576edd1bb9
        domain: switch
      - condition: numeric_state
        entity_id: sensor.sun_solar_azimuth
        above: 95
      - condition: numeric_state
        entity_id: sensor.solcast_pv_forecast_prognose_heute
        above: 40
    then:
    - action: automation.turn_off
      metadata: {}
      data:
        stop_actions: true
      target:
        entity_id: automation.pool_pulsetime_auto_adjust
    - action: switch.turn_on
      metadata: {}
      data: {}
      target:
        entity_id: switch.pool_ventil_solar
    - alias: 8 hours
      metadata: {}
      data:
        topic: cmnd/tasmota_837238/pulsetime1
        payload: '28895'
      action: mqtt.publish
    - type: turn_on
      device_id: 7f4653a91cd2ef69cb48aa494a983be8
      entity_id: 3d65e9bcde794b0149fb7d576edd1bb9
      domain: switch
    - delay:
        hours: 0
        minutes: 5
        seconds: 0
        milliseconds: 0
    - metadata: {}
      data:
        value: '{{ states(''sensor.esp32_c3_mini_pool_temperature_pool_temperature'')
          | float(0) | round(4) }}'
      target:
        entity_id: input_number.pool_temp_start
      action: input_number.set_value
    - delay:
        hours: 0
        minutes: 0
        seconds: 1
        milliseconds: 0
    - action: notify.duncan
      metadata: {}
      data:
        title: Pool Night Temperature Loss
        data:
          tag: pool_loss_night
        message: '{{ (states(''input_number.pool_temp_start'') | float(0) - states(''input_number.pool_temp_stop'')
          | float(0)) | round(2) }}°C'
    - action: automation.turn_on
      metadata: {}
      data: {}
      target:
        entity_id: automation.pool_pulsetime_auto_adjust
  - alias: Force Start
    if:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - Force Start
      - condition: device
        type: is_off
        device_id: 7f4653a91cd2ef69cb48aa494a983be8
        entity_id: 3d65e9bcde794b0149fb7d576edd1bb9
        domain: switch
    then:
    - action: automation.turn_off
      metadata: {}
      data:
        stop_actions: true
      target:
        entity_id: automation.pool_pulsetime_auto_adjust
    - action: switch.turn_on
      metadata: {}
      data: {}
      target:
        entity_id: switch.pool_ventil_solar
    - alias: 6 hours
      metadata: {}
      data:
        topic: cmnd/tasmota_837238/pulsetime1
        payload: '21695'
      action: mqtt.publish
    - type: turn_on
      device_id: 7f4653a91cd2ef69cb48aa494a983be8
      entity_id: 3d65e9bcde794b0149fb7d576edd1bb9
      domain: switch
    - delay:
        hours: 0
        minutes: 5
        seconds: 0
        milliseconds: 0
    - metadata: {}
      data:
        value: '{{ states(''sensor.esp32_c3_mini_pool_temperature_pool_temperature'')
          | float(0) | round(4) }}'
      target:
        entity_id: input_number.pool_temp_start
      action: input_number.set_value
    - delay:
        hours: 0
        minutes: 0
        seconds: 1
        milliseconds: 0
    - action: notify.duncan
      metadata: {}
      data:
        title: Pool Night Temperature Loss
        data:
          tag: pool_loss_night
        message: '{{ (states(''input_number.pool_temp_start'') | float(0) - states(''input_number.pool_temp_stop'')
          | float(0)) | round(2) }}°C'
    - action: automation.turn_on
      metadata: {}
      data: {}
      target:
        entity_id: automation.pool_pulsetime_auto_adjust
  - alias: Extend
    if:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - Extend
      - condition: numeric_state
        entity_id: sensor.inverter_pv_power
        above: 1200
      - condition: numeric_state
        entity_id: counter.pool_extend_counter
        below: 15
      - condition: numeric_state
        entity_id: input_number.pulsetimeactualvalue
        below: 410
      - condition: device
        type: is_on
        device_id: 7f4653a91cd2ef69cb48aa494a983be8
        entity_id: 3d65e9bcde794b0149fb7d576edd1bb9
        domain: switch
      - condition: state
        entity_id: input_boolean.stop_pool
        state: 'off'
      - condition: not
        conditions:
        - condition: state
          entity_id: binary_sensor.pool_temperatur_trend
          state: 'off'
          for:
            hours: 0
            minutes: 5
            seconds: 0
    then:
    - action: automation.turn_off
      metadata: {}
      data:
        stop_actions: true
      target:
        entity_id: automation.pool_pulsetime_auto_adjust
    - delay:
        hours: 0
        minutes: 0
        seconds: 0
        milliseconds: 500
    - if:
      - condition: numeric_state
        entity_id: counter.pool_extend_counter
        below: 1
      then:
      - metadata: {}
        data:
          value: '{{ states(''sensor.esp32_c3_mini_pool_temperature_pool_temperature'')
            | float(0) | round(4) }}'
        target:
          entity_id: input_number.pool_temp_stop
        action: input_number.set_value
      alias: Save Temperature before extend
    - alias: Extend by 6min
      metadata: {}
      data:
        topic: cmnd/tasmota_837238/pulsetime1
        payload: '{{ states(''input_number.pulsetimeactualvalue'') | int(0) + 460
          }}'
      action: mqtt.publish
    - metadata: {}
      data: {}
      target:
        entity_id: counter.pool_extend_counter
      action: counter.increment
    - delay:
        hours: 0
        minutes: 0
        seconds: 20
        milliseconds: 0
    - action: automation.turn_on
      target:
        entity_id: automation.pool_pulsetime_auto_adjust
      data: {}
    else:
    - alias: Save Stop Temp when was still on
      if:
      - condition: and
        conditions:
        - condition: trigger
          id:
          - Extend
        - condition: device
          type: is_on
          device_id: 7f4653a91cd2ef69cb48aa494a983be8
          entity_id: 3d65e9bcde794b0149fb7d576edd1bb9
          domain: switch
      then:
      - alias: Notify about temperature change caused by extend
        if:
        - condition: numeric_state
          entity_id: counter.pool_extend_counter
          above: 0
        - condition: state
          entity_id: input_boolean.stop_pool
          state: 'off'
        then:
        - action: notify.duncan
          metadata: {}
          data:
            message: Extend caused {{ (states('sensor.esp32_c3_mini_pool_temperature_pool_temperature')
              | float(0) - states('input_number.pool_temp_stop') | float(0)) | round(2)
              }}°C
      - delay:
          hours: 0
          minutes: 0
          seconds: 0
          milliseconds: 100
      - metadata: {}
        data:
          value: '{{ states(''sensor.esp32_c3_mini_pool_temperature_pool_temperature'')
            | float(0) | round(4) }}'
        target:
          entity_id: input_number.pool_temp_stop
        action: input_number.set_value
      - action: input_boolean.turn_on
        metadata: {}
        data: {}
        target:
          entity_id: input_boolean.stop_pool
  - alias: Stopped
    if:
    - condition: trigger
      id:
      - Stopped
    then:
    - action: switch.turn_off
      metadata: {}
      data: {}
      target:
        entity_id: switch.smart_valve_controller_schalter_1
    - alias: Notify about temperature change caused by extend
      if:
      - condition: numeric_state
        entity_id: counter.pool_extend_counter
        above: 0
      - condition: state
        entity_id: input_boolean.stop_pool
        state: 'off'
      then:
      - action: notify.duncan
        metadata: {}
        data:
          message: Extend caused {{ (states('sensor.esp32_c3_mini_pool_temperature_pool_temperature')
            | float(0) - states('input_number.pool_temp_stop') | float(0)) | round(2)
            }}°C
    - delay:
        hours: 0
        minutes: 0
        seconds: 0
        milliseconds: 100
    - metadata: {}
      data:
        value: '{{ states(''sensor.esp32_c3_mini_pool_temperature_pool_temperature'')
          | float(0) | round(4) }}'
      target:
        entity_id: input_number.pool_temp_stop
      action: input_number.set_value
    - action: input_boolean.turn_on
      metadata: {}
      data: {}
      target:
        entity_id: input_boolean.stop_pool
    - delay:
        hours: 0
        minutes: 0
        seconds: 30
        milliseconds: 0
    - action: switch.turn_off
      metadata: {}
      data: {}
      target:
        entity_id: switch.pool_ventil_solar
  - alias: Force Stop
    if:
    - condition: trigger
      id:
      - Force Stop
    then:
    - if:
      - condition: device
        type: is_on
        device_id: 7f4653a91cd2ef69cb48aa494a983be8
        entity_id: 3d65e9bcde794b0149fb7d576edd1bb9
        domain: switch
      then:
      - metadata: {}
        data:
          value: '{{ states(''sensor.esp32_c3_mini_pool_temperature_pool_temperature'')
            | float(0) }}'
        target:
          entity_id: input_number.pool_temp_stop
        action: input_number.set_value
      alias: Save Stop Temp when was still on
    - action: switch.turn_off
      metadata: {}
      data: {}
      target:
        entity_id:
        - switch.pool_pumpe
        - switch.pool_ventil_solar
    - alias: '0'
      metadata: {}
      data:
        topic: cmnd/tasmota_837238/pulsetime1
        payload: '0'
      action: mqtt.publish
    - metadata: {}
      data: {}
      target:
        entity_id: counter.pool_extend_counter
      action: counter.reset
    - delay:
        hours: 0
        minutes: 0
        seconds: 0
        milliseconds: 100
    - if:
      - condition: state
        entity_id: input_boolean.stop_pool
        state: 'on'
      then:
      - action: notify.duncan
        alias: Notify of Temperature Change
        data:
          title: Pool Temperature Change
          data:
            tag: pool_temp_diff
          message: '{%- set start = states(''input_number.pool_temp_start'') | float(0)
            -%} {%- set stop = states(''input_number.pool_temp_stop'') | float(0)
            -%} {%- set diff = (stop - start) | round(2) -%} {{ ''+'' if diff > 0
            else ''-'' }}{{ diff | abs }}°C'
      alias: Notify once for Temperature Change
    - action: input_boolean.turn_off
      metadata: {}
      data: {}
      target:
        entity_id: input_boolean.stop_pool
  mode: queued
  max: 50
