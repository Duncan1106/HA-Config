            above: 5
          then:
          - wait_for_trigger:
            - trigger: numeric_state
              entity_id:
              - sensor.go_echarger_270862_nrg_12
              below: 5
            timeout:
              hours: 0
              minutes: 30
              seconds: 0
              milliseconds: 0
            continue_on_timeout: true
        - action: script.retry_action_with_backoff
          metadata: {}
          data:
            max_retries: 10
            base_delay: 5
            max_delay: 60
            backoff_type: simple
            notify_on_failure: true
            notify_service: notify.duncan
            entity_id: select.go_echarger_270862_frc
            target_state: custom
            custom_action:
            - action: select.select_option
              metadata: {}
              data:
                option: Don't charge
              target:
                entity_id:
                - select.go_echarger_270862_frc
            custom_target_state: Don't charge
        continue_on_error: true
      - alias: If Car is connected to 22kW Charger then stop charging
        if:
        - condition: state
          entity_id: binary_sensor.go_echarger_252682_car
          state: 'on'
        - condition: or
          conditions:
          - condition: trigger
            id:
            - Off_time
          - condition: or
            conditions:
            - alias: Zoe full and was charging
              condition: and
              conditions:
              - condition: trigger
                id:
                - car_full_zoe
              - condition: state
                entity_id: sensor.go_e_22kw_car
                state: Zoe
            - alias: 'Tavascan full and was charging '
              condition: and
              conditions:
              - condition: trigger
                id:
                - car_full_tavascan
              - condition: state
                entity_id: sensor.go_e_22kw_car
                state: Tavascan
            - alias: 'MG4 full and was charging '
              condition: and
              conditions:
              - condition: trigger
                id:
                - car_full_mg4
              - condition: state
                entity_id: sensor.go_e_22kw_car
                state: MG4
        then:
        - alias: wait for power to go down after car_full trigger
          if:
          - condition: trigger
            id:
            - car_full_zoe
            - car_full_tavascan
            - car_full_mg4
          - condition: numeric_state
            entity_id: sensor.go_echarger_252682_nrg_12
            above: 5
          then:
          - wait_for_trigger:
            - trigger: numeric_state
              entity_id:
              - sensor.go_echarger_252682_nrg_12
              below: 5
            timeout:
              hours: 0
              minutes: 30
              seconds: 0
              milliseconds: 0
            continue_on_timeout: true
        - action: script.retry_action_with_backoff
          metadata: {}
          data:
            max_retries: 10
            base_delay: 5
            max_delay: 60
            backoff_type: simple
            notify_on_failure: true
            notify_service: notify.duncan
            entity_id: select.go_echarger_252682_frc
            target_state: custom
            custom_action:
            - action: select.select_option
              metadata: {}
              data:
                option: Don't charge
              target:
                entity_id:
                - select.go_echarger_252682_frc
            custom_target_state: Don't charge
        continue_on_error: true
      - alias: Only wait for power if above threshold
        if:
