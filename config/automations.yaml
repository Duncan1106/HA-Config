- id: '1697103571991'
  alias: Auto Desk Light
  description: ''
  triggers:
  - type: occupied
    device_id: 561b2fddd9cec3889faf18b8ccf214a0
    entity_id: 9e2fd849edb418346b78ab27fafb8a79
    domain: binary_sensor
    trigger: device
    for:
      hours: 0
      minutes: 0
      seconds: 5
    id: 'On'
  - trigger: numeric_state
    entity_id:
    - sensor.everything_presence_lite_f1c0d0_illuminance
    below: 200
    id: 'On'
  - trigger: state
    entity_id:
    - binary_sensor.schreibtisch
    to: 'on'
    for:
      hours: 0
      minutes: 0
      seconds: 5
    id: 'On'
  - trigger: state
    entity_id:
    - binary_sensor.schreibtisch
    to: 'off'
    for:
      hours: 0
      minutes: 15
      seconds: 0
    id: 'Off'
  - type: not_occupied
    device_id: 561b2fddd9cec3889faf18b8ccf214a0
    entity_id: b4a408441c08e8103747f1fac6b78b62
    domain: binary_sensor
    trigger: device
    for:
      hours: 0
      minutes: 0
      seconds: 5
    id: 'Off'
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: and
        conditions:
        - condition: state
          entity_id: switch.schreibtisch_links_power_strip_l5
          state: 'on'
        - condition: trigger
          id:
          - 'Off'
      sequence:
      - type: turn_off
        device_id: 49e01e12b2a0a7a6bad4ffdbce655bf7
        entity_id: 203df768618055df4c42748f101b7f2b
        domain: switch
      alias: 'Off'
    - conditions:
      - condition: and
        conditions:
        - condition: numeric_state
          entity_id: sensor.average_illuminance
          below: 300
        - condition: state
          entity_id: person.duncan
          state: home
        - condition: time
          after: 07:00:00
          before: '23:00:00'
        - condition: state
          entity_id: binary_sensor.schreibtisch
          state: 'on'
        - condition: trigger
          id:
          - 'On'
      sequence:
      - type: turn_on
        device_id: 49e01e12b2a0a7a6bad4ffdbce655bf7
        entity_id: 203df768618055df4c42748f101b7f2b
        domain: switch
      alias: 'On'
  mode: queued
  max: 10
