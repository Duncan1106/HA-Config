        - condition: numeric_state
          entity_id: input_number.pool_temp_start
          above: 28.5
        alias: Start Temp not too hot
      - condition: numeric_state
        entity_id: sensor.esp32_c3_mini_pool_temperature_pool_temperature
        below: input_number.pool_heating_stop
      - condition: or
        conditions:
        - condition: numeric_state
          entity_id: sensor.cloud_coverage
          below: 50
        - condition: numeric_state
          entity_id: sensor.solar_power_total
          above: 8000
        - condition: numeric_state
          entity_id: sensor.gw1100a_solar_radiation
          above: 300
    then:
    - alias: If First Trigger of the day, then turn on switch
      if:
      - condition: state
        entity_id: switch.pool_ventil_solar
        state: 'off'
      then:
      - action: switch.turn_on
        metadata: {}
        data: {}
        target:
          entity_id: switch.pool_ventil_solar
      - wait_for_trigger:
        - trigger: state
          entity_id:
          - switch.smart_valve_controller_schalter_1
          from: unavailable
        timeout:
          hours: 0
          minutes: 1
          seconds: 0
          milliseconds: 0
    - action: switch.turn_on
      metadata: {}
      data: {}
      target:
        entity_id: switch.smart_valve_controller_schalter_1
  - alias: Solar Heating OFF
    if:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - 'On'
        - On 1
        - On last
      - condition: or
        conditions:
        - condition: numeric_state
          entity_id: sensor.esp32_c3_mini_pool_temperature_pool_temperature
          above: input_number.pool_heating_stop
        - condition: and
          conditions:
          - condition: numeric_state
            entity_id: sensor.cloud_coverage
            above: 50
          - condition: numeric_state
            entity_id: sensor.solar_power_total
            below: 5000
          - condition: numeric_state
            entity_id: sensor.gw1100a_solar_radiation
            below: 250
    then:
    - action: switch.turn_off
      metadata: {}
      data: {}
      target:
        entity_id: switch.smart_valve_controller_schalter_1
  - alias: Disable Solar Heating if to hot
    if:
    - condition: and
      conditions:
      - condition: numeric_state
        entity_id: input_number.pool_temp_start
        above: 28.5
      - condition: trigger
        id:
        - Off if to hot
      - condition: state
        entity_id: switch.smart_valve_controller_schalter_1
        state: 'on'
    then:
    - action: switch.turn_off
      metadata: {}
      data: {}
      target:
        entity_id: switch.smart_valve_controller_schalter_1
    - delay:
        hours: 0
        minutes: 0
        seconds: 30
        milliseconds: 0
    - action: switch.turn_off
      metadata: {}
      data: {}
      target:
        entity_id:
        - switch.pool_ventil_solar
    - action: notify.duncan
