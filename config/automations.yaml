- id: '1762798868790'
  alias: Fairphone 4 Location Update
  description: "## \U0001F4CD Fairphone 4 – Automatic Location Recovery & Reliability
    System\n\n### \U0001F3AF **Purpose**\nEnsures Katalin’s **location** in Home Assistant
    stays accurate and up to date.  \nThis automation detects when the **Fairphone
    4** stops reporting a valid position  \n(e.g., becomes `unknown` or `unavailable`)
    and automatically attempts to fix it  \nby requesting repeated location updates
    from the device.\n\n### ⚙️ **How It Works**\n- **Triggers** when:\n  - Home Assistant
    starts  \n  - Katalin’s location becomes `unknown` or `unavailable`  \n  - Every
    **10 minutes** while not connected to home Wi-Fi  \n- **Retries up to 4 times**,
    sending location update requests every **2 minutes**  \n  until the device reports
    a valid location.\n\n### \U0001F9E9 **Automation Logic Overview**\n\n| \U0001F9E9
    Type | \U0001F4A1 Name / Alias | \U0001F50D Details |\n|----------|------------------|-------------|\n|
    **Trigger** | **Home Assistant Start** | When Home Assistant starts (`event: start`).
    |\n| **Trigger** | **Location Lost** | When `person.katalin` state changes to
    `unknown` or `unavailable`. |\n| **Trigger** | **Periodic Check** | Every 10 minutes
    while conditions are met (`minutes: /10`). |\n| **Condition** | **Not on Home
    Wi-Fi** | Skips if connected to Wi-Fi `DESK` or `Cudy-69F2`. |\n| **Action 1**
    | **\U0001F501 Repeated Location Requests** | Repeats up to **4 times**, every
    **2 minutes**, sending `request_location_update` to `notify.mobile_app_fp4`. Stops
    early if a valid location is received. |\n| **Mode** | **Single** | Prevents overlapping
    execution of the same automation. |\n\n---\n\n**Status:** Active reliability layer
    for accurate person tracking  \n**Mode:** Single — prevents overlapping runs"
  triggers:
  - trigger: homeassistant
    event: start
  - trigger: state
    entity_id: person.katalin
    to:
    - unavailable
    - unknown
  - trigger: time_pattern
    minutes: /10
  conditions:
  - condition: or
    conditions:
    - condition: not
      conditions:
      - condition: or
        conditions:
        - condition: state
          entity_id: sensor.fp4_wifi_connection
          state:
          - DESK
        - condition: state
          entity_id: sensor.fp4_wifi_connection
          state:
          - Cudy-69F2
        alias: In home Wifi
      alias: Not In Home Wifi
    - condition: state
      entity_id: person.katalin
      state:
      - not_home
  actions:
  - alias: "\U0001F501 Repeated Location Requests"
    repeat:
      until:
      - condition: or
        conditions:
        - condition: not
          conditions:
          - condition: or
            conditions:
            - condition: state
              entity_id: person.katalin
              state: unavailable
            - condition: state
              entity_id: person.katalin
              state: unknown
        - condition: template
          value_template: '{{ repeat.index >= 4 }}'
      sequence:
      - action: notify.mobile_app_fp4
        data:
          message: request_location_update
      - delay:
          minutes: 2
  mode: single
- id: '1763164752006'
  alias: Night Battery Charging
  description: "# \U0001F319 **Night Battery Charging**\n\n---\n\n### \U0001F4CB Intelligent
    Battery Energy Control\n**High-Level Intent**\nOptimizes home battery storage
    by charging from the grid during low-cost night windows. The system calculates
    required energy based on current state-of-charge (SoC), solar forecasts, and user-defined
    buffers to ensure sufficient power for the following day at minimum cost.\n\n**Operational
    Strategy**\n* **Cost-Efficient:** Leverages night-time electricity rates when
    solar availability is insufficient.\n* **Dynamic Adjustment:** Real-time updates
    to charge amperage and SoC targets if underlying requirements change during the
    active window.\n* **Automation Window:** Strictly active between **00:05** and
    **04:59** to align with typical off-peak utility periods.\n\n**Reliability Mechanisms**\n*
    **Robust Execution:** Utilizes `script.retry_action_with_backoff` for critical
    switch toggles, ensuring hardware commands (e.g., Deye Inverter settings) succeed
    despite potential transient network issues.\n* **Parallel Execution:** Mode set
    to **Parallel** to allow simultaneous processing of SoC and Amperage updates.\n\n---\n\n###
    Trigger Overview Table\n\n| Type | Entity / Condition | ID | Purpose |\n| :---
    | :--- | :--- | :--- |\n| **State** | `binary_sensor.charge_battery_at_night`
    (**on**) | `On` | Initiation of the charging logic based on demand. |\n| **Time**
    | **00:05:00** | `On` | Scheduled start of the night charging window. |\n| **Time**
    | **04:59:00** / **05:00:00** | `Off` | Scheduled termination of grid charging.
    |\n| **State** | `attribute: required_charge_amps` | `amps` | Adjusts charging
    speed if demand attributes change. |\n| **State** | `attribute: offset_charge_target_percent`
    | `SoC target` | Updates the maximum SoC limit dynamically. |\n\n---\n\n### Operational
    Logic Sections\n\n#### \U0001F311 Charging Initiation (Night Window)\n* **Purpose:**
    Secure energy storage for the next day.\n* **Logic Overview:** Triggered by time
    or sensor state within the **00:05** to **04:59** window. Only executes if the
    `binary_sensor` is **on** and the inverter grid-charge switch is currently **off**.\n*
    **Effect:** * Sends a detailed **Notification** via `notify.duncan` with calculated
    kWh requirements and cost savings.\n    * Sets `number.esp32_s3_zero_deye8k_battery_charge_from_grid_upto`
    to the calculated target percentage.\n    * Forces `number.esp32_s3_zero_deye8k_time_point_1_power`
    to **0** to prioritize charging.\n    * Enables `switch.esp32_s3_zero_deye8k_battery_charge_grid`
    and `switch.bett_powerbank_charger`.\n    * Increments `input_number.save_through_night_battery_charging`
    with predicted savings.\n\n#### ☀️ Window Termination\n* **Purpose:** Cease grid
    reliance before peak rates or solar production begins.\n* **Logic Overview:**
    Triggered at **04:59** or **05:00**.\n* **Effect:** * Disables all grid-charging
    switches.\n    * Resets `number.esp32_s3_zero_deye8k_time_point_1_power` to **7000W**
    for normal discharge operations.\n    * Turns off auxiliary chargers (`switch.bett_powerbank_charger`).\n\n####
    ⚡ Dynamic Parameter Adjustment\n* **Purpose:** Adapt to changing energy requirements
    in real-time.\n* **Logic Overview:** Monitors changes in `required_charge_amps`
    or `offset_charge_target_percent`.\n* **Effect:** Updates inverter registers immediately
    to match the new `binary_sensor` attributes without restarting the full charging
    cycle.\n\n---\n\n### Technical Overview\n\n* **Automation Mode:** `parallel` (Max:
    10)\n* **Execution Method:** `script.retry_action_with_backoff`\n* **Key Inputs:**
    * `binary_sensor.charge_battery_at_night` (Logic controller)\n    * `input_number.battery_charge_percent_offset`
    (User-defined safety margin)\n* **Controlled Entities:**\n    * `switch.esp32_s3_zero_deye8k_battery_charge_grid`\n
    \   * `number.esp32_s3_zero_deye8k_maximum_battery_grid_charge_current`\n    *
    `switch.bett_powerbank_charger`\n* **Safety Mechanisms:** 10x retry limit with
    exponential backoff on hardware commands; SoC targets are clamped at a maximum
    of **100%**.\n\n---\n\n### \U0001F4A1 Notes\n* **Financial Tracking:** The automation
    calculates `saved_cost_eur` per session and logs it to a global helper for long-term
    ROI tracking.\n* **Predictive Buffer:** Logic includes a `dynamic_margin_kwh`
    which accounts for solar forecast uncertainty, ensuring the battery isn't overcharged
    if a very sunny day is expected.\n* **Calculated Duration:** The notification
    includes a \"Time Remaining\" calculation to inform the user exactly how long
    the high-current charge phase will last."
  triggers:
  - entity_id: binary_sensor.charge_battery_at_night
    to: 'on'
    trigger: state
    id: 'On'
  - trigger: time
    at: 00:05:00
    id: 'On'
  - at: 04:59:00
    trigger: time
    id: 'Off'
  - at: 05:00:00
    trigger: time
    id: 'Off'
  - trigger: state
    entity_id:
    - binary_sensor.charge_battery_at_night
    attribute: required_charge_amps
    id: amps
  - trigger: state
    entity_id:
    - binary_sensor.charge_battery_at_night
    attribute: offset_charge_target_percent
    id: SoC target
  conditions:
  - condition: or
    conditions:
    - alias: On / amp / soc branch
      condition: and
      conditions:
      - condition: time
        after: 00:04:59
        before: 04:59:00
      - condition: state
        entity_id: binary_sensor.charge_battery_at_night
        state: 'on'
      - condition: or
        conditions:
        - condition: and
          conditions:
          - condition: trigger
            id:
            - 'On'
          - condition: state
            entity_id: switch.esp32_s3_zero_deye8k_battery_charge_grid
            state:
            - 'off'
          alias: On branch specific
        - alias: 'Amp branch specific '
          condition: and
          conditions:
          - condition: trigger
            id:
            - amps
          - condition: template
            value_template: '{% set requested = state_attr(''binary_sensor.charge_battery_at_night'',
              ''required_charge_amps'') | default(30, true) | int %}

              {% set current = states(''number.esp32_s3_zero_deye8k_maximum_battery_grid_charge_current'')
              | default(0, true) | int %}

              {{ requested != current }}'
        - alias: SoC Branch specific
          condition: and
          conditions:
          - condition: trigger
            id:
            - SoC target
          - condition: template
            value_template: '{% set requested = state_attr(''binary_sensor.charge_battery_at_night'',
              ''offset_charge_target_percent'') | default(100, true) | int %}

              {% set current = states(''number.esp32_s3_zero_deye8k_battery_charge_from_grid_upto'')
              | default(0, true) | int %}

              {{ requested != current }}'
    - condition: trigger
      id:
      - 'Off'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - 'On'
      sequence:
      - action: notify.duncan
        data:
          title: "\U0001F319 Night Battery Charging Decision"
          message: 'Charging started at {{ now().strftime(''%H:%M'') }}

            SOC: {{ state_attr(''binary_sensor.charge_battery_at_night'',''soc_percent'')|round(0)
            }}% ({{ state_attr(''binary_sensor.charge_battery_at_night'',''usable_kwh'')|round(2)
            }} kWh usable), Solar: {{ state_attr(''binary_sensor.charge_battery_at_night'',''forecast_selected_kwh'')|round(2)
            }} kWh -> Available Energy: {{ (state_attr(''binary_sensor.charge_battery_at_night'',''total_energy_kwh'')
            + state_attr(''binary_sensor.charge_battery_at_night'',''applied_buffer_kwh''))
            | round(2) }} kWh

            SoC Buffer: {{ state_attr(''binary_sensor.charge_battery_at_night'',''minimum_soc_kwh'')|round(2)
            }} kWh, Solar Buffer: {{ state_attr(''binary_sensor.charge_battery_at_night'',''dynamic_margin_kwh'')|round(2)
            }} kWh -> Used Buffer: {{ state_attr(''binary_sensor.charge_battery_at_night'',''applied_buffer_kwh'')|round(2)
            }} kWh

            Target: {{ state_attr(''binary_sensor.charge_battery_at_night'',''effective_target_kwh'')|round(2)
            }} kWh, wanted: {{(state_attr(''binary_sensor.charge_battery_at_night'',
            ''target_kwh'') | float(0)) | round(1)

            }} kWh + {{ state_attr(''binary_sensor.charge_battery_at_night'',''charge_offset_kwh'')}}
            kWh (+{{ state_attr(''binary_sensor.charge_battery_at_night'',''battery_charge_percent_offset'')
            | default(states(''input_number.battery_charge_percent_offset''), true)
            | float(0) | round(0) }}% SoC) -> missing {{ state_attr(''binary_sensor.charge_battery_at_night'',''effective_missing_kwh'')|round(2)
            }} kWh

            {% set remaining_sec = (state_attr(''binary_sensor.charge_battery_at_night'',''remaining_hours'')
            | default(4.83, true) | float) * 3600 %}{% set ts = time_since(now() -
            timedelta(seconds=remaining_sec), 2) %}{% set parts = ts | regex_findall(''(\d+)\s*(\w+)'')
            %}{% set ns_shorts = namespace(short_parts=[]) %}{% for p in parts %}{%
            set ns_shorts.short_parts = ns_shorts.short_parts + [p[0] ~ p[1][:1]]
            %}{% endfor %}

            Charging to {{ state_attr(''binary_sensor.charge_battery_at_night'',''offset_charge_target_percent'')|round(0)
            }}% @ {{ state_attr(''binary_sensor.charge_battery_at_night'',''required_charge_amps'')|round(0)
            }}A in {{ ns_shorts.short_parts | join('' '') }} -> saving {{ "{:.2f}".format(state_attr(''binary_sensor.charge_battery_at_night'',''saved_cost_eur'')|float(0))
            }} €'
          data:
            tag: night_battery_charge1
      - action: script.retry_action_with_backoff
        metadata: {}
        data:
          action_domain: switch
          action_type: turn_on
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: simple
          notify_on_failure: true
          notify_service: notify.duncan
          entity_id: switch.esp32_s3_zero_deye8k_battery_charge_grid
          target_state: 'on'
      - action: number.set_value
        metadata: {}
        data:
          value: '{% set target = state_attr(''binary_sensor.charge_battery_at_night'',
            ''offset_charge_target_percent'') | float(0) %}

            {{ [ (target | round(0, ''ceil'')), 100 ] | min }}'
        target:
          entity_id: number.esp32_s3_zero_deye8k_battery_charge_from_grid_upto
      - action: number.set_value
        metadata: {}
        data:
          value: '0'
        target:
          entity_id: number.esp32_s3_zero_deye8k_time_point_1_power
      - action: input_number.set_value
        metadata: {}
        data:
          value: '{{ (states(''input_number.save_through_night_battery_charging'')
            | float(0)) + (state_attr(''binary_sensor.charge_battery_at_night'',''saved_cost_eur'')
            | float(0)) }}'
        target:
          entity_id: input_number.save_through_night_battery_charging
      - action: script.retry_action_with_backoff
        metadata: {}
        data:
          action_domain: switch
          action_type: turn_on
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: simple
          notify_on_failure: true
          notify_service: notify.duncan
          target_state: 'on'
          entity_id: switch.esp32_s3_zero_deye8k_battery_charge_external_amp_control
      - action: number.set_value
        metadata: {}
        target:
          entity_id: number.esp32_s3_zero_deye8k_maximum_battery_grid_charge_current
        data:
          value: '{{ state_attr(''binary_sensor.charge_battery_at_night'',''required_charge_amps'')
            | default(30, true) | int }}'
      - action: script.retry_action_with_backoff
        metadata: {}
        data:
          action_domain: switch
          action_type: turn_on
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: linear
          notify_on_failure: true
          notify_service: notify.duncan
          target_state: 'on'
          entity_id: switch.bett_powerbank_charger
    - conditions:
      - condition: trigger
        id:
        - 'Off'
      sequence:
      - action: script.retry_action_with_backoff
        metadata: {}
        data:
          action_domain: switch
          action_type: turn_off
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: simple
          notify_on_failure: true
          notify_service: notify.duncan
          entity_id: switch.esp32_s3_zero_deye8k_battery_charge_grid
          target_state: 'off'
      - action: number.set_value
        metadata: {}
        data:
          value: '7000'
        target:
          entity_id: number.esp32_s3_zero_deye8k_time_point_1_power
      - action: script.retry_action_with_backoff
        metadata: {}
        data:
          action_domain: switch
          action_type: turn_off
          max_retries: 10
          base_delay: 5
          backoff_type: linear
          notify_on_failure: true
          notify_service: notify.duncan
          entity_id: switch.esp32_s3_zero_deye8k_battery_charge_external_amp_control
          target_state: 'off'
          max_delay: 120
      - action: script.retry_action_with_backoff
        metadata: {}
        data:
          action_domain: switch
          action_type: turn_off
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: linear
          notify_on_failure: true
          notify_service: notify.duncan
          target_state: 'off'
          entity_id: switch.bett_powerbank_charger
    - conditions:
      - condition: trigger
        id:
        - amps
      sequence:
      - action: script.retry_action_with_backoff
        metadata: {}
        data:
          action_domain: switch
          action_type: turn_on
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: simple
          notify_on_failure: true
          notify_service: notify.duncan
          target_state: 'on'
          entity_id: switch.esp32_s3_zero_deye8k_battery_charge_external_amp_control
      - action: number.set_value
        metadata: {}
        target:
          entity_id: number.esp32_s3_zero_deye8k_maximum_battery_grid_charge_current
        data:
          value: '{{ state_attr(''binary_sensor.charge_battery_at_night'',''required_charge_amps'')
            | default(30, true) | int }}'
    - conditions:
      - condition: trigger
        id:
        - SoC target
      sequence:
      - action: number.set_value
        metadata: {}
        target:
          entity_id:
          - number.esp32_s3_zero_deye8k_battery_charge_from_grid_upto
        data:
          value: '{% set target = state_attr(''binary_sensor.charge_battery_at_night'',''offset_charge_target_percent'')
            | float(0) %} {{ [ (target | round(0, ''ceil'')), 100 ] | min }}'
  mode: parallel
  max: 10
- id: '1763753257619'
  alias: Notify on Terrarium Sensor Failure
  description: "  ## ⚡ Terrarium DHT Sensor Failure & Recovery Monitoring\n\n  ###
    \U0001F4CB **Intelligent DHT Sensor Monitoring**\n\n  This automation monitors
    the three DHT22 sensors in the terrarium (**Left**,\n  **Middle**, **Right**)
    via a central status sensor. \n\n  It manages the full lifecycle of the alert:
    triggering a notification when sensors\n  fail and **automatically clearing**
    that notification once the issue is resolved.\n\n  ---\n\n  ### ⏰ **Trigger Overview**\n\n
    \ | ID | Entity | Condition | Purpose |\n  |:---|:---|:---|:---|\n  | `Error`
    | `sensor.esp32_c3_mini_terra_dht_status` | From `\"All Good\"` for 30s | Detects
    when one or more sensors fail. |\n  | `Clear` | `sensor.esp32_c3_mini_terra_dht_status`
    | To `\"All Good\"` for 30s | Detects when all sensors are back online. |\n\n
    \ ---\n\n  ### ⚡ **Actions & Logic**\n\n  The automation uses a `choose` block
    to handle the two trigger IDs:\n\n  **1. Trigger: `Error`**\n  * **Action:** Sends
    a notification to Duncan with the title **\"DHT Sensor Problem\"**.\n  * **Dynamic
    Logic:** * Splits the status string to identify specific broken sensors.\n      *
    Formats the message for singular (*\"The Left DHT sensor...\"*) or plural (*\"The
    Left & Middle DHT sensors...\"*).\n  * **Tracking:** Uses the tag `dht_sensor_problem`
    to group the notification.\n\n  **2. Trigger: `Clear`**\n  * **Action:** Sends
    the `clear_notification` command using the `dht_sensor_problem` tag.\n  * **Result:**
    Removes the existing error notification from Duncan's device once the sensors
    are fixed.\n\n  ---\n\n  ### ⚙️ **Technical Overview**\n\n  * **Mode:** `single`
    — prevents overlapping execution logic.\n  * **Persistence:** Uses `tag: dht_sensor_problem`
    to ensure the recovery trigger knows exactly which notification to dismiss.\n
    \ * **Reliability:** A 30-second sustained state is required for both error and
    recovery to prevent \"flapping\" notifications due to momentary signal drops.\n\n
    \ ---\n\n  ### \U0001F4A1 **Status Mapping**\n  The logic expects `sensor.esp32_c3_mini_terra_dht_status`
    to report:\n  * `All Good` when healthy.\n  * Space-separated names (e.g., `Left
    Middle`) when failing."
  triggers:
  - trigger: state
    entity_id:
    - sensor.esp32_c3_mini_terra_dht_status
    from:
    - All Good
    to:
    for:
      hours: 0
      minutes: 0
      seconds: 30
    id: Error
  - trigger: state
    entity_id:
    - sensor.esp32_c3_mini_terra_dht_status
    to:
    - All Good
    id: Clear
    for:
      hours: 0
      minutes: 0
      seconds: 30
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Error
      sequence:
      - action: notify.duncan
        metadata: {}
        data:
          title: DHT Sensor Problem
          message: "\n  {% set broken = states('sensor.esp32_c3_mini_terra_dht_status')
            %}\n  {% if broken != \"All Good\" %}\n    {% set sensors = broken.split('
            ') %}\n    {% if sensors | length == 1 %}\n      The {{ sensors[0] }}
            DHT sensor is broken. Check the wiring.\n    {% else %}\n      The {{
            sensors[:-1] | join(', ') }} & {{ sensors[-1] }} DHT sensors are broken.
            Check the wiring.\n    {% endif %}\n  {% endif %}\n"
          data:
            tag: dht_sensor_problem
    - conditions:
      - condition: trigger
        id:
        - Clear
      sequence:
      - action: notify.duncan
        metadata: {}
        data:
          data:
            tag: dht_sensor_problem
          message: clear_notification
  mode: single
- id: '1763821325453'
  alias: Terrarium Humidifier Auto-Off
  description: "\U0001F98E **Terrarium Humidifier Auto-Off**\n\n---\n\n### \U0001F4CB
    Intelligent Humidification Safety Control\n\n**High-level intent**\nThis automation
    serves as a safety watchdog for the terrarium environment, ensuring that the humidification
    system does not run indefinitely. It monitors the active state of the hardware
    and enforces a strict operational window.\n\n**Operational strategy**\nThe system
    employs a polling-based safety check rather than a simple state-change trigger.
    By evaluating conditions every two minutes, it ensures that even if a single event-based
    trigger were missed, the \"off\" command would be issued shortly thereafter once
    the duration threshold is met.\n\n**Reliability mechanisms**\nTo overcome potential
    Zigbee mesh interference or \"popcorn effect\" command drops, this automation
    utilizes a robust **retry script with backoff**. If the initial command fails,
    the system will attempt to turn off the switch up to 10 times with increasing
    delays.\n\n---\n\n### Trigger Overview Table\n\n| Type | Entity / Condition |
    ID | Purpose |\n| :--- | :--- | :--- | :--- |\n| **Time Pattern** | Every **2
    minutes** | N/A | Periodic heartbeat check to verify device state and runtime
    duration. |\n\n---\n\n### Operational Logic Sections\n\n#### Normal Shutdown Mode\n**Purpose**\nEnforce
    a maximum duty cycle for the humidification hardware to prevent over-saturation
    of the terrarium and protect the motor from burnout.\n\n**Logic Overview**\nThe
    automation executes only if **input_boolean.terrarium_on** is **on** (Global System
    Enable) AND **switch.terrarium_zigbee_l1** has been continuously **on** for at
    least **10 minutes**.\n\n**Effect**\nTriggers the **script.retry_action_with_backoff**
    to transition **switch.terrarium_zigbee_l1** to the **off** state.\n\n---\n\n###
    Technical Overview\n\n* **Automation Mode**: `restart` (Ensures the most recent
    trigger takes precedence during execution)\n* **Execution method**: External retry
    script (**script.retry_action_with_backoff**)\n* **Key Inputs**: `input_boolean.terrarium_on`\n*
    **Controlled Entities**: `switch.terrarium_zigbee_l1`\n* **Safety Mechanisms**:
    \n    * **Max Retries**: 10 attempts\n    * **Backoff**: Simple increment (5s
    to 60s)\n    * **Failure Notification**: Sends an alert via **notify.duncan**
    if the device fails to turn off after all retries.\n\n---\n\n### \U0001F4A1 Notes\n\n*
    **Polling Strategy**: Using a `/2` minute time pattern instead of a `state` trigger
    provides an extra layer of redundancy. If the Home Assistant core restarts exactly
    at the 10-minute mark of a cycle, the time pattern will catch the \"over-time\"
    state on the next sweep.\n* **Retry Logic**: The use of a backoff algorithm (5s
    base to 60s max) is specifically designed to bypass temporary Zigbee interference
    or network congestion.\n* **Silent Throttling**: The `max_exceeded: silent` configuration
    prevents logbook clutter during rapid state evaluations.\n"
  triggers:
  - trigger: time_pattern
    minutes: /2
  conditions:
  - condition: state
    entity_id: input_boolean.terrarium_on
    state:
    - 'on'
  - condition: state
    entity_id: switch.terrarium_zigbee_l1
    state:
    - 'on'
    for:
      hours: 0
      minutes: 10
      seconds: 0
  actions:
  - action: script.retry_action_with_backoff
    metadata: {}
    data:
      action_domain: switch
      action_type: turn_off
      max_retries: 10
      base_delay: 5
      max_delay: 60
      backoff_type: simple
      notify_on_failure: true
      notify_service: notify.duncan
      entity_id: switch.terrarium_zigbee_l1
      target_state: 'off'
  mode: restart
  max_exceeded: silent
- id: '1763832773682'
  alias: Daily Mama Temperature Notification
  description: "\n  ## \U0001F321️ Daily Mama Temperature Notification\n\n  ### \U0001F4CB
    **Automated Temperature Snapshot for Key Areas**\n\n  This automation sends a
    daily **14:00 temperature update** summarizing both the **current temperature**
    and the **lowest temperature measured in the last 24 hours** for important monitored
    locations.  \n  It ensures a consistent daily overview of temperature trends without
    requiring manual checking.\n\n  ---\n\n  ### ⏱ **Trigger Overview**\n\n  | Trigger
    | Description | ID |\n  |--------|-------------|----|\n  | `14:00` | Daily report
    time | daily_temperature_trigger |\n\n  ---\n\n  ### ✅ **Logic Summary**\n\n  -
    Runs exactly once per day at 14:00.\n  - Gathers the current temperature and the
    minimum temperature in the last 24 hours for two monitored areas.\n  - Formats
    the values neatly in a push notification.\n  - Sends the notification to the FP4
    mobile device using Home Assistant's mobile notify service.\n\n  ---\n\n  ###
    ⚙️ **Action Workflow**\n\n  #### Temperature Data Collection\n  - Reads the **current
    temperature** from:\n    - `sensor.t_h_garage_zigbee_temperature` (Garage)\n    -
    `sensor.esp32_c3_zero_epever_bme280_temperature` (Gartenhaus / EPEver Node)\n\n
    \ - Reads the **minimum temperatures** from the last 24 hours via:\n    - `sensor.temperatur_min`\n
    \   - `sensor.bme280_temperature_min`\n\n  - Each value is rounded to 2 decimal
    places and gracefully falls back to `0` if unavailable.\n\n  #### Notification
    Delivery\n  - Constructs a structured message including:\n    - Area names (resolved
    dynamically via `area_name()`)\n    - Current temperature\n    - Minimum temperature
    \ \n  - Sends the notification using:\n    - `notify.mobile_app_fp4`\n  - Adds
    a unique tag: `daily_temperature_garage_gartenhaus`  \n    (ensures newer updates
    replace older ones rather than stacking)\n\n  ---\n\n  ### \U0001F527 **Technical
    Details**\n\n  - **Mode:** `single`  \n    Prevents overlapping notifications
    if HA restarts around 14:00.\n  - **Sensors Included:**  \n    - Garage Zigbee
    T/H sensor  \n    - ESP32-C3 EPEver BME280 temperature sensor  \n    - Min-temp
    helper sensors for each area\n  - **Notification Target:**  \n    - `mobile_app_fp4`\n\n
    \ ---\n\n  ### \U0001F324️ **Design Notes**\n\n  - Provides a simple, reliable
    daily temperature overview for outdoor or utility zones.\n  - Uses area names
    dynamically so messages remain correct even if devices move.\n  - The minimum-temperature
    tracking allows spotting cold nights or unexpected drops.\n  - Clean formatting
    enhances readability in the mobile app."
  triggers:
  - trigger: time
    at: '14:00:00'
  conditions: []
  actions:
  - action: notify.mobile_app_fp4
    data:
      title: Temperatur-Update
      message: "{{ area_name('sensor.t_h_garage_zigbee_temperature') | default('Garage')
        }}:\n  - Aktuell: {{ states('sensor.t_h_garage_zigbee_temperature') | float(0)
        | round(2) }} °C\n  - Min letzte 24h: {{ states('sensor.temperatur_min') |
        float(0) | round(2)}} °C\n\n{{ area_name('sensor.esp32_c3_zero_epever_bme280_temperature')
        | default('Gartenhaus') }}:\n  - Aktuell: {{ states('sensor.esp32_c3_zero_epever_bme280_temperature')
        | float(0) | round(2) }} °C\n  - Min letzte 24h: {{ states('sensor.bme280_temperature_min')
        | float(0) | round(2) }} °C"
      data:
        tag: daily_temperature_garage_gartenhaus
  - action: notify.mobile_app_stephan_iphone
    data:
      title: Temperatur-Update
      message: "{{ area_name('sensor.t_h_garage_zigbee_temperature') | default('Garage')
        }}:\n  - Aktuell: {{ states('sensor.t_h_garage_zigbee_temperature') | float(0)
        | round(2) }} °C\n  - Min letzte 24h: {{ states('sensor.temperatur_min') |
        float(0) | round(2)}} °C\n\n{{ area_name('sensor.esp32_c3_zero_epever_bme280_temperature')
        | default('Gartenhaus') }}:\n  - Aktuell: {{ states('sensor.esp32_c3_zero_epever_bme280_temperature')
        | float(0) | round(2) }} °C\n  - Min letzte 24h: {{ states('sensor.bme280_temperature_min')
        | float(0) | round(2) }} °C"
      data:
        tag: daily_temperature_garage_gartenhaus
  mode: single
- id: '1764102977901'
  alias: Adjust Battery Energy Target based on Today's Consumption
  description: "\U0001F50B **Battery Target Optimization**\n\n---\n\n### \U0001F4CB
    Intelligent Energy Storage Control\n\nThis automation dynamically calculates and
    sets the required energy storage target for the upcoming overnight charging cycle.
    By analyzing the day's consumption patterns and potential requirements, it ensures
    the battery is provisioned with exactly enough energy to meet the household's
    needs while minimizing unnecessary grid reliance.\n\n* **High-level intent:**
    Synchronize overnight charging targets with actual consumption trends.\n* **Operational
    strategy:** Data-driven adjustment performed at the end of the daily cycle.\n*
    **Reliability mechanisms:** Uses a robust templating engine with defined `clamp`
    boundaries (15–1000) and fail-safe defaults to prevent invalid input states.\n\n---\n\n###
    Trigger Overview Table\n\n| Type | Entity / Condition | ID | Purpose |\n| :---
    | :--- | :--- | :--- |\n| **Time** | 23:59:55 | N/A | Finalizes the daily calculation
    just before the calendar date rolls over. |\n\n---\n\n### Operational Logic Sections\n\n####
    End-of-Day Calculation\n* **Purpose:** To update the **Night Charge Target** based
    on the calculated potential requirement of the residence.\n* **Logic Overview:**
    Evaluates the `potential_target` attribute of the **Charge Battery at Night**
    sensor. If the value is missing or invalid, it defaults to **0** before being
    passed to safety clamping.\n* **Effect:** Updates the **input_number.night_charge_target**
    with a value between **15** and **1000**.\n\n---\n\n### Technical Overview\n\n*
    **Automation Mode:** `single` (Prevents overlapping execution during the state
    update).\n* **Execution method:** Direct state service call to `input_number.set_value`.\n*
    **Key Inputs:** `binary_sensor.charge_battery_at_night` (Specifically the `potential_target`
    attribute).\n* **Controlled Entities:** `input_number.night_charge_target`.\n*
    **Safety Mechanisms:** Employs a `clamp(15, 1000)` filter to ensure the target
    never drops below a critical floor or exceeds the maximum physical storage capacity/logic
    limit.\n\n---\n\n### \U0001F4A1 Notes\n\n* **Threshold Rationale:** The minimum
    clamp of **15** ensures a baseline reserve is always maintained, even if the daily
    consumption sensor reports negligible usage.\n* **Precision Timing:** Executing
    at **23:59:55** allows the automation to capture the most complete dataset for
    the current day without conflicting with \"Daily\" sensor resets that typically
    occur at exactly 00:00:00."
  triggers:
  - trigger: time
    at: '23:59:55'
  conditions: []
  actions:
  - action: input_number.set_value
    metadata: {}
    data:
      value: '{{ state_attr(''binary_sensor.charge_battery_at_night'',''potential_target'')
        | default(0, true) | float(0) | clamp(15, 1000) }}


        '
    target:
      entity_id: input_number.night_charge_target
  mode: single
- id: '1764427174379'
  alias: Auto Treppe Licht
  description: Automatically turns the stairway light on or off based on ambient brightness,
    using a retry script to ensure reliability.
  triggers:
  - trigger: numeric_state
