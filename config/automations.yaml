        - action: select.select_option
          metadata: {}
          data:
            option: Don't charge
          target:
            entity_id:
            - select.go_echarger_270862_frc
        custom_target_state: Don't charge
    - action: script.retry_action_with_backoff
      metadata: {}
      data:
        max_retries: 10
        base_delay: 5
        max_delay: 60
        backoff_type: simple
        notify_on_failure: true
        notify_service: notify.duncan
        entity_id: select.go_echarger_252682_frc
        target_state: custom
        custom_action:
        - action: select.select_option
          metadata: {}
          data:
            option: Don't charge
          target:
            entity_id:
            - select.go_echarger_252682_frc
        custom_target_state: Don't charge
  mode: parallel
