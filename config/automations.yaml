- id: '1740741927183'
  alias: Turn off Trockner or Waschmaschine fertig using Button
  description: "\n  ## \U0001F9FA Laundry Reset Automation\n\n  ### \U0001F4CB **Clear
    Appliance Completion States via Button Press**\n\n  This automation resets the
    *completion status* of either the dryer (`input_boolean.trockner_fertig`) or the
    washing machine (`input_boolean.waschmaschine_fertig`) whenever their assigned
    button is pressed.  \n  It ensures that once the laundry is removed and the user
    acknowledges it by pressing the button, the “done” indicator is turned off to
    keep appliance status tracking accurate.\n\n  ---\n\n  ### ⏰ **Triggers**\n\n
    \ | Device / Button | Action Type | Appliance | Trigger ID |\n  |-----------------|-------------|-----------|-------------|\n
    \ | `button_1` | Single / Double Press | Dryer | `Trockner` |\n  | `button_2`
    | Single / Double Press | Washing Machine | `Waschmaschine` |\n\n  > Each appliance
    can be reset with **either a single or double press** on its assigned button.\n\n
    \ ---\n\n  ### ✅ **Conditions**\n\n  - The chosen appliance must currently have
    its completion flag set:\n    - Dryer → `input_boolean.trockner_fertig = on`\n
    \   - Washing Machine → `input_boolean.waschmaschine_fertig = on`\n\n  If the
    appliance is *not* marked as finished, the press does nothing.\n\n  ---\n\n  ###
    \U0001F3AF **Actions / Workflow**\n\n  1. **Dryer Reset**\n     - Triggered by
    `Trockner` button.\n     - If `input_boolean.trockner_fertig = on`, turn it off.\n\n
    \ 2. **Washing Machine Reset**\n     - Triggered by `Waschmaschine` button.\n
    \    - If `input_boolean.waschmaschine_fertig = on`, turn it off.\n\n  > Both
    paths ensure the completion indicator is cleared only when appropriate.\n\n  ---\n\n
    \ ### \U0001F527 **Technical Specs**\n\n  - **Mode:** `single` (no overlapping
    runs).\n  - **Controlled Entities:**\n    - `input_boolean.trockner_fertig`\n
    \   - `input_boolean.waschmaschine_fertig`\n  - **Input Device:**  \n    - MQTT
    button with two mapped sub-buttons (dryer / washer).\n\n  ---\n\n  ### \U0001F4DD
    **Notes**\n\n  - The automation supports both *single* and *double* presses for
    convenience.  \n  - Prevents stale “done” states if a cycle has already been cleared.
    \ \n  - Keeps laundry task tracking consistent across appliances."
  triggers:
  - domain: mqtt
    device_id: 7be1308679cc0cfa3cc595fe650e29ed
    type: action
    subtype: button_1_single
    metadata: {}
    trigger: device
    id: Trockner
    alias: Trockner
  - alias: Trockner
    domain: mqtt
    device_id: 7be1308679cc0cfa3cc595fe650e29ed
    type: action
    subtype: button_1_double
    trigger: device
    id: Trockner
  - domain: mqtt
    device_id: 7be1308679cc0cfa3cc595fe650e29ed
    type: action
    subtype: button_2_single
    trigger: device
    id: Waschmaschine
    alias: Waschmaschine
  - alias: Waschmaschine
    domain: mqtt
    device_id: 7be1308679cc0cfa3cc595fe650e29ed
    type: action
    subtype: button_2_double
    trigger: device
    id: Waschmaschine
  - trigger: numeric_state
    entity_id:
    - sensor.trockner_lauft_seit
    above: 5
    id: Waschmaschine
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Trockner
      - condition: state
        entity_id: input_boolean.trockner_fertig
        state: 'on'
      sequence:
      - action: input_boolean.turn_off
        metadata: {}
        data: {}
        target:
          entity_id: input_boolean.trockner_fertig
      alias: Trockner
    - conditions:
      - condition: trigger
        id:
        - Waschmaschine
      - condition: state
        state: 'on'
        entity_id: input_boolean.waschmaschine_fertig
      sequence:
      - action: input_boolean.turn_off
        metadata: {}
        data: {}
        target:
          entity_id:
          - input_boolean.waschmaschine_fertig
      alias: Waschmaschine
  mode: single
- id: '1741093435280'
  alias: Set Herd CT Clamp Update Frequency at Startup and every 8 Hours
  description: "## ⚡ Herd CT Clamp Update Frequency Control\n\n### \U0001F4CB Purpose\nKeeps
    the Herd CT clamp sensor (`number.herd_ct_klemme_zigbee_update_frequency`) configured
    to a **20-second update interval**, ensuring reliable and consistent reporting
    of current measurements.\n\n---\n\n### ⏱ Triggers\n- **Home Assistant startup**
    → sets frequency after system boots.\n- **Every 8 hours** → re-applies frequency
    setting for robustness (e.g., if device resets).\n- **Entity state change** →
    immediately re-applies the correct frequency if the value is modified manually
    or by other automations.\n\n---\n\n### ✅ Conditions\n- No global conditions, runs
    unconditionally.\n\n---\n\n### \U0001F3AF Actions\n- Waits **5 seconds** after
    trigger to ensure the entity is initialized and ready.  \n- Calls `number.set_value`
    on `number.herd_ct_klemme_zigbee_update_frequency` to enforce the configured interval
    (value: `20` → corresponds to 20s updates).\n\n---\n\n### \U0001F527 Technical
    Notes\n- Mode: `single` → prevents overlapping executions.  \n- The **hourly trigger**
    ensures long-term stability even if the device silently resets its reporting interval.
    \ \n- The **entity state trigger** catches accidental or external changes to the
    setting.  \n- Delay ensures that HA startup doesn’t fail if the entity is still
    initializing."
  triggers:
  - trigger: homeassistant
    event: start
  - trigger: time_pattern
    hours: /8
  - trigger: state
    entity_id:
    - number.herd_ct_klemme_zigbee_update_frequency
  conditions: []
  actions:
  - delay:
      hours: 0
      minutes: 0
      seconds: 5
      milliseconds: 0
  - action: number.set_value
    metadata: {}
    data:
      value: '20'
    target:
      entity_id: number.herd_ct_klemme_zigbee_update_frequency
  mode: single
  max_exceeded: silent
- id: '1741102167233'
  alias: Publish Energy Data to MQTT
  description: "## \U0001F4E1 Publish Energy Data to MQTT  \n\n### \U0001F4CB **Real-Time
    Energy Telemetry**  \nPublishes grid, battery, SOC, and net solar power to MQTT
    topics for external systems.  \nOnly runs when certain devices (chargers or power
    strips) are active to prevent unnecessary updates.  \n\n---\n\n### ⏰ **Triggers**
    \ \n\n| Entity | Event |\n|--------|-------|\n| `sensor.grid_power` | Any state
    change |\n| `sensor.solar_power_total` | Any state change |\n| `sensor.battery_discharge`
    | Any state change |\n| `sensor.felicity_ess_soc_avg` | Any state change |\n\n\n---\n\n###
    ✅ **Conditions**  \nAutomation runs only if at least one of these is **on**:  \n\n-
    `binary_sensor.esp32_c3_mini_goe11_controll_status_11kw`  \n- `binary_sensor.esp32_c3_mini_goe22_controll_status_22kw`
    \ \n- `switch.schreibtisch_links_power_strip_l3`  \n\n**and**\n> ⚠️ Triggered
    at most **once every 5 seconds** to avoid flooding MQTT.\n---\n\n### \U0001F3AF
    **MQTT Publish Mapping**  \n\n| Topic | Sensor / Payload |\n|-------|-----------------|\n|
    `grid/power` | `sensor.grid_power` |\n| `grid/solar` | `sensor.solar_power_total`
    |\n| `grid/battery` | `sensor.battery_discharge` |\n| `grid/soc` | `sensor.felicity_ess_soc_avg`
    |\n\n> **Note:** `grid/solar`  reflects **net solar production**. If you want
    net solar (after battery charging), subtract `sensor.battery_charge` inside the
    payload.  \n\n---\n\n### \U0001F527 **Technical Specs**  \n- **Sensors Used:**
    `sensor.grid_power`, `sensor.solar_power_total`, `sensor.battery_discharge`, `sensor.felicity_ess_soc_avg`
    \ \n- **Mode:** `parallel` (max 10 concurrent)  \n- **Efficiency:** Only runs
    when chargers or desk strip are powered  \n- **Throttle:** Runs at most every
    5 seconds to prevent MQTT flooding"
  triggers:
  - trigger: state
    entity_id:
    - sensor.grid_power
    - sensor.solar_power_total
    - sensor.battery_discharge
    - sensor.felicity_ess_soc_avg
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: binary_sensor.esp32_c3_mini_goe11_controll_status_11kw
      state: 'on'
    - condition: state
      entity_id: binary_sensor.esp32_c3_mini_goe22_controll_status_22kw
      state: 'on'
    - condition: state
      entity_id: switch.schreibtisch_links_power_strip_l3
      state: 'on'
  - condition: template
    value_template: '{{ now() - (state_attr(this.entity_id, ''last_triggered'') |
      default( as_datetime(''0''), true)) >= timedelta(seconds=5) }}'
  actions:
  - action: mqtt.publish
    metadata: {}
    data:
      evaluate_payload: false
      topic: grid/power
      payload: '{{ states(''sensor.grid_power'') | float(0) }}'
  - action: mqtt.publish
    metadata: {}
    data:
      evaluate_payload: false
      topic: grid/solar
      payload: '{{ states(''sensor.solar_power_total'') | float(0) - states(''sensor.battery_charge'')
        | float(0) }}'
  - action: mqtt.publish
    metadata: {}
    data:
      topic: grid/battery
      payload: '{{ states(''sensor.battery_discharge'') | float(0) }}'
  - action: mqtt.publish
    metadata: {}
    data:
      topic: grid/soc
      payload: '{{ states(''sensor.felicity_ess_soc_avg'') | float(0) }}'
  mode: parallel
  max: 10
- id: '1742316986881'
  alias: Wall Panel Display Control
  description: "## \U0001F5A5 Wall Panel Display Control Automation\n\n### \U0001F4CB
    Purpose\nManages the Lenovo Tab P11 wall panel display to optimize usage and reduce
    unnecessary power consumption:\n\n- Turns **off** the display every night at **23:00**.\n-
    Turns **on** the display at **sunrise**.\n- If the display is manually or automatically
    switched on **after 23:00** but before sunrise, it will automatically switch **off
    after 15 seconds**.\n\n---\n\n### ⏱ Triggers\n- **23:00 time trigger** → forces
    display off.\n- **Sunrise event** → turns the display back on.\n- **State trigger**
    on `switch.lenovo_tab_p11_bildschirmschoner` to detect manual/other activations:\n
    \ - Fires if the screensaver switch changes **to `on` for 15 seconds**.\n\n---\n\n###
    ✅ Conditions\n- No global conditions.\n- Inside **Bildschirm changed** sequence:\n
    \ - Ensures the current time is **between 23:00 and sunrise**.\n  - Ensures `switch.lenovo_tab_p11_bildschirm`
    is still `on` before forcing it off.\n\n---\n\n### \U0001F3AF Actions\n- **Display
    Off at 23:00 (`Display Off`)**  \n  → Turns off `switch.lenovo_tab_p11_bildschirm`.\n-
    **Display On at Sunrise (`Display On`)**  \n  → Turns on `switch.lenovo_tab_p11_bildschirm`.\n-
    **Screen On after Midnight (`Bildschirm changed`)**  \n  → If screensaver is on
    after 23:00 and before sunrise:\n    - Waits 15 seconds.\n    - Then switches
    off the display.\n\n---\n\n### \U0001F527 Technical Notes\n- Mode: `single` →
    prevents overlapping executions.  \n- `max_exceeded: silent` → avoids log spam
    if retriggers happen quickly.  \n- Uses both **time** and **sun events** for robust
    scheduling.  \n- The delayed off sequence ensures the display won’t stay on unintentionally
    during the night."
  triggers:
  - trigger: time
    at: '23:00:00'
    id: Display Off
  - trigger: sun
    event: sunrise
    offset: 0
    id: Display On
  - trigger: state
    entity_id:
    - switch.lenovo_tab_p11_bildschirmschoner
    id: Display changed
    to: 'on'
    for:
      hours: 0
      minutes: 0
      seconds: 15
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Display Off
      sequence:
      - action: switch.turn_off
        metadata: {}
        data: {}
        target:
          entity_id:
          - switch.lenovo_tab_p11_bildschirm
      alias: Mitternacht -> Bildschirm Aus
    - conditions:
      - condition: trigger
        id:
        - Display On
      sequence:
      - action: switch.turn_on
        metadata: {}
        data: {}
        target:
          entity_id:
          - switch.lenovo_tab_p11_bildschirm
      alias: Sunrise -> Bildschirm An
    - conditions:
      - condition: trigger
        id:
        - Display changed
      - condition: time
        after: '23:00:00'
        before: sensor.sun_next_rising
      - condition: state
        entity_id: switch.lenovo_tab_p11_bildschirm
        state: 'on'
      sequence:
      - delay:
          hours: 0
          minutes: 0
          seconds: 15
          milliseconds: 0
        enabled: true
      - action: switch.turn_off
        metadata: {}
        data: {}
        target:
          entity_id:
          - switch.lenovo_tab_p11_bildschirm
      alias: Bildschirm Aus wenn nach Mitternacht, vor Sonnenaufgang
  mode: single
  max_exceeded: silent
