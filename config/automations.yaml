- id: '1738339387324'
  alias: Orangina Lamp Light
  description: "## \U0001F34A Orangina Lamp Light\n\n### \U0001F4CB **Smart Brightness-Controlled
    Ambient Lighting**\nAutomatically manages the Orangina lamp based on light sensor
    readings with robust retry logic and multiple safety shutoff conditions.\n\n---\n\n###
    \U0001F506 **Turn ON Triggers**\n| Condition | Duration | Threshold |\n|-----------|----------|-----------|\n|
    **Light Level** | 30 seconds | `sensor.light_brighness` > **1 %** |\n| **Light
    Level** | 60 seconds | `sensor.light_brighness` > **1 %** |\n\n### \U0001F319
    **Turn OFF Triggers**\n\n#### **⏰ Time-Based**\n- **\U0001F55A 23:00** - Standard
    bedtime shutoff\n- **\U0001F550 01:00** - Force off (end time safety)\n\n####
    **\U0001F6CF️ Bedtime Detection** \n- When bed night-light turns **ON** (`switch.esp32_c3_mini_bett_nachtlicht_was_in_bed`)\n\n####
    **\U0001F305 Brightness-Based Sync**\n- When `sensor.light_brighness` drops **below
    1 %** for 30s or 60s\n\n---\n\n### \U0001F3AF **Smart Logic**\n\n#### **\U0001F506
    ON Action**\n```\n✅ Retry up to 10 times with 5s delays\n✅ Continues until switch
    confirms \"on\" state\n```\n\n#### **\U0001F319 OFF Actions** (3 scenarios)\n1.
    **\U0001F6CF️ Bedtime Mode** (22:59-04:00 + bed light ON + 23:00 trigger)\n2.
    **\U0001F305 Daytime Override** (04:00-20:00 + brightness sync trigger)  \n3.
    **⏰ Force Off** (00:59-04:00 + 01:00 end time trigger)\n\n```\n✅ Each scenario
    retries up to 10 times with 5s delays\n✅ Continues until switch confirms \"off\"
    state\n```\n\n---\n\n### \U0001F527 **Technical Specs**\n- **Target:** `light.orangina_local`\n-
    **Sensor:** `sensor.light_brighness` \n- **Mode:** `queued` (max 10 concurrent)\n-
    **Retry Logic:** 10 attempts × 5s delay for bulletproof switching\n"
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.light_brighness
    for:
      hours: 0
      minutes: 0
      seconds: 30
    above: 1
    id: 'On'
  - trigger: numeric_state
    entity_id:
    - sensor.light_brighness
    for:
      hours: 0
      minutes: 1
      seconds: 0
    above: 1
    id: 'On'
  - trigger: time
