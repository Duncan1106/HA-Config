            device_id: 09c4fe882d8dc5dfd424705fe962ada4
        - delay:
            hours: 0
            minutes: 0
            seconds: 30
      until:
      - condition: or
        conditions:
        - condition: numeric_state
          entity_id: sensor.tibber_bridge_0100020800ff_in_k
