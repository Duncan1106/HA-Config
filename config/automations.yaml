- id: '1751542900177'
  alias: Rollo Sommer Automatisch Steuern (mit Grund und Manueller Modus)
  description: 'Steuert den Wintergarten-Rolladen automatisch basierend auf dem Sensor
    inklusive Benachrichtigung mit Grund sowie Statusmeldungen zum manuellen Modus.

    '
  triggers:
  - trigger: state
    id: rollo_close
    entity_id:
    - binary_sensor.rollo_summer_should_close
    to: 'on'
    for:
      hours: 0
      minutes: 10
      seconds: 0
  - trigger: state
    id: rollo_open
    entity_id:
    - binary_sensor.rollo_summer_should_close
    to: 'off'
    for:
      hours: 0
      minutes: 15
      seconds: 0
  - trigger: state
    id: manual_on
    entity_id: input_boolean.rollo_summer_override
    to: 'on'
  - trigger: state
    id: manual_off
    entity_id: input_boolean.rollo_summer_override
    to: 'off'
  - trigger: state
    entity_id:
    - binary_sensor.rollo_summer_should_close
    attribute: not_raining
    to: '0'
    id: rollo_open
    for:
      hours: 0
      minutes: 1
      seconds: 0
  conditions:
  - condition: sun
    before: sunset
    after: sunrise
  actions:
  - choose:
    - alias: Rollo schließen
      conditions:
      - condition: trigger
        id: rollo_close
      - condition: state
        entity_id: input_boolean.rollo_summer_override
        state: 'off'
      - condition: not
        conditions:
        - condition: state
          entity_id: cover.wintergarten_rolladen_dachfenster
          state: closed
      sequence:
      - action: cover.close_cover
        target:
          entity_id: cover.wintergarten_rolladen_dachfenster
        data: {}
      - action: notify.duncan
        data:
          data:
            tag: rollo_close
          message: '☀️ wird geschlossen: {{ state_attr(''binary_sensor.rollo_summer_should_close'',
            ''reason'') or ''Kein Grund angegeben.'' }}

            '
          title: Rollo
    - alias: Rollo öffnen
      conditions:
      - condition: trigger
        id: rollo_open
      - condition: state
        entity_id: input_boolean.rollo_summer_override
        state: 'off'
      - condition: not
        conditions:
        - condition: state
          entity_id: cover.wintergarten_rolladen_dachfenster
          state: open
