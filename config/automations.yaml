- id: '1731148293801'
  alias: Automatic Backup Management
  description: "  ## ⚡ Automatic Backup Management\n\n  ### \U0001F4CB **Purpose**\n
    \ This automation schedules and manages Home Assistant backups at multiple\n  intervals:
    hourly, daily, weekly, monthly, and yearly.  \n  It applies retention rules, descriptive
    backup names, and selectively\n  includes/excludes folders and addons to optimize
    storage and restore workflows.\n\n  The automation ensures your Home Assistant
    system is regularly backed up\n  without manual intervention while keeping old
    backups according to defined\n  retention periods.\n\n  ---\n\n  ### ⏰ **Triggers**\n
    \ | Trigger Type        | Time / Interval | Trigger ID  |\n  |--------------------|----------------|------------|\n
    \ | Daily backup        | 02:30:00       | daily      |\n  | Hourly backup       |
    Every 4 hours  | backup_config     |\n\n  > **Note:** Hourly backups occur every
    N hours as defined by the `hours` pattern,  \n  daily backups are always scheduled
    at 2:30 AM.  \n\n  ---\n\n  ### ✅ **Conditions**\n  - None. Backup creation depends
    solely on the triggers and enabled intervals.  \n\n  ---\n\n  ### \U0001F3AF **Actions
    / Workflow**\n  **1. Yearly Backup**\n  - Trigger: Daily backup, only on Jan 1
    if `enable_yearly` is true.  \n  - Retention: Unlimited (`keep_days: null`).  \n
    \ - Includes: `config` folder.  \n  - Excludes: `media` folder, certain addons
    (e.g., InfluxDB).  \n  - Alias in actions: `\"Creating Yearly Backup\"`.\n\n  **2.
    Monthly Backup**\n  - Trigger: Daily backup, first day of month if `enable_monthly`
    is true.  \n  - Retention: 365 days.  \n  - Includes/excludes: same as yearly
    backup.  \n  - Alias: `\"Creating Monthly Backup\"`.\n\n  **3. Weekly Backup**\n
    \ - Trigger: Daily backup, Monday if `enable_weekly` is true.  \n  - Retention:
    ~30 days.  \n  - Alias: `\"Creating Weekly Backup\"`.\n\n  **4. Daily Backup**\n
    \ - Trigger: Daily backup if `enable_daily` is true.  \n  - Retention: 7 days.
    \ \n  - Alias: `\"Creating Daily Backup\"`.\n\n  **5. Hourly Backup**\n  - Trigger:
    Every 4 hours if `enable_hourly` is true.  \n  - Retention: 1 day.  \n  - Creates
    partial backups excluding media, share, ssl, addons, and database to reduce storage
    usage.  \n  - Alias: `\"Creating Hourly Partial Backup\"`.\n\n  **General Notes
    on Workflow**\n  - Each backup action generates a descriptive name:\n    - `HourlyBackup:
    Monday, 3:04 PM, January 2, 2006`\n    - `DailyBackup: Monday, January 2, 2006`\n
    \   - `Weekly/Monthly/YearlyBackup: Monday, January 2, 2006`\n  - Conditional
    logic checks whether to use “full backup action” or predefined backup steps.\n
    \ - Retention is managed per backup type.\n\n  ---\n\n  ### \U0001F527 **Technical
    Specs**\n  - **Mode:** `single` (prevents overlapping backup processes)  \n  -
    **Backup Storage Path:** `/share/NAS_Share/Backup/`  \n  - **Variables:**\n    -
    `password`: backup password  \n    - `enable_hourly`, `enable_daily`, `enable_weekly`,
    `enable_monthly`, `enable_yearly`  \n    - `use_action_hourly`: whether to use
    defined hourly backup actions  \n  - **Included Folders:** `config`  \n  - **Excluded
    Folders:** `media`, `share`, `ssl`, `addons`, `model_cache`  \n  - **Addon Exclusions:**
    e.g., InfluxDB (`a0d7b954_influxdb`)  \n\n  ---\n\n  ### ⚡ **Best Practices /
    Notes**\n  - Use descriptive names for each backup type for easy identification.
    \ \n  - Customize included/excluded folders per your needs.  \n  - Ensure `enable_*`
    variables reflect the desired backup frequency.  \n  - Partial hourly backups
    save space while still providing frequent restore points.  \n  - Can be extended
    for additional backup targets or intervals as needed."
  triggers:
  - id: daily
    at: 02:30:00
    trigger: time
  - id: backup_config
    enabled: true
    hours: /4
    trigger: time_pattern
  conditions: []
  actions:
  - if:
    - condition: trigger
      id: daily
      alias: Daily, Weekly, Monthly and Yearly Backup
    then:
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ enable_yearly }}'
        - condition: template
          value_template: '{{ now().day == 1 and now().month == 1 }}'
        sequence:
        - variables:
            backup_type: yearly
            keep_days:
        - variables:
            name: "{{ backup_type | title }}Backup: {{\n  now().strftime(\n    \"%A,
              \"\n    ~ iif(backup_type == \"hourly\", \"%H:%M, \", \"\")\n    ~ \"%B
              %-d, %Y\"\n  )\n}}\n{# HourlyBackup: Monday, 3:04 PM, January 2, 2006
              #}\n{# DailyBackup: Monday, January 2, 2006 #}\n"
            backup_action:
            - data:
                name: '{{ name }}'
                password: '{{ password }}'
                keep_days: '{{ keep_days }}'
                download_path:
                - /share/NAS_Share/Backup/
                exclude:
                  addons:
                  - a0d7b954_influxdb
                include_folders:
                - config
                exclude_folders:
                - media
              action: auto_backup.backup
        - if:
          - condition: template
            value_template: '{{ not use_action_hourly }}'
          - condition: template
            value_template: '{{ backup_action | length > 0 }}'
          then:
          - data:
              name: '{{ name }}'
              password: '{{ password }}'
              keep_days: '{{ keep_days }}'
              download_path:
              - /share/NAS_Share/Backup/
              include_folders:
              - config
              exclude_folders:
              - media
            action: auto_backup.backup
          else:
          - alias: Creating a full backup (default action)
            data:
              name: '{{ name }}'
              password: '{{ password }}'
              keep_days: '{{ keep_days }}'
              download_path:
              - /share/NAS_Share/Backup/
              exclude_folders:
              - media
            action: auto_backup.backup
        alias: Yearly Backup
      - conditions:
        - condition: template
          value_template: '{{ enable_monthly }}'
        - condition: template
          value_template: '{{ now().day == 1 }}'
        sequence:
        - variables:
            backup_type: monthly
            keep_days: 365
        - variables:
            name: "{{ backup_type | title }}Backup: {{\n  now().strftime(\n    \"%A,
              \"\n    ~ iif(backup_type == \"hourly\", \"%H:%M, \",\"\")\n    ~ \"%B
              %-d, %Y\"\n  )\n}}\n{# HourlyBackup: Monday, 3:04 PM, January 2, 2006
              #}\n{# DailyBackup: Monday, January 2, 2006 #}\n"
            backup_action:
            - data:
                name: '{{ name }}'
                password: '{{ password }}'
                keep_days: '{{ keep_days }}'
                download_path:
                - /share/NAS_Share/Backup/
                include_folders:
                - config
