- id: '1728376825897'
  alias: Bad Nachtlicht Motion
  description: "## \U0001F6BB Bad Nachtlicht Motion  \n\n### \U0001F4CB **Smart Bathroom
    Night Light Control**  \nAutomatically manages the bathroom night light based
    on **motion** and **ambient light levels**.  \n- Turns **on** when it’s dark and
    motion is detected.  \n- Turns **off** when motion stops or brightness rises.
    \ \n- If motion stops in the dark, it dims the light instead of fully shutting
    off (visual night cue).  \n\n---\n\n### ⏰ **Triggers**  \n| Condition | Entity
    | Threshold/State |\n|-----------|--------|-----------------|\n| **Low Light**
    | `sensor.bad_nachtlicht_illuminance` | Below **9 lux** |\n| **Motion Detected**
    | `binary_sensor.kinderbad_bewegung` | **on** |\n| **Motion Cleared (short)**
    | `binary_sensor.kinderbad_bewegung` | **off** for 30s |\n| **Motion Cleared (long)**
    | `binary_sensor.kinderbad_bewegung` | **off** for 1m |\n| **Brightness High**
    | `sensor.bad_nachtlicht_illuminance` | Above **25 lux** |\n| **Brightness Very
    High** | `sensor.bad_nachtlicht_illuminance` | Above **50 lux** |\n\n---\n\n###
    ✅ **Conditions**  \n- Light only turns **on** if:  \n  - `sensor.bad_nachtlicht_illuminance`
    < **20 lux**  \n  - `binary_sensor.kinderbad_bewegung` is **on**  \n  - Light
    is **off** OR brightness < **10%**  \n\n---\n\n### \U0001F3AF **Actions**  \n\n####
    **\U0001F4A1 On Action**  \n- Turn on `light.bad_nachtlicht`  \n- Brightness:
    **100%**  \n- Color Temp: **2400K**  \n- Smooth transition: **1s**  \n\n---\n\n####
    **\U0001F319 Off Action (after motion stops)**  \n- Wait **30s** after motion
    clears  \n- If brightness > **10 lux** → turn light **off** (retries until confirmed)
    \ \n- Else (still dark) → set light to **dim 9 brightness** for soft glow  \n\n---\n\n####
    **⚡ Immediate Off Action**  \n- If ambient light rises above **25–50 lux**  \n-
    Immediately turn `light.bad_nachtlicht` **off** (retries until confirmed)  \n\n---\n\n###
    \U0001F527 **Technical Specs**  \n- **Target Light:** `light.bad_nachtlicht`  \n-
    **Sensors Used:**  \n  - `sensor.bad_nachtlicht_illuminance`  \n  - `binary_sensor.kinderbad_bewegung`
    \ \n- **Mode:** `restart` (new motion cancels pending off-timers)  \n- **Failsafes:**
    Repeats actions until final state is confirmed"
  triggers:
  - entity_id:
    - sensor.bad_nachtlicht_illuminance
    below: 9
    id: 'On'
    trigger: numeric_state
    enabled: true
  - trigger: state
    entity_id:
    - binary_sensor.kinderbad_bewegung
    to: 'on'
    from: 'off'
    id: 'On'
  - trigger: state
    entity_id:
    - binary_sensor.kinderbad_bewegung
    to: 'off'
    from: 'on'
    id: 'Off'
    for:
      hours: 0
      minutes: 0
      seconds: 30
  - trigger: state
    entity_id:
    - binary_sensor.kinderbad_bewegung
    to: 'off'
    from:
    id: 'Off'
    for:
      hours: 0
      minutes: 1
      seconds: 0
  - entity_id:
    - sensor.bad_nachtlicht_illuminance
    id: Off immediately
    trigger: numeric_state
    enabled: true
    above: 25
  - entity_id:
    - sensor.bad_nachtlicht_illuminance
    id: Off immediately
    trigger: numeric_state
    enabled: true
    above: 50
  conditions: []
  actions:
  - alias: 'On'
    if:
    - condition: and
      conditions:
      - condition: and
        conditions:
        - condition: trigger
          id:
          - 'On'
        - condition: numeric_state
          entity_id: sensor.bad_nachtlicht_illuminance
          below: 20
        - condition: state
          entity_id: binary_sensor.kinderbad_bewegung
          state: 'on'
      - condition: or
        conditions:
        - condition: state
          entity_id: light.bad_nachtlicht
          state: 'off'
        - condition: template
          value_template: '{{ state_attr(''light.bad_nachtlicht'',''brightness'')|int(0)
            < 10 }}'
    then:
    - action: light.turn_on
      metadata: {}
      data:
        brightness_pct: 100
        transition: 1
        color_temp_kelvin: 2400
      target:
        entity_id: light.bad_nachtlicht
  - alias: Off after time x
    if:
    - condition: trigger
      id:
      - 'Off'
    then:
    - delay:
        hours: 0
        minutes: 0
        seconds: 30
        milliseconds: 0
    - if:
      - condition: numeric_state
        entity_id: sensor.bad_nachtlicht_illuminance
        above: 10
      then:
      - repeat:
          sequence:
          - action: light.turn_off
            metadata: {}
            data: {}
            target:
              entity_id: light.bad_nachtlicht
          - delay:
              hours: 0
              minutes: 0
              seconds: 0
              milliseconds: 500
          until:
          - condition: state
            entity_id: light.bad_nachtlicht
            state: 'off'
      else:
      - repeat:
          sequence:
          - action: light.turn_on
            metadata: {}
            data:
              transition: 1
              color_temp_kelvin: 2400
              brightness: 9
            target:
              entity_id: light.bad_nachtlicht
          - delay:
              hours: 0
              minutes: 0
              seconds: 0
              milliseconds: 500
          until:
          - condition: template
            value_template: '{{ state_attr(''light.bad_nachtlicht'',''brightness'')|int(0)
              == 9 }}'
    enabled: true
  - alias: Off immediately
    if:
    - condition: trigger
      id:
      - Off immediately
    then:
    - repeat:
        sequence:
        - action: light.turn_off
          metadata: {}
          data: {}
          target:
            entity_id: light.bad_nachtlicht
        - delay:
            hours: 0
            minutes: 0
            seconds: 0
            milliseconds: 500
        until:
        - condition: state
          entity_id: light.bad_nachtlicht
          state: 'off'
  mode: restart
- id: '1730294194772'
  alias: Aqara H1 EU Decoupled Switch Right
  description: "## Aqara H1 EU Decoupled Switch Right  \n\nThis automation manages
    the **Aqara H1 EU Decoupled Switch (right button)**.  \nIt toggles the **Gerade
    switch** when the right button is pressed under specific conditions.  \n\n###
    Key Features:\n- **Trigger**:  \n  Fired when the **single_right** action event
    from the Aqara H1 EU switch is detected.  \n\n- **Conditions**:  \n  1. The switch
    must be in **decoupled mode** (`select.duncan_lichtschalter_operation_mode_right`).
    \ \n  2. A **10-second cooldown** prevents the automation from retriggering too
    quickly.  \n\n- **Action**:  \n  Toggles the state of the **Gerade switch** (`switch.gerade`).
    \ \n\n### Purpose:  \nThis automation allows the right button of the Aqara H1
    EU switch to independently control the **Gerade switch**, while enforcing a cooldown
    to avoid rapid toggling."
  triggers:
  - domain: mqtt
    device_id: adf0a0e198e203d27f9ac23dd706eceb
    type: action
    subtype: single_right
    trigger: device
  conditions:
  - condition: state
    entity_id: select.duncan_lichtschalter_operation_mode_right
    state: decoupled
  - condition: template
    value_template: '{{ now() - (state_attr(this.entity_id, ''last_triggered'') |
      default( as_datetime(''0''), true)) > timedelta(seconds=10) }}'
  actions:
  - action: switch.toggle
    metadata: {}
    data: {}
    target:
      entity_id:
      - switch.gerade
  mode: single
