- id: '1716929359492'
  alias: Terra Pulsetime Control
  description: ''
  triggers:
  - minutes: /1
    id: '1'
    trigger: time_pattern
  conditions:
  - condition: sun
    before: sunset
    after: sunrise
  actions:
  - alias: On Sunrise
    if:
    - condition: trigger
      id:
