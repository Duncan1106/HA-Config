- id: '1712941263468'
  alias: Save PulseTIme
  description: ''
  triggers:
  - id: frommqtt
    topic: stat/tasmota_837238/RESULT
    trigger: mqtt
  conditions:
  - condition: template
    value_template: '{{ ''PulseTime1'' in  trigger.payload }}'
  - condition: not
    conditions:
    - condition: state
      entity_id: switch.pool_pumpe
      state: 'off'
      for:
        hours: 0
        minutes: 5
        seconds: 0
  actions:
  - target:
