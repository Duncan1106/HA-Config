  description: ''
  triggers:
  - entity_id:
    - schedule.boiler_pumpe
    from:
    to: 'on'
    id: 'On'
    for:
      hours: 0
      minutes: 0
      seconds: 0
    trigger: state
  - entity_id:
    - schedule.boiler_pumpe
    from:
    to: 'off'
    id: 'Off'
    trigger: state
  - trigger: state
    entity_id:
    - script.boiler_save_energy_script
    to: 'off'
    from: 'on'
    id: Script finished
  conditions: []
  actions:
  - alias: 'On'
    if:
    - condition: trigger
      id:
      - 'On'
    then:
    - alias: Notify of not enough warm water
      if:
      - condition: numeric_state
        entity_id: sensor.boiler_temperature
        below: 30
      then:
      - metadata: {}
        data:
          message: Das Wasser hat nur {{ states('sensor.boiler_temperature') | float(0)|
            round(0) }}°C!
        action: notify.duncan
    - action: script.boiler_save_energy_script
      metadata: {}
      data: {}
  - alias: 'Off'
    if:
    - condition: trigger
      id:
      - 'Off'
    then:
    - type: turn_off
      device_id: 2d4856e9b534472fb57e5601a3f5110e
      entity_id: 4537b8f00f743d73e53e52b828f58d2c
      domain: switch
  - if:
    - condition: trigger
      id:
      - Script finished
    - condition: state
      entity_id: schedule.boiler_pumpe
      state: 'on'
    then:
    - action: script.boiler_save_energy_script
      metadata: {}
      data: {}
    alias: Re Execute if Still in Time Frame
  mode: queued
  max: 10
- id: '1710427927351'
  alias: 'Daily Energy Summary '
  description: ''
  triggers:
  - at: '23:59:55'
    id: Day End
    trigger: time
  - event: sunrise
    offset: 0
    id: Rise
    trigger: sun
  - event: sunset
    offset: 0
    id: Set
    trigger: sun
  conditions: []
  actions:
  - alias: 'Message rise '
    if:
    - condition: trigger
      id:
      - Rise
    - condition: state
      entity_id: input_boolean.automation_enable_sunrise
      state: 'on'
    then:
    - data:
        title: 'Daily Energy Summary:'
        message: '{{ states(''sensor.energy_summary_1st_block'') }}


          {{ states(''sensor.energy_summary_1st_block_2'') }}

          '
      action: notify.duncan
  - alias: 'Message sunset '
    if:
    - condition: trigger
      id:
      - Set
    - condition: state
      entity_id: input_boolean.automation_enable_sunset
      state: 'on'
    then:
    - data:
        title: 'Daily Energy Summary:'
        message: '{{ states(''sensor.energy_summary_1st_block'') }}


          {{ states(''sensor.energy_summary_1st_block_2'') }}

          '
      action: notify.duncan
  - alias: 'Message midnight '
    if:
    - condition: trigger
      id:
      - Day End
    - condition: state
      entity_id: input_boolean.automation_enable_midnight
      state: 'on'
    then:
    - data:
        title: 'Daily Energy Summary:'
        message: '{{ states(''sensor.energy_summary_1st_block'') }}


          {{ states(''sensor.energy_summary_1st_block_2'') }}

          '
      action: notify.duncan
  - alias: Appliances
    if:
    - condition: trigger
      id:
      - Day End
    - condition: state
      entity_id: input_boolean.automation_enable_appliance
      state: 'on'
    then:
    - data:
        title: 'Appliance Summary:'
        message: '{{ states(''sensor.appliance_used'') }}

          '
      action: notify.duncan
  - alias: Sunset Notification
    if:
    - condition: trigger
      id:
      - Set
    then:
    - if:
      - condition: state
        entity_id: input_boolean.automation_enable_go_echarger
        state: 'on'
      then:
      - delay:
          hours: 0
          minutes: 0
          seconds: 5
          milliseconds: 0
      - alias: Goe
        if:
        - condition: or
          conditions:
          - condition: numeric_state
            entity_id: sensor.daily_energy_goe_11kw
            above: 0
          - condition: numeric_state
            entity_id: sensor.daily_energy_goe_22kw
            above: 0
        then:
        - metadata: {}
          data:
            title: Charged Energy
            message: '{{ "- 11kW: " + states(''sensor.daily_energy_goe_11kw'')|float(0)|round(2)|string
              + ''kWh'' if states(''sensor.daily_energy_goe_11kw'')|float(0)|round(2)
              > 0 else ''''}}

              {{ "- 22kW: " + states(''sensor.daily_energy_goe_22kw'')|float(0)|round(2)|string
              + ''kWh'' if states(''sensor.daily_energy_goe_22kw'')|float(0)|round(2)
              > 0 else ''''}}

              {{ " Total: " + (states(''sensor.daily_energy_goe_22kw'')|float(0)|round(2)
              + states(''sensor.daily_energy_goe_11kw'')|float(0)|round(2))|round(2)|string
              + "kWh" if states(''sensor.daily_energy_goe_22kw'')|float(0)|round(2)
              > 0 and states(''sensor.daily_energy_goe_11kw'')|float(0)|round(2) >
              0}}

              '
          action: notify.duncan
      alias: 'Go-eCharger '
  - if:
    - condition: trigger
      id:
      - Day End
    then:
    - metadata: {}
      data: {}
      target:
        entity_id: counter.ev_charging_messages
      action: counter.reset
    alias: Reset EV Messages Counter
  - alias: Forecast tomorrow
    if:
    - condition: trigger
      id:
      - Set
    - condition: state
      entity_id: input_boolean.automation_enable_forecast
      state: 'on'
    then:
    - data:
        title: 'Solar Forecast Tomorrow:'
        message: '{{ states(''sensor.solar_forecast_text_tomorrow'') }}

          '
      action: notify.duncan
  - alias: Forecast today
    if:
    - condition: trigger
      id:
      - Rise
    - condition: state
      entity_id: input_boolean.automation_enable_forecast
      state: 'on'
    then:
    - data:
        title: 'Solar Forecast Today:'
        message: '{{ states(''sensor.solar_forecast_text_today'') }}

          '
      action: notify.duncan
  mode: parallel
  max: 10
- id: '1710589916637'
  alias: Fire detection based on temperature sensors
  description: ''
  triggers:
  - seconds: /15
    trigger: time_pattern
  conditions:
  - condition: template
    value_template: '{{ sensors != '''' }}'
  actions:
  - choose: []
    default:
    - metadata: {}
      data:
        message: Fire detected in {{sensors}}
      action: notify.duncan
    - metadata: {}
      data:
        message: Feuer erkannt bei {{sensors}}
      action: notify.mobile_app_stephan_iphone
  variables:
    threshold: 45
    include:
      entity_id:
      - sensor.esp32_c3_mini_terra_duncan_room_temperature
      - sensor.esp32_c3_zero_epever_bme280_temperature
      - sensor.inverter_battery_temperature
      - sensor.esphome_az_envy_2_temperature_gartenhaus
      - sensor.esphome_az_envy_1_temperature_heizraum
      - sensor.esphome_az_envy_3_temperature_3d_printer
      - sensor.gw1100a_indoor_temperature
      - sensor.t_h_duncan_zigbee_temperature
      - sensor.t_h_waschkuche_zigbee_temperature
      - sensor.weinkeller_temperature
      - sensor.t_h_bad_zigbee_temperature
      - sensor.t_h_kinderbad_zigbee_temperature
      - sensor.inverter_battery_temperature
      - sensor.t_h_garage_zigbee_temperature
      - sensor.esp32_c3_zero_epever_battery_temperature
    sensors: "{% set result = namespace(sensors=[]) %} {% for state in states.sensor
      | selectattr('attributes.device_class', '==', 'temperature') %}\n  {% if 0 <=
      state.state | int(-1) > threshold | int and state.entity_id in include.entity_id
      %}\n    {% set result.sensors = result.sensors + [state.name ~ ' (' ~ state.state
      ~ ' °C)'] %}\n  {% endif %}\n{% endfor %} {% for state in states.binary_sensor
      | selectattr('attributes.device_class', '==', 'temperature') | selectattr('state',
      '==', 'on') %}\n  {% if state.entity_id in include.entity_id %}\n    {% set
      result.sensors = result.sensors + [state.name] %}\n  {% endif %}\n{% endfor
      %} {{result.sensors|join(', ')}}"
  mode: single
- id: '1710856538174'
  alias: Count Battery Full
  description: ''
  triggers:
  - entity_id:
    - sensor.esp32_c3_zero_epever_battery_voltage
    above: 28.3
    id: Full
    trigger: numeric_state
  - entity_id:
    - sensor.esp32_c3_zero_epever_battery_voltage
    below: 24
    id: Empty
    trigger: numeric_state
  - entity_id:
    - sensor.esp32_c3_zero_epever_battery_soc
    above: 98
    id: Full
    enabled: false
    trigger: numeric_state
  - entity_id:
    - sensor.esp32_c3_zero_epever_battery_soc
    id: Empty
    below: 40
    enabled: false
    trigger: numeric_state
  conditions: []
  actions:
  - alias: Full
    if:
    - condition: and
      conditions:
      - condition: state
        entity_id: input_boolean.battery_full
        state: 'off'
        enabled: false
      - condition: trigger
        id:
        - Full
    then:
    - target:
        entity_id:
        - input_boolean.battery_full
      data: {}
      action: input_boolean.turn_on
    - metadata: {}
      data: {}
      target:
        entity_id: counter.battery_full
      enabled: false
      action: counter.increment
    - action: input_number.set_value
      metadata: {}
      data:
        value: '{{ states(''sensor.charged_energy_to_bkw_battery'') | float(0) | round(2)
          }}

          '
      target:
        entity_id: input_number.last_charged_energy_to_bkw_battery
  - alias: Empty
    if:
    - condition: and
      conditions:
      - condition: state
        entity_id: input_boolean.battery_full
        state: 'on'
      - condition: trigger
        id:
        - Empty
    then:
    - metadata: {}
      data: {}
      target:
        entity_id: input_boolean.battery_full
      action: input_boolean.turn_off
    - metadata: {}
      data: {}
      target:
        entity_id: counter.battery_empty
      enabled: false
      action: counter.increment
  mode: single
- id: '1711468239502'
  alias: BKw Control
  description: ''
  triggers:
  - entity_id:
    - sensor.inverter_pv_power
    id: on day
    above: 2250
    trigger: numeric_state
  - entity_id:
    - sensor.esp32_c3_zero_epever_battery_voltage
    id: off night
    below: 23
    trigger: numeric_state
  - entity_id:
    - sensor.esp32_c3_zero_epever_pv_array_input_power
    below: 200
    id: off day
    trigger: numeric_state
  - entity_id:
    - sensor.esp32_c3_zero_epever_pv_array_input_power
    below: 175
    id: off day
    trigger: numeric_state
  - entity_id:
    - sensor.esp32_c3_zero_epever_pv_array_input_power
    below: 125
    id: off day
    trigger: numeric_state
  - entity_id:
    - sensor.esp32_c3_zero_epever_pv_array_input_power
    below: 75
    id: off day
    trigger: numeric_state
  - entity_id:
    - sensor.inverter_pv_power
    id: off day
    below: 2250
    trigger: numeric_state
  - entity_id:
    - sensor.inverter_pv_power
    id: off day
    below: 2000
    trigger: numeric_state
  - event: sunset
    offset: -00:15:00
    id: on night
    trigger: sun
  - event: sunrise
    offset: +00:15:00
    id: off night
    trigger: sun
    enabled: true
  - id: on day
    enabled: true
    trigger: time_pattern
    minutes: '*'
  - trigger: numeric_state
    entity_id:
    - sensor.bkw_outlet_1_energy_power
    below: 50
    id: off night
  conditions:
  - condition: or
    conditions:
    - condition: or
      conditions:
      - condition: state
        entity_id: input_boolean.battery_full
        state: 'on'
      - condition: or
        conditions:
        - condition: numeric_state
          entity_id: sensor.esp32_c3_zero_epever_battery_soc
          above: 95
        - condition: numeric_state
          entity_id: sensor.esp32_c3_zero_epever_battery_voltage
          above: 27.75
    - condition: and
      conditions:
      - condition: numeric_state
        entity_id: sensor.inverter_pv_power
        below: 2001
      - condition: device
        type: is_on
        device_id: f7afa3f7d75d54c713ea1d78071ff30c
        entity_id: 12403f847e9caae174f8b14a11ab9c19
        domain: switch
  actions:
  - alias: on day
    if:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - on day
      - condition: state
        entity_id: sensor.scb_inverter_state
        state: FeedIn
      - condition: state
        entity_id: input_boolean.battery_full
        state: 'on'
      - condition: numeric_state
        entity_id: sensor.esp32_c3_zero_epever_battery_soc
        above: 80
      - condition: numeric_state
        entity_id: sensor.inverter_pv_power
        above: 2000
      - condition: numeric_state
        entity_id: sensor.esp32_c3_zero_epever_device_temperature
        below: 44
    then:
    - metadata: {}
      data: {}
      target:
        entity_id: switch.esp32_c3_zero_epever_manual_control_the_load
      enabled: true
      action: switch.turn_on
    - type: turn_on
      device_id: f7afa3f7d75d54c713ea1d78071ff30c
      entity_id: 12403f847e9caae174f8b14a11ab9c19
      domain: switch
  - alias: off day
    if:
    - condition: and
      conditions:
      - condition: sun
        before: sunset
        after: sunrise
        after_offset: -00:16:00
      - condition: trigger
        id:
        - off day
    then:
    - type: turn_off
      device_id: f7afa3f7d75d54c713ea1d78071ff30c
      entity_id: 12403f847e9caae174f8b14a11ab9c19
      domain: switch
  - alias: on night
    if:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - on night
      - condition: state
        entity_id: input_boolean.battery_full
        state: 'on'
    then:
    - metadata: {}
      data: {}
      target:
        entity_id: switch.esp32_c3_zero_epever_manual_control_the_load
      enabled: true
      action: switch.turn_on
    - type: turn_on
      device_id: f7afa3f7d75d54c713ea1d78071ff30c
      entity_id: 12403f847e9caae174f8b14a11ab9c19
      domain: switch
    - metadata: {}
      data: {}
      target:
        entity_id: counter.battery_full
      action: counter.increment
    - action: input_number.set_value
      metadata: {}
      data:
        value: '{{ (states(''sensor.charged_energy_to_bkw_battery'') | float(0) |
          round(2) - states(''sensor.discharged_energy_from_bkw_battery'') | float(0)
          | round(2)) | round(2) }}

          '
      target:
        entity_id: input_number.last_charged_energy_to_bkw_battery
      enabled: false
    - action: utility_meter.calibrate
      metadata: {}
      data:
        value: '0.0'
      target:
        entity_id:
        - sensor.charged_energy_to_bkw_battery
        - sensor.discharged_energy_from_bkw_battery
  - alias: off night
    if:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - off night
      - condition: numeric_state
        entity_id: sensor.bkw_outlet_1_energy_today
        above: 0.001
      - condition: time
        after: 00:00:00
        before: 09:00:00
    then:
    - alias: Repeat off cmd until OFF
      repeat:
        sequence:
        - type: turn_off
          device_id: f7afa3f7d75d54c713ea1d78071ff30c
          entity_id: 12403f847e9caae174f8b14a11ab9c19
          domain: switch
        - delay:
            hours: 0
            minutes: 0
            seconds: 5
            milliseconds: 0
        until:
        - condition: state
          entity_id: switch.bkw_outlet_1_bkw_outlet_1
          state: 'off'
    - metadata: {}
      data: {}
      target:
        entity_id: input_boolean.battery_full
      action: input_boolean.turn_off
    - if:
      - condition: numeric_state
        entity_id: sensor.discharged_energy_from_bkw_battery
        above: 0
      then:
      - metadata: {}
        data: {}
        target:
          entity_id: counter.battery_empty
        action: counter.increment
      - action: input_number.set_value
        metadata: {}
        data:
          value: '{{ states(''sensor.discharged_energy_from_bkw_battery'') | float(0)
            | round(2) }}

            '
        target:
          entity_id: input_number.last_discharged_energy_from_bkw_battery
      - delay:
          hours: 0
          minutes: 0
          seconds: 0
          milliseconds: 100
      - action: utility_meter.calibrate
        metadata: {}
        data:
          value: '0.0'
        target:
          entity_id: sensor.discharged_energy_from_bkw_battery
    - delay:
        hours: 0
        minutes: 0
        seconds: 5
        milliseconds: 0
    - type: turn_off
      device_id: 93a7dbc1ab0380e01f4cd6d5eb91b9bc
      entity_id: c75f234504dc77b5d544518a8128c688
      domain: switch
  mode: queued
  max: 15
