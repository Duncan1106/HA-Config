            name: Vorne
          - sensor: sensor.sun_wall_intensity_left
            name: Ost
          - sensor: sensor.sun_wall_intensity_back
            name: Hinten
          - sensor: sensor.sun_wall_intensity_right
            name: KiGa/West
          sequence:
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ states(repeat.item.sensor) | float(0) > 30 }}'
              - condition: template
                value_template: '{{ states(solar_forecast_sensor) | float(0) >= forecast_threshold
                  }}'
              sequence:
              - action: notify.duncan
                data:
                  title: '{{ repeat.item.name }}'
                  message: Rollo schließen
  mode: parallel
  max: 10
- id: batterie_sicherungs_ueberwachung_esphome
  alias: Batterie Sicherungs-Überwachung via ESPHome
  description: "### \U0001F4CB Intelligent Battery Breaker Control\n\n- **High-Level
    Intent:** Monitors the circuit breaker status of connected physical battery banks
    via ESPHome and issues persistent, action-required notifications to the user if
    a breaker trips.\n- **Operational Strategy:** Employs a safety-first monitoring
    matrix tied to active inverter operations. It ensures alerts are dispatched only
    when the system is actively processing battery storage metrics and running time-of-use
    features.\n- **Reliability Mechanisms:** Uses an automated notification loop with
    a 15-minute recurrence cadence until the physical breaker state clears, paired
    with a matching 5-second automatic clear notification trigger when system restoration
    is achieved.\n\n---\n\n### Trigger Overview Table\n\n| Type | Entity / Condition
    | ID | Purpose |\n| :--- | :--- | :--- | :--- |\n| State | **binary_sensor.battery_1_bat1_breaker_popped**
    to **on** for **00:05:00** | `bat1_popped` | Captures a persistent tripped state
    on Battery 1 breaker. |\n| State | **binary_sensor.battery_1_bat1_breaker_popped**
    to **off** for **00:00:05** | `bat1_restored` | Confirms manual reset and recovery
    of Battery 1 breaker. |\n| State | **binary_sensor.battery_2_bat2_breaker_popped**
    to **on** for **00:05:00** | `bat2_popped` | Captures a persistent tripped state
    on Battery 2 breaker. |\n| State | **binary_sensor.battery_2_bat2_breaker_popped**
    to **off** for **00:00:05** | `bat2_restored` | Confirms manual reset and recovery
    of Battery 2 breaker. |\n\n---\n\n### Operational Logic Sections\n\n#### Breaker
    Popped Alert Mode\n- **Purpose:** Promptly flag tripped battery hardware and maintain
    visibility until corrected.\n- **Logic Overview:** Runs when a `popped` trigger
    ID is verified, **switch.esp32_s3_zero_deye8k_time_of_use** is **on**, **sensor.inverter_battery**
    is **above 0**, and the respective battery State of Charge evaluates to strictly
    less than **99.9%**.\n- **Effect:** Executes a continuous loop that transmits
    an alert message (\"Bitte wieder anschalten\") to **notify.duncan** every **00:15:00**
    until the target **binary_sensor.felicity_lifepo4_battery_[X]_breaker_popped**
    updates to **off**.\n\n#### Breaker Restored Clear Mode\n- **Purpose:** Automatically
    clear the persistent alert from the user's notification pane once physical remediation
    occurs.\n- **Logic Overview:** Evaluates when a `restored` trigger ID occurs alongside
    the global conditions (**switch.esp32_s3_zero_deye8k_time_of_use** is **on** and
    **sensor.inverter_battery** is **above 0**).\n- **Effect:** Dispatches a `clear_notification`
    payload to **notify.duncan** utilizing a dynamic device tag to clear existing
    alerts.\n\n---\n\n### Technical Overview\n\n- **Automation Mode:** **restart**\n-
    **Execution Method:** Choice-based logic sequencing containing structural conditional
    template checks, recursive `repeat-until` looping, and explicit tracking delays.\n-
    **Key Inputs:** - **switch.esp32_s3_zero_deye8k_time_of_use**\n  - **sensor.inverter_battery**\n
    \ - **sensor.battery_1_bat1_soc**\n  - **sensor.battery_2_bat2_soc**\n- **Controlled
    Entities:**\n  - **notify.duncan**\n- **Safety Mechanisms:** - Global constraints
    block execution if the inverter has zeroed out or if Time of Use configurations
    are altered.\n  - State-of-Charge threshold constraint prevents erroneous looping
    execution on fully topped-off batteries.\n\n---\n\n### \U0001F4A1 Notes\n\n- **Debounce
    Optimization:** The 5-minute **for** window on breaker failure states limits notification
    spam from voltage drops or brief communications dropouts.\n- **Dynamic Variable
    Extraction:** Implements dynamic Jinja template slicing (`trigger.id.split('_')[0]`)
    to gracefully map multi-battery architectures into modular code logic paths, allowing
    clean scaling without discrete duplicate automations.\n- **State-of-Charge Guardrail:**
    Incorporates a state validation threshold where batteries reporting at **99.9%**
    or higher will not trigger looping notifications, preventing false loops when
    the BMS isolates full packs.\n"
  triggers:
  - trigger: state
    entity_id: binary_sensor.battery_1_bat1_breaker_popped
    to: 'on'
    for: 00:05:00
    id: bat1_popped
  - trigger: state
    entity_id: binary_sensor.battery_1_bat1_breaker_popped
    to: 'off'
    for: 00:00:05
    id: bat1_restored
  - trigger: state
    entity_id: binary_sensor.battery_2_bat2_breaker_popped
    to: 'on'
    for: 00:05:00
    id: bat2_popped
  - trigger: state
    entity_id: binary_sensor.battery_2_bat2_breaker_popped
    to: 'off'
    for: 00:00:05
    id: bat2_restored
  conditions:
  - condition: state
    entity_id: switch.esp32_s3_zero_deye8k_time_of_use
    state:
    - 'on'
  - condition: numeric_state
    entity_id: sensor.inverter_battery
    above: 0
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id in [''bat1_popped'', ''bat2_popped''] }}'
      - condition: template
        value_template: '{% set num = trigger.id.split(''_'')[0][-1] %} {{ states(''sensor.battery_''
          ~ num ~ ''_bat'' ~ num ~ ''_soc'') | float(0) < 99.9 }}'
      sequence:
      - repeat:
          until:
          - condition: template
            value_template: '{% set bat = trigger.id.split(''_'')[0] %} {% set num
              = trigger.id.split(''_'')[0][-1] %}{{ is_state(''binary_sensor.battery_''
              ~ num ~ "_" ~ bat ~ ''_breaker_popped'', ''off'') }}'
          sequence:
          - action: notify.duncan
            data:
              title: Batterie {{ trigger.id.split('_')[0][-1] }} Sicherung
              message: Bitte wieder anschalten
              data:
                tag: '{{ trigger.id.split(''_'')[0] }}_breaker'
          - delay: 00:15:00
    - conditions:
      - condition: template
        value_template: '{{ trigger.id in [''bat1_restored'', ''bat2_restored''] }}'
      sequence:
      - action: notify.duncan
        data:
          message: clear_notification
          data:
            tag: '{{ trigger.id.split(''_'')[0] }}_breaker'
  mode: restart
- id: '1782333444123'
  alias: Automatic Backup Management
  description: "### \U0001F4CB Intelligent Backup Management Control\n\nThis automation
    provides a streamlined, space-conscious backup strategy for Home Assistant. It
    utilizes a two-action execution model to handle routine point-in-time recovery
    alongside long-term data archival. \n\nThe system operates on a dual strategy:
    frequent, lightweight partial backups capture rolling configuration changes throughout
    the day, while a dynamically calculated calendar-tier system determines whether
    a full backup serves as a daily, weekly, monthly, or yearly archive. Reliability
    is maximized by passing precise directory exclusions and custom retention variables
    directly to the backup engine.\n\n---\n\n### Trigger Overview\n\n| Type | Entity
    / Condition | ID | Purpose |\n| :--- | :--- | :--- | :--- |\n| Time | **02:30:00**
    | **daily** | Triggers the primary unified backup lifecycle evaluation. |\n| Time
    Pattern | Every **4 hours** (`/4`) | **hourly** | Triggers the high-frequency
    configuration snapshot sequence. |\n\n---\n\n### Operational Logic Sections\n\n####
    Hourly Backup Mode\n* **Purpose**: Captures short-term configuration modifications
    while keeping disk overhead minimal.\n* **Logic Overview**: Triggered when the
    execution ID matches **hourly**.\n* **Effect**: Creates a compressed partial backup
    saved to `/share/NAS_Share/Backup/`. It includes the **config** folder but explicitly
    isolates and strips out heavy directories and system components. Retained for
    **1** day.\n\n#### Standard Unified Backup Mode\n* **Purpose**: Establishes a
    cascading archival system based on chronological significance.\n* **Logic Overview**:
    Triggered when the execution ID matches **daily**. It evaluates the current date
    using Jinja templates to assign a tier: **yearly** (January 1st), **monthly**
    (1st of any month), **weekly** (Mondays), or **daily** (all other days).\n* **Effect**:
    Creates a compressed backup saved to `/share/NAS_Share/Backup/` that includes
    all system paths except the **media** folder. Adjusts retention dynamically: **7**
    days for daily, **30.4167** days for weekly, **365** days for monthly, and indefinite
    (**none**) for yearly tiers.\n\n---\n\n### Technical Overview\n\n* **Automation
    Mode**: **single**\n* **Execution Method**: Direct action call via **auto_backup.backup**\n*
    **Key Inputs**: `trigger.id`, `now()` system calendar attributes\n* **Controlled
    Entities**: **auto_backup** integration engine\n* **Safety Mechanisms**: Target
    paths like **media**, **share**, **ssl**, and **addons** are forcefully excluded
    from the hourly cycles. The system database is also dropped from hourly snapshots
    to prevent database locks and minimize snapshot file sizes.\n\n---\n\n### \U0001F4A1
    Notes\n\n* **Smart Retention Cascading**: The variable logic cleanly overrides
    smaller retention windows with longer ones if a higher tier drops on the same
    calendar date (e.g., a monthly backup automatically supplants a weekly or daily
    backup on the 1st of a month).\n* **Database Wear Reduction**: Omitting the Home
    Assistant database from the 4-hour interval cycle drastically reduces host disk
    I/O and prevents performance degradation during high-frequency write operations.\n*
    **Storage Preservation**: Setting a precise decimal float (**30.4167** days) for
    weekly tiers ensures exact synchronization with calendar month averages, avoiding
    storage creeping on the network share.\n"
  triggers:
  - id: daily
    at: 02:30:00
    trigger: time
  - id: hourly
    enabled: true
    hours: /4
    trigger: time_pattern
  - trigger: state
    entity_id:
    - input_button.create_manual_backup_via_autobackup
    id: daily
  conditions: []
  actions:
  - variables:
      backup_type: "{% if trigger is defined and trigger.id == 'hourly' %}\n  hourly\n{%
        elif now().day == 1 and now().month == 1 %}\n  yearly\n{% elif now().day ==
        1 %}\n  monthly\n{% elif now().weekday() == 0 %}\n  weekly\n{% else %}\n  daily\n{%
        endif %}"
      keep_days: "{{ {\n  'hourly': 1,\n  'yearly': none,\n  'monthly': 365,\n  'weekly':
        30.4167,\n  'daily': 7\n}.get(backup_type | trim, 7) }}"
      name: "{% set type = backup_type | trim %} {% if type == 'hourly' %}\n  Hourly_Backup_{{
        now().strftime('%A, %H:%M, %B %-d, %Y') }}\n{% else %}\n  {{ type | title
        }} Backup: {{ now().strftime('%A, %B %-d, %Y') }}\n{% endif %}"
  - if:
    - condition: trigger
      id: daily
    then:
    - alias: Creating Standard Unified Backup
      data:
        name: '{{ name }}'
        keep_days: '{{ keep_days }}'
        download_path:
        - /share/NAS_Share/Backup/
        exclude_folders:
        - media
        compressed: true
      action: auto_backup.backup
    else:
    - alias: Creating Hourly Partial Backup
      data:
        name: '{{ name }}'
        keep_days: '{{ keep_days }}'
        download_path:
        - /share/NAS_Share/Backup/
        include_folders:
        - config
        exclude_addons:
        - '*'
        exclude_folders:
        - media
        - share
        - ssl
        - addons
        compressed: true
        exclude_database: true
      action: auto_backup.backup
  mode: single
- id: '1782633357930'
  alias: 'Go-e Charger 11kw: All-In-One Controller'
  description: Direct Home Assistant entity evaluation with a readable configuration
    cache
  triggers:
  - trigger: state
    entity_id: select.go_echarger_270862_trx
    id: rfid
  - trigger: mqtt
    id: car
    options:
      topic: go-eCharger/270862/car
  - trigger: mqtt
    topic: goe11/config/battery_soc_threshold
    id: cfg_soc_limit
  - trigger: mqtt
    topic: goe11/config/battery_power_offset
    id: cfg_bat_offset
  - trigger: mqtt
    topic: goe11/config/buffer_power
    id: cfg_buffer
  - trigger: mqtt
    topic: goe11/config/card_zoe
    id: cfg_zoe
  - trigger: time_pattern
    seconds: /10
    id: timer
  conditions:
  - condition: or
    conditions:
    - condition: trigger
      id:
      - rfid
      - car
      - cfg_soc_limit
      - cfg_bat_offset
      - cfg_zoe
      - cfg_buffer
    - condition: and
      conditions:
      - condition: trigger
        id:
        - timer
      - condition: or
        conditions:
        - condition: template
          value_template: '{{ (states("input_text.goe11_cache") | from_json(default={})).get("pv_active",
            false) }}'
        - condition: state
          entity_id: select.go_echarger_270862_frc
          state:
          - Charge
          - Neutral
  actions:
  - variables:
      raw_cache: '{{ states(''input_text.goe11_cache'') }}'
      default:
        pv_active: false
        never_stop: false
        low_amps: false
        zoe_card: -1
        restarts: 0
        skips: 0
        bat_offset: 0
        soc_limit: 35
        grid_buffer: 0
        min_amps: 6
        car_status: Unk
      cache: "{% if raw_cache in ['unknown', 'unavailable', ''] or raw_cache[0] !=
        '{' %}\n  {{ default }}\n{% else %}\n  {{ default | combine((raw_cache | from_json)
        ) }}\n{% endif %}"
  - choose:
    - conditions:
      - condition: trigger
        id:
        - car
      sequence:
      - variables:
          car_status: '{{ {''0'':''Unk'', ''1'':''Idl'', ''2'':''Chg'', ''3'':''Wai'',
            ''4'':''Com'', ''5'':''Err''}.get(trigger.payload, ''Unk'') }}'
      - variables:
          cache: "{% if car_status == 'Wai' and is_state('sun.sun', 'above_horizon')
            and not cache.pv_active %}\n  {{ cache | combine({'car_status': car_status,
            'pv_active': true}) }}\n{% else %}\n  {{ cache | combine({'car_status':
            car_status}) }}\n{% endif %}"
    - conditions:
      - condition: trigger
        id:
        - rfid
      sequence:
      - variables:
          current_card: '{{ trigger.to_state.state }}'
          target_idx: '{{ cache.zoe_card | string }}'
          m_amps: '{{ 8 if current_card == ''Card '' ~ target_idx else 6 }}'
          cache: '{{ cache | combine({''min_amps'': m_amps}) }}'
    - conditions:
      - condition: trigger
        id:
        - cfg_soc_limit
      sequence:
      - variables:
          cache: '{{ cache | combine({''soc_limit'': trigger.payload | float(35) |
            round(1)}) }}'
    - conditions:
      - condition: trigger
        id:
        - cfg_bat_offset
      sequence:
      - variables:
          cache: '{{ cache | combine({''bat_offset'': trigger.payload | float(0) |
            round(1)}) }}'
    - conditions:
      - condition: trigger
        id:
        - cfg_buffer
      sequence:
      - variables:
          cache: '{{ cache | combine({''grid_buffer'': trigger.payload | float(0)
            | round(1)}) }}'
    - conditions:
      - condition: trigger
        id:
        - cfg_zoe
      sequence:
      - variables:
          cache: '{{ cache | combine({''zoe_card'': trigger.payload | int(-1)}) }}'
  - choose:
    - conditions:
      - condition: trigger
        id:
        - timer
      - condition: template
        value_template: '{{ not cache.pv_active }}'
      - condition: or
        conditions:
        - alias: Amps dont match min amps
          condition: template
          value_template: '{{ states("number.go_echarger_270862_amp")|int != cache.get("min_amps",
            "6") |int }}'
        - condition: state
          entity_id: select.go_echarger_270862_frc
          state:
          - Charge
          - Neutral
          alias: State doesnt match
      sequence:
      - action: number.set_value
        target:
          entity_id: number.go_echarger_270862_amp
        data:
          value: '{{ cache.min_amps | int(6) }}'
      - action: select.select_option
        target:
          entity_id: select.go_echarger_270862_frc
        data:
          option: Don't charge
      - variables:
          cache: "{{ cache | combine({\n              'pv_active': false,\n              'never_stop':
            false,\n              'low_amps': false,\n              'restarts': 0,\n
            \             'skips': 0,\n              'status_text': 'PV Surplus Charging
            OFF'\n            }) }}"
      alias: Stop Charging
    - conditions:
      - condition: trigger
        id:
        - timer
      - condition: template
        value_template: '{{ cache.pv_active }}'
      sequence:
      - variables:
          v: '{{ states(''sensor.go_echarger_270862_nrg'') | float(230.0) }}'
          gp: '{{ states(''sensor.go_echarger_270862_nrg_12'') | float(0.0) }}'
          fa: '{{ states(''number.go_echarger_270862_amp'') | float(6.0) }}'
          gst: '{{ states(''select.go_echarger_270862_frc'') }}'
          fsp: '{{ states(''select.go_echarger_270862_psm'') }}'
          grid: '{{ (states(''sensor.grid_power'') | float(0.0)) * -1.0 }}'
          bat: '{{ states(''sensor.battery_discharge'') | float(0.0) }}'
          sol: '{{ states(''sensor.solar_power_total'') | float(0.0) - states(''sensor.battery_charge'')
            | float(0.0) }}'
          soc_avg: '{{ states(''sensor.felicity_ess_soc_avg'') | float(0.0) }}'
          soc: '{{ soc_avg if soc_avg > 0 else states(''sensor.inverter_battery'')
            | float(0.0) }}'
          divider: '{{ 1.0 if fsp == ''Force single phase'' else 3.0 }}'
          avail_bat_p: '{{ cache.bat_offset - bat }}'
          avail_grid_a: '{{ (grid - cache.grid_buffer) / v }}'
          avail_bat_a: '{{ avail_bat_p / v }}'
          goe_a: '{{ gp / v }}'
          solar_amps: '{{ sol / v }}'
          calc_amps: '{{ (avail_grid_a + goe_a + avail_bat_a) / divider }}'
          clamped_calc_amps: '{{ [calc_amps | float, 0.0] | max }}'
          amps_rounded: '{{ [clamped_calc_amps | int, 16] | min }}'
          target_amps: '{{ [amps_rounded, cache.min_amps | int] | max }}'
          cache: "{% set cc = cache %} {% if soc > 99.9 and cc.bat_offset < 0 %}\n
            \ {% set cc = cc | combine({'bat_offset': 0.0}) %}\n{% endif %}\n{% if
            soc < cc.soc_limit %}\n  {% set msg = \"Stopping discharge of Battery
            (SoC \" ~ soc ~ \"% < \" ~ cc.soc_limit ~ \"%)\" %}\n  {% set cc = cc
            | combine({'status_text': msg}) %}\n{% elif calc_amps < 5.99 and cc.never_stop
            %}\n  {% set msg = \"Never Stop Charging is active\" %}\n  {% set cc =
            cc | combine({'status_text': msg}) %}\n{% elif cc.skips > 0 %}\n  {% set
            msg = \"Skipping Cycle: Solar/Battery power too low\" %}\n  {% set cc
            = cc | combine({'status_text': msg}) %}\n{% elif calc_amps < 5.99 %}\n
            \ {% set msg = \"Waiting: Low solar surplus (\" ~ (calc_amps * 230) |
            int ~ \"W)\" %}\n  {% set cc = cc | combine({'status_text': msg}) %}\n{%
            elif gst == 'Neutral' and gp > -20 and gp < 20 and cc.car_status not in
            ['Chg', 'Wai'] %}\n  {% set msg = \"Restarting charging loop (\" ~ cc.restarts
            ~ \"/10)\" %}\n  {% set cc = cc | combine({'status_text': msg}) %}\n{%
            else %}\n  {% set msg = \"Running: \" ~ target_amps ~ \"A (\" ~ (target_amps
            * 230) | int ~ \"W)\" %}\n  {% set cc = cc | combine({'status_text': msg,
            'restarts': 0}) %}\n{% endif %}\n{% if soc < cc.soc_limit %}\n  {{ cc
            | combine({'pv_active': false, 'low_amps': false}) }}\n{% elif calc_amps
            < 5.99 %}\n  {% if not cc.low_amps %}\n    {{ cc | combine({'low_amps':
            true}) }}\n  {% else %}\n    {{ cc }}\n  {% endif %}\n{% else %}\n  {%
            set cc = cc | combine({'low_amps': false}) %}\n  {% if target_amps !=
            fa and (solar_amps + avail_bat_a) <= amps_rounded and cc.skips < 10 %}\n
            \   {{ cc | combine({'skips': cc.skips + 1}) }}\n  {% else %}\n    {%
            set cc = cc | combine({'skips': 0}) %}\n    {% set rcc = cc.restarts %}\n\n
            \   {% if gst == 'Neutral' and gp > -20 and gp < 20 and cc.car_status
            not in ['Chg', 'Wai'] %}\n      {% set rcc = rcc + 1 %}\n    {% elif gst
            != 'Neutral' or gp > 20 %}\n      {% set rcc = 0 %}\n    {% endif %}\n\n
            \   {{ cc | combine({'restarts': rcc}) }}\n  {% endif %}\n{% endif %}"
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ soc < cache.soc_limit or (calc_amps < 5.99 and cache.low_amps)
              }}'
          sequence:
          - action: number.set_value
            target:
              entity_id: number.go_echarger_270862_amp
            data:
              value: '{{ target_amps | int }}'
          - alias: Stopf charging if never stop is off
            if:
            - condition: template
              value_template: '{{ not cache.never_stop or soc < cache.soc_limit }}'
            then:
            - action: select.select_option
              target:
                entity_id: select.go_echarger_270862_frc
              data:
                option: Don't charge
          alias: Below Min Amps or below save soc
        - conditions:
          - condition: template
            value_template: '{{ calc_amps >= 5.99 and cache.skips == 0 }}'
          sequence:
          - alias: If target amps != current amps
            if:
            - condition: template
              value_template: '{{ target_amps | int != fa | int }}'
            then:
            - action: number.set_value
              target:
                entity_id: number.go_echarger_270862_amp
              data:
                value: '{{ target_amps | int }}'
          - if:
            - condition: template
              value_template: '{{ gst != ''Neutral'' }}'
            then:
            - action: select.select_option
              target:
                entity_id: select.go_echarger_270862_frc
              data:
                option: Neutral
            alias: 'Allow Charging if not already allowed '
          - if:
            - condition: template
              value_template: '{{ gst == ''Neutral'' and gp > -20 and gp < 20 and
                cache.car_status not in [''Chg'', ''Wai''] and cache.restarts >= 9
                }}'
            then:
            - action: select.select_option
              target:
                entity_id: select.go_echarger_270862_frc
              data:
                option: Don't charge
            - delay: 00:00:03
            - action: select.select_option
              target:
                entity_id: select.go_echarger_270862_frc
              data:
                option: Neutral
            alias: Restart Charging if car isn't charging but out is allowed to
          alias: Above min amps
      alias: Charging Loop
  - action: input_text.set_value
    target:
      entity_id: input_text.goe11_cache
    data:
      value: '{{ cache | to_json }}'
  mode: queued
  max: 10
- id: '1783428437518'
  alias: 'Dreame Vacuum: Move & Wait for Emptying'
  description: "\U0001F4CB Intelligent Vacuum Maintenance Control\n=========================================\nThis
    automation optimizes the maintenance workflow of the Dreame D9 Max Gen 2 vacuum
    cleaner. Instead of requiring the user to bend down at the dock, the automation
    commands the vacuum to navigate to a convenient, designated manual emptying location
    once a cleaning cycle is complete and the battery is replenished. It utilizes
    actionable mobile notifications alongside strict time and area guards to ensure
    reliable, noise-conscious, and safe operation.\n\n---\n\n### Trigger Overview\n\n|
    Type | Entity / Condition | ID | Purpose |\n|---|---|---|---|\n| **Numeric State**
    | **vacuum.d9_max_gen_2** (battery > **99**) | — | Initiates maintenance once
    the vacuum is fully charged. |\n| **State** | **vacuum.d9_max_gen_2** (to: **docked**)
    | — | Initiates maintenance immediately upon docking. |\n\n---\n\n### Operational
    Logic\n\n#### Validation Phase\n* **Purpose:** Prevents disruptive automation
    runs and unnecessary maintenance loops.\n* **Logic Overview:** Validates that
    the current time is between **08:00:00** and **22:00:00** and that the vacuum's
    **cleaned_area** attribute is strictly above **5 m²**.\n* **Effect:** Blocks execution
    during night hours and prevents the automation from running if the vacuum docked
    without performing actual cleaning work (e.g., after a manual test or quick relocation).\n\n####
    Relocation & Notification Phase\n* **Purpose:** Moves the vacuum to the maintenance
    spot and alerts the user.\n* **Logic Overview:** Commands the vacuum to navigate
    to coordinates **x: -2200, y: 175**. It waits up to **5 minutes** for the vacuum's
    state to transition to **idle** (signaling arrival). Once reached, it sends an
    actionable notification to **notify.duncan**.\n* **Effect:** Positions **vacuum.d9_max_gen_2**
    at the emptying location and delivers a mobile alert prompting the user to empty
    the dust container.\n\n#### Return & Cleanup Phase\n* **Purpose:** Safely returns
    the vacuum to its charger once maintenance is complete.\n* **Logic Overview:**
    Waits for up to **1 hour** for the user to select the **VACUUM_DONE_EMPTYING**
    action from the notification. If confirmed within the time limit, the vacuum is
    commanded to return to its base and the notification is cleared.\n* **Effect:**
    Returns **vacuum.d9_max_gen_2** to its dock and cleans up the active mobile notification.\n\n---\n\n###
    Technical Overview\n\n* **Automation Mode:** `single` (Prevents concurrent runs
    if multiple triggers fire in close succession)\n* **Execution Method:** Service
    calls (`dreame_vacuum.vacuum_goto`, `vacuum.return_to_base`), actionable notification
    event handling, and conditional `if-then` branching.\n* **Key Inputs:** Target
    coordinates (**x: -2200, y: 175**), custom notification action (**VACUUM_DONE_EMPTYING**),
    and notification tag (**d9_max_gen2_empty_dust_container**).\n* **Controlled Entities:**\n
    \ * **vacuum.d9_max_gen_2**\n  * **notify.duncan**\n* **Safety Mechanisms:**\n
    \ * **Quiet Hours Guard:** Constrained to **08:00 - 22:00** to avoid nocturnal
    vacuum movements.\n  * **Activity Guard:** Minimum **5 m²** cleaned area requirement
    protects against false-positive triggers.\n  * **Relocation Timeout:** A **5-minute**
    safety limit prevents the automation from stalling if the vacuum fails to reach
    the coordinates.\n  * **User Presence Safety:** A **1-hour** timeout ensures the
    automation terminates cleanly if the user is away. The vacuum is *not* commanded
    to return automatically on timeout, avoiding unexpected motion while someone might
    be manually handling it.\n\n---\n\n### \U0001F4A1 Notes\n\n* **Cleaned Area Threshold:**
    Filtering by **cleaned_area > 5** is an elegant fail-safe. It prevents the automation
    from triggering in a loop if you manually send the vacuum back to the dock after
    emptying, as the cleaned area attribute resets or remains below the threshold.\n*
    **Non-Blocking Timeout:** The **1-hour** timeout on the mobile notification action
    uses `continue_on_timeout: true`. Combined with the `if: \"{{ wait.completed }}\"`
    check, this safely cleans up the automation execution state without trapping system
    resources in an infinite wait block, while ensuring the vacuum does not move unexpectedly
    if the user fails to respond."
  triggers:
  - trigger: numeric_state
    entity_id: vacuum.d9_max_gen_2
    attribute: battery
    above: 99
  - trigger: state
    entity_id:
    - vacuum.d9_max_gen_2
    to:
    - docked
    for:
      hours: 0
      minutes: 5
      seconds: 0
  conditions:
  - condition: time
    after: 08:00:00
    before: '22:00:00'
  - condition: numeric_state
    entity_id: vacuum.d9_max_gen_2
    attribute: cleaned_area
    above: 5
  actions:
  - action: dreame_vacuum.vacuum_goto
    target:
      entity_id: vacuum.d9_max_gen_2
    data:
      x: -2200
      y: 175
  - wait_for_trigger:
    - trigger: state
      entity_id:
      - vacuum.d9_max_gen_2
      to:
      - idle
    timeout:
      hours: 0
      minutes: 5
      seconds: 0
      milliseconds: 0
    alias: Wait for arrival at spot
  - action: input_boolean.turn_on
    metadata: {}
    target:
      entity_id: input_boolean.dreame_d9_max_gen_2_behalter_entleeren
    data: {}
  - action: chime_tts.say
    target:
      entity_id:
      - media_player.lenovo_tab_p11
    data:
      chime_path: toast
      tts_platform: tts.google_ai_tts
      cache: true
      volume_level: 0.75
      message: Bitte entleere den Staubbehälter vom Sauger im OG
  - action: notify.duncan
    data:
      title: Dreame D9 Max Gen 2 Ready to Empty
      message: Please empty the dust container.
      data:
        tag: d9_max_gen2_empty_dust_container
        actions:
        - action: VACUUM_DONE_EMPTYING
          title: Done! Send to Dock
  - wait_for_trigger:
    - trigger: event
      event_type: mobile_app_notification_action
      event_data:
        action: VACUUM_DONE_EMPTYING
    - trigger: state
      entity_id:
      - input_boolean.dreame_d9_max_gen_2_behalter_entleeren
      to:
      - 'off'
      from:
      - 'on'
    timeout: 01:00:00
    continue_on_timeout: true
  - if:
    - condition: template
      value_template: '{{ wait.completed }}'
    then:
    - action: vacuum.return_to_base
      target:
        entity_id: vacuum.d9_max_gen_2
      data: {}
    - action: notify.duncan
      data:
        message: clear_notification
        data:
          tag: d9_max_gen2_empty_dust_container
    - action: input_boolean.turn_off
      metadata: {}
      target:
        entity_id: input_boolean.dreame_d9_max_gen_2_behalter_entleeren
      data: {}
  mode: single
