- id: '1754293444382'
  alias: Paludarium Pump & Fan Cycle (Daytime, Combined Zones)
  description: "## \U0001F33F Paludarium Pump & Fan Cycle (Daytime, Combined Zones)\n\n###
    \U0001F4CB Purpose\nAutomates the daytime cycling of left, Kallax, and right paludarium
    pumps in\n15-minute on/off intervals. After a pump turns off, a fan cooldown is
    started\nto maintain environmental stability. Includes checks for power strip\navailability
    and a failsafe 1-minute time pattern trigger.\n\n---\n\n### ⏰ Triggers\n- 1-minute
    time pattern (failsafe)\n- Pump switches turning `on` or `off` for 15 minutes\n\n---\n\n###
    ✅ Conditions\n- Only runs during daytime (between sunrise and sunset)\n- Zone-specific
    power strip must be on to control respective pumps\n\n---\n\n### \U0001F3AF Actions
    / Workflow\n- **Left, Kallax, Right Zones:**  \n  - If pump has been on for its
    duration, turn off and start fan cooldown  \n  - If pump has been off for its
    duration, turn pump back on\n- Uses variables to define pump/fan entities and
    durations\n- Runs zone sequences in parallel to allow simultaneous management\n\n---\n\n###
    \U0001F527 Technical Specs\n- **Mode:** `parallel` with a max of 10 to handle
    multiple concurrent sequences\n- **Pump On/Off Duration:** 14 minutes 55 seconds
    \ \n- **Fan Duration:** 2 minutes 30 seconds\n- Uses `script.run_fan_for_duration`
    to manage fan cooldown timing"
  triggers:
  - minutes: /1
    trigger: time_pattern
  - trigger: state
    entity_id:
    - switch.desk_paludarium_links_l2
    - switch.desk_paludarium_turm_rechts_l1
    - switch.desk_paludarium_turm_links_l3
    to: 'off'
    for:
      hours: 0
      minutes: 15
      seconds: 0
  - trigger: state
    entity_id:
    - switch.desk_paludarium_links_l2
    - switch.desk_paludarium_turm_rechts_l1
    - switch.desk_paludarium_turm_links_l3
    to: 'on'
    for:
      hours: 0
      minutes: 15
      seconds: 0
  conditions:
  - condition: sun
    before: sunset
    after: sunrise
  actions:
  - variables:
      pump_on_duration: 00:14:55
      pump_off_duration: 00:14:55
      fan_duration: 00:02:30
      pump_left: switch.desk_paludarium_turm_links_l3
      fan_left: switch.desk_paludarium_turm_links_l1
      pump_kallax: switch.desk_paludarium_links_l2
      fan_kallax: switch.desk_paludarium_links_l3
      pump_right: switch.desk_paludarium_turm_rechts_l1
      fan_right: switch.desk_paludarium_turm_rechts_l2
  - choose:
    - alias: Left Zone Control
      conditions:
      - condition: state
        entity_id: switch.schreibtisch_links_power_strip_l1
        state: 'on'
      - condition: or
        conditions:
        - condition: state
          entity_id: switch.desk_paludarium_turm_links_l3
          state: 'on'
          for: '{{ pump_on_duration }}'
        - condition: state
          entity_id: switch.desk_paludarium_turm_links_l3
          state: 'off'
          for: '{{ pump_off_duration }}'
      sequence:
      - choose:
        - alias: Left Pump ON duration elapsed - Turn pump OFF and start fan cooldown
          conditions:
          - condition: state
            entity_id: switch.desk_paludarium_turm_links_l3
            state: 'on'
            for: '{{ pump_on_duration }}'
          sequence:
          - action: switch.turn_off
            data: {}
            target:
              entity_id: '{{ pump_left }}'
          - data:
              fan_entity: '{{ fan_left }}'
              duration: '{{ fan_duration }}'
            action: script.run_fan_for_duration
        - alias: Left Pump OFF duration elapsed - Turn pump ON
          conditions:
          - condition: state
            entity_id: switch.desk_paludarium_turm_links_l3
            state: 'off'
            for: '{{ pump_off_duration }}'
          sequence:
          - action: switch.turn_on
            data: {}
            target:
              entity_id: '{{ pump_left }}'
    - alias: Kallax Zone Control
      conditions:
      - condition: state
        entity_id: switch.terrarium_tasmota4
        state: 'on'
      - condition: or
        conditions:
        - condition: state
          entity_id: switch.desk_paludarium_links_l2
          state: 'on'
          for: '{{ pump_on_duration }}'
        - condition: state
          entity_id: switch.desk_paludarium_links_l2
          state: 'off'
          for: '{{ pump_off_duration }}'
      sequence:
      - choose:
        - alias: Kallax Pump ON duration elapsed - Turn pump OFF and start fan cooldown
          conditions:
          - condition: state
            entity_id: switch.desk_paludarium_links_l2
            state: 'on'
            for: '{{ pump_on_duration }}'
          sequence:
          - target:
              entity_id: '{{ pump_kallax }}'
            action: switch.turn_off
            data: {}
          - data:
              fan_entity: '{{ fan_kallax }}'
              duration: '{{ fan_duration }}'
            action: script.run_fan_for_duration
        - alias: Kallax Pump OFF duration elapsed - Turn pump ON
          conditions:
          - condition: state
            entity_id: switch.desk_paludarium_links_l2
            state: 'off'
            for: '{{ pump_off_duration }}'
          sequence:
          - target:
              entity_id: '{{ pump_kallax }}'
            action: switch.turn_on
            data: {}
    - alias: Right Zone Control
      conditions:
      - condition: state
        entity_id: switch.schreibtisch_rechts_power_strip_l5
        state: 'on'
      - condition: or
        conditions:
        - condition: state
          entity_id: switch.desk_paludarium_turm_rechts_l1
          state: 'on'
          for: '{{ pump_on_duration }}'
        - condition: state
          entity_id: switch.desk_paludarium_turm_rechts_l1
          state: 'off'
          for: '{{ pump_off_duration }}'
      sequence:
      - choose:
        - alias: Right Pump ON duration elapsed - Turn pump OFF and start fan cooldown
          conditions:
          - condition: state
            entity_id: switch.desk_paludarium_turm_rechts_l1
            state: 'on'
            for: '{{ pump_on_duration }}'
          sequence:
          - target:
              entity_id: '{{ pump_right }}'
            action: switch.turn_off
            data: {}
          - data:
              fan_entity: '{{ fan_right }}'
              duration: '{{ fan_duration }}'
            action: script.run_fan_for_duration
        - alias: Right Pump OFF duration elapsed - Turn pump ON
          conditions:
          - condition: state
            entity_id: switch.desk_paludarium_turm_rechts_l1
            state: 'off'
            for: '{{ pump_off_duration }}'
          sequence:
          - target:
              entity_id: '{{ pump_right }}'
            action: switch.turn_on
            data: {}
  mode: parallel
  max: 10
- id: '1755587220350'
  alias: GitHub Exporter addon start every hour
  description: "## ⏱ GitHub Exporter Add-on Scheduler\n\n### \U0001F4CB Purpose\nEnsures
    the `git-exporter` Home Assistant add-on runs consistently every hour\nto export
    and update GitHub repository data automatically.\n\n---\n\n### ⏰ Trigger\n- Fires
    on a repeating hourly schedule (`time_pattern` with `/1` hour).\n\n---\n\n###
    ✅ Conditions\n- None. The add-on starts unconditionally every hour.\n\n---\n\n###
    \U0001F3AF Actions / Workflow\n- Starts the `git-exporter` add-on via `hassio.addon_start`\n-
