- id: '1705389061375'
  alias: Homeassistent Start & Stop
  description: Notifies when Home Assistant starts or stops, restarts backup add-ons,
    and locates devices on startup.
  triggers:
  - event: start
    id: Start
    trigger: homeassistant
  - event: shutdown
    id: Stop
    trigger: homeassistant
  conditions: []
  actions:
  - alias: Start
    if:
    - condition: trigger
      id:
      - Start
    then:
    - metadata: {}
      data:
        title: Homeassistent is Up
        message: Homeassistant is online and reachable at http://{{ states('sensor.local_ip')
          }}:8123
        data:
          notification_icon: mdi:restart
      action: notify.duncan
    - action: hassio.addon_restart
      metadata: {}
      data:
        addon: de91e161_hassio_onedrive_backup
    - action: hassio.addon_restart
      metadata: {}
      data:
        addon: cebe7a76_hassio_google_drive_backup
    - delay:
        hours: 0
        minutes: 1
        seconds: 0
        milliseconds: 0
    - action: icloud3.action
      metadata: {}
      data:
        command: Locate Device(s) using iCloud
        device_name: 3675fe049f5a257fe6eebb6533252e74
    - delay:
        hours: 0
        minutes: 0
        seconds: 15
        milliseconds: 0
    - action: icloud3.action
      metadata: {}
      data:
        command: Locate Device(s) using iCloud
        device_name: e146d7ea7dd792848fa6d8090a91ff6c
  - alias: Stop
    if:
    - condition: trigger
      id:
      - Stop
    then:
    - metadata: {}
      data:
        title: Homeassistent is Down
        message: 'Homeassistant was up for: {{ time_since( as_datetime(states(''sensor.uptime'')),
          2)}}'
        data:
          notification_icon: mdi:restart
      action: notify.duncan
  mode: single
