- id: '1751542900177'
  alias: Rollo Sommer Automatisch Steuern (mit Grund und Manueller Modus)
  description: "## \U0001F31E Rollo Sommer Automatisch Steuern (mit Grund und Manueller
    Modus)\n\n### \U0001F4CB Purpose\nAutomates the summer operation of the Wintergarten
    (sunroom) roller shutter\nbased on sensor readings, while also handling manual
    override mode. Provides\nnotifications with the reason for opening/closing and
    status updates when\nmanual mode is activated or deactivated.\n\n---\n\n### ⏰
    Triggers\n- Sensor indicates roller should close (`on`) for 10 minutes\n- Sensor
    indicates roller should open (`off`) for 15 minutes\n- Manual override boolean
    toggled (`on` or `off`)\n- Sensor attribute `not_raining` changes to `0` for 1
    minute\n\n---\n\n### ✅ Conditions\n- Only runs during daytime (between sunrise
    and sunset)\n- Roller must not already be in the desired state (open/closed)\n\n---\n\n###
    \U0001F3AF Actions / Workflow\n- **Rollo schließen:** Closes roller and sends
    notification with reason\n- **Rollo öffnen:** Opens roller and sends notification
    with reason\n- **Manual Mode Activated:** Sends notification and clears automatic
    mode alerts\n- **Manual Mode Deactivated:** Sends notification and clears manual
    mode alerts\n\n---\n\n### \U0001F527 Technical Specs\n- **Mode:** `single` (prevents
    overlapping executions)\n- Uses `cover.open_cover` / `cover.close_cover` to control
    roller\n- Notifications are tagged (`rollo_close`, `rollo_open`, `rollo_manual`,
    `rollo_automatic`) for tracking"
  triggers:
  - trigger: state
    id: rollo_close
    entity_id:
    - binary_sensor.rollo_summer_should_close
    to: 'on'
    for:
      hours: 0
      minutes: 10
      seconds: 0
  - trigger: state
    id: rollo_open
    entity_id:
    - binary_sensor.rollo_summer_should_close
    to: 'off'
    for:
      hours: 0
      minutes: 15
      seconds: 0
  - trigger: state
    id: manual_on
    entity_id: input_boolean.rollo_summer_override
    to: 'on'
  - trigger: state
    id: manual_off
    entity_id: input_boolean.rollo_summer_override
    to: 'off'
  - trigger: state
    entity_id:
    - binary_sensor.rollo_summer_should_close
    attribute: not_raining
    to: '0'
    id: rollo_open
    for:
      hours: 0
      minutes: 1
      seconds: 0
  conditions:
  - condition: sun
    before: sunset
    after: sunrise
  - condition: numeric_state
    entity_id: binary_sensor.rollo_summer_should_close
    attribute: summer
    above: 0
  actions:
  - choose:
    - alias: Rollo schließen
      conditions:
      - condition: trigger
        id: rollo_close
      - condition: state
        entity_id: input_boolean.rollo_summer_override
        state: 'off'
      - condition: not
        conditions:
        - condition: state
          entity_id: cover.wintergarten_rolladen_dachfenster
          state: closed
      sequence:
      - action: cover.close_cover
        target:
          entity_id: cover.wintergarten_rolladen_dachfenster
        data: {}
      - action: notify.duncan
        data:
          data:
            tag: rollo_close
          message: '☀️ wird geschlossen: {{ state_attr(''binary_sensor.rollo_summer_should_close'',
            ''reason'') or ''Kein Grund angegeben.'' }}

            '
          title: Rollo
    - alias: Rollo öffnen
      conditions:
      - condition: trigger
        id: rollo_open
      - condition: state
        entity_id: input_boolean.rollo_summer_override
        state: 'off'
      - condition: not
        conditions:
        - condition: state
          entity_id: cover.wintergarten_rolladen_dachfenster
          state: open
      sequence:
      - action: cover.open_cover
        target:
          entity_id: cover.wintergarten_rolladen_dachfenster
        data: {}
      - action: notify.duncan
        data:
          data:
            tag: rollo_open
          message: "\U0001F324️ wird geöffnet: {{ state_attr('binary_sensor.rollo_summer_should_close',
            'reason') or 'Kein Grund angegeben.' }}\n"
          title: Rollo
    - alias: Manueller Modus aktiviert
      conditions:
      - condition: trigger
        id: manual_on
      sequence:
      - action: notify.duncan
        data:
          data:
            tag: rollo_manual
          message: "\U0001F6D1 Rollo: Manueller Modus aktiviert"
          title: Rollo Mode
      - action: notify.duncan
        metadata: {}
        data:
          message: clear_notification
          data:
            tag: rollo_automatic
    - alias: Manueller Modus deaktiviert
      conditions:
      - condition: trigger
        id: manual_off
      sequence:
      - action: notify.duncan
        data:
          data:
            tag: rollo_automatic
          message: '✅ Rollo: Automatikmodus wieder aktiv'
          title: Rollo Mode
      - action: notify.duncan
        metadata: {}
        data:
          message: clear_notification
          data:
            tag: rollo_manual
  mode: single
- id: '1751548094070'
  alias: Poco F7 Request Location with Retry and Final Notification
  description: "## \U0001F4CD Poco F7 – Automatic Location Recovery & Reliability
    System\n\n### \U0001F3AF **Purpose**\nEnsures Duncan’s **location** in Home Assistant
    stays accurate and up to date.  \nThis automation detects when the **Poco F7**
    stops reporting a valid position  \n(e.g., becomes `unknown` or `unavailable`)
    and automatically attempts to fix it  \nby requesting repeated location updates
    from the device.\n\n### ⚙️ **How It Works**\n- **Triggers** when:\n  - Home Assistant
    starts  \n  - Duncan’s location becomes `unknown` or `unavailable`  \n  - Every
    **5 minutes** while he’s awake and not connected to home Wi-Fi\n  - When Wifi
    Connection Changes\n- **Retries up to 3 times**, sending location update requests
    every **60 seconds**  \n  until the device reports a valid location.\n- If the
    problem persists after all retries, a **final notification** is sent  \n  asking
    Duncan to manually refresh his location in the Home Assistant app.\n\n### \U0001F9E9
    **Automation Logic Overview**\n\n| \U0001F9E9 Type | \U0001F4A1 Name / Alias |
    \U0001F50D Details |\n|----------|------------------|-------------|\n| **Trigger**
    | **Home Assistant Start** | When Home Assistant starts (`event: start`). |\n|
    **Trigger** | **Location Lost** | When `person.duncan` state changes to `unknown`
    or `unavailable`. |\n| **Trigger** | **Periodic Check** | Every 5 minutes while
    conditions are met (`minutes: /5`). |\n| **Condition** | **Not on Home Wi-Fi**
    | Skips if connected to Wi-Fi `DESK` or `Cudy-69F2`. |\n| **Condition** | **Awake
    Condition** | Runs only if bed occupancy sensor `binary_sensor.esp32_c3_mini_bett_nachtlicht_master_bed_occupied`
    is **off** (Duncan not in bed). |\n| **Action 1** | **\U0001F501 Repeated Location
    Requests** | Repeats up to **3 times**, every **60 seconds**, sending `request_location_update`
    to `notify.mobile_app_poco_f7`. Stops early if a valid location is received. |\n|
    **Action 2** | **\U0001F4F1 Final Manual Update Notification** | If still `not_home`,
    `unknown`, or `unavailable` after retries → sends a notification asking Duncan
    to manually refresh location. |\n| **Mode** | **Single** | Prevents overlapping
    execution of the same automation. |\n\n---\n\n**Status:** Active reliability layer
    for accurate person tracking  \n**Mode:** Single — prevents overlapping runs"
  triggers:
  - trigger: homeassistant
    event: start
  - trigger: state
    entity_id: person.duncan
    to:
    - unavailable
    - unknown
  - trigger: time_pattern
    minutes: /5
  - trigger: state
    entity_id:
    - sensor.poco_f7_wi_fi_connection
  conditions:
  - condition: or
    conditions:
    - condition: not
      conditions:
      - condition: or
        conditions:
