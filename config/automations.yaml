- id: '1723675237746'
  alias: 3D Printer Timelapse
  description: "## \U0001F5A8️ 3D Printer Timelapse  \n\n### \U0001F4CB **Timelapse
    Capture Automation**  \nThis automation captures snapshots from the 3D printer
    camera at regular intervals during a print and generates a timelapse video when
    the print finishes.  \n\nIt ensures that snapshots are only taken when the printer
    is powered and actively printing, preventing unnecessary captures.  \n\n---\n\n###
    ⏰ **Triggers**  \n\n| Trigger | Event / Condition |\n|---------|-----------------|\n|
    `time_pattern` | Every 15 seconds (`/15` seconds) |\n| `sensor.ankermake_m5c_progress`
    | Numeric state above 99.99% for 10 minutes → indicates print finished |\n\n---\n\n###
    ✅ **Conditions**  \n- **Printer switch is on**: `switch.ankermake_1`\n\nThis prevents
    taking snapshots if the printer is powered off.  \n\n---\n\n### \U0001F3AF **Actions
    / Workflow**  \n\n1. **Capture Timelapse Pictures**  \n   - Runs **every 15 seconds**
    while the printer is powered and actively printing (sensor `c8c1983e6bcaf5b9c2acf5d654cf7bc2`
    above 15).  \n   - Snapshot filename format:  \n     ```\n     /media/m5ccam/pictures/{{
    job_name }}_YYYYMMDD-HHMMSS.jpg\n     ```\n   - Captures images using `camera.ankermake_m5c_camera_mainstream`.
    \ \n\n2. **Create Timelapse Video**  \n   - Triggered when `sensor.ankermake_m5c_progress`
    exceeds 99.99% for 10 minutes (print finished).  \n   - Calls `script.create_timelapse`
    to generate the video from captured snapshots.  \n\n---\n\n### \U0001F527 **Technical
    Specs**  \n- **Camera:** `camera.ankermake_m5c_camera_mainstream`  \n- **Power
    Sensor:** `c8c1983e6bcaf5b9c2acf5d654cf7bc2`  \n- **Job Name Sensor:** `sensor.job_name_2`
    \ \n- **Snapshot Interval:** 15 seconds  \n- **Print Finish Detection:** 99.99%
    completion for 10 minutes  \n- **Mode:** `parallel` (max 3 concurrent executions)
    \ \n\n---\n\n### ⚡ **Notes / Best Practices**  \n- Ensures snapshots are only
    taken if the printer is on and actively printing.  \n- Timelapse creation triggers
    automatically when the print completes.  \n- Filenames are timestamped to avoid
    overwriting previous snapshots.  \n- Running in `parallel` mode allows overlapping
    snapshot intervals if needed, but max 3 concurrent executions prevent overload.\n"
  triggers:
  - seconds: /15
    id: every_15th_second
    trigger: time_pattern
  - entity_id:
    - sensor.ankermake_m5c_progress
    for:
      hours: 0
      minutes: 10
      seconds: 0
    above: 99.99
    id: Print finished
    enabled: true
    trigger: numeric_state
  conditions:
  - condition: state
    entity_id: switch.ankermake_1
    state: 'on'
  actions:
  - alias: Time lapse pictures
    if:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - every_15th_second
      - type: is_power
        condition: device
        device_id: 7b50ca1fdd0a5ceb179537cac54ed999
        entity_id: c8c1983e6bcaf5b9c2acf5d654cf7bc2
        domain: sensor
        above: 15
    then:
    - metadata: {}
      data:
        filename: /media/m5ccam/pictures/{{states('sensor.job_name_2') | string }}_{{
          now().strftime("%Y%m%d-%H%M%S") }}.jpg
      target:
        entity_id:
        - camera.ankermake_m5c_camera_mainstream
      action: camera.snapshot
      enabled: true
  - if:
    - condition: trigger
      id:
      - Print finished
    then:
    - action: script.create_timelapse
      metadata: {}
      data: {}
    alias: Create Timelapse
  mode: parallel
  max: 3
