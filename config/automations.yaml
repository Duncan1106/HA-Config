                - media
              action: auto_backup.backup
        - if:
          - condition: template
            value_template: '{{ not use_action_hourly }}'
          - condition: template
            value_template: '{{ backup_action | length > 0 }}'
          then:
          - data:
              name: '{{ name }}'
              password: '{{ password }}'
              keep_days: '{{ keep_days }}'
              download_path:
              - /share/NAS_Share/Backup/
              include_folders:
              - config
