    device_id: 7be1308679cc0cfa3cc595fe650e29ed
    type: action
    subtype: button_2_double
    trigger: device
    id: Waschmaschine
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Trockner
      - condition: state
        entity_id: input_boolean.trockner_fertig
        state: 'on'
      sequence:
      - action: input_boolean.turn_off
        metadata: {}
        data: {}
        target:
          entity_id: input_boolean.trockner_fertig
      alias: Trockner
    - conditions:
      - condition: trigger
        id:
        - Waschmaschine
      - condition: state
        state: 'on'
        entity_id: input_boolean.waschmaschine_fertig
      sequence:
      - action: input_boolean.turn_off
        metadata: {}
        data: {}
        target:
          entity_id:
          - input_boolean.waschmaschine_fertig
      alias: Waschmaschine
