- id: '1751548094070'
  alias: Poco F7 Request Location with Retry and Final Notification
  description: This automation ensures accurate location tracking for Duncan by repeatedly
    requesting location updates from his Poco F7 when he is not home or his location
    is unknown/unavailable. If updates fail after multiple attempts, it sends a notification
    to manually update the location.
  triggers:
  - event: start
    trigger: homeassistant
  - entity_id: person.duncan
    to:
    - not_home
    - unavailable
    - unknown
    trigger: state
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: person.duncan
      state: not_home
    - condition: state
      entity_id: person.duncan
      state: unavailable
    - condition: state
      entity_id: person.duncan
      state: unknown
  actions:
  - repeat:
      until:
      - condition: or
        conditions:
        - condition: not
          conditions:
          - condition: or
            conditions:
            - condition: state
              entity_id: person.duncan
              state: not_home
            - condition: state
              entity_id: person.duncan
              state: unavailable
            - condition: state
              entity_id: person.duncan
              state: unknown
        - condition: template
          value_template: '{{ repeat.index >= 10 }}'
      sequence:
      - action: notify.mobile_app_poco_f7
        data:
          message: request_location_update
      - delay:
          hours: 0
          minutes: 2
          seconds: 0
          milliseconds: 0
  - if:
    - condition: or
      conditions:
      - condition: state
        entity_id: person.duncan
        state: not_home
      - condition: state
        entity_id: person.duncan
        state: unavailable
      - condition: state
        entity_id: person.duncan
        state: unknown
    then:
    - action: notify.mobile_app_poco_f7
      data:
        title: Location update failed
        message: 'Please open the Home Assistant app on your Poco F7 to update your
          location manually.

          '
  mode: single
