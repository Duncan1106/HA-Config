- id: '1738246026422'
  alias: Aqara H1 EU Decoupled Switch Left
  description: "## Aqara H1 EU Decoupled Switch Left  \n\nThis automation handles
    the behavior of the **Aqara H1 EU Decoupled Switch (left button)**.  \nIt is designed
    to toggle the **Schräg switch** whenever the decoupled left button is pressed.
    \ \n\n### Key Features:\n- **Trigger**:  \n  Activated by the **single_left**
    action event from the Aqara H1 EU switch.  \n\n- **Conditions**:  \n  1. The switch
    must be in **decoupled mode** (`select.duncan_lichtschalter_operation_mode_left`).
    \ \n  2. A **cooldown period of 10 seconds** ensures the automation does not trigger
    repeatedly if pressed too quickly.  \n\n- **Action**:  \n  Toggles the state of
    the **Schräg switch** (`switch.schrag`).  \n\n### Purpose:  \nThis automation
    allows the left button of the Aqara H1 EU switch to act as a wireless trigger
    for controlling the Schräg switch, while avoiding accidental or rapid re-triggers
    through a built-in cooldown."
  triggers:
  - domain: mqtt
    device_id: adf0a0e198e203d27f9ac23dd706eceb
    type: action
    subtype: single_left
    metadata: {}
    trigger: device
  conditions:
  - condition: state
    entity_id: select.duncan_lichtschalter_operation_mode_left
    state: decoupled
  - condition: template
    value_template: '{{ now() - (state_attr(this.entity_id, ''last_triggered'') |
      default( as_datetime(''0''), true)) > timedelta(seconds=10) }}'
  actions:
  - action: switch.toggle
    metadata: {}
    data: {}
    target:
      entity_id:
      - switch.schrag
  mode: single
