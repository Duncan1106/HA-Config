        value_template: '{{ wait.trigger.event.data.action == ''action2'' and wait.trigger.event.data.title
          == ''Dreame Clean-Up EG'' }}'
      sequence: []
    - conditions:
      - condition: template
        value_template: '{{ wait.trigger.event.data.action == ''action3'' and wait.trigger.event.data.title
          == ''Dreame Clean-Up EG''}}'
      sequence:
      - action: vacuum.return_to_base
        metadata: {}
        data: {}
        target:
          entity_id:
          - vacuum.d9_max_gen_2
  mode: restart
  max_exceeded: silent
  variables:
    notify_device: 905c163dcc62544838edb078413723b2
    trigger_entity: schedule.dreame_clean_up
