- id: '1769287041355'
  alias: 'System: GFS Backup Cleanup Report'
  description: Runs generational backup cleanup and sends rich summary to UI and stripped
    text to Duncan. Includes error handling and failure counts.
  triggers:
  - trigger: time
    at: '20:00:00'
  actions:
  - action: shell_command.cleanup_backups
    data:
      type: hourly
      dry_run: 0
    response_variable: hourly
  - action: shell_command.cleanup_backups
    data:
      type: daily
      dry_run: 0
    response_variable: daily
  - action: shell_command.cleanup_backups
    data:
      type: weekly
      dry_run: 0
    response_variable: weekly
  - action: shell_command.cleanup_backups
    data:
      type: monthly
      dry_run: 0
    response_variable: monthly
  - variables:
      results: '{{ [hourly, daily, weekly, monthly] }}'
      failed_count: '{{ results | selectattr(''returncode'', ''ne'', 0) | list | count
        }}'
      any_failed: '{{ failed_count > 0 }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ any_failed }}'
      sequence:
      - action: notify.persistent_notification
        data:
          title: ❌ Cleanup Failed ({{ failed_count }} error{{ 's' if failed_count
            > 1 else '' }})
          message: '**Status Report:**

            - Hourly: {{ ''✅ OK'' if hourly.returncode == 0 else ''❌ FAIL ('' ~ hourly.returncode
            ~ '')'' }}

            - Daily: {{ ''✅ OK'' if daily.returncode == 0 else ''❌ FAIL ('' ~ daily.returncode
            ~ '')'' }}

            - Weekly: {{ ''✅ OK'' if weekly.returncode == 0 else ''FAIL ('' ~ weekly.returncode
            ~ '')'' }}

            - Monthly: {{ ''✅ OK'' if monthly.returncode == 0 else ''FAIL ('' ~ monthly.returncode
            ~ '')'' }}


            The maintenance report was not sent to Duncan.

            '
      - stop: Cleanup failed with {{ failed_count }} error(s).
    default:
    - if:
      - condition: state
        entity_id: input_boolean.notify_on_nas_sync_success
        state:
        - 'on'
      then:
      - variables:
          report_json: "{% set ns = namespace(total_mb=0, total_files=0, list=\"\")
            %} {% for r in results if r.stdout is defined and r.stdout | trim != \"\"
            %}\n  {% set data = r.stdout | from_json %}\n  {% set ns.list = ns.list
            + \"- **\" + data.type | capitalize + \":** \" + data.files_to_delete
            | string + \" files (\" + data.space_to_free_MB | string + \" MB)\\n\"
            %}\n  {% set ns.total_mb = ns.total_mb + (data.space_to_free_MB | float(0))
            %}\n  {% set ns.total_files = ns.total_files + (data.files_to_delete |
            int(0)) %}\n{% endfor %} {{ {'list': ns.list, 'total_gb': (ns.total_mb
            / 1024) | round(2), 'count': ns.total_files} }}\n"
      - action: notify.persistent_notification
        data:
          title: "\U0001F4BE Backup Cleanup Summary"
          message: "{% set info = report_json %}\n### Generational Cleanup Status\n{{
            info.list }} \n--- \n**Total Reclaimed:** {{ info.total_gb }} GB\n**Total
            Files Removed:** {{ info.count }}\n"
      - action: notify.duncan
        data:
          title: NAS Maintenance Complete
          message: "{% set info = report_json %}\nBackup cleanup report for today:\n
            \ {{ info.list | replace('**', '') }}\nTotal space freed: {{ info.total_gb
            }} GB.\n"
          data:
            tag: nas_maintenance_complete
- id: '1769546818976'
  alias: NAS Connectivity Monitor
  description: "\U0001F4BE **NAS Connectivity Monitor**\n\n### \U0001F4CB Intelligent
    Storage Connectivity Control\n\nThis automation provides real-time oversight of
    Network Attached Storage (NAS) mount points. It is designed with a **safety-first**
    communication strategy, ensuring that administrative personnel are immediately
    alerted to storage disconnections while maintaining a clean notification history
    through automated dismissal logic.\n\nThe operational strategy relies on **state-tracking
    with persistence validation** to prevent flapping and ensures that high-priority
    alerts are delivered only when a genuine interruption occurs.\n\n---\n\n### Trigger
    Overview Table\n\n| Type | Entity / Condition | ID | Purpose |\n| :--- | :---
    | :--- | :--- |\n| **State** | `binary_sensor.nas_share_verbunden`, `binary_sensor.nas_filme_verbunden`
    | `disconnected` | Detects when a NAS share transition from **on** to **off**.
    |\n| **State** | `binary_sensor.nas_share_verbunden`, `binary_sensor.nas_filme_verbunden`
    | `reconnected` | Confirms a stable reconnection after a **1-minute** duration.
    |\n\n---\n\n### Operational Logic Sections\n\n#### ⚠️ Disconnected Mode\n- **Purpose**:
    Immediate notification of storage unavailability.\n- **Logic Overview**: Triggered
    instantly when a monitored sensor reports an **off** state.\n- **Effect**: Sends
    a **high-priority** notification to `notify.admin` containing the specific entity
    name and a timestamp. The alert is assigned a unique **tag** based on the entity
    ID for targeted management.\n\n#### ✅ Reconnected Mode\n- **Purpose**: Automated
    workspace cleanup and status restoration.\n- **Logic Overview**: Triggered when
    a sensor returns to **on** and remains stable for **00:01:00**.\n- **Effect**:
    Issues a `clear_notification` command to the admin device, removing the specific
    alert associated with the restored share.\n\n---\n\n### Technical Overview\n\n-
    **Automation Mode**: `parallel` (Allows simultaneous monitoring of multiple shares)\n-
    **Execution Method**: Direct `notify.admin` action calls with dynamic data templates.\n-
    **Key Inputs**: `binary_sensor.nas_share_verbunden`, `binary_sensor.nas_filme_verbunden`\n-
    **Controlled Entities**: Administrative notification engine (`notify.admin`).\n-
    **Safety Mechanisms**: \n    - **Notification Tagging**: Uses `nas-alert-{{ trigger.entity_id
    }}` to ensure the system only clears the alert for the specific share that reconnected.\n
    \   - **Stability Delay**: A 1-minute `for` duration on reconnection prevents
    premature \"all-clear\" messages during intermittent network toggling.\n\n---\n\n###
    \U0001F4A1 Notes\n\n- **Rationale**: The use of `priority: high` ensures that
    connection drops bypass \"Do Not Disturb\" settings on supported devices, reflecting
    the critical nature of storage availability.\n- **Logic Highlight**: The automation
    utilizes **Parallel mode** to ensure that if both `share` and `filme` sensors
    drop simultaneously, both notification paths are processed independently without
    queuing or cancellation.\n- **Fail-safe**: Reconnection triggers require a 60-second
    dwell time to filter out \"flapping\" network states that might otherwise spam
    the administrator.\n"
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.nas_share_verbunden
    - binary_sensor.nas_filme_verbunden
    from: 'on'
    to: 'off'
    id: disconnected
  - trigger: state
    entity_id:
    - binary_sensor.nas_share_verbunden
    - binary_sensor.nas_filme_verbunden
    from: 'off'
    to: 'on'
    for:
      minutes: 1
    id: reconnected
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: disconnected
      sequence:
      - action: notify.admin
        data:
          title: ⚠️ NAS Connection Alert
          message: 'The sensor {{ trigger.to_state.name }} reported a status of  {{
            trigger.to_state.state }} at {{ now().strftime(''%H:%M:%S'') }}.

            '
          data:
            tag: nas-alert-{{ trigger.entity_id }}
            group: NAS Status
            priority: high
    - conditions:
      - condition: trigger
        id: reconnected
      sequence:
      - action: notify.admin
        data:
          message: clear_notification
          data:
            tag: nas-alert-{{ trigger.entity_id }}
  mode: parallel
- id: 1705101110242_battery_plus_low
  alias: 'Notify: Offline or Low Battery Devices (Detailed)'
  description: "# \U0001F50B **Notify: Offline or Low Battery Devices**\n\n### \U0001F4CB
    Intelligent Battery Monitoring System Control\n\n**Intent**\nAutomated health
    monitoring for the smart home ecosystem, designed to preemptively identify and
    notify the administrator of hardware maintenance requirements.\n\n**Operational
    Strategy**\nThe system performs a daily deep-scan of the entity registry at a
    scheduled time. It evaluates all battery-class sensors for two critical failure
    states: communication loss (**Unavailable/Unknown**) or power depletion (**Below
    Threshold**). \n\n**Reliability Mechanisms**\nUses a comprehensive template-based
    aggregation method that dynamically filters a global exclusion list to prevent
    false positives from mobile devices or transient entities. It leverages `battery_plus`
    integration data to provide actionable maintenance information (battery types
    and quantities) directly within the alert.\n\n---\n\n### Trigger Overview Table\n\n|
    Type | Entity / Condition | ID | Purpose |\n| :--- | :--- | :--- | :--- |\n| **Time**
    | `10:30:00` | N/A | Initiates the daily maintenance scan during active morning
    hours. |\n\n---\n\n### Operational Logic Sections\n\n#### Battery Health Evaluation\n\n**Purpose**\nTo
    identify hardware requiring physical intervention (recharging, replacement, or
    reconnection).\n\n**Logic Overview**\nThe automation triggers only if the `battery_alert_list`
    is not empty and the current day matches the `day` variable (0 = Daily). It inspects
    all `sensor` and `binary_sensor` entities with a `device_class` of **battery**.\n*
    **Offline Check:** Detects if state is **unavailable** or **unknown**.\n* **Level
    Check:** Detects if numeric state is **≤ 15%** or if binary state is **on**.\n\n**Effect**\nGenerates
    a formatted list and dispatches a persistent notification via **notify.duncan**
    with the tag `offline_devices`.\n\n---\n\n### Technical Overview\n\n* **Automation
    Mode:** `single`\n* **Execution Method:** Direct action via `notify.duncan`.\n*
    **Key Inputs:** * `low_battery_threshold`: **15**\n    * `day`: **0** (All days)\n*
    **Controlled Entities:** Notification service (`notify.duncan`).\n* **Safety Mechanisms:**
    * **Exclusion Filter:** Hardcoded list of mobile devices (e.g., `sensor.fp4_battery_level`)
    to ignore non-static hardware.\n    * **Battery Plus Integration:** Automatically
    attempts to pull `battery_type_and_quantity` attributes to assist in hardware
    replacement.\n\n---\n\n### \U0001F4A1 Notes\n\n* **Dynamic Discovery:** The template
    automatically discovers new battery devices without manual configuration, provided
    they have the correct `device_class`.\n* **Contextual Awareness:** By checking
    `device_id(s.entity_id)`, the logic links generic sensors to their parent device
    to pull specific battery hardware requirements (e.g., \"2x CR2032\"), reducing
    maintenance friction.\n* **Noise Reduction:** Uses a `trim` check in the condition
    to ensure the notification engine is never fired for an empty list.\n"
  triggers:
  - at: '10:30:00'
    trigger: time
  conditions:
  - condition: template
    value_template: '{{ battery_alert_list|trim != '''' and (day == 0 or day == now().isoweekday())
      }}'
  actions:
  - action: notify.duncan
    data:
      title: "\U0001FAAB Battery Issues Detected"
      message: 'The following battery-powered devices need attention:


        {{ battery_alert_list }}

        '
      data:
        tag: offline_devices
  variables:
    day: 0
    low_battery_threshold: 15
    exclude:
    - sensor.fp4_battery_level
    - sensor.iphone_von_enya_battery_level
    - sensor.poco_f7_battery_level
    - sensor.mi_9t_battery_level
    - sensor.wvgzzze2zpe005371_battery_level
    battery_alert_list: "{%- set entities =\n    (states.sensor\n      | selectattr('attributes.device_class',
      'defined')\n      | selectattr('attributes.device_class', 'eq', 'battery')\n
      \     | rejectattr('entity_id', 'search', '_battery_plus$')\n      | list)\n
      \   +\n    (states.binary_sensor\n      | selectattr('attributes.device_class',
      'defined')\n      | selectattr('attributes.device_class', 'eq', 'battery')\n
      \     | rejectattr('entity_id', 'search', '_battery_plus$')\n      | list)\n-%}\n\n{%-
      set result = namespace(items=[]) -%}\n\n{%- for s in entities -%}\n  {%- if
      s.entity_id in exclude -%}\n    {%- continue -%}\n  {%- endif -%}\n\n  {%- set
      state = s.state -%}\n\n  {# Determine if the sensor is offline #}\n  {%- set
      is_offline = state in ['unavailable', 'unknown'] -%}\n\n  {# Determine if the
      sensor is low battery #}\n  {%- set is_low = false -%}\n  {%- if not is_offline
      -%}\n    {%- if s.domain == 'sensor' -%}\n      {%- set value = state | float(-1)
      -%}\n      {%- set is_low = value >= 0 and value <= low_battery_threshold -%}\n
      \   {%- elif s.domain == 'binary_sensor' -%}\n      {%- set is_low = state ==
      'on' -%} {# on = low battery #}\n    {%- endif -%}\n  {%- endif -%}\n\n  {%-
      if not (is_offline or is_low) -%}\n    {%- continue -%}\n  {%- endif -%}\n\n
      \ {# Lookup _battery_plus info if available #}\n  {%- set dev_id = device_id(s.entity_id)
      -%}\n  {%- set battery_info = none -%}\n  {%- for e in device_entities(dev_id)
      -%}\n    {%- if e.endswith('_battery_plus') -%}\n      {%- set battery_info
      = state_attr(e, 'battery_type_and_quantity') -%}\n      {%- break -%}\n    {%-
      endif -%}\n  {%- endfor -%}\n\n  {# Set status text #}\n  {%- set status =\n
      \     \"Offline\"\n      if is_offline\n      else \"Low battery\"\n      if
      s.domain == 'binary_sensor'\n      else \"Low battery (\" ~ value | int ~ \"%)\"\n
      \ -%}\n\n  {# Build single-line alert #}\n  {%- set line =\n    \"• \"\n    ~
      s.name ~ \" (\" ~ s.entity_id ~ \")\"\n    ~ \" — \" ~ status\n    ~ (\n      \"
      — \" ~ battery_info\n      if battery_info is not none\n      else \"\"\n    )\n
      \ -%}\n\n  {%- set result.items = result.items + [line] -%}\n{%- endfor -%}\n\n{{
      result.items | join('\\n') }}"
  mode: single
- id: '1769760819099'
  alias: 'ESPHome: Controlled Firmware Auto-Update'
  description: 'Automatically installs ESPHome firmware updates once per day at 10:00.
    Updates are triggered if the month changed OR the patch gap is >= 2. Limits updates
    to 5 devices per day, skips devices already updating. Uses Spook actions to manage
    HAGHS ignore labels.

    '
  triggers:
  - trigger: time
    at: '10:00:00'
  conditions:
  - condition: template
    value_template: '{{ eligible_updates | length > 0 }}'
  actions:
  - action: homeassistant.add_label_to_entity
    data:
      label_id:
      - haghs_ignore
      entity_id: '{{ eligible_updates | map(attribute=''entity'') | list }}'
    enabled: true
  - repeat:
      for_each: '{{ updates_today }}'
      sequence:
      - action: homeassistant.remove_label_from_entity
        data:
          label_id:
          - haghs_ignore
          entity_id:
          - '{{ repeat.item.entity }}'
      - target:
          entity_id: '{{ repeat.item.entity }}'
        action: update.install
    enabled: true
  - if:
    - condition: template
      value_template: '{{ update_message | trim | length > 0 }}'
    then:
    - action: notify.duncan
      data:
        title: ESPHome Firmware Updates Installed
        message: '{{ update_message }}'
        data:
          actions:
          - action: URI
            title: Open ESPHome
            uri: /hassio/ingress/5c53de3b_esphome
          - action: URI
            title: Open Updates
            uri: /config/updates
    - action: persistent_notification.create
      data:
        title: ESPHome Firmware Updates Installed
        message: '{{ update_message |replace(''

          '',''<br>'') }}'
  mode: single
  variables:
    patch_gap_threshold: 1
    esphome_update_entities: "{{ integration_entities('esphome')\n   | select('match',
      '^update\\\\.')\n   | list }}"
    eligible_updates: "{% set ns = namespace(items=[]) %} {% for e in esphome_update_entities
      %}\n  {% set installed = state_attr(e, 'installed_version') %}\n  {% set latest
      = state_attr(e, 'latest_version') %}\n  {% set in_progress = state_attr(e, 'in_progress')
      %}\n\n  {% if installed and latest and not in_progress %}\n    {% set i = installed.split('.')[:3]
      %}\n    {% set l = latest.split('.')[:3] %}\n\n    {% if i | length >= 2 and
      l | length >= 2 %}\n      {% set installed_year = i[0] | int %}\n      {% set
      installed_month = i[1] | int %}\n      {% set installed_patch = i[2] | int if
      i | length > 2 else 0 %}\n\n      {% set latest_year = l[0] | int %}\n      {%
      set latest_month = l[1] | int %}\n      {% set latest_patch = l[2] | int if
      l | length > 2 else 0 %}\n\n      {% set installed_months = installed_year *
      12 + installed_month %}\n      {% set latest_months = latest_year * 12 + latest_month
      %}\n\n      {% set month_changed = (latest_months - installed_months) >= 1 %}\n
      \     {% set patch_gap = (latest_patch - installed_patch) >= patch_gap_threshold
      %}\n\n      {% if month_changed or patch_gap %}\n        {% set ns.items = ns.items
      + [\n          {\n            \"entity\": e,\n            \"name\": state_attr(e,
      'friendly_name') or e,\n            \"from\": installed,\n            \"to\":
      latest\n          }\n        ] %}\n      {% endif %}\n    {% endif %}\n  {%
      endif %}\n{% endfor %} {{ ns.items }}"
    updates_today: '{{ eligible_updates[:5] }}'
    update_message: "{% for item in updates_today %} \n• {{ item.name }} updated from
      {{ item.from}} → {{ item.to }}\n{% endfor %}\n"
- id: '1770413807856'
  alias: Tablet Battery Status Alerts
  description: Sends notifications based on battery bands and clears them when 'ok'.
    Consolidated low-level alerts to reduce repetition.
  triggers:
  - trigger: state
    entity_id: sensor.lenovo_p11_battery
    attribute: band
  conditions:
  - condition: template
    value_template: "{{ trigger.from_state is not none and \n   trigger.to_state.attributes.band
      != trigger.from_state.attributes.band }}"
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.to_state.attributes.band in [''critical'', ''very_low'',
          ''low'', ''warn''] }}'
      sequence:
      - action: notify.duncan
        data:
          title: "{% set titles = {\n  'critical': '\U0001F534 Tablet Battery Critical!',\n
            \ 'very_low': '\U0001F7E0 Tablet Battery Low',\n  'low': '\U0001F7E1 Tablet
            Battery Getting Low',\n  'warn': '⚠️ Tablet Battery Notice'\n} %} {{ titles.get(trigger.to_state.attributes.band)
            }}"
          message: Lenovo Tab P11 battery is at {{ states('sensor.lenovo_p11_battery')
            }}%. {{ 'Plug it in now!' if trigger.to_state.attributes.band == 'critical'
            }} {{ 'Charger issue?' if trigger.to_state.attributes.band == 'very_low'
            }}
          data:
            tag: lenovo_p11_battery_warning
      - if:
        - condition: template
          value_template: '{{ trigger.to_state.attributes.band in [''critical'', ''very_low'',
            ''low''] }}'
        then:
        - action: script.restart_charging_process
      alias: Warn and Restart Charging
    - conditions:
      - condition: template
        value_template: '{{ trigger.to_state.attributes.band == ''ok'' }}'
      sequence:
      - action: notify.duncan
        data:
          message: clear_notification
          data:
            tag: lenovo_p11_battery_warning
      alias: Clear Warning
  mode: single
