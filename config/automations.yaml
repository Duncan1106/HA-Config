- id: '1697103571991'
  alias: Auto Desk Light
  description: "## \U0001F4A1 **Auto Desk Light Automation**\n### \U0001F3AF **Purpose**\nThis
    automation intelligently controls the **desk light**, ensuring it only operates
    when truly needed.   It reacts to **presence**, **ambient light levels**, and
    **desk activity**, offering both comfort and energy efficiency.  \n---  \n###
    ⚙️ **How It Works**\n- **Turns ON** the desk light when:\n  - Motion or occupancy
    is detected near the desk  \n  - The ambient brightness falls **below 200 lx**
    \ \n  - The desk itself is marked as **active**  \n  - Duncan is **home**  \n
    \ - Time is between **07:00** and **23:00**  \n\n- **Turns OFF** the desk light
    when:\n  - The desk has been **inactive for 15 minutes**  \n  - The **presence
    sensor** reports **no occupancy**  \n  - The light is currently on and no relevant
    activity persists  \n\n---  \n### \U0001F9E0 **Logic Highlights**\n- Combines
    **motion**, **light**, and **activity** detection for contextual accuracy.   -
    Prevents unnecessary lighting by verifying overall **average illuminance**.   -
    Keeps your workspace illuminated **only when useful**, aligning with natural light
    and your schedule.  \n---  \n### \U0001F579 **Controlled Entity**\n- `switch.schreibtisch_links_power_strip_l5`
    → Desk Light Power Switch"
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.everything_presence_lite_f1c0d0_zone_1_occupancy
    to:
    - 'on'
    id: 'On'
    for:
      hours: 0
      minutes: 0
      seconds: 5
  - trigger: numeric_state
    entity_id:
    - sensor.everything_presence_lite_f1c0d0_illuminance
    below: 200
    id: 'On'
  - trigger: state
    entity_id:
    - binary_sensor.schreibtisch
    to: 'on'
    for:
      hours: 0
      minutes: 0
      seconds: 5
    id: 'On'
  - trigger: state
    entity_id:
    - binary_sensor.schreibtisch
    to: 'off'
    for:
      hours: 0
      minutes: 15
      seconds: 0
    id: 'Off'
  - type: not_occupied
    device_id: 561b2fddd9cec3889faf18b8ccf214a0
    entity_id: b4a408441c08e8103747f1fac6b78b62
    domain: binary_sensor
    trigger: device
    for:
      hours: 0
      minutes: 0
      seconds: 5
    id: 'Off'
    enabled: false
  - trigger: state
    entity_id:
    - binary_sensor.everything_presence_lite_f1c0d0_occupancy
    to:
    - 'off'
    id: 'Off'
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: and
        conditions:
        - condition: state
          entity_id: switch.schreibtisch_links_power_strip_l5
          state: 'on'
        - condition: trigger
          id:
          - 'Off'
      sequence:
      - action: script.retry_action_with_backoff
        metadata: {}
        data:
          action_domain: switch
          action_type: turn_off
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: simple
          notify_on_failure: true
          notify_service: notify.duncan
          entity_id: switch.schreibtisch_links_power_strip_l5
          target_state: 'off'
      alias: 'Off'
    - conditions:
      - condition: and
        conditions:
        - condition: numeric_state
          entity_id: sensor.average_illuminance
          below: 300
        - condition: state
          entity_id: person.duncan
          state: home
        - condition: time
          after: 07:00:00
          before: '23:00:00'
        - condition: state
          entity_id: binary_sensor.schreibtisch
          state: 'on'
        - condition: trigger
          id:
          - 'On'
      sequence:
      - action: script.retry_action_with_backoff
        metadata: {}
        data:
          action_domain: switch
          action_type: turn_on
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: simple
          notify_on_failure: true
          notify_service: notify.duncan
          entity_id: switch.schreibtisch_links_power_strip_l5
          target_state: 'on'
      alias: 'On'
  mode: queued
  max: 10
