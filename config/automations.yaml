  description: Automates the control of the boiler based on a schedule, manages energy
    saving, and notifies about low water temperature.
  triggers:
  - entity_id:
    - schedule.boiler_pumpe
    from:
    to: 'on'
    id: 'On'
    for:
      hours: 0
      minutes: 0
      seconds: 0
    trigger: state
  - entity_id:
    - schedule.boiler_pumpe
    from:
    to: 'off'
    id: 'Off'
    trigger: state
  - trigger: state
    entity_id:
    - script.boiler_save_energy_script
    to: 'off'
    from: 'on'
    id: Script finished
  conditions: []
  actions:
  - alias: 'On'
    if:
    - condition: trigger
      id:
      - 'On'
    then:
    - alias: Notify of not enough warm water
      if:
      - condition: numeric_state
        entity_id: sensor.boiler_temperature
        below: 30
      then:
      - metadata: {}
        data:
          message: Das Wasser hat nur {{ states('sensor.boiler_temperature') | float(0)|
            round(0) }}°C!
        action: notify.duncan
    - action: script.boiler_save_energy_script
      metadata: {}
      data: {}
  - alias: 'Off'
    if:
    - condition: trigger
      id:
      - 'Off'
    then:
    - type: turn_off
      device_id: 2d4856e9b534472fb57e5601a3f5110e
      entity_id: 4537b8f00f743d73e53e52b828f58d2c
      domain: switch
  - if:
    - condition: trigger
      id:
      - Script finished
    - condition: state
      entity_id: schedule.boiler_pumpe
      state: 'on'
    then:
    - action: script.boiler_save_energy_script
      metadata: {}
      data: {}
    alias: Re Execute if Still in Time Frame
  mode: queued
  max: 10
- id: '1710427927351'
  alias: 'Daily Energy Summary '
  description: ''
  triggers:
  - at: '23:59:55'
    id: Day End
    trigger: time
  - event: sunrise
    offset: 0
    id: Rise
    trigger: sun
  - event: sunset
    offset: 0
    id: Set
