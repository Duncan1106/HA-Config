                - condition: numeric_state
                  entity_id: sensor.go_echarger_252682_nrg_12
                  below: 5
              then:
              - alias: Turn Battery On (retry)
                repeat:
                  sequence:
                  - action: switch.turn_on
                    target:
                      entity_id: switch.esp32_s3_zero_deye8k_time_of_use
                    data: {}
                  - delay: 00:00:10
                  until:
                  - condition: or
                    conditions:
