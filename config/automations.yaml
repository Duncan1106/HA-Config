          then:
          - data:
              name: '{{ name }}'
              password: '{{ password }}'
              keep_days: '{{ keep_days }}'
              download_path:
              - /share/USBMEDIABACKUP_Share/Backup/
              include_folders:
              - config
              exclude_folders:
              - media
            action: auto_backup.backup
          else:
          - alias: Creating a full backup (default action)
            data:
              name: '{{ name }}'
              password: '{{ password }}'
              keep_days: '{{ keep_days }}'
              download_path:
              - /share/USBMEDIABACKUP_Share/Backup/
              exclude_folders:
              - media
            action: auto_backup.backup
    else:
    - variables:
        backup_type: hourly
        keep_days: 1
    - variables:
        name: "{{ backup_type | title }}Backup: {{\n  now().strftime(\n    \"%A, \"\n
          \   ~ iif(backup_type == \"hourly\", \"%H:%M, \", \"\")\n    ~ \"%B %-d,
          %Y\"\n  )\n}}\n{# HourlyBackup: Monday, 3:04 PM, January 2, 2006 #}\n{#
          DailyBackup: Monday, January 2, 2006 #}\n"
        backup_action:
        - data:
            name: '{{ name }}'
            password: '{{ password }}'
            keep_days: '{{ keep_days }}'
            exclude_database: true
            include_folders:
            - config
          action: auto_backup.backup
    - if:
      - condition: template
        value_template: '{{ backup_action | length > 0 }}'
      then:
      - data:
          name: '{{ name }}'
          password: '{{ password }}'
          keep_days: '{{ keep_days }}'
          include_folders:
          - config
          exclude_addons:
          - '*'
          exclude_folders:
          - media
          - share
          - ssl
          - addons
          compressed: true
          exclude_database: true
        action: auto_backup.backup
      else:
      - alias: Creating a partial backup (default action)
        data:
          name: '{{ name }}'
          password: '{{ password }}'
          keep_days: '{{ keep_days }}'
          include_folders:
          - config
          exclude_addons:
          - '*'
          exclude_folders:
          - media
          - share
          - ssl
          - addons
          compressed: true
          exclude_database: true
        action: auto_backup.backup
  mode: single
  variables:
    password: ''
    enable_hourly: true
    enable_daily: true
    enable_weekly: true
    enable_monthly: true
    enable_yearly: true
    use_action_hourly: true
