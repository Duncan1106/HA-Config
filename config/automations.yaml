          action_type: turn_on
          max_retries: 10
          max_delay: 60
          backoff_type: linear
          notify_on_failure: true
          notify_service: notify.duncan
          entity_id: switch.treppe_led_lichterkette_zigbee
          target_state: 'on'
          base_delay: 5
