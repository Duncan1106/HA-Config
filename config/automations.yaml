  max: 10
- id: '1710589916637'
  alias: Fire Detection from Temperature Sensors
  description: This automation monitors temperature sensors for potential fire conditions.
    It sends notifications if the temperature exceeds a specified threshold, helping
    to ensure safety by alerting when fire risk is detected.
  triggers:
  - seconds: /15
    trigger: time_pattern
  conditions:
  - condition: template
    value_template: '{{ sensors != '''' }}'
  actions:
  - choose: []
    default:
    - metadata: {}
      data:
        message: Fire detected in {{sensors}}
      action: notify.duncan
    - metadata: {}
      data:
        message: Feuer erkannt bei {{sensors}}
      action: notify.mobile_app_stephan_iphone
  variables:
    threshold: 45
    include:
      entity_id:
      - sensor.esp32_c3_mini_terra_duncan_room_temperature
      - sensor.esp32_c3_zero_epever_bme280_temperature
      - sensor.inverter_battery_temperature
      - sensor.esphome_az_envy_2_temperature_gartenhaus
      - sensor.esphome_az_envy_1_temperature_heizraum
      - sensor.esphome_az_envy_3_temperature_3d_printer
      - sensor.gw1100a_indoor_temperature
      - sensor.t_h_duncan_zigbee_temperature
      - sensor.t_h_waschkuche_zigbee_temperature
      - sensor.weinkeller_temperature
      - sensor.t_h_bad_zigbee_temperature
      - sensor.t_h_kinderbad_zigbee_temperature
      - sensor.inverter_battery_temperature
      - sensor.t_h_garage_zigbee_temperature
      - sensor.esp32_c3_zero_epever_battery_temperature
    sensors: "{% set result = namespace(sensors=[]) %} {% for state in states.sensor
      | selectattr('attributes.device_class', '==', 'temperature') %}\n  {% if 0 <=
      state.state | int(-1) > threshold | int and state.entity_id in include.entity_id
      %}\n    {% set result.sensors = result.sensors + [state.name ~ ' (' ~ state.state
      ~ ' °C)'] %}\n  {% endif %}\n{% endfor %} {% for state in states.binary_sensor
      | selectattr('attributes.device_class', '==', 'temperature') | selectattr('state',
      '==', 'on') %}\n  {% if state.entity_id in include.entity_id %}\n    {% set
      result.sensors = result.sensors + [state.name] %}\n  {% endif %}\n{% endfor
      %} {{result.sensors|join(', ')}}"
  mode: single
- id: '1710856538174'
  alias: Count Battery Full
  description: ''
  triggers:
  - entity_id:
    - sensor.esp32_c3_zero_epever_battery_voltage
    above: 28.3
    id: Full
    trigger: numeric_state
  - entity_id:
    - sensor.esp32_c3_zero_epever_battery_voltage
    below: 24
    id: Empty
    trigger: numeric_state
  - entity_id:
    - sensor.esp32_c3_zero_epever_battery_soc
    above: 98
    id: Full
    enabled: false
    trigger: numeric_state
  - entity_id:
    - sensor.esp32_c3_zero_epever_battery_soc
    id: Empty
    below: 40
    enabled: false
    trigger: numeric_state
  conditions: []
  actions:
  - alias: Full
    if:
    - condition: and
      conditions:
      - condition: state
        entity_id: input_boolean.battery_full
        state: 'off'
        enabled: false
      - condition: trigger
        id:
        - Full
    then:
    - target:
        entity_id:
        - input_boolean.battery_full
      data: {}
      action: input_boolean.turn_on
    - metadata: {}
      data: {}
      target:
        entity_id: counter.battery_full
      enabled: false
      action: counter.increment
    - action: input_number.set_value
      metadata: {}
      data:
        value: '{{ states(''sensor.charged_energy_to_bkw_battery'') | float(0) | round(2)
          }}

          '
      target:
        entity_id: input_number.last_charged_energy_to_bkw_battery
  - alias: Empty
    if:
    - condition: and
      conditions:
      - condition: state
        entity_id: input_boolean.battery_full
        state: 'on'
      - condition: trigger
        id:
        - Empty
    then:
    - metadata: {}
      data: {}
      target:
        entity_id: input_boolean.battery_full
      action: input_boolean.turn_off
    - metadata: {}
      data: {}
      target:
        entity_id: counter.battery_empty
      enabled: false
      action: counter.increment
  mode: single
- id: '1711468239502'
  alias: BKw Control
  description: Controls BKW outlet based on solar production, battery SoC/voltage,
    sunrise/sunset, inverter state, temperature, and usage to optimize charging/discharging,
    protect battery health, and ensure nightly shutdown if energy was used.
  triggers:
  - entity_id:
    - sensor.inverter_pv_power
    id: on day
    above: 2250
    trigger: numeric_state
  - entity_id:
    - sensor.esp32_c3_zero_epever_battery_voltage
    id: off night
    below: 23
    trigger: numeric_state
  - entity_id:
    - sensor.esp32_c3_zero_epever_pv_array_input_power
    below: 200
    id: off day
    trigger: numeric_state
  - entity_id:
    - sensor.esp32_c3_zero_epever_pv_array_input_power
    below: 175
    id: off day
    trigger: numeric_state
  - entity_id:
    - sensor.esp32_c3_zero_epever_pv_array_input_power
    below: 125
    id: off day
    trigger: numeric_state
  - entity_id:
    - sensor.esp32_c3_zero_epever_pv_array_input_power
    below: 75
    id: off day
    trigger: numeric_state
  - entity_id:
    - sensor.inverter_pv_power
    id: off day
    below: 2250
    trigger: numeric_state
  - entity_id:
    - sensor.inverter_pv_power
    id: off day
    below: 2000
    trigger: numeric_state
  - event: sunset
    offset: -00:15:00
    id: on night
    trigger: sun
  - event: sunrise
    offset: +00:15:00
    id: off night
    trigger: sun
    enabled: true
  - id: on day
    enabled: true
    trigger: time_pattern
    minutes: '*'
  - trigger: numeric_state
    entity_id:
    - sensor.bkw_outlet_1_energy_power
    below: 50
    id: off night
  conditions:
  - condition: or
    conditions:
    - condition: or
      conditions:
      - condition: state
        entity_id: input_boolean.battery_full
        state: 'on'
      - condition: or
        conditions:
        - condition: numeric_state
          entity_id: sensor.esp32_c3_zero_epever_battery_soc
          above: 95
        - condition: numeric_state
          entity_id: sensor.esp32_c3_zero_epever_battery_voltage
          above: 27.75
    - condition: and
      conditions:
      - condition: numeric_state
        entity_id: sensor.inverter_pv_power
        below: 2001
      - condition: device
        type: is_on
        device_id: f7afa3f7d75d54c713ea1d78071ff30c
        entity_id: 12403f847e9caae174f8b14a11ab9c19
        domain: switch
  actions:
  - alias: on day
    if:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - on day
      - condition: state
        entity_id: sensor.scb_inverter_state
        state: FeedIn
      - condition: state
        entity_id: input_boolean.battery_full
        state: 'on'
      - condition: numeric_state
        entity_id: sensor.esp32_c3_zero_epever_battery_soc
        above: 80
      - condition: numeric_state
        entity_id: sensor.inverter_pv_power
        above: 2000
      - condition: numeric_state
        entity_id: sensor.esp32_c3_zero_epever_device_temperature
        below: 44
    then:
    - metadata: {}
      data: {}
      target:
        entity_id: switch.esp32_c3_zero_epever_manual_control_the_load
      enabled: true
      action: switch.turn_on
    - type: turn_on
      device_id: f7afa3f7d75d54c713ea1d78071ff30c
      entity_id: 12403f847e9caae174f8b14a11ab9c19
      domain: switch
  - alias: off day
    if:
    - condition: and
      conditions:
      - condition: sun
        before: sunset
        after: sunrise
        after_offset: -00:16:00
      - condition: trigger
        id:
        - off day
    then:
    - action: switch.turn_off
      metadata: {}
      data: {}
      target:
        entity_id: switch.bkw_outlet_1_bkw_outlet_1
  - alias: on night
    if:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - on night
      - condition: state
        entity_id: input_boolean.battery_full
        state: 'on'
    then:
    - metadata: {}
      data: {}
      target:
        entity_id: switch.esp32_c3_zero_epever_manual_control_the_load
      enabled: true
      action: switch.turn_on
    - type: turn_on
      device_id: f7afa3f7d75d54c713ea1d78071ff30c
      entity_id: 12403f847e9caae174f8b14a11ab9c19
      domain: switch
    - metadata: {}
      data: {}
      target:
        entity_id: counter.battery_full
      action: counter.increment
    - action: utility_meter.calibrate
      metadata: {}
      data:
        value: '0.0'
      target:
        entity_id:
        - sensor.charged_energy_to_bkw_battery
        - sensor.discharged_energy_from_bkw_battery
    - wait_for_trigger:
      - trigger: numeric_state
        entity_id:
        - sensor.bkw_outlet_1_energy_power
        above: 10
      timeout:
        hours: 0
        minutes: 0
        seconds: 30
        milliseconds: 0
      continue_on_timeout: true
    - if:
      - condition: template
        value_template: '{{ not wait.completed }}'
      then:
      - action: notify.duncan
        data:
          message: ⚠️ The load did not rise above 10W within 1 minute after turning
            on at night.
          title: BKW Error
  - alias: off night
    if:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - off night
      - condition: numeric_state
        entity_id: sensor.bkw_outlet_1_energy_today
        above: 0.001
      - condition: time
        after: 00:00:00
        before: 09:00:00
    then:
    - alias: Repeat off cmd until OFF
      repeat:
        sequence:
        - type: turn_off
          device_id: f7afa3f7d75d54c713ea1d78071ff30c
          entity_id: 12403f847e9caae174f8b14a11ab9c19
          domain: switch
        - delay:
            hours: 0
            minutes: 0
            seconds: 5
            milliseconds: 0
        until:
        - condition: state
          entity_id: switch.bkw_outlet_1_bkw_outlet_1
          state: 'off'
    - metadata: {}
      data: {}
      target:
        entity_id: input_boolean.battery_full
      action: input_boolean.turn_off
    - if:
      - condition: numeric_state
        entity_id: sensor.discharged_energy_from_bkw_battery
        above: 0
      then:
      - metadata: {}
        data: {}
        target:
          entity_id: counter.battery_empty
        action: counter.increment
      - action: input_number.set_value
        metadata: {}
        data:
          value: '{{ states(''sensor.discharged_energy_from_bkw_battery'') | float(0)
            | round(2) }}

            '
        target:
          entity_id: input_number.last_discharged_energy_from_bkw_battery
      - delay:
          hours: 0
          minutes: 0
          seconds: 0
          milliseconds: 100
      - action: utility_meter.calibrate
        metadata: {}
        data:
          value: '0.0'
        target:
          entity_id: sensor.discharged_energy_from_bkw_battery
    - delay:
        hours: 0
        minutes: 0
        seconds: 5
        milliseconds: 0
    - type: turn_off
      device_id: 93a7dbc1ab0380e01f4cd6d5eb91b9bc
      entity_id: c75f234504dc77b5d544518a8128c688
      domain: switch
      enabled: false
  mode: queued
  max: 15
