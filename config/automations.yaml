- id: '1704466926541'
  alias: Appliance Auto Count
  description: "## ⚡ Appliance Auto Count  \n\n### \U0001F4CB **Appliance Usage Tracking**
    \ \nThis automation tracks and counts the usage of household appliances, including
    coffee machines and refrigerators, based on their power consumption.  \n\nIt increments
    dedicated Home Assistant counters whenever an appliance is powered on and actively
    consuming energy above a defined threshold.  \n\n---\n\n### ⏰ **Triggers**  \n\n|
    Trigger Entity | Threshold / Event | Appliance |\n|----------------|-----------------|-----------|\n|
    `sensor.kaffeemaschine_philips_energy_power` | > 10 W | Coffee Machine (Philips)
    |\n| `sensor.kaffeemaschine_energy_power` | > 300 W | Coffee Machine |\n| `sensor.kuhlschrank_drinnen_energy_power`
    | > 30 W | Refrigerator (Inside) |\n| `sensor.kuhlschrank_draussen_energy_power`
    | > 30 W | Refrigerator (Outside) |\n\n> **Note:** Each trigger is a numeric state
    trigger that activates when the power consumption rises above the defined threshold.
    \ \n\n---\n\n### ✅ **Conditions**  \n- None. This automation runs whenever any
    trigger threshold is exceeded.  \n\n---\n\n### \U0001F3AF **Actions / Workflow**
    \ \n\n1. **Increment Counters**  \n   - `sensor.kuhlschrank_drinnen_energy_power`
    → `counter.kuhlschrank`  \n   - `sensor.kuhlschrank_draussen_energy_power` → `counter.kuhlschrank_draussen`
    \ \n   - `sensor.kaffeemaschine_energy_power` → `counter.kaffeemaschine`  \n\nEach
    action only runs if its corresponding trigger fired, ensuring accurate appliance
    usage counting.  \n\n---\n\n### \U0001F527 **Technical Specs**  \n- **Mode:**
    `parallel` (max 10 concurrent executions)  \n- **Counters Used:**  \n  - `counter.kaffeemaschine`
    \ \n  - `counter.kuhlschrank`  \n  - `counter.kuhlschrank_draussen`  \n- **Power
    Thresholds:** Configurable per appliance as numeric state triggers  \n\n---\n\n###
    ⚡ **Notes / Best Practices**  \n- Useful for monitoring appliance usage patterns
    over time.  \n- Running in parallel mode allows multiple appliances to trigger
    simultaneously without blocking other counts.  \n- Ensure that energy sensors
    are accurate and reflect true appliance usage to avoid false counts.  \n"
  triggers:
  - entity_id:
    - sensor.kaffeemaschine_philips_energy_power
    above: 10
    id: Kaffeemaschine
    trigger: numeric_state
  - entity_id:
    - sensor.kaffeemaschine_energy_power
    above: 300
    id: Kaffeemaschine
    trigger: numeric_state
  - entity_id:
    - sensor.kuhlschrank_drinnen_energy_power
    above: 30
    id: 'Kühlschrank '
    trigger: numeric_state
  - entity_id:
    - sensor.kuhlschrank_draussen_energy_power
    above: 30
    id: 'Kühlschrank Draußen '
    trigger: numeric_state
  conditions: []
  actions:
  - if:
    - condition: trigger
      id:
      - 'Kühlschrank '
    then:
    - data: {}
      target:
        entity_id: counter.kuhlschrank
      action: counter.increment
    alias: 'Kühlschrank '
  - alias: 'Kühlschrank  Draußen '
    if:
    - condition: trigger
      id:
      - 'Kühlschrank Draußen '
    then:
    - target:
        entity_id: counter.kuhlschrank_draussen
      data: {}
      action: counter.increment
  - alias: 'Kaffeemaschine '
    if:
    - condition: trigger
      id:
      - Kaffeemaschine
    then:
    - data: {}
      target:
        entity_id: counter.kaffeemaschine
      action: counter.increment
  mode: parallel
  max: 10
