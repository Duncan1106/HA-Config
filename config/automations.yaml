- id: '1757273749465'
  alias: Garage Oven Vacuum Power Control
  description: Automates scheduled power on/off of the garage door, vacuum cleaner
    and oven according to the smart home status (Daily or Vacation). At 23:00 it turns
    them off, at 04:00 it turns them on, and in vacation mode it immediately switches
    them off.
  triggers:
  - trigger: time
    at: '23:00:00'
    id: '23'
  - trigger: time
    at: 04:00:00
    id: '4'
  - trigger: homeassistant
    event: start
    id: Start
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_select.smart_home_status
        state: Daily
      - condition: trigger
        id:
        - '23'
      sequence:
      - repeat:
          until:
          - condition: or
            conditions:
            - condition: state
              entity_id: switch.garagentor_tasmota
              state: 'off'
            - condition: template
              value_template: '{{ repeat.index > 10 }}'
          sequence:
          - action: switch.turn_off
            metadata: {}
            data: {}
            target:
              entity_id: switch.garagentor_tasmota
          - delay:
              hours: 0
              minutes: 0
              seconds: 5
              milliseconds: 0
      - repeat:
          until:
          - condition: or
            conditions:
            - condition: state
              entity_id: switch.sauger_tasmota
              state: 'off'
            - condition: template
              value_template: '{{ repeat.index > 10 }}'
          sequence:
          - action: switch.turn_off
            metadata: {}
            data: {}
            target:
              entity_id: switch.sauger_tasmota
          - delay:
              hours: 0
              minutes: 0
              seconds: 5
              milliseconds: 0
      - repeat:
          until:
          - condition: or
            conditions:
            - condition: state
              entity_id: switch.backofen_tasmota
              state: 'off'
            - condition: template
              value_template: '{{ repeat.index > 10 }}'
          sequence:
          - action: switch.turn_off
            metadata: {}
            data: {}
            target:
              entity_id:
              - switch.backofen_tasmota
          - delay:
              hours: 0
              minutes: 0
              seconds: 5
              milliseconds: 0
      alias: Power off at 23
    - conditions:
      - condition: state
        entity_id: input_select.smart_home_status
        state: Daily
      - condition: trigger
        id:
        - '4'
        - Start
      - condition: time
        after: 03:59:00
        before: '22:59:00'
      sequence:
      - alias: Wait for entitys to become available after HA Start
        if:
        - condition: trigger
          id:
          - Start
        then:
        - wait_for_trigger:
          - trigger: template
            value_template: "        {% set entities = expand(\n          'switch.garagentor_tasmota',\n
              \         'switch.sauger_tasmota',\n          'switch.backofen_tasmota'\n
              \       ) %}\n        {{ (entities | selectattr('state','in',['on','off'])
              | list | length) == (entities | length) }}"
            for:
              hours: 0
              minutes: 1
              seconds: 0
          continue_on_timeout: true
      - repeat:
          until:
          - condition: or
            conditions:
            - condition: state
              entity_id: switch.garagentor_tasmota
              state: 'on'
            - condition: template
              value_template: '{{ repeat.index > 10 }}'
          sequence:
          - action: switch.turn_on
            metadata: {}
            data: {}
            target:
              entity_id: switch.garagentor_tasmota
          - delay:
              hours: 0
              minutes: 0
              seconds: 5
              milliseconds: 0
      - repeat:
          until:
          - condition: or
            conditions:
            - condition: state
              entity_id: switch.sauger_tasmota
              state: 'on'
            - condition: template
              value_template: '{{ repeat.index > 10 }}'
          sequence:
          - action: switch.turn_on
            metadata: {}
            data: {}
            target:
              entity_id:
              - switch.sauger_tasmota
          - delay:
              hours: 0
              minutes: 0
              seconds: 5
              milliseconds: 0
      - repeat:
          until:
          - condition: or
            conditions:
            - condition: state
              entity_id: switch.backofen_tasmota
              state: 'on'
            - condition: template
              value_template: '{{ repeat.index > 10 }}'
          sequence:
          - action: switch.turn_on
            metadata: {}
            data: {}
            target:
              entity_id: switch.backofen_tasmota
          - delay:
              hours: 0
              minutes: 0
              seconds: 5
              milliseconds: 0
      alias: Power on at 4
    - conditions:
      - condition: state
        entity_id: input_select.smart_home_status
        state: Vacation
      sequence:
      - action: switch.turn_off
        metadata: {}
        data: {}
        target:
          entity_id:
          - switch.garagentor_tasmota
          - switch.sauger_tasmota
      - delay:
          hours: 0
          minutes: 0
          seconds: 5
          milliseconds: 0
      alias: Power off all the way
  mode: single
- id: '1757687903185'
  alias: Auto Heizraum Lüfter
  description: "## \U0001F32C Auto Heizraum Lüfter Automation\n\n### \U0001F4CB **Purpose**\n\nThis
    automation manages the heating room (Heizraum) fan based on the power consumption
    of another fan. It ensures the fan only runs when necessary, helping save energy
    by avoiding unnecessary operation.  \n\n---\n\n### ⏰ **Triggers**\n\n| Trigger
    Entity | Condition | Delay | Trigger ID |\n|----------------|-----------|-------|------------|\n|
    `sensor.heizraum_lufter_abluft_power` | Above 0.1 W | 1 minute | \"On\" |\n| `sensor.heizraum_lufter_abluft_power`
    | Below 0.01 W | 1 minute | \"Off\" |\n\n> **Note:** Triggers include a 1-minute
    delay (`for: 1m`) to prevent flickering or rapid on/off cycling.  \n\n---\n\n###
    ✅ **Conditions**\n\n- None. The automation reacts directly to the numeric state
    triggers.  \n\n---\n\n### \U0001F3AF **Actions / Workflow**\n\n1. **Fan On Trigger
    (\"On\")**  \n   - Checks if the trigger ID is \"On\".  \n   - Uses a repeat loop
    to ensure the fan (`switch.heizraum_lufter`) turns on.  \n   - Repeats every 5
    seconds until the fan state is `\"on\"`.  \n\n2. **Fan Off Trigger (\"Off\")**
    \ \n   - Checks if the trigger ID is \"Off\".  \n   - Uses a repeat loop to ensure
    the fan turns off.  \n   - Repeats every 5 seconds until the fan state is `\"off\"`.
    \ \n\n> **Rationale:** The repeat loops guarantee the switch successfully changes
    state even if a transient failure occurs.  \n\n---\n\n### \U0001F527 **Technical
    Specs**\n\n- **Mode:** `restart` (ensures a new trigger cancels the current action
    and restarts the automation)  \n- **Target Switch:** `switch.heizraum_lufter`
    \ \n- **Delay:** 5-second interval in repeat loops to reduce excessive switching
    and allow for state confirmation.  \n- **Power Thresholds:**  \n  - **On:** >
    0.1 W  \n  - **Off:** < 0.01 W  \n\n---\n\n### ⚡ **Notes / Best Practices**\n\n-
    Using numeric state triggers with a `for` delay prevents rapid on/off cycling
    caused by small power fluctuations.  \n- Repeat loops provide reliability, ensuring
    the fan state actually matches the desired state.  \n- Mode `restart` is ideal
    for energy-focused automations, preventing overlapping or conflicting actions.
    \ \n- Thresholds can be adjusted to match the sensitivity of your fan's power
    draw."
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.heizraum_lufter_abluft_power
    for:
      hours: 0
      minutes: 1
      seconds: 0
    below: 0.01
    id: 'Off'
  - trigger: numeric_state
    entity_id:
    - sensor.heizraum_lufter_abluft_power
    for:
      hours: 0
      minutes: 1
      seconds: 0
    id: 'On'
    above: 0.1
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - 'Off'
      sequence:
      - repeat:
          until:
          - condition: or
            conditions:
            - condition: state
              entity_id: switch.heizraum_lufter
              state: 'off'
            - condition: template
              value_template: '{{ repeat.index > 10 }}'
          sequence:
          - action: switch.turn_off
            metadata: {}
            data: {}
            target:
              entity_id: switch.heizraum_lufter
          - delay:
              hours: 0
              minutes: 0
              seconds: 5
              milliseconds: 0
      alias: Fan off
    - conditions:
      - condition: trigger
        id:
        - 'On'
      sequence:
      - repeat:
          until:
          - condition: or
            conditions:
            - condition: state
              entity_id: switch.heizraum_lufter
              state: 'on'
            - condition: template
              value_template: '{{ repeat.index > 10 }}'
          sequence:
          - action: switch.turn_on
            metadata: {}
            data: {}
            target:
              entity_id: switch.heizraum_lufter
          - delay:
              hours: 0
              minutes: 0
              seconds: 5
              milliseconds: 0
      alias: Fan on
  mode: restart
- id: '1758358981299'
  alias: Wasserenthärtung – Salz Erinnerung mit Bestätigung
  description: Erinnert bei niedrigem Salz, setzt Utility Meter erst nach Bestätigung
    zurück.
  triggers:
  - entity_id: sensor.wasserenthartung
    id: usage_change
    trigger: state
  - entity_id:
    - input_boolean.salz_nachgefullt
    to: 'off'
    id: confirm_reset
    trigger: state
    from: 'on'
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: usage_change
      - condition: template
        value_template: '{{ now() - (state_attr(this.entity_id, ''last_triggered'')
          | default( as_datetime(''0''), true)) > timedelta(days=1) }}'
      - condition: template
        value_template: '{{ states(''sensor.wasserenthartung'') | float > 42 }}

          '
      sequence:
      - target:
          entity_id:
          - input_boolean.salz_nachgefullt
        action: input_boolean.turn_on
