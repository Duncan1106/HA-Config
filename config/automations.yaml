- id: '1727387566504'
  alias: Ganglicht Motion
  description: "## \U0001F6B6 Ganglicht Motion  \n\n### \U0001F4CB **Motion-Activated
    Hallway & Stairway Lighting**  \nControls both hallway (`ganglicht`) and stairway
    (`treppenlicht`) lights based on motion sensors, ambient light levels, and adds
    robust sync & reliability fixes to ensure lights turn on/off correctly.  \n\n---\n\n###
    \U0001F506 **Turn ON Triggers**  \n| Condition | Entity | Threshold |\n|-----------|--------|-----------|\n|
    **Motion (below)** | `binary_sensor.aqara_p1_occupancy`, `binary_sensor.gang_bewegung_keller_tur_occupancy`
    | State = **on** |\n| **Motion (above)** | `binary_sensor.treppenhaus_occupancy`
    | State = **on** |\n| **Sync ON** | `sensor.light_brighness` | Above **0.1** |\n\n---\n\n###
    \U0001F319 **Turn OFF Triggers**  \n| Condition | Entity | Threshold |\n|-----------|--------|-----------|\n|
    **Sync OFF** | `sensor.light_brighness` | Below **0.1** |\n| **Illuminance** |
    `sensor.aqara_p1_illuminance` | Above **79 / 100 / 150 / 200 lux** |\n| **Force
    OFF** | `light.ganglicht_zigbee_led` | Off for **5 min / 15 min** |\n\n---\n\n###
    \U0001F3AF **Smart Logic**  \n\n#### **\U0001F506 Motion-Driven ON**  \n- **Downstairs
    motion** (dark < 80 lux & no timed light)  \n  → `ganglicht` ON at **100%**  \n
    \ → `treppenlicht` OFF  \n- **Upstairs motion** (dark < 80 lux & no timed light)
    \ \n  → `treppenlicht` ON at **10%**  \n  → `ganglicht` ON at **75%** after 0.5s
    \ \n  → Wait 1min for downstairs motion → adjust ganglicht/treppenlicht accordingly
    \ \n\n---\n\n#### **\U0001F319 Auto-OFF**  \n- **After 5 min of no motion** →
    `script.5_min_turn_off_ganglicht`  \n- **Sync OFF** (sensor < 0.1 & no motion
    detected) → Retry up to 10× with 0.5s delays until confirmed OFF  \n- **High Lux
    Override** (above 79–200 lux) → Retry up to 10× until confirmed OFF  \n- **Force
    OFF failsafe** (light stuck off for 5–15 min) → Briefly set `brightness=1%` →
    then OFF again  \n\n---\n\n#### **\U0001F501 Sync & Reliability Fixes**  \n- **Sync
    ON**: Retry up to 10× until ganglicht confirms **ON**  \n- **Sync OFF**: Retry
    up to 10× until ganglicht confirms **OFF**  \n- **Failsafe OFF**: If stuck, cycle
    ON (1%) → OFF  \n\n---\n\n### \U0001F527 **Technical Specs**  \n- **Targets:**
    \ \n  - Hallway: `light.ganglicht_zigbee_led`  \n  - Stairway: `light.esp32_c3_mini_treppenhaus_licht`
    \ \n- **Sensors:**  \n  - Motion: `aqara_p1`, `treppenhaus`, `keller_tur`  \n
    \ - Lux: `sensor.aqara_p1_illuminance`  \n  - Brightness state: `sensor.light_brighness`
    \ \n- **Brightness Profiles:**  \n  - Hallway (motion below): **100%**  \n  -
    Hallway (motion above): **75%**  \n  - Stairway: **10%**  \n- **Delays & Retries:**
    0.5s between retries, up to 10 attempts  \n- **Mode:** `parallel` (max 6 concurrent
    runs)"
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.aqara_p1_occupancy
    - binary_sensor.gang_bewegung_keller_tur_occupancy
    to: 'on'
    id: 'On motion '
  - trigger: state
    entity_id:
    - binary_sensor.treppenhaus_occupancy
    to: 'on'
    id: On motion oben
  - trigger: numeric_state
    entity_id:
    - sensor.light_brighness
    above: 0.1
    id: Sync on
  - trigger: numeric_state
    entity_id:
    - sensor.light_brighness
    id: Sync off
    below: 0.1
  - trigger: numeric_state
    entity_id:
    - sensor.aqara_p1_illuminance
    above: 200
    id: Light Above 200
  - trigger: numeric_state
    entity_id:
    - sensor.aqara_p1_illuminance
    above: 150
    id: Light Above 150
  - trigger: numeric_state
    entity_id:
    - sensor.aqara_p1_illuminance
    above: 100
    id: Light Above 100
  - trigger: numeric_state
    entity_id:
    - sensor.aqara_p1_illuminance
    above: 79
    id: Light Above 79
  - trigger: state
    entity_id:
    - light.ganglicht_zigbee_led
    to: 'off'
    for:
      hours: 0
      minutes: 5
      seconds: 0
    id: Turn off for sure 5min
  - trigger: state
    entity_id:
    - light.ganglicht_zigbee_led
    to: 'off'
    for:
      hours: 0
      minutes: 15
      seconds: 0
    id: Turn off for sure 15min
  conditions: []
  actions:
  - variables:
      lux_threshold: 80
      ganglicht_brightness: 100
      treppenlicht_brightness: 10
      ganglicht_brightness_oben: 75
      light_ganglicht: light.ganglicht_zigbee_led
      light_treppenlicht: light.esp32_c3_mini_treppenhaus_licht
      light_delay: '00:00:00.500'
  - alias: On motion
    if:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - 'On motion '
      - condition: numeric_state
        entity_id: sensor.aqara_p1_illuminance
        below: 80
        enabled: true
      - condition: numeric_state
        entity_id: sensor.light_brighness
        below: 0.1
      alias: motion & dark enough & no timed light
    then:
    - action: light.turn_on
      metadata: {}
      data:
        brightness_pct: '{{ ganglicht_brightness }}'
      target:
        entity_id: '{{ light_ganglicht }}'
    - action: light.turn_off
      metadata: {}
      data: {}
      target:
        entity_id: '{{ light_treppenlicht }}'
  - alias: On motion oben
    if:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - On motion oben
      - condition: numeric_state
        entity_id: sensor.aqara_p1_illuminance
        below: 80
        enabled: true
      - condition: numeric_state
        entity_id: sensor.light_brighness
        below: 0.1
      alias: motion oben & dark enough & no timed light
    then:
    - action: light.turn_on
      metadata: {}
      data:
        brightness_pct: '{{ treppenlicht_brightness }}'
      target:
        entity_id: '{{ light_treppenlicht }}'
    - delay: '{{ light_delay }}'
    - action: light.turn_on
      metadata: {}
      data:
        brightness_pct: '{{ ganglicht_brightness_oben }}'
      target:
        entity_id: '{{ light_ganglicht }}'
    - sequence:
      - wait_for_trigger:
        - trigger: state
          entity_id:
          - binary_sensor.aqara_p1_occupancy
          - binary_sensor.gang_bewegung_keller_tur_occupancy
          to: 'on'
        timeout:
          hours: 0
          minutes: 1
          seconds: 0
          milliseconds: 0
        continue_on_timeout: true
      - alias: wait for motion, if motion is detected downtairs, turn on ganglicht,
          and turn off treppenhasu licht if it should be off
        if:
        - condition: and
          conditions:
          - condition: template
            value_template: '{{ not wait.completed }}'
          - condition: numeric_state
            entity_id: sensor.light_brighness
            below: 0.1
          - condition: not
            conditions:
            - condition: or
              conditions:
              - type: is_motion
                condition: device
                device_id: 6aa53e57ab4128aa151491184dee696c
                entity_id: f186a7b86f51499f34c6a256d7b755a6
                domain: binary_sensor
              - type: is_motion
                condition: device
                device_id: 0c126cf3ac97892e31c219e4e479933d
                entity_id: 1b5c6eef919911c8e327a309ab828d22
                domain: binary_sensor
              - type: is_motion
                condition: device
                device_id: e89ead353b14ef9ce97038650a6e3bb4
                entity_id: a7cb7008da8607788c4b8d01cc73f4e0
                domain: binary_sensor
        then:
        - action: light.turn_off
          metadata: {}
          data: {}
          target:
            entity_id: '{{ light_ganglicht }}'
        - alias: if treppenhauslicht should be off, then turn off else do nothing
          if:
          - condition: numeric_state
            entity_id: sensor.light_brighness
            below: 0.1
          then:
          - action: light.turn_off
            metadata: {}
            data: {}
            target:
              entity_id: '{{ light_treppenlicht }}'
        else:
        - action: light.turn_on
          metadata: {}
          data:
            brightness_pct: '{{ ganglicht_brightness }}'
          target:
            entity_id: '{{ light_ganglicht }}'
        - alias: if treppenhauslicht should be off, then turn off else do nothing
          if:
          - condition: numeric_state
            entity_id: sensor.light_brighness
            below: 0.1
          then:
          - action: light.turn_off
            metadata: {}
            data: {}
            target:
              entity_id: '{{ light_treppenlicht }}'
      enabled: true
  - alias: Turn off after 5min
    if:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - 'On motion '
        - On motion oben
      - condition: numeric_state
        entity_id: sensor.light_brighness
        below: 0.1
      alias: motion & no timed light
    then:
    - action: script.5_min_turn_off_ganglicht
      metadata: {}
      data: {}
  - alias: On Light Sync
    if:
    - condition: trigger
      id:
      - Sync on
    - condition: numeric_state
      entity_id: sensor.light_brighness
      above: 0.1
    then:
    - alias: turn on until on or we tried 10 times
      repeat:
        sequence:
        - action: light.turn_on
          metadata: {}
          data:
            brightness_pct: '{{ ganglicht_brightness }}'
          target:
            entity_id: '{{ light_ganglicht }}'
        - delay: '{{ light_delay }}'
        until:
        - condition: or
          conditions:
          - condition: state
            entity_id: light.ganglicht_zigbee_led
            state: 'on'
          - condition: template
            value_template: '{{ repeat.index >= 10 }}'
          alias: either light on or we tried 10 times and failed
  - alias: Off Light Sync
    if:
    - condition: trigger
      id:
      - Sync off
    - condition: not
      conditions:
      - condition: or
        conditions:
        - condition: state
          entity_id: binary_sensor.aqara_p1_occupancy
          state: 'on'
        - condition: state
          entity_id: binary_sensor.treppenhaus_occupancy
          state: 'on'
        - condition: state
          entity_id: binary_sensor.gang_bewegung_keller_tur_occupancy
          state: 'on'
      alias: No Motion Detected
      enabled: true
    then:
    - repeat:
        sequence:
        - action: light.turn_off
          metadata: {}
          data: {}
          target:
            entity_id: '{{ light_ganglicht }}'
        - delay: '{{ light_delay }}'
        until:
        - condition: or
          conditions:
          - condition: state
            entity_id: light.ganglicht_zigbee_led
            state: 'off'
          - condition: template
            value_template: '{{ repeat.index >= 10 }}'
          alias: light off or we tried 10 times and failed
  - alias: 'Off Illumination '
    if:
    - condition: trigger
      id:
      - Light Above 79
      - Light Above 100
      - Light Above 150
      - Light Above 200
    - condition: numeric_state
      entity_id: sensor.aqara_p1_illuminance
      above: 79
    then:
    - repeat:
        sequence:
        - action: light.turn_off
          metadata: {}
          data: {}
          target:
            entity_id: '{{ light_ganglicht }}'
        - delay: '{{ light_delay }}'
        until:
        - condition: or
          conditions:
          - condition: state
            entity_id: light.ganglicht_zigbee_led
            state: 'off'
          - condition: template
            value_template: '{{ repeat.index >= 10 }}'
          alias: light off or we tried 10 times and failed
  - alias: Fix Lamp not turning off completely
    if:
    - condition: trigger
      id:
      - Turn off for sure 5min
      - Turn off for sure 15min
    then:
    - action: light.turn_on
      metadata: {}
      data:
        brightness_pct: 1
      target:
        entity_id: light.ganglicht_zigbee_led
    - delay:
        hours: 0
        minutes: 0
        seconds: 0
        milliseconds: 250
    - action: light.turn_off
      metadata: {}
      data: {}
      target:
        entity_id: light.ganglicht_zigbee_led
  mode: parallel
  max: 6
- id: '1727504565238'
  alias: Open Lucky Pot
  description: Check when we are able to open the Honeygain Lucky Pot, and open it
  triggers:
