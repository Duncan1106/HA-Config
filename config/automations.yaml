      notification_message: Das {{ friendly_name | default('Waschküche Fenster') }}
        ist offen seit {{ as_timestamp(now() - timedelta(minutes=120)) | timestamp_custom('%T',
        True) }}.
      notification_title: '{{ friendly_name | default(''Waschküche Fenster'') }} offen'
      repeat_notification: true
      time_between_repeat_notification:
        hours: 3
        minutes: 0
        seconds: 0
        days: 0
