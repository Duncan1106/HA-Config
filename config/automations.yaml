          milliseconds: 0
        continue_on_timeout: true
      - if:
        - condition: template
          value_template: '{{ not wait.completed }}'
        then:
        - action: notify.duncan
          data:
            message: ⚠️ The load did not rise above 10W within 30s after turning on
              at night.
