- id: '1749622712645'
  alias: Tablet Battery Status Alerts
  description: Sends notifications at battery thresholds (40%, 30%, 20%, 10%) and
    clears when charging above 40%, with flapping protection and automatic charging
    process restart.
  triggers:
  - entity_id:
    - sensor.lenovo_tab_p11_batterie
    - sensor.lenovo_tb_j606f_battery_level
    below: 39
    trigger: numeric_state
  - entity_id:
    - sensor.lenovo_tab_p11_batterie
    - sensor.lenovo_tb_j606f_battery_level
    below: 30
    trigger: numeric_state
  - entity_id:
    - sensor.lenovo_tab_p11_batterie
    - sensor.lenovo_tb_j606f_battery_level
    below: 20
    trigger: numeric_state
  - entity_id:
    - sensor.lenovo_tab_p11_batterie
    - sensor.lenovo_tb_j606f_battery_level
    below: 10
    trigger: numeric_state
  - trigger: numeric_state
    entity_id:
    - sensor.lenovo_tab_p11_batterie
    - sensor.lenovo_tb_j606f_battery_level
    above: 40
    id: Above_40
  conditions:
  - condition: or
    conditions:
    - condition: template
      value_template: "{{ trigger.from_state is not none and\n   (trigger.from_state.state
        | float(100)) > (trigger.to_state.state | float(0)) }}\n"
      alias: Check if Batters is dropping
    - condition: trigger
      id:
      - Above_40
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ (trigger.to_state.state | float(0)) < 11 }}'
      sequence:
      - data:
          title: "\U0001F534 Tablet Battery Critical!"
          message: 'Lenovo Tab P11 battery is at {{ trigger.to_state.state }}%. Plug
            it in now or check if it’s charging properly!

            '
          data:
            tag: lenovo_p11_battery_warning
        action: notify.duncan
      - action: script.restart_charging_process
        metadata: {}
        data: {}
      alias: Battery below 10
    - conditions:
      - condition: template
        value_template: '{{ (trigger.to_state.state | float(0)) < 21 }}'
      sequence:
      - data:
          title: "\U0001F7E0 Tablet Battery Low"
          message: 'Lenovo Tab P11 battery dropped to {{ trigger.to_state.state }}%.
            Might be an issue with the charger or cable.

            '
          data:
            tag: lenovo_p11_battery_warning
        action: notify.duncan
      - action: script.restart_charging_process
        metadata: {}
        data: {}
      alias: Battery below 20
    - conditions:
      - condition: template
        value_template: '{{ (trigger.to_state.state | float(0)) < 31 }}'
      sequence:
      - data:
          title: "\U0001F7E1 Tablet Battery Getting Low"
          message: 'Lenovo Tab P11 is now at {{ trigger.to_state.state }}%. Consider
            checking if it''s still charging as expected.

            '
          data:
            tag: lenovo_p11_battery_warning
        action: notify.duncan
      - action: script.restart_charging_process
        metadata: {}
        data: {}
      alias: Battery below 30
    - conditions:
      - condition: trigger
        id:
        - Above_40
      - condition: template
        value_template: "{{ trigger.from_state is not none and\n   (trigger.from_state.state
          | float(0)) < (trigger.to_state.state | float(100)) }}\n   "
      sequence:
      - data:
          data:
            tag: lenovo_p11_battery_warning
          message: clear_notification
        action: notify.duncan
      alias: Remove Notification if charging and above 40
    default:
    - data:
        title: ⚠️ Tablet Battery Notice
        message: 'Lenovo Tab P11 battery is at {{ trigger.to_state.state }}%. Might
          need attention soon.

          '
        data:
          tag: lenovo_p11_battery_warning
      action: notify.duncan
  mode: single
- id: '1749768402037'
  alias: Gang Light Brightness Control
  description: Automatically adjust the stairway light brightness based on the light
    brightness template time based sensor value. If brightness drops to zero, the
    light will turn off, ensuring optimal lighting conditions at all times.
  triggers:
  - trigger: state
    entity_id:
    - sensor.light_brighness
    id: Change
  - trigger: numeric_state
    entity_id:
    - sensor.light_brighness
    below: 1
    id: Zero
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Change
      - condition: numeric_state
        entity_id: sensor.light_brighness
        above: 0
      sequence:
      - if:
        - condition: or
          conditions:
          - condition: state
            entity_id: light.esp32_c3_mini_treppenhaus_licht
            state: 'off'
          - condition: template
            value_template: '{% set sensor_brightness = (states(''sensor.light_brighness'')
              | float(0) * 2.55) | int(0) %}

              {% set current = state_attr(''light.esp32_c3_mini_treppenhaus_licht'',
              ''brightness'') | int(0) %}

              {{ sensor_brightness != current }}'
        then:
        - action: light.turn_on
          metadata: {}
          data:
            brightness_pct: '{{ states(''sensor.light_brighness'') | int(0) }}'
          target:
            entity_id: light.esp32_c3_mini_treppenhaus_licht
      alias: On with specified Brighness
    - conditions:
      - condition: trigger
        id:
        - Zero
      - condition: template
        value_template: '{{ trigger.from_state.state | int(1) > 0 }}'
      sequence:
      - action: light.turn_off
        metadata: {}
        data: {}
        target:
          entity_id: light.esp32_c3_mini_treppenhaus_licht
      alias: Off if Brightness changes to Zero
  mode: single
