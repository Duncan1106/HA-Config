          else:
          - alias: Creating a full backup (default action)
            data:
              name: '{{ name }}'
              password: '{{ password }}'
              keep_days: '{{ keep_days }}'
              download_path:
              - /share/NAS_Share/Backup/
              exclude_folders:
              - media
            action: auto_backup.backup
        alias: Monthly Backup
      - conditions:
        - condition: template
          value_template: '{{ enable_weekly }}'
        - condition: template
          value_template: '{{ now().weekday() == 0 }}'
        sequence:
        - variables:
            backup_type: weekly
            keep_days: 30.4167
        - variables:
            name: "{{ backup_type | title }}Backup: {{\n  now().strftime(\n    \"%A,
              \"\n    ~ iif(backup_type == \"hourly\", \"%H:%M, \", \"\")\n    ~ \"%B
              %-d, %Y\"\n  )\n}}\n{# HourlyBackup: Monday, 3:04 PM, January 2, 2006
              #}\n{# DailyBackup: Monday, January 2, 2006 #}\n"
            backup_action:
            - data:
                name: '{{ name }}'
                password: '{{ password }}'
                keep_days: '{{ keep_days }}'
                download_path:
                - /share/NAS_Share/Backup/
                include_folders:
                - config
                exclude_folders:
                - media
              action: auto_backup.backup
        - if:
          - condition: template
            value_template: '{{ not use_action_hourly }}'
          - condition: template
            value_template: '{{ backup_action | length > 0 }}'
          then:
          - data:
              name: '{{ name }}'
              password: '{{ password }}'
              keep_days: '{{ keep_days }}'
              download_path:
              - /share/NAS_Share/Backup/
              include_folders:
              - config
              exclude_folders:
              - media
            action: auto_backup.backup
          else:
          - alias: Creating a full backup (default action)
            data:
              name: '{{ name }}'
              password: '{{ password }}'
              keep_days: '{{ keep_days }}'
              download_path:
              - /share/NAS_Share/Backup/
              exclude_folders:
              - media
            action: auto_backup.backup
        alias: Weekly Backup
      - conditions:
        - condition: template
          value_template: '{{ enable_daily }}'
        sequence:
        - variables:
            backup_type: daily
            keep_days: 7
        - variables:
            name: "{{ backup_type | title }}Backup: {{\n  now().strftime(\n    \"%A,
              \"\n    ~ iif(backup_type == \"hourly\", \"%H:%M, \", \"\")\n    ~ \"%B
              %-d, %Y\"\n  )\n}}\n{# HourlyBackup: Monday, 3:04 PM, January 2, 2006
              #}\n{# DailyBackup: Monday, January 2, 2006 #}\n"
            backup_action:
            - data:
                name: '{{ name }}'
                password: '{{ password }}'
                keep_days: '{{ keep_days }}'
                download_path:
                - /share/NAS_Share/Backup/
                include_folders:
                - config
                exclude_folders:
                - media
              action: auto_backup.backup
        - if:
          - condition: template
            value_template: '{{ not use_action_hourly }}'
          - condition: template
            value_template: '{{ backup_action | length > 0 }}'
          then:
          - data:
              name: '{{ name }}'
              password: '{{ password }}'
              keep_days: '{{ keep_days }}'
              download_path:
              - /share/NAS_Share/Backup/
              include_folders:
              - config
              exclude_folders:
              - media
            action: auto_backup.backup
          else:
          - alias: Creating a full backup (default action)
            data:
              name: '{{ name }}'
              password: '{{ password }}'
              keep_days: '{{ keep_days }}'
              download_path:
              - /share/NAS_Share/Backup/
              exclude_folders:
              - media
            action: auto_backup.backup
        alias: Daily Backup
    else:
    - variables:
        backup_type: hourly
        keep_days: 1
    - variables:
        name: "{{ backup_type | title }}Backup: {{\n  now().strftime(\n    \"%A, \"\n
          \   ~ iif(backup_type == \"hourly\", \"%H:%M, \", \"\")\n    ~ \"%B %-d,
          %Y\"\n  )\n}}\n{# HourlyBackup: Monday, 3:04 PM, January 2, 2006 #}\n{#
          DailyBackup: Monday, January 2, 2006 #}\n"
        backup_action:
        - data:
            name: '{{ name }}'
            password: '{{ password }}'
            keep_days: '{{ keep_days }}'
            exclude_database: true
