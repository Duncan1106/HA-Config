  alias: Nightly Battery Energy Charged
  description: ''
  triggers:
  - event: sunrise
    offset: 0
    id: Rise
    trigger: sun
  - event: sunset
    offset: 0
    id: Set
    trigger: sun
  conditions: []
  actions:
  - alias: 'Save last night '
    if:
    - condition: trigger
      id:
      - Rise
    then:
    - action: input_number.set_value
      metadata: {}
      data:
        value: '{{ states(''sensor.day_night_battery_charged_energy'') | float(0)
          | round(2) }}

          '
      target:
        entity_id: input_number.last_night_battery_charged
