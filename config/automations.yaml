- id: '1735214695890'
  alias: Dunstabzugshaube
  description: "## \U0001F4A8 Dunstabzugshaube (Range Hood Control)\n\n### \U0001F4CB
    **Automatic Range Hood Activation Based on Window Sensor**  \nThis automation
    controls the kitchen range hood (`switch.dunstabzugshaube`) based on the state
    of the `binary_sensor.wintergarten_tur_contact` (window/door contact). It ensures
    the hood turns on when the window opens and turns off when the window closes.\n\n---\n\n###
    ⏰ **Triggers**\n| Entity | Event | Trigger ID |\n|--------|-------|------------|\n|
    `binary_sensor.wintergarten_tur_contact` | Changes to `off` | Close |\n| `binary_sensor.wintergarten_tur_contact`
    | Changes to `on` | Open |\n\n---\n\n### ✅ **Conditions**\n- None. Actions are
    executed directly based on the trigger.\n\n---\n\n### \U0001F3AF **Actions / Workflow**\n\n1.
    **Window Closed Trigger** (`Close`)  \n   - Turns **off** the `switch.dunstabzugshaube`.\n\n2.
    **Window Open Trigger** (`Open`)  \n   - Turns **on** the `switch.dunstabzugshaube`.\n\n---\n\n###
    \U0001F527 **Technical Specs**\n- **Controlled Device:** `switch.dunstabzugshaube`
    \ \n- **Trigger Sensor:** `binary_sensor.wintergarten_tur_contact`  \n- **Mode:**
    `single` — ensures only one instance of the automation runs at a time.\n\n---\n\n###
    ⚡ **Notes & Best Practices**\n- Ideal for preventing energy waste by only running
    the hood when ventilation is needed.  \n- Can be extended with a delay if you
    want the hood to stay on/off for a short buffer period after opening or closing
    the window.  \n- Simple, reliable automation suitable for kitchen ventilation
    safety and efficiency.\n"
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.wintergarten_tur_contact
    to: 'off'
    id: Close
  - trigger: state
    entity_id:
    - binary_sensor.wintergarten_tur_contact
    to: 'on'
    id: Open
  conditions: []
  actions:
  - alias: Close -> off
    if:
    - condition: trigger
      id:
      - Close
    then:
    - action: switch.turn_off
      metadata: {}
      data: {}
      target:
        entity_id: switch.dunstabzugshaube
  - alias: Open -> on
    if:
    - condition: trigger
      id:
      - Open
    then:
    - action: switch.turn_on
      metadata: {}
      data: {}
      target:
        entity_id: switch.dunstabzugshaube
  mode: single
