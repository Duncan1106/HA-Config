      sequence:
      - action: script.retry_action_with_backoff
        metadata: {}
        data:
          action_domain: light
          action_type: turn_on
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: simple
          notify_on_failure: true
          notify_service: notify.duncan
          target_state: 'on'
          entity_id: light.orangina_local
          service_data: '{"brightness_pct":"100"}'
      alias: 'On'
    - conditions:
      - condition: or
        conditions:
        - alias: 23 o'clock and in bed off
          condition: and
          conditions:
          - condition: time
            after: '22:59:00'
            before: 04:00:00
          - condition: state
            entity_id: switch.esp32_c3_mini_bett_nachtlicht_was_in_bed
            state: 'on'
          - condition: trigger
            id:
            - 'Off'
        - alias: Daytime or if bright enough
          condition: and
          conditions:
          - condition: time
            before: '20:00:00'
            after: 04:00:00
          - condition: trigger
            id:
            - Off sync
        - condition: and
          conditions:
          - condition: trigger
            id:
            - Off end time
          - condition: time
            after: 00:59:00
            before: 04:00:00
          alias: After 1 o'clock force off
      sequence:
      - action: script.retry_action_with_backoff
        metadata: {}
        data:
          action_domain: light
          action_type: turn_off
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: simple
          notify_on_failure: true
          notify_service: notify.duncan
          target_state: 'off'
          entity_id: light.orangina_local
      alias: 'Off'
  mode: queued
  max: 10
- id: '1738676581969'
  alias: Connectivity Ping Update
  description: "# \U0001F310 **Connectivity Ping Update**\n\n### \U0001F4CB Adaptive
    Connectivity Sensor Update Controller\n\nThis automation enforces **deterministic,
    state-driven update intervals** for\nping-based connectivity binary sensors by
    explicitly triggering\n`homeassistant.update_entity` in a **structured, staged
    execution model**.\n\nBy doing so, it **bypasses the integrations’ internal polling
    cadence**, ensuring\npredictable, explainable, and centrally controlled evaluation
    timing for both\n**internet reachability** and **local network health**, while
    avoiding update\nbursts and ICMP congestion.\n\n---\n\n### \U0001F9ED Connectivity
    Model\n\nConnectivity is evaluated along **two orthogonal dimensions**:\n\n1.
    **External (Internet) Reachability**\n   - Multiple independent public endpoints
    across different DNS providers\n   - Split into *primary* and *secondary* groups\n
    \  - Detects upstream ISP, routing, or DNS-level outages\n\n2. **Internal (Local)
    Reachability**\n   - A dedicated local router endpoint (Cudy)\n   - Distinguishes
    *LAN availability* from *internet availability*\n\nThis separation prevents false
    conclusions such as:\n\n> “The internet is down”  \nwhen in reality the **local
    network or router is unreachable**, or vice versa.\n\n---\n\n### \U0001F501 Redundancy
    Strategy\n\nRedundancy is achieved through **horizontal diversity and staged execution**,
    not\nblind packet repetition:\n\n- Multiple providers and endpoints\n- Each sensor
    configured with **`count: 3`**\n- Sensors updated **sequentially** with short
    inter-entity delays\n- External targets split into:\n  - **Primary external group**\n
    \ - **Secondary external group**\n\nThis approach improves diagnostic clarity,
    reduces ICMP collision effects, and\nkeeps traffic **predictable and bounded**.\n\n---\n\n###
    ⏱ Trigger Overview\n\n| Trigger Type | Interval | Operational Context |\n| :-----------
    | :------- | :------------------ |\n| **Time Pattern** | Every **15 seconds**
    | Base scheduler for all modes |\n\nThe trigger fires every 15 seconds, but **actual
    updates are gated by conditions**\nbased on the current operational state.\n\n---\n\n###
    \U0001F9E0 Operational Logic\n\n#### Daily / Active Mode\n\n- **Behavior**:\n
    \ - All connectivity sensors are evaluated on every 15-second trigger.\n  - Execution
    order:\n    1. Local (LAN) target\n    2. External primary targets\n    3. External
    secondary targets\n  - Short delays between updates prevent ICMP bursts.\n\n-
    **Use case**:\n  - Normal occupancy\n  - Automations depending on reliable, near-real-time
    connectivity state\n\n---\n\n#### Vacation / Power-Save Mode\n\n- **Behavior**:\n
    \ - Sensors are updated **only on exact 30-second boundaries** (`:00` and `:30`).\n
    \ - Enforced via modulo-based time gating:\n    ```\n    ((now().minute * 60 +
    now().second) % 30) == 0\n    ```\n  - Maintains baseline reachability awareness
    while significantly reducing:\n    - Scheduler churn\n    - Network traffic\n
    \   - Radio wakeups\n\n- **Use case**:\n  - Extended absence\n  - Reduced automation
    sensitivity requirements\n\n---\n\n### \U0001F4CA Update Frequency & Traffic Profile\n\n**Assumptions**:\n\n-
    7 total ping sensors\n- **`count: 3` per sensor**\n- IPv4 ICMP Echo Request +
    Reply\n- ~168 bytes per request/reply pair → ~504 bytes per update\n- 6 external
    (internet) targets\n- 1 internal (LAN) target\n\n---\n\n#### \U0001F30D External
    Traffic (Internet Reachability)\n\n| Mode | Interval | Update Calls / Day | ICMP
    Packets / Day | Traffic / Day | Traffic / Month |\n| :--- | :------- | ------------------
    | ------------------ | ------------- | --------------- |\n| **Daily** | 15 s |
    34,560 | 207,360 | ~16.6 MB | ~500 MB |\n| **Vacation** | 30 s | 17,280 | 103,680
    | ~8.7 MB | ~260 MB |\n\n**Includes**:\n- Cloudflare: `1.1.1.1`, `1.0.0.1`\n-
    Google: `8.8.8.8`, `8.8.4.4`\n- Quad9: `9.9.9.9`, `149.112.112.112`\n\n---\n\n####
    \U0001F3E0 Internal Traffic (Local Network Reachability)\n\n| Mode | Interval
    | Update Calls / Day | ICMP Packets / Day | Traffic / Day | Traffic / Month |\n|
    :--- | :------- | ------------------ | ------------------ | ------------- | ---------------
    |\n| **Daily** | 15 s | 5,760 | 34,560 | ~2.9 MB | ~87 MB |\n| **Vacation** |
    30 s | 2,880 | 17,280 | ~1.4 MB | ~43 MB |\n\n**Includes**:\n- Cudy Router: `192.168.2.1`\n\n>
    This traffic **never leaves the LAN** and remains confined to the local\n> Ethernet
    / Wi-Fi segment.\n\n---\n\n### ⚙ Technical Characteristics\n\n- **Automation Mode**:
    `parallel` (max concurrent executions: 3)\n- **Execution Strategy**:\n  - Explicit
    `homeassistant.update_entity`\n  - Sequential updates via `repeat` with controlled
    delays\n- **State Control Input**:\n  - `input_select.smart_home_status`\n- **Deterministic
    Timing**:\n  - Centralized scheduling\n  - No reliance on integration-specific
    polling behavior\n\n---\n\n### \U0001F4DD Notes & Design Rationale\n\n- **Why
    `count: 3`**  \n  A small ICMP burst increases robustness against transient packet
    loss while\n  remaining traffic-bounded and analytically predictable.\n\n- **Why
    staged execution**  \n  Sequential updates with delays prevent ICMP spikes, improve
    radio fairness,\n  and produce cleaner failure signatures.\n\n- **Why split external
    targets**  \n  Primary vs. secondary grouping improves fault localization and
    avoids\n  synchronized failures masking partial outages.\n\n- **Why separate local
    vs external targets**  \n  This avoids conflating:\n  - ISP outages\n  - DNS/provider
    failures\n  - Router or LAN failures  \n  Each failure class produces a distinct,
    interpretable sensor pattern.\n\n- **Scalability**  \n  Additional targets or
    execution stages can be introduced without altering the\n  core scheduling or
    condition logic."
  triggers:
  - trigger: time_pattern
    seconds: /15
  conditions:
  - condition: template
    value_template: "{% if states('input_select.smart_home_status') == 'Daily' %}\n
      \ true\n{% elif states('input_select.smart_home_status') in ['Vacation', 'Power
      Save'] %}\n  {{ ((now().minute*60 + now().second) % 30) == 0 }}\n{% else %}\n
      \ false\n{% endif %}\n"
  actions:
  - variables:
      local:
      - binary_sensor.192_168_2_1
      external_primary:
      - binary_sensor.1_1_1_1
      - binary_sensor.8_8_8_8
      - binary_sensor.9_9_9_9
      external_secondary:
      - binary_sensor.1_0_0_1
      - binary_sensor.8_8_4_4
      - binary_sensor.149_112_112_112
  - repeat:
      for_each: '{{ local }}'
      sequence:
      - action: homeassistant.update_entity
        data:
          entity_id: '{{ repeat.item }}'
      - delay:
          hours: 0
          minutes: 0
          seconds: 0
          milliseconds: 125
  - delay:
      hours: 0
      minutes: 0
      seconds: 2
      milliseconds: 0
  - repeat:
      for_each: '{{ external_primary }}'
      sequence:
      - action: homeassistant.update_entity
        data:
          entity_id: '{{ repeat.item }}'
      - delay:
          hours: 0
          minutes: 0
          seconds: 0
          milliseconds: 125
  - delay:
      hours: 0
      minutes: 0
      seconds: 2
      milliseconds: 0
  - repeat:
      for_each: '{{ external_secondary }}'
      sequence:
      - action: homeassistant.update_entity
        data:
          entity_id: '{{ repeat.item }}'
      - delay:
          hours: 0
          minutes: 0
          seconds: 0
          milliseconds: 125
  mode: parallel
  max: 3
