- id: '1727387566504'
  alias: Ganglicht Motion
  description: "## \U0001F6B6 Ganglicht Motion  \n\n### \U0001F4CB **Motion-Activated
    Hallway & Stairway Lighting**  \nControls both hallway (`ganglicht`) and stairway
    (`treppenlicht`) lights based on motion sensors, ambient light levels, and adds
    robust sync & reliability fixes to ensure lights turn on/off correctly.  \n\n---\n\n###
    \U0001F506 **Turn ON Triggers**  \n| Condition | Entity | Threshold |\n|-----------|--------|-----------|\n|
    **Motion (below)** | `binary_sensor.aqara_p1_occupancy`, `binary_sensor.gang_bewegung_keller_tur_occupancy`
    | State = **on** |\n| **Motion (above)** | `binary_sensor.treppenhaus_presence`
    | State = **on** |\n| **Sync ON** | `sensor.light_brighness` | Above **0.1** |\n\n---\n\n###
    \U0001F319 **Turn OFF Triggers**  \n| Condition | Entity | Threshold |\n|-----------|--------|-----------|\n|
    **Sync OFF** | `sensor.light_brighness` | Below **0.1** |\n| **Illuminance** |
    `sensor.aqara_p1_illuminance` | Above **79 / 100 / 150 / 200 lux** |\n| **Force
    OFF** | `light.ganglicht_zigbee_led` | Off for **5 min / 15 min** |\n\n---\n\n###
    \U0001F3AF **Smart Logic**  \n\n#### **\U0001F506 Motion-Driven ON**  \n- **Downstairs
    motion** (dark < 80 lux & no timed light)  \n  → `ganglicht` ON at **100%**  \n
    \ → `treppenlicht` OFF  \n- **Upstairs motion** (dark < 80 lux & no timed light)
    \ \n  → `treppenlicht` ON at **10%**  \n  → `ganglicht` ON at **75%** after 0.5s
    \ \n  → Wait 1min for downstairs motion → adjust ganglicht/treppenlicht accordingly
    \ \n\n---\n\n#### **\U0001F319 Auto-OFF**  \n- **After 5 min of no motion** →
    `script.5_min_turn_off_ganglicht`  \n- **Sync OFF** (sensor < 0.1 & no motion
    detected) → Retry up to 10× with 0.5s delays until confirmed OFF  \n- **High Lux
    Override** (above 79–200 lux) → Retry up to 10× until confirmed OFF  \n- **Force
    OFF failsafe** (light stuck off for 5–15 min) → Briefly set `brightness=1%` →
    then OFF again  \n\n---\n\n#### **\U0001F501 Sync & Reliability Fixes**  \n- **Sync
    ON**: Retry up to 10× until ganglicht confirms **ON**  \n- **Sync OFF**: Retry
    up to 10× until ganglicht confirms **OFF**  \n- **Failsafe OFF**: If stuck, cycle
    ON (1%) → OFF  \n\n---\n\n### \U0001F527 **Technical Specs**  \n- **Targets:**
    \ \n  - Hallway: `light.ganglicht_zigbee_led`  \n  - Stairway: `light.esp32_c3_mini_treppenhaus_licht`
    \ \n- **Sensors:**  \n  - Motion: `aqara_p1`, `treppenhaus`, `keller_tur`  \n
    \ - Lux: `sensor.aqara_p1_illuminance`  \n  - Brightness state: `sensor.light_brighness`
    \ \n- **Brightness Profiles:**  \n  - Hallway (motion below): **100%**  \n  -
    Hallway (motion above): **75%**  \n  - Stairway: **10%**  \n- **Delays & Retries:**
    0.5s between retries, up to 10 attempts  \n- **Mode:** `parallel` (max 6 concurrent
    runs)"
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.aqara_p1_occupancy
    - binary_sensor.gang_bewegung_keller_tur_occupancy
    to: 'on'
    id: 'On motion '
  - trigger: state
    entity_id:
    - binary_sensor.treppenhaus_presence
    to: 'on'
    id: On motion oben
  - trigger: numeric_state
    entity_id:
    - sensor.light_brighness
    above: 0.1
    id: Sync on
  - trigger: numeric_state
    entity_id:
    - sensor.light_brighness
    id: Sync off
    below: 0.1
  - trigger: numeric_state
    entity_id:
    - sensor.aqara_p1_illuminance
    above: 200
    id: Light Above 200
  - trigger: numeric_state
    entity_id:
    - sensor.aqara_p1_illuminance
    above: 150
    id: Light Above 150
  - trigger: numeric_state
    entity_id:
    - sensor.aqara_p1_illuminance
    above: 100
    id: Light Above 100
  - trigger: numeric_state
    entity_id:
    - sensor.aqara_p1_illuminance
    above: 79
    id: Light Above 79
  - trigger: state
    entity_id:
    - light.ganglicht_zigbee_led
    to: 'off'
    for:
      hours: 0
      minutes: 5
      seconds: 0
    id: Turn off for sure 5min
  - trigger: state
    entity_id:
    - light.ganglicht_zigbee_led
    to: 'off'
    for:
      hours: 0
      minutes: 15
      seconds: 0
    id: Turn off for sure 15min
  conditions: []
  actions:
  - variables:
      lux_threshold: 80
      ganglicht_brightness: 100
      treppenlicht_brightness: 10
      ganglicht_brightness_oben: 75
      light_ganglicht: light.ganglicht_zigbee_led
      light_treppenlicht: light.esp32_c3_mini_treppenhaus_licht
      light_delay: '00:00:00.500'
  - alias: On motion
    if:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - 'On motion '
      - condition: numeric_state
        entity_id: sensor.aqara_p1_illuminance
        below: 80
        enabled: true
      - condition: numeric_state
        entity_id: sensor.light_brighness
        below: 0.1
      alias: motion & dark enough & no timed light
    then:
    - action: script.retry_action_with_backoff
      metadata: {}
      data:
        max_retries: 10
        base_delay: 5
        max_delay: 60
        backoff_type: simple
        notify_on_failure: true
        notify_service: notify.duncan
        entity_id: '{{ light_ganglicht }}'
        target_state: 'on'
        service_data:
          brightness_pct: '{{ ganglicht_brightness }}'
        action_domain: light
        action_type: turn_on
    - action: script.retry_action_with_backoff
      metadata: {}
      data:
        action_domain: light
        action_type: turn_off
        max_retries: 10
        base_delay: 5
        max_delay: 60
        backoff_type: simple
        notify_on_failure: true
        notify_service: notify.duncan
        target_state: 'off'
        entity_id: '{{ light_treppenlicht }}'
  - alias: On motion oben
    if:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - On motion oben
      - condition: numeric_state
        entity_id: sensor.aqara_p1_illuminance
        below: 80
        enabled: true
      - condition: numeric_state
        entity_id: sensor.light_brighness
        below: 0.1
      alias: motion oben & dark enough & no timed light
    then:
    - action: script.retry_action_with_backoff
      metadata: {}
      data:
        action_domain: light
        action_type: turn_on
        max_retries: 10
        base_delay: 5
        max_delay: 60
        backoff_type: simple
        notify_on_failure: true
        notify_service: notify.duncan
        target_state: 'on'
        entity_id: '{{ light_treppenlicht }}'
        service_data:
          brightness_pct: '{{ treppenlicht_brightness }}'
    - delay: '{{ light_delay }}'
    - action: script.retry_action_with_backoff
      metadata: {}
      data:
        max_retries: 10
        base_delay: 5
        max_delay: 60
        backoff_type: simple
        notify_on_failure: true
        notify_service: notify.duncan
        entity_id: '{{ light_ganglicht }}'
        target_state: 'on'
        action_domain: light
        action_type: turn_on
        service_data:
          brightness_pct: '{{ ganglicht_brightness_oben }}'
    - sequence:
      - wait_for_trigger:
        - trigger: state
          entity_id:
          - binary_sensor.aqara_p1_occupancy
          - binary_sensor.gang_bewegung_keller_tur_occupancy
          to: 'on'
        timeout:
          hours: 0
          minutes: 1
          seconds: 0
          milliseconds: 0
        continue_on_timeout: true
      - alias: wait for motion, if motion is detected downtairs, turn on ganglicht,
          and turn off treppenhasu licht if it should be off
        if:
        - condition: and
          conditions:
          - condition: template
            value_template: '{{ not wait.completed }}'
          - condition: numeric_state
            entity_id: sensor.light_brighness
            below: 0.1
          - condition: not
            conditions:
            - condition: or
              conditions:
              - condition: state
                entity_id: binary_sensor.aqara_p1_occupancy
                state:
                - 'on'
              - condition: state
                entity_id: binary_sensor.gang_bewegung_keller_tur_occupancy
                state:
                - 'on'
              - condition: state
                entity_id: binary_sensor.treppenhaus_presence
                state:
                - 'on'
        then:
        - action: light.turn_off
          metadata: {}
          data: {}
          target:
            entity_id: '{{ light_ganglicht }}'
        - alias: if treppenhauslicht should be off, then turn off else do nothing
          if:
          - condition: numeric_state
            entity_id: sensor.light_brighness
            below: 0.1
          then:
          - action: light.turn_off
            metadata: {}
            data: {}
            target:
              entity_id: '{{ light_treppenlicht }}'
        else:
        - action: light.turn_on
          metadata: {}
          data:
            brightness_pct: '{{ ganglicht_brightness }}'
          target:
            entity_id: '{{ light_ganglicht }}'
        - alias: if treppenhauslicht should be off, then turn off else do nothing
          if:
          - condition: numeric_state
            entity_id: sensor.light_brighness
            below: 0.1
          then:
          - action: light.turn_off
            metadata: {}
            data: {}
            target:
              entity_id: '{{ light_treppenlicht }}'
      enabled: true
  - alias: Turn off after 5min
    if:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - 'On motion '
        - On motion oben
      - condition: numeric_state
        entity_id: sensor.light_brighness
        below: 0.1
      alias: motion & no timed light
    then:
    - action: script.5_min_turn_off_ganglicht
      metadata: {}
      data: {}
  - alias: On Light Sync
    if:
    - condition: trigger
      id:
      - Sync on
    - condition: numeric_state
      entity_id: sensor.light_brighness
      above: 0.1
    then:
    - alias: turn on until on or we tried 10 times
      repeat:
        sequence:
        - action: light.turn_on
          metadata: {}
          data:
            brightness_pct: '{{ ganglicht_brightness }}'
          target:
            entity_id: '{{ light_ganglicht }}'
        - delay: '{{ light_delay }}'
        until:
        - condition: or
          conditions:
          - condition: state
            entity_id: light.ganglicht_zigbee_led
            state: 'on'
          - condition: template
            value_template: '{{ repeat.index >= 10 }}'
          alias: either light on or we tried 10 times and failed
      enabled: false
    - action: script.retry_action_with_backoff
      metadata: {}
      data:
        max_retries: 10
        base_delay: 5
        max_delay: 60
        backoff_type: simple
        notify_on_failure: true
        notify_service: notify.duncan
        entity_id: '{{ light_ganglicht }}'
        target_state: 'on'
        service_data:
          brightness_pct: '{{ ganglicht_brightness }}'
        action_domain: light
        action_type: turn_on
  - alias: Off Light Sync
    if:
    - condition: trigger
      id:
      - Sync off
    - condition: not
      conditions:
      - condition: or
        conditions:
        - condition: state
          entity_id: binary_sensor.aqara_p1_occupancy
          state: 'on'
        - condition: state
          entity_id: binary_sensor.treppenhaus_presence
          state: 'on'
        - condition: state
          entity_id: binary_sensor.gang_bewegung_keller_tur_occupancy
          state: 'on'
      alias: No Motion Detected
      enabled: true
    then:
    - action: script.retry_action_with_backoff
      metadata: {}
      data:
        action_domain: light
        action_type: turn_off
        max_retries: 10
        base_delay: 5
        max_delay: 60
        backoff_type: simple
        notify_on_failure: true
        notify_service: notify.duncan
        target_state: 'off'
        entity_id: '{{ light_ganglicht }}'
  - alias: 'Off Illumination '
    if:
    - condition: trigger
      id:
      - Light Above 79
      - Light Above 100
      - Light Above 150
      - Light Above 200
    - condition: numeric_state
      entity_id: sensor.aqara_p1_illuminance
      above: 79
    then:
    - action: script.retry_action_with_backoff
      metadata: {}
      data:
        action_domain: light
        action_type: turn_off
        max_retries: 10
        base_delay: 5
        max_delay: 60
        backoff_type: simple
        notify_on_failure: true
        notify_service: notify.duncan
        target_state: 'off'
        entity_id: '{{ light_ganglicht }}'
  - alias: Fix Lamp not turning off completely
    if:
    - condition: trigger
      id:
      - Turn off for sure 5min
      - Turn off for sure 15min
    then:
    - action: light.turn_on
      metadata: {}
      data:
        brightness_pct: 1
      target:
        entity_id: light.ganglicht_zigbee_led
    - delay:
        hours: 0
        minutes: 0
        seconds: 0
        milliseconds: 250
    - action: light.turn_off
      metadata: {}
      data: {}
      target:
        entity_id: light.ganglicht_zigbee_led
  mode: parallel
  max: 6
- id: '1728376825897'
  alias: Bad Nachtlicht Motion
  description: "  ## \U0001F6BB Bad Nachtlicht Motion  \n\n  ### \U0001F4CB **Smart
    Bathroom Night Light Control**  \n\n  This automation manages the bathroom night
    light intelligently, balancing\n  comfort and energy saving.  \n\n  - **Turns
    on** when it’s dark (<20 lux) and motion is detected.  \n  - **Turns off** if
    ambient light becomes bright (>25–50 lux).  \n  - **Turns off after motion clears**
    (30s wait), but adapts based on brightness:  \n    - If brightness is above **15
    lux** → switch light **off** with a smooth\n      **1.5s fade** (with retries).
    \ \n    - If it’s still dark → keep a **soft glow** at brightness 9 with a **1.5s\n
    \     fade** (with retries).  \n  - **Retries ensure reliability**: repeated on/off
    commands until the final\n    state is confirmed.  \n  - **Restart mode**: new
    motion cancels pending off-timers.  \n\n  ---\n\n  ### ⏰ **Triggers**  \n\n  |
    Condition                  | Entity                             | Threshold/State
    |\n  |----------------------------|------------------------------------|-----------------|\n
    \ | **Low Light**              | `sensor.bad_nachtlicht_illuminance` | Below **9
    lux** |\n  | **Motion Detected**        | `binary_sensor.kinderbad_bewegung` |
    **on**          |\n  | **Motion Cleared (short)** | `binary_sensor.kinderbad_bewegung`
    | **off** for 30s |\n  | **Motion Cleared (long)**  | `binary_sensor.kinderbad_bewegung`
    | **off** for 1m  |\n  | **Brightness High**        | `sensor.bad_nachtlicht_illuminance`
    | Above **25 lux** |\n  | **Brightness Very High**   | `sensor.bad_nachtlicht_illuminance`
    | Above **50 lux** |\n\n  ---\n\n  ### ✅ **Conditions**  \n\n  Light only turns
    **on** if:  \n  - `sensor.bad_nachtlicht_illuminance` < **20 lux**  \n  - `binary_sensor.kinderbad_bewegung`
    is **on**  \n  - Light is **off** OR brightness < **10%**  \n\n  ---\n\n  ###
    \U0001F3AF **Actions**  \n\n  #### **\U0001F4A1 On Action**  \n  - Turn on `light.bad_nachtlicht`
    \ \n  - Brightness: **100%**  \n  - Color Temp: **2400K**  \n  - Transition: **1.5s
    smooth fade**  \n\n  ---\n\n  #### **\U0001F319 Off Action (after motion clears)**
    \ \n  - Wait **30s** after motion clears  \n  - If brightness > **15 lux** → turn
    light **off** with a **1.5s fade**\n    (with retries)  \n  - Else (still dark)
    → set light to **brightness 9** with a **1.5s fade**\n    (with retries)  \n\n
    \ ---\n\n  #### **⚡ Immediate Off Action**  \n  - If brightness rises above **25–50
    lux**  \n  - Turn off `light.bad_nachtlicht` immediately with a **0.25s fade**\n
    \   (with retries)  \n\n  ---\n\n  ### \U0001F527 **Technical Specs**  \n  - **Target
    Light:** `light.bad_nachtlicht`  \n  - **Sensors Used:**  \n    - `sensor.bad_nachtlicht_illuminance`
    \ \n    - `binary_sensor.kinderbad_bewegung`  \n  - **Mode:** `restart`  \n  -
    **Failsafes:** all on/off/dim actions repeat until confirmed"
  triggers:
  - entity_id:
    - sensor.bad_nachtlicht_illuminance
    below: 9
    id: 'On'
    trigger: numeric_state
    enabled: true
  - trigger: state
    entity_id:
    - binary_sensor.kinderbad_bewegung
    to: 'on'
    from: 'off'
    id: 'On'
  - trigger: state
    entity_id:
    - binary_sensor.kinderbad_bewegung
    to: 'off'
    from: 'on'
    id: 'Off'
    for:
      hours: 0
      minutes: 0
      seconds: 30
  - trigger: state
    entity_id:
    - binary_sensor.kinderbad_bewegung
    to: 'off'
    from:
    id: 'Off'
    for:
      hours: 0
      minutes: 1
      seconds: 0
  - entity_id:
    - sensor.bad_nachtlicht_illuminance
    id: Off immediately
    trigger: numeric_state
    enabled: true
    above: 25
  - entity_id:
    - sensor.bad_nachtlicht_illuminance
    id: Off immediately
    trigger: numeric_state
    enabled: true
    above: 50
  conditions: []
  actions:
  - alias: 'On'
    if:
    - condition: and
      conditions:
      - condition: and
        conditions:
        - condition: trigger
          id:
          - 'On'
        - condition: numeric_state
          entity_id: sensor.bad_nachtlicht_illuminance
          below: 20
        - condition: state
          entity_id: binary_sensor.kinderbad_bewegung
          state: 'on'
      - condition: or
        conditions:
        - condition: state
          entity_id: light.bad_nachtlicht
          state: 'off'
        - condition: template
          value_template: '{{ state_attr(''light.bad_nachtlicht'',''brightness'')|int(0)
            < 10 }}'
    then:
    - action: script.retry_action_with_backoff
      metadata: {}
      data:
        action_domain: light
        action_type: turn_on
        max_retries: 10
        base_delay: 5
        max_delay: 60
        backoff_type: simple
        notify_on_failure: true
        notify_service: notify.duncan
        entity_id: light.bad_nachtlicht
        target_state: 'on'
        service_data:
          brightness_pct: 100
          color_temp_kelvin: 2400
          transition: 1.5
  - alias: Off after time x
    if:
    - condition: trigger
      id:
      - 'Off'
    then:
    - delay:
        hours: 0
        minutes: 0
        seconds: 30
        milliseconds: 0
    - if:
      - condition: numeric_state
        entity_id: sensor.bad_nachtlicht_illuminance
        above: 15
      then:
      - action: script.retry_action_with_backoff
        metadata: {}
        data:
          action_domain: light
          action_type: turn_off
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: simple
          notify_on_failure: true
          notify_service: notify.duncan
          target_state: 'off'
          entity_id: light.bad_nachtlicht
          service_data:
            transition: 1.5
      else:
      - action: script.retry_action_with_backoff
        metadata: {}
        data:
          action_domain: light
          action_type: turn_on
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: simple
          notify_on_failure: true
          notify_service: notify.duncan
          entity_id: light.bad_nachtlicht
          target_state: 'on'
          service_data:
            brightness: 9
            color_temp_kelvin: 2400
            transition: 1.5
    enabled: true
  - alias: Off immediately
    if:
    - condition: trigger
      id:
      - Off immediately
    then:
    - action: script.retry_action_with_backoff
      metadata: {}
      data:
        action_domain: light
        action_type: turn_off
        max_retries: 10
        base_delay: 5
        max_delay: 60
        backoff_type: simple
        notify_on_failure: true
        notify_service: notify.duncan
        target_state: 'off'
        entity_id: light.bad_nachtlicht
        service_data:
          transition: 0.25
  mode: restart
- id: '1730294194772'
  alias: Aqara H1 EU Decoupled Switch Right
  description: "## Aqara H1 EU Decoupled Switch Right  \n\nThis automation manages
    the **Aqara H1 EU Decoupled Switch (right button)**.  \nIt toggles the **Gerade
    switch** when the right button is pressed under specific conditions.  \n\n###
    Key Features:\n- **Trigger**:  \n  Fired when the **single_right** action event
    from the Aqara H1 EU switch is detected.  \n\n- **Conditions**:  \n  1. The switch
    must be in **decoupled mode** (`select.duncan_lichtschalter_operation_mode_right`).
    \ \n  2. A **10-second cooldown** prevents the automation from retriggering too
    quickly.  \n\n- **Action**:  \n  Toggles the state of the **Gerade switch** (`switch.duncan_lichtschalter_right`).
    \ \n\n### Purpose:  \nThis automation allows the right button of the Aqara H1
    EU switch to independently control the **Gerade switch**, while enforcing a cooldown
    to avoid rapid toggling."
  triggers:
  - domain: mqtt
    device_id: adf0a0e198e203d27f9ac23dd706eceb
    type: action
    subtype: single_right
    trigger: device
  conditions:
  - condition: state
    entity_id: select.duncan_lichtschalter_operation_mode_right
    state: decoupled
  - condition: template
    value_template: '{{ now() - (state_attr(this.entity_id, ''last_triggered'') |
      default( as_datetime(''0''), true)) > timedelta(seconds=10) }}'
  actions:
  - action: switch.toggle
    metadata: {}
    data: {}
    target:
      entity_id:
      - switch.duncan_lichtschalter_right
  mode: single
- id: '1730367818444'
  alias: VW Unlocked Reminder
