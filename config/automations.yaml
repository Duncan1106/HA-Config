    - sensor.light_brighness
    below: 40
    id: Off_below_40
  - trigger: numeric_state
    entity_id:
    - sensor.light_brighness
    above: 29
    id: On_above_29
  - trigger: numeric_state
    entity_id:
    - sensor.light_brighness
