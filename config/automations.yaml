        trigger.from_state.state }} km auf {{ trigger.to_state.state }} km gesunken.
      data:
        tag: renault_zoe_kommt_heim
  mode: single
- id: '1754244024626'
  alias: Disable Prompt Tone & Display Air Conditioner
  description: Keeps the air conditioner's prompt tone and screen display disabled.
