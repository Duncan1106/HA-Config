- id: '1736353991047'
  alias: Papa kommt heim
  description: 'Notify when Stephan leaves work, enters the home area, and clear the
    alert on arrival. Steps: restart iCloud3, locate device, send ETA notification,
    then clear on home entry.'
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.wvgzzze2zpe005371_vehicle_moving
    from:
    to: 'on'
    id: Arbeit
  - trigger: zone
    entity_id: person.stephan
    zone: zone.big_home_2
    event: enter
    id: Enter
  - trigger: zone
    entity_id: person.stephan
    zone: zone.home
    event: enter
    id: Home
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: person.stephan
      state: Arbeit
    - condition: state
      entity_id: person.stephan
      state: not_home
    - condition: state
      entity_id: person.stephan
      state: home
  actions:
  - choose:
    - conditions:
      - condition: and
        conditions:
        - condition: or
          conditions:
          - condition: time
            before: '18:30:00'
            after: '17:00:00'
            weekday:
            - thu
            - wed
            - tue
            - mon
          - condition: time
            before: '16:00:00'
            after: '13:00:00'
            weekday:
            - fri
        - condition: trigger
          id:
          - Arbeit
        - condition: not
          conditions:
          - condition: time
            after: '17:59:30'
            before: '18:00:30'
      sequence:
      - action: icloud3.action
        metadata: {}
        data:
          command: Restart iCloud3
          device_name: 3675fe049f5a257fe6eebb6533252e74
      - delay:
          hours: 0
          minutes: 0
          seconds: 15
          milliseconds: 0
      - action: icloud3.action
        metadata: {}
        data:
          command: Locate Device(s) using iCloud
          device_name: 3675fe049f5a257fe6eebb6533252e74
      - delay:
          hours: 0
          minutes: 0
          seconds: 30
          milliseconds: 0
      - action: notify.duncan
        metadata: {}
        data:
          title: Papa kommt heim
          message: Er ist in {{ states('sensor.stephans_iphone_travel_time', with_unit=true)
            }} daheim
          data:
            tag: home_arrival_papa
      alias: Leave Arbeit
    - conditions:
      - condition: trigger
        id:
        - Enter
      sequence:
      - action: notify.duncan
        metadata: {}
        data:
          title: Papa kommt heim
          message: Er ist in {{ states('sensor.stephans_iphone_travel_time', with_unit=true)
            }} daheim
          data:
            tag: home_arrival_papa
    - conditions:
      - condition: trigger
        id:
        - Home
      sequence:
      - action: notify.duncan
        metadata: {}
        data:
          message: clear_notification
          data:
            tag: home_arrival_papa
  mode: single
- id: '1737030430090'
  alias: Calculate PV Savings
  description: Calculates daily photovoltaic savings/costs by subtracting various
    energy cost sensors from a total PV cost input number, logs the daily summary
    to a file, and uploads it to OneDrive.
  triggers:
  - trigger: sun
    event: sunrise
    offset: 0
    id: Sunrise
  - trigger: sun
    event: sunset
    offset: 0
    id: Sunset
  - trigger: time
    at: '23:59:57'
    id: Dayend
  conditions: []
  actions:
  - alias: DAYEND
    if:
    - condition: trigger
      id:
      - Dayend
    then:
    - sequence:
      - action: input_number.set_value
        metadata: {}
        data:
          value: '{{ (states(''input_number.gesamte_pv_kosten'') | float(0)) }}'
        target:
          entity_id: input_number.before_gesamt_pv_kosten
      - delay:
          hours: 0
          minutes: 0
          seconds: 0.1
      - action: input_number.set_value
        metadata: {}
        data:
          value: '{{ (states(''input_number.gesamte_pv_kosten'') | float(0)) - (states(''sensor.inverter_total_battery_discharge_daily_energy_cost'')
            | float(0)) }}'
        target:
          entity_id: input_number.gesamte_pv_kosten
      - delay:
          hours: 0
          minutes: 0
          seconds: 0.1
      - action: input_number.set_value
        metadata: {}
        data:
          value: '{{ (states(''input_number.gesamte_pv_kosten'') | float(0)) - (states(''sensor.daily_money_generated_solar'')
            | float(0)) }}'
        target:
          entity_id: input_number.gesamte_pv_kosten
      - delay:
          hours: 0
          minutes: 0
          seconds: 0.1
      - action: input_number.set_value
        metadata: {}
        data:
          value: '{{ (states(''input_number.gesamte_pv_kosten'') | float(0)) - (states(''sensor.bkw_outlet_1_total_daily_energy_cost'')
            | float(0)) }}'
        target:
          entity_id: input_number.gesamte_pv_kosten
      - delay:
          hours: 0
          minutes: 0
          seconds: 0.1
      - action: input_number.set_value
        metadata: {}
        data:
          value: '{{ (states(''input_number.gesamte_pv_kosten'') | float(0)) - (states(''sensor.solar_to_home_daily_energy_cost'')
            | float(0)) }}'
        target:
          entity_id: input_number.gesamte_pv_kosten
      - delay:
          hours: 0
          minutes: 0
          seconds: 0.1
      - action: input_number.set_value
        metadata: {}
        data:
          value: '{{ (states(''input_number.gesamte_pv_kosten'') | float(0)) - (states(''sensor.battery_charge_from_solar_daily_energy_cost'')
            | float(0)) }}'
        target:
          entity_id: input_number.gesamte_pv_kosten
      - delay:
          hours: 0
          minutes: 0
          seconds: 0.1
      - target:
          entity_id: notify.file
        data:
          message: '{{ as_timestamp(now()) | timestamp_custom(''%d.%m.%Y %H:%M'')
            }}; {{ states(''sensor.solar_to_home_daily_energy_cost'')|round(4)|string
            + " EUR"}}; {{states(''sensor.inverter_total_battery_discharge_daily_energy_cost'')|round(4)|string
            + " EUR"}}; {{ states(''sensor.daily_money_generated_solar'')|round(4)|string
            + " EUR"}}; {{ states(''sensor.bkw_outlet_1_total_daily_energy_cost'')|round(4)|string
            + " EUR"}}; {{states(''sensor.battery_charge_from_solar_daily_energy_cost'')|round(4)|string
            + " EUR"}}; {{ states(''sensor.gesamt_kosten_pv'') + " EUR"}}'
        action: notify.send_message
      - delay:
          hours: 0
          minutes: 0
          seconds: 0.1
      - action: input_number.set_value
        metadata: {}
        data:
          value: '{{ (states(''input_number.gesamte_pv_kosten'') | float(0)) }}'
        target:
          entity_id: input_number.after_gesamt_pv_kosten
      - delay:
          hours: 0
          minutes: 0
          seconds: 3
          milliseconds: 0
      - action: onedrive.upload
        metadata: {}
        data:
          config_entry_id: 01JTPDVP94GTDT06DCHRQGX7BC
          filename: /media/Gesamt_Kosten.csv
          destination_folder: /Media/
  mode: single
