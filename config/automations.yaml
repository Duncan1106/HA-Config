    - condition: sun
      before: sunset
      after: sunrise
      after_offset: +00:30:00
    then:
    - metadata: {}
      data: {}
      action: script.terra_sunrise
    enabled: false
  - alias: Off Sunset
    if:
    - condition: trigger
      id:
      - 'Off'
    - condition: sun
      before: sunset
      before_offset: -01:00:00
      after: sunset
      after_offset: +01:00:00
    then:
    - data: {}
      action: script.terra_sunset
    enabled: false
  - alias: Daytime
    if:
    - condition: and
      conditions:
      - condition: sun
        after: sunrise
        before: sunset
        before_offset: -01:00:00
        after_offset: +01:00:00
      - condition: state
        entity_id: input_boolean.terrarium_on
        state: 'on'
      - condition: trigger
        id:
        - '1'
      enabled: true
    then:
    - if:
      - condition: state
        entity_id: binary_sensor.luftbefeuchter_on_over_day
        state: 'on'
        for:
          hours: 0
          minutes: 1
          seconds: 0
      then:
      - data: {}
        action: script.luftbefeuchter
      alias: Luftbefeuchter
    - data: {}
      action: script.warmelampe
