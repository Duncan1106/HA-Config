- id: '1728376825897'
  alias: Bad Nachtlicht Motion
  description: Controls the bathroom night light based on motion and ambient light
    levels, turning it on when dark and motion is detected, and off when motion stops
    or it gets bright. Includes a visual cue if motion stops in the dark.
  triggers:
  - entity_id:
    - sensor.bad_nachtlicht_illuminance
    below: 9
    id: 'On'
    trigger: numeric_state
    enabled: true
  - trigger: state
    entity_id:
    - binary_sensor.kinderbad_bewegung
    to: 'on'
    from: 'off'
    id: 'On'
  - trigger: state
    entity_id:
    - binary_sensor.kinderbad_bewegung
    to: 'off'
    from: 'on'
    id: 'Off'
    for:
      hours: 0
      minutes: 0
      seconds: 30
  - trigger: state
    entity_id:
    - binary_sensor.kinderbad_bewegung
    to: 'off'
    from:
    id: 'Off'
    for:
      hours: 0
      minutes: 1
      seconds: 0
  - entity_id:
    - sensor.bad_nachtlicht_illuminance
    id: Off immediately
    trigger: numeric_state
    enabled: true
    above: 25
  - entity_id:
    - sensor.bad_nachtlicht_illuminance
    id: Off immediately
    trigger: numeric_state
    enabled: true
    above: 50
  conditions: []
  actions:
  - alias: 'On'
    if:
    - condition: and
      conditions:
      - condition: and
        conditions:
        - condition: trigger
          id:
          - 'On'
        - condition: numeric_state
          entity_id: sensor.bad_nachtlicht_illuminance
          below: 20
        - condition: state
          entity_id: binary_sensor.kinderbad_bewegung
          state: 'on'
      - condition: or
        conditions:
        - condition: state
          entity_id: light.bad_nachtlicht
          state: 'off'
        - condition: template
          value_template: '{{ state_attr(''light.bad_nachtlicht'',''brightness'')|int(0)
            < 10 }}'
    then:
    - action: light.turn_on
      metadata: {}
      data:
        brightness_pct: 100
        transition: 1
        color_temp_kelvin: 2400
      target:
        entity_id: light.bad_nachtlicht
  - alias: Off after time x
    if:
    - condition: trigger
      id:
      - 'Off'
    then:
    - delay:
        hours: 0
        minutes: 0
        seconds: 30
        milliseconds: 0
    - if:
      - condition: numeric_state
        entity_id: sensor.bad_nachtlicht_illuminance
        above: 10
      then:
      - repeat:
          sequence:
          - action: light.turn_off
            metadata: {}
            data: {}
            target:
              entity_id: light.bad_nachtlicht
          - delay:
              hours: 0
              minutes: 0
              seconds: 0
              milliseconds: 500
          until:
          - condition: state
            entity_id: light.bad_nachtlicht
            state: 'off'
      else:
      - repeat:
          sequence:
          - action: light.turn_on
            metadata: {}
            data:
              transition: 1
              color_temp_kelvin: 2400
              brightness: 9
            target:
              entity_id: light.bad_nachtlicht
          - delay:
              hours: 0
              minutes: 0
              seconds: 0
              milliseconds: 500
          until:
          - condition: template
            value_template: '{{ state_attr(''light.bad_nachtlicht'',''brightness'')|int(0)
              == 9 }}'
    enabled: true
  - alias: Off immediately
    if:
    - condition: trigger
      id:
      - Off immediately
    then:
    - repeat:
        sequence:
        - action: light.turn_off
          metadata: {}
          data: {}
          target:
            entity_id: light.bad_nachtlicht
        - delay:
            hours: 0
            minutes: 0
            seconds: 0
            milliseconds: 500
        until:
        - condition: state
          entity_id: light.bad_nachtlicht
          state: 'off'
  mode: restart
