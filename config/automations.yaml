- id: '1705389061375'
  alias: Homeassistent Start & Stop
  description: "## \U0001F504 Home Assistant Start & Stop Automation\n\n### \U0001F4CB
    Purpose\nMonitors Home Assistant startup and shutdown events, sends notifications,
    \nrestarts backup add-ons, and locates iCloud devices to ensure the system \nand
    critical backups are always operational.\n\n---\n\n### ⏱ Triggers\n- `homeassistant.start`:
    Fires when Home Assistant starts.\n- `homeassistant.shutdown`: Fires when Home
    Assistant stops.\n\n---\n\n### ✅ Conditions\n- None. Actions execute unconditionally
    based on the trigger.\n\n---\n\n### \U0001F3AF Actions / Workflow\n\n#### Startup
    Actions\n- Wait 30 seconds.\n- Notify user that Home Assistant is online including
    the local IP and port.\n- Restart key backup add-ons:\n  - `hassio_onedrive_backup`\n
    \ - `hassio_google_drive_backup`\n- Wait 1 minute.\n- Locate iCloud devices sequentially
    with 15-second delay between devices.\n\n#### Shutdown Actions\n- Notify user
    that Home Assistant is down.\n- Include uptime duration in notification using
    `sensor.uptime`.\n\n---\n\n### \U0001F527 Technical Specs\n- Mode: `single` to
    prevent overlapping execution.\n- Notifications use icon: `mdi:restart`.\n- iCloud
    device identifiers:\n  - `3675fe049f5a257fe6eebb6533252e74`\n  - `e146d7ea7dd792848fa6d8090a91ff6c`"
  triggers:
  - event: start
    id: Start
    trigger: homeassistant
  - event: shutdown
    id: Stop
    trigger: homeassistant
  conditions: []
  actions:
  - alias: Start
    if:
    - condition: trigger
      id:
      - Start
    then:
    - delay:
        hours: 0
        minutes: 0
        seconds: 30
        milliseconds: 0
    - metadata: {}
      data:
        title: Homeassistent is Up
        message: Homeassistant is online and reachable at http://{{ states('sensor.local_ip')
          }}:8123
        data:
          notification_icon: mdi:restart
          tag: ha_start
      action: notify.duncan
    - action: homeassistant.reload_config_entry
      metadata: {}
      data: {}
      target:
        device_id: 888e1a1c64b67f6233d2487f81fdb6a1
    - action: homeassistant.reload_config_entry
      metadata: {}
      data: {}
      target:
        device_id: 8d93cc1ec24be9b80935c68d04f8549f
    - delay:
        hours: 0
        minutes: 1
        seconds: 0
        milliseconds: 0
    - action: icloud3.action
      metadata: {}
      data:
        command: Locate Device(s) using iCloud
        device_name: 3675fe049f5a257fe6eebb6533252e74
    - action: icloud3.action
      metadata: {}
      data:
        command: Locate Device(s) using iCloud
        device_name: e146d7ea7dd792848fa6d8090a91ff6c
  - alias: Stop
    if:
    - condition: trigger
      id:
      - Stop
    then:
    - metadata: {}
      data:
        title: Homeassistent is Down
        message: 'Homeassistant was up for: {{ time_since( as_datetime(states(''sensor.uptime'')),
          2)}}'
        data:
          notification_icon: mdi:restart
          tag: ha_stop
      action: notify.duncan
  mode: single
