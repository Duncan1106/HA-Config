      alias: Treppenlicht LED ON
    - conditions:
      - condition: trigger
        id:
        - start
        - Off_below_30
      - condition: numeric_state
        entity_id: sensor.light_brighness
        below: 30
      sequence:
      - action: script.retry_action_with_backoff
        continue_on_error: true
        metadata: {}
        data:
          action_domain: switch
          action_type: turn_off
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: linear
          notify_on_failure: true
          notify_service: notify.duncan
