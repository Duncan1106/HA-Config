        tag: beta_release_summary
  mode: single
- id: '1762188975423'
  alias: Plant Light Control via Retry Script
  description: "## \U0001F305\U0001F307 **Plant Light Control with Reliable Retry
    Logic**\n\nThis automation intelligently manages the **plant grow lights** throughout
    the day, ensuring dependable operation even if a switch command initially fails.
    \  It leverages the **Retry Action with Backoff** script to repeatedly attempt
    each state change until success, with exponential retry delays for resilience.\n\n###
    \U0001F553 **Schedule Overview**\n\n- **\U0001F305 Sunrise:** Turns **all configured
    lights ON**, providing early light exposure.   \n- **\U0001F307 Sunset:** Turns
    **all lights OFF**, simulating natural daylight cycles.\n\n- **\U0001F6AB Manual
    ON after hours:** Turn **OFF** the plant lights if accidentally turned on after
    the configured hours,  preventing the plants from getting their earned rest/dark
    period\n\n### ⚙️ **Reliability Features**\n\nEach light entity is processed individually
    with up to **5 retry attempts**,   using a **5-second exponential backoff** between
    attempts to guarantee the final desired state is reached.\n\n--- \n\n*Entities
    managed:*  \n\n\n  - `switch.bett_strip_l4`\n\n  - `switch.plant_box`\n  \n  -
    `switch.plant_tent`\n\n  - `switch.wintergarten_plant_light`(disabled)\n\n*Paludarien
    managed:*\n\n\n  - `switch.bett_strip_l3`\n  \n  - `switch.kallax_plant_light_zigbee_l3`\n
    \ \n  - `switch.kallax_plant_light_zigbee_l2`\n  \n  - `switch.regal_planzen_1`\n\n
    \ - `switch.schreibtisch_links_power_strip_l1`\n\n  - `switch.schreibtisch_rechts_power_strip_l5`\n\n
    \ "
  triggers:
  - trigger: sun
    event: sunrise
    id: sunrise
    offset: +00:15:00
  - trigger: sun
    event: sunset
    id: sunset
    offset: +00:15:00
  - trigger: state
    entity_id:
    - switch.plant_tent
    to:
    - 'on'
    for:
      hours: 0
      minutes: 2
      seconds: 0
    id: switch.plant_tent
  - trigger: state
    entity_id:
    - switch.bett_strip_l4
    to:
    - 'on'
    for:
      hours: 0
      minutes: 1
      seconds: 0
    id: switch.bett_strip_l4
  - trigger: state
    entity_id:
    - switch.plant_box
    to:
    - 'on'
    for:
      hours: 0
      minutes: 1
      seconds: 0
    id: switch.plant_box
  - trigger: state
    entity_id:
    - switch.wintergarten_plant_light
    to:
    - 'on'
    for:
      hours: 0
      minutes: 1
      seconds: 0
    id: switch.wintergarten_plant_light
  actions:
  - variables:
      entities:
      - switch.bett_strip_l4
      - switch.plant_box
      - switch.plant_tent
      disabled:
      - switch.wintergarten_plant_light
      paludarium:
      - switch.bett_strip_l3
      - switch.kallax_plant_light_zigbee_l3
      - switch.kallax_plant_light_zigbee_l2
      - switch.regal_planzen_1
      - switch.schreibtisch_links_power_strip_l1
      - switch.schreibtisch_rechts_power_strip_l5
      - switch.kallax_plant_light_zigbee_l1
  - choose:
    - conditions:
      - condition: trigger
        id: sunrise
      sequence:
      - repeat:
          for_each: '{{ entities }}'
          sequence:
          - action: script.retry_action_with_backoff
            continue_on_error: true
            data:
              entity_id: '{{ repeat.item }}'
              target_state: 'on'
              action_domain: switch
              action_type: turn_on
              max_retries: 5
              base_delay: 5
              backoff_type: exponential
              notify_on_failure: true
              notify_service: notify.duncan
