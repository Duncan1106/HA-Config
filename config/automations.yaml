- id: '1751542900177'
  alias: Rollo Sommer Automatisch Steuern (mit Grund und Manueller Modus)
  description: "## \U0001F31E Rollo Sommer Automatisch Steuern (mit Grund und Manueller
    Modus)\n\n### \U0001F4CB Purpose\nAutomates the summer operation of the Wintergarten
    (sunroom) roller shutter\nbased on sensor readings, while also handling manual
    override mode. Provides\nnotifications with the reason for opening/closing and
    status updates when\nmanual mode is activated or deactivated.\n\n---\n\n### ⏰
    Triggers\n- Sensor indicates roller should close (`on`) for 10 minutes\n- Sensor
    indicates roller should open (`off`) for 15 minutes\n- Manual override boolean
    toggled (`on` or `off`)\n- Sensor attribute `not_raining` changes to `0` for 1
    minute\n\n---\n\n### ✅ Conditions\n- Only runs during daytime (between sunrise
    and sunset)\n- Roller must not already be in the desired state (open/closed)\n\n---\n\n###
    \U0001F3AF Actions / Workflow\n- **Rollo schließen:** Closes roller and sends
    notification with reason\n- **Rollo öffnen:** Opens roller and sends notification
    with reason\n- **Manual Mode Activated:** Sends notification and clears automatic
    mode alerts\n- **Manual Mode Deactivated:** Sends notification and clears manual
    mode alerts\n\n---\n\n### \U0001F527 Technical Specs\n- **Mode:** `single` (prevents
    overlapping executions)\n- Uses `cover.open_cover` / `cover.close_cover` to control
    roller\n- Notifications are tagged (`rollo_close`, `rollo_open`, `rollo_manual`,
    `rollo_automatic`) for tracking"
  triggers:
  - trigger: state
    id: rollo_close
    entity_id:
    - binary_sensor.rollo_summer_should_close
    to: 'on'
    for:
      hours: 0
      minutes: 10
      seconds: 0
  - trigger: state
    id: rollo_open
    entity_id:
    - binary_sensor.rollo_summer_should_close
    to: 'off'
    for:
      hours: 0
      minutes: 15
      seconds: 0
  - trigger: state
    id: manual_on
    entity_id: input_boolean.rollo_summer_override
    to: 'on'
  - trigger: state
    id: manual_off
    entity_id: input_boolean.rollo_summer_override
    to: 'off'
  - trigger: state
    entity_id:
    - binary_sensor.rollo_summer_should_close
    attribute: not_raining
    to: '0'
    id: rollo_open
    for:
      hours: 0
      minutes: 1
      seconds: 0
  conditions:
  - condition: sun
    before: sunset
    after: sunrise
  actions:
  - choose:
    - alias: Rollo schließen
      conditions:
      - condition: trigger
        id: rollo_close
      - condition: state
        entity_id: input_boolean.rollo_summer_override
        state: 'off'
      - condition: not
        conditions:
        - condition: state
          entity_id: cover.wintergarten_rolladen_dachfenster
          state: closed
      sequence:
      - action: cover.close_cover
        target:
          entity_id: cover.wintergarten_rolladen_dachfenster
        data: {}
      - action: notify.duncan
        data:
          data:
            tag: rollo_close
          message: '☀️ wird geschlossen: {{ state_attr(''binary_sensor.rollo_summer_should_close'',
            ''reason'') or ''Kein Grund angegeben.'' }}

            '
          title: Rollo
    - alias: Rollo öffnen
      conditions:
      - condition: trigger
        id: rollo_open
      - condition: state
        entity_id: input_boolean.rollo_summer_override
        state: 'off'
      - condition: not
        conditions:
        - condition: state
          entity_id: cover.wintergarten_rolladen_dachfenster
          state: open
      sequence:
      - action: cover.open_cover
        target:
          entity_id: cover.wintergarten_rolladen_dachfenster
        data: {}
      - action: notify.duncan
        data:
          data:
            tag: rollo_open
          message: "\U0001F324️ wird geöffnet: {{ state_attr('binary_sensor.rollo_summer_should_close',
            'reason') or 'Kein Grund angegeben.' }}\n"
          title: Rollo
    - alias: Manueller Modus aktiviert
      conditions:
      - condition: trigger
        id: manual_on
      sequence:
      - action: notify.duncan
        data:
          data:
            tag: rollo_manual
          message: "\U0001F6D1 Rollo: Manueller Modus aktiviert"
          title: Rollo Mode
      - action: notify.duncan
        metadata: {}
        data:
          message: clear_notification
          data:
            tag: rollo_automatic
    - alias: Manueller Modus deaktiviert
      conditions:
      - condition: trigger
        id: manual_off
      sequence:
      - action: notify.duncan
        data:
          data:
            tag: rollo_automatic
          message: '✅ Rollo: Automatikmodus wieder aktiv'
          title: Rollo Mode
      - action: notify.duncan
        metadata: {}
        data:
          message: clear_notification
          data:
            tag: rollo_manual
  mode: single
- id: '1751548094070'
  alias: Poco F7 Request Location with Retry and Final Notification
  description: This automation ensures accurate location tracking for Duncan by repeatedly
    requesting location updates from his Poco F7 when he is not home or his location
    is unknown/unavailable. If updates fail after multiple attempts, it sends a notification
    to manually update the location.
  triggers:
  - event: start
    trigger: homeassistant
  - entity_id: person.duncan
    to:
    - not_home
    - unavailable
    - unknown
    trigger: state
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: person.duncan
      state: not_home
    - condition: state
      entity_id: person.duncan
      state: unavailable
    - condition: state
      entity_id: person.duncan
      state: unknown
  actions:
  - repeat:
      until:
      - condition: or
        conditions:
        - condition: not
          conditions:
          - condition: or
            conditions:
            - condition: state
              entity_id: person.duncan
              state: not_home
            - condition: state
              entity_id: person.duncan
              state: unavailable
            - condition: state
              entity_id: person.duncan
              state: unknown
        - condition: template
          value_template: '{{ repeat.index >= 10 }}'
      sequence:
      - action: notify.mobile_app_poco_f7
        data:
          message: request_location_update
      - delay:
          hours: 0
          minutes: 2
          seconds: 0
          milliseconds: 0
  - if:
    - condition: or
      conditions:
      - condition: state
        entity_id: person.duncan
        state: not_home
      - condition: state
        entity_id: person.duncan
        state: unavailable
      - condition: state
        entity_id: person.duncan
        state: unknown
    then:
    - action: notify.mobile_app_poco_f7
      data:
        title: Location update failed
        message: 'Please open the Home Assistant app on your Poco F7 to update your
          location manually.

          '
  mode: single
- id: '1752180300729'
  alias: 'Alert: SMART Status Problem'
  description: "## \U0001F4BE SMART Drive Status Alert Automation\n\n### \U0001F4CB
    Purpose\nMonitors the health of your storage devices (HDDs and SSDs) via SMART
    status.\nSends an immediate notification if any monitored drive reports a potential\nproblem,
    allowing timely intervention before data loss occurs.\n\n---\n\n### ⏰ Triggers\n-
    State change of `binary_sensor.sata_ssd_status` to `on`\n- State change of `binary_sensor.nvme_ssd_status`
    to `on`\n\n---\n\n### ✅ Conditions\n- None. Alerts are sent unconditionally upon
    trigger.\n\n---\n\n### \U0001F3AF Actions / Workflow\n- Sends a high-priority
    notification via `notify.duncan`\n- Notification includes:\n  - Drive friendly
    name from the triggered entity\n  - Clear warning about potential data loss\n
    \ - Suggestion to back up data and check the drive immediately\n- Notification
    metadata includes `tag: hdd_alert`, `priority: high`, and `ttl: 0`\n\n---\n\n###
    \U0001F527 Technical Specs\n- Mode: `single` to prevent overlapping alerts\n-
    Works for multiple drives with identical logic"
  triggers:
  - entity_id:
    - binary_sensor.sata_ssd_status
    to: 'on'
    trigger: state
  - entity_id:
    - binary_sensor.nvme_ssd_status
    to: 'on'
    trigger: state
  conditions: []
  actions:
  - action: notify.duncan
    data:
      title: 'CRITICAL: SMART Status Problem!'
      message: The SMART status of {{ state_attr(trigger.entity_id, 'friendly_name')
        }} is reporting a problem. Data loss may occur soon. Consider backing up data
        and checking the drive immediately!
      data:
        tag: hdd_alert
        priority: high
        ttl: 0
  mode: single
