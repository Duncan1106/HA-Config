- id: '1740690228362'
  alias: UPS, on battery -> Stop Non necessary services
  description: "## ⚡ **UPS Power State Management**\n\n### \U0001F4CB Intelligent
    Power Conservation Control\n\nThis automation monitors the operational status
    of the primary UPS system to manage energy consumption during power outages. Its
    primary intent is to extend battery runtime by shedding non-essential software
    loads when utility power is lost and restoring services once the system returns
    to an online state.\n\nThe operational strategy follows a **resource-preservation**
    approach, immediately halting high-performance or non-critical add-ons to reduce
    the discharge rate on the UPS batteries.\n\n---\n\n### Trigger Overview Table\n\n|
    Type | Entity / Condition | ID | Purpose |\n| :--- | :--- | :--- | :--- |\n| **State**
    | `sensor.ups0_status` | N/A | Detects when the UPS switches from utility power
    to battery. |\n| **State** | `sensor.ups0_status` | N/A | Detects when utility
    power is restored and the UPS is **Online**. |\n\n---\n\n### Operational Logic
    Sections\n\n#### Outage / Battery Mode\n* **Purpose**: Maximize UPS battery longevity
    during a power failure.\n* **Logic Overview**: Triggered when **sensor.ups0_status**
    is no longer **Online**. \n* **Effect**: \n    * Stops **Frigate** (NVR/AI processing).\n
    \   * Stops **Ankerctl**.\n\n#### Power Restored Mode\n* **Purpose**: Restore
    full system functionality once stable power is available.\n* **Logic Overview**:
    Triggered when **sensor.ups0_status** returns to the **Online** state.\n* **Effect**:
    \n    * Starts **Frigate**.\n    * Starts **Ankerctl**.\n\n---\n\n### Technical
    Overview\n\n* **Automation Mode**: `single`\n* **Execution Method**: Direct Home
    Assistant Supervisor Service Calls (`hassio.addon_start`, `hassio.addon_stop`).\n*
    **Key Inputs**: `sensor.ups0_status`.\n* **Controlled Entities**: \n    * `addon_ccab4aaf_frigate-fa`
    (Frigate)\n    * `addon_cff83567_ankerctl` (Ankerctl)\n* **Safety Mechanisms**:
    Logical `OR` condition gate ensures the automation only proceeds if a definitive
    state change to or from **Online** is confirmed.\n\n---\n\n### \U0001F4A1 Notes\n\n*
    **Load Shedding**: By stopping **Frigate**, the system significantly reduces CPU/GPU
    utilization, which is typically the highest contributor to power draw in Home
    Assistant environments.\n* **State Consistency**: The use of a `choose` block
    ensures that the system always synchronizes the add-on states with the current
    UPS status, preventing services from remaining offline after power restoration."
  triggers:
  - trigger: state
    entity_id:
    - sensor.ups0_status
    to: Online
  - trigger: state
    entity_id:
    - sensor.ups0_status
    from: Online
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: sensor.ups0_status
      state: Online
      alias: Ups Online
    - condition: not
      conditions:
      - condition: state
        entity_id: sensor.ups0_status
        state: Online
      alias: Ups not Online
  actions:
  - choose:
    - conditions:
      - condition: not
        conditions:
        - condition: state
          entity_id: sensor.ups0_status
          state: Online
        alias: Ups not Online
      sequence:
      - sequence:
        - action: hassio.addon_stop
          metadata: {}
          data:
            addon: ccab4aaf_frigate-fa
        - action: hassio.addon_stop
          metadata: {}
          data:
            addon: cff83567_ankerctl
    - conditions:
      - condition: state
        entity_id: sensor.ups0_status
        state: Online
        alias: Ups Online
      sequence:
      - sequence:
        - action: hassio.addon_start
          metadata: {}
          data:
            addon: ccab4aaf_frigate-fa
        - action: hassio.addon_start
          metadata: {}
          data:
            addon: cff83567_ankerctl
      alias: Ups Back Online
  mode: single
- id: '1740741927183'
  alias: Turn off Trockner or Waschmaschine fertig using Button
  description: "\n  ## \U0001F9FA Laundry Reset Automation\n\n  ### \U0001F4CB **Clear
    Appliance Completion States via Button Press**\n\n  This automation resets the
    *completion status* of either the dryer (`input_boolean.trockner_fertig`) or the
    washing machine (`input_boolean.waschmaschine_fertig`) whenever their assigned
    button is pressed.  \n  It ensures that once the laundry is removed and the user
    acknowledges it by pressing the button, the “done” indicator is turned off to
    keep appliance status tracking accurate.\n\n  ---\n\n  ### ⏰ **Triggers**\n\n
    \ | Device / Button | Action Type | Appliance | Trigger ID |\n  |-----------------|-------------|-----------|-------------|\n
    \ | `button_1` | Single / Double Press | Dryer | `Trockner` |\n  | `button_2`
    | Single / Double Press | Washing Machine | `Waschmaschine` |\n\n  > Each appliance
    can be reset with **either a single or double press** on its assigned button.\n\n
    \ ---\n\n  ### ✅ **Conditions**\n\n  - The chosen appliance must currently have
    its completion flag set:\n    - Dryer → `input_boolean.trockner_fertig = on`\n
    \   - Washing Machine → `input_boolean.waschmaschine_fertig = on`\n\n  If the
    appliance is *not* marked as finished, the press does nothing.\n\n  ---\n\n  ###
    \U0001F3AF **Actions / Workflow**\n\n  1. **Dryer Reset**\n     - Triggered by
    `Trockner` button.\n     - If `input_boolean.trockner_fertig = on`, turn it off.\n\n
    \ 2. **Washing Machine Reset**\n     - Triggered by `Waschmaschine` button.\n
    \    - If `input_boolean.waschmaschine_fertig = on`, turn it off.\n\n  > Both
    paths ensure the completion indicator is cleared only when appropriate.\n\n  ---\n\n
    \ ### \U0001F527 **Technical Specs**\n\n  - **Mode:** `single` (no overlapping
    runs).\n  - **Controlled Entities:**\n    - `input_boolean.trockner_fertig`\n
    \   - `input_boolean.waschmaschine_fertig`\n  - **Input Device:**  \n    - MQTT
    button with two mapped sub-buttons (dryer / washer).\n\n  ---\n\n  ### \U0001F4DD
    **Notes**\n\n  - The automation supports both *single* and *double* presses for
    convenience.  \n  - Prevents stale “done” states if a cycle has already been cleared.
    \ \n  - Keeps laundry task tracking consistent across appliances."
  triggers:
  - domain: mqtt
    device_id: 7be1308679cc0cfa3cc595fe650e29ed
    type: action
    subtype: button_1_single
    metadata: {}
    trigger: device
    id: Trockner
    alias: Trockner
  - alias: Trockner
    domain: mqtt
    device_id: 7be1308679cc0cfa3cc595fe650e29ed
    type: action
    subtype: button_1_double
    trigger: device
    id: Trockner
  - domain: mqtt
    device_id: 7be1308679cc0cfa3cc595fe650e29ed
    type: action
    subtype: button_2_single
    trigger: device
    id: Waschmaschine
    alias: Waschmaschine
  - alias: Waschmaschine
    domain: mqtt
    device_id: 7be1308679cc0cfa3cc595fe650e29ed
    type: action
    subtype: button_2_double
    trigger: device
    id: Waschmaschine
  - trigger: numeric_state
    entity_id:
    - sensor.trockner_lauft_seit
    above: 5
    id: Waschmaschine
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Trockner
      - condition: state
        entity_id: input_boolean.trockner_fertig
        state: 'on'
      sequence:
      - action: input_boolean.turn_off
        metadata: {}
        data: {}
        target:
          entity_id: input_boolean.trockner_fertig
      alias: Trockner
    - conditions:
      - condition: trigger
        id:
        - Waschmaschine
      - condition: state
        state: 'on'
        entity_id: input_boolean.waschmaschine_fertig
      sequence:
      - action: input_boolean.turn_off
        metadata: {}
        data: {}
        target:
          entity_id:
          - input_boolean.waschmaschine_fertig
      alias: Waschmaschine
  mode: single
- id: '1741093435280'
  alias: Set Herd CT Clamp Update Frequency at Startup and every 8 Hours
  description: "## ⚡ Herd CT Clamp Update Frequency Control\n\n### \U0001F4CB Purpose\nKeeps
    the Herd CT clamp sensor (`number.herd_ct_klemme_zigbee_update_frequency`) configured
    to a **20-second update interval**, ensuring reliable and consistent reporting
    of current measurements.\n\n---\n\n### ⏱ Triggers\n- **Home Assistant startup**
    → sets frequency after system boots.\n- **Every 8 hours** → re-applies frequency
    setting for robustness (e.g., if device resets).\n- **Entity state change** →
    immediately re-applies the correct frequency if the value is modified manually
    or by other automations.\n\n---\n\n### ✅ Conditions\n- Only when not at 20\n\n---\n\n###
    \U0001F3AF Actions\n- Waits **5 seconds** after trigger to ensure the entity is
    initialized and ready.  \n- Calls `number.set_value` on `number.herd_ct_klemme_zigbee_update_frequency`
    to enforce the configured interval (value: `20` → corresponds to 20s updates).\n\n---\n\n###
    \U0001F527 Technical Notes\n- Mode: `single` → prevents overlapping executions.
    \ \n- The **hourly trigger** ensures long-term stability even if the device silently
    resets its reporting interval.  \n- The **entity state trigger** catches accidental
    or external changes to the setting.  \n- Delay ensures that HA startup doesn’t
    fail if the entity is still initializing."
  triggers:
  - trigger: homeassistant
    event: start
  - trigger: time_pattern
    hours: /8
  - trigger: state
    entity_id:
    - number.herd_ct_klemme_zigbee_update_frequency
  conditions:
  - condition: or
    conditions:
    - condition: numeric_state
      entity_id: number.herd_ct_klemme_zigbee_update_frequency
      above: 20
    - condition: numeric_state
      entity_id: number.herd_ct_klemme_zigbee_update_frequency
      below: 20
  actions:
  - delay:
      hours: 0
      minutes: 0
      seconds: 5
      milliseconds: 0
  - action: number.set_value
    metadata: {}
    data:
      value: '20'
    target:
      entity_id: number.herd_ct_klemme_zigbee_update_frequency
  mode: single
  max_exceeded: silent
- id: '1741102167233'
  alias: Publish Energy Data to MQTT
  description: "**\U0001F4CB Intelligent MQTT Energy Metrics Control**\nThis automation
    periodically evaluates and broadcasts real-time power infrastructure metrics to
    dedicated MQTT topics. It uses an on-demand strategy to transmit updates only
    when active charging infrastructure or specific load monitors are operational,
    optimizing network traffic. Reliability is maintained through aggressive template
    defensive programming, utilizing fallback defaults to ensure consistent payload
    deliveries even during transient sensor unavailability.\n\n---\n\n### Trigger
    Overview\n\n| Type | Entity / Condition | ID | Purpose |\n| :--- | :--- | :---
    | :--- |\n| **Time Pattern** | `seconds: /10` | *N/A* | Evaluates the system state
    every **10 seconds** to check if telemetry criteria are met. |\n\n---\n\n### Operational
    Logic\n\n#### Conditional Telemetry Broadcast\n- **Purpose**: Updates the MQTT
    broker with core energy telemetry during operational periods.\n- **Logic Overview**:
    Requires at least one monitoring entity (**binary_sensor.esp32_c3_mini_goe11_controll_status_11kw**,
    **binary_sensor.esp32_c3_mini_goe22_controll_status_22kw**, or **switch.schreibtisch_links_power_strip_l3**)
    to be **on**. Execution is bounded by a rate-limiting throttle verifying that
    the elapsed time since the last run is greater than or equal to **5 seconds**.\n-
    **Effect**: Updates payloads on topics **grid/power**, **grid/solar**, **grid/battery**,
    and **grid/soc**.\n\n---\n\n### Technical Overview\n\n- **Automation Mode**: **parallel**
    (Maximum concurrent runs: **10**)\n- **Execution Method**: Sequential MQTT publish
    actions (`mqtt.publish`)\n- **Key Inputs**:\n  - **sensor.grid_power**\n  - **sensor.solar_power_total**\n
    \ - **sensor.battery_charge**\n  - **sensor.battery_discharge**\n  - **sensor.felicity_ess_soc_avg**\n
    \ - **sensor.inverter_battery**\n- **Controlled Entities**:\n  - MQTT Topic: `grid/power`\n
    \ - MQTT Topic: `grid/solar`\n  - MQTT Topic: `grid/battery`\n  - MQTT Topic:
    `grid/soc`\n- **Safety Mechanisms**:\n  - **Rate-Limiting Throttle**: A custom
    template condition tracks execution history using `this.entity_id`, acting as
    an explicit safeguard against race conditions or rapid double-triggering.\n  -
    **Type-Casting Guard**: Math filters use a fallback declaration (`| float(0)`)
    to protect against automation termination if a state becomes uninitialized or
    unknown.\n\n---\n\n### \U0001F4A1 Notes\n\n- **Net Solar Isolation**: The payload
    script for the `grid/solar` topic dynamically computes net generation by subtracting
    battery charging overhead (**sensor.battery_charge**) from raw total solar output
    (**sensor.solar_power_total**).\n- **State-of-Charge Redundancy**: The `grid/soc`
    transmission path implements a fallback condition. If the primary average computation
    (**sensor.felicity_ess_soc_avg**) evaluates to less than or equal to **0**, it
    automatically sources its payload from the hardware-direct register (**sensor.inverter_battery**).\n"
  triggers:
  - trigger: time_pattern
    seconds: /10
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: binary_sensor.esp32_c3_mini_goe11_controll_status_11kw
      state: 'on'
    - condition: state
      entity_id: binary_sensor.esp32_c3_mini_goe22_controll_status_22kw
      state: 'on'
    - condition: state
      entity_id: switch.schreibtisch_links_power_strip_l3
      state: 'on'
  - condition: template
    value_template: '{{ now() - (state_attr(this.entity_id, ''last_triggered'') |
      default( as_datetime(''0''), true)) >= timedelta(seconds=5) }}'
  actions:
  - action: mqtt.publish
    metadata: {}
    data:
      evaluate_payload: false
      topic: grid/power
      payload: '{{ states(''sensor.grid_power'') | float(0) }}'
  - action: mqtt.publish
    metadata: {}
    data:
      evaluate_payload: false
      topic: grid/solar
      payload: '{{ states(''sensor.solar_power_total'') | float(0) - states(''sensor.battery_charge'')
        | float(0) }}'
  - action: mqtt.publish
    metadata: {}
    data:
      topic: grid/battery
      payload: '{{ states(''sensor.battery_discharge'') | float(0) }}'
  - action: mqtt.publish
    metadata: {}
    data:
      topic: grid/soc
      payload: "{% set avg_soc = states('sensor.felicity_ess_soc_avg') | float(0)
        %}\n{% if avg_soc > 0 %}\n  {{ avg_soc }}\n{% else %}\n  {{ states('sensor.inverter_battery')
        }}\n{% endif %}\n"
  mode: parallel
  max: 10
- id: '1742316986881'
  alias: Wall Panel Display Control
  description: "### \U0001F4CB Intelligent Display Control\nThis automation manages
    the lifecycle, performance, and environmental adaptation of the **Lenovo Tab P11**
    wall panel. \n\n* **High-level intent:** To automate display power states based
    on time and solar position, maintain system performance via RAM management, and
    dynamically adjust screen brightness based on ambient light levels.\n* **Operational
    strategy:** Employs a time-and-solar schedule for power, a reactive approach to
    environmental changes (illuminance), and a performance-first maintenance cycle.\n*
    **Reliability mechanisms:** Utilizes a robust `retry_action_with_backoff` script
    for critical state changes and `parallel` execution mode to ensure overlapping
    tasks (like brightness updates and maintenance) do not interfere with one another.\n\n---\n\n###
    \U0001F4CB Trigger Overview Table\n\n| Type | Entity / Condition | ID | Purpose
    |\n| :--- | :--- | :--- | :--- |\n| **Time** | **23:00:00** | `Display Off` |
    Standard evening shutdown of the panel display. |\n| **Sun** | **Sunrise** (0
    offset) | `Display On` | Standard morning activation of the panel display. |\n|
    **State** | **switch.lenovo_tab_p11_bildschirmschoner** | `Display changed` |
    Detects when the screensaver activates to enforce night-time rules. |\n| **Numeric
    State** | **sensor.lenovo_tab_p11_ram_usage** > 90 | `High RAM usage` | Reactive
    trigger to prevent panel sluggishness or crashes. |\n| **Time** | **02:00:00**
    | `High RAM usage` | Scheduled daily maintenance to refresh the browser environment.
    |\n| **State** | **sensor.average_illuminance** | `Brightness` | Monitors ambient
    light levels to adjust screen visibility. |\n\n---\n\n### \U0001F4CB Operational
    Logic Sections\n\n#### Day/Night Scheduling\n* **Purpose:** Ensures the screen
    is active during daylight hours and off during the night.\n* **Logic Overview:**
    Operates when **input_select.smart_home_status** is set to **Daily**. It triggers
    at **23:00** or **Sunrise**. Additionally, if the screensaver turns **on** between
    **23:00** and **Sunrise** while the screen is still active, it triggers a forced
    shutdown.\n* **Effect:** Toggles **switch.lenovo_tab_p11_bildschirm** **on** or
    **off**.\n\n#### Performance Maintenance (High RAM)\n* **Purpose:** Clears system
    resources to maintain a fluid user interface.\n* **Logic Overview:** Triggered
    either by RAM usage exceeding **90%** or at the **02:00** maintenance window.\n*
    **Effect:** Presses **button.lenovo_tab_p11_browser_neu_starten** and executes
    a retry-loop to cycle the **switch.lenovo_tab_p11_bildschirmschoner** to ensure
    a clean UI reload.\n\n#### Ambient Brightness Adjustment\n* **Purpose:** Dynamically
    matches display intensity to room lighting.\n* **Logic Overview:** Triggers on
    illuminance changes, restricted by a **2-minute** throttle (via template) to prevent
    flickering. \n* **Effect:** Adjusts **number.lenovo_tab_p11_bildschirmhelligkeit**
    and **number.lenovo_tab_p11_bildschirmschoner_helligkeit** based on solar elevation
    and lux values.\n\n---\n\n### \U0001F4CB Technical Overview\n\n* **Automation
    Mode:** `parallel` (Max: 10)\n* **Execution method:** Calls `script.retry_action_with_backoff`
    for robust state synchronization.\n* **Key Inputs:** `sensor.average_illuminance`,
    `sensor.sun_next_rising`, `input_select.smart_home_status`.\n* **Controlled Entities:**
    * `switch.lenovo_tab_p11_bildschirm`\n    * `switch.lenovo_tab_p11_bildschirmschoner`\n
    \   * `number.lenovo_tab_p11_bildschirmhelligkeit`\n    * `button.lenovo_tab_p11_browser_neu_starten`\n*
    **Safety Mechanisms:** Throttle on brightness updates (120s) and a sophisticated
    backoff/retry logic (10 retries) with notifications to `notify.duncan` upon failure.\n\n---\n\n###
    \U0001F4A1 Notes\n\n* **Solar Logic:** The brightness logic uses a fallback: during
    the day (elevation >= 0), it pins to a high constant (**250/200**); at night,
    it scales mathematically based on the `average_illuminance` with a hard floor
    of **10** to prevent total darkness.\n* **Persistence:** The use of `retry_action_with_backoff`
    for the screensaver toggle during maintenance accounts for potential network latency
    or tablet unresponsiveness during a browser restart.\n* **Night-Time Enforcement:**
    The \"Redo Screensaver\" logic is a clever fail-safe that ensures if the screen
    somehow turns on or the screensaver activates after hours, the automation forces
    the display back to an **off** state.\n"
  triggers:
  - trigger: time
    at: '23:00:00'
    id: Display Off
  - trigger: sun
    event: sunrise
    offset: 0
    id: Display On
  - trigger: state
    entity_id:
    - switch.lenovo_tab_p11_bildschirmschoner
    id: Display changed
    to: 'on'
    for:
      hours: 0
      minutes: 0
      seconds: 15
  - trigger: numeric_state
    entity_id:
    - sensor.lenovo_tab_p11_ram_usage
    above: 90
    id: High RAM usage
  - trigger: time
    at: 02:00:00
    id: High RAM usage
  - entity_id:
    - sensor.average_illuminance
    trigger: state
    id: Brightness
  conditions:
  - condition: or
    conditions:
    - condition: and
      conditions:
      - condition: state
        entity_id: input_select.smart_home_status
        state:
        - Daily
      - condition: or
        conditions:
        - condition: trigger
          id:
          - Display On
          - Display Off
        - condition: and
          conditions:
          - condition: trigger
            id:
            - Display changed
          - condition: time
            after: '23:00:00'
            before: sensor.sun_next_rising
          - condition: state
            entity_id: switch.lenovo_tab_p11_bildschirm
            state: 'on'
          alias: Redo Screensaver
        - alias: Screen Brightness
          condition: and
          conditions:
          - condition: trigger
            id:
            - Brightness
          - condition: template
            value_template: '{{ now() - (state_attr(this.entity_id, ''last_triggered'')
              | default(as_datetime(''0''), true)) > timedelta(minutes=2) }}'
    - alias: High RAM
      condition: trigger
      id:
      - High RAM usage
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Display Off
      sequence:
      - action: switch.turn_off
        metadata: {}
        data: {}
        target:
          entity_id:
          - switch.lenovo_tab_p11_bildschirm
      alias: Mitternacht -> Bildschirm Aus
    - conditions:
      - condition: trigger
        id:
        - Display On
      sequence:
      - action: switch.turn_on
        metadata: {}
        data: {}
        target:
          entity_id:
          - switch.lenovo_tab_p11_bildschirm
      alias: Sunrise -> Bildschirm An
    - conditions:
      - condition: trigger
        id:
        - Display changed
      sequence:
      - delay:
          hours: 0
          minutes: 0
          seconds: 15
          milliseconds: 0
        enabled: true
      - action: switch.turn_off
        metadata: {}
        data: {}
        target:
          entity_id:
          - switch.lenovo_tab_p11_bildschirm
      alias: Bildschirm Aus wenn nach Mitternacht, vor Sonnenaufgang
    - conditions:
      - condition: trigger
        id:
        - High RAM usage
      sequence:
      - action: button.press
        metadata: {}
        data: {}
        target:
          entity_id: button.lenovo_tab_p11_browser_neu_starten
      - delay:
          hours: 0
          minutes: 5
          seconds: 0
          milliseconds: 0
      - action: script.retry_action_with_backoff
        metadata: {}
        data:
          action_domain: switch
          action_type: turn_off
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: simple
          notify_on_failure: true
          notify_service: notify.duncan
          entity_id: switch.lenovo_tab_p11_bildschirmschoner
          target_state: 'off'
      - delay:
          hours: 0
          minutes: 0
          seconds: 30
          milliseconds: 0
      - action: script.retry_action_with_backoff
        metadata: {}
        data:
          action_domain: switch
          action_type: turn_on
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: simple
          notify_on_failure: true
          notify_service: notify.duncan
          entity_id: switch.lenovo_tab_p11_bildschirmschoner
          target_state: 'on'
    - conditions:
      - condition: trigger
        id:
        - Brightness
      sequence:
      - action: number.set_value
        metadata: {}
        target:
          entity_id: number.lenovo_tab_p11_bildschirmhelligkeit
        data:
          value: "  {% set light_max = 250 %}\n  {% set light_float = (states('sensor.average_illuminance')
            | float(0)) / 1000 %}\n  {% if state_attr('sun.sun','elevation') | float(-90)
            >= 0 %}\n    {{ light_max }}\n  {% else %}\n    {% set scaled = max(light_max
            * light_float, 10) %}\n    {{ [scaled, light_max] | min }}\n  {% endif
            %}"
      - action: number.set_value
        metadata: {}
        target:
          entity_id: number.lenovo_tab_p11_bildschirmschoner_helligkeit
        data:
          value: "{% set light_max = 200 %}\n  {% set light_float = (states('sensor.average_illuminance')
            | float(0)) / 1000 %}\n  {% if state_attr('sun.sun','elevation') | float(-90)
            >= 0 %}\n    {{ light_max }}\n  {% else %}\n    {% set scaled = max(light_max
            * light_float, 10) / 2 %}\n    {{ [scaled, light_max] | min }}\n  {% endif
            %}"
  mode: parallel
  max_exceeded: silent
  max: 10
- id: '1744046298527'
  alias: Enya kommt heim
  description: "\U0001F3E0 **Enya Arrival Tracking**\n\n### \U0001F4CB Intelligent
    Presence & Notification Control\n\nThis automation manages proximity-based notifications
    to provide real-time updates on Enya's arrival. It utilizes geofencing to alert
    household members of an estimated time of arrival (ETA) when she enters an outer
    perimeter, then automatically cleans up stale notifications once she successfully
    arrives at home.\n\nThe operational strategy is **notification-centric**, ensuring
    that information is delivered when relevant and removed when no longer needed
    to maintain a clean device notification tray.\n\n---\n\n### Trigger Overview Table\n\n|
    Type | Entity / Condition | ID | Purpose |\n| :--- | :--- | :--- | :--- |\n| **Zone**
    | **person.enya** entering **zone.big_home** | `Enter` | Trigger arrival alert
    and ETA calculation. |\n| **Zone** | **person.enya** entering **zone.home** |
    `Home` | Trigger notification dismissal upon arrival. |\n\n---\n\n### Operational
    Logic Sections\n\n#### Proximity Alert (Outer Zone)\n* **Purpose**: Notify that
    Enya is approaching and provide a travel time estimate.\n* **Logic Overview**:
    Triggered when **person.enya** enters the **Big Home 2** zone, provided the system
    has been stable for at least **120 seconds**.\n* **Effect**: Sends a notification
    to **notify.duncan** containing the current value of **sensor.enyas_iphone_travel_time**.\n\n####
    Arrival Cleanup (Home Zone)\n* **Purpose**: Remove the now-obsolete arrival notification.\n*
    **Logic Overview**: Triggered when **person.enya** enters the **Home** zone.\n*
    **Effect**: Issues a `clear_notification` command to **notify.duncan** targeting
    the specific tag `home_arrival_enya`.\n\n---\n\n### Technical Overview\n\n* **Automation
    Mode**: `queued` (Max 3)\n* **Execution Method**: Direct Action / Notification
    Service\n* **Key Inputs**: `person.enya`, `sensor.enyas_iphone_travel_time`\n*
    **Controlled Entities**: `notify.duncan`\n* **Safety Mechanisms**: A **Template
    Condition** ensures the automation does not fire during the first **120 seconds**
    of system uptime to prevent false triggers during Home Assistant restarts.\n\n---\n\n###
    \U0001F4A1 Notes\n\n* **Notification Tagging**: By using the `home_arrival_enya`
    tag, the automation can overwrite or dismiss the specific arrival message without
    affecting other notifications on the recipient's device.\n* **Uptime Guard**:
    The logic includes a safety check against `sensor.uptime` to ensure that geofence
    \"flapping\" during a reboot doesn't trigger accidental notifications.\n* **Contextual
    Links**: The notification includes a `clickAction` that directs the user straight
    to the **Maps** dashboard for visual tracking."
  triggers:
  - trigger: zone.entered
    target:
      entity_id: person.enya
    options:
      for: 00:00:00
      zone: zone.big_home
    id: Enter
  - trigger: zone.entered
    target:
      entity_id: person.enya
    options:
      for: 00:00:00
      zone: zone.home
    id: Home
  conditions:
  - alias: restart finished
    condition: template
    value_template: "    {% set boot = as_timestamp(states('sensor.uptime')) %}\n
      \   {{ boot is number and (as_timestamp(now()) - boot) >= 120 }}"
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Enter
      sequence:
      - action: notify.duncan
        metadata: {}
        data:
          title: Enya kommt heim
          message: Sie ist in {{ states('sensor.enyas_iphone_travel_time', with_unit=true)
            }} daheim
          data:
            tag: home_arrival_enya
            url: /lovelace/maps
            clickAction: /lovelace/maps
    - conditions:
      - condition: trigger
        id:
        - Home
      sequence:
      - action: notify.duncan
        metadata: {}
        data:
          message: clear_notification
          data:
            tag: home_arrival_enya
  mode: queued
  max: 3
- id: '1747048995618'
  alias: Coffee Machine Power Control
  description: "## ☕ Coffee Machine Power Control\n\n### \U0001F4CB **Automatic Smart-Plug
    Management for Coffee Machine**  \nMonitors the coffee machine's power draw and
    automatically powers the smart plug when an initial draw is detected. If the expected
    brewing power level isn't reached within **5 minutes**, the plug is turned off
    to avoid prolonged idle consumption (e.g., kettle-like standby or false triggers).\n\n---\n\n###
    ⏰ **Triggers**\n| Entity | Event |\n|--------|-------|\n| `sensor.kaffeemaschine_philips_energy_power`
    | Any state change (used to detect the initial power-up spike) |\n\n---\n\n###
    ✅ **Conditions**\n- Template ensures this automation only reacts when the sensor
    crosses from near-zero to a small positive draw (initial start):\n  - Detects
    transition: `from < 0.5` → `to > 0.5`\n\n---\n\n### \U0001F3AF **Actions / Workflow**\n\n1.
    **Initial detection**  \n   - When initial draw detected (template condition passes)
    → `switch.kaffeemaschine_tasmota` **turn_on** immediately.\n\n2. **Wait for brewing
    power**  \n   - Wait for `sensor.kaffeemaschine_energy_power` to rise **above
    50 W** (numeric_state trigger).\n   - Timeout: **5 minutes** (continue_on_timeout:
    true).\n\n3. **Fail-safe**  \n   - If the wait **timed out** (i.e., brewing threshold
    not reached within 5 minutes) → turn **off** `switch.kaffeemaschine_tasmota` to
    prevent idle power draw.\n\n---\n\n### \U0001F527 **Technical Specs**\n- **Trigger
    Sensor:** `sensor.kaffeemaschine_philips_energy_power`  \n- **Brewing Detection
    Sensor:** `sensor.kaffeemaschine_energy_power`  \n- **Controlled Device:** `switch.kaffeemaschine_tasmota`
    \ \n- **Initial-detect threshold:** ~**0.5 W** (transition from near-zero to >0.5)
    \ \n- **Brewing threshold:** **50 W** (tunable)  \n- **Timeout:** **5 minutes**
    \ \n- **Mode:** `queued` (max 3 concurrent) — allows overlapping short starts
    but limits runaway executions\n\n---\n\n### ⚡ **Notes & Best Practices**\n- Thresholds
    (`0.5` for initial start, `50` for brewing) and timeout (5 min) are tuned heuristics
    — adapt them to your machine's real measured behavior to avoid false positives/negatives.
    \ \n- Consider adding small hysteresis or a minimum-on-time if the coffee machine
    briefly toggles during brew to avoid rapid on/off cycles.  \n- Useful to log occasional
    timeouts to check whether the coffee machine often fails to reach brew power (could
    indicate a device issue).  \n- This keeps the smart plug honest: power it on when
    action begins, but don't let an accidental small draw sit forever.\n"
  triggers:
  - entity_id:
    - sensor.kaffeemaschine_philips_energy_power
    trigger: state
  conditions:
  - condition: template
    value_template: "{{ trigger.from_state.state | float(default=0) < 0.5 and\n   trigger.to_state.state
      | float(default=0) > 0.5 }}\n"
  actions:
  - target:
      entity_id:
      - switch.kaffeemaschine_tasmota
    action: switch.turn_on
    data: {}
  - wait_for_trigger:
    - trigger: numeric_state
      entity_id:
      - sensor.kaffeemaschine_energy_power
      above: 50
    timeout:
      hours: 0
      minutes: 5
      seconds: 0
      milliseconds: 0
    continue_on_timeout: true
  - if:
    - condition: template
      value_template: '{{ not wait.completed }}'
    then:
    - action: switch.turn_off
      metadata: {}
      data: {}
      target:
        entity_id: switch.kaffeemaschine_tasmota
  mode: queued
  max: 3
- id: '1747074473799'
  alias: Restart Add-ons at 01:00 daily
  description: "## \U0001F504 Daily Add-on Restart Automation\n\n### \U0001F4CB Purpose\nThis
    automation restarts a set of Home Assistant add-ons daily at **01:00 AM**. \nIts
    goal is to ensure the add-ons are refreshed, which helps recover from updates
    or minor issues.\n\n---\n\n### ⏱ Trigger\n- Daily at `01:00:00`.\n\n---\n\n###
    ✅ Conditions\n- No additional conditions; the restart occurs every day.\n\n---\n\n###
    \U0001F3AF Actions / Workflow\nRestart add-on\n---\n\n### \U0001F527 Technical
    Notes\n- Mode: `single` (prevents overlapping runs if the automation triggers
    again unexpectedly).\n- Uses short delays between add-on restarts to avoid potential
    conflicts or overload."
  triggers:
  - trigger: time
    at: 01:00:00
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: binary_sensor.frigate_full_access_aktiv
        state: 'off'
      - condition: state
        entity_id: sensor.ups0_status
        state: Online
      sequence:
      - action: hassio.addon_start
        metadata: {}
        data:
          addon: ccab4aaf_frigate-fa
      alias: Start Frigate if not running
    - conditions:
      - condition: state
        entity_id: binary_sensor.frigate_full_access_aktiv
        state: 'on'
      - condition: state
        entity_id: sensor.ups0_status
        state: Online
      sequence:
      - action: hassio.addon_restart
        metadata: {}
        data:
          addon: ccab4aaf_frigate-fa
      alias: Restart Frigate if running
  mode: single
- id: '1747573166845'
  alias: Boiler Timer
  description: "## \U0001F4A7 Boiler Timer  \n\n### \U0001F4CB **Hot Water Circulation
    Control**  \nThis automation controls the hot water circulation pump (`switch.zirkulationspumpe_zigbee`)
    based on the `boiler_on_demand` timer.  \n\nWhen the timer becomes active, the
    pump is switched on. When the timer finishes and goes idle, the pump is turned
    off.  \n\n---\n\n### ⏰ **Triggers**  \n\n| Trigger Entity | Event / Condition
    | Trigger ID |\n|----------------|-----------------|------------|\n| `timer.boiler_on_demand`
    | State changes from `idle` → `active` | \"Start\" |\n| `timer.boiler_on_demand`
    | State changes from `active` → `idle` | \"Stop\" |\n\n> **Note:** The pump operation
    is fully synchronized with the timer.  \n\n---\n\n### ✅ **Conditions**  \n- None;
    all triggers execute the actions directly.  \n\n---\n\n### \U0001F3AF **Actions
    / Workflow**  \n\n1. **Start Trigger** (`timer.boiler_on_demand` → active)  \n
    \  - Turns on `switch.zirkulationspumpe_zigbee`  \n\n2. **Stop Trigger** (`timer.boiler_on_demand`
    → idle)  \n   - Turns off `switch.zirkulationspumpe_zigbee`  \n\n---\n\n### \U0001F527
    **Technical Specs**  \n- **Mode:** `single` (prevents overlapping executions)
    \ \n- **Device Controlled:** Hot water circulation pump (`switch.zirkulationspumpe_zigbee`)
    \ \n\n---\n\n### ⚡ **Notes / Best Practices**  \n- Ensures pump only runs when
    needed, saving energy.  \n- Simple and reliable control synced to the `boiler_on_demand`
    timer.  \n"
  triggers:
  - trigger: state
    entity_id:
    - timer.boiler_on_demand
    to: active
    from: idle
    id: Start
  - trigger: state
    entity_id:
    - timer.boiler_on_demand
    to: idle
    from: active
    id: Stop
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Start
      sequence:
      - action: script.retry_action_with_backoff
        metadata: {}
        data:
          action_domain: switch
          action_type: turn_on
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: simple
          notify_on_failure: true
          notify_service: notify.duncan
          entity_id: switch.zirkulationspumpe_zigbee
          target_state: 'on'
    - conditions:
      - condition: trigger
        id:
        - Stop
      sequence:
      - action: script.retry_action_with_backoff
        metadata: {}
        data:
          action_domain: switch
          action_type: turn_off
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: simple
          notify_on_failure: true
          notify_service: notify.duncan
          entity_id: switch.zirkulationspumpe_zigbee
          target_state: 'off'
  mode: single
- id: '1748530213618'
  alias: Allergie und Aufgaben Benachrichtigung
  description: "## \U0001F33F Allergie und Aufgaben Benachrichtigung  \n\n### \U0001F4CB
    **Daily Allergy & Task Reminder with AI Fallback System**  \n\nThis automation
    generates a **daily morning notification** combining:  \n1. **Pollen information**
    (Grass, Roggen, Hausstaubmilben, etc.)  \n2. **A random to-do task** from `todo.anylist_to_do_duncan`
    \ \n3. **A short AI-generated German message** with practical advice and medication
    hints  \n\nThe automation now includes an **enhanced dual-agent retry system**
    to maximize reliability of the AI output.  \n\n---\n\n### ⏰ **Triggers**  \n\n|
    Time | Event |\n|------|-------|\n| `08:05:00` | Daily scheduled reminder |\n\n---\n\n###
    ✅ **Conditions**  \n- None; runs automatically every morning.  \n\n---\n\n###
    \U0001F3AF **Workflow / Logic**  \n\n1. **Fetch To-Do Task**  \n   - Retrieves
    all tasks with status `needs_action` from `todo.anylist_to_do_duncan`.  \n   -
    Randomly selects one task to include in the notification.  \n\n2. **Prepare Prompts**
    \ \n   - **Pollen Prompt:** Uses today’s values from all relevant pollen sensors,
    focusing only on dosage recommendation in the format  \n     `base amount: additional
    amount`.  \n     - Keeps dosage conservative.  \n     - No explanations, causes,
    or air-quality text.  \n   - **To-Do Prompt:** Embeds the random task *unaltered*
    and adds practical, helpful suggestions for completing it today.  \n   - **Main
    Prompt:** Instructs the AI to produce a short, clean, readable message (in **German**,
    max **255 words**).  \n\n3. **AI Processing (Primary Agent)**  \n   - Uses `{{
    states('input_select.conversation_agents') }}`.  \n   - Retries up to **10 times**,
    but waits **only when a failure occurs**.  \n   - Recognizes failure phrases such
    as:  \n     - `\"Unable to get response\"`  \n     - `\"Sorry, I had a problem
    getting a response from Google Generative AI.\"`  \n     - `\"The message got
    blocked due to content violations\"`  \n\n4. **AI Fallback (Secondary Agent)**
    \ \n   - If the primary agent fails after retries, switches to  \n     `conversation.google_ai_conversation_2_5_flash`.
    \ \n   - Applies the same conditional retry logic and 5s delay on failed attempts.
    \ \n   \n5. **Send Notification**  \n   - **Success:** Sends the generated message
    to `notify.duncan`, with title including today’s weekday.  \n   - **Failure (after
    all retries):** Sends a fallback message  \n     *“Heute konnte leider keine Nachricht
    generiert werden.”*  \n\n---\n\n### \U0001F527 **Technical Specs**  \n\n- **To-Do
    Entity:** `todo.to_do_duncan`  \n- **Primary AI Agent:** `states('input_select.conversation_agents')`
    \ \n- **Fallback AI Agent:** `conversation.google_ai_conversation_2_5_flash`  \n-
    **Notification Target:** `notify.duncan`  \n- **Retries:** Up to 10 per agent
    \ \n- **Retry Delay:** 5 seconds  \n- **AI Token Limit:** 300 tokens  \n- **Pollen
    Sensors:**  \n  - `sensor.pollenflug_graeser_111`  \n  - `sensor.pollenflug_roggen_111`
    \ \n  - `sensor.pollenflug_ambrosia_111`  \n  - `sensor.pollenflug_beifuss_111`
    \ \n  - `sensor.pollenflug_hasel_111`  \n  - `sensor.pollenflug_esche_111`  \n\n---\n\n###
    ⚡ **Notes & Best Practices**  \n- Task text is **never altered or translated**,
    only supplemented.  \n- Medication recommendation stays on the conservative side.
    \ \n- The system prioritizes **robustness** — automatic retry + fallback agent
    ensure high success rate.  \n- The final message is always **concise, actionable,
    and in natural German**, formatted cleanly for mobile reading.\n"
  triggers:
  - trigger: time
    at: 08:05:00
  conditions: []
  actions:
  - action: todo.get_items
    metadata: {}
    data:
      status: needs_action
    target:
      entity_id: todo.anylist_to_do_duncan
    response_variable: to_do_duncan
  - variables:
      prompt: 'Please generate text for a notification that will be sent to the users
        smartphone with helpful information. keep it simple and short but precise.
        simply provide the notification and nothing else! don''t use any Benachrichtigung
        or something like that just the message! if you like you can format it to
        make it more readable . Only provide the message and not more.


        - Your answers are not technical, and do not include Home Assistant internal
        details such as entities in responses.

        Provide your answer in German and make it precise and efficient as a German
        would like it. Bitte Duzen nicht Siezen limit your answer to at most 255 tokens.
        keep it simple and short. rember it is a notification so no ''notification:''
        or something like that.  Simply the text of it and not more. limit yourself
        to 255 words! not one more!'
      pollen_prompt: 'I''m quite allergic to Grass pollen, Hausstaubmilben and Roggen.  Here
        are the today sensor values of these pollen and any other Gräser: {{ states(''sensor.pollenflug_graeser_111'')
        }}   Roggen: {{ states(''sensor.pollenflug_roggen_111'') }}  Ambrosia: {{
        states(''sensor.pollenflug_ambrosia_111'') }}  Beifuss {{ states(''sensor.pollenflug_beifuss_111'')
        }}  Hasel: {{ states(''sensor.pollenflug_hasel_111'') }}  Esche: {{ states(''sensor.pollenflug_esche_111'')
        }}  Legend: \nIndex\tDescription (in German) 0\tkeine Belastung 0.5\tkeine
        bis geringe Belastung 1\tgeringe Belastung 1.5\tgeringe bis mittlere Belastung
        2\tmittlere Belastung 2.5\tmittlere bis hohe Belastung 3\thohe Belastung\n

        Based on these, how much anti allergic medication should i take, my typical
        dose would be 2 tablets on bad days. My doctor says i can take as much as
        10 per day. Give me a base count i should take and suggest how many more i
        could take over the day. Keep it short, only tell the amount, and the amount
