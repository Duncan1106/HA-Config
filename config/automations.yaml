- id: '1714554450926'
  alias: Terrarium Humidifier Empty Detection
  description: "## \U0001F4A7 Terrarium Humidifier Empty Detection (Dynamic)\n\nDetects
    if the **terrarium humidifier tank is empty** by monitoring power usage.  \nAssumes
    a functioning humidifier will draw **Δ ≥ 3 W** shortly after turning on.  \nUses
    a **dynamic baseline** measured at startup. Runs only when `input_boolean.luftbefeuchter_aktiv`
    is on.\n\n---\n\n### \U0001F4CC Flow\n\n1. **Set baseline**  \n   - Record current
    power (`sensor.terrarium_power_plug_zigbee_power`) at automation start.\n\n2.
    **Wait for device**  \n   - Pauses until `switch.terrarium_zigbee_l1` is on or
    3min30s timeout.\n\n3. **Monitor power**  \n   - Wait up to 60s for **+3W increase**
    over baseline.\n\n4. **Notify if empty**  \n   - Power increase <3W → notify `notify.duncan`
    \ \n   - Reset `counter.luftbefeuchter`  \n   - Include previous activation count
    for context\n\n---\n\n### \U0001F527 Conditions\n\n- `input_boolean.luftbefeuchter_aktiv
    = on`\n\n---\n\n### ⚡ Actions\n\n- Record baseline  \n- Wait for humidifier to
    turn on  \n- Monitor for +5 W increase  \n- Notify if tank may be empty  \n- Reset
    usage counter  \n- Send usage context"
  triggers:
  - trigger: state
    entity_id: input_boolean.luftbefeuchter_aktiv
    to: 'on'
  conditions:
  - condition: state
    entity_id: switch.terrarium_zigbee_strip_l1
    state:
    - 'off'
  actions:
  - variables:
      baseline: '{{ states(''sensor.terrarium_zigbee_strip_power'')|float(0) }}'
  - wait_for_trigger:
    - trigger: state
      entity_id:
      - switch.terrarium_zigbee_strip_l1
      to: 'on'
    timeout:
      hours: 0
      minutes: 3
      seconds: 30
      milliseconds: 0
    continue_on_timeout: false
  - wait_template: '{{ states(''sensor.terrarium_zigbee_strip_power'')|float(0) >=
      baseline + 5 }}'
    timeout: 00:01:00
    continue_on_timeout: true
  - variables:
      current_power: '{{ states(''sensor.terrarium_zigbee_strip_power'')|float(0)
        }}'
      delta_power: '{{ (current_power - baseline)|round(2) }}'
  - if:
    - condition: template
      value_template: '{{ delta_power < 3 and delta_power > -30 }}'
    - condition: state
      entity_id: input_boolean.luftbefeuchter_aktiv
      state: 'on'
    - condition: state
      entity_id: switch.terrarium_zigbee_strip_l1
      state:
      - 'on'
    then:
    - action: notify.duncan
      data:
        title: "\U0001F4A7 Luftbefeuchter leer"
        message: 'Wassertank auffüllen – kein ausreichender Leistungsanstieg erkannt.
          (Δ = {{ delta_power }} W; Baseline: {{ baseline }} W, Current: {{ current_power
          }} W)'
    - action: notify.duncan
      data:
        title: "\U0001F4CA Luftbefeuchter Counter"
        message: Der Luftbefeuchter war {{ states('counter.luftbefeuchter') }} Mal
          an.
    - action: counter.reset
      target:
        entity_id: counter.luftbefeuchter
      enabled: true
    else:
    - alias: Not empty → signal success to script by turning the flag OFF
      if:
      - condition: state
        entity_id: input_boolean.luftbefeuchter_aktiv
        state: 'on'
      then:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.luftbefeuchter_aktiv
  mode: single
- id: '1714558482048'
  alias: Notify on Overcurrent Phase
  description: "⚡ **Notify on Overcurrent Phase**\n\n---\n\n### \U0001F4CB Intelligent
    Load Management Control\n\n**High-Level Intent**\nThis automation provides critical
    infrastructure protection by monitoring the electrical load across all three phases
    (**L1, L2, L3**) of the main smart meter. Its primary goal is to prevent fuse
    trips by detecting sustained overcurrent events and executing immediate remedial
    actions.\n\n**Operational Strategy**\nThe system employs a **safety-first protection
    strategy**. Upon detecting a current draw exceeding the defined **Fuse Limit**,
    it triggers an immediate notification and attempts to gracefully reduce the load
    of high-consumption devices (EV Chargers) before resorting to a full shutdown
    of those services.\n\n**Reliability Mechanisms**\nTo ensure high availability
    and successful execution, the automation utilizes a **retry script with backoff**
    (`script.retry_action_with_backoff`) for charger shutdowns. This ensures that
    even if a device is momentarily offline or a command fails, the system will persist
    for up to **10 retries** with increasing delays to secure the electrical system.\n\n---\n\n###
    Trigger Overview Table\n\n| Type | Entity / Condition | ID | Purpose |\n| :---
    | :--- | :--- | :--- |\n| **Numeric State** | **Smart Meter Phase L1** > **Fuse
    Limit** | `overcurrent_l1` | Detect phase 1 overload for 30s |\n| **Numeric State**
    | **Smart Meter Phase L2** > **Fuse Limit** | `overcurrent_l2` | Detect phase
    2 overload for 30s |\n| **Numeric State** | **Smart Meter Phase L3** > **Fuse
    Limit** | `overcurrent_l3` | Detect phase 3 overload for 30s |\n\n---\n\n### Operational
    Logic Sections\n\n#### Overcurrent Mitigation Mode\n**Purpose**\nProtect the main
    building fuse by reducing high-draw loads immediately upon detection of an overcurrent
    event.\n\n**Logic Overview**\nTriggered when any phase attribute on the **Smart
    Meter MQTT Data** sensor exceeds the **input_number.fuselimit** for a sustained
    period of **30 seconds**.\n\n**Effect**\n* **Notification:** Dispatches an urgent
    alert via `notify.duncan` detailing the affected phase, the current amperage,
    and the threshold exceeded.\n* **Active Load Reduction:** Checks if EV chargers
    are currently active (Amps > **6** and Power > **10**). If active, it reduces
    the charging rate to **75%** of the current value.\n* **Emergency Cut-off:** If
    the charger is at its minimum or the reduction fails, it initiates a script to
    force the charging state to **Don't charge**.\n\n---\n\n### Technical Overview\n\n*
    **Automation Mode:** `parallel` (Max: 6) - Allows simultaneous handling of multiple
    phase triggers.\n* **Execution Method:** Uses direct service calls for amperage
    adjustment and `script.retry_action_with_backoff` for reliable state changes.\n*
    **Key Inputs:** `input_number.fuselimit` (Global threshold for current monitoring).\n*
    **Controlled Entities:** * `number.go_echarger_270862_amp` (11kW Charger)\n    *
    `number.go_echarger_252682_amp` (22kW Charger)\n    * `select.go_echarger_270862_frc`
    (Charging Mode)\n* **Safety Mechanisms:** * **30-second hysteresis** on triggers
    to prevent activation by momentary spikes.\n    * **Clamping logic** ensures amperage
    never drops below the minimum safe level of **6A** or exceeds hardware limits
    (**16A/32A**).\n\n---\n\n### \U0001F4A1 Notes\n\n* **Hysteresis Rationale:** The
    30-second \"for\" duration is critical to distinguish between short-lived motor
    start-up spikes and genuine sustained overloads that threaten fuse integrity.\n*
    **Dynamic Scaling:** The **75%** reduction logic allows the system to attempt
    to keep the vehicle charging at a slower rate rather than simply cutting power,
    maintaining user convenience while ensuring safety.\n* **Fail-Safe:** If the chargers
    are already at their lowest setting (**6A**) but the overcurrent persists, the
    automation shifts from \"throttling\" to \"disabling\" via the retry script."
  triggers:
  - trigger: numeric_state
    entity_id:
    - binary_sensor.smart_meter_mqtt_data
    attribute: current_L1
    above: input_number.fuselimit
    id: overcurrent_l1
    for:
      hours: 0
      minutes: 0
      seconds: 30
  - trigger: numeric_state
    entity_id:
    - binary_sensor.smart_meter_mqtt_data
    attribute: current_L2
    above: input_number.fuselimit
    id: overcurrent_l2
    for:
      hours: 0
      minutes: 0
      seconds: 30
  - trigger: numeric_state
    entity_id:
    - binary_sensor.smart_meter_mqtt_data
    attribute: current_L3
    above: input_number.fuselimit
    id: overcurrent_l3
    for:
      hours: 0
      minutes: 0
      seconds: 30
  - trigger: time_pattern
    seconds: /30
  conditions:
  - condition: or
    conditions:
    - condition: numeric_state
      entity_id: binary_sensor.smart_meter_mqtt_data
      attribute: current_L1
      above: input_number.fuselimit
    - condition: numeric_state
      entity_id: binary_sensor.smart_meter_mqtt_data
      attribute: current_L2
      above: input_number.fuselimit
    - condition: numeric_state
      entity_id: binary_sensor.smart_meter_mqtt_data
      attribute: current_L3
      above: input_number.fuselimit
  actions:
  - action: notify.duncan
    data:
      title: '!!! OVERCURRENT !!!'
      message: "{% if trigger.id.startswith('overcurrent_l') %}\n  {% set phase =
        trigger.id.split('_')[1] | upper %}\n  {% set current = (state_attr(trigger.entity_id,
        'current_' ~ phase) | float(0) / 1000) | round(2) %}\n  {% set limit = (states('input_number.fuselimit')
        | float(0) / 1000) | round(2) %}\n  ⚡ Phase: {{ phase }} | Strom: {{ current
        }} A (Limit: {{ limit }} A)\n{% else %}\n  ⚡ Detected by time pattern\n{%
        endif %}"
  - alias: Go-e 11kW Set amps to 75% of original value
    if:
    - condition: numeric_state
      entity_id: number.go_echarger_270862_amp
      above: 6
    - condition: numeric_state
      entity_id: sensor.go_echarger_270862_nrg_12
      above: 10
    then:
    - action: number.set_value
      metadata: {}
      target:
        entity_id: number.go_echarger_270862_amp
      data:
        value: '{{ (states(''number.go_echarger_270862_amp'') | float(0) * 0.75) |
          int | clamp(6, 16) }}'
    else:
    - action: script.retry_action_with_backoff
      metadata: {}
      data:
        max_retries: 10
        base_delay: 5
        max_delay: 60
        backoff_type: simple
        notify_on_failure: true
        notify_service: notify.duncan
        entity_id: select.go_echarger_270862_frc
        target_state: custom
        custom_action:
        - action: select.select_option
          metadata: {}
          data:
            option: Don't charge
          target:
            entity_id:
            - select.go_echarger_270862_frc
        custom_target_state: Don't charge
      enabled: true
  - alias: Go-e 22kW Set amps to 75% of original value
    if:
    - condition: numeric_state
      entity_id: number.go_echarger_252682_amp
      above: 6
    - condition: numeric_state
      entity_id: sensor.go_echarger_252682_nrg_12
      above: 10
    then:
    - action: number.set_value
      metadata: {}
      target:
        entity_id: number.go_echarger_252682_amp
      data:
        value: '{{ (states(''number.go_echarger_252682_amp'') | float(0) * 0.75) |
          int | clamp(6, 32) }}'
    else:
    - action: script.retry_action_with_backoff
      metadata: {}
      data:
        max_retries: 10
        base_delay: 5
        max_delay: 60
        backoff_type: simple
        notify_on_failure: true
        notify_service: notify.duncan
        entity_id: select.go_echarger_252682_frc
        target_state: custom
        custom_action:
        - action: select.select_option
          metadata: {}
          data:
            option: Don't charge
          target:
            entity_id:
            - select.go_echarger_252682_frc
        custom_target_state: Don't charge
      enabled: true
  mode: parallel
  max: 6
- id: '1716307846138'
  alias: Pool Runtime Control
  description: "## \U0001F31E Pool Runtime Control\n\n### \U0001F4CB Purpose\nControls
    the daily runtime of the pool pump, dynamically adjusting runtime\nbased on weather
    conditions, solar power availability, and pool temperature\ntrends. The automation
    ensures efficient use of solar energy while\nmaintaining optimal pool operation.\n\n---\n\n###
    ⏰ Triggers\n| Trigger Type                     | Details / Thresholds                          |\n|----------------------------------|----------------------------------------------|\n|
    Time Pattern                      | 09:00–11:00 every 2 minutes (Early Start)
    \  |\n| Time Pattern                      | 11:00–12:00 (Force Start)                    |\n|
    Numeric State                     | `input_number.pulsetimeactualvalue` < 250/150
    |\n| Pool Pump State                   | Off → On / On → Off                           |\n|
    Time Pattern                      | 20:00+ (Force Stop)                           |\n\n---\n\n###
    ✅ Conditions\n- Early Start: 09:30–10:59 with sufficient solar or grid export.\n-
    Force Start: 10:59–12:00 if pump is off.\n- Extend: Pulse time below 410, PV power
    > 1200, and extend counter < 15.\n- Stop / Stopped: Various time and state-based
    conditions.\n- All conditions ensure the pump only runs when beneficial.\n\n---\n\n###
    \U0001F3AF Actions / Workflow\n**1. Early Start**\n- Checks solar conditions,
    PV forecast, and azimuth angle.\n- Turns off `pool_pulsetime_auto_adjust` automation
    temporarily.\n- Opens main solar valve, sets pulse time to 8h, turns on pump.\n-
    Records start temperature and notifies potential night temperature loss.\n- Re-enables
    `pool_pulsetime_auto_adjust`.\n\n**2. Force Start**\n- Triggered if pump is off
    during 11:00–12:00 window.\n- Sets pulse time to 6h, opens solar valve, turns
    on pump.\n- Records start temperature and notifies temperature loss.\n- Re-enables
    pulse time auto-adjust.\n\n**3. Extend**\n- Triggered when pulse time is low but
    solar conditions allow extension.\n- Increments pulse time by 6 minutes per check.\n-
    Saves stop temperature before extending if first increment.\n- Updates counter
    to limit maximum extensions.\n- Notifies temperature changes caused by extensions.\n\n**4.
    Stopped**\n- Triggered when pump turns off.\n- Ensures solar valves are closed,
    records stop temperature.\n- Notifies temperature change caused by extensions
    if any.\n- Marks pool as stopped.\n\n**5. Force Stop**\n- Triggered at 20:00 or
    when explicitly stopped.\n- Records stop temperature, turns off pump and valves,
    resets counter.\n- Notifies temperature difference between start and stop.\n-
    Clears stop flag.\n\n---\n\n### \U0001F527 Technical Specs\n- **Mode:** `queued`
    with `max: 50` to prevent lost triggers.\n- Monitored Entities: pool pump switch,
    solar valve switches, pulse time inputs, PV power, solar forecast, pool temperature
    sensors, trend sensor, and stop flag.\n- Integrates with MQTT to set Tasmota pulse
    times dynamically.\n- Interacts with `pool_pulsetime_auto_adjust` automation to
    prevent conflicts.\n\n---\n\n### ⚡ Best Practices / Notes\n- Adjust pulse time
    thresholds and solar power conditions to match local climate and pool setup.\n-
    Ensure all sensors and valves report accurate states to avoid unintended runtime.\n-
    Extend logic uses a counter to prevent excessive prolonging of pump operation.\n-
    Notifications help track temperature changes and pool runtime efficiency."
  triggers:
  - hours: '9'
    minutes: /2
    id: On early
    trigger: time_pattern
  - hours: '10'
    minutes: /2
    id: On early
    trigger: time_pattern
  - hours: '11'
    minutes: /2
    id: Force Start
    trigger: time_pattern
    enabled: true
  - entity_id:
    - input_number.pulsetimeactualvalue
    below: 250
    id: Extend
    trigger: numeric_state
  - entity_id:
    - input_number.pulsetimeactualvalue
    below: 150
    id: Extend
    trigger: numeric_state
  - trigger: state
    entity_id:
    - switch.pool_pumpe
    to: 'off'
    from: 'on'
    id: Stopped
  - hours: '20'
    minutes: '*'
    id: Force Stop
    trigger: time_pattern
  conditions:
  - condition: or
    conditions:
    - alias: Early Start Condition
      condition: and
      conditions:
      - condition: time
        after: 09:30:00
        before: '10:59:00'
      - condition: trigger
        id:
        - On early
      - condition: state
        entity_id: switch.pool_pumpe
        state:
        - 'off'
    - alias: Force Start Condition
      condition: and
      conditions:
      - condition: trigger
        id:
        - Force Start
      - condition: time
        after: '10:59:59'
        before: '12:00:00'
      - condition: state
        entity_id: switch.pool_pumpe
        state: 'off'
    - condition: and
      conditions:
      - alias: 'Extend Condition '
        condition: numeric_state
        entity_id: input_number.pulsetimeactualvalue
        below: 401
      - condition: state
        entity_id: switch.pool_pumpe
        state:
        - 'on'
      - condition: trigger
        id:
        - Extend
    - alias: Stopped Cleanup (Always Allow)
      condition: and
      conditions:
      - condition: trigger
        id:
        - Stopped
      - condition: state
        entity_id: switch.pool_pumpe
        state: 'off'
    - alias: Force Stop Condition (Evening Only)
      condition: and
      conditions:
      - condition: trigger
        id:
        - Force Stop
      - condition: time
        after: '14:00:00'
        before: '21:00:00'
  actions:
  - alias: Early Start
    if:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - On early
      - alias: Confirm enough solar or power
        condition: or
        conditions:
        - condition: numeric_state
          entity_id: sensor.inverter_pv_power
          above: 1800
        - condition: numeric_state
          entity_id: sensor.grid_export
          above: 2000
      - condition: state
        entity_id: switch.pool_pumpe
        state: 'off'
      - condition: numeric_state
        entity_id: sensor.sun_solar_azimuth
        above: 95
      - condition: numeric_state
        entity_id: sensor.solcast_pv_forecast_prognose_heute
        above: 40
    then:
    - action: switch.turn_on
      metadata: {}
      data: {}
      target:
        entity_id: switch.pool_ventil_solar
    - action: script.turn_on
      metadata: {}
      target:
        entity_id: script.pool_secure_pulsetime_update
      data:
        variables:
          payload: '28895'
          lock_duration: 00:05:00
    - action: switch.turn_on
      metadata: {}
      data: {}
      target:
        entity_id: switch.pool_pumpe
    - delay:
        hours: 0
        minutes: 5
        seconds: 0
        milliseconds: 0
    - metadata: {}
      data:
        value: '{{ states(''sensor.pool_temperature_zigbee_temperature'') | float(0)
          | round(4) }}'
      target:
        entity_id: input_number.pool_temp_start
      action: input_number.set_value
    - delay:
        hours: 0
        minutes: 0
        seconds: 1
        milliseconds: 0
    - action: notify.duncan
      metadata: {}
      data:
        title: Pool Nacht Temperature Verlust
        data:
          tag: pool_loss_night
        message: 'Verlust: {{ (states(''input_number.pool_temp_start'') | float(0)
          - states(''input_number.pool_temp_stop'') | float(0)) | round(2) }}°C

          Jetzt: {{ states(''input_number.pool_temp_start'')}}°C'
  - alias: Force Start
    if:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - Force Start
      - condition: state
        entity_id: switch.pool_pumpe
        state: 'off'
    then:
    - action: switch.turn_on
      metadata: {}
      data: {}
      target:
        entity_id: switch.pool_ventil_solar
    - action: script.turn_on
      metadata: {}
      target:
        entity_id: script.pool_secure_pulsetime_update
      data:
        variables:
          payload: '21695'
          lock_duration: 00:05:00
    - action: switch.turn_on
      metadata: {}
      data: {}
      target:
        entity_id: switch.pool_pumpe
    - delay:
        hours: 0
        minutes: 5
        seconds: 0
        milliseconds: 0
    - metadata: {}
      data:
        value: '{{ states(''sensor.pool_temperature_zigbee_temperature'') | float(0)
          | round(4) }}'
      target:
        entity_id: input_number.pool_temp_start
      action: input_number.set_value
    - delay:
        hours: 0
        minutes: 0
        seconds: 1
        milliseconds: 0
    - action: notify.duncan
      metadata: {}
      data:
        title: Pool Nacht Temperature Verlust
        data:
          tag: pool_loss_night
        message: 'Verlust: {{ (states(''input_number.pool_temp_start'') | float(0)
          - states(''input_number.pool_temp_stop'') | float(0)) | round(2) }}°C

          Jetzt: {{ states(''input_number.pool_temp_start'')}}°C'
  - alias: Extend
    if:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - Extend
      - condition: state
        entity_id: binary_sensor.pool_extend_condition_met
        state:
        - 'on'
    then:
    - action: script.turn_on
      metadata: {}
      target:
        entity_id: script.pool_secure_pulsetime_update
      data:
        variables:
          payload: '{{ states(''input_number.pulsetimeactualvalue'') | int(0) + 460
            }}'
          lock_duration: 00:00:20
    - delay:
        hours: 0
        minutes: 0
        seconds: 0
        milliseconds: 500
    - if:
      - condition: numeric_state
        entity_id: counter.pool_extend_counter
        below: 1
      then:
      - metadata: {}
        data:
          value: '{{ states(''sensor.pool_temperature_zigbee_temperature'') | float(0)
            | round(4) }}'
        target:
          entity_id: input_number.pool_temp_stop
        action: input_number.set_value
      alias: Save Temperature before extend
    - metadata: {}
      data: {}
      target:
        entity_id: counter.pool_extend_counter
      action: counter.increment
    - delay:
        hours: 0
        minutes: 0
        seconds: 20
        milliseconds: 0
    else:
    - alias: Save Stop Temp when was still on
      if:
      - condition: and
        conditions:
        - condition: trigger
          id:
          - Extend
        - condition: state
          entity_id: switch.pool_pumpe
          state: 'on'
        - condition: state
          entity_id: binary_sensor.pool_extend_condition_met
          state:
          - 'off'
      then:
      - alias: Notify about temperature change caused by extend
        if:
        - condition: numeric_state
          entity_id: counter.pool_extend_counter
          above: 0
        - condition: state
          entity_id: input_boolean.stop_pool
          state: 'off'
        then:
        - action: notify.duncan
          metadata: {}
          data:
            message: 'Verlängerung um {{6 * states(''counter.pool_extend_counter'')|float(0)
              |round(0)}}min hat {{ (states(''sensor.pool_temperature_zigbee_temperature'')
              | float(0) - states(''input_number.pool_temp_stop'') | float(0)) | round(2)
              }}°C gebracht, der Pool ist bei {{ states(''sensor.pool_temperature_zigbee_temperature'')
              | float(0) }}°C

              '
            title: Pool Laufzeit Verlängerung
      - delay:
          hours: 0
          minutes: 0
          seconds: 0
          milliseconds: 100
      - metadata: {}
        data:
          value: '{{ states(''sensor.pool_temperature_zigbee_temperature'') | float(0)
            | round(4) }}'
        target:
          entity_id: input_number.pool_temp_stop
        action: input_number.set_value
      - action: input_boolean.turn_on
        metadata: {}
        data: {}
        target:
          entity_id: input_boolean.stop_pool
  - alias: Stopped
    if:
    - condition: trigger
      id:
      - Stopped
    then:
    - action: switch.turn_off
      metadata: {}
      data: {}
      target:
        entity_id: switch.smart_valve_controller_schalter_1
    - alias: Notify about temperature change caused by extend
      if:
      - condition: numeric_state
        entity_id: counter.pool_extend_counter
        above: 0
      - condition: state
        entity_id: input_boolean.stop_pool
        state: 'off'
      then:
      - action: notify.duncan
        metadata: {}
        data:
          message: 'Verlängerung hat {{ (states(''sensor.pool_temperature_zigbee_temperature'')
            | float(0) - states(''input_number.pool_temp_stop'') | float(0)) | round(2)
            }}°C gebracht, der Pool ist bei {{ states(''sensor.pool_temperature_zigbee_temperature'')
            | float(0) }}°C

            '
          title: Pool Laufzeit Verlängerung
    - delay:
        hours: 0
        minutes: 0
        seconds: 0
        milliseconds: 100
    - metadata: {}
      data:
        value: '{{ states(''sensor.pool_temperature_zigbee_temperature'') | float(0)
          | round(4) }}'
      target:
        entity_id: input_number.pool_temp_stop
      action: input_number.set_value
    - action: input_boolean.turn_on
      metadata: {}
      data: {}
      target:
        entity_id: input_boolean.stop_pool
    - delay:
        hours: 0
        minutes: 0
        seconds: 30
        milliseconds: 0
    - action: switch.turn_off
      metadata: {}
      data: {}
      target:
        entity_id: switch.pool_ventil_solar
  - alias: Force Stop
    if:
    - condition: trigger
      id:
      - Force Stop
    then:
    - alias: Save Stop Temp when was still on
      if:
      - condition: state
        entity_id: switch.pool_pumpe
        state:
        - 'on'
      then:
      - metadata: {}
        data:
          value: '{{ states(''sensor.pool_temperature_zigbee_temperature'') | float(0)
            }}'
        target:
          entity_id: input_number.pool_temp_stop
        action: input_number.set_value
    - action: switch.turn_off
      metadata: {}
      data: {}
      target:
        entity_id:
        - switch.pool_pumpe
        - switch.pool_ventil_solar
    - if:
      - condition: numeric_state
        entity_id: input_number.pulsetimeactualvalue
        above: 0
      then:
      - action: script.turn_on
        metadata: {}
        target:
          entity_id: script.pool_secure_pulsetime_update
        data:
          variables:
            payload: '0'
            lock_duration: 00:00:01
      alias: Adjust pulsetime to 0 if not already 0
    - delay:
        hours: 0
        minutes: 0
        seconds: 0
        milliseconds: 100
    - alias: Notify once for Temperature Change
      if:
      - condition: state
        entity_id: input_boolean.stop_pool
        state: 'on'
      then:
      - metadata: {}
        data: {}
        target:
          entity_id: counter.pool_extend_counter
        action: counter.reset
      - alias: Notify of Temperature Change
        action: notify.duncan
        data:
          title: Pool Temperature Veränderung
          data:
            tag: pool_temp_diff
          message: '{%- set start = states(''input_number.pool_temp_start'') | float(0)
            -%}

            {%- set stop = states(''input_number.pool_temp_stop'') | float(0) -%}

            Heute: {{ "%+.2f" | format(stop - start) }}°C

            Ende: {{ stop }}°C

            '
      - action: input_boolean.turn_off
        metadata: {}
        data: {}
        target:
          entity_id: input_boolean.stop_pool
  mode: queued
  max: 50
