- id: '1747048995618'
  alias: Coffee Machine Power Control
  description: "## ☕ Coffee Machine Power Control\n\n### \U0001F4CB **Automatic Smart-Plug
    Management for Coffee Machine**  \nMonitors the coffee machine's power draw and
    automatically powers the smart plug when an initial draw is detected. If the expected
    brewing power level isn't reached within **5 minutes**, the plug is turned off
    to avoid prolonged idle consumption (e.g., kettle-like standby or false triggers).\n\n---\n\n###
    ⏰ **Triggers**\n| Entity | Event |\n|--------|-------|\n| `sensor.kaffeemaschine_philips_energy_power`
    | Any state change (used to detect the initial power-up spike) |\n\n---\n\n###
    ✅ **Conditions**\n- Template ensures this automation only reacts when the sensor
    crosses from near-zero to a small positive draw (initial start):\n  - Detects
    transition: `from < 0.5` → `to > 0.5`\n\n---\n\n### \U0001F3AF **Actions / Workflow**\n\n1.
    **Initial detection**  \n   - When initial draw detected (template condition passes)
    → `switch.kaffeemaschine_tasmota` **turn_on** immediately.\n\n2. **Wait for brewing
    power**  \n   - Wait for `sensor.kaffeemaschine_energy_power` to rise **above
    50 W** (numeric_state trigger).\n   - Timeout: **5 minutes** (continue_on_timeout:
    true).\n\n3. **Fail-safe**  \n   - If the wait **timed out** (i.e., brewing threshold
    not reached within 5 minutes) → turn **off** `switch.kaffeemaschine_tasmota` to
    prevent idle power draw.\n\n---\n\n### \U0001F527 **Technical Specs**\n- **Trigger
    Sensor:** `sensor.kaffeemaschine_philips_energy_power`  \n- **Brewing Detection
    Sensor:** `sensor.kaffeemaschine_energy_power`  \n- **Controlled Device:** `switch.kaffeemaschine_tasmota`
    \ \n- **Initial-detect threshold:** ~**0.5 W** (transition from near-zero to >0.5)
    \ \n- **Brewing threshold:** **50 W** (tunable)  \n- **Timeout:** **5 minutes**
    \ \n- **Mode:** `queued` (max 3 concurrent) — allows overlapping short starts
    but limits runaway executions\n\n---\n\n### ⚡ **Notes & Best Practices**\n- Thresholds
    (`0.5` for initial start, `50` for brewing) and timeout (5 min) are tuned heuristics
    — adapt them to your machine's real measured behavior to avoid false positives/negatives.
    \ \n- Consider adding small hysteresis or a minimum-on-time if the coffee machine
    briefly toggles during brew to avoid rapid on/off cycles.  \n- Useful to log occasional
    timeouts to check whether the coffee machine often fails to reach brew power (could
    indicate a device issue).  \n- This keeps the smart plug honest: power it on when
    action begins, but don't let an accidental small draw sit forever.\n"
  triggers:
  - entity_id:
    - sensor.kaffeemaschine_philips_energy_power
    trigger: state
  conditions:
  - condition: template
    value_template: "{{ trigger.from_state.state | float(default=0) < 0.5 and\n   trigger.to_state.state
      | float(default=0) > 0.5 }}\n"
  actions:
  - target:
      entity_id:
      - switch.kaffeemaschine_tasmota
    action: switch.turn_on
    data: {}
  - wait_for_trigger:
    - trigger: numeric_state
      entity_id:
      - sensor.kaffeemaschine_energy_power
      above: 50
    timeout:
      hours: 0
      minutes: 5
      seconds: 0
      milliseconds: 0
    continue_on_timeout: true
  - if:
    - condition: template
      value_template: '{{ not wait.completed }}'
    then:
    - action: switch.turn_off
      metadata: {}
      data: {}
      target:
        entity_id: switch.kaffeemaschine_tasmota
  mode: queued
  max: 3
- id: '1747074473799'
  alias: Restart Add-ons at 01:00 daily
  description: "## \U0001F504 Daily Add-on Restart Automation\n\n### \U0001F4CB Purpose\nThis
    automation restarts a set of Home Assistant add-ons daily at **01:00 AM**. \nIts
    goal is to ensure the add-ons (repocket, earnapp, earnfm, packetstream, pawns,
    traffmonetizer) are refreshed, which helps recover from updates or minor issues.\n\n---\n\n###
    ⏱ Trigger\n- Daily at `01:00:00`.\n\n---\n\n### ✅ Conditions\n- No additional
    conditions; the restart occurs every day.\n\n---\n\n### \U0001F3AF Actions / Workflow\n1.
    Restart `repocket` add-on\n2. Wait 5 seconds\n3. Restart `earnapp` add-on\n4.
    Wait 5 seconds\n5. Restart `earnfm` add-on\n6. Wait 5 seconds\n7. Restart `packetstream`
    add-on\n8. Wait 5 seconds\n9. Restart `pawns` add-on\n10. Wait 5 seconds\n11.
    Restart `traffmonetizer` add-on\n\n---\n\n### \U0001F527 Technical Notes\n- Mode:
    `single` (prevents overlapping runs if the automation triggers again unexpectedly).\n-
    Uses short delays between add-on restarts to avoid potential conflicts or overload."
  triggers:
  - trigger: time
    at: 01:00:00
  conditions: []
  actions:
  - action: hassio.addon_restart
    metadata: {}
    data:
      addon: b3f9bc48_repocket
  - delay:
      hours: 0
      minutes: 0
      seconds: 5
      milliseconds: 0
  - action: hassio.addon_restart
    metadata: {}
    data:
      addon: b3f9bc48_earnapp
  - delay:
      hours: 0
      minutes: 0
      seconds: 5
      milliseconds: 0
  - action: hassio.addon_restart
    metadata: {}
    data:
      addon: b3f9bc48_earnfm
  - delay:
      hours: 0
      minutes: 0
      seconds: 5
      milliseconds: 0
  - action: hassio.addon_restart
    metadata: {}
    data:
      addon: b3f9bc48_packetstream
  - delay:
      hours: 0
      minutes: 0
      seconds: 5
      milliseconds: 0
  - action: hassio.addon_restart
    metadata: {}
    data:
      addon: b3f9bc48_pawns
  - delay:
      hours: 0
      minutes: 0
      seconds: 5
      milliseconds: 0
  - action: hassio.addon_restart
    metadata: {}
    data:
      addon: b3f9bc48_traffmonetizer
  mode: single
- id: '1747573166845'
  alias: Boiler Timer
  description: "## \U0001F4A7 Boiler Timer  \n\n### \U0001F4CB **Hot Water Circulation
    Control**  \nThis automation controls the hot water circulation pump (`switch.zirkulationspumpe_zigbee`)
    based on the `boiler_on_demand` timer.  \n\nWhen the timer becomes active, the
    pump is switched on. When the timer finishes and goes idle, the pump is turned
    off.  \n\n---\n\n### ⏰ **Triggers**  \n\n| Trigger Entity | Event / Condition
    | Trigger ID |\n|----------------|-----------------|------------|\n| `timer.boiler_on_demand`
    | State changes from `idle` → `active` | \"Start\" |\n| `timer.boiler_on_demand`
    | State changes from `active` → `idle` | \"Stop\" |\n\n> **Note:** The pump operation
    is fully synchronized with the timer.  \n\n---\n\n### ✅ **Conditions**  \n- None;
    all triggers execute the actions directly.  \n\n---\n\n### \U0001F3AF **Actions
    / Workflow**  \n\n1. **Start Trigger** (`timer.boiler_on_demand` → active)  \n
    \  - Turns on `switch.zirkulationspumpe_zigbee`  \n\n2. **Stop Trigger** (`timer.boiler_on_demand`
    → idle)  \n   - Turns off `switch.zirkulationspumpe_zigbee`  \n\n---\n\n### \U0001F527
    **Technical Specs**  \n- **Mode:** `single` (prevents overlapping executions)
    \ \n- **Device Controlled:** Hot water circulation pump (`switch.zirkulationspumpe_zigbee`)
    \ \n\n---\n\n### ⚡ **Notes / Best Practices**  \n- Ensures pump only runs when
    needed, saving energy.  \n- Simple and reliable control synced to the `boiler_on_demand`
    timer.  \n"
  triggers:
  - trigger: state
    entity_id:
    - timer.boiler_on_demand
    to: active
    from: idle
    id: Start
  - trigger: state
    entity_id:
    - timer.boiler_on_demand
    to: idle
    from: active
    id: Stop
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Start
      sequence:
      - action: switch.turn_on
        metadata: {}
        data: {}
        target:
          entity_id: switch.zirkulationspumpe_zigbee
    - conditions:
      - condition: trigger
        id:
        - Stop
      sequence:
      - action: switch.turn_off
        metadata: {}
        data: {}
        target:
          entity_id: switch.zirkulationspumpe_zigbee
  mode: single
- id: '1748530213618'
  alias: Allergie und Aufgaben Benachrichtigung
  description: "## \U0001F33F Allergie und Aufgaben Benachrichtigung  \n\n### \U0001F4CB
    **Daily Allergy & Task Reminder**  \nThis automation generates a daily notification
    that combines:  \n1. **Pollen information** for relevant allergens (Grass, Roggen,
    Hausstaubmilben, etc.).  \n2. **A random to-do task** from your personal task
    list (`todo.to_do_duncan`).  \n3. **A short, precise AI-generated message** with
    instructions or advice, in German.  \n\nThe goal is to provide a concise, actionable
    morning summary.  \n\n---\n\n### ⏰ **Triggers**  \n\n| Time | Event |\n|------|-------|\n|
    `08:05:00` | Daily scheduled reminder |\n\n---\n\n### ✅ **Conditions**  \n- None;
    runs automatically at the scheduled time.  \n\n---\n\n### \U0001F3AF **Workflow
    / Logic**  \n\n1. **Fetch To-Do Task**  \n   - Pulls tasks with status `needs_action`
    from `todo.to_do_duncan`.  \n   - Selects a random task to include in the notification.
    \ \n\n2. **Prepare AI Prompts**  \n   - **Pollen Prompt:** Includes today’s sensor
    values for key allergens.  \n     - Focused only on the **recommended medication
    amount** (base + additional) without explanation.  \n     - Keeps dosage conservative.
    \ \n     - Output format: `base amount: additional amount`.  \n   - **To-Do Prompt:**
    Includes the randomly selected task with helpful instructions, but keeps the task
    text unaltered.  \n   - **General Prompt:** Ensures AI output is concise, simple,
    precise, and limited to 300 tokens, in German.  \n\n3. **AI Processing**  \n   -
    Uses `conversation.google_generative_ai` to generate notification text.  \n   -
    Retries up to **10 times** if AI response contains failure phrases like:  \n     -
    `\"Unable to get response\"`  \n     - `\"Sorry, I had a problem getting a response
    from Google Generative AI.\"`  \n     - `\"The message got blocked due to content
    violations\"`  \n   - Includes a **5-second delay** between retries.  \n\n4. **Send
    Notification**  \n   - **On success:** sends AI-generated message to `notify.duncan`.
    \ \n   - **On repeated failure:** sends fallback message indicating the notification
    could not be generated.  \n\n---\n\n### \U0001F527 **Technical Specs**  \n- **To-Do
    Entity:** `todo.to_do_duncan`  \n- **Pollen Sensors Used:**  \n  - `sensor.pollenflug_graeser_111`
    \ \n  - `sensor.pollenflug_roggen_111`  \n  - `sensor.pollenflug_ambrosia_111`
    \ \n  - `sensor.pollenflug_beifuss_111`  \n  - `sensor.pollenflug_hasel_111`  \n
    \ - `sensor.pollenflug_esche_111`  \n- **AI Agent:** `conversation.google_generative_ai`
    \ \n- **Target Notification:** `notify.duncan`  \n- **Mode:** `single`  \n- **Retries:**
    Up to 10 attempts for AI response  \n- **Delay Between Retries:** 5 seconds  \n-
    **Token Limit:** 300 tokens max for AI message  \n\n---\n\n### ⚡ **Notes / Best
    Practices**  \n- The notification strictly separates allergy dosage recommendations
    from task instructions.  \n- Pollen information is minimized; the focus is on
    actionable recommendations.  \n- Task text remains **unaltered**, only helpful
    instructions are appended.  \n- The AI-generated message is designed for brevity
    and clarity in German, without Home Assistant internal details."
  triggers:
  - trigger: time
    at: 08:05:00
  conditions: []
  actions:
  - action: todo.get_items
    metadata: {}
    data:
      status: needs_action
    target:
      entity_id: todo.to_do_duncan
    response_variable: to_do_duncan
  - variables:
      prompt: 'Please generate text for a notification that will be sent to the users
        smartphone with helpful information. keep it simple and short but precise.
        simply provide the notification and nothing else! don''t use any Benachrichtigung
        or something like that just the message! if you like you can format it to
        make it more readable . Only provide the message and not more.


        - Your answers are not technical, and do not include Home Assistant internal
        details such as entities in responses.

        Provide your answer in German and make it precise and efficient as a German
        would like it. Bitte Duzen nicht Siezen limit your answer to at most 300 tokens.
        keep it simple and short. rember it is a notification so no ''notification:''
        or something like that.  Simply the text of it and not more. limit yourself
        to 300 Tokens! not one more!'
      pollen_prompt: 'I''m quite allergic to Grass pollen, Hausstaubmilben and Roggen.  Here
        are the today sensor values of these pollen and any other Gräser: {{ states(''sensor.pollenflug_graeser_111'')
        }}   Roggen: {{ states(''sensor.pollenflug_roggen_111'') }}  Ambrosia: {{
        states(''sensor.pollenflug_ambrosia_111'') }}  Beifuss {{ states(''sensor.pollenflug_beifuss_111'')
        }}  Hasel: {{ states(''sensor.pollenflug_hasel_111'') }}  Esche: {{ states(''sensor.pollenflug_esche_111'')
        }}  Legend: \nIndex\tDescription (in German) 0\tkeine Belastung 0.5\tkeine
        bis geringe Belastung 1\tgeringe Belastung 1.5\tgeringe bis mittlere Belastung
        2\tmittlere Belastung 2.5\tmittlere bis hohe Belastung 3\thohe Belastung\n

        Based on these, how much anti allergic medication should i take, my typical
        dose would be 2 tablets on bad days. My doctor says i can take as much as
        10 per day. Give me a base count i should take and suggest how many more i
        could take over the day. Keep it short, only tell the amount, and the amount
        i should take with me, based on the pollen pollution. dont tell me why, dont
        tell me what is happening in the air. like: 2 Tabletten, + 3 Tabletten. thats
        it not anymore, no argumentation or anything like that. dont even tell me
        what will bither me be it  grass or anything else keep the pollen stuff to
        a minimum.  also keep the amount to the lower end and dont tend to overshoot
        please. i dont want to build resistance against this anti allergy medication!!!
        keep in mind the schema: ''base amount: additional amount'' nothing else about
        pollen.'
      todo_prompt: 'Also heres a random task from my todo list:  {% set length = to_do_duncan[''todo.to_do_duncan''][''items'']
        | length %}  {{ to_do_duncan[''todo.to_do_duncan''][''items''][range(0,length)|random][''summary'']}}
        feel free to make suggestions on how to do this in today.  Also keep the task
        it self as is and only add helpful instructions or informations.  Also keep
        it in the language it is and dont translate it, the rest needs to be translated
        as requested later. Very important add the task as it is only the task and
        nothing more to the message youre generating.  Only add helpful instructions
        or informations never replace, translate or manipulate the task in any way!
        make good suggestions on how to do it '
  - repeat:
      sequence:
      - alias: Conversation Agent Notification Text
        data:
          text: '{{ pollen_prompt }}


            {{ todo_prompt }}


            {{ prompt }}'
          agent_id: conversation.google_generative_ai
        response_variable: agent_gemini
        action: conversation.process
      - delay:
          hours: 0
          minutes: 0
          seconds: 5
          milliseconds: 0
      until:
      - condition: template
        value_template: "{% set bad_phrases = [\n  \"Unable to get response\",\n  \"Sorry,
          I had a problem getting a response from Google Generative AI.\",\n  \"The
          message got blocked due to content violations\"\n] %}\n{{ (bad_phrases |
          select('in', agent_gemini.response.speech.plain.speech) | list | count ==
          0)\n   or repeat.index >= 10 }}"
  - choose:
    - conditions:
      - condition: template
        value_template: "{% set bad_phrases = [\n  \"Unable to get response\",\n  \"Sorry,
          I had a problem getting a response from Google Generative AI.\"\n] %}\n{{
          (bad_phrases | select('in', agent_gemini.response.speech.plain.speech) |
          list | count) > 0 }}"
      sequence:
      - action: notify.duncan
        metadata: {}
        data:
          title: '{{ now().strftime(''%A'') }} Allergie und Aufgaben'
          message: Heute konnte leider keine Nachricht generiert werden.
    default:
    - alias: Send notification
      data:
        title: '{{ now().strftime(''%A'') }} Allergie und Aufgaben'
        message: '{{ agent_gemini.response.speech.plain.speech }}'
      action: notify.duncan
  mode: single
- id: '1748638092151'
  alias: Restart Honeygain if Not Running
  description: This automation ensures that the Honeygain addon is restarted if it
    is not actively running. If the active device count drops below one, the automation
    will start or restart the addon and reload the relevant configuration entry, helping
    maintain continuous operation.
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.active_device_count
    below: 1
  - trigger: state
    entity_id:
    - sensor.active_device_count
    to: '0'
    for:
      hours: 0
      minutes: 1
      seconds: 0
  conditions: []
  actions:
  - action: hassio.addon_start
    metadata: {}
    data:
      addon: b3f9bc48_honeygain
  - action: hassio.addon_restart
    metadata: {}
    data:
      addon: b3f9bc48_honeygain
  - delay:
      hours: 0
      minutes: 0
      seconds: 10
      milliseconds: 0
  - action: homeassistant.reload_config_entry
    metadata: {}
    data: {}
    target:
      device_id: be21d8dbeedf2103ac5a484a78c7f3de
  mode: single
- id: '1748645782485'
  alias: Request Tasmota Rule States on HA Startup
  description: "## \U0001F4E1 Request Tasmota Rule States on HA Startup  \n\n### \U0001F4CB
    **Synchronize Tasmota Rules**  \nEnsures Home Assistant has the latest state of
    Tasmota rules on startup and periodically every 12 hours.  \nThis helps avoid
    mismatches between the device state and HA’s internal representation.  \n\n---\n\n###
    ⏰ **Triggers**  \n\n| Trigger | Event / Schedule |\n|---------|-----------------|\n|
    HA Startup | `homeassistant.start` |\n| Periodic Refresh | Every 12 hours (`time_pattern:
    hours=/12`) |\n\n---\n\n### ✅ **Conditions**  \n- None — the automation always
    runs on the triggers above.  \n\n---\n\n### \U0001F3AF **MQTT Publish Mapping**
    \ \n\n| Topic | Payload |\n|-------|---------|\n| `cmnd/tasmota_157F88/Rule1`
    | `\" \"` (requests current rule state) |\n| `cmnd/tasmota_157F88/Rule2` | `\"
    \"` (requests current rule state) |\n| `cmnd/tasmota_157F88/Rule3` | `\" \"` (requests
    current rule state) |\n| `cmnd/tasmota_18F373/Rule1`  | `\" \"` (requests current
    rule state) |\n\n> **Note:** Sending an empty payload to Tasmota rule topics requests
    the current state without modifying the rule itself.  \n\n---\n\n### \U0001F527
    **Technical Specs**  \n\n- **Mode:** `single` (prevents overlap during startup)
    \ \n- **MQTT QoS:** 0 (fire-and-forget)  \n- **Devices:** Tasmota devices `157F88`
    and `18F373`  \n- **Purpose:** Ensures rule states are synchronized in HA immediately
    and refreshed every 12 hours"
  triggers:
  - trigger: homeassistant
    event: start
  - trigger: time_pattern
    hours: /12
  actions:
  - action: mqtt.publish
    metadata: {}
    data:
      qos: 0
      topic: cmnd/tasmota_157F88/Rule1
      payload: ' '
  - action: mqtt.publish
    metadata: {}
    data:
      qos: 0
      topic: cmnd/tasmota_157F88/Rule2
      payload: ' '
  - action: mqtt.publish
    metadata: {}
    data:
      qos: 0
      topic: cmnd/tasmota_157F88/Rule3
      payload: ' '
  - action: mqtt.publish
    metadata: {}
    data:
      qos: 0
      topic: cmnd/tasmota_18F373/Rule1
      payload: ' '
- id: '1748906376880'
  alias: Notify for Honeygain Withdrawal
  description: Notifies when Honeygain balance is ready for withdrawal.
  triggers:
  - type: value
    device_id: be21d8dbeedf2103ac5a484a78c7f3de
    entity_id: 7b1b9754488d14a6c0f06e0320f7e33c
    domain: sensor
    metadata:
      secondary: false
    trigger: device
    above: 20
  conditions: []
