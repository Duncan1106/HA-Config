- id: '1727387566504'
  alias: Ganglicht Motion
  description: Controls hallway and staircase lights based on motion, ambient light
    levels, and includes reliability fixes for light states.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.aqara_p1_occupancy
    - binary_sensor.gang_bewegung_keller_tur_occupancy
    to: 'on'
    id: 'On motion '
  - trigger: state
    entity_id:
    - binary_sensor.treppenhaus_occupancy
    to: 'on'
    id: On motion oben
  - trigger: numeric_state
    entity_id:
    - sensor.light_brighness
    above: 0.1
    id: Sync on
  - trigger: numeric_state
    entity_id:
    - sensor.light_brighness
    id: Sync off
    below: 0.1
  - trigger: numeric_state
    entity_id:
    - sensor.aqara_p1_illuminance
    above: 200
    id: Light Above 200
  - trigger: numeric_state
    entity_id:
    - sensor.aqara_p1_illuminance
    above: 150
    id: Light Above 150
  - trigger: numeric_state
    entity_id:
    - sensor.aqara_p1_illuminance
    above: 100
    id: Light Above 100
  - trigger: numeric_state
    entity_id:
    - sensor.aqara_p1_illuminance
    above: 79
    id: Light Above 79
  - trigger: state
    entity_id:
    - light.ganglicht_zigbee_led
    to: 'off'
    for:
      hours: 0
      minutes: 5
      seconds: 0
    id: Turn off for sure 5min
  - trigger: state
    entity_id:
    - light.ganglicht_zigbee_led
    to: 'off'
    for:
      hours: 0
      minutes: 15
      seconds: 0
    id: Turn off for sure 15min
  conditions: []
  actions:
  - variables:
      lux_threshold: 80
      ganglicht_brightness: 100
      treppenlicht_brightness: 10
      ganglicht_brightness_oben: 75
      light_ganglicht: light.ganglicht_zigbee_led
      light_treppenlicht: light.esp32_c3_mini_treppenhaus_licht
      light_delay: '00:00:00.500'
  - alias: On motion
    if:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - 'On motion '
      - condition: numeric_state
        entity_id: sensor.aqara_p1_illuminance
        below: 80
        enabled: true
      - condition: numeric_state
        entity_id: sensor.light_brighness
        below: 0.1
    then:
    - action: light.turn_on
      metadata: {}
      data:
        brightness_pct: '{{ ganglicht_brightness }}'
      target:
        entity_id: '{{ light_ganglicht }}'
    - action: light.turn_off
      metadata: {}
      data: {}
      target:
        entity_id: '{{ light_treppenlicht }}'
  - alias: On motion oben
    if:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - On motion oben
      - condition: numeric_state
        entity_id: sensor.aqara_p1_illuminance
        below: 80
        enabled: true
      - condition: numeric_state
        entity_id: sensor.light_brighness
        below: 0.1
    then:
    - action: light.turn_on
      metadata: {}
      data:
        brightness_pct: '{{ treppenlicht_brightness }}'
      target:
        entity_id: '{{ light_treppenlicht }}'
    - delay: '{{ light_delay }}'
    - action: light.turn_on
      metadata: {}
      data:
        brightness_pct: '{{ ganglicht_brightness_oben }}'
      target:
        entity_id: '{{ light_ganglicht }}'
    - sequence:
      - wait_for_trigger:
        - trigger: state
          entity_id:
          - binary_sensor.aqara_p1_occupancy
          - binary_sensor.gang_bewegung_keller_tur_occupancy
          to: 'on'
        timeout:
          hours: 0
          minutes: 1
          seconds: 0
          milliseconds: 0
        continue_on_timeout: true
      - alias: wait for motion, if motion is detected downtairs, turn on ganglicht,
          and turn off treppenhasu licht if it should be off
        if:
        - condition: and
          conditions:
          - condition: template
            value_template: '{{ not wait.completed }}'
          - condition: numeric_state
            entity_id: sensor.light_brighness
            below: 0.1
          - condition: not
            conditions:
            - condition: or
              conditions:
              - type: is_motion
                condition: device
                device_id: 6aa53e57ab4128aa151491184dee696c
                entity_id: f186a7b86f51499f34c6a256d7b755a6
                domain: binary_sensor
              - type: is_motion
                condition: device
                device_id: 0c126cf3ac97892e31c219e4e479933d
                entity_id: 1b5c6eef919911c8e327a309ab828d22
                domain: binary_sensor
              - type: is_motion
                condition: device
                device_id: e89ead353b14ef9ce97038650a6e3bb4
                entity_id: a7cb7008da8607788c4b8d01cc73f4e0
                domain: binary_sensor
        then:
        - action: light.turn_off
          metadata: {}
          data: {}
          target:
            entity_id: '{{ light_ganglicht }}'
        - alias: if treppenhauslicht should be off, then turn off else do nothing
          if:
          - condition: numeric_state
            entity_id: sensor.light_brighness
            below: 0.1
          then:
          - action: light.turn_off
            metadata: {}
            data: {}
            target:
              entity_id: '{{ light_treppenlicht }}'
        else:
        - action: light.turn_on
          metadata: {}
          data:
            brightness_pct: '{{ ganglicht_brightness }}'
          target:
            entity_id: '{{ light_ganglicht }}'
        - alias: if treppenhauslicht should be off, then turn off else do nothing
          if:
          - condition: numeric_state
            entity_id: sensor.light_brighness
            below: 0.1
          then:
          - action: light.turn_off
            metadata: {}
            data: {}
            target:
              entity_id: '{{ light_treppenlicht }}'
      enabled: true
  - alias: Turn off after 5min
    if:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - 'On motion '
        - On motion oben
      - condition: numeric_state
        entity_id: sensor.light_brighness
        below: 0.1
    then:
    - action: script.5_min_turn_off_ganglicht
      metadata: {}
      data: {}
  - alias: On Light Sync
    if:
    - condition: trigger
      id:
      - Sync on
    - condition: numeric_state
      entity_id: sensor.light_brighness
      above: 0.1
    then:
    - repeat:
        sequence:
        - action: light.turn_on
          metadata: {}
          data:
            brightness_pct: '{{ ganglicht_brightness }}'
          target:
            entity_id: '{{ light_ganglicht }}'
        - delay: '{{ light_delay }}'
        until:
        - condition: state
          entity_id: light.ganglicht_zigbee_led
          state: 'on'
  - alias: Off Light Sync
    if:
    - condition: trigger
      id:
      - Sync off
    - condition: not
      conditions:
      - condition: or
        conditions:
        - condition: state
          entity_id: binary_sensor.aqara_p1_occupancy
          state: 'on'
        - condition: state
