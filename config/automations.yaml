- id: '1721083497910'
  alias: Fan for BKW AC Inverter
  description: "## \U0001F32C️ Fan Control for BKW Inverter\n\nThis automation controls
    the cooling fan for the inverter using a virtual\nlogic (documented here instead
    of code). The fan simply mirrors whether\n\"cooling is needed\" based on the following
    conditions:\n\n### \U0001F4CB **Cooling Logic**\n\nThe fan turns **ON** if:\n-
    Inverter is **ON** and MPPT temperature > 15 °C, OR\n- MPPT temperature > 25 °C
    (regardless of inverter state), OR\n- MPPT is more than 10 °C hotter than the
    outdoor ambient temperature.\n\nThe fan turns **OFF** otherwise:\n- Inverter is
    **OFF** and temperature below thresholds, OR\n- Temperature difference (delta)
    drops back below 10 °C.\n\n### \U0001F3AF **Automation Workflow**\n- Trigger:
    Any state change of `binary_sensor.epever_cooling_needed`\n- If `cooling_needed`
    = **on** → turn **ON** the fan  \n- If `cooling_needed` = **off** → turn **OFF**
    the fan  \n- Both actions use the retry script for reliability.\n\n### \U0001F527
    **Technical Specs**\n- Mode: `single`\n- Controlled entity: `switch.gartenhaus_usb_switch_zigbee_l2`
    (fan)\n- Cooling logic source: `binary_sensor.epever_cooling_needed`\n- Retry
    helper: `script.retry_action_with_backoff`\n\n### \U0001F501 **Retry Mechanism**\nBecause
    the fan is controlled by a ZigBee switch, each command is retried up\nto **10
    times** using a **linear backoff** (1–60 seconds) until the target\nstate (`on`
    or `off`) is confirmed.  \nThis ensures reliable operation even when ZigBee packets
    are occasionally lost.\n\n### ⚡ **Notes**\n- The temperature logic itself is handled
    inside the binary sensor.\n- This automation acts as a **reliable executor**,
    ensuring the fan state\n  always matches the cooling demand.\n- Hysteresis or
    adaptive deltas can be implemented within the binary sensor if needed.\n"
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.epever_cooling_needed
    to:
    - 'on'
    - 'off'
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: binary_sensor.epever_cooling_needed
        state: 'on'
      sequence:
      - action: script.retry_action_with_backoff
        metadata: {}
        data:
          action_domain: switch
          action_type: turn_on
          max_retries: 10
          max_delay: 60
          backoff_type: linear
          entity_id: switch.gartenhaus_usb_switch_zigbee_l2
          target_state: 'on'
          base_delay: 1
          notify_on_failure: false
    - conditions:
      - condition: state
        entity_id: binary_sensor.epever_cooling_needed
        state: 'off'
      sequence:
      - action: script.retry_action_with_backoff
        metadata: {}
        data:
          action_domain: switch
          action_type: turn_off
          max_retries: 10
          base_delay: 1
          max_delay: 60
          backoff_type: linear
          entity_id: switch.gartenhaus_usb_switch_zigbee_l2
          target_state: 'off'
          notify_on_failure: false
  mode: single
- id: '1721219665412'
  alias: Auto Pool PulseTime Adjust
  description: "  ## \U0001F30A Auto Pool PulseTime Adjust\n\n  ### \U0001F4CB **Purpose**\n
    \ Automatically adjusts the pool pump's pulse time based on changes in the\n  actual
    value (`input_number.pulsetimeactualvalue`).  \n  If the updated pulse time increases
    significantly or changes from zero, the\n  automation temporarily turns off the
    pump, publishes the adjusted pulse\n  time via MQTT, and turns the pump back on
    to safely apply the new setting.\n\n  ---\n\n  ### ⏰ **Triggers**\n  | Trigger
    Type | Entity | From | To |\n  |-------------|--------|------|----|\n  | PulseTime
    Change | `input_number.pulsetimeactualvalue` | Any | Any |\n\n  > **Note:** Triggers
    on any change to the pulse time value.\n\n  ---\n\n  ### ✅ **Conditions**\n  -
    The pool pump (`switch.pool_pumpe`) must be ON for adjustments to occur.\n\n  ---\n\n
    \ ### \U0001F3AF **Actions / Workflow**\n  **1. Adjust PulseTime**\n  - If the
    new pulse time > old pulse time AND (old != 0 OR new > 1000):\n      - Turn off
    pump  \n      - Wait 5 seconds  \n      - Publish new pulse time via MQTT  \n
    \     - Wait 5 seconds  \n      - Turn pump back on  \n\n  **2. Handle zero pulse
    time**\n  - If both old and new pulse times are zero:\n      - Turn off pump\n\n
    \ ---\n\n  ### \U0001F527 **Technical Specs**\n  - **Mode:** `single` (prevents
    overlapping adjustments)  \n  - **MQTT Topic:** `cmnd/tasmota_837238/pulsetime1`
    \ \n\n  ---\n\n  ### ⚡ **Best Practices / Notes**\n  - Keep the pump ON before
    testing the automation.  \n  - 5-second delays prevent abrupt changes and ensure
    safe updates.  \n  - Significant changes (>1000) trigger adjustments even from
    zero.  \n  - Action aliases help with clear logs and debugging."
  triggers:
  - entity_id:
    - input_number.pulsetimeactualvalue
    from:
    to:
    trigger: state
  conditions:
  - condition: state
    entity_id: switch.pool_pumpe
    state: 'on'
  actions:
  - if:
    - condition: template
      value_template: "{{ \n  (trigger.to_state.state | int(0)) > (trigger.from_state.state
        | int(0)) \n    and \n  ((trigger.from_state.state|int() != 0)\n    or\n  (trigger.to_state.state|int()
        > 1000 ))\n}}"
    then:
    - action: switch.turn_off
      metadata: {}
      data: {}
      target:
        entity_id: switch.pool_pumpe
    - delay:
        hours: 0
        minutes: 0
        seconds: 5
        milliseconds: 0
    - metadata: {}
      data:
        topic: cmnd/tasmota_837238/pulsetime1
        payload: '{{ trigger.from_state.state | int(0) }}'
      action: mqtt.publish
    - delay:
        hours: 0
        minutes: 0
        seconds: 5
        milliseconds: 0
    - action: switch.turn_on
      metadata: {}
      data: {}
      target:
        entity_id: switch.pool_pumpe
  - if:
    - condition: and
      conditions:
      - condition: template
        value_template: '{{ (trigger.to_state.state | int(0)) == 0 }}'
      - condition: template
        value_template: '{{ (trigger.from_state.state | int(0)) == 0 }}'
    then:
    - action: switch.turn_off
      metadata: {}
      data: {}
      target:
        entity_id: switch.pool_pumpe
  mode: single
