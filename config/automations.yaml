- id: '1716929359492'
  alias: Terrarium Climate Control
  description: "## \U0001F321️ Terrarium Climate Control Automation\n\n\n### \U0001F4CB
    Purpose\n\nCoordinates the **terrarium's heat lamp** and **humidifier** operation
    to\nmaintain stable climate conditions throughout the day.  \nHandles sunrise/sunset
    routines, periodic heat checks, and humidity control.\n\n\n---\n\n\n### ⏰ Triggers\n\n-
    **Every 5 minutes:** Regular daytime heat check  \n- **Humidifier sensor:** (`binary_sensor.luftbefeuchter_on_windows`)
    turns **on**  \n- **Sunrise:** Executes 30 minutes **after** sunrise  \n- **Sunset:**
    Executes 30 minutes **before** sunset  \n- **Humidifier switch:** (`switch.terrarium_tasmota3`)
    turns **off**\n  → keeps the boolean state synchronized  \n\n\n---\n\n\n### ✅
    Conditions\n\n- Operates **only during daytime** (between sunrise and sunset)
    \ \n- Requires **terrarium master switch**\n  (`input_boolean.terrarium_on`) to
    be **on**  \n\n\n---\n\n\n### \U0001F3AF Actions / Workflow\n\n**☀️ Daytime Heat
    Lamp Control**  \n- Runs `script.warmelampe` every 5 minute during daytime if
    the terrarium is active  \n\n**\U0001F4A7 Humidifier Control**  \n- Runs `script.luftbefeuchter`
    when the humidifier sensor turns on and the terrarium is active  \n\n**\U0001F305
    Sunrise Routine**  \n- Activates `script.terra_sunrise` 30 minutes after sunrise
    \ \n\n**\U0001F307 Sunset Routine**  \n- Activates `script.terra_sunset` 30 minutes
    before sunset  \n\n**\U0001F504 Humidifier Boolean Sync**  \n- When `switch.terrarium_zigbee_l1`
    turns off, resets\n  `input_boolean.luftbefeuchter_aktiv`\n  to maintain logical
    synchronization  \n\n\n---\n\n\n### \U0001F527 Technical Specs\n\n- **Mode:**
    `parallel`  \n- **Max concurrent runs:** 10  \n- Uses **`choose` blocks** to isolate
    day, sunrise, sunset, and sensor actions  \n- Integrates both **time-based** and
    **sensor-driven** logic for robust climate control\n"
  triggers:
  - minutes: /5
    id: '5'
    trigger: time_pattern
  - trigger: state
    entity_id:
    - binary_sensor.luftbefeuchter_on_windows
    to: 'on'
    id: Luftbefeuchter
  - trigger: sun
    event: sunrise
    offset: +00:30:00
    id: sunrise
  - trigger: sun
    event: sunset
    offset: -00:30:00
    id: sunset
  - trigger: state
    entity_id:
    - switch.terrarium_zigbee_l1
    id: Luftbefeuchter off
    to:
    - 'off'
  conditions:
  - condition: sun
    before: sunset
    after: sunrise
  actions:
  - choose:
    - conditions:
      - condition: and
        conditions:
        - condition: sun
          after: sunrise
          before: sunset
          before_offset: -01:00:00
          after_offset: +01:00:00
        - condition: state
          entity_id: input_boolean.terrarium_on
          state: 'on'
        - condition: trigger
          id:
          - '5'
        enabled: true
      sequence:
      - data: {}
        action: script.warmelampe
      alias: Wärmelampe
    - conditions:
      - condition: trigger
        id:
        - Luftbefeuchter
      - condition: state
        entity_id: input_boolean.terrarium_on
        state: 'on'
      - condition: state
        entity_id: switch.terrarium_zigbee_l1
        state:
        - 'off'
      sequence:
      - data: {}
        action: script.luftbefeuchter
      alias: Luftbefeuchter
    - conditions:
      - condition: trigger
        id:
        - sunrise
      sequence:
      - action: script.turn_on
        metadata: {}
        data: {}
        target:
          entity_id: script.terra_sunrise
      alias: Sunrise
    - conditions:
      - condition: trigger
        id:
        - sunset
      sequence:
      - action: script.turn_on
        metadata: {}
        data: {}
        target:
          entity_id: script.terra_sunset
      alias: Sunset
    - conditions:
      - condition: trigger
        id:
        - Luftbefeuchter off
      sequence:
      - action: input_boolean.turn_off
        metadata: {}
        data: {}
        target:
          entity_id: input_boolean.luftbefeuchter_aktiv
      alias: Luftbefeuchter Boolean Sync
  mode: parallel
  max: 10
- id: '1717951712000'
  alias: Pool Heating Control for Optimal Temperature
  description: "  ## ☀️ Pool Heating Control for Optimal Temperature\n\n  ### \U0001F4CB
    **Purpose**\n  Automatically manages the solar heating of the pool to maintain
    an optimal\n  temperature while maximizing energy efficiency. The automation evaluates\n
    \ current pool temperature, solar conditions, and time triggers to decide\n  when
    to turn the solar heating valves on or off.\n\n  ---\n\n  ### ⏰ **Triggers**\n
    \ | Trigger Type             | Details / Thresholds                         |\n
    \ |--------------------------|---------------------------------------------|\n
    \ | Solar Azimuth            | Between 95° and 100°                        |\n
    \ | Scheduled Time Checks    | 11:00 – 16:00 at hourly intervals          |\n
    \ | Pool Temperature Input   | Changes in `input_number.pool_temp_start`   |\n
    \ | Actual Pool Temperature  | Changes crossing `input_number.pool_heating_stop`
    |\n\n  ---\n\n  ### ✅ **Conditions**\n  - No global conditions; logic is handled
    in action-level checks.  \n  - Heating only activates when pool temperature is
    below thresholds.  \n  - Solar or power conditions (cloud coverage, solar radiation,
    total solar power) must indicate heating is beneficial.\n\n  ---\n\n  ### \U0001F3AF
    **Actions / Workflow**\n  **1. Solar Heating ON**\n  - Activated by time triggers
    or solar azimuth during the day.  \n  - Conditions to start:\n      - Pool temp
    below stop threshold.\n      - Start temp not too hot (>28.5 °C).  \n      - Adequate
    solar power, low cloud coverage, or sufficient radiation.  \n  - Steps:\n      -
    If first trigger of the day, open main solar valve.  \n      - Turn on smart valve
    controller.  \n      - Wait for any unavailable states to recover (max 1 minute).
    \ \n\n  **2. Solar Heating OFF**\n  - Triggered by temperature above stop threshold
    or poor solar conditions.  \n  - Steps:\n      - Turn off smart valve controller.
    \ \n\n  **3. Disable Solar Heating if Too Hot**\n  - Triggered if pool start temperature
    exceeds 28.5 °C.  \n  - Steps:\n      - Turn off smart valve controller and main
    solar valve.  \n      - Notify user via notification that heating is skipped due
    to high temperature.  \n\n  ---\n\n  ### \U0001F527 **Technical Specs**\n  - **Mode:**
    `single` (prevents overlapping operations)  \n  - Valves controlled:  \n      -
    `switch.pool_ventil_solar` (main solar valve)  \n      - `switch.smart_valve_controller_schalter_1`
    (smart valve controller)  \n  - Monitored entities: solar azimuth, pool temperature
    sensors, cloud coverage, solar power, solar radiation, and pool start temperature
    input.  \n\n  ---\n\n  ### ⚡ **Best Practices / Notes**\n  - Adjust temperature
    thresholds and solar power limits for your climate and pool setup.  \n  - Ensure
    all valve switches and sensors are correctly configured for reliable automation.
    \ \n  - Can be extended with additional safety checks, such as maximum daily heating
    duration or pump runtime limits."
  triggers:
  - entity_id:
    - sensor.sun_solar_azimuth
    above: 95
    id: 'On'
    below: 100
    trigger: numeric_state
    enabled: true
  - trigger: time
    at: '11:00:00'
    id: 'On'
  - trigger: time
    at: '12:00:00'
    id: 'On'
  - trigger: time
    at: '13:00:00'
    id: 'On'
  - trigger: time
    at: '14:00:00'
    id: 'On'
  - trigger: time
    at: '15:00:00'
    id: 'On'
  - trigger: time
    at: '16:00:00'
    id: 'On'
  - trigger: numeric_state
    entity_id:
    - sensor.esp32_c3_mini_pool_temperature_pool_temperature
    above: input_number.pool_heating_stop
    id: Off if to hot
  - entity_id:
    - input_number.pool_temp_start
    id: Off if to hot
    trigger: state
  conditions: []
  actions:
  - alias: Solar Heating ON
    if:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - 'On'
      - condition: not
        conditions:
        - condition: numeric_state
          entity_id: input_number.pool_temp_start
          above: 28.5
        alias: Start Temp not too hot
      - condition: numeric_state
        entity_id: sensor.esp32_c3_mini_pool_temperature_pool_temperature
        below: input_number.pool_heating_stop
      - condition: or
        conditions:
        - condition: numeric_state
          entity_id: weather.forecast_home
          attribute: cloud_coverage
          below: 50
        - condition: numeric_state
          entity_id: sensor.solar_power_total
          above: 8000
        - condition: numeric_state
          entity_id: sensor.gw1100a_solar_radiation
          above: 300
    then:
    - alias: If First Trigger of the day, then turn on switch
      if:
      - condition: state
        entity_id: switch.pool_ventil_solar
        state: 'off'
      then:
      - action: switch.turn_on
        metadata: {}
        data: {}
        target:
          entity_id: switch.pool_ventil_solar
      - wait_for_trigger:
        - trigger: state
          entity_id:
          - switch.smart_valve_controller_schalter_1
          from: unavailable
        timeout:
          hours: 0
          minutes: 1
          seconds: 0
          milliseconds: 0
