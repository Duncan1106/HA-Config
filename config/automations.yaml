- id: '1702826722550'
  alias: Presence DESK Controller
  description: This automation controls the power to your desk setup based on occupancy
    sensors. It turns off the laptop and monitor after a period of inactivity, while
    ensuring all connected devices are back on when someone arrives.
  triggers:
  - type: not_occupied
    device_id: 561b2fddd9cec3889faf18b8ccf214a0
    entity_id: b4a408441c08e8103747f1fac6b78b62
    domain: binary_sensor
    trigger: device
    id: laptop off
    for:
      hours: 0
      minutes: 30
      seconds: 0
  - type: not_occupied
    device_id: 561b2fddd9cec3889faf18b8ccf214a0
    entity_id: b4a408441c08e8103747f1fac6b78b62
    domain: binary_sensor
    trigger: device
    id: Monitor off
    for:
      hours: 0
      minutes: 0
      seconds: 20
  - trigger: state
    entity_id:
    - binary_sensor.schreibtisch
    to: 'on'
    for:
      hours: 0
      minutes: 0
      seconds: 20
    id: 'ON'
    alias: 20 sec there -> All ON
  - trigger: state
    entity_id:
    - binary_sensor.schreibtisch
    to: 'off'
    for:
      hours: 0
      minutes: 1
      seconds: 0
    id: Monitor off
    alias: 1 min await -> Monitor OFF
  - trigger: state
    entity_id:
    - binary_sensor.schreibtisch
    to: 'off'
    id: laptop off
    for:
      hours: 0
      minutes: 10
      seconds: 0
    alias: 10 min await -> Laptop OFF
  conditions: []
  actions:
  - alias: Laptop OFF
    if:
    - condition: trigger
      id:
      - laptop off
    - condition: state
      entity_id: binary_sensor.schreibtisch
      state: 'off'
    then:
    - action: switch.turn_off
      metadata: {}
      data: {}
      target:
        entity_id:
        - switch.schreibtisch_rechts_power_strip_l3
        - switch.schreibtisch_rechts_power_strip_l2
    - if:
      - condition: sun
        after: sunset
        before: sunrise
      then:
      - action: switch.turn_off
        metadata: {}
        data: {}
        target:
          entity_id:
          - switch.desk_paludarium_links_l2
          - switch.desk_paludarium_turm_rechts_l1
          - switch.desk_paludarium_links_l1
          - switch.desk_paludarium_turm_rechts_l3
      - delay:
          hours: 0
          minutes: 0
          seconds: 15
          milliseconds: 0
      - action: switch.turn_off
        metadata: {}
        data: {}
        target:
          entity_id:
          - switch.schreibtisch_rechts_power_strip_l5
          - switch.schreibtisch_links_power_strip_l1
  - alias: Monitor OFF
    if:
    - condition: trigger
      id:
      - Monitor off
    then:
    - action: switch.turn_off
      metadata: {}
      data: {}
      target:
        entity_id:
        - switch.schreibtisch_rechts_power_strip_l2
    - if:
      - condition: sun
        after: sunset
        before: sunrise
      then:
      - action: switch.turn_off
        metadata: {}
        data: {}
        target:
          entity_id:
          - switch.desk_paludarium_links_l1
          - switch.desk_paludarium_turm_rechts_l3
          - switch.desk_paludarium_links_l2
          - switch.desk_paludarium_turm_rechts_l1
      - delay:
          hours: 0
          minutes: 0
          seconds: 15
          milliseconds: 0
      - action: switch.turn_off
        metadata: {}
        data: {}
        target:
          entity_id:
          - switch.schreibtisch_rechts_power_strip_l5
          - switch.schreibtisch_links_power_strip_l1
  - alias: All ON
    if:
    - condition: and
      conditions:
      - condition: state
        entity_id: person.duncan
        state: home
      - condition: time
        after: 07:00:00
        before: '23:00:00'
      - condition: trigger
        id:
        - 'ON'
    then:
    - data: {}
      target:
        entity_id:
        - switch.schreibtisch_rechts_power_strip_l3
        - switch.schreibtisch_rechts_power_strip_l2
        - switch.schreibtisch_links_power_strip_l4
        - switch.schreibtisch_rechts_power_strip_l5
        - switch.schreibtisch_links_power_strip_l1
        - switch.desk_paludarium_links_l2
        - switch.desk_paludarium_turm_rechts_l1
        - switch.desk_paludarium_links_l1
        - switch.desk_paludarium_turm_rechts_l3
        - switch.desk_paludarium_turm_links_l2
        - switch.desk_paludarium_turm_links_l3
      action: switch.turn_on
    - delay:
        hours: 0
        minutes: 0
        seconds: 10
        milliseconds: 0
    - data: {}
