  alias: Dreame Clean EG if Awake
  description: This automation triggers a notification when the Dreame vacuum is set
    to clean the EG area while someone is awake. Users can choose to start the cleaning
    or have the vacuum return to the base.
  triggers:
  - entity_id: schedule.dreame_clean_up
    from: 'off'
    to: 'on'
    trigger: state
  actions:
  - action: notify.duncan
    metadata: {}
    data:
      title: '{{ notification_title }}'
      message: '{{ notification_message }}'
      data:
        tag: '{{ notification_title }}'
        persistent: '{{ persistent_notification }}'
        actions: "{% set titles = [action_1_title, action_2_title, action_3_title]
          %} {% set uris = [action_1_uri, action_2_uri, action_3_uri] %} {% set actions
          = namespace(data = []) %}\n{% for title in titles %}\n  {% if title|length
          %}\n    {% set uri = uris[loop.index - 1] %}\n    {% set action_name = \"action\"
          + loop.index|string %}\n    {% set action = {\n      \"action\": \"URI\"
          if uri|length else action_name,\n      \"title\": title,\n      \"uri\":
          uri \n      }\n    %}\n    {% set actions.data = actions.data + [action]
          %}\n  {% endif %}\n{% endfor %} {{ actions.data }}\n"
  - wait_for_trigger:
      event_type: mobile_app_notification_action
      trigger: event
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ wait.trigger.event.data.action == ''action1'' and wait.trigger.event.data.title
          == ''Dreame Clean-Up EG'' }}'
      sequence:
      - action: vacuum.start
        metadata: {}
        data: {}
        target:
          entity_id: vacuum.d9_max_gen_2
    - conditions:
      - condition: template
        value_template: '{{ wait.trigger.event.data.action == ''action2'' and wait.trigger.event.data.title
          == ''Dreame Clean-Up EG'' }}'
      sequence: []
    - conditions:
      - condition: template
        value_template: '{{ wait.trigger.event.data.action == ''action3'' and wait.trigger.event.data.title
          == ''Dreame Clean-Up EG''}}'
      sequence:
      - action: vacuum.return_to_base
        metadata: {}
        data: {}
        target:
          entity_id:
          - vacuum.d9_max_gen_2
    enabled: true
  mode: restart
  max_exceeded: silent
  variables:
    notify_device: 905c163dcc62544838edb078413723b2
    trigger_entity: schedule.dreame_clean_up
    notification_title: Dreame Clean-Up EG
    notification_message: ''
    persistent_notification: false
    action_1_title: Awake for EG
    action_1_uri: ''
    first_action:
    - action: vacuum.start
      metadata: {}
      data: {}
      target:
        entity_id: vacuum.d9_max_gen_2
    action_2_title: ''
    action_2_uri: ''
    second_action: []
    action_3_title: Not Awake
    action_3_uri: ''
    third_action:
    - action: vacuum.return_to_base
      metadata: {}
      data: {}
      target:
        entity_id:
        - vacuum.d9_max_gen_2
