- id: '1719828773465'
  alias: Speedtest using Speed test CLI Addon
  description: "## ⚡ Internet Speedtest Automation\n\n### \U0001F4CB Purpose\nRuns
    the **Speedtest CLI Add-on** every 2 hours to monitor internet connection performance.
    This helps track latency, download, and upload speeds over time for diagnostics
    and monitoring purposes.\n\n---\n\n### ⏱ Trigger\n- Every 2 hours using a time
    pattern (`hours: /2`).\n\n---\n\n### ✅ Conditions\n- None; the automation runs
    unconditionally every 2 hours.\n\n---\n\n### \U0001F3AF Actions / Workflow\n-
    Random Delay between 0 and 300 seconds\n- Executes the script with ID `script.1707895746671`,
    which triggers the Speedtest CLI add-on to perform a speed test.\n\n---\n\n###
    \U0001F527 Technical Notes\n- Mode: `single` ensures that a new test won’t start
    if the previous one is still running.\n- Can be extended to log results or send
    notifications if thresholds are exceeded."
  triggers:
