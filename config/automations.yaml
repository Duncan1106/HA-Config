- id: '1721083497910'
  alias: Fan for BkW AC Inverter
  description: "## \U0001F32C️ Fan for BKW AC Inverter Automation\n\n### \U0001F4CB
    **Purpose**\n\nThis automation manages a cooling fan for the BKW AC inverter.
    It ensures the inverter stays within safe operating temperatures by turning the
    fan on when the inverter heats up and off when it cools down.\n\n---\n\n### ⏰
    **Triggers**\n\n| Trigger Entity | Condition / Threshold | Trigger ID |\n|----------------|---------------------|------------|\n|
    `switch.bkw_outlet_1_bkw_outlet_1` | Turns off | Off |\n| `switch.bkw_outlet_1_bkw_outlet_1`
    | Turns on | On |\n| `sensor.esp32_c3_zero_epever_device_temperature` | Above
    15°C | On |\n| `sensor.esp32_c3_zero_epever_device_temperature` | Below 10°C |
    Off |\n| `sensor.esp32_c3_zero_epever_device_temperature` | Above 25°C | On |\n|
    `sensor.esp32_c3_zero_epever_device_temperature` | Above 30°C | On |\n\n> Note:
    Multiple temperature thresholds are used to ensure proactive and reactive cooling
    depending on the inverter’s load.\n\n---\n\n### ✅ **Conditions**\n\n- No global
    conditions. Trigger-specific checks ensure the fan only turns on when needed.\n\n---\n\n###
    \U0001F3AF **Actions / Workflow**\n\n1. **On Conditions**\n   - Activates the
    fan (`switch.gartenhaus_usb_switch_zigbee_l2`) if:\n     - The inverter is on
    and the temperature is above 15°C, or\n     - The temperature exceeds 25°C regardless
    of inverter state.\n\n2. **Off Conditions**\n   - Deactivates the fan when the
    inverter is turned off or the temperature drops below 10°C.\n\n---\n\n### \U0001F527
    **Technical Specs**\n\n- **Mode:** `single`  \n- **Entities Controlled:**  \n
    \ - `switch.gartenhaus_usb_switch_zigbee_l2` (fan)  \n- **Monitoring Entities:**
    \ \n  - Inverter power switch  \n  - Inverter temperature sensor\n\n---\n\n###
    ⚡ **Notes / Best Practices**\n\n- Ensures inverter longevity by preventing overheating.
    \ \n- Temperature thresholds can be fine-tuned depending on ambient conditions
    and fan efficiency.  \n- Simple logic keeps the automation lightweight and responsive.\n"
  triggers:
  - trigger: state
    entity_id:
    - switch.bkw_outlet_1_bkw_outlet_1
    to: 'off'
    id: 'Off'
  - trigger: state
    entity_id:
    - switch.bkw_outlet_1_bkw_outlet_1
    to: 'on'
    id: 'On'
  - trigger: numeric_state
    entity_id:
    - sensor.esp32_c3_zero_epever_device_temperature
    above: 15
    id: 'On'
  - trigger: numeric_state
    entity_id:
    - sensor.esp32_c3_zero_epever_device_temperature
    id: 'Off'
    below: 10
  - trigger: numeric_state
    entity_id:
    - sensor.esp32_c3_zero_epever_device_temperature
    above: 25
    id: 'On'
  - trigger: numeric_state
    entity_id:
    - sensor.esp32_c3_zero_epever_device_temperature
    above: 30
    id: 'On'
  conditions: []
  actions:
  - alias: 'On'
    if:
    - condition: or
      conditions:
      - condition: and
        conditions:
        - condition: trigger
          id:
          - 'On'
        - condition: numeric_state
          entity_id: sensor.esp32_c3_zero_epever_device_temperature
          above: 15
        - condition: state
          entity_id: switch.bkw_outlet_1_bkw_outlet_1
          state: 'on'
      - condition: and
        conditions:
        - condition: trigger
          id:
          - 'On'
        - condition: numeric_state
          entity_id: sensor.esp32_c3_zero_epever_device_temperature
          above: 25
    then:
    - action: switch.turn_on
      metadata: {}
      data: {}
      target:
        entity_id:
        - switch.gartenhaus_usb_switch_zigbee_l2
  - alias: 'Off'
    if:
    - condition: trigger
      id:
      - 'Off'
    then:
    - action: switch.turn_off
      metadata: {}
      data: {}
      target:
        entity_id: switch.gartenhaus_usb_switch_zigbee_l2
  mode: single
- id: '1721219665412'
  alias: Auto Pool PulseTime Adjust
  description: "  ## \U0001F30A Auto Pool PulseTime Adjust\n\n  ### \U0001F4CB **Purpose**\n
    \ Automatically adjusts the pool pump's pulse time based on changes in the\n  actual
    value (`input_number.pulsetimeactualvalue`).  \n  If the updated pulse time increases
    significantly or changes from zero, the\n  automation temporarily turns off the
    pump, publishes the adjusted pulse\n  time via MQTT, and turns the pump back on
    to safely apply the new setting.\n\n  ---\n\n  ### ⏰ **Triggers**\n  | Trigger
    Type | Entity | From | To |\n  |-------------|--------|------|----|\n  | PulseTime
    Change | `input_number.pulsetimeactualvalue` | Any | Any |\n\n  > **Note:** Triggers
    on any change to the pulse time value.\n\n  ---\n\n  ### ✅ **Conditions**\n  -
    The pool pump (`switch.pool_pumpe`) must be ON for adjustments to occur.\n\n  ---\n\n
    \ ### \U0001F3AF **Actions / Workflow**\n  **1. Adjust PulseTime**\n  - If the
    new pulse time > old pulse time AND (old != 0 OR new > 1000):\n      - Turn off
    pump  \n      - Wait 5 seconds  \n      - Publish new pulse time via MQTT  \n
    \     - Wait 5 seconds  \n      - Turn pump back on  \n\n  **2. Handle zero pulse
    time**\n  - If both old and new pulse times are zero:\n      - Turn off pump\n\n
    \ ---\n\n  ### \U0001F527 **Technical Specs**\n  - **Mode:** `single` (prevents
    overlapping adjustments)  \n  - **MQTT Topic:** `cmnd/tasmota_837238/pulsetime1`
    \ \n\n  ---\n\n  ### ⚡ **Best Practices / Notes**\n  - Keep the pump ON before
    testing the automation.  \n  - 5-second delays prevent abrupt changes and ensure
    safe updates.  \n  - Significant changes (>1000) trigger adjustments even from
    zero.  \n  - Action aliases help with clear logs and debugging."
  triggers:
  - entity_id:
    - input_number.pulsetimeactualvalue
    from:
    to:
    trigger: state
  conditions:
  - condition: state
    entity_id: switch.pool_pumpe
    state: 'on'
  actions:
  - if:
    - condition: template
      value_template: "{{ \n  (trigger.to_state.state | int(0)) > (trigger.from_state.state
        | int(0)) \n    and \n  ((trigger.from_state.state|int() != 0)\n    or\n  (trigger.to_state.state|int()
        > 1000 ))\n}}"
    then:
    - action: switch.turn_off
      metadata: {}
      data: {}
      target:
        entity_id: switch.pool_pumpe
    - delay:
        hours: 0
        minutes: 0
        seconds: 5
        milliseconds: 0
    - metadata: {}
      data:
        topic: cmnd/tasmota_837238/pulsetime1
        payload: '{{ trigger.from_state.state | int(0) }}'
      action: mqtt.publish
    - delay:
        hours: 0
        minutes: 0
        seconds: 5
        milliseconds: 0
    - action: switch.turn_on
      metadata: {}
      data: {}
      target:
        entity_id: switch.pool_pumpe
  - if:
    - condition: and
      conditions:
      - condition: template
        value_template: '{{ (trigger.to_state.state | int(0)) == 0 }}'
      - condition: template
        value_template: '{{ (trigger.from_state.state | int(0)) == 0 }}'
    then:
    - action: switch.turn_off
      metadata: {}
      data: {}
      target:
        entity_id: switch.pool_pumpe
  mode: single
- id: '1721345437021'
  alias: AnkerMake 3D Printer Auto Turn Off
  description: "## \U0001F5A8️ AnkerMake 3D Printer Auto Turn Off Automation\n\n###
    \U0001F4CB **Purpose**\n\nThis automation automatically powers off the AnkerMake
    3D printer to save energy and prevent unnecessary idle time once a print is finished
    or the printer is no longer drawing significant power.\n\n---\n\n### ⏰ **Triggers**\n\n|
    Trigger Entity | Condition / Threshold | Trigger ID |\n|----------------|---------------------|------------|\n|
    `sensor.ankermake_m5c_progress` | Above 99.9% for 15 minutes | Print Finished
    |\n| `sensor.ankermake_power` | Below 15W for 30 minutes | Idle Power |\n\n> Note:
    Ensures the printer only turns off after a print has completed or it has been
    idle for a significant duration.\n\n---\n\n### ✅ **Conditions**\n\n- No explicit
    conditions; triggers act directly on the printer switch.\n\n---\n\n### \U0001F3AF
    **Actions / Workflow**\n\n- Turns off the printer switch (`switch.ankermake_1`)
    when any of the above triggers occur.\n\n---\n\n### \U0001F527 **Technical Specs**\n\n-
    **Mode:** `single`  \n- **Device Controlled:** `switch.ankermake_1` (3D printer
    main switch)  \n- **Monitoring Entities:**  \n  - `sensor.ankermake_m5c_progress`
    (print progress)  \n  - `sensor.ankermake_power` (printer power draw)\n\n---\n\n###
    ⚡ **Notes / Best Practices**\n\n- Provides energy efficiency by automatically
    shutting down idle or finished prints.  \n- Delay thresholds prevent premature
    shutdown during normal printer operation.  \n- Can be adjusted for longer idle
    periods or different power thresholds depending on printer usage patterns.\n"
  triggers:
  - entity_id:
    - sensor.ankermake_m5c_progress
    for:
      hours: 0
      minutes: 15
      seconds: 0
    above: 99.9
    trigger: numeric_state
  - trigger: numeric_state
    entity_id:
    - sensor.ankermake_power
    for:
      hours: 0
      minutes: 30
      seconds: 0
    below: 15
  conditions: []
  actions:
  - action: switch.turn_off
    metadata: {}
    data: {}
    target:
      entity_id: switch.ankermake_1
  mode: single
- id: '1723670137701'
  alias: Reload Dreame Robots After Internet Recovery
  description: This automation reloads the Dreame Robots configuration after the internet
