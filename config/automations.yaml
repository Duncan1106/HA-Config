      action_domain: switch
      action_type: turn_on
      max_retries: 10
      base_delay: 5
      max_delay: 60
      backoff_type: linear
      notify_on_failure: true
      entity_id: switch.spulmaschine_tasmota
      target_state: 'on'
      notify_service: notify.duncan
  mode: single
- id: '1753267693777'
  alias: Mama fährt von der Arbeit los – Benachrichtigung
  description: Notify when the car likely starts driving home from work based on a
    drop in battery range, limited to once every 30 minutes.
  triggers:
  - trigger: state
    entity_id:
    - sensor.renault_zoe_batterieautonomie
