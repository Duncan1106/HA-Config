- id: '1716307846138'
  alias: Pool Control
  description: Controls the runtime of the pool and extends it if the weather is nice,
    based on the solar power available
  triggers:
  - hours: '9'
    minutes: /2
    id: On early
    trigger: time_pattern
  - hours: '10'
    minutes: /2
    id: On early
    trigger: time_pattern
  - hours: '11'
    minutes: /2
    id: Force Start
    trigger: time_pattern
    enabled: true
  - entity_id:
    - input_number.pulsetimeactualvalue
    below: 250
    id: Extend
    trigger: numeric_state
  - entity_id:
    - input_number.pulsetimeactualvalue
    below: 150
    id: Extend
    trigger: numeric_state
  - trigger: state
    entity_id:
    - switch.pool_pumpe
    to: 'off'
    from: 'on'
    id: Stopped
  - hours: '20'
    minutes: '*'
    id: Force Stop
    trigger: time_pattern
  conditions:
  - condition: or
    conditions:
    - alias: Early Start Condition
      condition: and
      conditions:
      - condition: time
        after: 09:30:00
        before: '10:59:00'
      - condition: device
        type: is_off
        device_id: 7f4653a91cd2ef69cb48aa494a983be8
        entity_id: 3d65e9bcde794b0149fb7d576edd1bb9
        domain: switch
    - condition: and
      conditions:
      - condition: device
        type: is_off
        device_id: 7f4653a91cd2ef69cb48aa494a983be8
        entity_id: 3d65e9bcde794b0149fb7d576edd1bb9
        domain: switch
      - condition: time
        after: '10:59:59'
        before: '12:00:00'
      alias: Force Start Condition
    - alias: 'Extend Condition '
      condition: numeric_state
      entity_id: input_number.pulsetimeactualvalue
      below: 401
    - condition: state
      entity_id: switch.pool_pumpe
      state: 'off'
      alias: Stopped Condition
    - condition: and
      conditions:
      - condition: time
        after: '14:00:00'
        before: '21:00:00'
      alias: Stop Condition
  actions:
  - alias: Early Start
    if:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - On early
      - alias: Confirm enough solar or power
        condition: or
        conditions:
        - condition: numeric_state
          entity_id: sensor.inverter_pv_power
          above: 1800
        - condition: numeric_state
          entity_id: sensor.grid_export
          above: 2000
      - condition: device
        type: is_off
        device_id: 7f4653a91cd2ef69cb48aa494a983be8
        entity_id: 3d65e9bcde794b0149fb7d576edd1bb9
        domain: switch
      - condition: numeric_state
        entity_id: sensor.sun_solar_azimuth
        above: 95
      - condition: numeric_state
        entity_id: sensor.solcast_pv_forecast_prognose_heute
        above: 40
    then:
    - action: automation.turn_off
      metadata: {}
      data:
        stop_actions: true
      target:
        entity_id: automation.pool_pulsetime_auto_adjust
    - alias: 8 hours
      metadata: {}
      data:
        topic: cmnd/tasmota_837238/pulsetime1
        payload: '28895'
      action: mqtt.publish
    - type: turn_on
      device_id: 7f4653a91cd2ef69cb48aa494a983be8
      entity_id: 3d65e9bcde794b0149fb7d576edd1bb9
      domain: switch
    - delay:
        hours: 0
        minutes: 5
        seconds: 0
        milliseconds: 0
    - metadata: {}
      data:
        value: '{{ states(''sensor.esp32_c3_mini_pool_temperature_pool_temperature'')
          | float(0) | round(4) }}'
      target:
        entity_id: input_number.pool_temp_start
      action: input_number.set_value
    - delay:
        hours: 0
        minutes: 0
        seconds: 1
        milliseconds: 0
    - action: notify.duncan
      metadata: {}
      data:
        title: Pool Night Temperature Loss
        data:
          tag: pool_loss_night
        message: '{{ (states(''input_number.pool_temp_start'') | float(0) - states(''input_number.pool_temp_stop'')
          | float(0)) | round(2) }}°C'
    - action: automation.turn_on
      metadata: {}
      data: {}
      target:
        entity_id: automation.pool_pulsetime_auto_adjust
  - alias: Force Start
    if:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - Force Start
      - condition: device
        type: is_off
        device_id: 7f4653a91cd2ef69cb48aa494a983be8
        entity_id: 3d65e9bcde794b0149fb7d576edd1bb9
        domain: switch
    then:
    - action: automation.turn_off
      metadata: {}
      data:
        stop_actions: true
      target:
        entity_id: automation.pool_pulsetime_auto_adjust
    - alias: 6 hours
      metadata: {}
      data:
        topic: cmnd/tasmota_837238/pulsetime1
        payload: '21695'
      action: mqtt.publish
    - type: turn_on
      device_id: 7f4653a91cd2ef69cb48aa494a983be8
      entity_id: 3d65e9bcde794b0149fb7d576edd1bb9
      domain: switch
    - delay:
        hours: 0
        minutes: 5
        seconds: 0
        milliseconds: 0
    - metadata: {}
      data:
        value: '{{ states(''sensor.esp32_c3_mini_pool_temperature_pool_temperature'')
          | float(0) | round(4) }}'
      target:
        entity_id: input_number.pool_temp_start
      action: input_number.set_value
    - delay:
        hours: 0
        minutes: 0
        seconds: 1
        milliseconds: 0
    - action: notify.duncan
      metadata: {}
      data:
        title: Pool Night Temperature Loss
        data:
          tag: pool_loss_night
        message: '{{ (states(''input_number.pool_temp_start'') | float(0) - states(''input_number.pool_temp_stop'')
          | float(0)) | round(2) }}°C'
    - action: automation.turn_on
      metadata: {}
      data: {}
      target:
        entity_id: automation.pool_pulsetime_auto_adjust
  - alias: Extend
    if:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - Extend
      - condition: numeric_state
        entity_id: sensor.inverter_pv_power
        above: 1200
      - condition: numeric_state
        entity_id: counter.pool_extend_counter
        below: 15
      - condition: numeric_state
        entity_id: input_number.pulsetimeactualvalue
        below: 410
      - condition: device
        type: is_on
        device_id: 7f4653a91cd2ef69cb48aa494a983be8
        entity_id: 3d65e9bcde794b0149fb7d576edd1bb9
        domain: switch
      - condition: state
        entity_id: input_boolean.stop_pool
        state: 'off'
    then:
    - action: automation.turn_off
      metadata: {}
      data:
        stop_actions: true
      target:
        entity_id: automation.pool_pulsetime_auto_adjust
    - delay:
        hours: 0
        minutes: 0
        seconds: 0
        milliseconds: 500
    - if:
      - condition: numeric_state
        entity_id: counter.pool_extend_counter
        below: 1
      then:
      - metadata: {}
        data:
          value: '{{ states(''sensor.esp32_c3_mini_pool_temperature_pool_temperature'')
            | float(0) | round(4) }}'
        target:
          entity_id: input_number.pool_temp_stop
        action: input_number.set_value
      alias: Save Temperature before extend
    - alias: Extend by 6min
      metadata: {}
      data:
        topic: cmnd/tasmota_837238/pulsetime1
        payload: '{{ states(''input_number.pulsetimeactualvalue'') | int(0) + 460
          }}'
      action: mqtt.publish
    - metadata: {}
      data: {}
      target:
        entity_id: counter.pool_extend_counter
      action: counter.increment
    - delay:
        hours: 0
        minutes: 0
        seconds: 20
        milliseconds: 0
    - action: automation.turn_on
      target:
        entity_id: automation.pool_pulsetime_auto_adjust
      data: {}
    else:
    - alias: Save Stop Temp when was still on
      if:
      - condition: and
        conditions:
        - condition: trigger
          id:
          - Extend
        - condition: device
          type: is_on
          device_id: 7f4653a91cd2ef69cb48aa494a983be8
          entity_id: 3d65e9bcde794b0149fb7d576edd1bb9
          domain: switch
      then:
      - alias: Notify about temperature change caused by extend
        if:
        - condition: numeric_state
          entity_id: counter.pool_extend_counter
          above: 0
        - condition: state
          entity_id: input_boolean.stop_pool
          state: 'off'
        then:
        - action: notify.duncan
          metadata: {}
          data:
            message: Extend caused {{ (states('sensor.esp32_c3_mini_pool_temperature_pool_temperature')
              | float(0) - states('input_number.pool_temp_stop') | float(0)) | round(2)
              }}°C
      - delay:
          hours: 0
          minutes: 0
          seconds: 0
          milliseconds: 100
      - metadata: {}
        data:
          value: '{{ states(''sensor.esp32_c3_mini_pool_temperature_pool_temperature'')
            | float(0) | round(4) }}'
        target:
          entity_id: input_number.pool_temp_stop
        action: input_number.set_value
      - action: input_boolean.turn_on
        metadata: {}
        data: {}
        target:
          entity_id: input_boolean.stop_pool
  - alias: Stopped
    if:
    - condition: trigger
      id:
      - Stopped
    then:
    - action: switch.turn_off
      metadata: {}
      data: {}
      target:
        entity_id: switch.smart_valve_controller_schalter_1
    - alias: Notify about temperature change caused by extend
      if:
      - condition: numeric_state
        entity_id: counter.pool_extend_counter
        above: 0
      - condition: state
        entity_id: input_boolean.stop_pool
        state: 'off'
      then:
      - action: notify.duncan
        metadata: {}
        data:
          message: Extend caused {{ (states('sensor.esp32_c3_mini_pool_temperature_pool_temperature')
            | float(0) - states('input_number.pool_temp_stop') | float(0)) | round(2)
            }}°C
    - delay:
        hours: 0
        minutes: 0
        seconds: 0
        milliseconds: 100
    - metadata: {}
      data:
        value: '{{ states(''sensor.esp32_c3_mini_pool_temperature_pool_temperature'')
          | float(0) | round(4) }}'
      target:
        entity_id: input_number.pool_temp_stop
      action: input_number.set_value
    - action: input_boolean.turn_on
      metadata: {}
      data: {}
      target:
        entity_id: input_boolean.stop_pool
  - alias: Force Stop
    if:
    - condition: trigger
      id:
      - Force Stop
    then:
    - if:
      - condition: device
        type: is_on
        device_id: 7f4653a91cd2ef69cb48aa494a983be8
        entity_id: 3d65e9bcde794b0149fb7d576edd1bb9
        domain: switch
      then:
      - metadata: {}
        data:
          value: '{{ states(''sensor.esp32_c3_mini_pool_temperature_pool_temperature'')
            | float(0) }}'
        target:
          entity_id: input_number.pool_temp_stop
        action: input_number.set_value
      alias: Save Stop Temp when was still on
    - type: turn_off
      device_id: 7f4653a91cd2ef69cb48aa494a983be8
      entity_id: 3d65e9bcde794b0149fb7d576edd1bb9
      domain: switch
    - alias: '0'
      metadata: {}
      data:
        topic: cmnd/tasmota_837238/pulsetime1
        payload: '0'
      action: mqtt.publish
    - metadata: {}
      data: {}
      target:
        entity_id: counter.pool_extend_counter
      action: counter.reset
    - delay:
        hours: 0
        minutes: 1
        seconds: 0
        milliseconds: 0
    - if:
      - condition: state
        entity_id: input_boolean.stop_pool
        state: 'on'
      then:
      - alias: 'Notify of Temperature Change '
        if:
        - condition: numeric_state
          entity_id: input_number.pool_temp_stop
          above: input_number.pool_temp_start
        then:
        - action: notify.duncan
          metadata: {}
          data:
            title: Pool Temperature Change
            data:
              tag: pool_diff_plus
            message: + {{ (states('input_number.pool_temp_stop') | float(0) - states('input_number.pool_temp_start')
              | float(0)) | round(2) }}°C
        else:
        - action: notify.duncan
          metadata: {}
          data:
            title: Pool Temperature Change
            data:
              tag: pool_diff_minus
            message: '- {{ (states(''input_number.pool_temp_start'') | float(0) -
              states(''input_number.pool_temp_stop'') | float(0)) | round(2) }}°C'
    - action: input_boolean.turn_off
      metadata: {}
      data: {}
      target:
        entity_id: input_boolean.stop_pool
  mode: queued
  max: 50
