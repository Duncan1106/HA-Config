- id: '1749115504854'
  alias: Adjust Addon Status based on AnkerMake M5C Usage
  description: "## ⚡ Adjust Addon Status based on AnkerMake M5C Usage\n\n### \U0001F4CB
    **Purpose**\n\nThis automation manages the Ankerctl Home Assistant addon based
    on the usage of the AnkerMake M5C 3D printer.  \nIt ensures the addon runs only
    when the printer is active, reducing unnecessary resource usage.\n\n---\n\n###
    ⏰ **Triggers**\n\n| Trigger Entity       | State Change | Trigger ID |\n|---------------------|--------------|------------|\n|
    `switch.ankermake_1` | `→ on`   | \"ON\"       |\n| `switch.ankermake_1` | `→
    off`   | \"OFF\"      |\n\n> **Note:** The triggers monitor the printer's main
    switch, starting or stopping the addon accordingly.  \n\n---\n\n### ✅ **Conditions**\n\n-
    None. The automation acts directly on the switch triggers.  \n\n---\n\n### \U0001F3AF
    **Actions / Workflow**\n\n1. **Printer Turned On (\"ON\")**  \n   - Triggered
    when `switch.ankermake_1` changes to `\"on\"`.  \n   - Action: Starts the `cff83567_ankerctl`
    addon.  \n\n2. **Printer Turned Off (\"OFF\")**  \n   - Triggered when `switch.ankermake_1`
    changes to `\"off\"`.  \n   - Action: Stops the `cff83567_ankerctl` addon.  \n\n>
    **Rationale:** Keeps the addon running only when needed, preventing unnecessary
    load on Home Assistant.  \n\n---\n\n### \U0001F527 **Technical Specs**\n\n- **Addon
    Target:** `cff83567_ankerctl`  \n- **Mode:** `single` (ensures only one instance
    runs at a time; prevents overlapping addon start/stop commands)  \n\n---\n\n###
    ⚡ **Notes / Best Practices**\n\n- This approach is ideal for addons tied to specific
    hardware usage.  \n- Ensures efficient resource management on your Home Assistant
    system.  \n- Can be extended to other devices by duplicating triggers and adjusting
    the addon target."
  triggers:
  - trigger: state
    entity_id:
    - switch.ankermake_1
    to: 'on'
    id: 'ON'
  - trigger: state
    entity_id:
    - switch.ankermake_1
    to: 'off'
    id: 'OFF'
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - 'ON'
      sequence:
      - action: hassio.addon_start
        metadata: {}
        data:
          addon: cff83567_ankerctl
      alias: Start Ankerctl Addon When Printer Turned On
    - conditions:
      - condition: trigger
        id:
        - 'OFF'
      sequence:
      - action: hassio.addon_stop
        metadata: {}
        data:
          addon: cff83567_ankerctl
      alias: Stop Ankerctl Addon When Printer Turned Off
  mode: single
- id: '1749622712645'
  alias: Tablet Battery Status Alerts
  description: Sends notifications at battery thresholds (40%, 30%, 20%, 10%) and
    clears when charging above 40%, with flapping protection and automatic charging
    process restart.
  triggers:
  - entity_id:
    - sensor.lenovo_tab_p11_batterie
    - sensor.lenovo_tb_j606f_battery_level
    below: 39
    trigger: numeric_state
  - entity_id:
    - sensor.lenovo_tab_p11_batterie
    - sensor.lenovo_tb_j606f_battery_level
    below: 30
    trigger: numeric_state
  - entity_id:
    - sensor.lenovo_tab_p11_batterie
    - sensor.lenovo_tb_j606f_battery_level
    below: 20
    trigger: numeric_state
  - entity_id:
    - sensor.lenovo_tab_p11_batterie
    - sensor.lenovo_tb_j606f_battery_level
    below: 10
    trigger: numeric_state
  - trigger: numeric_state
    entity_id:
    - sensor.lenovo_tab_p11_batterie
    - sensor.lenovo_tb_j606f_battery_level
    above: 40
    id: Above_40
  conditions:
  - condition: or
    conditions:
    - condition: template
      value_template: "{{ trigger.from_state is not none and\n   (trigger.from_state.state
        | float(100)) > (trigger.to_state.state | float(0)) }}\n"
      alias: Check if Batters is dropping
    - condition: trigger
      id:
      - Above_40
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ (trigger.to_state.state | float(0)) < 11 }}'
      sequence:
      - data:
          title: "\U0001F534 Tablet Battery Critical!"
          message: 'Lenovo Tab P11 battery is at {{ trigger.to_state.state }}%. Plug
            it in now or check if it’s charging properly!

            '
          data:
            tag: lenovo_p11_battery_warning
        action: notify.duncan
      - action: script.restart_charging_process
        metadata: {}
        data: {}
      alias: Battery below 10
    - conditions:
      - condition: template
        value_template: '{{ (trigger.to_state.state | float(0)) < 21 }}'
      sequence:
      - data:
          title: "\U0001F7E0 Tablet Battery Low"
          message: 'Lenovo Tab P11 battery dropped to {{ trigger.to_state.state }}%.
            Might be an issue with the charger or cable.

            '
          data:
            tag: lenovo_p11_battery_warning
        action: notify.duncan
      - action: script.restart_charging_process
        metadata: {}
        data: {}
      alias: Battery below 20
    - conditions:
      - condition: template
        value_template: '{{ (trigger.to_state.state | float(0)) < 31 }}'
      sequence:
      - data:
          title: "\U0001F7E1 Tablet Battery Getting Low"
          message: 'Lenovo Tab P11 is now at {{ trigger.to_state.state }}%. Consider
            checking if it''s still charging as expected.

            '
          data:
            tag: lenovo_p11_battery_warning
        action: notify.duncan
      - action: script.restart_charging_process
        metadata: {}
        data: {}
      alias: Battery below 30
    - conditions:
      - condition: trigger
        id:
        - Above_40
      - condition: template
        value_template: "{{ trigger.from_state is not none and\n   (trigger.from_state.state
          | float(0)) < (trigger.to_state.state | float(100)) }}\n   "
      sequence:
      - data:
          data:
            tag: lenovo_p11_battery_warning
          message: clear_notification
        action: notify.duncan
      alias: Remove Notification if charging and above 40
    default:
    - data:
        title: ⚠️ Tablet Battery Notice
        message: 'Lenovo Tab P11 battery is at {{ trigger.to_state.state }}%. Might
          need attention soon.

          '
        data:
          tag: lenovo_p11_battery_warning
      action: notify.duncan
  mode: single
- id: '1749768402037'
  alias: Gang Light Brightness Control
  description: "## \U0001F6B6‍♂️ Gang Light Brightness Control  \n\n### \U0001F4CB
    **Adaptive Stairway Illumination**  \nAutomatically synchronizes the stairway
    light with the brightness sensor value. When brightness is above zero, the light
    adjusts accordingly. If brightness drops to zero, the light switches off — ensuring
    optimal stairway lighting at all times.  \n\n---\n\n### \U0001F506 **Turn ON Trigger**
    \ \n| Condition | Threshold | Note |\n|-----------|-----------|------|\n| **Brightness
    Change** | `sensor.light_brighness` > **0** | Any increase or decrease above zero
    triggers adjustment |\n\n---\n\n### \U0001F319 **Turn OFF Trigger**  \n| Condition
    | Threshold | Note |\n|-----------|-----------|------|\n| **Brightness Sync**
    | `sensor.light_brighness` < **1** | Turns off light if brightness goes to zero
    |\n\n---\n\n### \U0001F3AF **Smart Logic**  \n\n#### **\U0001F506 ON Action**
    \ \n- Checks if light is **OFF** or brightness is **different** from sensor value
    \ \n- If true → `light.turn_on` with brightness percentage = sensor value  \n\n####
    **\U0001F319 OFF Action**  \n- If brightness sensor changes to **0** from a previous
    nonzero value  \n- Then → `light.turn_off`  \n\n---\n\n### \U0001F527 **Technical
    Specs**  \n- **Target:** `light.esp32_c3_mini_treppenhaus_licht`  \n- **Sensor:**
    `sensor.light_brighness`  \n- **Mode:** `single` (one run at a time)  \n- **Conversion:**
    Sensor value (%) × 2.55 → HA light brightness scale"
  triggers:
  - trigger: state
    entity_id:
    - sensor.light_brighness
    id: Change
  - trigger: numeric_state
    entity_id:
    - sensor.light_brighness
    below: 1
    id: Zero
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Change
      - condition: numeric_state
        entity_id: sensor.light_brighness
        above: 0
      sequence:
      - if:
        - condition: or
          conditions:
          - condition: state
            entity_id: light.esp32_c3_mini_treppenhaus_licht
            state: 'off'
          - condition: template
            value_template: '{% set sensor_brightness = (states(''sensor.light_brighness'')
              | float(0) * 2.55) | int(0) %}

              {% set current = state_attr(''light.esp32_c3_mini_treppenhaus_licht'',
              ''brightness'') | int(0) %}

              {{ sensor_brightness != current }}'
        then:
        - action: light.turn_on
          metadata: {}
          data:
            brightness_pct: '{{ states(''sensor.light_brighness'') | int(0) }}'
          target:
            entity_id: light.esp32_c3_mini_treppenhaus_licht
      alias: On with specified Brighness
    - conditions:
      - condition: trigger
        id:
        - Zero
      - condition: template
        value_template: '{{ trigger.from_state.state | int(1) > 0 }}'
      sequence:
      - action: light.turn_off
        metadata: {}
        data: {}
        target:
          entity_id: light.esp32_c3_mini_treppenhaus_licht
      alias: Off if Brightness changes to Zero
  mode: single
- id: '1749938010439'
  alias: Reset Deye Battery Capacity closer to real
  description: "## \U0001F50B Reset Deye Battery Capacity  \n\n### \U0001F4CB **Keeping
    SOC Estimation in Check**  \nThe Deye inverter tends to overshoot its calculated
    battery capacity. This automation corrects the capacity estimate by making small
    adjustments around the true SOC reported by the BMS, keeping values closer to
    reality.  \n\n---\n\n### ⏰ **Triggers**  \n| Condition | Entity/Event | Threshold
    |\n|-----------|--------------|-----------|\n| **Daily Reset** | `sunset` | Exact
    time |\n| **Midnight Reset** | `00:00:00` | Exact time |\n| **SOC Full** | `sensor.felicity_ess_soc_avg`
    | Above **99.9%** |\n\n---\n\n### ✅ **Conditions**  \n- `sensor.inverter_battery_corrected_capacity`
    > `number.inverter_battery_capacity`  \n- `sensor.felicity_ess_soc_avg` > **99%**
    \ \n\n---\n\n### \U0001F3AF **Correction Logic**  \n\n#### **Step 1**  \n- Increase
    inverter’s capacity value by **+1**  \n\n#### **Step 2**  \n- Wait **10s**  \n\n####
    **Step 3**  \n- Decrease inverter’s capacity value by **-1**  \n\n---\n\n### \U0001F527
    **Technical Specs**  \n- **Target Number Entity:** `number.inverter_battery_capacity`
    \ \n- **Sensors Used:**  \n  - `sensor.inverter_battery_corrected_capacity`  \n
    \ - `sensor.felicity_ess_soc_avg`  \n- **Mode:** `single` (no overlap)  \n- **Adjustment
    Logic:** ±1 step correction with short delay"
  triggers:
  - trigger: sun
    event: sunset
    offset: 0
  - trigger: time
    at: 00:00:00
  - trigger: numeric_state
    entity_id:
    - sensor.felicity_ess_soc_avg
    above: 99.9
  conditions:
  - condition: numeric_state
    entity_id: sensor.inverter_battery_corrected_capacity
    above: number.inverter_battery_capacity
  - condition: numeric_state
    entity_id: sensor.felicity_ess_soc_avg
    above: 99
  actions:
  - action: number.set_value
    metadata: {}
    data:
      value: '


        {{ states(''number.inverter_battery_capacity'')|int(500) + 1 }}'
    target:
      entity_id: number.inverter_battery_capacity
  - delay:
      hours: 0
      minutes: 0
      seconds: 10
      milliseconds: 0
  - action: number.set_value
    metadata: {}
    data:
      value: '


        {{ states(''number.inverter_battery_capacity'')|int(500) - 1 }}'
    target:
      entity_id: number.inverter_battery_capacity
  mode: single
- id: '1750196437853'
  alias: Octopus night usage, turn battery off
  description: ''
  triggers:
  - trigger: time
    at: 00:00:00
    id: Off_time
    enabled: true
  - trigger: time
    at: 05:00:00
    id: On_time
    enabled: true
