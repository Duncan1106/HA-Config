- id: '1738339387324'
  alias: Orangina Lamp Light
  description: "# \U0001F34A **Orangina Lamp Light**\n\n### \U0001F4CB Intelligent
    Ambient Lighting Control\n\nThis automation provides a robust, state-synchronized
    lighting management system for the **Orangina Lamp**. Its high-level intent is
    to align lamp states with environmental brightness levels and specific time-of-day
    constraints.\n\nThe operational strategy utilizes a \"sync-and-verify\" approach,
    ensuring the physical device reflects the desired logic even in unstable network
    conditions. Reliability is maintained through a high-availability **backoff retry
    script**, which handles command failures and provides administrative notifications
    if the hardware becomes unresponsive.\n\n---\n\n### Trigger Overview Table\n\n|
    Type | Entity / Condition | ID | Purpose |\n| :--- | :--- | :--- | :--- |\n| Numeric
    State | **sensor.light_brighness** | `On` | Activates lamp when brightness rises
    above **1** (30s/60s checks). |\n| Time | **23:00:00** | `Dimm` | Initiates late-evening
    dimming phase. |\n| Time | **01:00:00** | `Off end time` | Triggers the hard-cutoff
    for nighttime shutdown. |\n| Numeric State | **sensor.light_brighness** | `Off
    sync` | Deactivates lamp when brightness falls below **1** (30s/60s checks). |\n\n---\n\n###
    Operational Logic Sections\n\n#### Daytime & Ambient Sync\n* **Purpose**: Ensures
    the lamp remains **Off** during daylight hours or when external brightness is
    sufficient.\n* **Logic Overview**: Triggered by **Off sync** (brightness < 1).
    Condition restricted to the window between **04:00** and **20:00**.\n* **Effect**:
    Switches **light.orangina_local** to **off**.\n\n#### Late Evening (Dimmed)\n*
    **Purpose**: Transitions the lamp to a low-power state for late-night ambiance.\n*
    **Logic Overview**: Triggered at exactly **23:00**. \n* **Effect**: Sets **light.orangina_local**
    brightness to **40%**.\n\n#### Nighttime Shutdown\n* **Purpose**: Forces the lamp
    off during late night/early morning hours.\n* **Logic Overview**: Triggered by
    **Off end time** (01:00). Validated by a safety time window between **00:59**
    and **04:00**.\n* **Effect**: Switches **light.orangina_local** to **off**.\n\n####
    Active Illumination\n* **Purpose**: Activates full brightness when the environment
    requires light.\n* **Logic Overview**: Triggered by **On** (brightness > 1) for
    a sustained period of 30-60 seconds.\n* **Effect**: Sets **light.orangina_local**
    to **on** at **100%** brightness.\n\n---\n\n### Technical Overview\n\n* **Automation
    Mode**: `queued` (Max 10)\n* **Execution Method**: `script.retry_action_with_backoff`\n*
    **Key Inputs**: **sensor.light_brighness**\n* **Controlled Entities**: **light.orangina_local**\n*
    **Safety Mechanisms**:\n    * **Max Retries**: 10 attempts per state change.\n
    \   * **Exponential Backoff**: Base delay of 5s, scaling to 60s.\n    * **Failure
    Notification**: Direct alert via **notify.duncan** if target state is not reached.\n\n---\n\n###
    \U0001F4A1 Notes\n\n* **Redundant Triggers**: The use of two duration thresholds
    (30s and 60s) for the same brightness sensor acts as a fail-safe to ensure the
    state change is caught even if the first event is missed.\n* **Target State Verification**:
    The automation does not just send a command; it passes a `target_state` to the
    retry script, ensuring the physical lamp's state matches the logic's intent before
    the execution finishes.\n* **Time-Fence Security**: The \"Off\" logic includes
    strict time windows (e.g., **00:59 - 04:00**) to prevent accidental shutdowns
    during unplanned sensor fluctuations outside of the intended hours."
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.light_brighness
    for:
      hours: 0
      minutes: 0
      seconds: 30
    above: 1
    id: 'On'
  - trigger: numeric_state
    entity_id:
    - sensor.light_brighness
    for:
      hours: 0
      minutes: 1
      seconds: 0
    above: 1
    id: 'On'
  - trigger: time
    at: '23:00:00'
    id: Dimm
  - trigger: time
    at: 00:00:00
    id: Dimm 2
  - trigger: time
    at: 01:00:00
    id: Off end time
  - trigger: numeric_state
    entity_id:
    - sensor.light_brighness
    for:
      hours: 0
      minutes: 10
      seconds: 0
    below: 1
    id: Off sync
  - trigger: numeric_state
    entity_id:
    - sensor.light_brighness
    for:
      hours: 0
      minutes: 11
      seconds: 0
    below: 1
    id: Off sync
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - 'On'
      sequence:
      - action: script.retry_action_with_backoff_power_monitoring
        metadata: {}
        data:
          action_domain: light
          action_type: turn_on
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: simple
          notify_on_failure: true
          notify_service: notify.duncan
          target_state: 'on'
          entity_id: light.orangina_local
          service_data: '{"brightness_pct":"100"}'
      alias: 'On'
    - conditions:
      - condition: trigger
        id:
        - Dimm
      sequence:
      - action: script.retry_action_with_backoff_power_monitoring
        metadata: {}
        data:
          action_domain: light
          action_type: turn_on
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: simple
          notify_on_failure: true
          notify_service: notify.duncan
          target_state: 'on'
          entity_id: light.orangina_local
          service_data: '{"brightness_pct":"40"}'
      alias: Dimm 40%
    - conditions:
      - condition: trigger
        id:
        - Dimm 2
      sequence:
      - action: script.retry_action_with_backoff_power_monitoring
        metadata: {}
        data:
          action_domain: light
          action_type: turn_on
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: simple
          notify_on_failure: true
          notify_service: notify.duncan
          target_state: 'on'
          entity_id: light.orangina_local
          service_data: '{"brightness_pct":"20"}'
      alias: Dimm 20%
    - conditions:
      - condition: or
        conditions:
        - alias: Daytime or if bright enough
          condition: and
          conditions:
          - condition: time
            before: '20:00:00'
            after: 04:00:00
          - condition: trigger
            id:
            - Off sync
        - condition: and
          conditions:
          - condition: trigger
            id:
            - Off end time
          - condition: time
            after: 00:59:00
            before: 04:00:00
          alias: After 1 o'clock force off
      sequence:
      - action: script.retry_action_with_backoff_power_monitoring
        metadata: {}
        data:
          action_domain: light
          action_type: turn_off
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: simple
          notify_on_failure: true
          notify_service: notify.duncan
          target_state: 'off'
          entity_id: light.orangina_local
      alias: 'Off'
  mode: queued
  max: 10
- id: '1738676581969'
  alias: Connectivity Ping Update
  description: "# \U0001F310 **Connectivity Ping Update**\n\n### \U0001F4CB Adaptive
    Connectivity Update Orchestrator\n\nThis automation implements a **deterministic,
    state-aware orchestration layer**\nfor ping-based connectivity binary sensors
    by explicitly invoking\n`homeassistant.update_entity` using a **parallel, staged
    execution model**.\n\nBy centralizing scheduling and execution, it **bypasses
    integration-level\npolling behavior** and enforces predictable, explainable evaluation
    timing for\nboth **internet reachability** and **local network health**, while
    actively\npreventing ICMP bursts and uncontrolled traffic amplification.\n\n---\n\n###
    \U0001F9ED Connectivity Model\n\nConnectivity is evaluated along **two orthogonal
    and intentionally separated dimensions**:\n\n1. **External (Internet) Reachability**\n
    \  - Multiple independent public endpoints across different DNS providers\n   -
    Split into **primary** and **secondary** execution groups\n   - Detects ISP, routing,
    peering, or provider-specific failures\n2. **Internal (Local) Reachability**\n
    \  - A single authoritative LAN endpoint (router)\n   - Used to distinguish **LAN
    availability** from **upstream internet availability**\n\nThis separation prevents
    false conclusions such as “The internet is down” when the actual failure domain
    is the local network or router.\n\n---\n\n### \U0001F501 Redundancy & Execution
    Strategy\n\nRedundancy is achieved through **endpoint diversity combined with
    controlled execution**, not blind packet repetition:\n\n- Multiple independent
    providers and infrastructure domains\n- Each sensor configured with **`count:
    2`**\n- Explicit service-driven updates (`homeassistant.update_entity`)\n- Execution
    structured as:\n  - **Parallel evaluation paths** (local vs external)\n  - **Staged
    sequencing within external targets**\n- Inter-entity delays **dynamically derived
    from both the active interval and the total number of execution steps**\n\nThis
    results in **adaptive ICMP density control**: adding or removing targets automatically
    reshapes timing while keeping overall traffic bounded and ensuring automation
    runtime stays within the 15s trigger window.\n\n---\n\n### ⏱ Trigger Overview\n\n|
    Trigger Type | Interval | Operational Role |\n| :--- | :--- | :--- |\n| **Time
    Pattern** | Every **15 seconds** | Global scheduler |\n\nThe trigger fires at
    a fixed cadence, but **actual execution is strictly gated** by operational state
    and time-alignment logic.\n\n---\n\n### \U0001F9E0 Operational Logic\n\n#### Daily
    / Active Mode\n- **Behavior**: All connectivity sensors evaluated every 15s.\n-
    **Execution**: Local (LAN) checks run in parallel with staged external checks.\n\n####
    Vacation / Power-Save Mode\n- **Behavior**: Updates occur only on **30-second
    boundaries** (`:00`, `:30`).\n- **Logic**: `((now().minute * 60 + now().second)
    % 30) == 0`\n\n---\n\n### \U0001F4CA Update Frequency & Traffic Profile (Updated
    for Count: 2)\n\n**Assumptions**:\n- 7 total ping sensors\n- **`count: 2` per
    sensor**\n- ~168 bytes per request/reply pair → ~336 bytes per update\n\n####
    \U0001F30D External Traffic (Internet)\n| Mode | Interval | Update Calls / Day
    | ICMP Packets / Day | Traffic / Day | Traffic / Month |\n| :--- | :--- | :---
    | :--- | :--- | :--- |\n| **Daily** | 15 s | 34,560 | 138,240 | ~11.1 MB | ~333
    MB |\n| **Vacation** | 30 s | 17,280 | 69,120 | ~5.5 MB | ~165 MB |\n\n#### \U0001F3E0
    Internal Traffic (LAN)\n| Mode | Interval | Update Calls / Day | ICMP Packets
    / Day | Traffic / Day | Traffic / Month |\n| :--- | :--- | :--- | :--- | :---
    | :--- |\n| **Daily** | 15 s | 5,760 | 23,040 | ~1.9 MB | ~58 MB |\n| **Vacation**
    | 30 s | 2,880 | 11,520 | ~0.9 MB | ~29 MB |\n\n---\n\n### ⚙ Technical Characteristics\n-
    **Automation Mode**: `parallel` (Max 3)\n- **Execution Model**: Parallel paths
    + staged external updates\n- **Timing Guarantees**: Centralized scheduling prevents
    sensor \"drift.\"\n\n---\n\n### \U0001F4DD Design Rationale\n- **Why `count: 2`**:
    Optimizes the balance between packet loss resilience and automation runtime, ensuring
    the sequence completes before the next 15s trigger.\n- **Why parallel + staged**:
    Separates failure domains while avoiding synchronized ICMP bursts.\n- **Why separate
    local vs external**: Prevents conflation of LAN/Router failures with ISP outages."
  triggers:
  - trigger: time_pattern
    seconds: /15
  conditions:
  - condition: template
    value_template: "{% if states('input_select.smart_home_status') == 'Daily' %}\n
      \ true\n{% elif states('input_select.smart_home_status') in ['Vacation', 'Power
      Save'] %}\n  {{ ((now().minute*60 + now().second) % 30) == 0 }}\n{% else %}\n
      \ false\n{% endif %}\n"
  actions:
  - variables:
      local:
      - binary_sensor.192_168_2_1
      external_primary:
      - binary_sensor.1_1_1_1
      - binary_sensor.8_8_8_8
      - binary_sensor.9_9_9_9
      external_secondary:
      - binary_sensor.1_0_0_1
      - binary_sensor.8_8_4_4
      - binary_sensor.149_112_112_112
      count: '{{ external_primary|length + external_secondary|length +2 }}'
      status: '{{ states(''input_select.smart_home_status'') }}'
      interval: '{{ 30 if status in [''Vacation'', ''Power Save''] else 15 }}'
      tempo: '{{ (interval / count) | round(3) }}'
  - parallel:
    - repeat:
        for_each: '{{ local }}'
        sequence:
        - action: homeassistant.update_entity
          data:
            entity_id: '{{ repeat.item }}'
    - sequence:
      - repeat:
          for_each: '{{ external_primary }}'
          sequence:
          - action: homeassistant.update_entity
            data:
              entity_id: '{{ repeat.item }}'
          - delay: '{{ tempo }}'
      - delay: '{{ tempo }}'
      - repeat:
          for_each: '{{ external_secondary }}'
          sequence:
          - action: homeassistant.update_entity
            data:
              entity_id: '{{ repeat.item }}'
          - delay: '{{ tempo }}'
  mode: parallel
  max: 3
