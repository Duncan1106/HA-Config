- id: '1740160222722'
  alias: Dachfenster Rolladen Steuerung
  description: ''
  triggers:
  - event: sunset
    id: sunset
    trigger: sun
    offset: +00:15:00
  - event: sunrise
    offset: 00:30:00
    id: sunrise_offset
    trigger: sun
  - entity_id: sensor.gw1100a_outdoor_temperature
    id: temp_change
    trigger: state
  - entity_id:
    - sensor.gw1100a_indoor_temperature
    - sensor.gw1100a_solar_lux
    id: temp_change
    trigger: state
  - trigger: numeric_state
    entity_id:
    - sensor.gw1100a_solar_lux
    below: 4000
    id: sunset
  - trigger: numeric_state
    entity_id:
    - sensor.sun_solar_elevation
    below: 16
    id: sunset
  actions:
  - choose:
    - conditions:
      - condition: and
        conditions:
        - condition: trigger
          id:
          - sunset
        - condition: template
          value_template: '{{ now().month in [11,12,1,2,3] }}'
          alias: Is Winter
        alias: Is Winter and Sunset
      sequence:
      - target:
          entity_id: weather.irauen33
        data:
          type: daily
        response_variable: weather_forecast
        action: weather.get_forecasts
      - alias: If Snow, only close Window, if not close window and Rollo
        if:
        - alias: Is Snow or below 0
          condition: template
          value_template: '{{ ''snow'' in weather_forecast[''weather.irauen33''].forecast[1].condition
            or (weather_forecast[''weather.irauen33''].forecast[1].templow < 0 and
            ''rain'' in weather_forecast[''weather.irauen33''].forecast[1].condition
            ) }} '
        then:
        - if:
          - condition: or
            conditions:
            - condition: state
              entity_id: binary_sensor.dachfenster_wintergarten_links_contact
              state: 'on'
            - condition: state
              entity_id: binary_sensor.dachfenster_wintergarten_rechts_contact
              state: 'on'
          then:
          - action: cover.close_cover
            metadata: {}
            data: {}
            target:
              entity_id: cover.wintergarten_dachfenster
          alias: If Open then Close Window
        - action: notify.duncan
          metadata: {}
          data:
            title: Dachfenster Winter
            message: Fenster zu, Templow {{ weather_forecast['weather.irauen33'].forecast[1].templow
              }}, Condition {{weather_forecast['weather.irauen33'].forecast[1].condition}}
        else:
        - alias: If Open then Close Window
          if:
          - condition: or
            conditions:
            - condition: state
              entity_id: binary_sensor.dachfenster_wintergarten_links_contact
              state: 'on'
            - condition: state
              entity_id: binary_sensor.dachfenster_wintergarten_rechts_contact
              state: 'on'
          then:
          - action: cover.close_cover
            metadata: {}
            data: {}
            target:
              entity_id: cover.wintergarten_dachfenster
          - delay:
              hours: 0
              minutes: 1
              seconds: 0
              milliseconds: 0
            enabled: true
        - target:
            entity_id: cover.wintergarten_rolladen_dachfenster
          action: cover.close_cover
          data: {}
          enabled: true
        - action: notify.duncan
          metadata: {}
          data:
            title: Dachfenster Winter
            message: Fenster und Rollo zu, Templow {{ weather_forecast['weather.irauen33'].forecast[1].templow
              }}, Condition  {{weather_forecast['weather.irauen33'].forecast[1].condition}}
      alias: Is Winter and Sunset -> Rollo Close if no snow or not below 0 tomorrow
    - conditions:
      - condition: and
        conditions:
        - condition: template
          value_template: '{{ now().month in [11,12,1,2,3] }}'
          alias: Is Winter
        - condition: trigger
          id:
          - sunrise_offset
        alias: Is Winter and Sunrise offset
      sequence:
      - action: cover.open_cover
        target:
          entity_id:
          - cover.wintergarten_rolladen_dachfenster
        data: {}
        enabled: true
      - action: notify.duncan
        metadata: {}
        data:
          title: Dachfenster Winter
          message: Rollo auf
      alias: Is Winter and Sunrise -> Open Rollo
    - conditions:
      - alias: Is Summer and Temp Diff > 5
        condition: and
        conditions:
        - condition: trigger
          id:
          - temp_change
        - alias: Is Summer
          condition: template
          value_template: '{{ now().month in [4,5,6,7,8,9,10] }}'
        - alias: Is Temp Diff > 5
          condition: template
          value_template: '{% set temp_inside = states(''sensor.gw1100a_indoor_temperature'')
            | float(0) %}

            {% set temp_outside = states(''sensor.gw1100a_outdoor_temperature'') |
            float(0) %}

            {% set uv = states(''sensor.gw1100a_solar_lux'') | float(0) %}

            {% set uv_index = states(''sensor.gw1100a_uv_index'') | float(0) %}

            {{ ((temp_outside - temp_inside) > 5.0 and temp_outside > 22.0 ) or ((uv
            > 75000.0 or uv_index >= 5) and temp_outside > 22.0) }}'
        - condition: numeric_state
          entity_id: sensor.sun_solar_azimuth
          above: 175
        - condition: numeric_state
          entity_id: sensor.sun_solar_elevation
          above: 16
      sequence:
      - if:
        - condition: or
          conditions:
          - condition: state
            entity_id: binary_sensor.dachfenster_wintergarten_links_contact
            state: 'on'
          - condition: state
            entity_id: binary_sensor.dachfenster_wintergarten_rechts_contact
            state: 'on'
        then:
        - action: cover.close_cover
          metadata: {}
          data: {}
          target:
            entity_id: cover.wintergarten_dachfenster
        alias: If Open then Close Window
      - if:
        - condition: state
          entity_id: cover.wintergarten_rolladen_dachfenster
          state: open
        then:
        - action: notify.duncan
          metadata: {}
          data:
            title: Dachfenster Sommer
            message: Rollo zu Temp
        alias: Notify on first close
      - target:
          entity_id: cover.wintergarten_rolladen_dachfenster
        action: cover.close_cover
        data: {}
        enabled: true
      alias: Is Summer, Temp Diff > 5 -> Close Rollo
    - conditions:
      - condition: and
        conditions:
        - alias: Is Summer
          condition: template
          value_template: '{{ now().month in [4,5,6,7,8,9,10] }}'
        - condition: trigger
          id:
          - sunset
        alias: Is Summer and sunset
      sequence:
      - if:
        - condition: state
          entity_id: cover.wintergarten_rolladen_dachfenster
          state: closed
        then:
        - action: notify.duncan
          metadata: {}
          data:
            title: Dachfenster Sommer
            message: Rollo auf
        alias: Notify on first open
      - action: cover.open_cover
        metadata: {}
        data: {}
        target:
          entity_id: cover.wintergarten_rolladen_dachfenster
        enabled: true
      alias: Is Summer and Sunset -> Open Rollo
  mode: queued
  max: 10
