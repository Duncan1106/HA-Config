          - delay:
              hours: 0
              minutes: 0
              seconds: 5
              milliseconds: 0
      - wait_for_trigger:
        - trigger: numeric_state
          entity_id:
          - sensor.go_echarger_270862_nrg_12
          below: 5
        - trigger: numeric_state
          entity_id:
          - sensor.go_echarger_252682_nrg_12
          below: 5
        timeout:
