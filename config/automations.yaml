                - condition: numeric_state
                  entity_id: sensor.go_echarger_252682_nrg_12
                  below: 5
              then:
              - alias: 'Turn Battery On via retry Script '
                action: script.retry_action_with_backoff
                metadata: {}
                data:
                  action_domain: switch
                  action_type: turn_on
                  max_retries: 10
                  base_delay: 5
                  max_delay: 60
                  backoff_type: simple
                  notify_on_failure: true
                  notify_service: notify.duncan
                  entity_id: switch.esp32_s3_zero_deye8k_time_of_use
                  target_state: 'on'
              else:
              - action: notify.duncan
                data:
                  title: Octopus night recovery
                  message: 'Retry {{ repeat.index }}: EV still >5 W; trying next slot
                    (1/3/5 min).'
                  data:
                    tag: octopus_night_recovery
            until:
            - condition: or
              conditions:
              - condition: state
                entity_id: switch.esp32_s3_zero_deye8k_time_of_use
                state: 'on'
              - condition: template
                value_template: '{{ repeat.index >= 3 }}'
              alias: Either battery is on or we retried 3 or more times
        alias: Turn on Battery with Retry only if both Chargers are below 5 W
        continue_on_error: true
      alias: Stop EV Charging, Octopus Dumb Mode
    - conditions:
      - condition: trigger
        id:
        - On_dispatch
      - condition: state
        entity_id: input_select.octopus_night_time
        state: Intelligent
      - condition: state
        entity_id: sensor.go_e_11kw_car
        state:
        - Tavascan
      sequence:
      - action: script.retry_action_with_backoff
        metadata: {}
        data:
          action_domain: switch
          action_type: turn_off
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: simple
          notify_on_failure: true
          notify_service: notify.duncan
          entity_id: switch.esp32_s3_zero_deye8k_time_of_use
          target_state: 'off'
        alias: Turn Battery Off via retry Script
        enabled: true
      - action: script.retry_action_with_backoff
        metadata: {}
        data:
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: simple
          notify_on_failure: true
          notify_service: notify.duncan
          entity_id: select.go_echarger_270862_frc
          target_state: custom
          custom_action:
          - action: select.select_option
            metadata: {}
            data:
              option: Charge
            target:
              entity_id:
              - select.go_echarger_270862_frc
          custom_target_state: Charge
      alias: Start EV Charging, Octopus Intelligent Mode
    - conditions:
      - condition: trigger
        id:
        - Off_dispatch
      - condition: state
        entity_id: input_select.octopus_night_time
        state: Intelligent
      - condition: state
        entity_id: sensor.go_e_11kw_car
        state:
        - Tavascan
      sequence:
      - action: script.retry_action_with_backoff
        metadata: {}
        data:
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: simple
          notify_on_failure: true
          notify_service: notify.duncan
          entity_id: select.go_echarger_270862_frc
          target_state: custom
          custom_action:
          - action: select.select_option
            metadata: {}
            data:
              option: Don't charge
            target:
              entity_id:
              - select.go_echarger_270862_frc
          custom_target_state: Don't charge
      - if:
        - condition: or
          conditions:
          - condition: numeric_state
            entity_id: sensor.go_echarger_252682_nrg_12
            above: 5
          - condition: numeric_state
            entity_id: sensor.go_echarger_270862_nrg_12
            above: 5
        then:
        - wait_for_trigger:
          - trigger: numeric_state
            entity_id:
            - sensor.go_echarger_270862_nrg_12
            below: 5
          - trigger: numeric_state
            entity_id:
            - sensor.go_echarger_252682_nrg_12
            below: 5
          timeout:
            hours: 0
            minutes: 1
            seconds: 0
            milliseconds: 0
          continue_on_timeout: true
          alias: Wait for power change below 5W
        alias: Only wait if above 5W
      - alias: No EV charger draw -> battery ON | wait longer
        if:
        - condition: and
          conditions:
          - condition: numeric_state
            entity_id: sensor.go_echarger_270862_nrg_12
            below: 5
          - condition: numeric_state
            entity_id: sensor.go_echarger_252682_nrg_12
            below: 5
          alias: No power draw from both chargers
        then:
        - alias: Turn Battery On via retry Script
          action: script.retry_action_with_backoff
          metadata: {}
          data:
            action_domain: switch
            action_type: turn_on
            max_retries: 10
            base_delay: 5
            max_delay: 60
            backoff_type: simple
            notify_on_failure: true
            notify_service: notify.duncan
            entity_id: switch.esp32_s3_zero_deye8k_time_of_use
            target_state: 'on'
        else:
        - action: notify.duncan
          data:
            title: Octopus night recovery
            message: 'Skipping battery ON: EV still >5 W (wait timed out). Will retry
              in 1, 3, and 5 minutes.'
            data:
              tag: octopus_night_recovery
        - alias: Retry Battery ON after timeout (1, 3, 5 min)
          repeat:
            sequence:
            - choose:
              - conditions:
                - condition: template
                  value_template: '{{ repeat.index == 1 }}'
                sequence:
                - delay: 00:01:00
              - conditions:
                - condition: template
                  value_template: '{{ repeat.index == 2 }}'
                sequence:
                - delay: 00:03:00
              - conditions:
                - condition: template
                  value_template: '{{ repeat.index == 3 }}'
                sequence:
                - delay: 00:05:00
              alias: 1, 3 or 5 Minute Delay between retries
            - alias: Turn Batters on if no EV Power Draw, if not notify about it
              if:
              - condition: and
                conditions:
                - condition: numeric_state
                  entity_id: sensor.go_echarger_270862_nrg_12
                  below: 5
                - condition: numeric_state
                  entity_id: sensor.go_echarger_252682_nrg_12
                  below: 5
              then:
              - alias: Turn Battery On via retry Script
                action: script.retry_action_with_backoff
                metadata: {}
                data:
                  action_domain: switch
                  action_type: turn_on
                  max_retries: 10
                  base_delay: 5
                  max_delay: 60
                  backoff_type: simple
                  notify_on_failure: true
                  notify_service: notify.duncan
                  entity_id: switch.esp32_s3_zero_deye8k_time_of_use
                  target_state: 'on'
              else:
              - action: notify.duncan
                data:
                  title: Octopus night recovery
                  message: 'Retry {{ repeat.index }}: EV still >5 W; trying next slot
                    (1/3/5 min).'
                  data:
                    tag: octopus_night_recovery
            until:
            - condition: or
              conditions:
              - condition: state
                entity_id: switch.esp32_s3_zero_deye8k_time_of_use
                state: 'on'
              - condition: template
                value_template: '{{ repeat.index >= 3 }}'
              alias: Either battery is on or we retried 3 or more times
      alias: Stop EV Charging, Octopus Intelligent Mode
    - conditions:
      - condition: trigger
        id:
        - prevent_battery_discharge
      - condition: or
        conditions:
        - condition: state
          entity_id: binary_sensor.octopus_a_10a76963_cupra_tavascan_intelligent_dispatching
          state: 'on'
        - condition: state
          entity_id: input_select.octopus_night_time
          state: Dumb
      - condition: time
        after: '22:00:00'
        before: 05:00:00
      sequence:
      - action: script.retry_action_with_backoff
        metadata: {}
        data:
          action_domain: switch
          action_type: turn_off
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: simple
          notify_on_failure: true
          notify_service: notify.duncan
          entity_id: switch.esp32_s3_zero_deye8k_time_of_use
          target_state: 'off'
        alias: 'Turn Battery Off via retry Script '
        enabled: true
      - delay:
          hours: 0
          minutes: 0
          seconds: 10
          milliseconds: 0
      - wait_template: "{% set car_22kw = is_state('binary_sensor.go_echarger_252682_car','on')
          %}\n            {% set car_11kw = is_state('binary_sensor.go_echarger_270862_car','on')
          %}\n            {% set power_goes = (((states('sensor.go_echarger_252682_nrg_12')|float(0))
          if car_22kw else 0) + ((states('sensor.go_echarger_270862_nrg_12')|float(0))
          if car_11kw else 0)) %}\n            {% set grid = states('sensor.grid_import')
          | float(0) %}\n            {% set battery_discharging = states('sensor.battery_discharge')
          | float(0) > 50 %}\n            {{ grid >= power_goes or not battery_discharging
          }}"
        continue_on_timeout: true
        timeout: 00:01:00
      - repeat:
          sequence:
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ repeat.index == 2 }}'
              sequence:
              - delay:
                  hours: 0
                  minutes: 1
                  seconds: 0
                  milliseconds: 0
            - conditions:
              - condition: template
                value_template: '{{ repeat.index == 3 }}'
              sequence:
              - delay:
                  hours: 0
                  minutes: 3
                  seconds: 0
                  milliseconds: 0
            default:
            - delay:
                hours: 0
                minutes: 0
                seconds: 1
                milliseconds: 0
          - if:
            - condition: template
              value_template: "            {% set car_22kw = is_state('binary_sensor.go_echarger_252682_car','on')
                %}\n            {% set car_11kw = is_state('binary_sensor.go_echarger_270862_car','on')
                %}\n            {% set power_goes = (((states('sensor.go_echarger_252682_nrg_12')|float(0))
                if car_22kw else 0) + ((states('sensor.go_echarger_270862_nrg_12')|float(0))
                if car_11kw else 0)) %}\n            {% set grid = states('sensor.grid_import')
                | float(0) %}\n            {% set battery_discharging = states('sensor.battery_discharge')
                | float(0) > 50 %}\n            {{ grid >= power_goes and battery_discharging
                }}"
            then:
            - action: notify.duncan
              data:
                title: Octopus Battery Guard
                message: "Retry {{ repeat.index}}/3: battery {{ states('sensor.battery_discharge')|float(0)|round(0)
                  }} W, grid {{ states('sensor.grid_import')|float(0)|round(0) }} W
                  vs EV {{\n                    (\n                      (states('sensor.go_echarger_252682_nrg_12')|float(0)
                  if is_state('binary_sensor.go_echarger_252682_car','on') else 0)
                  +\n                      (states('sensor.go_echarger_270862_nrg_12')|float(0)
                  if is_state('binary_sensor.go_echarger_270862_car','on') else 0)\n
                  \                   ) | round(0)\n                  }} W."
                data:
                  tag: octopus_battery_guard
          until:
          - condition: template
            value_template: '{% set battery_discharging = states(''sensor.battery_discharge'')
              | float(0) > 50 %}

              {{ (battery_discharging) or (repeat.index >= 3) }}'
        enabled: true
      alias: Fallback Battery Protection from Discharge to EV
  mode: parallel
  max: 6
- id: '1750928722036'
  alias: Reboot Host System on 1st of the Month
  description: "\n  ## \U0001F504 Monthly Host Reboot Automation\n\n  ### \U0001F4CB
    Purpose\n\n  Automatically reboots the Home Assistant host system on the **first
    day of\n  every month**, providing an advance notification one hour prior to the
    reboot\n  for awareness.\n\n  Adds a **safety condition** ensuring the host has
    been running for **at least\n  10 days** since the last system start, preventing
    unnecessary reboots after\n  recent restarts.\n\n  ---\n\n  ### ⏱ Triggers\n\n
    \ - `12:00:00` → Sends pre-notification one hour before reboot.\n\n  - `13:00:00`
    → Executes the actual host system reboot.\n\n  ---\n\n  ### ✅ Conditions\n\n  -
    Current day must be the **1st of the month**.\n    ```jinja\n    {{ now().day
    == 1 }}\n    ```\n\n  - The last system boot must be **10 or more days ago**.\n
    \   ```jinja\n    {{ (as_timestamp(now()) -\n            (as_timestamp(states('sensor.system_monitor_letzter_start'))
    |\n            float(0))) >= 864000 }}\n    ```\n\n  ---\n\n  ### \U0001F3AF Actions
    / Workflow\n\n  #### 12:00 Notification\n\n  - Send a notification to the user
    that the host system will reboot at 13:00.\n\n  #### 13:00 Reboot\n\n  - Verify
    that the system has been up for at least 10 days.\n  - Notify the user that the
    host system is now rebooting.\n  - Trigger `hassio.host_reboot` to reboot the
    Home Assistant host.\n\n  ---\n\n  ### \U0001F527 Technical Specs\n\n  - Mode:
    `choose` structure based on which trigger fired.\n  - Notifications use plain
    text for clarity."
  triggers:
  - at: '12:00:00'
    trigger: time
    id: '12'
  - at: '13:00:00'
    trigger: time
    id: '13'
  conditions:
  - condition: template
    value_template: '{{ now().day == 1 }}'
  - alias: Last Host Reboot is more than 10 Days ago
    condition: template
    value_template: '{% set boot = as_timestamp(states(''sensor.system_monitor_letzter_start''))
      %}

      {{ boot is number and (as_timestamp(now()) - boot) >= 864000 }}'
  - condition: state
    entity_id: sensor.ups0_status
    state:
    - Online
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - '12'
      sequence:
      - data:
          title: System-Neustart
          message: Hostsystem startet um 13 Uhr neu
          data:
            tag: reboot_hostsystem_warning
        action: notify.duncan
    - conditions:
      - condition: trigger
        id:
        - '13'
      sequence:
      - data:
          title: System-Neustart
          message: Hostsystem startet neu
          data:
            tag: reboot_hostsystem_warning
        action: notify.duncan
      - data: {}
        action: hassio.host_reboot
