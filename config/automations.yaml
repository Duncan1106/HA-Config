- id: '1744099492999'
  alias: Daily Agenda using OpenAI
  description: ''
  triggers:
  - at: 08:00:00
    trigger: time
  actions:
  - variables:
      weather_entity: weather.forecast_home
      calendar_number: three
      calendar_entity_1: calendar.looping
      calendar_entity_2: calendar.anniversaries
      calendar_entity_3: calendar.apps_by_abfall
      calendar_duration:
        hours: 15
        minutes: 59
        seconds: 0
      prompt: "Please generate text for a notification that will be sent to the users
        smartphone with helpful information. keep it simple and short but precise.
        simply provide the notification and nothing else! don't use any Benachrichtigung
        or something like that just the message! if you like you can format it to
        make it more readable \n\n- Your answers are not technical, and do not include
        Home Assistant internal details such as entities in responses.\n- Your messages
        help the user prepare for their day\n  - use the event name to refer to single
        persons, provide individual recommendations for each person and seperate them
        if needed per person.\n  - Making note of unusual weather for the location
        and time of year (but not mundane details like \"0% chance of precipitation\")
        also make sure to only tell the condition and temperature and maybe what I
        should bring when I go outside if the condition or temperature makes it needed.
        don't tell me to got for a walk or something like that \n  - Anything that
        may be special or unique, such as celebrating a birthday\nProvide your answer
        in German and make it precise and efficient as a German would like it. Bitte
        Duzen nicht Siezen"
  - alias: Fetch First Calendar Agenda
    data:
      duration:
        hours: 15
        minutes: 59
        seconds: 0
    target:
      entity_id: calendar.looping
    response_variable: agenda_1
    action: calendar.get_events
  - if:
    - condition: template
      value_template: '{{ (calendar_number == ''two'') or (calendar_number == ''three'')
        }}'
    then:
    - alias: Fetch Second Calendar Agenda
      data:
        duration:
          hours: 15
          minutes: 59
          seconds: 0
      target:
        entity_id: calendar.anniversaries
      response_variable: agenda_2
      action: calendar.get_events
  - if:
    - condition: template
      value_template: '{{ calendar_number == ''three''}}'
    then:
    - alias: Fetch Third Calendar Agenda
      data:
        duration:
          hours: 15
          minutes: 59
          seconds: 0
      target:
        entity_id: calendar.apps_by_abfall
      response_variable: agenda_3
      action: calendar.get_events
  - alias: Fetch Weather Forecast
    data:
      type: hourly
    target:
      entity_id:
      - '{{ weather_entity }}'
    response_variable: daily_forecast
    action: weather.get_forecasts
  - delay:
      hours: 0
      minutes: 0
      seconds: 0
      milliseconds: 500
  - variables:
      forecast_entity: '{{ daily_forecast[weather_entity] }}'
      forecast: '{{ forecast_entity.forecast[0] }}'
      calendar_prompt: "\nTime: {{ now().strftime(\"%A %B %d %H:%M %p\") }}  {%- if
        weather_entity is defined %}         \n  {%- set temperature_unit = state_attr(weather_entity,
        'temperature_unit') -%} \n  Current Weather : {{ forecast.condition }} (Temperature:
        {{forecast.temperature }}{{ temperature_unit }}, {{ forecast.precipitation
        }}% precipitation, UV Index {{forecast.uv_index}}, Wind Speed {{forecast.wind_speed}},
        Temp Low {{forecast.templow}})\n  Todays Overall Weather: {{ states('sensor.irauen33_weather_summary_0')
        }} \n{%- endif %} Calendar \"{{ state_attr(calendar_entity_1, 'friendly_name')
        }}\" events for the next {{ calendar_duration.hours }} hours: {%- set agenda
        = (agenda_1 | items | first)[1] %} {%- if agenda.events %}\n  {%- for event
        in agenda.events %}\n  - Summary: {{ event.summary }}\n    Start-End: {% if
        event.start is defined %}{{ event.start }} to {{ event.end }}{% else %}All
        Day{% endif %}\n    {%- if event.description is defined %}\n    Description:
        {{ event.description }}\n    {% endif -%}\n    {%- if event.location is defined
        %}\n      Location: {{ event.location }}\n    {% endif -%}\n  {%- endfor %}\n{%-
        else %}\n  - No upcoming events.\n{%- endif %}\n{%- if (calendar_number ==
        \"two\") or (calendar_number == \"three\") %} Calendar \"{{ state_attr(calendar_entity_2,
        'friendly_name') }}\" events for the next {{ calendar_duration.hours }} hours:\n
        \ {%- set agenda = (agenda_2 | items | first)[1] %}\n  {%- if agenda.events
        %}\n    {%- for event in agenda.events %}\n    - Summary: {{ event.summary
        }}\n      Start-End: {% if event.start is defined %}{{ event.start }} to {{
        event.end }}{% else %}All Day{% endif %}\n      {%- if event.description is
        defined %}\n      Description: {{ event.description }}\n      {% endif -%}\n
        \     {%- if event.location is defined %}\n        Location: {{ event.location
        }}\n      {% endif -%}\n    {%- endfor %}\n  {%- else %}\n    - No upcoming
        events.\n  {%- endif %}\n{%- endif %}\n{%- if (calendar_number == \"three\")
        %} Calendar \"{{ state_attr(calendar_entity_3, 'friendly_name') }}\" events
        for the next {{ calendar_duration.hours }} hours:\n  {%- set agenda = (agenda_3
        | items | first)[1] %}\n  {%- if agenda.events %}\n    {%- for event in agenda.events
        %}\n    - Summary: {{ event.summary }}\n      Start-End: {% if event.start
        is defined %}{{ event.start }} to {{ event.end }}{% else %}All Day{% endif
        %}\n      {%- if event.description is defined %}\n      Description: {{ event.description
        }}\n      {% endif -%}\n      {%- if event.location is defined %}\n        Location:
        {{ event.location }}\n      {% endif -%}\n    {%- endfor %}\n  {%- else %}\n
        \   - No upcoming events.\n  {%- endif %}\n{%- endif %}"
  - alias: Conversation Agent Notification Text
    data:
      text: '{{ calendar_prompt }}


        {{ prompt }}'
      agent_id: conversation.chatgpt
    response_variable: agent
    action: conversation.process
  - alias: Send notification
    data:
      title: '{{ now().strftime(''%A'') }} Agenda'
      message: '{{ agent.response.speech.plain.speech }}'
    action: notify.duncan
  - delay:
      hours: 0
      minutes: 0
      seconds: 1
      milliseconds: 0
  - alias: Conversation Agent Notification Text
    data:
      text: '{{ calendar_prompt }}


        {{ prompt }}'
      agent_id: conversation.google_generative_ai
    response_variable: agent_2
    action: conversation.process
  - alias: Send notification
    data:
      title: '{{ now().strftime(''%A'') }} Agenda'
      message: '{{ agent_2.response.speech.plain.speech }}'
    action: notify.duncan
