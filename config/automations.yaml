        - select.go_echarger_270862_frc
      action: select.select_option
      enabled: true
  mode: parallel
  max: 10
- id: '1716307846138'
  alias: Pool Runtime Control
  description: "## \U0001F31E Pool Runtime Control\n\n### \U0001F4CB Purpose\nControls
    the daily runtime of the pool pump, dynamically adjusting runtime\nbased on weather
    conditions, solar power availability, and pool temperature\ntrends. The automation
    ensures efficient use of solar energy while\nmaintaining optimal pool operation.\n\n---\n\n###
    ⏰ Triggers\n| Trigger Type                     | Details / Thresholds                          |\n|----------------------------------|----------------------------------------------|\n|
    Time Pattern                      | 09:00–11:00 every 2 minutes (Early Start)
    \  |\n| Time Pattern                      | 11:00–12:00 (Force Start)                    |\n|
    Numeric State                     | `input_number.pulsetimeactualvalue` < 250/150
    |\n| Pool Pump State                   | Off → On / On → Off                           |\n|
    Time Pattern                      | 20:00+ (Force Stop)                           |\n\n---\n\n###
    ✅ Conditions\n- Early Start: 09:30–10:59 with sufficient solar or grid export.\n-
    Force Start: 10:59–12:00 if pump is off.\n- Extend: Pulse time below 410, PV power
    > 1200, and extend counter < 15.\n- Stop / Stopped: Various time and state-based
    conditions.\n- All conditions ensure the pump only runs when beneficial.\n\n---\n\n###
    \U0001F3AF Actions / Workflow\n**1. Early Start**\n- Checks solar conditions,
    PV forecast, and azimuth angle.\n- Turns off `pool_pulsetime_auto_adjust` automation
    temporarily.\n- Opens main solar valve, sets pulse time to 8h, turns on pump.\n-
    Records start temperature and notifies potential night temperature loss.\n- Re-enables
    `pool_pulsetime_auto_adjust`.\n\n**2. Force Start**\n- Triggered if pump is off
    during 11:00–12:00 window.\n- Sets pulse time to 6h, opens solar valve, turns
    on pump.\n- Records start temperature and notifies temperature loss.\n- Re-enables
    pulse time auto-adjust.\n\n**3. Extend**\n- Triggered when pulse time is low but
    solar conditions allow extension.\n- Increments pulse time by 6 minutes per check.\n-
    Saves stop temperature before extending if first increment.\n- Updates counter
    to limit maximum extensions.\n- Notifies temperature changes caused by extensions.\n\n**4.
    Stopped**\n- Triggered when pump turns off.\n- Ensures solar valves are closed,
    records stop temperature.\n- Notifies temperature change caused by extensions
    if any.\n- Marks pool as stopped.\n\n**5. Force Stop**\n- Triggered at 20:00 or
    when explicitly stopped.\n- Records stop temperature, turns off pump and valves,
    resets counter.\n- Notifies temperature difference between start and stop.\n-
    Clears stop flag.\n\n---\n\n### \U0001F527 Technical Specs\n- **Mode:** `queued`
    with `max: 50` to prevent lost triggers.\n- Monitored Entities: pool pump switch,
    solar valve switches, pulse time inputs, PV power, solar forecast, pool temperature
    sensors, trend sensor, and stop flag.\n- Integrates with MQTT to set Tasmota pulse
    times dynamically.\n- Interacts with `pool_pulsetime_auto_adjust` automation to
    prevent conflicts.\n\n---\n\n### ⚡ Best Practices / Notes\n- Adjust pulse time
    thresholds and solar power conditions to match local climate and pool setup.\n-
    Ensure all sensors and valves report accurate states to avoid unintended runtime.\n-
    Extend logic uses a counter to prevent excessive prolonging of pump operation.\n-
    Notifications help track temperature changes and pool runtime efficiency."
  triggers:
  - hours: '9'
    minutes: /2
    id: On early
    trigger: time_pattern
  - hours: '10'
    minutes: /2
    id: On early
    trigger: time_pattern
  - hours: '11'
    minutes: /2
    id: Force Start
    trigger: time_pattern
    enabled: true
  - entity_id:
    - input_number.pulsetimeactualvalue
    below: 250
    id: Extend
    trigger: numeric_state
  - entity_id:
    - input_number.pulsetimeactualvalue
    below: 150
    id: Extend
    trigger: numeric_state
  - trigger: state
    entity_id:
    - switch.pool_pumpe
    to: 'off'
    from: 'on'
    id: Stopped
  - hours: '20'
    minutes: '*'
    id: Force Stop
    trigger: time_pattern
  conditions:
  - condition: or
    conditions:
    - alias: Early Start Condition
      condition: and
      conditions:
      - condition: time
        after: 09:30:00
        before: '10:59:00'
    - alias: Force Start Condition
      condition: and
      conditions:
      - condition: time
        after: '10:59:59'
        before: '12:00:00'
      - condition: state
        entity_id: switch.pool_pumpe
        state: 'off'
    - alias: 'Extend Condition '
      condition: numeric_state
      entity_id: input_number.pulsetimeactualvalue
      below: 401
    - condition: state
      entity_id: switch.pool_pumpe
      state: 'off'
      alias: Stopped Condition
    - condition: and
      conditions:
      - condition: time
        after: '14:00:00'
        before: '21:00:00'
      alias: Stop Condition
  actions:
  - alias: Early Start
    if:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - On early
      - alias: Confirm enough solar or power
        condition: or
        conditions:
        - condition: numeric_state
          entity_id: sensor.inverter_pv_power
          above: 1800
        - condition: numeric_state
          entity_id: sensor.grid_export
          above: 2000
      - condition: state
        entity_id: switch.pool_pumpe
        state: 'off'
      - condition: numeric_state
        entity_id: sensor.sun_solar_azimuth
        above: 95
      - condition: numeric_state
        entity_id: sensor.solcast_pv_forecast_prognose_heute
        above: 40
    then:
    - action: automation.turn_off
      metadata: {}
      data:
        stop_actions: true
      target:
        entity_id: automation.pool_pulsetime_auto_adjust
    - action: switch.turn_on
      metadata: {}
      data: {}
      target:
        entity_id: switch.pool_ventil_solar
    - alias: 8 hours
      metadata: {}
      data:
        topic: cmnd/tasmota_837238/pulsetime1
        payload: '28895'
      action: mqtt.publish
    - action: switch.turn_on
      metadata: {}
      data: {}
      target:
        entity_id: switch.pool_pumpe
    - delay:
        hours: 0
        minutes: 5
        seconds: 0
        milliseconds: 0
    - metadata: {}
      data:
        value: '{{ states(''sensor.esp32_c3_mini_pool_temperature_pool_temperature'')
          | float(0) | round(4) }}'
      target:
        entity_id: input_number.pool_temp_start
      action: input_number.set_value
    - delay:
        hours: 0
        minutes: 0
        seconds: 1
        milliseconds: 0
    - action: notify.duncan
      metadata: {}
      data:
        title: Pool Night Temperature Loss
        data:
          tag: pool_loss_night
        message: '{{ (states(''input_number.pool_temp_start'') | float(0) - states(''input_number.pool_temp_stop'')
          | float(0)) | round(2) }}°C'
    - action: automation.turn_on
      metadata: {}
      data: {}
      target:
        entity_id: automation.pool_pulsetime_auto_adjust
  - alias: Force Start
    if:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - Force Start
      - condition: state
        entity_id: switch.pool_pumpe
        state: 'off'
    then:
    - action: automation.turn_off
      metadata: {}
      data:
        stop_actions: true
      target:
        entity_id: automation.pool_pulsetime_auto_adjust
    - action: switch.turn_on
      metadata: {}
      data: {}
      target:
        entity_id: switch.pool_ventil_solar
    - alias: 6 hours
      metadata: {}
      data:
        topic: cmnd/tasmota_837238/pulsetime1
        payload: '21695'
      action: mqtt.publish
    - action: switch.turn_on
      metadata: {}
      data: {}
      target:
        entity_id: switch.pool_pumpe
    - delay:
        hours: 0
        minutes: 5
        seconds: 0
        milliseconds: 0
    - metadata: {}
      data:
        value: '{{ states(''sensor.esp32_c3_mini_pool_temperature_pool_temperature'')
          | float(0) | round(4) }}'
      target:
        entity_id: input_number.pool_temp_start
      action: input_number.set_value
    - delay:
        hours: 0
        minutes: 0
        seconds: 1
        milliseconds: 0
    - action: notify.duncan
      metadata: {}
      data:
        title: Pool Night Temperature Loss
        data:
          tag: pool_loss_night
        message: '{{ (states(''input_number.pool_temp_start'') | float(0) - states(''input_number.pool_temp_stop'')
          | float(0)) | round(2) }}°C'
    - action: automation.turn_on
      metadata: {}
      data: {}
      target:
        entity_id: automation.pool_pulsetime_auto_adjust
  - alias: Extend
    if:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - Extend
      - condition: numeric_state
        entity_id: sensor.inverter_pv_power
        above: 1200
      - condition: numeric_state
        entity_id: counter.pool_extend_counter
        below: 15
      - condition: numeric_state
        entity_id: input_number.pulsetimeactualvalue
        below: 410
      - condition: state
        entity_id: switch.pool_pumpe
        state: 'on'
      - condition: state
        entity_id: input_boolean.stop_pool
        state: 'off'
      - condition: not
        conditions:
        - condition: state
          entity_id: binary_sensor.pool_temperatur_trend
          state: 'off'
          for:
            hours: 0
            minutes: 5
            seconds: 0
    then:
    - action: automation.turn_off
      metadata: {}
      data:
        stop_actions: true
      target:
        entity_id: automation.pool_pulsetime_auto_adjust
    - delay:
        hours: 0
        minutes: 0
        seconds: 0
        milliseconds: 500
    - if:
      - condition: numeric_state
        entity_id: counter.pool_extend_counter
        below: 1
      then:
      - metadata: {}
        data:
          value: '{{ states(''sensor.esp32_c3_mini_pool_temperature_pool_temperature'')
            | float(0) | round(4) }}'
        target:
          entity_id: input_number.pool_temp_stop
        action: input_number.set_value
      alias: Save Temperature before extend
    - alias: Extend by 6min
      metadata: {}
      data:
        topic: cmnd/tasmota_837238/pulsetime1
        payload: '{{ states(''input_number.pulsetimeactualvalue'') | int(0) + 460
          }}'
      action: mqtt.publish
    - metadata: {}
      data: {}
      target:
        entity_id: counter.pool_extend_counter
      action: counter.increment
    - delay:
        hours: 0
        minutes: 0
        seconds: 20
        milliseconds: 0
    - action: automation.turn_on
      target:
        entity_id: automation.pool_pulsetime_auto_adjust
      data: {}
    else:
    - alias: Save Stop Temp when was still on
      if:
      - condition: and
        conditions:
        - condition: trigger
          id:
          - Extend
        - condition: state
          entity_id: switch.pool_pumpe
          state: 'on'
      then:
      - alias: Notify about temperature change caused by extend
        if:
        - condition: numeric_state
          entity_id: counter.pool_extend_counter
          above: 0
        - condition: state
          entity_id: input_boolean.stop_pool
          state: 'off'
        then:
        - action: notify.duncan
          metadata: {}
          data:
            message: Extend caused {{ (states('sensor.esp32_c3_mini_pool_temperature_pool_temperature')
              | float(0) - states('input_number.pool_temp_stop') | float(0)) | round(2)
              }}°C
      - delay:
          hours: 0
          minutes: 0
          seconds: 0
          milliseconds: 100
      - metadata: {}
        data:
          value: '{{ states(''sensor.esp32_c3_mini_pool_temperature_pool_temperature'')
            | float(0) | round(4) }}'
        target:
          entity_id: input_number.pool_temp_stop
        action: input_number.set_value
      - action: input_boolean.turn_on
        metadata: {}
        data: {}
        target:
          entity_id: input_boolean.stop_pool
  - alias: Stopped
    if:
    - condition: trigger
      id:
      - Stopped
    then:
    - action: switch.turn_off
      metadata: {}
      data: {}
      target:
        entity_id: switch.smart_valve_controller_schalter_1
    - alias: Notify about temperature change caused by extend
      if:
      - condition: numeric_state
        entity_id: counter.pool_extend_counter
        above: 0
      - condition: state
        entity_id: input_boolean.stop_pool
        state: 'off'
      then:
      - action: notify.duncan
        metadata: {}
        data:
          message: Extend caused {{ (states('sensor.esp32_c3_mini_pool_temperature_pool_temperature')
            | float(0) - states('input_number.pool_temp_stop') | float(0)) | round(2)
            }}°C
    - delay:
        hours: 0
        minutes: 0
        seconds: 0
        milliseconds: 100
    - metadata: {}
      data:
        value: '{{ states(''sensor.esp32_c3_mini_pool_temperature_pool_temperature'')
          | float(0) | round(4) }}'
      target:
        entity_id: input_number.pool_temp_stop
      action: input_number.set_value
    - action: input_boolean.turn_on
      metadata: {}
      data: {}
      target:
        entity_id: input_boolean.stop_pool
    - delay:
        hours: 0
        minutes: 0
        seconds: 30
        milliseconds: 0
    - action: switch.turn_off
      metadata: {}
      data: {}
      target:
        entity_id: switch.pool_ventil_solar
  - alias: Force Stop
    if:
    - condition: trigger
      id:
      - Force Stop
    then:
    - if:
      - condition: device
        type: is_on
        device_id: 7f4653a91cd2ef69cb48aa494a983be8
        entity_id: 3d65e9bcde794b0149fb7d576edd1bb9
        domain: switch
      then:
      - metadata: {}
        data:
          value: '{{ states(''sensor.esp32_c3_mini_pool_temperature_pool_temperature'')
            | float(0) }}'
        target:
          entity_id: input_number.pool_temp_stop
        action: input_number.set_value
      alias: Save Stop Temp when was still on
    - action: switch.turn_off
      metadata: {}
      data: {}
      target:
        entity_id:
        - switch.pool_pumpe
        - switch.pool_ventil_solar
    - alias: '0'
      metadata: {}
      data:
        topic: cmnd/tasmota_837238/pulsetime1
        payload: '0'
      action: mqtt.publish
    - metadata: {}
      data: {}
      target:
        entity_id: counter.pool_extend_counter
      action: counter.reset
    - delay:
        hours: 0
        minutes: 0
        seconds: 0
        milliseconds: 100
    - if:
      - condition: state
        entity_id: input_boolean.stop_pool
        state: 'on'
      then:
      - action: notify.duncan
        alias: Notify of Temperature Change
        data:
          title: Pool Temperature Change
          data:
            tag: pool_temp_diff
          message: '{%- set start = states(''input_number.pool_temp_start'') | float(0)
            -%} {%- set stop = states(''input_number.pool_temp_stop'') | float(0)
            -%} {%- set diff = (stop - start) | round(2) -%} {{ ''+'' if diff > 0
            else ''-'' }}{{ diff | abs }}°C'
      alias: Notify once for Temperature Change
    - action: input_boolean.turn_off
      metadata: {}
      data: {}
      target:
        entity_id: input_boolean.stop_pool
  mode: queued
  max: 50
- id: '1716921868511'
  alias: Wasserleck Alarm
