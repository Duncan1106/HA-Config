  alias: Publish Energy Data to MQTT
  description: Publishes real-time energy data including grid power, solar production,
    battery discharge, and state of charge to MQTT topics.
  triggers:
  - trigger: state
    entity_id:
    - sensor.grid_power
    - sensor.solar_power_total
    - sensor.battery_discharge
    - sensor.felicity_ess_soc_avg
  conditions:
