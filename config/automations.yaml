- id: '1749622712645'
  alias: Tablet Battery Warnings at Thresholds
  description: 'Sends a battery warning notification to notify.duncan when the Lenovo
    Tab P11 drops below key thresholds (40%, 30%, 20%, 10%), regardless of charging
    state. Uses trigger.from_state > to_state to avoid flapping or false alerts.

    '
  triggers:
  - entity_id: sensor.lenovo_tab_p11_batterie
    below: 39
    trigger: numeric_state
  - entity_id: sensor.lenovo_tab_p11_batterie
    below: 30
    trigger: numeric_state
  - entity_id: sensor.lenovo_tab_p11_batterie
    below: 20
    trigger: numeric_state
  - entity_id: sensor.lenovo_tab_p11_batterie
    below: 10
    trigger: numeric_state
  conditions:
  - condition: template
    value_template: "{{ trigger.from_state is not none and\n   (trigger.from_state.state
      | float(100)) > (trigger.to_state.state | float(0)) }}\n"
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ (trigger.to_state.state | float(0)) < 11 }}'
      sequence:
      - data:
          title: "\U0001F534 Tablet Battery Critical!"
          message: 'Lenovo Tab P11 battery is at {{ trigger.to_state.state }}%. Plug
            it in now or check if it’s charging properly!

            '
          data:
            tag: lenovo_p11_battery_warning
        action: notify.duncan
    - conditions:
      - condition: template
        value_template: '{{ (trigger.to_state.state | float(0)) < 21 }}'
      sequence:
      - data:
          title: "\U0001F7E0 Tablet Battery Low"
          message: 'Lenovo Tab P11 battery dropped to {{ trigger.to_state.state }}%.
            Might be an issue with the charger or cable.

            '
          data:
            tag: lenovo_p11_battery_warning
        action: notify.duncan
    - conditions:
      - condition: template
        value_template: '{{ (trigger.to_state.state | float(0)) < 31 }}'
      sequence:
      - data:
          title: "\U0001F7E1 Tablet Battery Getting Low"
          message: 'Lenovo Tab P11 is now at {{ trigger.to_state.state }}%. Consider
            checking if it''s still charging as expected.

            '
          data:
            tag: lenovo_p11_battery_warning
        action: notify.duncan
    default:
    - data:
        title: ⚠️ Tablet Battery Notice
        message: 'Lenovo Tab P11 battery is at {{ trigger.to_state.state }}%. Might
          need attention soon.

          '
        data:
          tag: lenovo_p11_battery_warning
      action: notify.duncan
  mode: single
- id: '1749768402037'
  alias: Gang Light Time Based
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - sensor.light_brighness
    id: Change
  - trigger: numeric_state
    entity_id:
    - sensor.light_brighness
    below: 1
    id: Zero
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Change
      - condition: numeric_state
        entity_id: sensor.light_brighness
        above: 0
      sequence:
      - if:
        - condition: or
          conditions:
          - condition: state
            entity_id: light.esp32_c3_mini_treppenhaus_licht
            state: 'off'
          - condition: template
            value_template: '{% set sensor_brightness = (states(''sensor.light_brighness'')
              | float(0) * 2.55) | int(0) %}

              {% set current = state_attr(''light.esp32_c3_mini_treppenhaus_licht'',
              ''brightness'') | int(0) %}

              {{ sensor_brightness != current }}'
        then:
        - action: light.turn_on
          metadata: {}
          data:
            brightness_pct: '{{ states(''sensor.light_brighness'') | int(0) }}'
          target:
            entity_id: light.esp32_c3_mini_treppenhaus_licht
      alias: On with specified Brighness
    - conditions:
      - condition: trigger
        id:
        - Zero
      - condition: template
        value_template: '{{ trigger.from_state.state | int(1) > 0 }}'
      sequence:
      - action: light.turn_off
        metadata: {}
        data: {}
        target:
          entity_id: light.esp32_c3_mini_treppenhaus_licht
      alias: Off if Brightness changes to Zero
  mode: single
- id: '1749938010439'
  alias: Reset Deye Battery Capacity closer to real
  description: Deye I'm Inverter estimates the battery capacity and it always overshoots,
    this is a way to hopefully combat this and keep the battery soc estimation in
    a reasonable amount around the real soc the BMS provides, wich is unfortunately
    not compatible in the current setup with deye 8k
  triggers:
  - trigger: sun
    event: sunset
    offset: 0
  - trigger: time
    at: 00:00:00
  conditions:
  - condition: numeric_state
    entity_id: sensor.inverter_battery_corrected_capacity
    above: 500
  actions:
  - action: number.set_value
    metadata: {}
    data:
      value: '501'
    target:
      entity_id: number.inverter_battery_capacity
  - delay:
      hours: 0
      minutes: 0
      seconds: 15
      milliseconds: 0
  - action: number.set_value
    metadata: {}
    data:
      value: '500'
    target:
      entity_id: number.inverter_battery_capacity
  mode: single
