- id: '1738338302199'
  alias: WallPanelBrightness
  description: ''
  triggers:
  - entity_id:
    - sensor.average_illuminance
    trigger: state
  - entity_id: sun.sun
    attribute: elevation
    trigger: state
  conditions:
  - condition: template
    value_template: '{{ now() - state_attr(this.entity_id, ''last_triggered'') > timedelta(minutes=2)
      }}'
  actions:
  - action: number.set_value
    metadata: {}
    target:
      entity_id: number.lenovo_tab_p11_bildschirmhelligkeit
    data:
      value: "{% set light_max = 250 %}\n{% if states('sensor.average_illuminance')
        == None %}\n  {% set light_float = 0.0 %}\n{% else %} \n  {% set light_float
        = (states('sensor.average_illuminance')|float(1)) / 1000 %}\n{% endif %}\n{%
        if states.sun.sun.attributes.elevation >= 0 %}\n  {{ light_max }} \n{% else
        %}\n  {{ max(light_max * light_float, 10) }}\n{% endif %}\n"
  - action: number.set_value
    metadata: {}
    target:
      entity_id: number.lenovo_tab_p11_bildschirmschoner_helligkeit
    data:
      value: "{% set light_max = 200 %}\n{% if states('sensor.average_illuminance')
        == None %}\n  {% set light_float = 0.0 %}\n{% else %} \n  {% set light_float
        = (states('sensor.average_illuminance')|float(1)) / 1000 %}\n{% endif %}\n{%
        if states.sun.sun.attributes.elevation >= 0 %}\n  {{ light_max }} \n{% else
        %}\n  {{ max(light_max * light_float, 10)/2 }}\n{% endif %}\n"
  mode: single
