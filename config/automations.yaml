- id: '1748530213618'
  alias: Allergie und Tasks
  description: ''
  triggers:
  - trigger: time
    at: 08:10:00
  conditions: []
  actions:
  - variables:
      prompt: 'Please generate text for a notification that will be sent to the users
        smartphone with helpful information. keep it simple and short but precise.
        simply provide the notification and nothing else! don''t use any Benachrichtigung
        or something like that just the message! if you like you can format it to
        make it more readable . Only provide the message and not more.


        - Your answers are not technical, and do not include Home Assistant internal
        details such as entities in responses.

        Provide your answer in German and make it precise and efficient as a German
        would like it. Bitte Duzen nicht Siezen'
  - action: todo.get_items
    metadata: {}
    data:
      status: needs_action
    target:
      entity_id: todo.to_do_duncan
    response_variable: to_do_duncan
  - alias: Conversation Agent Notification Text
    data:
      text: "I'm quite allergic to Grass pollen, Hausstaubmilben and Roggen. here
        are the today sensor values of these three pollen and any other \nGräser:
        {{ states('sensor.pollenflug_graeser') }} \nRoggen: {{ states('sensor.pollenflug_roggen')
        }}\nAmbrosia: {{ states('sensor.pollenflug_ambrosia') }}\nBeifuss {{ states('sensor.pollenflug_beifuss')
        }}\nHasel: {{ states('sensor.pollenflug_hasel') }}\nEsche: {{ states('sensor.pollenflug_esche')
        }}\nLegende:\n\nIndex\tDescription (in German)\n0\tkeine Belastung\n0.5\tkeine
        bis geringe Belastung\n1\tgeringe Belastung\n1.5\tgeringe bis mittlere Belastung\n2\tmittlere
        Belastung\n2.5\tmittlere bis hohe Belastung\n3\thohe Belastung\n\nBased on
        these, how much anti allergic medication should i take i have 20mg ones, my
        typical dose would be 2 tablets meaning 40mg, on bad days it could be well
        around 100mg. dont panic my doctor says i can take as much as 200mg a day.
        Give me a base count i should take and suggest how many more i could take
        over the day. Keep it short, only tell the amount, and the amount i should
        take with me, based on the pollen pollution. dont tell me why, dont tell me
        what is happening in the air. like: 2 Tabletten, + 3 Tabletten. ' thats it
        not anymore, no argumentation or anything like that.\n\n\nAlso heres a random
        task from my todo list:  \n{% set length = to_do_duncan['todo.to_do_duncan']['items']
        | length %}\n{{ to_do_duncan['todo.to_do_duncan']['items'][range(0,length)|random]}}\n\nfeel
        free to make suggestions on how to do this in today.\n\n{{ prompt }}"
      agent_id: conversation.chatgpt
    response_variable: agent
    action: conversation.process
  - alias: Send notification
    data:
      title: '{{ now().strftime(''%A'') }} Allergie und Aufgaben'
      message: '{{ agent.response.speech.plain.speech }}'
    action: notify.duncan
  mode: single
