- id: '1739967189542'
  alias: Waschmaschine und Trockner Erinnerungen
  description: "  ## \U0001F9FA Laundry Reminder Automation\n\n  ### \U0001F4CB **Persistent
    Cycle Completion Alerts**\n\n  This automation sends **repeated notifications
    and audio reminders** when the\n  washing machine or dryer has finished a cycle.
    Notifications continue at\n  regular intervals until the user clears the completion
    signal.  \n  The goal is to ensure laundry is removed promptly and that “done”
    states\n  don’t get ignored.\n\n  ---\n\n  ### ⏰ **Triggers**\n\n  | Entity |
    From → To | Trigger ID |\n  |--------|-----------|------------|\n  | `input_boolean.waschmaschine_fertig`
    | off → on | Waschmaschine |\n  | `input_boolean.trockner_fertig` | off → on |
    Trockner |\n  | `input_boolean.waschmaschine_fertig` | on → off | Waschmaschine
    fertig |\n  | `input_boolean.trockner_fertig` | on → off | Trockner fertig |\n\n
    \ > Completion flags turning **on** start the reminders.  \n  > Flags turning
    **off** clear notifications and stop alerts.\n\n  ---\n\n  ### ✅ **Conditions**\n\n
    \ - No additional conditions.  \n    The automation always responds to the defined
    triggers.\n\n  ---\n\n  ### \U0001F3AF **Actions / Workflow**\n\n  1. **Waschmaschine
    Reminder**\n     - When `Waschmaschine` is triggered (done = on):\n       - Repeats:\n
    \        - Sends push notification (`notify.familie`) with tag `waschmaschine_fertig`.\n
    \        - Speaks announcement via TTS: *“Die Waschmaschine ist fertig.”*\n         -
    Waits 10 minutes, then repeats.\n       - Loop continues until `input_boolean.waschmaschine_fertig
    = off`.\n       - Clears notification tag once cycle is acknowledged.\n\n  2.
    **Trockner Reminder**\n     - When `Trockner` is triggered (done = on):\n       -
    Repeats:\n         - Sends push notification with tag `trockner_fertig`.\n         -
    Speaks announcement via TTS: *“Der Trockner ist fertig.”*\n         - Waits 10
    minutes, then repeats.\n       - Loop continues until `input_boolean.trockner_fertig
    = off`.\n       - Clears notification tag once cycle is acknowledged.\n\n  3.
    **Clear Notifications**\n     - When either appliance’s `fertig` flag goes from
    on → off:\n       - Immediately clears any active notifications for that appliance.\n\n
    \ ---\n\n  ### \U0001F527 **Technical Specs**\n\n  - **Mode:** `parallel` (up
    to 10 concurrent runs).  \n  - **Devices Controlled:**\n    - `notify.familie`
    (persistent notifications).  \n    - `media_player.lenovo_tab_p11` via `tts.google_ai_tts`.
    \ \n  - **Monitored Entities:**\n    - `input_boolean.waschmaschine_fertig`  \n
    \   - `input_boolean.trockner_fertig`  \n  - **Notification Tags:**  \n    - `waschmaschine_fertig`
    \ \n    - `trockner_fertig`  \n\n  ---\n\n  ### \U0001F514 **Notes**\n\n  - Both
    appliances repeat their alerts every **10 minutes** until cleared.  \n  - TTS
    ensures audible feedback in addition to push notifications.  \n  - Notifications
    are uniquely tagged so they can be updated/cleared without duplicates.  \n  -
    User acknowledgment (turning the boolean off) is the only way to stop the reminders."
  triggers:
  - trigger: state
    entity_id:
    - input_boolean.waschmaschine_fertig
    from: 'off'
    to: 'on'
    id: Waschmaschine
  - trigger: state
    entity_id:
    - input_boolean.trockner_fertig
    from: 'off'
    to: 'on'
    id: Trockner
  - trigger: state
    entity_id:
    - input_boolean.trockner_fertig
    from: 'on'
    to: 'off'
    id: Trockner fertig
  - trigger: state
    entity_id:
    - input_boolean.waschmaschine_fertig
    from: 'on'
    to: 'off'
    id: Waschmaschine fertig
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Waschmaschine
      sequence:
      - repeat:
          sequence:
          - action: notify.familie
            metadata: {}
            data:
              data:
                tag: waschmaschine_fertig
                color: yellow
                notification_icon: mdi:washing-machine
              title: Waschmaschine fertig
              message: Bitte ausräumen
          - delay:
              hours: 0
              minutes: 0
              seconds: 0
              milliseconds: 500
          - action: tts.speak
            metadata: {}
            data:
              cache: true
              language: de-DE
              media_player_entity_id: media_player.lenovo_tab_p11
              message: Die Waschmaschine ist fertig
            target:
              entity_id: tts.google_ai_tts
          - delay:
              hours: 0
              minutes: 10
              seconds: 0
              milliseconds: 0
          until:
          - condition: state
            entity_id: input_boolean.waschmaschine_fertig
            state: 'off'
      - action: notify.familie
        metadata: {}
        data:
          data:
            tag: waschmaschine_fertig
          message: clear_notification
      alias: Waschmaschine
    - conditions:
      - condition: trigger
        id:
        - Trockner
      sequence:
      - repeat:
          sequence:
          - action: notify.familie
            metadata: {}
            data:
              data:
                tag: trockner_fertig
                color: yellow
                notification_icon: mdi:tumble-dryer
              title: Trockner fertig
              message: Bitte ausräumen
          - delay:
              hours: 0
              minutes: 0
              seconds: 0
              milliseconds: 500
          - action: tts.speak
            metadata: {}
            data:
              cache: true
              language: de-DE
              media_player_entity_id: media_player.lenovo_tab_p11
              message: Der Trockner ist fertig
            target:
              entity_id: tts.google_ai_tts
          - delay:
              hours: 0
              minutes: 10
              seconds: 0
              milliseconds: 0
          until:
          - condition: state
            entity_id: input_boolean.trockner_fertig
            state: 'off'
      - action: notify.familie
        metadata: {}
        data:
          data:
            tag: trockner_fertig
          message: clear_notification
      alias: Trockner
    - conditions:
      - condition: trigger
        id:
        - Trockner fertig
      sequence:
      - action: notify.familie
        metadata: {}
        data:
          data:
            tag: trockner_fertig
          message: clear_notification
    - conditions:
      - condition: trigger
        id:
        - Waschmaschine fertig
      sequence:
      - action: notify.familie
        metadata: {}
        data:
          data:
            tag: waschmaschine_fertig
          message: clear_notification
  mode: parallel
  max: 10
