- id: '1702826722550'
  alias: Presence DESK Controller
  description: ''
  triggers:
  - type: not_occupied
    device_id: 561b2fddd9cec3889faf18b8ccf214a0
    entity_id: b4a408441c08e8103747f1fac6b78b62
    domain: binary_sensor
    trigger: device
    id: laptop off
    for:
      hours: 0
      minutes: 30
      seconds: 0
  - type: not_occupied
    device_id: 561b2fddd9cec3889faf18b8ccf214a0
    entity_id: b4a408441c08e8103747f1fac6b78b62
    domain: binary_sensor
    trigger: device
    id: Monitor off
    for:
      hours: 0
      minutes: 0
      seconds: 20
  - trigger: state
    entity_id:
    - binary_sensor.schreibtisch
    to: 'on'
    for:
      hours: 0
      minutes: 0
      seconds: 20
    id: 'ON'
    alias: 20 sec there -> All ON
  - trigger: state
    entity_id:
    - binary_sensor.schreibtisch
    to: 'off'
    for:
      hours: 0
      minutes: 1
      seconds: 0
    id: Monitor off
    alias: 1 min await -> Monitor OFF
  - trigger: state
    entity_id:
    - binary_sensor.schreibtisch
    to: 'off'
    id: laptop off
    for:
      hours: 0
      minutes: 10
      seconds: 0
    alias: 10 min await -> Laptop OFF
  conditions: []
  actions:
  - alias: Laptop OFF
    if:
    - condition: trigger
      id:
      - laptop off
    - type: is_not_occupied
      condition: device
      device_id: 561b2fddd9cec3889faf18b8ccf214a0
      entity_id: 9e2fd849edb418346b78ab27fafb8a79
      domain: binary_sensor
      enabled: false
    - condition: state
      entity_id: binary_sensor.schreibtisch
      state: 'off'
    then:
    - action: switch.turn_off
      metadata: {}
      data: {}
      target:
        entity_id:
        - switch.schreibtisch_rechts_power_strip_l3
        - switch.schreibtisch_rechts_power_strip_l2
    - if:
      - condition: sun
        after: sunset
        before: sunrise
      then:
      - action: switch.turn_off
        metadata: {}
        data: {}
        target:
          entity_id:
          - switch.desk_paludarium_links_l2
          - switch.desk_paludarium_turm_rechts_l1
          - switch.desk_paludarium_links_l1
          - switch.desk_paludarium_turm_rechts_l3
          - switch.desk_paludarium_rechts_l3
      - delay:
          hours: 0
          minutes: 0
          seconds: 15
          milliseconds: 0
      - action: switch.turn_off
        metadata: {}
        data: {}
        target:
          entity_id:
          - switch.schreibtisch_rechts_power_strip_l5
          - switch.schreibtisch_links_power_strip_l1
  - alias: Monitor OFF
    if:
    - condition: trigger
      id:
      - Monitor off
    then:
    - action: switch.turn_off
      metadata: {}
      data: {}
      target:
        entity_id:
        - switch.schreibtisch_rechts_power_strip_l2
    - if:
      - condition: sun
        after: sunset
        before: sunrise
      then:
      - action: switch.turn_off
        metadata: {}
        data: {}
        target:
          entity_id:
          - switch.desk_paludarium_links_l1
          - switch.desk_paludarium_turm_rechts_l3
          - switch.desk_paludarium_rechts_l3
          - switch.desk_paludarium_links_l2
          - switch.desk_paludarium_turm_rechts_l1
      - delay:
          hours: 0
          minutes: 0
          seconds: 15
          milliseconds: 0
      - action: switch.turn_off
        metadata: {}
        data: {}
        target:
          entity_id:
          - switch.schreibtisch_rechts_power_strip_l5
          - switch.schreibtisch_links_power_strip_l1
  - alias: All ON
    if:
    - condition: and
      conditions:
      - condition: state
        entity_id: person.duncan
        state: home
      - condition: time
        after: 07:00:00
        before: '23:00:00'
      - condition: trigger
        id:
        - 'ON'
    then:
    - data: {}
      target:
        entity_id:
        - switch.schreibtisch_rechts_power_strip_l3
        - switch.schreibtisch_rechts_power_strip_l2
        - switch.schreibtisch_links_power_strip_l4
        - switch.schreibtisch_rechts_power_strip_l5
        - switch.schreibtisch_links_power_strip_l1
        - switch.desk_paludarium_links_l2
        - switch.desk_paludarium_turm_rechts_l1
        - switch.desk_paludarium_links_l1
        - switch.desk_paludarium_turm_rechts_l3
        - switch.desk_paludarium_rechts_l3
        - switch.desk_paludarium_turm_links_l2
        - switch.desk_paludarium_turm_links_l3
      action: switch.turn_on
    - delay:
        hours: 0
        minutes: 0
        seconds: 10
        milliseconds: 0
    - data: {}
      action: switch.turn_on
      target:
        entity_id:
        - switch.desk_paludarium_links_l1
        - switch.desk_paludarium_turm_rechts_l3
        - switch.desk_paludarium_rechts_l3
        - switch.desk_paludarium_turm_links_l2
        - switch.desk_paludarium_links_l2
        - switch.desk_paludarium_turm_rechts_l1
        - switch.desk_paludarium_turm_links_l3
    - delay:
        hours: 0
        minutes: 0
        seconds: 5
        milliseconds: 0
    - data: {}
      action: switch.turn_on
      target:
        entity_id:
        - switch.desk_paludarium_links_l1
        - switch.desk_paludarium_turm_rechts_l3
        - switch.desk_paludarium_rechts_l3
        - switch.desk_paludarium_turm_links_l2
        - switch.desk_paludarium_links_l2
        - switch.desk_paludarium_turm_rechts_l1
        - switch.desk_paludarium_turm_links_l3
  mode: queued
  max: 15
- id: '1702976643373'
  alias: 'EV Solar charging '
  description: ''
  triggers:
  - entity_id:
    - sensor.grid_export_negative
    for:
      hours: 0
      minutes: 2
      seconds: 30
    below: -1249
    trigger: numeric_state
  conditions:
  - condition: and
    conditions:
    - condition: sun
      before: sunset
      after: sunrise
    - condition: numeric_state
      entity_id: counter.ev_charging_messages
      below: 10
    - condition: and
      conditions:
      - condition: state
        entity_id: select.go_echarger_252682_trx
        state: None
      - condition: state
        entity_id: select.go_echarger_270862_trx
        state: None
    - condition: template
      value_template: '{{ states(''sensor.evs_home_and_ready_to_charge'') != ''Alle
        Fahrzeuge geladen oder nicht zu Hause'' }}'
  actions:
  - parallel:
    - alias: Notify Papa
      if:
      - condition: and
        conditions:
        - condition: zone
          entity_id: person.stephan
          zone: zone.home
        - condition: zone
          entity_id: device_tracker.wvgzzze2zpe005371_position
          zone: zone.home
      then:
      - data:
          title: AEVSCC Possible
          message: "{{  ['Hey, die Sonne lacht! Zeit, dein E-Auto zu laden und die
            Solarenergie zu nutzen. \U0001F609',  'Na los! Die Solarenergie wartet
            nicht! Steck dein Auto an die Ladestation, bevor die Energie verpufft!',
            \ 'Hey, du Schlaufuchs! Warum lässt du die Solarenergie verpuffen? Steck
            dein Auto an die Ladestation, sonst geht die Energie flöten!',  'Bist
            du blind? Schau mal raus! Hopp flott, schnapp dir dein Auto und steck
            es an!',  'Hey du Schnarchnase! Die Sonne macht heute Überstunden. Zeit,
            dass auch dein Auto mal was tut! Lad es auf, bevor die Energie im Nirvana
            verschwindet. \U0001F609',  'Na los, du Schluffi! Die Sonne geht bald
            pennen, und du lässt dein Auto ungeladen?',  'Hey du Trantüte! Schau mal
            aus dem Fenster – die Sonne sagt Hallo. Steck dein Auto an, sonst geht
            die Solarenergie verloren!',  'Du Grottenolm! Schnell zur Ladesäule, bevor
            du mir noch mehr kostbare Solarenergie verschwendest!'] | random }}"
        enabled: false
        action: notify.mobile_app_stephan_iphone
      - metadata: {}
        data: {}
        action: script.charge_ev_message_with_optional_disable_stephan_iphone
      - metadata: {}
        data: {}
        target:
          entity_id: counter.ev_charging_messages
        action: counter.increment
      enabled: true
    - alias: Notify Duncan
      sequence:
      - action: script.charge_ev_message_with_optional_disable
        metadata: {}
        data: {}
      - metadata: {}
        data: {}
        target:
          entity_id: counter.ev_charging_messages
        action: counter.increment
  mode: parallel
  max: 10
