- id: '1751542900177'
  alias: Rollo Sommer Automatisch Steuern (mit Grund und Manueller Modus)
  description: 'Steuert den Wintergarten-Rolladen automatisch basierend auf dem Sensor
    inklusive Benachrichtigung mit Grund sowie Statusmeldungen zum manuellen Modus.

    '
  triggers:
  - trigger: state
    id: rollo_close
    entity_id:
    - binary_sensor.rollo_summer_should_close
    to: 'on'
    for:
      hours: 0
      minutes: 10
      seconds: 0
  - trigger: state
    id: rollo_open
    entity_id:
    - binary_sensor.rollo_summer_should_close
    to: 'off'
    for:
      hours: 0
      minutes: 15
      seconds: 0
  - trigger: state
    id: manual_on
    entity_id: input_boolean.rollo_summer_override
    to: 'on'
  - trigger: state
    id: manual_off
    entity_id: input_boolean.rollo_summer_override
    to: 'off'
  conditions:
  - condition: sun
    before: sunset
    after: sunrise
  actions:
  - choose:
    - alias: Rollo schließen
      conditions:
      - condition: trigger
        id: rollo_close
      - condition: state
        entity_id: input_boolean.rollo_summer_override
        state: 'off'
      - condition: not
        conditions:
        - condition: state
          entity_id: cover.wintergarten_rolladen_dachfenster
          state: closed
      sequence:
      - action: cover.close_cover
        target:
          entity_id: cover.wintergarten_rolladen_dachfenster
        data: {}
      - action: notify.duncan
        data:
          data:
            tag: rollo_close
          message: '☀️ wird geschlossen: {{ state_attr(''binary_sensor.rollo_summer_should_close'',
            ''reason'') or ''Kein Grund angegeben.'' }}

            '
          title: Rollo
    - alias: Rollo öffnen
      conditions:
      - condition: trigger
        id: rollo_open
      - condition: state
        entity_id: input_boolean.rollo_summer_override
        state: 'off'
      - condition: not
        conditions:
        - condition: state
          entity_id: cover.wintergarten_rolladen_dachfenster
          state: open
      sequence:
      - action: cover.open_cover
        target:
          entity_id: cover.wintergarten_rolladen_dachfenster
        data: {}
      - action: notify.duncan
        data:
          data:
            tag: rollo_open
          message: "\U0001F324️ wird geöffnet: {{ state_attr('binary_sensor.rollo_summer_should_close',
            'reason') or 'Kein Grund angegeben.' }}\n"
          title: Rollo
    - alias: Manueller Modus aktiviert
      conditions:
      - condition: trigger
        id: manual_on
      sequence:
      - action: notify.duncan
        data:
          data:
            tag: rollo_manual
          message: "\U0001F6D1 Rollo: Manueller Modus aktiviert"
          title: Rollo Mode
    - alias: Manueller Modus deaktiviert
      conditions:
      - condition: trigger
        id: manual_off
      sequence:
      - action: notify.duncan
        data:
          data:
            tag: rollo_automatic
          message: '✅ Rollo: Automatikmodus wieder aktiv'
          title: Rollo Mode
  mode: single
- id: '1751548094070'
  alias: Poco F7 Request Location with Retry and Final Notification
  triggers:
  - event: start
    trigger: homeassistant
  - entity_id: person.duncan
    to:
    - not_home
    - unavailable
    - unknown
    trigger: state
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: person.duncan
      state: not_home
    - condition: state
      entity_id: person.duncan
      state: unavailable
    - condition: state
      entity_id: person.duncan
      state: unknown
  actions:
  - repeat:
      until:
      - condition: or
        conditions:
        - condition: not
          conditions:
          - condition: or
            conditions:
            - condition: state
              entity_id: person.duncan
              state: not_home
            - condition: state
              entity_id: person.duncan
              state: unavailable
            - condition: state
              entity_id: person.duncan
              state: unknown
        - condition: template
          value_template: '{{ repeat.index >= 10 }}'
      sequence:
      - action: notify.mobile_app_poco_f7
        data:
          message: request_location_update
      - delay: 00:05:00
  - if:
    - condition: or
      conditions:
      - condition: state
        entity_id: person.duncan
        state: not_home
      - condition: state
        entity_id: person.duncan
        state: unavailable
      - condition: state
        entity_id: person.duncan
        state: unknown
    then:
    - action: notify.mobile_app_poco_f7
      data:
        title: Location update failed
        message: 'Please open the Home Assistant app on your Poco F7 to update your
          location manually.

          '
  mode: single
