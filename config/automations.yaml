- id: '1760998194743'
  alias: Bett Powerbank Laden
  description: "## \U0001F50B Bett Powerbank Laden\n\nAutomatisiert das **Laden der
    Bett-Powerbank** abhängig von Sonnenaufgang/-untergang und der PV-Prognose.  \nDie
    Automation reagiert außerdem auf Änderungen des **Low-Power-Modus**.\n\n### \U0001F4CB
    Logik\n\n- **\U0001F305 Sonnenaufgang:** Steckdose **einschalten**, wenn die heutige
    PV-Prognose > 15 kWh.  \n  - Wird mit **Retry + Backoff** ausgeführt, um sicherzustellen,
    dass die Steckdose eingeschaltet wird.\n\n- **\U0001F307 Sonnenuntergang:** Steckdose
    **ausschalten**, um unnötigen Nachtverbrauch zu vermeiden.  \n  - Benachrichtigung
    an `notify.duncan` erfolgt, damit der Low-Power-Modus überprüft werden kann.\n\n-
    **Low-Power-Modus deaktiviert:** Benachrichtigungen werden **gelöscht**, falls
    der Nutzer manuell den Low-Power-Modus abschaltet.\n\n### \U0001F527 Bedingungen\n\n-
    `input_boolean.bett_powerbank_low_power = on`  \n  - Ausnahme: Wenn Boolean manuell
    ausgeschaltet wurde, wird trotzdem die Notification gelöscht\n\n### ⚡ Hinweise
    / Best Practices\n\n- Retry-Logik sorgt für maximale Zuverlässigkeit bei Steckdosensteuerung.\n-
    Benachrichtigungen am Abend unterstützen die Kontrolle des Powerbank-Ladestatus.\n-
    Low-Power-Modus sollte korrekt gepflegt werden, um ungewollte Ladung zu vermeiden."
  triggers:
  - trigger: sun
    event: sunrise
    offset: 0
    id: Sunrise
  - trigger: sun
    event: sunset
    offset: +00:05:00
    id: Sunset
  - trigger: state
    entity_id:
    - input_boolean.bett_powerbank_low_power
    id: Boolean turned off
    to: 'off'
    from: 'on'
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: input_boolean.bett_powerbank_low_power
      state: 'on'
    - condition: trigger
      id:
      - Boolean turned off
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Sunrise
      - condition: numeric_state
        entity_id: sensor.solcast_pv_forecast_prognose_heute
        above: 15
      sequence:
      - action: script.retry_action_with_backoff
        metadata: {}
        data:
          action_type: turn_on
          backoff_type: linear
          entity_id: switch.bett_strip_l1
          target_state: 'on'
          action_domain: switch
          max_retries: 10
          notify_service: notify.duncan
          base_delay: 10
          max_delay: 60
    - conditions:
      - condition: trigger
        id:
        - Sunset
      sequence:
      - parallel:
        - alias: Notify only when the plug was on
          if:
          - condition: state
            entity_id: switch.bett_strip_l1
            state:
            - 'on'
          then:
          - alias: Set up variables for the actions
            variables:
              leave_on: '{{ ''OPEN_'' ~ context.id }}'
              turn_off: '{{ ''CLOSE_'' ~ context.id }}'
          - action: notify.duncan
            metadata: {}
            data:
              title: "\U0001F307 Bett Powerbank"
              message: Low‑Power‑Modus beibehalten oder beenden?
              data:
                tag: powerbank_low
                actions:
                - action: '{{ leave_on }}'
                  title: Low‑Power behalten
                - action: '{{ turn_off }}'
                  title: Low‑Power beenden
          - alias: Wait for a response
            wait_for_trigger:
            - event_type: mobile_app_notification_action
              event_data:
                action: '{{ turn_off }}'
              trigger: event
            timeout:
              hours: 1
              minutes: 0
              seconds: 0
              milliseconds: 0
            continue_on_timeout: true
          - alias: Perform the action
            choose:
            - conditions:
              - condition: template
                value_template: '{{ wait.trigger is not none and wait.trigger.event
                  is not none and wait.trigger.event.data.action == turn_off }}'
              sequence:
              - action: input_boolean.turn_off
                metadata: {}
                data: {}
                target:
                  entity_id: input_boolean.bett_powerbank_low_power
        - sequence:
          - delay:
              hours: 0
              minutes: 0
              seconds: 5
              milliseconds: 0
          - action: script.retry_action_with_backoff
            metadata: {}
            data:
              action_type: turn_off
              backoff_type: linear
              entity_id: switch.bett_strip_l1
              target_state: 'off'
              action_domain: switch
              max_retries: 10
              max_delay: 60
              base_delay: 10
    - conditions:
      - condition: trigger
        id:
        - Boolean turned off
      sequence:
      - action: notify.duncan
        metadata: {}
        data:
          data:
            tag: powerbank_low
          message: clear_notification
  mode: queued
  max: 3
- id: '1765713065237'
  alias: Ambient Lights Scheduler
  description: "\U0001F4A1 **Ambient Lights Scheduler**\n\n### \U0001F4CB Intelligent
    Ambient Lighting Control\n\nThis automation manages the home's decorative and
    atmospheric lighting based on a combination of time-of-day scheduling and occupancy.
    By integrating both standard and seasonal lighting, it ensures the home environment
    is properly illuminated only when necessary.\n\n**Operational Strategy:**\nThe
    system follows a **Presence-Aware & Conditional** strategy. Lights are only activated
    if the lighting schedule is active **and** the home is occupied. If either condition
    becomes false, the lights are deactivated to conserve energy.\n\n**Reliability
    Mechanisms:**\nTo combat potential Zigbee mesh interference or hardware unavailability,
    this automation utilizes a **recursive retry script** with **exponential backoff**.
    Each command is attempted up to 5 times, ensuring state consistency even in unreliable
    network conditions.\n\n---\n\n### Trigger Overview Table\n\n| Type | Entity /
    Condition | ID | Purpose |\n| :--- | :--- | :--- | :--- |\n| **State** | `binary_sensor.ambient_lights`
    | `Schedule` | Detects changes in the programmed lighting window. |\n| **State**
    | `binary_sensor.anyone_home` | `Presence` | Responds to arrival or departure
    of residents. |\n| **Event** | `Home Assistant Start` | `HA_Start` | Synchronizes
    light states immediately after a system reboot. |\n\n---\n\n#### Active Lighting
    Mode\n* **Purpose**: Illuminates the home during scheduled hours when residents
    are present.\n* **Logic Overview**: Requires both `binary_sensor.ambient_lights`
    to be **on** AND `binary_sensor.anyone_home` to be **on**.\n* **Effect**: Switches
    `switch.fenster_licht_vorne_zigbee` and `switch.fenster_licht_hinten_zigbee` to
    **on**. If `input_boolean.enable_seasonal_ambient_lights` is active, it also enables
    seasonal entities.\n\n#### Inactive / Economy Mode\n* **Purpose**: Turns off lighting
    when out of schedule or when the house is empty.\n* **Logic Overview**: Triggered
    if `binary_sensor.ambient_lights` is **off** OR `binary_sensor.anyone_home` is
    **off**.\n* **Effect**: Switches all primary and seasonal (if enabled) entities
    to **off**.\n\n---\n\n### Technical Overview\n\n* **Automation Mode**: `restart`
    (Ensures the latest trigger state takes immediate precedence).\n* **Execution
    Method**: Utilizes `script.retry_action_with_backoff` for robust device communication.\n*
    **Key Inputs**: \n    * `binary_sensor.ambient_lights` (Schedule)\n    * `binary_sensor.anyone_home`
    (Occupancy)\n    * `input_boolean.enable_seasonal_ambient_lights` (Feature Flag)\n*
    **Controlled Entities**: \n    * **Primary**: `switch.fenster_licht_vorne_zigbee`,
    `switch.fenster_licht_hinten_zigbee`\n    * **Seasonal**: `switch.weihnachtsbaum_zigbee`,
    `switch.treppe_led_lichterkette_zigbee`\n* **Safety Mechanisms**: \n    * **Exponential
    Backoff**: Prevents network congestion during retries.\n    * **Failure Notification**:
    Alerts the user via `notify.duncan` if a device fails to reach the target state
    after all retries.\n\n---\n\n### \U0001F4A1 Notes\n\n* **Network Stability**:
    The use of `continue_on_error: true` ensures that if one Zigbee device is physically
    disconnected, the rest of the loop continues to process other lights.\n* **Presence
    Priority**: The logic acts as a \"Gatekeeper\"—even if the schedule says the lights
    should be on, they will remain off if the house is empty, effectively reducing
    energy waste.\n* **Seasonal Flexibility**: The seasonal toggle allows for permanent
    YAML configuration of holiday lights that only participate in the logic when the
    specific toggle is enabled.\n"
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.ambient_lights
    id: Schedule
    to:
    - 'on'
    - 'off'
  - trigger: state
    entity_id:
    - binary_sensor.anyone_home
    id: Presence
    to:
    - 'on'
    - 'off'
  - trigger: homeassistant
    event: start
    id: HA_Start
  conditions: []
  actions:
  - if:
    - condition: trigger
      id:
      - HA_Start
    then:
    - delay:
        hours: 0
        minutes: 0
        seconds: 30
        milliseconds: 0
    alias: Wait 30s to wrap up HA Startup
  - variables:
      entities:
      - switch.fenster_licht_hinten_zigbee
      - switch.fenster_licht_vorne_zigbee
      entities_seasonal:
      - switch.weihnachtsbaum_zigbee
      - switch.treppe_led_lichterkette_zigbee
  - choose:
    - conditions:
      - condition: and
        conditions:
        - condition: state
          entity_id: binary_sensor.ambient_lights
          state: 'on'
        - condition: state
          entity_id: binary_sensor.anyone_home
          state: 'on'
      sequence:
      - repeat:
          for_each: '{{ entities }}'
          sequence:
          - action: script.retry_action_with_backoff
            continue_on_error: true
            data:
              entity_id: '{{ repeat.item }}'
              target_state: 'on'
              action_domain: switch
              action_type: turn_on
              max_retries: 5
              base_delay: 5
              backoff_type: exponential
              notify_on_failure: true
              notify_service: notify.duncan
          - delay:
              hours: 0
              minutes: 0
              seconds: 1
              milliseconds: 0
      - alias: Seasonal Ambient Lights ON
        if:
        - condition: state
          entity_id: input_boolean.enable_seasonal_ambient_lights
          state:
          - 'on'
        then:
        - repeat:
            for_each: '{{ entities_seasonal }}'
            sequence:
            - action: script.retry_action_with_backoff
              continue_on_error: true
              data:
                entity_id: '{{ repeat.item }}'
                target_state: 'on'
                action_domain: switch
                action_type: turn_on
                max_retries: 5
                base_delay: 5
                backoff_type: exponential
                notify_on_failure: true
                notify_service: notify.duncan
            - delay:
                hours: 0
                minutes: 0
                seconds: 1
                milliseconds: 0
    - conditions:
      - condition: or
        conditions:
        - condition: state
          entity_id: binary_sensor.ambient_lights
          state: 'off'
        - condition: state
          entity_id: binary_sensor.anyone_home
          state: 'off'
      sequence:
      - repeat:
          for_each: '{{ entities }}'
          sequence:
          - action: script.retry_action_with_backoff
            continue_on_error: true
            data:
              entity_id: '{{ repeat.item }}'
              target_state: 'off'
              action_domain: switch
              action_type: turn_off
              max_retries: 5
              base_delay: 5
              backoff_type: exponential
              notify_on_failure: true
              notify_service: notify.duncan
          - delay:
              hours: 0
              minutes: 0
              seconds: 1
              milliseconds: 0
      - alias: Seasonal Ambient Lights OFF
        if:
        - condition: state
          entity_id: input_boolean.enable_seasonal_ambient_lights
          state:
          - 'on'
        then:
        - repeat:
            for_each: '{{ entities_seasonal }}'
            sequence:
            - action: script.retry_action_with_backoff
              continue_on_error: true
              data:
                entity_id: '{{ repeat.item }}'
                target_state: 'off'
                action_domain: switch
                action_type: turn_off
                max_retries: 5
                base_delay: 5
                backoff_type: exponential
                notify_on_failure: true
                notify_service: notify.duncan
            - delay:
                hours: 0
                minutes: 0
                seconds: 1
                milliseconds: 0
  mode: restart
- id: '1766701693252'
  alias: Rollo Winter Control (All-in-One)
  description: "Complete winter control for the rollo using IR commands. input_boolean.rollo_state:\n
    \ ON = rollo assumed closed\n  OFF = rollo assumed open\n\nFunctions: - Sunset:
    close if safe, otherwise notify - Sunrise: open if safe, otherwise notify - Delayed
    open: open later when conditions are safe (temp >= 3°C or at noon)\n"
  triggers:
  - trigger: sun
    event: sunset
    id: sunset
    offset: +00:15:00
  - trigger: sun
    event: sunrise
    id: sunrise
    offset: +00:15:00
  - trigger: numeric_state
    entity_id:
    - sensor.gw1100a_outdoor_temperature
    above: 3
    id: temp_safe
  - trigger: numeric_state
    entity_id: sensor.gw1100a_outdoor_temperature
    above: 10
    id: temp_safe
  - trigger: time
    at: '12:00:00'
    id: noon_retry
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: sunset
      - condition: state
        entity_id: input_boolean.rollo_state
        state: 'off'
      - condition: not
        conditions:
        - condition: and
          conditions:
          - condition: state
            entity_id: input_boolean.forecast_temp_low
            state: 'on'
          - condition: state
            entity_id: input_boolean.forecast_wet
            state: 'on'
      sequence:
      - alias: Close the window before closing the rollo
        if:
        - condition: state
          entity_id: cover.wintergarten_dachfenster
          state:
          - open
        then:
        - repeat:
            until:
            - condition: or
              conditions:
              - condition: state
                entity_id: cover.wintergarten_dachfenster
                state:
                - closed
              - condition: template
                value_template: '{{ repeat.index >= 3 }}'
            sequence:
            - action: cover.close_cover
              metadata: {}
              target:
                entity_id: cover.wintergarten_dachfenster
              data: {}
            - wait_for_trigger:
              - trigger: state
                entity_id:
                - cover.wintergarten_dachfenster
                to:
                - closed
              timeout:
                hours: 0
                minutes: 2
                seconds: 0
                milliseconds: 0
              alias: Wait for closed
        - delay:
            hours: 0
            minutes: 0
            seconds: 10
            milliseconds: 0
          alias: 'Let it settle down: 10s'
      - if:
        - condition: state
          entity_id: cover.wintergarten_dachfenster
          state:
          - closed
        then:
        - action: cover.close_cover
          target:
            entity_id: cover.wintergarten_rolladen_dachfenster
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.rollo_state
        else:
        - action: notify.duncan
          data:
            title: "\U0001FA9F Rollo close blocked"
            message: Window did not close after 3 attempts; skipping rollo close.
        alias: Close Rollo only if window is closed
      alias: Close if forecast allows
    - conditions:
      - condition: trigger
        id: sunset
      - condition: state
        entity_id: input_boolean.rollo_state
        state: 'off'
      - condition: and
        conditions:
        - condition: state
          entity_id: input_boolean.forecast_temp_low
          state: 'on'
        - condition: state
          entity_id: input_boolean.forecast_wet
          state: 'on'
      sequence:
      - action: notify.duncan
        data:
          title: "\U0001FA9F Rollo not closed at sunset"
          message: 'Close command was skipped due to forecasted winter risk: low temperature
            & wet/freezing conditions.

            '
          data:
            tag: rollo_sunset_block
      alias: Notify if forecast blocks
    - conditions:
      - condition: trigger
        id: sunrise
      - condition: state
        entity_id: input_boolean.rollo_state
        state: 'on'
      - condition: not
        conditions:
        - condition: and
          conditions:
          - condition: state
            entity_id: input_boolean.rollo_was_cold
            state: 'on'
          - condition: state
            entity_id: input_boolean.rollo_was_wet
            state: 'on'
          - condition: numeric_state
            entity_id: sensor.gw1100a_outdoor_temperature
            above: 3
      sequence:
      - action: cover.open_cover
        target:
          entity_id: cover.wintergarten_rolladen_dachfenster
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.rollo_state
      alias: 'Open if allowed '
    - conditions:
      - condition: trigger
        id: sunrise
      - condition: state
        entity_id: input_boolean.rollo_state
        state: 'on'
      - condition: and
        conditions:
        - condition: state
          entity_id: input_boolean.rollo_was_cold
          state: 'on'
        - condition: state
          entity_id: input_boolean.rollo_was_wet
          state: 'on'
        - condition: numeric_state
          entity_id: sensor.gw1100a_outdoor_temperature
          below: 3.1
      sequence:
      - action: notify.duncan
        data:
          title: "\U0001FA9F Rollo stayed closed after sunrise"
          message: 'Open command was skipped due to overnight conditions: freezing
            temperatures & wet conditions.

            '
          data:
            tag: rollo_sunrise_block
      alias: Notify if blocked
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: temp_safe
        - condition: trigger
          id: noon_retry
      - condition: state
        entity_id: input_boolean.rollo_state
        state: 'on'
      - condition: sun
        after: sunrise
        before: sunset
        after_offset: +00:15:00
      sequence:
      - action: cover.open_cover
        target:
          entity_id: cover.wintergarten_rolladen_dachfenster
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.rollo_state
      - action: notify.duncan
        data:
          title: "\U0001FA9F Rollo opened later"
          message: 'Rollo was opened later once conditions were safe again. Current
            temperature: {{ states(''sensor.gw1100a_outdoor_temperature'') }} °C.

            '
          data:
            tag: rollo_noon_reset
      - action: notify.duncan
        metadata: {}
        data:
          message: clear_notification
          data:
            tag: rollo_sunrise_block
      alias: Retry/Safe Open l
  mode: single
- id: '1767622395757'
  alias: 'Garden House: Freeze Protection Heating'
  description: "❄️ **Garden House: Freeze Protection Heating**\n\n### \U0001F4CB Intelligent
    Climate Preservation Control\n\nThis automation manages the heating system within
    the garden house to prevent structural damage from freezing temperatures. It employs
    a **two-tier operational strategy**: maintaining a critical safety floor to prevent
    ice formation and utilizing excess renewable energy to pre-heat the space during
    high solar output.\n\nReliability is ensured through a **linear backoff retry
    mechanism**, which validates state changes against potential network instability,
    and a tiered countdown timer to prevent short-cycling or runaway power consumption.\n\n---\n\n###
    Trigger Overview Table\n\n| Type | Entity / Condition | ID | Purpose |\n| :---
    | :--- | :--- | :--- |\n| Time Pattern | Every **15 minutes** | N/A | Periodic
    temperature and condition check. |\n| Numeric State | **sensor.solar_power_total**
    | N/A | Monitors for solar production above **2000W** to trigger opportunistic
    heating. |\n\n---\n\n### Operational Logic Sections\n\n#### Emergency Freeze Prevention\n*
    **Purpose**: Protect infrastructure when temperatures reach critical levels.\n*
    **Logic Overview**: Triggered if the heater is **off** AND current temperature
    is **≤ 1.5°C** OR the 24-hour minimum has dropped to **≤ 0.5°C**.\n* **Effect**:
    Activates **switch.gartenhaus_heizlufter** via retry script. Sets a **3600s**
    (1 hour) countdown if before 04:00, or **900s** (15 mins) otherwise.\n\n#### Opportunistic
    Solar Heating\n* **Purpose**: Increase ambient temperature using free solar energy.\n*
    **Logic Overview**: Triggered if heater is **off**, temperature is between **1.5°C**
    and **6.0°C**, solar production is **≥ 2000W**, daily heater consumption is **<
    1.5kWh**, and battery SoC is **> 50%**.\n* **Effect**: Activates **switch.gartenhaus_heizlufter**
    via retry script and sets a **900s** (15 mins) operation countdown.\n\n#### Hard
    Thermal Cutoff\n* **Purpose**: Prevent overheating and energy waste.\n* **Logic
    Overview**: Triggered if the heater is currently **on** and the temperature reaches
    or exceeds **11.0°C**.\n* **Effect**: Disengages **switch.gartenhaus_heizlufter**
    via retry script with mandatory state confirmation.\n\n---\n\n### Technical Overview\n\n*
    **Automation Mode**: `single` (Quietly ignores new triggers if currently running
    logic).\n* **Execution Method**: Utilizes `script.retry_action_with_backoff` for
    resilient hardware state switching.\n* **Key Inputs**:\n    * **sensor.esp32_c3_zero_epever_bme280_temperature**
    (Live Temp)\n    * **sensor.solar_power_total** (Solar Production)\n    * **sensor.felicity_ess_soc_avg**
    (Battery SoC)\n* **Controlled Entities**:\n    * **switch.gartenhaus_heizlufter**
    (Main Heater)\n    * **number.gartenhaus_heizlufter_countdown** (Run-time logic)\n*
    **Safety Mechanisms**:\n    * **Linear Backoff**: 10 retries with 5s-60s delays.\n
    \   * **Notifications**: Direct alerts to **notify.duncan** upon hardware failure.\n
    \   * **Energy Cap**: Limits opportunistic heating to **1.5kWh** daily.\n\n---\n\n###
    \U0001F4A1 Notes\n\n* **Logic Rationale**: The **1.5°C** threshold provides a
    buffer above freezing to account for sensor variance and thermal inertia. \n*
    **Battery Protection**: Solar heating is strictly inhibited if the battery is
    below **50%**, ensuring base load capacity for the household is prioritized over
    garden house pre-heating.\n* **Smart Timing**: The 1-hour emergency run-time before
    04:00 anticipates the coldest part of the night, reducing the frequency of start/stop
    cycles during high-risk hours."
  triggers:
  - trigger: time_pattern
    minutes: /15
  - trigger: numeric_state
    entity_id: sensor.solar_power_total
    above: 2000
  conditions:
  - condition: template
    value_template: '{{ is_emergency or is_opportunistic or is_hard_off }}'
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ is_emergency }}'
      sequence:
      - action: script.retry_action_with_backoff
        data:
          action_domain: switch
          action_type: turn_on
          entity_id: switch.gartenhaus_heizlufter
          target_state: 'on'
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: linear
          notify_on_failure: true
          notify_service: notify.duncan
      - action: number.set_value
        target:
          entity_id: number.gartenhaus_heizlufter_countdown
        data:
          value: '{{ 3600 if now().hour < 4 else 900 }}'
    - conditions:
      - condition: template
        value_template: '{{ is_opportunistic }}'
      sequence:
      - action: script.retry_action_with_backoff
        data:
          action_domain: switch
          action_type: turn_on
          entity_id: switch.gartenhaus_heizlufter
          target_state: 'on'
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: linear
          notify_on_failure: true
          notify_service: notify.duncan
      - action: number.set_value
        target:
          entity_id: number.gartenhaus_heizlufter_countdown
        data:
          value: 900
    - conditions:
      - condition: template
        value_template: '{{ is_hard_off }}'
      sequence:
      - action: script.retry_action_with_backoff
        data:
          action_domain: switch
          action_type: turn_off
          entity_id: switch.gartenhaus_heizlufter
          target_state: 'off'
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: linear
          notify_on_failure: true
          notify_service: notify.duncan
  variables:
    temp_now: '{{ states(''sensor.esp32_c3_zero_epever_bme280_temperature'') | float(99)
      }}'
    temp_min_24h: '{{ states(''sensor.bme280_temperature_min'') | float(99) }}'
    solar_power: '{{ states(''sensor.solar_power_total'') | float(0) }}'
    heater_on: '{{ is_state(''switch.gartenhaus_heizlufter'', ''on'') }}'
    heater_energy_today: '{{ states(''sensor.gartenhaus_heizlufter_energy_today'')
      | float(0) }}'
    battery: '{{ states(''sensor.felicity_ess_soc_avg'') | float(0) }}'
    is_emergency: '{{ not heater_on and (temp_now <= 1.5 or temp_min_24h <= 0.5) }}'
    is_opportunistic: '{{ not heater_on and 1.5 < temp_now < 6.0 and solar_power >=
      2000 and heater_energy_today < 1.5 and battery > 50 }}'
    is_hard_off: '{{ heater_on and temp_now >= 11.0 }}'
  mode: single
  max_exceeded: silent
- id: '1767700454624'
  alias: Weather Forecast Based Rollo Control
  description: This automation sets boolean inputs based on weather forecasts and
    resets them at specific times. It also handles real-time conditions like temperature
    and rain to update the rollo status.
  triggers:
  - trigger: sun
    event: sunrise
    offset: +02:00:00
    id: sunrise+2h
    alias: Reset at Sunrise + 2h
  - alias: Forecast Calculate at Sunset - 15m
    event: sunset
    trigger: sun
    id: sunset
  - trigger: numeric_state
    entity_id:
    - sensor.gw1100a_outdoor_temperature
    id: temp below
    below: 1
  - trigger: numeric_state
    entity_id:
    - sensor.gw1100a_rain_rate
    above: 0.1
    id: wet
  - trigger: state
    entity_id:
    - binary_sensor.rain_sun_flower_rain
    to:
    - 'on'
    id: wet
  - trigger: time_pattern
    minutes: /30
    id: 30m
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - sunrise+2h
      - condition: sun
        after: sunset
        before: sunrise
        before_offset: +02:00:01
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id:
          - input_boolean.forecast_temp_low
          - input_boolean.forecast_wet
        alias: Reset Forecast
      - action: input_boolean.turn_off
        metadata: {}
        data: {}
        target:
          entity_id:
          - input_boolean.rollo_was_cold
          - input_boolean.rollo_was_wet
        alias: Reset Real
      alias: Reset to off at sunrise +2h
    - conditions:
      - condition: trigger
        id:
        - sunset
      sequence:
      - sequence:
        - data:
            type: hourly
          target:
            entity_id:
            - weather.micro_weather_station
            - weather.forecast_home
          response_variable: weather_data
          action: weather.get_forecasts
        - variables:
            weather_results: "{% set ns = namespace(is_low=false, is_wet=false) %}
              {% set next_sunrise = states('sensor.sun_next_rising') | as_datetime()
              | as_local %} {% for entity_id, entity_data in weather_data.items()
              %}\n    {% set forecast = entity_data.forecast %}\n    {% for item in
              forecast %}\n        {% set item_time = item.datetime | as_datetime()
              | as_local %}\n        {% if item_time < next_sunrise %}\n            {%
              set current_temp = item.temperature %}\n            {% set low_temp
              = item.templow | default(current_temp) %}\n            {% if current_temp
              < 10 or low_temp < 10 %}\n              {% set ns.is_low = true %}\n
              \           {% endif %}\n            {% set is_precip = item.condition
              in ['rainy', 'pouring', 'snowy', 'hail', 'lightning-rainy', 'snowy-rainy']
              %}\n            {% set is_cold = current_temp < 1 or low_temp < 1 %}\n
              \           {% if is_precip and is_cold %}\n              {% set ns.is_wet
              = true %}\n            {% endif %}\n        {% endif %}\n        {%
              if ns.is_low and ns.is_wet %}\n            {% break %}\n        {% endif
              %}\n    {% endfor %}\n    {% if ns.is_low and ns.is_wet %}\n        {%
              break %}\n    {% endif %}\n{% endfor %} {{ {'low': ns.is_low, 'wet':
              ns.is_wet} }}\n"
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ weather_results.low }}'
            sequence:
            - target:
                entity_id: input_boolean.forecast_temp_low
              action: input_boolean.turn_on
          default:
          - target:
              entity_id: input_boolean.forecast_temp_low
            action: input_boolean.turn_off
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ weather_results.wet }}'
            sequence:
            - target:
                entity_id: input_boolean.forecast_wet
              action: input_boolean.turn_on
          default:
          - target:
              entity_id: input_boolean.forecast_wet
            action: input_boolean.turn_off
      alias: forecast booleans based on forecast
    - conditions:
      - condition: trigger
        id:
        - wet
        - 30m
        - temp below
      - condition: sun
        after: sunset
        before: sunrise
        before_offset: +02:00:01
      sequence:
      - choose:
        - conditions:
          - condition: trigger
            id:
            - 30m
            - temp below
          - condition: state
            entity_id: input_boolean.rollo_was_cold
            state:
            - 'off'
          - condition: numeric_state
            entity_id: sensor.gw1100a_outdoor_temperature
            below: 1
          sequence:
          - action: input_boolean.turn_on
            metadata: {}
            data: {}
            target:
              entity_id:
              - input_boolean.rollo_was_cold
        - conditions:
          - condition: trigger
            id:
            - wet
            - 30m
          - condition: state
            entity_id: input_boolean.rollo_was_wet
            state:
            - 'off'
          - condition: or
            conditions:
            - condition: numeric_state
              entity_id: sensor.gw1100a_rain_rate
              above: 0.1
            - condition: state
              entity_id: binary_sensor.rain_sun_flower_rain
              state:
              - 'on'
          sequence:
          - action: input_boolean.turn_on
            metadata: {}
            data: {}
            target:
              entity_id: input_boolean.rollo_was_wet
  mode: single
- id: '1768047602515'
  alias: Bad Spiegellicht
  description: "☀️ **Mirror Light: Sun-Based Automation**\n\n---\n\n### \U0001F4CB
    Intelligent Mirror Light Control\n\nThis automation manages the **switch.bad_spiegellicht**
    based on the solar cycle to ensure optimal bathroom lighting without manual intervention.
    \n\n* **High-Level Intent**: Automatically activate the mirror light as dusk approaches
    and deactivate it at sunrise.\n* **Operational Strategy**: Solar-driven logic
    utilizing specific offsets to preempt darkness, combined with a state-synchronization
    check upon system boot.\n* **Reliability Mechanisms**: Employs a robust retry
    script with a linear backoff strategy. This ensures that even if the hardware
    is momentarily unreachable, the system will attempt to enforce the correct state
    up to 10 times before alerting the administrator.\n\n---\n\n### Trigger Overview
    Table\n\n| Type | Entity / Condition | ID | Purpose |\n| :--- | :--- | :--- |
    :--- |\n| **Sun** | 15 min before sunset | `turn_on` | Proactively light the room
    before total darkness. |\n| **Sun** | At sunrise | `turn_off` | Conserve energy
    by disabling light during daylight. |\n| **System** | Home Assistant Start | `sync`
    | Ensure the light matches the sun state after a reboot. |\n\n---\n\n### Operational
    Logic Sections\n\n#### Evening Mode\n* **Purpose**: Illuminate the bathroom for
    nighttime use.\n* **Logic Overview**: Triggered by the sunset offset or a system
    sync when the sun is **after 15 minutes before sunset**.\n* **Effect**: Activates
    **switch.bad_spiegellicht** via retry script.\n\n#### Daylight Mode\n* **Purpose**:
    Ensure the light is extinguished during the day.\n* **Logic Overview**: Triggered
    by sunrise or a system sync when the sun is **between sunrise and 15 minutes before
    sunset**.\n* **Effect**: Deactivates **switch.bad_spiegellicht** via retry script.\n\n---\n\n###
    Technical Overview\n\n* **Automation Mode**: `single`\n* **Execution Method**:
    External script (`script.retry_action_with_backoff`)\n* **Key Inputs**: Solar
    position, System uptime\n* **Controlled Entities**: `switch.bad_spiegellicht`\n*
    **Safety Mechanisms**: \n    * **Linear Backoff**: 5s base delay scaling to 60s.\n
    \   * **Failure Notification**: Dispatches a notification to `notify.duncan` if
    the state cannot be verified after **10 retries**.\n\n---\n\n### \U0001F4A1 Notes\n\n*
    **Pre-emptive Lighting**: The **-00:15:00** offset is used to bridge the gap between
    natural light fading and official sunset, providing better utility in windowed
    environments.\n* **State Sync**: The inclusion of the `homeassistant` start event
    prevents the light from remaining in the wrong state if a power outage or restart
    occurs during a solar transition.\n* **Resilience**: Using `script.retry_action_with_backoff`
    instead of a simple `switch.turn_on` command makes this automation highly resilient
    against Zigbee/Wi-Fi mesh instability.\n"
  triggers:
  - alias: Trigger 15 minutes before sunset
    event: sunset
    offset: -00:15:00
    id: turn_on
    trigger: sun
  - alias: Trigger at sunrise
    event: sunrise
    id: turn_off
    trigger: sun
  - alias: Trigger on Home Assistant startup
    event: start
    id: sync
    trigger: homeassistant
  actions:
  - alias: Wait 30s to wrap up HA Startup
    if:
    - condition: trigger
      id:
      - sync
    then:
    - delay:
        hours: 0
        minutes: 0
        seconds: 30
        milliseconds: 0
  - choose:
    - alias: 'Condition: It is sunset or night-time'
      conditions:
      - condition: trigger
        id:
        - turn_on
        - sync
      - condition: sun
        after: sunset
        after_offset: -00:15:00
      sequence:
      - action: script.retry_action_with_backoff
        metadata: {}
        data:
          action_domain: switch
          action_type: turn_on
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: linear
          notify_on_failure: true
          notify_service: notify.duncan
          target_state: 'on'
          entity_id: switch.bad_spiegellicht
    - alias: 'Condition: It is sunrise or daytime'
      conditions:
      - condition: trigger
        id:
        - sync
        - turn_off
      - condition: sun
        before: sunset
        before_offset: -00:15:00
        after: sunrise
      sequence:
      - action: script.retry_action_with_backoff
        metadata: {}
        data:
          action_domain: switch
          action_type: turn_off
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: linear
          notify_on_failure: true
          notify_service: notify.duncan
          target_state: 'off'
          entity_id: switch.bad_spiegellicht
  mode: single
- id: '1768073928361'
  alias: Smart Meter Status Alert
  description: "  ⚠️ **Smart Meter Status Alert**\n\n\n  ### \U0001F4CB Intelligent
    Utility Monitoring Control\n\n  This automation provides proactive oversight of
    the household's smart meter\n  communication and hardware health. It ensures data
    integrity by alerting the \n  administrator if the meter reports an internal fault
    or ceases communication, \n  and automatically clears those alerts once the system
    recovers.\n\n\n  The operational strategy is **resilient**, utilizing a 30-second
    verification \n  delay to filter out transient \"blips\" while ensuring that genuine
    failures \n  are addressed before data gaps occur in the energy dashboard.\n\n\n
    \ ---\n\n\n  ### Trigger Overview Table\n\n\n  | Type | State Change | ID | Purpose
    |\n  | :--- | :--- | :--- | :--- |\n  | **State** | **to: \"on\"** | Problem |
    Detects internal hardware status fault |\n  | **State** | **to: unavailable**
    | Problem | Detects MQTT communication loss |\n  | **State** | **to: \"off\"**
    | Solved | Confirms recovery and clears active alerts |\n\n\n  ---\n\n\n  ###
    Operational Logic Sections\n\n\n  #### \U0001F6A8 Alert Phase (Problem ID)\n  -
    **Hardware Fault**: Triggered if the meter reports a \"Hardware Status 0\" (`on`)
    for 30s.\n  - **Comm Timeout**: Triggered if the MQTT stream becomes `unavailable`
    for 30s.\n  - **Effect**: Sends a high-priority notification to **notify.duncan**
    using dynamic \n    Jinja2 templating to specify the exact failure mode.\n\n\n
    \ #### ✅ Recovery Phase (Solved ID)\n  - **Purpose**: To clean up the mobile notification
    tray once the sensor returns to `off`.\n  - **Logic**: Triggered when the entity
    moves from an error state back to `off` for 30s.\n  - **Effect**: Dispatches a
    `clear_notification` command to remove the specific \n    **smart_meter_problem**
    tag from the device.\n\n\n  ---\n\n\n  ### Technical Overview\n\n\n  - **Automation
    Mode**: **single** (prevents notification \"flapping\" during rapid state changes).\n
    \ - **Safety Mechanisms**: 30-second `for` duration on all triggers to ignore
    broker restarts.\n  - **Notification Tagging**: Uses `tag: smart_meter_problem`
    for both delivery and dismissal, \n    ensuring only one relevant alert exists
    at a time.\n\n\n  ---\n\n\n  ### \U0001F4A1 Notes\n\n\n  - **Auto-Dismissal**:
    The addition of the **Solved** trigger means you no longer \n    have to manually
    swipe away alerts if the connection briefly drops and restores itself.\n  - **Template
    Logic**: The notification message dynamically switches between \"Hardware status\"
    \n    and \"Communication timeout\" based on the specific state that triggered
    the automation.\n"
  triggers:
  - entity_id:
    - binary_sensor.smart_meter_mqtt_data
    to:
    - 'on'
    trigger: state
    for:
      hours: 0
      minutes: 0
      seconds: 30
    id: Problem
  - entity_id:
    - binary_sensor.smart_meter_mqtt_data
    to:
    - unavailable
    trigger: state
    for:
      hours: 0
      minutes: 0
      seconds: 30
    id: Problem
  - entity_id:
    - binary_sensor.smart_meter_mqtt_data
    trigger: state
    for:
      hours: 0
      minutes: 0
      seconds: 30
    id: Solved
    from:
    - unavailable
    - unknown
    - 'on'
    to:
    - 'off'
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Problem
      sequence:
      - data:
          title: ⚠️ Smart Meter Alert
          message: "{% if trigger.to_state.state == \"on\" %}\n  The Smart Meter reports
            a problem (Hardware status = 0).\n{% elif trigger.to_state.state == \"unavailable\"
            %}\n  The Smart Meter stopped reporting (Communication timeout).\n{% else
            %}\n  The Smart Meter status changed to {{ trigger.to_state.state }}.\n{%
            endif %}\n"
          data:
            tag: smart_meter_problem
        action: notify.duncan
      alias: Problem
    - conditions:
      - condition: trigger
        id:
        - Solved
      sequence:
      - data:
          data:
            tag: smart_meter_problem
          message: clear_notification
        action: notify.duncan
      alias: Clear
  mode: single
- id: '1768908825981'
  alias: Timemachine NAS Sync (Hourly with Notifications)
  description: "\U0001F4E6 **Timemachine NAS Sync (Hourly with Notifications)**\n\n###
    \U0001F4CB Intelligent NAS Backup Control\n\nThis automation manages the synchronization
    process between local storage and a Network Attached Storage (NAS) device. Its
    primary intent is to ensure data redundancy by mirroring Timemachine backups on
    a consistent, hourly basis.\n\nThe operational strategy utilizes a shell-level
    mirror command followed by an intelligent evaluation of the return codes. This
    ensures that the system doesn't just run blindly but actively monitors for script
    execution errors and reports them via a dedicated notification channel, providing
    a high level of reliability for critical data backups.\n\n---\n\n### Trigger Overview
    Table\n\n| Type | Entity / Condition | ID | Purpose |\n| :--- | :--- | :--- |
    :--- |\n| **Time Pattern** | Every hour at **10** minutes past | N/A | Initiates
    the synchronization process on a fixed hourly schedule. |\n\n---\n\n### Operational
    Logic Sections\n\n#### \U0001F6E0️ Synchronization Execution\n- **Purpose**: Execute
    the core data transfer logic.\n- **Logic Overview**: Triggered automatically by
    the time pattern; no global conditions restrict execution.\n- **Effect**: Runs
    **shell_command.mirror_timemachine_to_nas** and captures the output into the **nas_response**
    variable.\n\n#### ⚠️ Error Handling & Failure Notification\n- **Purpose**: Alert
    the administrator if the backup fails.\n- **Logic Overview**: Evaluates if the
    **returncode** of the shell command is not **0**.\n- **Effect**: Sends a notification
    to **notify.duncan** containing the specific **stderr** message and applies the
    tag **nas_sync_error**.\n\n#### ✅ Success Reporting\n- **Purpose**: Provide confirmation
    of data movement when requested.\n- **Logic Overview**: Requires the **returncode**
    to be **0**, the output to contain actual file changes (ignoring \"No changes
    detected\"), and the helper **input_boolean.notify_on_nas_sync_success** to be
    **on**.\n- **Effect**: Sends a success notification to **notify.duncan** with
    the tag **nas_sync_success**.\n\n---\n\n### Technical Overview\n\n- **Automation
    Mode**: **single** (prevents overlapping sync processes)\n- **Execution Method**:
    Shell Command with captured response variables\n- **Key Inputs**: **input_boolean.notify_on_nas_sync_success**\n-
    **Controlled Entities**: **notify.duncan**\n- **Safety Mechanisms**: Return code
    validation and error string capture (**stderr**) to diagnose script-level failures.\n\n---\n\n###
    \U0001F4A1 Notes\n\n- **Efficient Notifications**: The automation distinguishes
    between a successful run with no data (quiet) and a successful run with actual
    file transfers, preventing notification fatigue.\n- **Error Transparency**: By
    passing the **stderr** directly into the notification message, troubleshooting
    can begin immediately without needing to check Home Assistant logs.\n- **Collision
    Prevention**: The **single** mode is critical here; it ensures that if a large
    backup takes longer than an hour, a second sync process will not start and potentially
    corrupt the transfer or over-tax the CPU."
  triggers:
  - minutes: '10'
    trigger: time_pattern
  conditions: []
  actions:
  - action: shell_command.mirror_timemachine_to_nas
    response_variable: nas_response
    data: {}
  - if:
    - condition: template
      value_template: '{{ nas_response is mapping and (nas_response.returncode | default(1))
        != 0 }}'
    then:
    - data:
        title: Timemachine NAS Sync Failed
        message: 'Something went wrong with the NAS mirror script!

          Error: {{ nas_response[''stderr''] }}'
        data:
          tag: nas_sync_error
      action: notify.duncan
    alias: Failure Notification
  - alias: Success Notification
    if:
    - condition: template
      value_template: "{% set stdout = (nas_response.stdout | default('')) %}\n{{
        nas_response is mapping and (nas_response.returncode | default(1)) == 0\n
        \  and (\n     'Copied 0 new snapshots' not in stdout or \n     'Deleted 0
        obsolete snapshots' not in stdout\n   )\n   and is_state('input_boolean.notify_on_nas_sync_success',
        'on') }}\n"
    then:
    - data:
        title: Timemachine NAS Sync Success
        message: 'Files were successfully mirrored to NAS.


          **Details:**

          ```

          {{ nas_response[''stdout''] }}

          ```'
        data:
          tag: nas_sync_success
      action: notify.duncan
  mode: single
- id: '1769287041355'
  alias: 'System: GFS Backup Cleanup Report'
  description: Runs generational backup cleanup and sends rich summary to UI and stripped
    text to Duncan. Includes error handling and failure counts.
  triggers:
  - trigger: time
    at: '10:00:00'
  - trigger: time
    at: '20:00:00'
  actions:
  - action: shell_command.cleanup_backups
    data:
      type: hourly
      dry_run: 0
    response_variable: hourly
  - action: shell_command.cleanup_backups
    data:
      type: daily
      dry_run: 0
    response_variable: daily
  - action: shell_command.cleanup_backups
    data:
      type: weekly
      dry_run: 0
    response_variable: weekly
  - action: shell_command.cleanup_backups
    data:
      type: monthly
      dry_run: 0
    response_variable: monthly
  - variables:
      results: '{{ [hourly, daily, weekly, monthly] }}'
      failed_count: '{{ results | selectattr(''returncode'', ''ne'', 0) | list | count
        }}'
      any_failed: '{{ failed_count > 0 }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ any_failed }}'
      sequence:
      - action: notify.persistent_notification
        data:
          title: ❌ Cleanup Failed ({{ failed_count }} error{{ 's' if failed_count
            > 1 else '' }})
          message: '**Status Report:**

            - Hourly: {{ ''✅ OK'' if hourly.returncode == 0 else ''❌ FAIL ('' ~ hourly.returncode
            ~ '')'' }}

            - Daily: {{ ''✅ OK'' if daily.returncode == 0 else ''❌ FAIL ('' ~ daily.returncode
            ~ '')'' }}

            - Weekly: {{ ''✅ OK'' if weekly.returncode == 0 else ''FAIL ('' ~ weekly.returncode
            ~ '')'' }}

            - Monthly: {{ ''✅ OK'' if monthly.returncode == 0 else ''FAIL ('' ~ monthly.returncode
            ~ '')'' }}


            The maintenance report was not sent to Duncan.

            '
      - stop: Cleanup failed with {{ failed_count }} error(s).
    default:
    - if:
      - condition: state
        entity_id: input_boolean.notify_on_nas_sync_success
        state:
        - 'on'
      then:
      - variables:
          report_json: "{% set ns = namespace(total_mb=0, total_files=0, list=\"\")
            %} {% for r in results if r.stdout is defined and r.stdout | trim != \"\"
            %}\n  {% set data = r.stdout | from_json %}\n  {% set ns.list = ns.list
            + \"- **\" + data.type | capitalize + \":** \" + data.files_to_delete
            | string + \" files (\" + data.space_to_free_MB | string + \" MB)\\n\"
            %}\n  {% set ns.total_mb = ns.total_mb + (data.space_to_free_MB | float(0))
            %}\n  {% set ns.total_files = ns.total_files + (data.files_to_delete |
            int(0)) %}\n{% endfor %} {{ {'list': ns.list, 'total_gb': (ns.total_mb
            / 1024) | round(2), 'count': ns.total_files} }}\n"
      - action: notify.persistent_notification
        data:
          title: "\U0001F4BE Backup Cleanup Summary"
          message: "{% set info = report_json %}\n### Generational Cleanup Status\n{{
            info.list }} \n--- \n**Total Reclaimed:** {{ info.total_gb }} GB\n**Total
            Files Removed:** {{ info.count }}\n"
      - action: notify.duncan
        data:
          title: NAS Maintenance Complete
          message: "{% set info = report_json %}\nBackup cleanup report for today:\n
            \ {{ info.list | replace('**', '') }}\nTotal space freed: {{ info.total_gb
            }} GB.\n"
          data:
            tag: nas_maintenance_complete
- id: '1769546818976'
  alias: NAS Connectivity Monitor
  description: "\U0001F4BE **NAS Connectivity Monitor**\n\n### \U0001F4CB Intelligent
    Storage Connectivity Control\n\nThis automation provides real-time oversight of
    Network Attached Storage (NAS) mount points. It is designed with a **safety-first**
    communication strategy, ensuring that administrative personnel are immediately
    alerted to storage disconnections while maintaining a clean notification history
    through automated dismissal logic.\n\nThe operational strategy relies on **state-tracking
    with persistence validation** to prevent flapping and ensures that high-priority
    alerts are delivered only when a genuine interruption occurs.\n\n---\n\n### Trigger
    Overview Table\n\n| Type | Entity / Condition | ID | Purpose |\n| :--- | :---
    | :--- | :--- |\n| **State** | `binary_sensor.nas_share_verbunden`, `binary_sensor.nas_filme_verbunden`
    | `disconnected` | Detects when a NAS share transition from **on** to **off**.
    |\n| **State** | `binary_sensor.nas_share_verbunden`, `binary_sensor.nas_filme_verbunden`
    | `reconnected` | Confirms a stable reconnection after a **1-minute** duration.
    |\n\n---\n\n### Operational Logic Sections\n\n#### ⚠️ Disconnected Mode\n- **Purpose**:
    Immediate notification of storage unavailability.\n- **Logic Overview**: Triggered
    instantly when a monitored sensor reports an **off** state.\n- **Effect**: Sends
    a **high-priority** notification to `notify.admin` containing the specific entity
    name and a timestamp. The alert is assigned a unique **tag** based on the entity
    ID for targeted management.\n\n#### ✅ Reconnected Mode\n- **Purpose**: Automated
    workspace cleanup and status restoration.\n- **Logic Overview**: Triggered when
    a sensor returns to **on** and remains stable for **00:01:00**.\n- **Effect**:
    Issues a `clear_notification` command to the admin device, removing the specific
    alert associated with the restored share.\n\n---\n\n### Technical Overview\n\n-
    **Automation Mode**: `parallel` (Allows simultaneous monitoring of multiple shares)\n-
    **Execution Method**: Direct `notify.admin` action calls with dynamic data templates.\n-
    **Key Inputs**: `binary_sensor.nas_share_verbunden`, `binary_sensor.nas_filme_verbunden`\n-
    **Controlled Entities**: Administrative notification engine (`notify.admin`).\n-
    **Safety Mechanisms**: \n    - **Notification Tagging**: Uses `nas-alert-{{ trigger.entity_id
    }}` to ensure the system only clears the alert for the specific share that reconnected.\n
    \   - **Stability Delay**: A 1-minute `for` duration on reconnection prevents
    premature \"all-clear\" messages during intermittent network toggling.\n\n---\n\n###
    \U0001F4A1 Notes\n\n- **Rationale**: The use of `priority: high` ensures that
    connection drops bypass \"Do Not Disturb\" settings on supported devices, reflecting
    the critical nature of storage availability.\n- **Logic Highlight**: The automation
    utilizes **Parallel mode** to ensure that if both `share` and `filme` sensors
    drop simultaneously, both notification paths are processed independently without
    queuing or cancellation.\n- **Fail-safe**: Reconnection triggers require a 60-second
    dwell time to filter out \"flapping\" network states that might otherwise spam
    the administrator.\n"
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.nas_share_verbunden
    - binary_sensor.nas_filme_verbunden
    from: 'on'
    to: 'off'
    id: disconnected
  - trigger: state
    entity_id:
    - binary_sensor.nas_share_verbunden
    - binary_sensor.nas_filme_verbunden
    from: 'off'
    to: 'on'
    for:
      minutes: 1
    id: reconnected
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: disconnected
      sequence:
      - action: notify.admin
        data:
          title: ⚠️ NAS Connection Alert
          message: 'The sensor {{ trigger.to_state.name }} reported a status of "{{
            trigger.to_state.state }}" at {{ now().strftime(''%H:%M:%S'') }}.

            '
          data:
            tag: nas-alert-{{ trigger.entity_id }}
            group: NAS Status
            priority: high
    - conditions:
      - condition: trigger
        id: reconnected
      sequence:
      - action: notify.admin
        data:
          message: clear_notification
          data:
            tag: nas-alert-{{ trigger.entity_id }}
  mode: parallel
- id: 1705101110242_battery_plus_low
  alias: 'Notify: Offline or Low Battery Devices (Detailed)'
  description: "# \U0001F50B **Notify: Offline or Low Battery Devices**\n\n### \U0001F4CB
    Intelligent Battery Monitoring System Control\n\n**Intent**\nAutomated health
    monitoring for the smart home ecosystem, designed to preemptively identify and
    notify the administrator of hardware maintenance requirements.\n\n**Operational
    Strategy**\nThe system performs a daily deep-scan of the entity registry at a
    scheduled time. It evaluates all battery-class sensors for two critical failure
    states: communication loss (**Unavailable/Unknown**) or power depletion (**Below
    Threshold**). \n\n**Reliability Mechanisms**\nUses a comprehensive template-based
    aggregation method that dynamically filters a global exclusion list to prevent
    false positives from mobile devices or transient entities. It leverages `battery_plus`
    integration data to provide actionable maintenance information (battery types
    and quantities) directly within the alert.\n\n---\n\n### Trigger Overview Table\n\n|
    Type | Entity / Condition | ID | Purpose |\n| :--- | :--- | :--- | :--- |\n| **Time**
    | `10:30:00` | N/A | Initiates the daily maintenance scan during active morning
    hours. |\n\n---\n\n### Operational Logic Sections\n\n#### Battery Health Evaluation\n\n**Purpose**\nTo
    identify hardware requiring physical intervention (recharging, replacement, or
    reconnection).\n\n**Logic Overview**\nThe automation triggers only if the `battery_alert_list`
    is not empty and the current day matches the `day` variable (0 = Daily). It inspects
    all `sensor` and `binary_sensor` entities with a `device_class` of **battery**.\n*
    **Offline Check:** Detects if state is **unavailable** or **unknown**.\n* **Level
    Check:** Detects if numeric state is **≤ 15%** or if binary state is **on**.\n\n**Effect**\nGenerates
    a formatted list and dispatches a persistent notification via **notify.duncan**
    with the tag `offline_devices`.\n\n---\n\n### Technical Overview\n\n* **Automation
    Mode:** `single`\n* **Execution Method:** Direct action via `notify.duncan`.\n*
    **Key Inputs:** * `low_battery_threshold`: **15**\n    * `day`: **0** (All days)\n*
    **Controlled Entities:** Notification service (`notify.duncan`).\n* **Safety Mechanisms:**
    * **Exclusion Filter:** Hardcoded list of mobile devices (e.g., `sensor.fp4_battery_level`)
    to ignore non-static hardware.\n    * **Battery Plus Integration:** Automatically
    attempts to pull `battery_type_and_quantity` attributes to assist in hardware
    replacement.\n\n---\n\n### \U0001F4A1 Notes\n\n* **Dynamic Discovery:** The template
    automatically discovers new battery devices without manual configuration, provided
    they have the correct `device_class`.\n* **Contextual Awareness:** By checking
    `device_id(s.entity_id)`, the logic links generic sensors to their parent device
    to pull specific battery hardware requirements (e.g., \"2x CR2032\"), reducing
    maintenance friction.\n* **Noise Reduction:** Uses a `trim` check in the condition
    to ensure the notification engine is never fired for an empty list.\n"
  triggers:
  - at: '10:30:00'
    trigger: time
  conditions:
  - condition: template
    value_template: '{{ battery_alert_list|trim != '''' and (day == 0 or day == now().isoweekday())
      }}'
  actions:
  - action: notify.duncan
    data:
      title: "\U0001FAAB Battery Issues Detected"
      message: 'The following battery-powered devices need attention:


        {{ battery_alert_list }}

        '
      data:
        tag: offline_devices
  variables:
    day: 0
    low_battery_threshold: 15
    exclude:
    - sensor.fp4_battery_level
    - sensor.iphone_von_enya_battery_level
    - sensor.enyas_iphone_battery
    - sensor.stephans_iphone_battery_status
    - sensor.poco_f7_battery_level
    - sensor.mi_9t_battery_level
    battery_alert_list: "{%- set entities =\n    (states.sensor\n      | selectattr('attributes.device_class',
      'defined')\n      | selectattr('attributes.device_class', 'eq', 'battery')\n
      \     | rejectattr('entity_id', 'search', '_battery_plus$')\n      | list)\n
      \   +\n    (states.binary_sensor\n      | selectattr('attributes.device_class',
      'defined')\n      | selectattr('attributes.device_class', 'eq', 'battery')\n
      \     | rejectattr('entity_id', 'search', '_battery_plus$')\n      | list)\n-%}\n\n{%-
      set result = namespace(items=[]) -%}\n\n{%- for s in entities -%}\n  {%- if
      s.entity_id in exclude -%}\n    {%- continue -%}\n  {%- endif -%}\n\n  {%- set
      state = s.state -%}\n\n  {# Determine if the sensor is offline #}\n  {%- set
      is_offline = state in ['unavailable', 'unknown'] -%}\n\n  {# Determine if the
      sensor is low battery #}\n  {%- set is_low = false -%}\n  {%- if not is_offline
      -%}\n    {%- if s.domain == 'sensor' -%}\n      {%- set value = state | float(-1)
      -%}\n      {%- set is_low = value >= 0 and value <= low_battery_threshold -%}\n
      \   {%- elif s.domain == 'binary_sensor' -%}\n      {%- set is_low = state ==
      'on' -%} {# on = low battery #}\n    {%- endif -%}\n  {%- endif -%}\n\n  {%-
      if not (is_offline or is_low) -%}\n    {%- continue -%}\n  {%- endif -%}\n\n
      \ {# Lookup _battery_plus info if available #}\n  {%- set dev_id = device_id(s.entity_id)
      -%}\n  {%- set battery_info = none -%}\n  {%- for e in device_entities(dev_id)
      -%}\n    {%- if e.endswith('_battery_plus') -%}\n      {%- set battery_info
      = state_attr(e, 'battery_type_and_quantity') -%}\n      {%- break -%}\n    {%-
      endif -%}\n  {%- endfor -%}\n\n  {# Set status text #}\n  {%- set status =\n
      \     \"Offline\"\n      if is_offline\n      else \"Low battery\"\n      if
      s.domain == 'binary_sensor'\n      else \"Low battery (\" ~ value | int ~ \"%)\"\n
      \ -%}\n\n  {# Build single-line alert #}\n  {%- set line =\n    \"• \"\n    ~
      s.name ~ \" (\" ~ s.entity_id ~ \")\"\n    ~ \" — \" ~ status\n    ~ (\n      \"
      — \" ~ battery_info\n      if battery_info is not none\n      else \"\"\n    )\n
      \ -%}\n\n  {%- set result.items = result.items + [line] -%}\n{%- endfor -%}\n\n{{
      result.items | join('\\n') }}"
  mode: single
- id: '1769760819099'
  alias: 'ESPHome: Controlled Firmware Auto-Update'
  description: "# ⚡ **ESPHome: Controlled Firmware Auto-Update**\n\n### \U0001F4CB
    Intelligent ESPHome Lifecycle Control\nThis automation manages the lifecycle of
    ESPHome firmware updates across the fleet. It employs a **throttled deployment
    strategy** to ensure network stability and avoid mass-failure scenarios. By evaluating
    version strings, the system distinguishes between routine maintenance and critical
    version jumps, ensuring devices remain secure without requiring manual intervention
    for every patch.\n\nThe strategy relies on a **safety-first approach**: it ignores
    devices already in an active update state and uses **Spook** integrations to manage
    visibility and suppress secondary update alerts during the automated process.\n\n---\n\n###
    Trigger Overview Table\n| Type | Entity / Condition | ID | Purpose |\n| :--- |
    :--- | :--- | :--- |\n| **Time** | `10:00:00` | N/A | Initiates the daily update
    cycle during peak monitoring hours. |\n\n---\n\n### Operational Logic Sections\n\n####
    \U0001F50D Update Eligibility Assessment\n* **Purpose**: Identify which devices
    require firmware installation based on version history.\n* **Logic Overview**:
    Filters all **ESPHome** update entities. A device is marked eligible if it is
    not currently `in_progress` and meets one of two criteria:\n    * **Month Change**:
    The latest version reflects a new monthly release (Year/Month).\n    * **Patch
    Gap**: The difference between the installed and latest patch version is **>= 2**.\n*
    **Effect**: Generates a list of target entities and prepares the `eligible_updates`
    variable.\n\n#### \U0001F6E0 Controlled Deployment (Daily Batch)\n* **Purpose**:
    Execute the updates while preventing network congestion.\n* **Logic Overview**:
    Limits the execution to a maximum of **5 devices** per day (`updates_today`).\n*
    **Effect**: \n    * Applies the `haghs_ignore` label to all eligible entities
    to silence external managers.\n    * Sequentially removes the label for the specific
    batch item and calls `update.install`.\n\n#### \U0001F4E2 Notification & Reporting\n*
    **Purpose**: Provide visibility into automated changes.\n* **Logic Overview**:
    Only triggers if the `update_message` contains processed devices.\n* **Effect**:
    Sends a mobile notification via `notify.duncan` and creates a **Persistent Notification**
    in the UI with direct links to the ESPHome dashboard and Update settings.\n\n---\n\n###
    Technical Overview\n* **Automation Mode**: `single` (Prevents overlapping execution
    runs).\n* **Execution Method**: Direct action calls with `repeat.for_each` looping.\n*
    **Key Inputs**: `patch_gap_threshold` (Set to **2**).\n* **Controlled Entities**:
    All entities belonging to the **ESPHome** integration matching the `update.` domain.\n*
    **Safety Mechanisms**: \n    * **State Check**: Skips devices where `in_progress`
    is true.\n    * **Throttling**: Strict limit of **5** installs per 24-hour cycle.\n
    \   * **Label Management**: Uses `haghs_ignore` to prevent conflicting automation
    logic (via HAGHS).\n\n---\n\n### \U0001F4A1 Notes\n* **Version Parsing**: The
    logic manually splits the version strings (Year.Month.Patch) to calculate the
    `latest_months` vs `installed_months`, allowing it to catch updates even if the
    patch number resets in a new month.\n* **Label Logic**: By adding labels to all
    eligible updates but only removing them for the ones being updated, the automation
    ensures that \"pending\" updates for tomorrow stay hidden from other notification
    systems.\n* **Maintenance**: If a device fails to update, it will naturally remain
    in the `eligible_updates` list for the next day's cycle."
  triggers:
  - trigger: time
    at: '10:00:00'
  conditions: []
  actions:
  - variables:
      patch_gap_threshold: 2
      esphome_update_entities: "{{ integration_entities('esphome')\n   | select('match',
        '^update\\\\.')\n   | list }}"
      eligible_updates: "{% set ns = namespace(items=[]) %} {% for e in esphome_update_entities
        %}\n  {% set installed = state_attr(e, 'installed_version') %}\n  {% set latest
        = state_attr(e, 'latest_version') %}\n  {% set in_progress = state_attr(e,
        'in_progress') %}\n\n  {% if installed and latest and not in_progress and
        installed != latest %}\n    {% set i = installed.split('.')[:3] %}\n    {%
        set l = latest.split('.')[:3] %}\n\n    {% if i | length >= 2 and l | length
        >= 2 %}\n      {% set installed_year = i[0] | int %}\n      {% set installed_month
        = i[1] | int %}\n      {% set installed_patch = i[2] | int if i | length >
        2 else 0 %}\n\n      {% set latest_year = l[0] | int %}\n      {% set latest_month
        = l[1] | int %}\n      {% set latest_patch = l[2] | int if l | length > 2
        else 0 %}\n\n      {% set installed_months = installed_year * 12 + installed_month
        %}\n      {% set latest_months = latest_year * 12 + latest_month %}\n\n      {%
        set month_changed = (latest_months - installed_months) >= 1 %}\n      {% set
        patch_gap = (latest_patch - installed_patch) >= patch_gap_threshold %}\n\n
        \     {% if month_changed or patch_gap %}\n        {% set ns.items = ns.items
        + [\n          {\n            \"entity\": e,\n            \"name\": state_attr(e,
        'friendly_name') or e,\n            \"from\": installed,\n            \"to\":
        latest\n          }\n        ] %}\n      {% endif %}\n    {% endif %}\n  {%
        endif %}\n{% endfor %} {{ ns.items }}"
      updates_today: '{{ eligible_updates[:5] }}'
      update_message: "{% for item in updates_today %} \n• {{ item.name }} updated
        from {{ item.from}} → {{ item.to }}\n{% endfor %}\n          \n"
  - if:
    - condition: template
      value_template: '{{ eligible_updates | length > 0 }}'
    then:
    - action: homeassistant.add_label_to_entity
      data:
        label_id:
        - haghs_ignore
        entity_id: '{{ eligible_updates | map(attribute=''entity'') | list }}'
      enabled: true
    - repeat:
        for_each: '{{ updates_today }}'
        sequence:
        - action: homeassistant.remove_label_from_entity
          data:
            label_id:
            - haghs_ignore
            entity_id:
            - '{{ repeat.item.entity }}'
        - target:
            entity_id: '{{ repeat.item.entity }}'
          action: update.install
          data: {}
          continue_on_error: true
      enabled: true
    - if:
      - condition: template
        value_template: '{{ update_message | trim | length > 0 }}'
      then:
      - action: notify.duncan
        data:
          title: ESPHome Firmware Updates Installed
          message: '{{ update_message }}'
          data:
            actions:
            - action: URI
              title: Open ESPHome
              uri: /hassio/ingress/5c53de3b_esphome
            - action: URI
              title: Open Updates
              uri: /config/updates
      - action: persistent_notification.create
        data:
          title: ESPHome Firmware Updates Installed
          message: '{{ update_message |replace(''

            '',''<br>'') }}'
  mode: single
- id: '1770413807856'
  alias: Tablet Battery Status Alerts
  description: Sends notifications based on battery bands and clears them when 'ok'.
    Consolidated low-level alerts to reduce repetition.
  triggers:
  - trigger: state
    entity_id:
    - sensor.lenovo_p11_battery
    attribute: band
    for:
      hours: 0
      minutes: 0
      seconds: 30
  conditions:
  - condition: template
    value_template: "{{ trigger.from_state is not none and \n   trigger.to_state.attributes.band
      != trigger.from_state.attributes.band }}"
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.to_state.attributes.band in [''critical'', ''very_low'',
          ''low'', ''warn''] and (trigger.from_state.state | float(100)) > (trigger.to_state.state
          | float(0))}}'
      sequence:
      - action: notify.duncan
        data:
          title: "{% set titles = {\n  'critical': '\U0001F534 Tablet Battery Critical!',\n
            \ 'very_low': '\U0001F7E0 Tablet Battery Low',\n  'low': '\U0001F7E1 Tablet
            Battery Getting Low',\n  'warn': '⚠️ Tablet Battery Notice'\n} %} {{ titles.get(trigger.to_state.attributes.band)
            }}"
          message: Lenovo Tab P11 battery is at {{ states('sensor.lenovo_p11_battery')
            }}%. {{ 'Plug it in now!' if trigger.to_state.attributes.band == 'critical'
            }} {{ 'Charger issue?' if trigger.to_state.attributes.band == 'very_low'
            }}
          data:
            tag: lenovo_p11_battery_warning
      - if:
        - condition: template
          value_template: '{{ trigger.to_state.attributes.band in [''critical'', ''very_low'',
            ''low''] }}'
        then:
        - action: script.restart_charging_process
      alias: Warn and Restart Charging
    - conditions:
      - condition: template
        value_template: '{{ trigger.to_state.attributes.band == ''ok'' }}'
      sequence:
      - action: notify.duncan
        data:
          message: clear_notification
          data:
            tag: lenovo_p11_battery_warning
      alias: Clear Warning
  mode: single
- id: '1770812457380'
  alias: Night Battery Charge/Discharge Energy
  description: "\U0001F319 **Night Battery Charge/Discharge Energy**\n\n### \U0001F4CB
    Intelligent Battery Energy Monitoring Control\n\nThis automation manages the historical
    logging and cycling of battery energy statistics based on the solar cycle. Its
    primary intent is to capture and archive total energy charged and discharged during
    distinct day and night periods before resetting the active counters for the next
    phase.\n\nThe operational strategy relies on the **Sun** entity to provide precise
    temporal boundaries, ensuring that daily solar production and nightly consumption
    are compartmentalized accurately. By utilizing a sequential \"Capture-then-Reset\"
    logic, the system maintains high data integrity for long-term energy tracking.\n\n---\n\n###
    Trigger Overview Table\n\n| Type | Entity / Condition | ID | Purpose |\n| :---
    | :--- | :--- | :--- |\n| **Sun** | `sunrise` (+00:00:01) | `Rise` | Archive night-time
    performance and prepare for solar charging phase. |\n| **Sun** | `sunset` (+00:00:01)
    | `Set` | Archive daytime performance and prepare for nocturnal discharge phase.
    |\n\n---\n\n#### \U0001F305 Sunrise (End of Night Phase)\n* **Purpose**: Archive
    energy metrics from the preceding night and reset sensors for the day.\n* **Logic
    Overview**: Triggered 1 second after **sunrise**.\n* **Effect**: \n    * Copies
    **sensor.day_night_battery_charged_energy** to **input_number.last_night_battery_charged**.\n
    \   * Copies **sensor.night_battery_energy_discharged** to **input_number.last_night_battery_discharged**.\n\n####
    \U0001F307 Sunset (End of Day Phase)\n* **Purpose**: Archive energy metrics from
    the preceding day and reset sensors for the night.\n* **Logic Overview**: Triggered
    1 second after **sunset**.\n* **Effect**: \n    * Copies **sensor.day_night_battery_charged_energy**
    to **input_number.last_day_battery_charged**.\n    * Copies **sensor.night_battery_energy_discharged**
    to **input_number.last_day_battery_discharged**.\n\n---\n\n### Technical Overview\n\n*
    **Automation Mode**: `single`\n* **Execution Method**: Direct state snapshots
    and `utility_meter.reset` service calls.\n* **Key Inputs**: `sensor.day_night_battery_charged_energy`,
    `sensor.night_battery_energy_discharged`.\n* **Controlled Entities**: \n    *
    `input_number.last_night_battery_charged`\n    * `input_number.last_night_battery_discharged`\n
    \   * `input_number.last_day_battery_charged`\n    * `input_number.last_day_battery_discharged`\n*
    **Safety Mechanisms**: \n    * **1-second offset** on triggers ensures the solar
    state transition is fully registered by the system.\n    * **2-second delay**
    between data archival and sensor reset prevents race conditions, ensuring values
    are saved before the sensors are cleared.\n    * **Float casting** with a default
    of **0** ensures the automation does not fail if a sensor is temporarily unavailable.\n\n---\n\n###
    \U0001F4A1 Notes\n\n* **Precision**: Values are rounded to **2 decimal places**
    to maintain clean historical records without floating-point errors.\n* **Data
    Integrity**: The use of `utility_meter.reset` allows for a clean slate at every
    transition, making these sensors ideal for use in custom energy dashboards or
    long-term statistics.\n* **Timing**: The slight delay in the action sequence acts
    as a \"buffer\" to ensure the database write for the `input_number` entities is
    initiated before the source sensors are zeroed out.\n"
  triggers:
  - event: sunrise
    offset: +00:00:01
    id: Rise
    trigger: sun
  - event: sunset
    offset: +00:00:01
    id: Set
    trigger: sun
  conditions: []
  actions:
  - alias: 'Save last night '
    if:
    - condition: trigger
      id:
      - Rise
    then:
    - action: input_number.set_value
      metadata: {}
      data:
        value: '{{ states(''sensor.day_night_battery_charged_energy'') | float(0)
          | round(2) }}

          '
      target:
        entity_id: input_number.last_night_battery_charged
    - action: input_number.set_value
      metadata: {}
      data:
        value: '{{ states(''sensor.night_battery_energy_discharged'') | float(0) |
          round(2) }}

          '
      target:
        entity_id: input_number.last_night_battery_discharged
  - alias: Save last day
    if:
    - condition: trigger
      id:
      - Set
    then:
    - action: input_number.set_value
      metadata: {}
      data:
        value: '{{ states(''sensor.day_night_battery_charged_energy'') | float(0)
          | round(2) }}

          '
      target:
        entity_id: input_number.last_day_battery_charged
    - action: input_number.set_value
      metadata: {}
      data:
        value: '{{ states(''sensor.night_battery_energy_discharged'') | float(0) |
          round(2) }}

          '
      target:
        entity_id: input_number.last_day_battery_discharged
  - delay:
      hours: 0
      minutes: 0
      seconds: 2
      milliseconds: 0
  - action: utility_meter.reset
    data: {}
    target:
      entity_id:
      - sensor.day_night_battery_charged_energy
      - sensor.night_battery_energy_discharged
  mode: single
- id: '1774379053766'
  alias: Heizungsverteiler EG Überstrom dynamisch
  description: "⚡ **Heizungsverteiler EG Überstrom dynamisch**\n\n\n  ### \U0001F4CB
    Intelligent Overcurrent Protection Control\n\n\n  This automation provides a multi-tiered
    safety layer for the\n  **Heizungsverteiler EG** by monitoring electrical current
    in real-time. It\n  acts as a digital circuit breaker, responding dynamically
    to different load\n  intensities to prevent hardware damage or electrical hazards.\n\n\n
    \ **Operational Strategy:**\n\n  * **Proactive Monitoring:** Uses staggered `numeric_state`
    thresholds to\n  identify escalating power draws.\n\n  * **Risk-Based Response:**
    Implements an inverse-time characteristic where\n  higher currents trigger faster
    shutdown responses.\n\n  * **Reliability Mechanism:** Utilizes a robust retry
    script with linear\n  backoff to ensure the **turn_off** command is successfully
    executed and\n  verified, even during transient interference.\n\n\n  ---\n\n\n
    \ ### Trigger Overview Table\n  \n\n  | Type | Entity / Condition | ID | Purpose
    |\n  | :--- | :--- | :--- | :--- |\n  | Numeric State | **Current** 1A - 2A for
    30s | `zone_1` | Low-level overload detection (sustained) |\n  | Numeric State
    | **Current** 2A - 4A for 15s | `zone_2` | Moderate overload detection |\n  |
    Numeric State | **Current** > 4A for 5s | `zone_3` | High-level/Critical overload
    (rapid response) |\n\n\n  ---\n\n\n  ### Operational Logic Sections\n\n\n  ####
    Zone 1: Sustained Low Overload\n\n  * **Purpose:** Protects against minor but
    persistent overcurrent conditions.\n\n  * **Logic Overview:** Triggered when current
    stays between **1A** and **2A**\n  for at least **30 seconds**.\n\n  * **Effect:**
    Executes the retry-based shutdown and sends a Zone 1 specific\n  notification
    to **notify.duncan**.\n\n\n  #### Zone 2: Moderate Overload\n\n  * **Purpose:**
    Responds to significant load increases that exceed normal\n  operating parameters.\n\n
    \ * **Logic Overview:** Triggered when current stays between **2A** and **4A**\n
    \ for **15 seconds**.\n\n  * **Effect:** Executes the retry-based shutdown and
    sends a Zone 2 specific\n  notification to **notify.duncan**.\n\n\n  #### Zone
    3: Critical Overload\n\n  * **Purpose:** Immediate safety intervention for high-current
    spikes or\n  faults.\n\n  * **Logic Overview:** Triggered when current exceeds
    **4A** for only **5\n  seconds**.\n\n  * **Effect:** Executes the retry-based
    shutdown and sends a high-priority\n  \"Immediate\" notification to **notify.duncan**.\n\n\n
    \ ---\n\n\n  ### Technical Overview\n\n\n  * **Automation Mode:** `single` (Prevents
    overlapping execution during a\n  single event)\n\n  * **Execution Method:** `script.retry_action_with_backoff`\n\n
    \ * **Key Inputs:** `sensor.heizungsverteiler_eg_current`\n\n  * **Controlled
    Entities:** `switch.heizungsverteiler_eg`\n\n  * **Safety Mechanisms:** * **Verified
    Shutdown:** 10 retries with linear\n  backoff (5s to 60s delay).\n      * **State
    Condition:** Only runs if the switch is currently **on**.\n      * **Failure Notification:**
    Direct alert if the retry script fails to confirm the \"off\" state.\n\n  ---\n\n\n
    \ ### \U0001F4A1 Notes\n\n\n  * **Inverse-Time Logic:** The automation mimics
    professional circuit breakers\n  where the time-to-trip decreases as the current
    increases, providing a balance\n  between avoiding nuisance trips and ensuring
    safety.\n\n  * **Retry Script:** By using `script.retry_action_with_backoff`,
    the system\n  accounts for potential Zigbee/Z-Wave mesh congestion that might
    otherwise\n  cause a single \"off\" command to fail.\n\n  * **Informative Alerts:**
    Templates are used to provide the exact amperage\n  that triggered the shutdown,
    allowing for faster troubleshooting of the\n  connected load."
  triggers:
  - entity_id:
    - sensor.heizungsverteiler_eg_current
    above: 1
    for:
      seconds: 30
    id: zone_1
    trigger: numeric_state
  - entity_id:
    - sensor.heizungsverteiler_eg_current
    above: 2
    for:
      seconds: 15
    id: zone_2
    trigger: numeric_state
  - entity_id: sensor.heizungsverteiler_eg_current
    above: 4
    for:
      seconds: 5
    id: zone_3
    trigger: numeric_state
  conditions:
  - condition: state
    entity_id: switch.heizungsverteiler_eg
    state:
    - 'on'
  actions:
  - data:
      entity_id: switch.heizungsverteiler_eg
      target_state: 'off'
      max_retries: 10
      base_delay: 5
      max_delay: 60
      backoff_type: linear
      notify_on_failure: true
      notify_service: notify.duncan
      action_domain: switch
      action_type: turn_off
    action: script.retry_action_with_backoff
  - if:
    - condition: state
      entity_id: switch.heizungsverteiler_eg
      state:
      - 'off'
    then:
    - data:
        message: Der Heizungsverteiler EG wurde abgeschaltet, weil der Strom {{ trigger.to_state.state
          }} A erreicht hat.
        title: ⚠️ Heizungsverteiler EG abgeschaltet ({{ '1-2 A' if trigger.id == 'zone_1'
          else '2-4 A' if trigger.id == 'zone_2' else '>4 A' }})
      action: notify.duncan
  mode: single
- id: '1776516638185'
  alias: DB Purge Entities under 10 days (by labels)
  description: Optimized Label-Based Retention Purge
  triggers:
  - trigger: time
    at: 01:00:00
    id: 1d
  - trigger: time
    at: '13:00:00'
    id: 1d
  - trigger: time
    at: 02:30:00
    id: 2d
  - trigger: time
    at: '14:30:00'
    id: 2d
  - trigger: time
    at: 04:00:00
    id: 3d
  - trigger: time
    at: '16:00:00'
    id: 3d
  - trigger: time
    at: 05:30:00
    id: 7d
  - trigger: time
    at: '17:30:00'
    id: 7d
  actions:
  - variables:
      target_label: retention_{{ trigger.id }}
      keep_days: '{{ trigger.id | replace(''d'', '''') | int }}'
      threshold_offset: '{{ {''1d'': 10000, ''2d'': 40000, ''3d'': 75000, ''7d'':
        20000}.get(trigger.id, 5000) }}'
      entities_to_purge: '{% set target = target_label %} {% set all_retention = labels()
        | select(''match'', ''^retention_'') | list %}

        {# Get entities from labels and devices #} {% set target_ents = (label_entities(target)
        + (label_devices(target) | map(''device_entities'') | sum(start=[]))) | unique
        | list %}

        {# Check for conflicts (entities that have other retention labels) #} {% set
        other_labels = all_retention | reject(''eq'', target) | list %} {% set conflict_ents
        = other_labels | map(''label_entities'') | sum(start=[]) | unique | list %}

        {# Final list: in target, not in conflict list #} {{ target_ents | reject(''in'',
        conflict_ents) | list }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ entities_to_purge | length > 0 }}'
      sequence:
      - parallel:
        - action: script.turn_on
          target:
            entity_id: script.save_counts_and_notify_purge_status
          data:
            variables:
              threshold_offset: '{{ threshold_offset }}'
              timeout_minutes: 30
              block_id: '{{ trigger.id }}'
        - action: recorder.purge_entities
          data:
            entity_id: '{{ entities_to_purge }}'
            keep_days: '{{ keep_days }}'
    default:
    - action: persistent_notification.create
      data:
        title: 'Purge DB: {{ trigger.id }} Skipped'
        message: No entities found for {{ target_label }} at {{ now().strftime('%H:%M')
          }}.
  mode: queued
  max: 10
- id: '1776685987869'
  alias: 'Shawn: Master System Monitor'
  description: "## \U0001F916 **Shawn: Master System Monitor**\n\n---\n\n### \U0001F4CB
    Intelligent Mower Watchdog Control\n\nThis automation serves as a comprehensive
    monitoring suite for the robotic mower \"Shawn,\" ensuring hardware safety, operational
    efficiency, and maintenance consistency. \n\n**High-Level Intent:**  \nTo act
    as a fail-safe layer that bridges the gap between hardware status and user awareness,
    ensuring that the mower is neither lost, stuck, nor idling during designated work
    windows.\n\n**Operational Strategy:**  \nThe system employs a **safety-first**
    approach, prioritizing hardware error codes and connectivity loss. It also utilizes
    a **schedule-aware productivity check** to ensure the mower adheres to its programmed
    work plan when conditions (weather and battery) are optimal.\n\n**Reliability
    Mechanisms:**  \nUses distinct trigger IDs to branch logic into specific notification
    and maintenance paths, including a navigation timeout watchdog and a weekly edge-maintenance
    routine.\n\n---\n\n### Trigger Overview Table\n\n| Type | Entity / Condition |
    ID | Purpose |\n| :--- | :--- | :--- | :--- |\n| **State** | **sensor.shawn_rasenmaher_status**
    | `lost` | Detects navigation timeouts when returning home (>20m). |\n| **State**
    | **binary_sensor.shawn_online** | `offline` | Alerts on connection loss exceeding
    2 minutes. |\n| **Numeric** | **sensor.shawn_batterie** | `battery` | Monitors
    for critical discharge levels (<15%). |\n| **State** | **sensor.shawn_fehlercode**
    | `error` | Captures hardware interrupts and safety stops. |\n| **Time** | **Every
    15 Minutes** | `slacker_check` | Periodic audit of productivity vs. schedule.
    |\n| **Numeric** | **sensor.shawn_batterie** | `full_enough` | Maintenance trigger
    for edge cutting after charging (>90%). |\n\n---\n\n### Operational Logic Sections\n\n####
    Safety & Hardware Watchdog\n*   **Purpose:** Immediate intervention for physical
    or mechanical issues.\n*   **Logic Overview:** Triggered by **sensor.shawn_fehlercode**
    (any non-zero state), **sensor.shawn_batterie** (<15% while not charging), or
    navigation timeouts.\n*   **Effect:** Dispatches **high-priority** notifications
    to **notify.duncan** with translated error descriptions (e.g., Tilted, Lifted,
    or Out of Bounds).\n\n#### Productivity Audit (Slacker Check)\n*   **Purpose:**
    Ensures Shawn is working when the schedule and weather permit.\n*   **Logic Overview:**
    Evaluates if **sun.sun** is **above_horizon**, **sensor.shawn_regensensor** is
    **dry**, and **sensor.shawn_batterie** is **>99%**. It parses the JSON attribute
    `schedule` in **sensor.shawn_arbeitsplan** to verify if the current time falls
    within an enabled work slot.\n*   **Effect:** Alerts if the mower remains in **standby**
    at the dock during valid work hours.\n\n#### Maintenance (Weekly Edge Cut)\n*
    \  **Purpose:** Automated edge maintenance at the end of the work week.\n*   **Logic
    Overview:** Triggered when battery reaches **>90%**. The logic identifies the
    last scheduled workday of the week from the **sensor.shawn_arbeitsplan**; if the
    current time is past that final shift and **button.shawn_kanten_mahen** has not
    been triggered in the last 12 hours, the condition passes.\n*   **Effect:** Executes
    **script.shawn_weekly_edge_cut**.\n\n#### Connectivity Monitoring\n*   **Purpose:**
    Detects Wi-Fi or API dropouts.\n*   **Logic Overview:** Monitors **binary_sensor.shawn_online**
    for a sustained **off** state.\n*   **Effect:** Sends a notification including
    the last known battery percentage.\n\n---\n\n### Technical Overview\n\n*   **Automation
    Mode:** `parallel` (Max: 10)\n*   **Execution Method:** Script calling (**script.shawn_weekly_edge_cut**)
    and direct Notification actions.\n*   **Key Inputs:** **sensor.shawn_arbeitsplan**
    (JSON Schedule), **sensor.shawn_regensensor**, **sun.sun**.\n*   **Controlled
    Entities:** **notify.duncan**, **script.shawn_weekly_edge_cut**.\n*   **Safety
    Mechanisms:** Condition-based filtering ensures \"Low Battery\" alerts don't trigger
    while the unit is **charging**; logic checks for redundant edge-cutting within
    a 12-hour window.\n\n---\n\n### \U0001F4A1 Notes\n\n*   **Dynamic Schedule Parsing:**
    The automation uses complex Jinja2 templating to determine work hours, allowing
    the documentation/schedule to be managed in one place without updating the automation
    logic.\n*   **Error Translation:** Rather than sending raw codes, the logic translates
    **sensor.shawn_fehlercode** into human-readable alerts (e.g., Code 32 = Out of
    Bounds).\n*   **Navigation Timeout:** The 20-minute threshold for the `lost` trigger
    prevents \"false positives\" during normal docking procedures while catching legitimate
    navigation failures.\n"
  triggers:
  - entity_id: sensor.shawn_rasenmaher_status
    to: on_the_way_home
    for:
      minutes: 20
    id: lost
    trigger: state
  - entity_id: sensor.shawn_rasenmaher_status
    to: return
    for:
      minutes: 20
    id: lost
    trigger: state
  - entity_id:
    - binary_sensor.shawn_online
    to:
    - 'off'
    for:
      hours: 0
      minutes: 2
      seconds: 0
    id: offline
    trigger: state
  - entity_id: sensor.shawn_batterie
    below: 15
    id: battery
    trigger: numeric_state
  - entity_id:
    - sensor.shawn_fehlercode
    id: error
    trigger: state
    from:
    - '0'
  - trigger: time_pattern
    minutes: /15
    id: slacker_check
  - entity_id:
    - sensor.shawn_batterie
    above: 90
    id: full_enough
    trigger: numeric_state
  conditions:
  - condition: or
    conditions:
    - alias: During daytime check
      condition: and
      conditions:
      - condition: trigger
        id:
        - slacker_check
      - condition: state
        entity_id: sun.sun
        state: above_horizon
      - condition: template
        value_template: "{% set battery = states('sensor.shawn_batterie') | int(0)
          %} {% set day = now().strftime('%A').lower() %} {% set sched = state_attr('sensor.shawn_arbeitsplan',
          'schedule') %}  {% if sched and day in sched %}\n  {% set now_time = now().strftime('%H:%M')
          %}\n  {% set active = namespace(found=false) %}\n  {% for slot in sched[day]
          if slot.enabled %}\n    {% if slot.starttime < now_time <= slot.endtime
          %}\n      {% set active.found = true %}\n    {% endif %}\n  {% endfor %}\n
          \ {{ active.found and is_state('sensor.shawn_rasenmaher_status','standby')
          and battery > 99 and is_state('sensor.shawn_regensensor', 'dry') }}\n{%
          else %}\n  false \n{% endif %}\n"
    - alias: Lost, Offline, Low Battery or Error
      condition: trigger
      id:
      - lost
      - offline
      - battery
      - error
      - fully_charged
    - alias: Edge Cutting Once Weekly
      condition: and
      conditions:
      - condition: trigger
        id:
        - full_enough
      - condition: numeric_state
        entity_id: sensor.shawn_batterie
        above: 90
      - condition: state
        entity_id: sun.sun
        state: above_horizon
      - condition: template
        value_template: "{# --- 1. Find the last day of the week dynamically --- #}
          \n{% set sched = state_attr('sensor.shawn_arbeitsplan', 'schedule') %} \n{%
          set days = ['sunday', 'saturday', 'friday', 'thursday', 'wednesday', 'tuesday',
          'monday'] %} \n{% set ns = namespace(last_day='', last_time='') %} \n{%
          for day in days %}\n  {% if sched[day][0].enabled and ns.last_day == ''
          %}\n    {% set ns.last_day = day %}\n    {% set ns.last_time = sched[day][0].endtime
          %}\n  {% endif %}\n{% endfor %}\n{# --- 2. Check if it's currently after
          the final shift --- #} \n{% set day_now = now().strftime('%A').lower() %}\n{%
          set time_now = now().strftime('%H:%M') %}\n{% set is_after_last_shift =
          (day_now == ns.last_day and time_now >= ns.last_time) %}\n{# --- 3. Hardware
          Check: When was the button last pressed? --- #} {# We check if the button
          was pressed more than 12 hours ago #}\n{% set last_press = states.button.shawn_kanten_mahen.last_changed
          %} \n{% set not_pressed_recently = (now() - last_press).total_seconds()
          > 43200 %}\n{{ is_after_last_shift and not_pressed_recently }}\n"
        alias: Find last workday and check if we are after it
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: offline
      sequence:
      - data:
          title: "\U0001F4F6 Shawn is Offline"
          message: 'Connection lost for 2+ minutes. Last known battery: {{ states(''sensor.shawn_batterie'')
            }}%'
        action: notify.duncan
    - conditions:
      - condition: trigger
        id: battery
      - condition: not
        conditions:
        - condition: state
          entity_id: sensor.shawn_rasenmaher_status
          state: charging
      sequence:
      - data:
          title: "\U0001F50B Shawn Low Battery"
          message: Battery is critically low ({{ states('sensor.shawn_batterie') }}%)
            and Shawn is not currently charging.
        action: notify.duncan
    - conditions:
      - condition: trigger
        id:
        - error
        - lost
      sequence:
      - data:
          title: "\U0001F6A8 Shawn Needs Help!"
          message: "                {% if is_state('sensor.shawn_fehlercode','1')
            %}\n                  Shawn is Tilted/Angled! He might be stuck on an
            obstacle or a steep edge.\n                {% elif is_state('sensor.shawn_fehlercode',
            '2') %}\n                  Shawn is stuck! Safety stop engaged.\n                {%
            elif is_state('sensor.shawn_fehlercode', '5') %}\n                  Shawn
            has been Lifted! Safety stop engaged.\n                {% elif is_state('sensor.shawn_fehlercode',
            '32') %}\n                  Shawn out of bounds. Check if he needs help
            returning to the lawn.\n                {% elif trigger.id == 'lost' %}\n
            \                 Shawn is lost in the yard. Navigation timeout (20 mins).\n
            \               {% else %}\n                  Hardware Interrupt: {{ states('sensor.shawn_fehler')
            }} (Code: {{ states('sensor.shawn_fehlercode') }})\n                {%
            endif %}"
          data:
            ttl: 0
            priority: high
            clickAction: /lovelace/mower-dashboard
        action: notify.duncan
    - conditions:
      - condition: trigger
        id: slacker_check
      sequence:
      - data:
          title: "\U0001F634 Shawn is Slacking!"
          message: It's work time and conditions are perfect, but Shawn is idling
            at the dock.
        action: notify.duncan
    - conditions:
      - condition: trigger
        id:
        - full_enough
      sequence:
      - action: script.shawn_weekly_edge_cut
        metadata: {}
        data: {}
  mode: parallel
  max: 10
- id: '1776775331415'
  alias: 'Battery Maintenance: Balancing Soak Cycle'
  description: "### \U0001F4CB Intelligent Battery Maintenance Control\n\nThis automation
    manages a \"Soak Cycle\" for the inverter battery system to facilitate cell balancing
    at high States of Charge (SOC). By intelligently disabling the **Time of Use (TOU)**
    switch, the system prevents heavy discharging once the battery reaches a near-full
    state, ensuring the cells have sufficient time at high voltage for the BMS to
    balance effectively.\n\n* **High-level intent:** Prioritize battery health by
    restricting discharge during peak solar periods once the battery is nearly full.\n*
    **Operational strategy:** Solar-aware maintenance triggered only when a high daily
    yield is forecasted, ensuring enough energy is available to maintain the soak
    without sacrificing household autonomy.\n* **Reliability mechanisms:** Utilizes
    a robust **backoff retry script** for switch commands to ensure critical state
    changes occur even during transient communication drops.\n\n---\n\n### Trigger
    Overview Table\n\n| Type | Entity / Condition | ID | Purpose |\n| :--- | :---
    | :--- | :--- |\n| **Numeric State** | `sensor.inverter_battery` > **95%** | `start_soak`
    | Initiates the maintenance window when the battery is nearly full. |\n| **Time**
    | **16:00 (4:00 PM)** | `stop_soak` | Ends the maintenance window to resume normal
    discharge for evening loads. |\n\n---\n\n### Operational Logic Sections\n\n####
    Balancing Phase (Start Soak)\n* **Purpose:** Restrict battery discharge to allow
    cells to balance at high voltage.\n* **Logic Overview:** Executes if the battery
    is above **95%**, the time is between **08:00 and 15:00**, the daily solar forecast
    (`sensor.solcast_pv_forecast_prognose_heute`) exceeds **50kWh**, and the **Time
    of Use** switch is currently **on**.\n* **Effect:** Sets `switch.esp32_s3_zero_deye8k_time_of_use`
    to **off** and sends a mobile notification with the current SOC and forecast data.\n\n####
    Normalization Phase (Stop Soak)\n* **Purpose:** Restore standard Time of Use settings
    for evening operation.\n* **Logic Overview:** Triggered specifically at **16:00**
    via the `stop_soak` ID.\n* **Effect:** Sets `switch.esp32_s3_zero_deye8k_time_of_use`
    to **on** and notifies the user of the system status, confirming whether the house
    has successfully resumed battery power.\n\n---\n\n### Technical Overview\n\n*
    **Automation Mode:** `restart`\n* **Execution Method:** `script.retry_action_with_backoff`\n*
    **Key Inputs:**\n    * `sensor.inverter_battery` (Threshold: **95%**)\n    * `sensor.solcast_pv_forecast_prognose_heute`
    (Threshold: **50kWh**)\n* **Controlled Entities:**\n    * `switch.esp32_s3_zero_deye8k_time_of_use`\n*
    **Safety Mechanisms:**\n    * **Action Retries:** Up to **10 retries** with a
    **60s max delay** and **simple backoff** to ensure the inverter registers the
    command.\n    * **Notification Loop:** Real-time feedback via `notify.duncan`
    if the switch fails to toggle, allowing for manual intervention.\n\n---\n\n###
    \U0001F4A1 Notes\n\n* **Forecast Dependency:** The **50kWh** threshold ensures
    that maintenance only occurs on high-production days, preventing the system from
    disabling battery discharge when solar energy might be insufficient.\n* **Time
    Windows:** The start logic is constrained to **08:00 - 15:00** to ensure the soak
    happens during peak sun, while the **16:00** stop time ensures the battery is
    available for the primary evening discharge period.\n* **Fail-Safe:** By using
    `continue_on_error: true` alongside the retry script, the automation remains resilient
    and will continue to attempt notification even if the hardware communication is
    temporarily interrupted."
  triggers:
  - entity_id:
    - sensor.felicity_ess_soc_avg
    above: 95
    id: start_soak
    trigger: numeric_state
  - at: '16:00:00'
    id: stop_soak
    trigger: time
  - trigger: time_pattern
    minutes: /2
    id: maintain_soak
  conditions:
  - condition: or
    conditions:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - maintain_soak
      - condition: time
        after: 08:00:00
        before: '16:00:00'
      - condition: state
        entity_id: switch.esp32_s3_zero_deye8k_time_of_use
        state: 'off'
      alias: Maintain Soak
    - alias: Start Soak
      condition: and
      conditions:
      - condition: trigger
        id:
        - start_soak
      - condition: numeric_state
        entity_id: sensor.solcast_pv_forecast_prognose_heute
        above: 50
      - condition: time
        after: 08:00:00
        before: '15:00:00'
      - condition: state
        entity_id: switch.esp32_s3_zero_deye8k_time_of_use
        state:
        - 'on'
    - condition: trigger
      id:
      - stop_soak
      alias: Stop Soak
  actions:
  - variables:
      target_amps: "{% set cells = [\n  states('sensor.battery_2_bat2_cell_01')|float(0),
        states('sensor.battery_2_bat2_cell_02')|float(0),\n  states('sensor.battery_2_bat2_cell_03')|float(0),
        states('sensor.battery_2_bat2_cell_04')|float(0),\n  states('sensor.battery_2_bat2_cell_05')|float(0),
        states('sensor.battery_2_bat2_cell_06')|float(0),\n  states('sensor.battery_2_bat2_cell_07')|float(0),
        states('sensor.battery_2_bat2_cell_08')|float(0),\n  states('sensor.battery_2_bat2_cell_09')|float(0),
        states('sensor.battery_2_bat2_cell_10')|float(0),\n  states('sensor.battery_2_bat2_cell_11')|float(0),
        states('sensor.battery_2_bat2_cell_12')|float(0),\n  states('sensor.battery_2_bat2_cell_13')|float(0),
        states('sensor.battery_2_bat2_cell_14')|float(0),\n  states('sensor.battery_2_bat2_cell_15')|float(0),
        states('sensor.battery_2_bat2_cell_16')|float(0)\n] %}  {% set max_cell =
        cells | max %} {{ 0 if max_cell >= 3.50 else (2 if max_cell >= 3.45 else 10)
        }}"
  - choose:
    - conditions:
      - condition: trigger
        id: start_soak
      sequence:
      - action: script.retry_action_with_backoff
        metadata: {}
        data:
          action_domain: switch
          action_type: turn_off
          max_retries: 10
          max_delay: 60
          backoff_type: simple
          notify_on_failure: true
          notify_service: notify.duncan
          entity_id: switch.esp32_s3_zero_deye8k_time_of_use
          target_state: 'off'
          base_delay: 10
        continue_on_error: true
      - data:
          title: "\U0001F50B Balancing Soak: Active"
          message: '{% set switch = states(''switch.esp32_s3_zero_deye8k_time_of_use'')
            %}

            Result: {{ "✅ TOU Disabled" if switch == ''off'' else "⚠️ Switch Failed
            to Toggle" }}

            SOC: {{ states(''sensor.inverter_battery'') }}%, Forecast: {{ states(''sensor.solcast_pv_forecast_prognose_heute'')
            | round(1) }}kWh

            Discharge is now restricted to prioritize cell balancing.'
        action: notify.duncan
        continue_on_error: true
      - action: script.retry_action_with_backoff
        metadata: {}
        data:
          action_domain: switch
          action_type: turn_off
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: simple
          notify_on_failure: true
          notify_service: notify.duncan
          entity_id: switch.esp32_s3_zero_deye8k_enable_charge_automations
          target_state: 'off'
        continue_on_error: true
      - action: script.retry_action_with_backoff
        metadata: {}
        data:
          action_domain: switch
          action_type: turn_off
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: simple
          notify_on_failure: true
          notify_service: notify.duncan
          entity_id: switch.esp32_s3_zero_deye8k_battery_charge_solar
          target_state: 'off'
        continue_on_error: true
      - action: number.set_value
        metadata: {}
        target:
          entity_id: number.inverter_battery_max_charging_current
        data:
          value: '{{ target_amps }}'
    - conditions:
      - condition: trigger
        id: maintain_soak
      sequence:
      - action: number.set_value
        target:
          entity_id: number.inverter_battery_max_charging_current
        data:
          value: '{{ target_amps }}'
    - conditions:
      - condition: trigger
        id: stop_soak
      sequence:
      - action: script.retry_action_with_backoff
        metadata: {}
        data:
          action_domain: switch
          action_type: turn_on
          max_retries: 10
          max_delay: 60
          backoff_type: simple
          notify_on_failure: true
          notify_service: notify.duncan
          entity_id: switch.esp32_s3_zero_deye8k_time_of_use
          target_state: 'on'
          base_delay: 10
        continue_on_error: true
      - action: number.set_value
        metadata: {}
        target:
          entity_id: number.inverter_battery_max_charging_current
        data:
          value: '120'
      - data:
          title: "\U0001F3E0 Normal Mode: Resumed"
          message: '{% set switch = states(''switch.esp32_s3_zero_deye8k_time_of_use'')
            %} Maintenance window finished. Status: {{ "✅ \nHouse on Battery" if switch
            == ''on'' else "❌ \nTOU Still Disabled (Check Connection)" }}

            The house is {{ "now drawing from the battery" if switch == ''on'' else
            "still running on Bypass/Solar/Grid" }}.'
        action: notify.duncan
        continue_on_error: true
  mode: queued
  max: 4
- id: '1777634714624'
  alias: Pool Pump Pulse Sync & Monitor
  description: 'Combined: Periodically polls Tasmota and processes the returned PulseTime1
    value.'
  triggers:
  - trigger: time_pattern
    seconds: /30
    id: request_data
  - trigger: homeassistant
    event: start
    id: startup
  - trigger: mqtt
    topic: stat/tasmota_837238/RESULT
    id: process_data
  conditions:
  - condition: or
    conditions:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - request_data
        - startup
      - condition: sun
        after: sunrise
        before: sunset
      - condition: not
        conditions:
        - condition: or
          conditions:
          - condition: state
            entity_id: switch.pool_pumpe
            state: unavailable
          - condition: state
            entity_id: switch.pool_pumpe
            state: 'off'
            for:
              minutes: 5
    - condition: and
      conditions:
      - condition: not
        conditions:
        - condition: state
          entity_id: switch.pool_pumpe
          state: 'off'
          for:
            minutes: 5
      - condition: trigger
        id:
        - process_data
      - condition: template
        value_template: '{{ ''PulseTime1'' in trigger.payload }}'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - request_data
        - startup
      sequence:
      - if:
        - condition: trigger
          id: startup
        then:
        - delay: 00:00:30
        alias: Startup Delay
      - action: mqtt.publish
        data:
          topic: cmnd/tasmota_837238/pulsetime1
    - conditions:
      - condition: trigger
        id: process_data
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.pulsetimeactualvalue
        data:
          value: "{% set pulseTime = trigger.payload_json.PulseTime1.Remaining | int(0)
            %} {% if pulseTime < 112 %}\n  {{ (pulseTime / 10) | round(0) }}\n{% else
            %}\n  {{ (pulseTime - 100) }}\n{% endif %}\n"
  mode: queued
  max: 4
- id: '1779363234982'
  alias: 'Fenster Offen: Zentrales Monitoring'
  description: "\U0001F4CB Intelligent Window Monitoring Control\nThis automation
    provides centralized tracking of open windows across multiple zones, ensuring
    timely notifications while avoiding alert fatigue through room-specific intervals.
    \n\n*   **High-Level Intent:** Prevent energy loss, moisture issues, or security
    risks by alerting residents when windows are left open too long, and automatically
    clearing those alerts when the windows are shut.\n*   **Operational Strategy:**
    Employs a tier-based initial delay strategy (10 minutes, 15 minutes, or 1 hour)
    adapted to the room type before firing the first alert, followed by dynamic, room-tailored
    repeat cycles.\n*   **Reliability Mechanisms:** Uses an external fallback-capable
    notification script, applies hardcoded target tracking tags (`notification_tag`)
    to handle clean dismissals, and runs in parallel to manage concurrent window states
    seamlessly.\n\n---\n\n### \U0001F514 Trigger Overview\n\n| Type | Entity / Condition
    | ID | Purpose |\n| :--- | :--- | :--- | :--- |\n| State | **binary_sensor.gasteklo_fenster_contact**
    turns **on** for **15 minutes** | `open_gasteklo` | Starts monitoring for the
    guest toilet window with a customized initial grace period. |\n| State | **binary_sensor.duncan_fenster_contact**<br>**binary_sensor.kinderbad_fenster_contact**<br>**binary_sensor.bad_fenster_contact**<br>turn
    **on** for **10 minutes** | `open_default` | Initiates tracking for standard bedrooms
    and bathrooms using a baseline 10-minute threshold. |\n| State | **binary_sensor.waschkuche_fenster_contact**<br>**binary_sensor.hobbyraum_kleines_fenster_contact**<br>turn
    **on** for **1 hour** | `open_1hour` | Monitors utility and hobby zones where
    windows are permitted to stay open longer. |\n| State | Any of the 8 monitored
    window contact sensors change from **on** for **5 seconds** | `close_window` |
    Catches any window closing event to initiate the notification clearing sequence.
    |\n\n---\n\n### ⚙️ Operational Logic\n\n#### Window Open Alert Mode\n*   **Purpose:**
    Persistently notify occupants about a specific open window at calculated intervals
    until action is taken.\n*   **Logic Overview:** Executes when a trigger ID begins
    with `open_`. The routine enters a loop that runs continuously *until* the triggering
    window sensor reports a state of **off**.\n*   **Effect:** Dispatches a red-colored
    alert with an open-window icon via **script.notify_people_at_home_with_fallbacks**.
    The loop then pauses for a dynamic **repeat_delay** duration (**30**, **120**,
    **180**, or a default of **10** minutes depending on the room) before re-checking
    the window status.\n\n#### Window Closed Clearance Mode\n*   **Purpose:** Automatically
    clear active alerts from user devices immediately after a window is closed.\n*
    \  **Logic Overview:** Triggered exclusively via the `close_window` ID when a
    monitored sensor changes state away from **on**.\n*   **Effect:** Sends a `clear_notification`
    payload to **script.notify_people_at_home_with_fallbacks** targeting the exact
    identifier (`notification_tag`) generated by that room, wiping the specific alert
    from mobile device trays.\n\n---\n\n### \U0001F6E0️ Technical Overview\n\n*   **Automation
    Mode:** **parallel**\n*   **Execution Method:** Coordinates delivery using **script.notify_people_at_home_with_fallbacks**\n*
    \  **Key Inputs:**\n    *   `room_slug`: Extracted programmatically from the triggering
    entity ID.\n    *   `custom_friendly_name`: Strips the string \" Contact\" from
    the sensor's friendly name attribute for clean UI presentation.\n    *   `repeat_delay`:
    Calculated dynamically via a template-mapped dictionary using the `room_slug`.\n*
    \  **Controlled Entities:** None directly switched; acts purely as an analytics
    and notification engine.\n*   **Safety Mechanisms:** Max concurrent runs capped
    at **18** (calculated as *unique entities × 2 + 2*) to ensure ample execution
    tracks exist even if multiple rooms open and close in rapid sequence. The loop
    logic relies on a direct state check evaluation to completely eliminate runaway
    notification bugs.\n\n---\n\n### \U0001F4A1 Notes\n\n*   **Intelligent Fatigue
    Prevention:** Instead of a generic repeat reminder, the script intelligently maps
    cooldown times based on room characteristics. Utility spaces like the laundry
    room (`waschkuche`) are silenced for **180 minutes** between alerts, whereas main
    bathrooms use shorter intervals.\n*   **Clean Notification Handshakes:** By tracking
    alerts via `notification_tag`, notifications are updated in place or dismissed
    silently without spawning multiple cluttered lines on user phone screens.\n*   **Debounce
    Buffer:** The 5-second `for` block on the closing trigger acts as a tiny hardware
    debounce filter, ensuring that brief signal drops or rapid hand-latches do not
    confuse the clearance logic.\n"
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.gasteklo_fenster_contact
    - binary_sensor.schlafzimmer_fenster_contact
    to:
    - 'on'
    for:
      minutes: 15
    id: open_gasteklo
  - trigger: state
    entity_id:
    - binary_sensor.duncan_fenster_contact
    - binary_sensor.kinderbad_fenster_contact
    - binary_sensor.bad_fenster_contact
    to: 'on'
    for:
      minutes: 10
    id: open_default
  - trigger: state
    entity_id:
    - binary_sensor.waschkuche_fenster_contact
    - binary_sensor.hobbyraum_kleines_fenster_contact
    - binary_sensor.garagedoor_zigbee_contact
    to: 'on'
    for:
      hours: 1
    id: open_1hour
  - trigger: state
    entity_id:
    - binary_sensor.gasteklo_fenster_contact
    - binary_sensor.duncan_fenster_contact
    - binary_sensor.kinderbad_fenster_contact
    - binary_sensor.bad_fenster_contact
    - binary_sensor.waschkuche_fenster_contact
    - binary_sensor.hobbyraum_kleines_fenster_contact
    - binary_sensor.garagedoor_zigbee_contact
    - binary_sensor.schlafzimmer_fenster_contact
    from:
    - 'on'
    for:
      seconds: 5
    id: close_window
  actions:
  - variables:
      room_slug: '{{ trigger.entity_id.split(''.'')[1].split(''_'')[0] }}'
      notification_tag: '{{ room_slug }}_window_alert'
      custom_friendly_name: '{{ state_attr(trigger.entity_id, ''friendly_name'') |
        replace('' Contact'', '''') }}'
      repeat_delay: "{% set delays = {\n  'gasteklo': 30,\n  'schlafzimmer': 30,\n
        \ 'waschkuche': 180,\n  'hobbyraum': 120\n} %}\n{{ delays.get(room_slug, 10)
        }}"
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id.startswith(''open_'') }}'
      sequence:
      - repeat:
          until:
          - condition: template
            value_template: '{{ is_state(trigger.entity_id, ''off'') }}'
          sequence:
          - action: script.notify_people_at_home_with_fallbacks
            data:
              title: '{{ custom_friendly_name }} offen'
              message: '{{ custom_friendly_name }} ist offen seit {{ as_timestamp(states[trigger.entity_id].last_changed)
                | timestamp_custom(''%H:%M'', True) }}.'
              tag: '{{ notification_tag }}'
              color: red
              notification_icon: mdi:window-open
              channel: Fenster
          - delay:
              minutes: '{% set exponent = repeat.index - 1 %} {% set progressive_delay
                = repeat_delay | int * (2 ** exponent) %} {{ [progressive_delay, 180]
                | min }}'
      alias: Open
    - conditions:
      - condition: trigger
        id: close_window
      sequence:
      - action: script.notify_people_at_home_with_fallbacks
        data:
          message: clear_notification
          tag: '{{ notification_tag }}'
      alias: Close
  mode: parallel
  max: 18
- id: '1779543503925'
  alias: 'Rollos: Sonnenintensität Benachrichtigungen'
  description: Nutzt den täglichen Solar-Forecast statt Echtzeit-Strahlung, um die
    Wolken-Flut komplett ohne Helfer zu verhindern.
  triggers:
  - entity_id:
    - sensor.sun_wall_intensity_front
    - sensor.sun_wall_intensity_left
    - sensor.sun_wall_intensity_back
    - sensor.sun_wall_intensity_right
    above: 30
    id: action_lower
    trigger: numeric_state
  - entity_id:
    - sensor.sun_wall_intensity_front
    - sensor.sun_wall_intensity_left
    - sensor.sun_wall_intensity_back
    - sensor.sun_wall_intensity_right
    below: 30
    id: action_raise
    trigger: numeric_state
  - event: start
    id: startup
    trigger: homeassistant
  actions:
  - variables:
      side_map:
        sensor.sun_wall_intensity_front: Vorne
        sensor.sun_wall_intensity_left: Ost
        sensor.sun_wall_intensity_back: Hinten
        sensor.sun_wall_intensity_right: KiGa/West
      solar_forecast_sensor: sensor.solcast_pv_forecast_prognose_heute
      forecast_threshold: 75
  - choose:
    - conditions:
      - condition: trigger
        id: action_lower
      - condition: template
        value_template: '{{ states(solar_forecast_sensor) | float(0) >= forecast_threshold
          }}'
      sequence:
      - action: notify.duncan
        data:
          title: '{{ side_map[trigger.entity_id] }}'
          message: Rollo schließen
    - conditions:
      - condition: trigger
        id: action_raise
      - condition: template
        value_template: '{{ states(solar_forecast_sensor) | float(0) >= (forecast_threshold
          - 10) }}'
      sequence:
      - action: notify.duncan
        data:
          title: '{{ side_map[trigger.entity_id] }}'
          message: Rollo öffnen
    - conditions:
      - condition: trigger
