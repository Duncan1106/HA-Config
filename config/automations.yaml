- id: '1738740501702'
  alias: Clean EG if Awake
  description: ''
  triggers:
  - entity_id: schedule.dreame_clean_up
    from: 'off'
    to: 'on'
    trigger: state
  actions:
  - domain: mobile_app
    type: notify
    device_id: 905c163dcc62544838edb078413723b2
    title: '{{ notification_title }}'
    message: '{{ notification_message }}'
    data:
      tag: '{{ notification_title }}'
      persistent: '{{ persistent_notification }}'
      actions: "{% set titles = [action_1_title, action_2_title, action_3_title] %}
        {% set uris = [action_1_uri, action_2_uri, action_3_uri] %} {% set actions
        = namespace(data = []) %}\n{% for title in titles %}\n  {% if title|length
        %}\n    {% set uri = uris[loop.index - 1] %}\n    {% set action_name = \"action\"
        + loop.index|string %}\n    {% set action = {\n      \"action\": \"URI\" if
        uri|length else action_name,\n      \"title\": title,\n      \"uri\": uri
        \n      }\n    %}\n    {% set actions.data = actions.data + [action] %}\n
        \ {% endif %}\n{% endfor %} {{ actions.data }}\n"
  - wait_for_trigger:
      event_type: mobile_app_notification_action
      trigger: event
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ wait.trigger.event.data.action == ''action1'' and wait.trigger.event.data.title
          == ''Dreame Clean-Up EG'' }}'
      sequence:
      - action: vacuum.start
        metadata: {}
        data: {}
        target:
          entity_id: vacuum.d9_max_gen_2
    - conditions:
      - condition: template
        value_template: '{{ wait.trigger.event.data.action == ''action2'' and wait.trigger.event.data.title
          == ''Dreame Clean-Up EG'' }}'
      sequence: []
