        below: 30
      sequence:
      - action: script.retry_action_with_backoff
        continue_on_error: true
        metadata: {}
        data:
          action_domain: switch
          action_type: turn_off
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: linear
          notify_on_failure: true
          notify_service: notify.duncan
          entity_id: switch.treppe_led_lichterkette_zigbee
          target_state: 'off'
      alias: Treppenlicht LED OFF
    enabled: false
  mode: parallel
  max: 5
- id: '1760998194743'
  alias: Bett Powerbank Ladezeit
  description: "## \U0001F50B Bett Powerbank Ladezeit\n\nAutomatisiert das **Laden
    der Bett-Powerbank** abhängig von Sonnenaufgang/-untergang und der PV-Prognose.
    \ \nDie Automation reagiert außerdem auf Änderungen des **Low-Power-Modus**.\n\n###
    \U0001F4CB Logik\n\n- **\U0001F305 Sonnenaufgang:** Steckdose **einschalten**,
    wenn die heutige PV-Prognose > 20 kWh.  \n  - Wird mit **Retry + Backoff** ausgeführt,
    um sicherzustellen, dass die Steckdose eingeschaltet wird.\n\n- **\U0001F307 Sonnenuntergang:**
    Steckdose **ausschalten**, um unnötigen Nachtverbrauch zu vermeiden.  \n  - Benachrichtigung
    an `notify.duncan` erfolgt, damit der Low-Power-Modus überprüft werden kann.\n\n-
    **Low-Power-Modus deaktiviert:** Benachrichtigungen werden **gelöscht**, falls
    der Nutzer manuell den Low-Power-Modus abschaltet.\n\n### \U0001F527 Bedingungen\n\n-
    `input_boolean.bett_powerbank_low_power = on`  \n  - Ausnahme: Wenn Boolean manuell
    ausgeschaltet wurde, wird trotzdem die Notification gelöscht.\n\n- `sensor.solcast_pv_forecast_prognose_heute
    > 15 kWh`  \n  - Nur relevant für Sonnenaufgangs-Trigger.\n\n### ⚡ Hinweise /
    Best Practices\n\n- Retry-Logik sorgt für maximale Zuverlässigkeit bei Steckdosensteuerung.\n-
    Benachrichtigungen am Abend unterstützen die Kontrolle des Powerbank-Ladestatus.\n-
    Low-Power-Modus sollte korrekt gepflegt werden, um ungewollte Ladung zu vermeiden."
  triggers:
  - trigger: sun
    event: sunrise
    offset: 0
    id: Sunrise
  - trigger: sun
    event: sunset
    offset: +00:05:00
    id: Sunset
  - trigger: state
    entity_id:
    - input_boolean.bett_powerbank_low_power
    id: Boolean turned off
    to: 'off'
    from: 'on'
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: input_boolean.bett_powerbank_low_power
      state: 'on'
    - condition: trigger
      id:
      - Boolean turned off
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Sunrise
      - condition: numeric_state
        entity_id: sensor.solcast_pv_forecast_prognose_heute
        above: 15
      sequence:
      - action: script.retry_action_with_backoff
        metadata: {}
        data:
          action_type: turn_on
          backoff_type: linear
          entity_id: switch.bett_powerbank_charger
          target_state: 'on'
          action_domain: switch
          max_retries: 10
          notify_service: notify.duncan
          base_delay: 10
          max_delay: 60
    - conditions:
      - condition: trigger
        id:
        - Sunset
      sequence:
      - parallel:
        - alias: Notify only when the plug was on
          if:
          - condition: state
            entity_id: switch.bett_powerbank_charger
            state:
            - 'on'
          then:
          - alias: Set up variables for the actions
            variables:
              leave_on: '{{ ''OPEN_'' ~ context.id }}'
              turn_off: '{{ ''CLOSE_'' ~ context.id }}'
          - action: notify.duncan
            metadata: {}
            data:
              title: "\U0001F307 Bett Powerbank"
              message: Low‑Power‑Modus beibehalten oder beenden?
              data:
                tag: powerbank_low
                actions:
                - action: '{{ leave_on }}'
                  title: Low‑Power behalten
                - action: '{{ turn_off }}'
                  title: Low‑Power beenden
          - alias: Wait for a response
            wait_for_trigger:
            - event_type: mobile_app_notification_action
              event_data:
                action: '{{ turn_off }}'
              trigger: event
            timeout:
              hours: 1
              minutes: 0
              seconds: 0
              milliseconds: 0
            continue_on_timeout: true
          - alias: Perform the action
            choose:
            - conditions:
              - condition: template
                value_template: '{{ wait.trigger is not none and wait.trigger.event
                  is not none and wait.trigger.event.data.action == turn_off }}'
              sequence:
              - action: input_boolean.turn_off
                metadata: {}
                data: {}
                target:
                  entity_id: input_boolean.bett_powerbank_low_power
        - sequence:
          - delay:
              hours: 0
              minutes: 0
              seconds: 5
              milliseconds: 0
          - action: script.retry_action_with_backoff
            metadata: {}
            data:
              action_type: turn_off
              backoff_type: linear
              entity_id: switch.bett_powerbank_charger
              target_state: 'off'
              action_domain: switch
              max_retries: 10
              max_delay: 60
              base_delay: 10
    - conditions:
      - condition: trigger
        id:
        - Boolean turned off
      sequence:
      - action: notify.duncan
        metadata: {}
        data:
          data:
            tag: powerbank_low
          message: clear_notification
  mode: queued
  max: 3
- id: '1765713065237'
  alias: Ambient Lights Scheduler
  description: "\U0001F4A1 **Ambient Lights Scheduler**\n\n### \U0001F4CB Intelligent
    Ambient Lighting Control\n\nThis automation manages the home's decorative and
    atmospheric lighting based on a combination of time-of-day scheduling and occupancy.
    By integrating both standard and seasonal lighting, it ensures the home environment
    is properly illuminated only when necessary.\n\n**Operational Strategy:**\nThe
    system follows a **Presence-Aware & Conditional** strategy. Lights are only activated
    if the lighting schedule is active **and** the home is occupied. If either condition
    becomes false, the lights are deactivated to conserve energy.\n\n**Reliability
    Mechanisms:**\nTo combat potential Zigbee mesh interference or hardware unavailability,
    this automation utilizes a **recursive retry script** with **exponential backoff**.
    Each command is attempted up to 5 times, ensuring state consistency even in unreliable
    network conditions.\n\n---\n\n### Trigger Overview Table\n\n| Type | Entity /
    Condition | ID | Purpose |\n| :--- | :--- | :--- | :--- |\n| **State** | `binary_sensor.ambient_lights`
    | `Schedule` | Detects changes in the programmed lighting window. |\n| **State**
    | `binary_sensor.anyone_home` | `Presence` | Responds to arrival or departure
    of residents. |\n| **Event** | `Home Assistant Start` | `HA_Start` | Synchronizes
    light states immediately after a system reboot. |\n\n---\n\n#### Active Lighting
    Mode\n* **Purpose**: Illuminates the home during scheduled hours when residents
    are present.\n* **Logic Overview**: Requires both `binary_sensor.ambient_lights`
    to be **on** AND `binary_sensor.anyone_home` to be **on**.\n* **Effect**: Switches
    `switch.fenster_licht_vorne_zigbee` and `switch.fenster_licht_hinten_zigbee` to
    **on**. If `input_boolean.enable_seasonal_ambient_lights` is active, it also enables
    seasonal entities.\n\n#### Inactive / Economy Mode\n* **Purpose**: Turns off lighting
    when out of schedule or when the house is empty.\n* **Logic Overview**: Triggered
    if `binary_sensor.ambient_lights` is **off** OR `binary_sensor.anyone_home` is
    **off**.\n* **Effect**: Switches all primary and seasonal (if enabled) entities
    to **off**.\n\n---\n\n### Technical Overview\n\n* **Automation Mode**: `restart`
    (Ensures the latest trigger state takes immediate precedence).\n* **Execution
    Method**: Utilizes `script.retry_action_with_backoff` for robust device communication.\n*
    **Key Inputs**: \n    * `binary_sensor.ambient_lights` (Schedule)\n    * `binary_sensor.anyone_home`
    (Occupancy)\n    * `input_boolean.enable_seasonal_ambient_lights` (Feature Flag)\n*
    **Controlled Entities**: \n    * **Primary**: `switch.fenster_licht_vorne_zigbee`,
    `switch.fenster_licht_hinten_zigbee`\n    * **Seasonal**: `switch.weihnachtsbaum_zigbee`,
    `switch.treppe_led_lichterkette_zigbee`\n* **Safety Mechanisms**: \n    * **Exponential
    Backoff**: Prevents network congestion during retries.\n    * **Failure Notification**:
    Alerts the user via `notify.duncan` if a device fails to reach the target state
    after all retries.\n\n---\n\n### \U0001F4A1 Notes\n\n* **Network Stability**:
    The use of `continue_on_error: true` ensures that if one Zigbee device is physically
    disconnected, the rest of the loop continues to process other lights.\n* **Presence
    Priority**: The logic acts as a \"Gatekeeper\"—even if the schedule says the lights
    should be on, they will remain off if the house is empty, effectively reducing
    energy waste.\n* **Seasonal Flexibility**: The seasonal toggle allows for permanent
    YAML configuration of holiday lights that only participate in the logic when the
    specific toggle is enabled.\n"
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.ambient_lights
    id: Schedule
    to:
    - 'on'
    - 'off'
  - trigger: state
    entity_id:
    - binary_sensor.anyone_home
    id: Presence
    to:
    - 'on'
    - 'off'
  - trigger: homeassistant
    event: start
    id: HA_Start
  conditions: []
  actions:
  - if:
    - condition: trigger
      id:
      - HA_Start
    then:
    - delay:
        hours: 0
        minutes: 0
        seconds: 30
        milliseconds: 0
    alias: Wait 30s to wrap up HA Startup
  - variables:
      entities:
      - switch.fenster_licht_vorne_zigbee
      - switch.fenster_licht_hinten_zigbee
      entities_seasonal:
      - switch.weihnachtsbaum_zigbee
      - switch.treppe_led_lichterkette_zigbee
  - choose:
    - conditions:
      - condition: and
        conditions:
        - condition: state
          entity_id: binary_sensor.ambient_lights
          state: 'on'
        - condition: state
          entity_id: binary_sensor.anyone_home
          state: 'on'
      sequence:
      - repeat:
          for_each: '{{ entities }}'
          sequence:
          - action: script.retry_action_with_backoff
            continue_on_error: true
            data:
              entity_id: '{{ repeat.item }}'
              target_state: 'on'
              action_domain: switch
              action_type: turn_on
              max_retries: 5
              base_delay: 5
              backoff_type: exponential
              notify_on_failure: true
              notify_service: notify.duncan
          - delay:
              hours: 0
              minutes: 0
              seconds: 1
              milliseconds: 0
      - alias: Seasonal Ambient Lights ON
        if:
        - condition: state
          entity_id: input_boolean.enable_seasonal_ambient_lights
          state:
          - 'on'
        then:
        - repeat:
            for_each: '{{ entities_seasonal }}'
            sequence:
            - action: script.retry_action_with_backoff
              continue_on_error: true
              data:
                entity_id: '{{ repeat.item }}'
                target_state: 'on'
                action_domain: switch
                action_type: turn_on
                max_retries: 5
                base_delay: 5
                backoff_type: exponential
                notify_on_failure: true
                notify_service: notify.duncan
            - delay:
                hours: 0
                minutes: 0
                seconds: 1
                milliseconds: 0
    - conditions:
      - condition: or
        conditions:
        - condition: state
          entity_id: binary_sensor.ambient_lights
          state: 'off'
        - condition: state
          entity_id: binary_sensor.anyone_home
          state: 'off'
      sequence:
      - repeat:
          for_each: '{{ entities }}'
          sequence:
          - action: script.retry_action_with_backoff
            continue_on_error: true
            data:
              entity_id: '{{ repeat.item }}'
              target_state: 'off'
              action_domain: switch
              action_type: turn_off
              max_retries: 5
              base_delay: 5
              backoff_type: exponential
              notify_on_failure: true
              notify_service: notify.duncan
          - delay:
              hours: 0
              minutes: 0
              seconds: 1
              milliseconds: 0
      - alias: Seasonal Ambient Lights OFF
        if:
        - condition: state
          entity_id: input_boolean.enable_seasonal_ambient_lights
          state:
          - 'on'
        then:
        - repeat:
            for_each: '{{ entities_seasonal }}'
            sequence:
            - action: script.retry_action_with_backoff
              continue_on_error: true
              data:
                entity_id: '{{ repeat.item }}'
                target_state: 'off'
                action_domain: switch
                action_type: turn_off
                max_retries: 5
                base_delay: 5
                backoff_type: exponential
                notify_on_failure: true
                notify_service: notify.duncan
            - delay:
                hours: 0
                minutes: 0
                seconds: 1
                milliseconds: 0
  mode: restart
- id: '1766573948427'
  alias: Bat1 Circuit Breaker Failure
  description: "⚡ **Bat1 Circuit Breaker Failure**\n\n### \U0001F4CB Intelligent Battery
    Monitoring Control\n\nThis automation provides high-fidelity monitoring for the
    physical circuit breaker of **Battery 1**. It is designed to detect a \"popped\"
    breaker state by comparing current flow between multiple batteries in a parallel
    configuration.\n\nThe operational strategy is **safety-first and persistence-driven**.
    When a failure is detected while the system is under load, the automation initiates
    a notification loop to ensure human intervention. It includes a reliability mechanism
    that automatically clears active alerts across all administrative devices once
    current flow is restored.\n\n---\n\n### Trigger Overview Table\n\n| Type | Entity
    / Condition | ID | Purpose |\n| :--- | :--- | :--- | :--- |\n| **Template** |
    `sensor.battery_1_bat1_current` == 0 & `sensor.battery_2_bat2_current` != 0 |
    `breaker_popped` | Detects when Bat1 has no flow while Bat2 is active (indicating
    a trip). |\n| **Template** | `sensor.battery_1_bat1_current` != 0 | `breaker_restored`
    | Confirms current flow has resumed through the Bat1 breaker. |\n\n---\n\n###
    Operational Logic Sections\n\n#### Failure Detection (Breaker Popped)\n**Purpose**:
    Identify a hardware disconnect and alert maintenance personnel.\n**Logic Overview**:
    Triggered if **Bat1 Current** is **0** while **Bat2 Current** is active for **2
    minutes and 30 seconds**. This only executes if **Time of Use** is **on**, **SOC**
    is above **0%**, and the **Inverter Battery** sensor is active. An additional
    condition ensures the **SOC** is below **99.9%** to avoid false positives during
    full-charge float states.\n**Effect**: Sends a persistent notification to `notify.admin`
    every **15 minutes** until the breaker is physically toggled.\n\n#### Recovery
    Detection (Breaker Restored)\n**Purpose**: Automatically resolve alerts once the
    system returns to a nominal state.\n**Logic Overview**: Triggered when **Bat1
    Current** registers any non-zero value for at least **5 seconds**.\n**Effect**:
    Sends `clear_notification` commands to `admin`, `duncan`, and `stephan_iphone`
    to remove the stale \"bat1_breaker\" tag from mobile devices.\n\n---\n\n### Technical
    Overview\n\n* **Automation Mode**: `restart` (Ensures the most recent state change
    takes precedence).\n* **Execution Method**: Direct action sequences with a `repeat-until`
    loop for persistent alerting.\n* **Key Inputs**: \n    * `sensor.battery_1_bat1_current`\n
    \   * `sensor.battery_2_bat2_current`\n    * `switch.esp32_s3_zero_deye8k_time_of_use`\n*
    **Controlled Entities**: \n    * `notify.admin`\n    * `notify.duncan`\n    *
    `notify.mobile_app_stephan_iphone`\n* **Safety Mechanisms**: \n    * **Deadband**:
    A **2:30 minute** delay prevents triggering on momentary current fluctuations.\n
    \   * **SOC Guard**: The **99.9%** check prevents \"False Tripping\" alerts when
    the BMS cuts current at full charge.\n\n---\n\n### \U0001F4A1 Notes\n\n* **Logic
    Rationale**: The use of a template trigger comparing `bat1` against `bat2` is
    highly effective for parallel systems, as it distinguishes between a system-wide
    idle state and a specific hardware failure on a single string.\n* **Notification
    Management**: The use of `tag: bat1_breaker` allows the automation to \"overwrite\"
    or \"dismiss\" previous notifications, preventing notification fatigue and cluttered
    lock screens once the issue is resolved.\n"
  triggers:
  - trigger: template
    value_template: "{% set b1 = states('sensor.battery_1_bat1_current') | default(none,
      true) | float(none) %}\n{% set b2 = states('sensor.battery_2_bat2_current')
      | default(none, true) | float(none) %}\n{% set b1_soc = states('sensor.battery_1_bat1_soc')
      | default(none, true) | float(none) %}\n{% set b2_soc = states('sensor.battery_2_bat2_soc')
      | default(none, true) | float(none) %}\n\n{% set all_valid = None not in [b1,
      b2, b1_soc, b2_soc] %}\n\n{{ \n  all_valid\n  and b1 == 0\n  and b2 != 0\n  and
      b1_soc > b2_soc\n}}"
    for:
      hours: 0
      minutes: 2
      seconds: 30
    id: breaker_popped
  - trigger: template
    value_template: "{{ states('sensor.battery_1_bat1_current') | is_number\n   and
      states('sensor.battery_1_bat1_current') | float != 0 }}\n"
    id: breaker_restored
    for:
      hours: 0
      minutes: 0
      seconds: 5
  conditions:
  - condition: state
    entity_id: switch.esp32_s3_zero_deye8k_time_of_use
    state:
    - 'on'
  - condition: numeric_state
    entity_id: sensor.battery_1_bat1_soc
    above: 0
  - condition: numeric_state
    entity_id: sensor.inverter_battery
    above: 0
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: breaker_popped
      - condition: numeric_state
        entity_id: sensor.battery_1_bat1_soc
        below: 99.9
      sequence:
      - repeat:
          until:
          - condition: template
            value_template: "{{ states('sensor.battery_1_bat1_current') | is_number\n
              \  and states('sensor.battery_1_bat1_current') | float != 0 }}\n"
          sequence:
          - action: notify.admin
            data:
              title: Batterie 1 Sicherung
              message: Bitte wieder anschalten
              data:
                tag: bat1_breaker
          - delay: 00:15:00
    - conditions:
      - condition: trigger
        id: breaker_restored
      sequence:
      - action: notify.admin
        data:
          message: clear_notification
          data:
            tag: bat1_breaker
      - delay:
          hours: 0
          minutes: 0
          seconds: 15
          milliseconds: 0
      - action: notify.duncan
        data:
          message: clear_notification
          data:
            tag: bat1_breaker
      - action: notify.mobile_app_stephan_iphone
        data:
          message: clear_notification
  mode: restart
- id: '1766701693252'
  alias: Rollo Winter Control (All-in-One)
  description: "Complete winter control for the rollo using IR commands. input_boolean.rollo_state:\n
    \ ON = rollo assumed closed\n  OFF = rollo assumed open\n\nFunctions: - Sunset:
    close if safe, otherwise notify - Sunrise: open if safe, otherwise notify - Delayed
    open: open later when conditions are safe (temp >= 3°C or at noon)\n"
  triggers:
  - trigger: sun
    event: sunset
    id: sunset
    offset: +00:15:00
  - trigger: sun
    event: sunrise
    id: sunrise
    offset: +00:15:00
  - trigger: numeric_state
    entity_id:
    - sensor.gw1100a_outdoor_temperature
    above: 3
    id: temp_safe
  - trigger: numeric_state
    entity_id: sensor.gw1100a_outdoor_temperature
    above: 10
    id: temp_safe
  - trigger: time
    at: '12:00:00'
    id: noon_retry
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: sunset
      - condition: state
        entity_id: input_boolean.rollo_state
        state: 'off'
      - condition: not
        conditions:
        - condition: and
          conditions:
          - condition: state
            entity_id: input_boolean.forecast_temp_low
            state: 'on'
          - condition: state
            entity_id: input_boolean.forecast_wet
            state: 'on'
      sequence:
      - alias: Close the window before closing the rollo
        if:
        - condition: state
          entity_id: cover.wintergarten_dachfenster
          state:
          - open
        then:
        - repeat:
            until:
            - condition: or
              conditions:
              - condition: state
                entity_id: cover.wintergarten_dachfenster
                state:
                - closed
              - condition: template
                value_template: '{{ repeat.index >= 3 }}'
            sequence:
            - action: cover.close_cover
              metadata: {}
              target:
                entity_id: cover.wintergarten_dachfenster
              data: {}
            - wait_for_trigger:
              - trigger: state
                entity_id:
                - cover.wintergarten_dachfenster
                to:
                - closed
              timeout:
                hours: 0
                minutes: 2
                seconds: 0
                milliseconds: 0
              alias: Wait for closed
        - delay:
            hours: 0
            minutes: 0
            seconds: 10
            milliseconds: 0
          alias: 'Let it settle down: 10s'
      - if:
        - condition: state
          entity_id: cover.wintergarten_dachfenster
          state:
          - closed
        then:
        - action: cover.close_cover
          target:
            entity_id: cover.wintergarten_rolladen_dachfenster
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.rollo_state
        else:
        - action: notify.duncan
          data:
            title: "\U0001FA9F Rollo close blocked"
            message: Window did not close after 3 attempts; skipping rollo close.
        alias: Close Rollo only if window is closed
      alias: Close if forecast allows
    - conditions:
      - condition: trigger
        id: sunset
      - condition: state
        entity_id: input_boolean.rollo_state
        state: 'off'
      - condition: and
        conditions:
        - condition: state
          entity_id: input_boolean.forecast_temp_low
          state: 'on'
        - condition: state
          entity_id: input_boolean.forecast_wet
          state: 'on'
      sequence:
      - action: notify.duncan
        data:
          title: "\U0001FA9F Rollo not closed at sunset"
          message: 'Close command was skipped due to forecasted winter risk: low temperature
            & wet/freezing conditions.

            '
          data:
            tag: rollo_sunset_block
      alias: Notify if forecast blocks
    - conditions:
      - condition: trigger
        id: sunrise
      - condition: state
        entity_id: input_boolean.rollo_state
        state: 'on'
      - condition: not
        conditions:
        - condition: and
          conditions:
          - condition: state
            entity_id: input_boolean.rollo_was_cold
            state: 'on'
          - condition: state
            entity_id: input_boolean.rollo_was_wet
            state: 'on'
      sequence:
      - action: cover.open_cover
        target:
          entity_id: cover.wintergarten_rolladen_dachfenster
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.rollo_state
      alias: 'Open if allowed '
    - conditions:
      - condition: trigger
        id: sunrise
      - condition: state
        entity_id: input_boolean.rollo_state
        state: 'on'
      - condition: and
        conditions:
        - condition: state
          entity_id: input_boolean.rollo_was_cold
          state: 'on'
        - condition: state
          entity_id: input_boolean.rollo_was_wet
          state: 'on'
      sequence:
      - action: notify.duncan
        data:
          title: "\U0001FA9F Rollo stayed closed after sunrise"
          message: 'Open command was skipped due to overnight conditions: freezing
            temperatures & wet conditions.

            '
          data:
            tag: rollo_sunrise_block
      alias: Notify if blocked
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: temp_safe
        - condition: trigger
          id: noon_retry
      - condition: state
        entity_id: input_boolean.rollo_state
        state: 'on'
      - condition: sun
        after: sunrise
        before: sunset
        after_offset: +00:15:00
      sequence:
      - action: cover.open_cover
        target:
          entity_id: cover.wintergarten_rolladen_dachfenster
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.rollo_state
      - action: notify.duncan
        data:
          title: "\U0001FA9F Rollo opened later"
          message: 'Rollo was opened later once conditions were safe again. Current
            temperature: {{ states(''sensor.gw1100a_outdoor_temperature'') }} °C.

            '
          data:
            tag: rollo_noon_reset
      - action: notify.duncan
        metadata: {}
        data:
          message: clear_notification
          data:
            tag: rollo_sunrise_block
      alias: Retry/Safe Open l
  mode: single
- id: '1766920317036'
  alias: Heizungsverteiler EG Überstrom dynamisch
  description: "⚡ **Heizungsverteiler EG Überstrom dynamisch**\n\n### \U0001F4CB Intelligent
    Overcurrent Protection Control\n\nThis automation provides a multi-tiered safety
    layer for the **Heizungsverteiler EG** by monitoring electrical current in real-time.
    It acts as a digital circuit breaker, responding dynamically to different load
    intensities to prevent hardware damage or electrical hazards.\n\n**Operational
    Strategy:**\n* **Proactive Monitoring:** Uses staggered `numeric_state` thresholds
    to identify escalating power draws.\n* **Risk-Based Response:** Implements an
    inverse-time characteristic where higher currents trigger faster shutdown responses.\n*
    **Reliability Mechanism:** Utilizes a robust retry script with linear backoff
    to ensure the **turn_off** command is successfully executed and verified, even
    during transient interference.\n\n---\n\n### Trigger Overview Table\n\n| Type
    | Entity / Condition | ID | Purpose |\n| :--- | :--- | :--- | :--- |\n| Numeric
    State | **Current** 1A - 2A for 30s | `zone_1` | Low-level overload detection
    (sustained) |\n| Numeric State | **Current** 2A - 4A for 15s | `zone_2` | Moderate
    overload detection |\n| Numeric State | **Current** > 4A for 5s | `zone_3` | High-level/Critical
    overload (rapid response) |\n\n---\n\n### Operational Logic Sections\n\n#### ####
    Zone 1: Sustained Low Overload\n* **Purpose:** Protects against minor but persistent
    overcurrent conditions.\n* **Logic Overview:** Triggered when current stays between
    **1A** and **2A** for at least **30 seconds**.\n* **Effect:** Executes the retry-based
    shutdown and sends a Zone 1 specific notification to **notify.duncan**.\n\n####
    #### Zone 2: Moderate Overload\n* **Purpose:** Responds to significant load increases
    that exceed normal operating parameters.\n* **Logic Overview:** Triggered when
    current stays between **2A** and **4A** for **15 seconds**.\n* **Effect:** Executes
    the retry-based shutdown and sends a Zone 2 specific notification to **notify.duncan**.\n\n####
    #### Zone 3: Critical Overload\n* **Purpose:** Immediate safety intervention for
    high-current spikes or faults.\n* **Logic Overview:** Triggered when current exceeds
    **4A** for only **5 seconds**.\n* **Effect:** Executes the retry-based shutdown
    and sends a high-priority \"Immediate\" notification to **notify.duncan**.\n\n---\n\n###
    Technical Overview\n\n* **Automation Mode:** `single` (Prevents overlapping execution
    during a single event)\n* **Execution Method:** `script.retry_action_with_backoff`\n*
    **Key Inputs:** `sensor.heizungsverteiler_eg_current`\n* **Controlled Entities:**
    `switch.heizungsverteiler_eg`\n* **Safety Mechanisms:** * **Verified Shutdown:**
    10 retries with linear backoff (5s to 60s delay).\n    * **State Condition:**
    Only runs if the switch is currently **on**.\n    * **Failure Notification:**
    Direct alert if the retry script fails to confirm the \"off\" state.\n\n---\n\n###
    \U0001F4A1 Notes\n\n* **Inverse-Time Logic:** The automation mimics professional
    circuit breakers where the time-to-trip decreases as the current increases, providing
    a balance between avoiding nuisance trips and ensuring safety.\n* **Retry Script:**
    By using `script.retry_action_with_backoff`, the system accounts for potential
    Zigbee/Z-Wave mesh congestion that might otherwise cause a single \"off\" command
    to fail.\n* **Informative Alerts:** Templates are used to provide the exact amperage
    that triggered the shutdown, allowing for faster troubleshooting of the connected
    load.\n"
  triggers:
  - entity_id: sensor.heizungsverteiler_eg_current
    above: 1
    below: 2
    for:
      seconds: 30
    id: zone_1
    trigger: numeric_state
  - entity_id: sensor.heizungsverteiler_eg_current
    above: 2
    below: 4
    for:
      seconds: 15
    id: zone_2
    trigger: numeric_state
  - entity_id: sensor.heizungsverteiler_eg_current
    above: 4
    for:
      seconds: 5
    id: zone_3
    trigger: numeric_state
  conditions:
  - condition: state
    entity_id: switch.heizungsverteiler_eg
    state:
    - 'on'
  actions:
  - data:
      entity_id: switch.heizungsverteiler_eg
      target_state: 'off'
      max_retries: 10
      base_delay: 5
      max_delay: 60
      backoff_type: linear
      notify_on_failure: true
      notify_service: notify.duncan
      action_domain: switch
      action_type: turn_off
    action: script.retry_action_with_backoff
  - data:
      title: "{% if trigger.id == 'zone_1' %}\n  ⚠️ Heizungsverteiler EG abgeschaltet
        (1-2 A)\n{% elif trigger.id == 'zone_2' %}\n  ⚠️ Heizungsverteiler EG abgeschaltet
        (2-4 A)\n{% elif trigger.id == 'zone_3' %}\n  ⚠️ Heizungsverteiler EG sofort
        abgeschaltet (>4 A)\n{% endif %}\n"
      message: 'Der Heizungsverteiler EG wurde abgeschaltet, weil der Strom {{ trigger.to_state.state
        }} A erreicht hat. Das ersetzt vorübergehend die Sicherung.

        '
    action: notify.duncan
  mode: single
- id: '1767622395757'
  alias: 'Garden House: Freeze Protection Heating'
  description: "❄️ **Garden House: Freeze Protection Heating**\n\n### \U0001F4CB Intelligent
    Climate Preservation Control\n\nThis automation manages the heating system within
    the garden house to prevent structural damage from freezing temperatures. It employs
    a **two-tier operational strategy**: maintaining a critical safety floor to prevent
    ice formation and utilizing excess renewable energy to pre-heat the space during
    high solar output.\n\nReliability is ensured through a **linear backoff retry
    mechanism**, which validates state changes against potential network instability,
    and a tiered countdown timer to prevent short-cycling or runaway power consumption.\n\n---\n\n###
    Trigger Overview Table\n\n| Type | Entity / Condition | ID | Purpose |\n| :---
    | :--- | :--- | :--- |\n| Time Pattern | Every **15 minutes** | N/A | Periodic
    temperature and condition check. |\n| Numeric State | **sensor.solar_power_total**
    | N/A | Monitors for solar production above **2000W** to trigger opportunistic
    heating. |\n\n---\n\n### Operational Logic Sections\n\n#### Emergency Freeze Prevention\n*
    **Purpose**: Protect infrastructure when temperatures reach critical levels.\n*
    **Logic Overview**: Triggered if the heater is **off** AND current temperature
    is **≤ 1.5°C** OR the 24-hour minimum has dropped to **≤ 0.5°C**.\n* **Effect**:
    Activates **switch.gartenhaus_heizlufter** via retry script. Sets a **3600s**
    (1 hour) countdown if before 04:00, or **900s** (15 mins) otherwise.\n\n#### Opportunistic
    Solar Heating\n* **Purpose**: Increase ambient temperature using free solar energy.\n*
    **Logic Overview**: Triggered if heater is **off**, temperature is between **1.5°C**
    and **6.0°C**, solar production is **≥ 2000W**, daily heater consumption is **<
    1.5kWh**, and battery SoC is **> 50%**.\n* **Effect**: Activates **switch.gartenhaus_heizlufter**
    via retry script and sets a **900s** (15 mins) operation countdown.\n\n#### Hard
    Thermal Cutoff\n* **Purpose**: Prevent overheating and energy waste.\n* **Logic
    Overview**: Triggered if the heater is currently **on** and the temperature reaches
    or exceeds **11.0°C**.\n* **Effect**: Disengages **switch.gartenhaus_heizlufter**
    via retry script with mandatory state confirmation.\n\n---\n\n### Technical Overview\n\n*
    **Automation Mode**: `single` (Quietly ignores new triggers if currently running
    logic).\n* **Execution Method**: Utilizes `script.retry_action_with_backoff` for
    resilient hardware state switching.\n* **Key Inputs**:\n    * **sensor.esp32_c3_zero_epever_bme280_temperature**
    (Live Temp)\n    * **sensor.solar_power_total** (Solar Production)\n    * **sensor.felicity_ess_soc_avg**
    (Battery SoC)\n* **Controlled Entities**:\n    * **switch.gartenhaus_heizlufter**
    (Main Heater)\n    * **number.gartenhaus_heizlufter_countdown** (Run-time logic)\n*
    **Safety Mechanisms**:\n    * **Linear Backoff**: 10 retries with 5s-60s delays.\n
    \   * **Notifications**: Direct alerts to **notify.duncan** upon hardware failure.\n
    \   * **Energy Cap**: Limits opportunistic heating to **1.5kWh** daily.\n\n---\n\n###
    \U0001F4A1 Notes\n\n* **Logic Rationale**: The **1.5°C** threshold provides a
    buffer above freezing to account for sensor variance and thermal inertia. \n*
    **Battery Protection**: Solar heating is strictly inhibited if the battery is
    below **50%**, ensuring base load capacity for the household is prioritized over
    garden house pre-heating.\n* **Smart Timing**: The 1-hour emergency run-time before
    04:00 anticipates the coldest part of the night, reducing the frequency of start/stop
    cycles during high-risk hours."
  triggers:
  - trigger: time_pattern
    minutes: /15
  - trigger: numeric_state
    entity_id: sensor.solar_power_total
    above: 2000
  conditions:
  - condition: template
    value_template: '{{ is_emergency or is_opportunistic or is_hard_off }}'
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ is_emergency }}'
      sequence:
      - action: script.retry_action_with_backoff
        data:
          action_domain: switch
          action_type: turn_on
          entity_id: switch.gartenhaus_heizlufter
          target_state: 'on'
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: linear
          notify_on_failure: true
          notify_service: notify.duncan
      - action: number.set_value
        target:
          entity_id: number.gartenhaus_heizlufter_countdown
        data:
          value: '{{ 3600 if now().hour < 4 else 900 }}'
    - conditions:
      - condition: template
        value_template: '{{ is_opportunistic }}'
      sequence:
      - action: script.retry_action_with_backoff
        data:
          action_domain: switch
          action_type: turn_on
          entity_id: switch.gartenhaus_heizlufter
          target_state: 'on'
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: linear
          notify_on_failure: true
          notify_service: notify.duncan
      - action: number.set_value
        target:
          entity_id: number.gartenhaus_heizlufter_countdown
        data:
          value: 900
    - conditions:
      - condition: template
        value_template: '{{ is_hard_off }}'
      sequence:
      - action: script.retry_action_with_backoff
        data:
          action_domain: switch
          action_type: turn_off
          entity_id: switch.gartenhaus_heizlufter
          target_state: 'off'
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: linear
          notify_on_failure: true
          notify_service: notify.duncan
  variables:
    temp_now: '{{ states(''sensor.esp32_c3_zero_epever_bme280_temperature'') | float(99)
      }}'
    temp_min_24h: '{{ states(''sensor.bme280_temperature_min'') | float(99) }}'
    solar_power: '{{ states(''sensor.solar_power_total'') | float(0) }}'
    heater_on: '{{ is_state(''switch.gartenhaus_heizlufter'', ''on'') }}'
    heater_energy_today: '{{ states(''sensor.gartenhaus_heizlufter_energy_today'')
      | float(0) }}'
    battery: '{{ states(''sensor.felicity_ess_soc_avg'') | float(0) }}'
    is_emergency: '{{ not heater_on and (temp_now <= 1.5 or temp_min_24h <= 0.5) }}'
    is_opportunistic: '{{ not heater_on and 1.5 < temp_now < 6.0 and solar_power >=
      2000 and heater_energy_today < 1.5 and battery > 50 }}'
    is_hard_off: '{{ heater_on and temp_now >= 11.0 }}'
  mode: single
  max_exceeded: silent
- id: '1767700454624'
  alias: Weather Forecast Based Rollo Control
  description: This automation sets boolean inputs based on weather forecasts and
    resets them at specific times. It also handles real-time conditions like temperature
    and rain to update the rollo status.
  triggers:
  - trigger: sun
    event: sunrise
    offset: +02:00:00
    id: sunrise+2h
    alias: Reset at Sunrise + 2h
  - alias: Forecast Calculate at Sunset - 15m
    event: sunset
    trigger: sun
    id: sunset
  - trigger: numeric_state
    entity_id:
    - sensor.gw1100a_outdoor_temperature
    id: temp below
    below: 1
  - trigger: numeric_state
    entity_id:
    - sensor.gw1100a_rain_rate
    above: 0.1
    id: wet
  - trigger: state
    entity_id:
    - binary_sensor.rain_sun_flower_rain
    to:
    - 'on'
    id: wet
  - trigger: time_pattern
    minutes: /30
    id: 30m
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - sunrise+2h
      - condition: sun
        after: sunset
        before: sunrise
        before_offset: +02:00:01
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id:
          - input_boolean.forecast_temp_low
          - input_boolean.forecast_wet
        alias: Reset Forecast
      - action: input_boolean.turn_off
        metadata: {}
        data: {}
        target:
          entity_id:
          - input_boolean.rollo_was_cold
          - input_boolean.rollo_was_wet
        alias: Reset Real
      alias: Reset to off at sunrise +2h
    - conditions:
      - condition: trigger
        id:
        - sunset
      sequence:
      - sequence:
        - data:
            type: hourly
          target:
            entity_id:
            - weather.micro_weather_station
            - weather.forecast_home
          response_variable: weather_data
          action: weather.get_forecasts
        - variables:
            weather_results: "{% set ns = namespace(is_low=false, is_wet=false) %}
              {% set next_sunrise = states('sensor.sun_next_rising') | as_datetime()
              | as_local %} {% for entity_id, entity_data in weather_data.items()
              %}\n    {% set forecast = entity_data.forecast %}\n    {% for item in
              forecast %}\n        {% set item_time = item.datetime | as_datetime()
              | as_local %}\n        {% if item_time < next_sunrise %}\n            {%
              set current_temp = item.temperature %}\n            {% set low_temp
              = item.templow | default(current_temp) %}\n            {% if current_temp
              < 10 or low_temp < 10 %}\n              {% set ns.is_low = true %}\n
              \           {% endif %}\n            {% set is_precip = item.condition
              in ['rainy', 'pouring', 'snowy', 'hail', 'lightning-rainy', 'snowy-rainy']
              %}\n            {% set is_cold = current_temp < 1 or low_temp < 1 %}\n
              \           {% if is_precip and is_cold %}\n              {% set ns.is_wet
              = true %}\n            {% endif %}\n        {% endif %}\n        {%
              if ns.is_low and ns.is_wet %}\n            {% break %}\n        {% endif
              %}\n    {% endfor %}\n    {% if ns.is_low and ns.is_wet %}\n        {%
              break %}\n    {% endif %}\n{% endfor %} {{ {'low': ns.is_low, 'wet':
              ns.is_wet} }}\n"
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ weather_results.low }}'
            sequence:
            - target:
                entity_id: input_boolean.forecast_temp_low
              action: input_boolean.turn_on
          default:
          - target:
              entity_id: input_boolean.forecast_temp_low
            action: input_boolean.turn_off
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ weather_results.wet }}'
            sequence:
            - target:
                entity_id: input_boolean.forecast_wet
              action: input_boolean.turn_on
          default:
          - target:
              entity_id: input_boolean.forecast_wet
            action: input_boolean.turn_off
      alias: forecast booleans based on forecast
    - conditions:
      - condition: trigger
        id:
        - wet
        - 30m
        - temp below
      - condition: sun
        after: sunset
        before: sunrise
        before_offset: +02:00:01
      sequence:
      - choose:
        - conditions:
          - condition: trigger
            id:
            - 30m
            - temp below
          - condition: state
            entity_id: input_boolean.rollo_was_cold
            state:
            - 'off'
          - condition: numeric_state
            entity_id: sensor.gw1100a_outdoor_temperature
            below: 1
          sequence:
          - action: input_boolean.turn_on
            metadata: {}
            data: {}
            target:
              entity_id:
              - input_boolean.rollo_was_cold
        - conditions:
          - condition: trigger
            id:
            - wet
            - 30m
          - condition: state
            entity_id: input_boolean.rollo_was_wet
            state:
            - 'off'
          - condition: or
            conditions:
            - condition: numeric_state
              entity_id: sensor.gw1100a_rain_rate
              above: 0.1
            - condition: state
              entity_id: binary_sensor.rain_sun_flower_rain
              state:
              - 'on'
          sequence:
          - action: input_boolean.turn_on
            metadata: {}
            data: {}
            target:
              entity_id: input_boolean.rollo_was_wet
  mode: single
- id: '1767821872512'
  alias: Bat2 Circuit Breaker Failure
  description: "⚡ **Bat2 Circuit Breaker Failure**\n\n---\n\n### \U0001F4CB Intelligent
    Battery Monitoring Control\n\nThis automation provides proactive monitoring and
    alerting for the physical circuit breaker of the second battery bank (**Bat2**).
    By comparing the current flow between multiple battery units, the system can distinguish
    between a deliberate idle state and a hardware disconnection (tripped breaker).\n\n*
    **High-Level Intent**: Ensure continuous energy availability by alerting the administrator
    if one battery string stops contributing power while the other remains active.\n*
    **Operational Strategy**: Differential current analysis. It compares **sensor.battery_1_bat1_current**
    against **sensor.battery_2_bat2_current** to identify anomalies.\n* **Reliability
    Mechanisms**: Implements a persistent notification loop with a retry logic that
    repeats every 15 minutes until physical intervention is detected.\n\n---\n\n###
    Trigger Overview Table\n\n| Type | Entity / Condition | ID | Purpose |\n| :---
    | :--- | :--- | :--- |\n| **Template** | Current Differential (B1 > 0, B2 = 0)
    | `breaker_popped` | Detects when Bat2 provides 0A while Bat1 is active for 2.5
    minutes. |\n| **Template** | Current Flow Restored (B2 ≠ 0) | `breaker_restored`
    | Detects when amperage returns to the Bat2 circuit. |\n\n---\n\n### Operational
    Logic Sections\n\n#### Failure Detection (Breaker Popped)\n* **Purpose**: Identify
    a hardware disconnect and initiate the notification loop.\n* **Logic Overview**:
    Triggered if **Bat2 Current** is **0** while **Bat1 Current** is non-zero for
    **00:02:30**. It only executes if **Time of Use** is **on**, **Bat2 SoC** is above
    **0%**, and **Inverter Battery** sensor is active. An additional safety check
    ensures **Bat2 SoC** is below **99.9%** to avoid false positives during full-charge
    saturation.\n* **Effect**: Initiates a repeating loop that sends a `notify.admin`
    message (\"Bitte wieder anschalten\") every **15 minutes**.\n\n#### Recovery Detection
    (Breaker Restored)\n* **Purpose**: Automatically clear alerts once the hardware
    issue is resolved.\n* **Logic Overview**: Triggered when **Bat2 Current** returns
    to a non-zero value for **5 seconds**.\n* **Effect**: Sends `clear_notification`
    commands to **notify.admin**, **notify.duncan**, and **mobile_app_stephan_iphone**
    to remove the stale alerts from all devices.\n\n---\n\n### Technical Overview\n\n*
    **Automation Mode**: `restart` (Ensures the most recent state change takes precedence).\n*
    **Execution Method**: Direct action sequences with a `repeat-until` loop for persistent
    alerting.\n* **Key Inputs**: \n    * `sensor.battery_1_bat1_current`\n    * `sensor.battery_2_bat2_current`\n
    \   * `sensor.battery_2_bat2_soc`\n* **Controlled Entities**: \n    * `notify.admin`\n
    \   * `notify.duncan`\n    * `notify.mobile_app_stephan_iphone`\n* **Safety Mechanisms**:
    \n    * **SoC Guard**: Prevents \"Popped\" alerts if the battery is at **99.9%**
    (where BMS might naturally throttle current to 0).\n    * **System Check**: Requires
    `switch.esp32_s3_zero_deye8k_time_of_use` to be **on** to ensure the inverter
    is in an active operational state.\n\n---\n\n### \U0001F4A1 Notes\n\n* **False
    Positive Protection**: The 150-second delay on the \"Popped\" trigger prevents
    alerts during momentary current fluctuations or BMS balancing.\n* **Notification
    Management**: Uses a specific `tag: bat2_breaker` for notifications, allowing
    the automation to overwrite or dismiss the same notification thread across multiple
    devices seamlessly.\n* **Differential Logic**: By checking if Bat1 has current
    while Bat2 does not, the automation intelligently ignores instances where the
    entire system is idle or the inverter is not drawing power.\n"
  triggers:
  - trigger: template
    value_template: "{% set b1 = states('sensor.battery_1_bat1_current') | default(none,
      true) | float(none) %}\n{% set b2 = states('sensor.battery_2_bat2_current')
      | default(none, true) | float(none) %}\n{% set b1_soc = states('sensor.battery_1_bat1_soc')
      | default(none, true) | float(none) %}\n{% set b2_soc = states('sensor.battery_2_bat2_soc')
      | default(none, true) | float(none) %}\n\n{% set all_valid = None not in [b1,
      b2, b1_soc, b2_soc] %}\n\n{{\n  all_valid\n  and b2 == 0\n  and b1 != 0\n  and
      b2_soc > b1_soc\n}}"
    for:
      hours: 0
      minutes: 2
      seconds: 30
    id: breaker_popped
  - trigger: template
    value_template: "{{ states('sensor.battery_2_bat2_current') | is_number\n   and
      states('sensor.battery_2_bat2_current') | float != 0 }}\n"
    for:
      hours: 0
      minutes: 0
      seconds: 5
    id: breaker_restored
  conditions:
  - condition: state
    entity_id: switch.esp32_s3_zero_deye8k_time_of_use
    state: 'on'
  - condition: numeric_state
    entity_id: sensor.battery_2_bat2_soc
    above: 0
  - condition: numeric_state
    entity_id: sensor.inverter_battery
    above: 0
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: breaker_popped
      - condition: numeric_state
        entity_id: sensor.battery_2_bat2_soc
        below: 99.9
      sequence:
      - repeat:
          until:
          - condition: template
            value_template: "{{ states('sensor.battery_2_bat2_current') | is_number\n
              \  and states('sensor.battery_2_bat2_current') | float != 0 }}\n"
          sequence:
          - action: notify.admin
            data:
              title: Batterie 2 Sicherung
              message: Bitte wieder anschalten
              data:
                tag: bat2_breaker
          - delay: 00:15:00
    - conditions:
      - condition: trigger
        id: breaker_restored
      sequence:
      - action: notify.admin
        data:
          message: clear_notification
          data:
            tag: bat2_breaker
      - delay: 00:00:15
      - action: notify.duncan
        data:
          message: clear_notification
          data:
            tag: bat2_breaker
      - action: notify.mobile_app_stephan_iphone
        data:
          message: clear_notification
  mode: restart
- id: '1768047602515'
  alias: Bad Spiegellicht
  description: "☀️ **Mirror Light: Sun-Based Automation**\n\n---\n\n### \U0001F4CB
    Intelligent Mirror Light Control\n\nThis automation manages the **switch.bad_spiegellicht**
    based on the solar cycle to ensure optimal bathroom lighting without manual intervention.
    \n\n* **High-Level Intent**: Automatically activate the mirror light as dusk approaches
    and deactivate it at sunrise.\n* **Operational Strategy**: Solar-driven logic
    utilizing specific offsets to preempt darkness, combined with a state-synchronization
    check upon system boot.\n* **Reliability Mechanisms**: Employs a robust retry
    script with a linear backoff strategy. This ensures that even if the hardware
    is momentarily unreachable, the system will attempt to enforce the correct state
    up to 10 times before alerting the administrator.\n\n---\n\n### Trigger Overview
    Table\n\n| Type | Entity / Condition | ID | Purpose |\n| :--- | :--- | :--- |
    :--- |\n| **Sun** | 15 min before sunset | `turn_on` | Proactively light the room
    before total darkness. |\n| **Sun** | At sunrise | `turn_off` | Conserve energy
    by disabling light during daylight. |\n| **System** | Home Assistant Start | `sync`
    | Ensure the light matches the sun state after a reboot. |\n\n---\n\n### Operational
    Logic Sections\n\n#### Evening Mode\n* **Purpose**: Illuminate the bathroom for
    nighttime use.\n* **Logic Overview**: Triggered by the sunset offset or a system
    sync when the sun is **after 15 minutes before sunset**.\n* **Effect**: Activates
    **switch.bad_spiegellicht** via retry script.\n\n#### Daylight Mode\n* **Purpose**:
    Ensure the light is extinguished during the day.\n* **Logic Overview**: Triggered
    by sunrise or a system sync when the sun is **between sunrise and 15 minutes before
    sunset**.\n* **Effect**: Deactivates **switch.bad_spiegellicht** via retry script.\n\n---\n\n###
    Technical Overview\n\n* **Automation Mode**: `single`\n* **Execution Method**:
    External script (`script.retry_action_with_backoff`)\n* **Key Inputs**: Solar
    position, System uptime\n* **Controlled Entities**: `switch.bad_spiegellicht`\n*
    **Safety Mechanisms**: \n    * **Linear Backoff**: 5s base delay scaling to 60s.\n
    \   * **Failure Notification**: Dispatches a notification to `notify.duncan` if
    the state cannot be verified after **10 retries**.\n\n---\n\n### \U0001F4A1 Notes\n\n*
    **Pre-emptive Lighting**: The **-00:15:00** offset is used to bridge the gap between
    natural light fading and official sunset, providing better utility in windowed
    environments.\n* **State Sync**: The inclusion of the `homeassistant` start event
    prevents the light from remaining in the wrong state if a power outage or restart
    occurs during a solar transition.\n* **Resilience**: Using `script.retry_action_with_backoff`
    instead of a simple `switch.turn_on` command makes this automation highly resilient
    against Zigbee/Wi-Fi mesh instability.\n"
  triggers:
  - alias: Trigger 15 minutes before sunset
    event: sunset
    offset: -00:15:00
    id: turn_on
    trigger: sun
  - alias: Trigger at sunrise
    event: sunrise
    id: turn_off
    trigger: sun
  - alias: Trigger on Home Assistant startup
    event: start
    id: sync
    trigger: homeassistant
  actions:
  - alias: Wait 30s to wrap up HA Startup
    if:
    - condition: trigger
      id:
      - sync
    then:
    - delay:
        hours: 0
        minutes: 0
        seconds: 30
        milliseconds: 0
  - choose:
    - alias: 'Condition: It is sunset or night-time'
      conditions:
      - condition: trigger
        id:
        - turn_on
        - sync
      - condition: sun
        after: sunset
        after_offset: -00:15:00
      sequence:
      - action: script.retry_action_with_backoff
        metadata: {}
        data:
          action_domain: switch
          action_type: turn_on
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: linear
          notify_on_failure: true
          notify_service: notify.duncan
          target_state: 'on'
          entity_id: switch.bad_spiegellicht
    - alias: 'Condition: It is sunrise or daytime'
      conditions:
      - condition: trigger
        id:
        - sync
        - turn_off
      - condition: sun
        before: sunset
        before_offset: -00:15:00
        after: sunrise
      sequence:
      - action: script.retry_action_with_backoff
        metadata: {}
        data:
          action_domain: switch
          action_type: turn_off
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: linear
          notify_on_failure: true
          notify_service: notify.duncan
          target_state: 'off'
          entity_id: switch.bad_spiegellicht
  mode: single
- id: '1768073928361'
  alias: Smart Meter Status Alert
  description: "⚠️ **Smart Meter Status Alert**\n\n### \U0001F4CB Intelligent Utility
    Monitoring Control\n\nThis automation provides proactive oversight of the household's
    smart meter communication and hardware health. Its primary intent is to ensure
    data integrity by alerting the administrator immediately if the meter reports
    an internal fault or ceases communication entirely. \n\nThe operational strategy
    is **safety-first**, utilizing a 30-second verification delay to filter out transient
    network blips while ensuring that genuine hardware failures or communication timeouts
    are addressed before data gaps occur.\n\n---\n\n### Trigger Overview Table\n\n|
    Type | Entity / Condition | ID | Purpose |\n| :--- | :--- | :--- | :--- |\n| **State**
    | **binary_sensor.smart_meter_mqtt_data** | N/A | Detects internal hardware status
    fault (**on**) |\n| **State** | **binary_sensor.smart_meter_mqtt_data** | N/A
    | Detects communication loss (**unavailable**) |\n\n---\n\n### Operational Logic
    Sections\n\n#### Hardware Fault Mode\n- **Purpose**: To notify when the meter's
    internal diagnostics report a \"Hardware Status 0\" or general failure.\n- **Logic
    Overview**: Triggered when **binary_sensor.smart_meter_mqtt_data** remains in
    the **on** state for at least **30 seconds**.\n- **Effect**: Sends a high-priority
    notification to **notify.duncan** with the tag **smart_meter_problem**.\n\n####
    Communication Timeout Mode\n- **Purpose**: To identify instances where the MQTT
    stream has stopped or the bridge has gone offline.\n- **Logic Overview**: Triggered
    when the entity state changes to **unavailable** for at least **30 seconds**.\n-
    **Effect**: Dispatches a \"Communication timeout\" alert to **notify.duncan**.\n\n---\n\n###
    Technical Overview\n\n- **Automation Mode**: **single** (prevents redundant notifications
    during rapid state flickering).\n- **Execution Method**: Direct YAML action block
    using the **notify.duncan** service.\n- **Key Inputs**: **binary_sensor.smart_meter_mqtt_data**.\n-
    **Controlled Entities**: Notification service (**notify.duncan**).\n- **Safety
    Mechanisms**: 30-second **for** duration on triggers to prevent \"false positive\"
    notifications during service restarts.\n\n---\n\n### \U0001F4A1 Notes\n\n- **De-duplication**:
    The use of the **tag: smart_meter_problem** ensures that consecutive alerts overwrite
    each other on the mobile device, preventing notification spam.\n- **Threshold
    Rationale**: The **30-second** delay is calibrated to ignore standard MQTT broker
    restarts while remaining fast enough to allow for manual intervention before significant
    data loss in energy dashboards.\n- **Dynamic Messaging**: Uses Jinja2 templating
    to provide specific context (Hardware vs. Communication) within a single automation
    flow.\n"
  triggers:
  - entity_id:
    - binary_sensor.smart_meter_mqtt_data
    to:
    - 'on'
    trigger: state
    for:
      hours: 0
      minutes: 0
      seconds: 30
  - entity_id:
    - binary_sensor.smart_meter_mqtt_data
    to:
    - unavailable
    trigger: state
    for:
      hours: 0
      minutes: 0
      seconds: 30
  conditions: []
  actions:
  - data:
      title: ⚠️ Smart Meter Alert
      message: "{% if trigger.to_state.state == \"on\" %}\n  The Smart Meter reports
        a problem (Hardware status = 0).\n{% elif trigger.to_state.state == \"unavailable\"
        %}\n  The Smart Meter stopped reporting (Communication timeout).\n{% else
        %}\n  The Smart Meter status changed to {{ trigger.to_state.state }}.\n{%
        endif %}\n"
      data:
        tag: smart_meter_problem
    action: notify.duncan
  mode: single
- id: '1768908825981'
  alias: Timemachine NAS Sync (Hourly with Notifications)
  description: "\U0001F4E6 **Timemachine NAS Sync (Hourly with Notifications)**\n\n###
    \U0001F4CB Intelligent NAS Backup Control\n\nThis automation manages the synchronization
    process between local storage and a Network Attached Storage (NAS) device. Its
    primary intent is to ensure data redundancy by mirroring Timemachine backups on
    a consistent, hourly basis.\n\nThe operational strategy utilizes a shell-level
    mirror command followed by an intelligent evaluation of the return codes. This
    ensures that the system doesn't just run blindly but actively monitors for script
    execution errors and reports them via a dedicated notification channel, providing
    a high level of reliability for critical data backups.\n\n---\n\n### Trigger Overview
    Table\n\n| Type | Entity / Condition | ID | Purpose |\n| :--- | :--- | :--- |
    :--- |\n| **Time Pattern** | Every hour at **10** minutes past | N/A | Initiates
    the synchronization process on a fixed hourly schedule. |\n\n---\n\n### Operational
    Logic Sections\n\n#### \U0001F6E0️ Synchronization Execution\n- **Purpose**: Execute
    the core data transfer logic.\n- **Logic Overview**: Triggered automatically by
    the time pattern; no global conditions restrict execution.\n- **Effect**: Runs
    **shell_command.mirror_timemachine_to_nas** and captures the output into the **nas_response**
    variable.\n\n#### ⚠️ Error Handling & Failure Notification\n- **Purpose**: Alert
    the administrator if the backup fails.\n- **Logic Overview**: Evaluates if the
    **returncode** of the shell command is not **0**.\n- **Effect**: Sends a notification
    to **notify.duncan** containing the specific **stderr** message and applies the
    tag **nas_sync_error**.\n\n#### ✅ Success Reporting\n- **Purpose**: Provide confirmation
    of data movement when requested.\n- **Logic Overview**: Requires the **returncode**
    to be **0**, the output to contain actual file changes (ignoring \"No changes
    detected\"), and the helper **input_boolean.notify_on_nas_sync_success** to be
    **on**.\n- **Effect**: Sends a success notification to **notify.duncan** with
    the tag **nas_sync_success**.\n\n---\n\n### Technical Overview\n\n- **Automation
    Mode**: **single** (prevents overlapping sync processes)\n- **Execution Method**:
    Shell Command with captured response variables\n- **Key Inputs**: **input_boolean.notify_on_nas_sync_success**\n-
    **Controlled Entities**: **notify.duncan**\n- **Safety Mechanisms**: Return code
    validation and error string capture (**stderr**) to diagnose script-level failures.\n\n---\n\n###
    \U0001F4A1 Notes\n\n- **Efficient Notifications**: The automation distinguishes
    between a successful run with no data (quiet) and a successful run with actual
    file transfers, preventing notification fatigue.\n- **Error Transparency**: By
    passing the **stderr** directly into the notification message, troubleshooting
    can begin immediately without needing to check Home Assistant logs.\n- **Collision
    Prevention**: The **single** mode is critical here; it ensures that if a large
    backup takes longer than an hour, a second sync process will not start and potentially
    corrupt the transfer or over-tax the CPU."
  triggers:
  - minutes: '10'
    trigger: time_pattern
  conditions: []
  actions:
  - action: shell_command.mirror_timemachine_to_nas
    response_variable: nas_response
    data: {}
  - if:
    - condition: template
      value_template: '{{ nas_response is mapping and (nas_response.returncode | default(1))
        != 0 }}'
    then:
    - data:
        title: Timemachine NAS Sync Failed
        message: 'Something went wrong with the NAS mirror script!

          Error: {{ nas_response[''stderr''] }}'
        data:
          tag: nas_sync_error
      action: notify.duncan
    alias: Failure Notification
  - alias: Success Notification
    if:
    - condition: template
      value_template: "{% set stdout = (nas_response.stdout | default('')) %}\n{{
        nas_response is mapping and (nas_response.returncode | default(1)) == 0\n
        \  and (\n     'Copied 0 new snapshots' not in stdout or \n     'Deleted 0
        obsolete snapshots' not in stdout\n   )\n   and is_state('input_boolean.notify_on_nas_sync_success',
        'on') }}\n"
    then:
    - data:
        title: Timemachine NAS Sync Success
        message: 'Files were successfully mirrored to NAS.


          **Details:**

          ```

          {{ nas_response[''stdout''] }}

          ```'
        data:
          tag: nas_sync_success
      action: notify.duncan
  mode: single
- id: kinderbad_window_monitor
  alias: Kinderbad Fenster offen
  description: Monitors Kids' Bathroom window and uses the smart notification script.
  triggers:
  - trigger: state
    entity_id: binary_sensor.kinderbad_fenster_contact
    to: 'on'
    for:
      minutes: 10
    id: send_notification
  - trigger: state
    entity_id: binary_sensor.kinderbad_fenster_contact
    from: 'on'
    for:
      seconds: 5
    id: delete_notification
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: send_notification
      sequence:
      - repeat:
          until:
          - condition: template
            value_template: '{{ is_state(trigger_entity, ''off'')  }}'
          sequence:
          - action: script.notify_people_at_home_with_fallbacks
            data:
              title: '{{ custom_friendly_name }} offen'
              message: '{{ custom_friendly_name }} ist offen seit {{ as_timestamp(states[trigger_entity].last_changed)
                | timestamp_custom(''%H:%M'', True) }}.'
              tag: '{{ notification_tag }}'
              color: red
              notification_icon: mdi:window-open
          - delay:
              hours: 0
              minutes: 10
              seconds: 0
              milliseconds: 0
    - conditions:
      - condition: trigger
        id: delete_notification
      sequence:
      - action: script.notify_people_at_home_with_fallbacks
        data:
          message: clear_notification
          tag: '{{ notification_tag }}'
          title: Geschlossen
  mode: restart
  variables:
    trigger_entity: binary_sensor.kinderbad_fenster_contact
    custom_friendly_name: Kinderbad Fenster
    notification_tag: kinderbad_window_alert
