- id: '1736353991047'
  alias: Papa kommt heim
  description: "\U0001F3E0 **Papa kommt heim**\n\n---\n\n### \U0001F4CB Intelligent
    Commute Tracking & Notification Control\n\nThis automation manages the notification
    lifecycle for **Stephan's** commute from work to home. It ensures family members
    receive timely updates regarding his estimated time of arrival (ETA) and automatically
    cleans up stale notifications upon his arrival.\n\nThe system utilizes a multi-stage
    operational strategy:\n* **Initialization:** Restarts the **iCloud3** tracking
    engine to ensure high-accuracy location data upon departure.\n* **Proactive Updates:**
    Sends notifications with real-time ETA when the vehicle starts moving or enters
    a secondary proximity zone (**Big Home 2**).\n* **Cleanup:** Automatically clears
    the notification from the target device once the **Home** zone is reached to maintain
    a clutter-free UI.\n\n---\n\n### Trigger Overview Table\n\n| Type | Entity / Condition
    | ID | Purpose |\n| :--- | :--- | :--- | :--- |\n| **State** | `binary_sensor.wvgzzze2zpe005371_vehicle_moving`
    | `Arbeit` | Detects when the vehicle starts moving to initiate the departure
    sequence. |\n| **Zone** | `person.stephan` (Leaves `zone.papa_arbeit`) | `Arbeit`
    | Triggers the departure sequence. |\n| **Zone** | `person.stephan` (Enters `zone.big_home_2`)
    | `Enter` | Triggers a mid-commute ETA update when entering the outer perimeter.
    |\n| **Zone** | `person.stephan` (Enters `zone.home`) | `Home` | Detects final
    arrival to clear existing notifications. |\n\n---\n\n### Operational Logic Sections\n\n####
    Leave Arbeit (Departure)\n* **Purpose:** Initializes tracking and sends the first
    ETA alert.\n* **Logic Overview:** Triggered by vehicle movement between **17:00
    - 18:30** (Mon-Thu) or **13:00 - 16:00** (Fri), provided **person.stephan** is
    not already **home**.\n* **Effect:** Commands **iCloud3** to **Restart**, waits
    30 seconds, and sends a notification to **notify.duncan** with the value of `sensor.stephans_iphone_travel_time`.\n\n####
    Proximity Alert (Enter)\n* **Purpose:** Provides a secondary ETA update as the
    commute nears completion.\n* **Logic Overview:** Triggered when **person.stephan**
    enters the **Big Home 2** zone.\n* **Effect:** Sends a refreshed ETA notification
    to **notify.duncan** using the same `home_arrival_papa` tag to overwrite previous
    alerts.\n\n#### Arrival (Home)\n* **Purpose:** Housekeeping and alert termination.\n*
    **Logic Overview:** Triggered when **person.stephan** enters the **Home** zone.\n*
    **Effect:** Sends a `clear_notification` command to **notify.duncan** for the
    specific tag `home_arrival_papa`, removing the alert from the device.\n\n---\n\n###
    Technical Overview\n\n* **Automation Mode:** `single` (Prevents overlapping execution
    during the 30s restart delay).\n* **Execution Method:** Direct action calls to
    **icloud3.action** and **notify.duncan**.\n* **Key Inputs:** `sensor.stephans_iphone_travel_time`,
    `sensor.uptime`.\n* **Controlled Entities:** `notify.duncan`, `icloud3` integration.\n*
    **Safety Mechanisms:** * **Uptime Guard:** Template condition ensures the automation
    only runs if the Home Assistant system has been stable for at least **120 seconds**.\n
    \   * **Tagging:** Uses the `home_arrival_papa` tag to ensure notifications are
    updated/cleared rather than duplicated.\n\n---\n\n### \U0001F4A1 Notes\n\n* **Logic
    Rationale:** The Friday departure window is specifically shifted earlier (**13:00
    - 16:00**) to account for a shorter work day.\n* **iCloud3 Refresh:** The 30-second
    delay after the **iCloud3** restart is critical to allow the tracking integration
    to re-initialize and fetch a fresh location before the first notification is sent.\n*
    **Automated Cleanup:** The use of `clear_notification` ensures that family members
    aren't left with an \"incoming\" alert on their phones after the arrival has already
    occurred."
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.wvgzzze2zpe005371_vehicle_moving
    from:
    to: 'on'
    id: Arbeit
    enabled: false
  - trigger: zone
    entity_id: person.stephan
    zone: zone.papa_arbeit
    event: leave
    id: Arbeit
  - trigger: zone
    entity_id: person.stephan
    zone: zone.big_home_2
    event: enter
    id: Enter
  - trigger: zone
    entity_id: person.stephan
    zone: zone.home
    event: enter
    id: Home
  conditions:
  - alias: restart finished
    condition: template
    value_template: "    {% set boot = as_timestamp(states('sensor.uptime')) %}\n
      \   {{ boot is number and (as_timestamp(now()) - boot) >= 120 }}"
  actions:
  - choose:
    - conditions:
      - condition: and
        conditions:
        - condition: or
          conditions:
          - condition: time
            before: '18:30:00'
            after: '17:00:00'
            weekday:
            - thu
            - wed
            - tue
            - mon
          - condition: time
            before: '16:00:00'
            after: '13:00:00'
            weekday:
            - fri
        - condition: not
          conditions:
          - condition: state
            entity_id: person.stephan
            state:
            - home
        - condition: trigger
          id:
          - Arbeit
      sequence:
      - action: icloud3.action
        metadata: {}
        data:
          command: Restart iCloud3
          device_name: 3675fe049f5a257fe6eebb6533252e74
      - delay:
          hours: 0
          minutes: 0
          seconds: 30
          milliseconds: 0
      - action: notify.duncan
        metadata: {}
        data:
          title: Papa kommt heim
          message: Er ist in {{ states('sensor.stephans_iphone_travel_time', with_unit=true)
            }} daheim
          data:
            tag: home_arrival_papa
            url: /lovelace/maps
            clickAction: /lovelace/maps
      alias: Leave Arbeit
    - conditions:
      - condition: trigger
        id:
        - Enter
      sequence:
      - action: notify.duncan
        metadata: {}
        data:
          title: Papa kommt heim
          message: Er ist in {{ states('sensor.stephans_iphone_travel_time', with_unit=true)
            }} daheim
          data:
            tag: home_arrival_papa
            url: /lovelace/maps
            clickAction: /lovelace/maps
    - conditions:
      - condition: trigger
        id:
        - Home
      sequence:
      - action: notify.duncan
        metadata: {}
        data:
          message: clear_notification
          data:
            tag: home_arrival_papa
  mode: single
- id: '1737030430090'
  alias: Calculate PV Savings
  description: "## \U0001F31E Calculate PV Savings Automation\n\n### \U0001F4CB **Purpose**\n\nThis
    automation calculates daily photovoltaic (PV) savings and costs by subtracting
    various energy cost components from a total PV cost. It logs the daily summary
    to a file and uploads it to OneDrive.\n\n---\n\n### ⏰ **Triggers**\n\n| Trigger
    | Description | Trigger ID |\n|---------|------------|------------|\n| Time |
    At `23:59:58` (end of day) | Dayend |\n\n> Note: The main calculations occur at
    day end, but sunrise and sunset triggers can be used for additional logging or
    future extensions.\n\n---\n\n### ✅ **Conditions**\n\n- No explicit conditions;
    all actions run based on triggers.\n\n---\n\n### \U0001F3AF **Actions / Workflow**\n\n1.
    **Dayend Trigger**  \n   - Stores the current total PV cost in `input_number.before_gesamt_pv_kosten`.
    \ \n   - Sequentially subtracts the following daily cost sensors from `input_number.gesamte_pv_kosten`:
    \ \n     - `sensor.inverter_total_battery_discharge_daily_energy_cost`  \n     -
    `sensor.daily_money_generated_solar`  \n     - `sensor.bkw_outlet_1_total_daily_energy_cost`
    \ \n     - `sensor.solar_to_home_daily_energy_cost`  \n     - `sensor.battery_charge_from_solar_daily_energy_cost`
    \ \n   - Logs a daily summary to `notify.file` including timestamp and all cost
    components.  \n   - Updates `input_number.after_gesamt_pv_kosten` with the final
    total PV cost after deductions.  \n   - Uploads the CSV file `/media/Gesamt_Kosten.csv`
    to OneDrive using the configured account.\n\n---\n\n### \U0001F527 **Technical
    Specs**\n\n- **Mode:** `single`  \n- **Input Numbers Controlled:**  \n  - `input_number.gesamte_pv_kosten`
    \ \n  - `input_number.before_gesamt_pv_kosten`  \n  - `input_number.after_gesamt_pv_kosten`
    \ \n- **Sensors Monitored for Calculation:**  \n  - `sensor.inverter_total_battery_discharge_daily_energy_cost`
    \ \n  - `sensor.daily_money_generated_solar`  \n  - `sensor.bkw_outlet_1_total_daily_energy_cost`
    \ \n  - `sensor.solar_to_home_daily_energy_cost`  \n  - `sensor.battery_charge_from_solar_daily_energy_cost`
    \ \n  - `sensor.gesamt_kosten_pv`  \n- **Notification Target:** `notify.file`
    \ \n- **OneDrive Upload:** Uses `onedrive.upload` service to store CSV summary
    daily.\n\n---\n\n### ⚡ **Notes / Best Practices**\n\n- Delays between calculations
    prevent race conditions when updating `input_number` entities.  \n- CSV logging
    ensures a historical record is kept for analysis and reporting.  \n- Easily extendable
    by adding new sensors or cost components to subtract.  \n- Offsets for sunrise/sunset
    can be adjusted for custom reporting schedules.\n"
  triggers:
  - trigger: time
    at: '23:59:58'
    id: Dayend
  conditions: []
  actions:
  - alias: DAYEND
    if:
    - condition: trigger
      id:
      - Dayend
    then:
    - sequence:
      - action: input_number.set_value
        metadata: {}
        data:
          value: '{{ (states(''input_number.gesamte_pv_kosten'') | float(0)) }}'
        target:
          entity_id: input_number.before_gesamt_pv_kosten
      - delay:
          hours: 0
          minutes: 0
          seconds: 0.1
      - action: input_number.set_value
        metadata: {}
        data:
          value: '{{ (states(''input_number.gesamte_pv_kosten'') | float(0)) - (states(''sensor.inverter_total_battery_discharge_daily_energy_cost'')
            | float(0)) }}'
        target:
          entity_id: input_number.gesamte_pv_kosten
      - delay:
          hours: 0
          minutes: 0
          seconds: 0.1
      - action: input_number.set_value
        metadata: {}
        data:
          value: '{{ (states(''input_number.gesamte_pv_kosten'') | float(0)) - (states(''sensor.daily_money_generated_solar'')
            | float(0)) }}'
        target:
          entity_id: input_number.gesamte_pv_kosten
      - delay:
          hours: 0
          minutes: 0
          seconds: 0.1
      - action: input_number.set_value
        metadata: {}
        data:
          value: '{{ (states(''input_number.gesamte_pv_kosten'') | float(0)) - (states(''sensor.bkw_outlet_1_total_daily_energy_cost'')
            | float(0)) }}'
        target:
          entity_id: input_number.gesamte_pv_kosten
      - delay:
          hours: 0
          minutes: 0
          seconds: 0.1
      - action: input_number.set_value
        metadata: {}
        data:
          value: '{{ (states(''input_number.gesamte_pv_kosten'') | float(0)) - (states(''sensor.solar_to_home_daily_energy_cost'')
            | float(0)) }}'
        target:
          entity_id: input_number.gesamte_pv_kosten
      - delay:
          hours: 0
          minutes: 0
          seconds: 0.1
      - action: input_number.set_value
        metadata: {}
        data:
          value: '{{ (states(''input_number.gesamte_pv_kosten'') | float(0)) - (states(''sensor.battery_charge_from_solar_daily_energy_cost'')
            | float(0)) }}'
        target:
          entity_id: input_number.gesamte_pv_kosten
      - delay:
          hours: 0
          minutes: 0
          seconds: 0.1
      - target:
          entity_id: notify.file
        data:
          message: '{{ as_timestamp(now()) | timestamp_custom(''%d.%m.%Y %H:%M'')
            }}; {{ states(''sensor.solar_to_home_daily_energy_cost'')|round(4)|string
            + " EUR"}}; {{states(''sensor.inverter_total_battery_discharge_daily_energy_cost'')|round(4)|string
            + " EUR"}}; {{ states(''sensor.daily_money_generated_solar'')|round(4)|string
            + " EUR"}}; {{ states(''sensor.bkw_outlet_1_total_daily_energy_cost'')|round(4)|string
            + " EUR"}}; {{states(''sensor.battery_charge_from_solar_daily_energy_cost'')|round(4)|string
            + " EUR"}}; {{ states(''sensor.gesamt_kosten_pv'') + " EUR"}}'
        action: notify.send_message
      - delay:
          hours: 0
          minutes: 0
          seconds: 0.1
      - action: input_number.set_value
        metadata: {}
        data:
          value: '{{ (states(''input_number.gesamte_pv_kosten'') | float(0)) }}'
        target:
          entity_id: input_number.after_gesamt_pv_kosten
      - delay:
          hours: 0
          minutes: 0
          seconds: 2
          milliseconds: 0
      - action: onedrive.upload
        metadata: {}
        data:
          config_entry_id: 01JTPDVP94GTDT06DCHRQGX7BC
          filename: /media/Gesamt_Kosten.csv
          destination_folder: /Media/
  mode: single
