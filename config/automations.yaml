      domain: switch
    - delay:
        hours: 0
        minutes: 0
        seconds: 30
        milliseconds: 0
    - type: turn_on
      device_id: db6576d379f8b04c0a70307678de8d18
      entity_id: 92c1b1563f51d25b908ef48e8efc9026
