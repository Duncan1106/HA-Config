- id: '1752180300729'
  alias: 'Alert: SMART Status Problem'
  description: "## \U0001F4BE SMART Drive Status Alert Automation\n\n### \U0001F4CB
    Purpose\nMonitors the health of your storage devices (HDDs and SSDs) via SMART
    status.\nSends an immediate notification if any monitored drive reports a potential\nproblem,
    allowing timely intervention before data loss occurs.\n\n---\n\n### ⏰ Triggers\n-
    State change of `binary_sensor.nvme_ssd_status` to `on`\n\n---\n\n### ✅ Conditions\n-
    None. Alerts are sent unconditionally upon trigger.\n\n---\n\n### \U0001F3AF Actions
    / Workflow\n- Sends a high-priority notification via `notify.duncan`\n- Notification
    includes:\n  - Drive friendly name from the triggered entity\n  - Clear warning
    about potential data loss\n  - Suggestion to back up data and check the drive
    immediately\n- Notification metadata includes `tag: hdd_alert`, `priority: high`,
    and `ttl: 0`\n\n---\n\n### \U0001F527 Technical Specs\n- Mode: `single` to prevent
    overlapping alerts\n- Works for multiple drives with identical logic"
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.homeassistant_fanxiang_s_m_a_r_t
    - binary_sensor.ugreen_nas_linux_s_m_a_r_t
    - binary_sensor.ugreen_nas_mmc32g_s_m_a_r_t
    - binary_sensor.ugreen_nas_st3000dm007_1wy10g_s_m_a_r_t_2
    - binary_sensor.ugreen_nas_st6000vn006_2zm186_s_m_a_r_t
    - binary_sensor.ugreen_nas_st6000vn006_2zm186_s_m_a_r_t_2
    - binary_sensor.server_ugreen_nas_st8000nt001_3lz101_s_m_a_r_t
    to:
    - 'on'
  conditions: []
  actions:
  - action: notify.duncan
    data:
      title: 'CRITICAL: SMART Status Problem!'
      message: The SMART status of {{ state_attr(trigger.entity_id, 'friendly_name')
        }} in {{ device_name(trigger.entity_id) }} is reporting a problem. Data loss
        may occur soon. Consider backing up data and checking the drive immediately!
      data:
        tag: hdd_alert_{{ trigger.entity_id }}
        priority: high
        ttl: 0
  mode: single
