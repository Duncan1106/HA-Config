- id: '1712941263468'
  alias: Save Pool Pulse Time
  description: "## \U0001F4BE Save Pool Pulse Time\n\n### \U0001F4CB Purpose\nSaves
    the current pulse time of the pool pump while it is running and updates\nHome
    Assistant with the latest value. Ensures accurate tracking of the\nremaining runtime
    and publishes an MQTT message for integration with Tasmota\ndevices.\n\n---\n\n###
    ⏰ Triggers\n| Trigger Type | Details                                     |\n|--------------|--------------------------------------------|\n|
    MQTT Message | Topic: `stat/tasmota_837238/RESULT`       |\n\n---\n\n### ✅ Conditions\n-
    Only process if `PulseTime1` exists in the MQTT payload.\n- Pool pump must have
    been running for at least 5 minutes.\n\n---\n\n### \U0001F3AF Actions / Workflow\n-
    Extracts `Remaining` value from `PulseTime1` in the MQTT payload.\n- If remaining
    time < 112, divides by 10 and rounds to nearest integer.\n- If remaining time
    ≥ 112, subtracts 100 to get actual pulse time.\n- Updates `input_number.pulseTimeActualValue`
    with the calculated value.\n\n---\n\n### \U0001F527 Technical Specs\n- **Mode:**
    `single` to process each MQTT update individually.\n- Uses template logic to handle
    different Tasmota payload formats.\n- Keeps input number synced with real-time
    pump runtime."
  triggers:
  - id: frommqtt
    topic: stat/tasmota_837238/RESULT
    trigger: mqtt
  conditions:
  - condition: template
    value_template: '{{ ''PulseTime1'' in  trigger.payload }}'
  - condition: not
    conditions:
    - condition: state
      entity_id: switch.pool_pumpe
      state: 'off'
      for:
        hours: 0
        minutes: 5
        seconds: 0
  actions:
  - target:
      entity_id: input_number.pulseTimeActualValue
    data:
      value: "{% set pulseTime = trigger.payload_json.PulseTime1.Remaining | int(0)
        %}\n{% if  pulseTime < 112 %}\n  {{ pulseTime / 10 | round(0) }}\n{% else
        %}\n  {{ ( pulseTime | int - 100 ) }}\n{% endif %}\n"
    action: input_number.set_value
  mode: single
- id: '1713031049792'
  alias: Get Pool PulseTime
  description: "  ## \U0001F30A Get Pool PulseTime\n\n  ### \U0001F4CB **Purpose**\n
    \ Periodically retrieves the current pulse time from the pool pump to ensure\n
    \ it is operational. This prevents missed updates while avoiding unnecessary\n
    \ actions when the pump is off or unavailable.\n\n  ---\n\n  ### ⏰ **Triggers**\n
    \ | Trigger Type        | Interval / Event | Notes |\n  |-------------------|-----------------|-------|\n
    \ | Periodic Timer     | Every 10 seconds | Checks pulse time regularly |\n  |
    Home Assistant Start | Event `start`    | Ensures initial value retrieval on HA
    startup |\n\n  ---\n\n  ### ✅ **Conditions**\n  - Only runs during daytime (after
    sunrise, before sunset).  \n  - Skips execution if the pool pump (`switch.pool_pumpe`)
    is OFF for more\n    than 5 minutes or currently unavailable.\n\n  ---\n\n  ###
    \U0001F3AF **Actions / Workflow**\n  - Publishes an MQTT request to retrieve the
    current pulse time:  \n    - **Topic:** `cmnd/tasmota_837238/pulsetime1`  \n\n
    \ ---\n\n  ### \U0001F527 **Technical Specs**\n  - **Mode:** `single` (prevents
    overlapping requests)  \n  - Ensures regular polling without interfering with
    pump downtime.\n\n  ---\n\n  ### ⚡ **Best Practices / Notes**\n  - Use alongside
    automations that adjust pulse time to maintain consistent\n    pump operation.
    \ \n  - Adjust interval (`/10` seconds) based on system responsiveness and\n    network
    load.  \n  - MQTT topics must match the Tasmota device configuration for proper\n
    \   communication."
  triggers:
  - seconds: /10
    trigger: time_pattern
  - event: start
    trigger: homeassistant
  conditions:
  - condition: sun
    before: sunset
    after: sunrise
  - condition: not
    conditions:
    - condition: or
      conditions:
      - condition: state
        entity_id: switch.pool_pumpe
        state: unavailable
      - condition: state
        entity_id: switch.pool_pumpe
        state: 'off'
        for:
          hours: 0
          minutes: 5
          seconds: 0
  actions:
  - metadata: {}
    data:
      topic: cmnd/tasmota_837238/pulsetime1
    action: mqtt.publish
  mode: single
- id: '1714554450926'
  alias: Terrarium Humidifier Empty Detection
  description: "## \U0001F4A7 Terrarium Humidifier Empty Detection\n\n### \U0001F4CB
    Purpose\nMonitors the power usage of the terrarium humidifier to detect when the
    water\ntank is empty. Sends notifications to alert about empty water and tracks
    the\nusage count for the humidifier.\n\n---\n\n### ⏰ Triggers\n- Terrarium humidifier
    switch (`switch.terrarium_tasmota3`) turns on\n\n---\n\n### ✅ Conditions\n- Only
    acts if the humidifier is currently switched on (`switch.terrarium_tasmota3`)\n\n---\n\n###
    \U0001F3AF Actions / Workflow\n**When Humidifier is ON:**\n- Waits up to 1 minute
    for power consumption to exceed 95 W\n- If power remains below 95 W, sends notifications:\n
    \ - Alert that water tank is empty\n  - Usage counter of the humidifier\n- Resets
    the usage counter\n\n**When Humidifier is OFF:**\n- Waits up to 1 minute for power
    consumption to exceed 20 W for at least 5 s\n- If power remains below 20 W, sends
    the same notifications and resets counter\n\n---\n\n### \U0001F527 Technical Specs\n-
    Uses `wait_for_trigger` for power thresholds\n- Notifications are sent via `notify.duncan`\n-
    Counter `counter.luftbefeuchter` tracks number of times humidifier was used\n-
    **Mode:** `single` (prevents overlapping executions)"
  triggers:
  - trigger: state
    entity_id:
    - switch.terrarium_tasmota3
    to: 'on'
    from: 'off'
  conditions:
  - condition: state
    entity_id: switch.terrarium_tasmota3
    state: 'on'
  actions:
  - alias: Heat on
    if:
    - condition: state
      entity_id: switch.terrarium
      state: 'on'
    then:
    - wait_for_trigger:
      - trigger: numeric_state
        entity_id:
        - sensor.terrarium_energy_power
        above: 95
      continue_on_timeout: true
      timeout:
        hours: 0
        minutes: 1
        seconds: 0
        milliseconds: 0
    - if:
      - condition: numeric_state
        entity_id: sensor.terrarium_energy_power
        below: 95
      - condition: state
        entity_id: switch.terrarium
        state: 'on'
      - condition: state
        entity_id: switch.terrarium_tasmota3
        state: 'on'
      then:
      - metadata: {}
        data:
          message: 'Wassertank auffüllen '
          title: Luftbefeuchter leer
        action: notify.duncan
      - metadata: {}
        data:
          message: ' Der Luftbefeuchter war {{ states(''counter.luftbefeuchter'')}}
            Mal an'
          title: Luftbefeuchter Counter
        action: notify.duncan
      - metadata: {}
        data: {}
        target:
          entity_id: counter.luftbefeuchter
        action: counter.reset
  - alias: Heat off
    if:
    - condition: state
      entity_id: switch.terrarium
      state: 'off'
    then:
    - wait_for_trigger:
      - trigger: numeric_state
        entity_id:
        - sensor.terrarium_energy_power
        above: 20
        for:
          hours: 0
          minutes: 0
          seconds: 5
      continue_on_timeout: true
      timeout:
        hours: 0
        minutes: 1
        seconds: 0
        milliseconds: 0
    - if:
      - condition: numeric_state
        entity_id: sensor.terrarium_energy_power
        below: 20
      then:
      - metadata: {}
        data:
          message: 'Wassertank auffüllen '
          title: Luftbefeuchter leer
        action: notify.duncan
      - metadata: {}
        data:
          message: ' Der Luftbefeuchter war {{ states(''counter.luftbefeuchter'')}}
            Mal an'
          title: Luftbefeuchter Counter
        action: notify.duncan
      - metadata: {}
        data: {}
        target:
          entity_id: counter.luftbefeuchter
        action: counter.reset
  mode: single
- id: '1714558482048'
  alias: Notify on Overcurrent Phase
  description: This automation sends a notification if an overcurrent is detected
    on any phase (L1, L2, or L3) of the smart meter. It checks if the current goes
    above a predefined limit and alerts the user with the current value and the threshold.
    Additionally, it disables charging on specific EV chargers if an overcurrent is
    detected.
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.smart_meter_mqtt_data
    attribute: current_L1
    above: input_number.fuselimit
    id: overcurrent_l1
  - trigger: numeric_state
    entity_id:
    - sensor.smart_meter_mqtt_data
    for:
      hours: 0
      minutes: 0
      seconds: 30
    attribute: current_L2
    above: input_number.fuselimit
    id: overcurrent_l2
  - trigger: numeric_state
    entity_id:
    - sensor.smart_meter_mqtt_data
    for:
      hours: 0
      minutes: 0
      seconds: 30
    attribute: current_L3
    above: input_number.fuselimit
    id: overcurrent_l3
  conditions: []
  actions:
  - alias: Message on Overcurrent
    if:
    - condition: trigger
      id:
      - overcurrent_l1
      - overcurrent_l2
      - overcurrent_l3
    then:
    - metadata: {}
      data:
        title: '!!! OVERCURRENT !!!'
        message: "⚡ Phase: {{ trigger.id.replace('overcurrent_l', 'L') }}   Aktueller
          Strom: {{\n  (trigger.to_state.attributes['current_' ~ trigger.id.replace('overcurrent_',
          '').upper()] | float(0) / 1000) | round(2)\n}} A (Grenzwert: {{ ((states('input_number.fuselimit')
          | float(0)) / 1000.0) | round(2) }} A)"
      action: notify.duncan
    - metadata: {}
      data:
        option: Don't charge
      target:
        entity_id:
