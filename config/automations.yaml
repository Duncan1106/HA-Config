- id: '1748645782485'
  alias: Request Tasmota Rule States on HA Startup
  description: "## \U0001F4E1 Request Tasmota Rule States on HA Startup  \n\n### \U0001F4CB
    **Synchronize Tasmota Rules**  \nEnsures Home Assistant has the latest state of
    Tasmota rules on startup and periodically every 12 hours.  \nThis helps avoid
    mismatches between the device state and HA’s internal representation.  \n\n---\n\n###
    ⏰ **Triggers**  \n\n| Trigger | Event / Schedule |\n|---------|-----------------|\n|
    HA Startup | `homeassistant.start` |\n| Periodic Refresh | Every 12 hours (`time_pattern:
    hours=/12`) |\n| Kaffemaschine Solis | Changes from Unavailable |\n\n---\n\n###
    ✅ **Conditions**  \n- None — the automation always runs on the triggers above.
    \ \n\n---\n\n### \U0001F3AF **MQTT Publish Mapping**  \n\n| Topic | Payload |\n|-------|---------|\n|
    `cmnd/tasmota_157F88/Rule1` | `\" \"` (requests current rule state) |\n| `cmnd/tasmota_157F88/Rule2`
    | `\" \"` (requests current rule state) |\n| `cmnd/tasmota_157F88/Rule3` | `\"
    \"` (requests current rule state) |\n> **Note:** Sending an empty payload to Tasmota
    rule topics requests the current state without modifying the rule itself.  \n\n---\n\n###
    \U0001F527 **Technical Specs**  \n\n- **Mode:** `single` (prevents overlap during
    startup)  \n- **MQTT QoS:** 0 (fire-and-forget)  \n- **Devices:** Tasmota device
    `157F88` \n- **Purpose:** Ensures rule states are synchronized in HA immediately
    and refreshed every 12 hours"
  triggers:
  - trigger: homeassistant
    event: start
    id: start
  - trigger: time_pattern
    hours: /12
  - trigger: state
    entity_id:
    - sensor.kaffeemaschine_energy_power
    from:
    - unavailable
  actions:
  - if:
    - condition: trigger
      id:
      - start
    then:
    - delay:
        hours: 0
        minutes: 1
        seconds: 0
        milliseconds: 0
    alias: 'Delay when triggered by startup '
  - action: mqtt.publish
    metadata: {}
    data:
      qos: 0
      topic: cmnd/tasmota_157F88/Rule1
      payload: ' '
  - action: mqtt.publish
    metadata: {}
    data:
      qos: 0
      topic: cmnd/tasmota_157F88/Rule2
      payload: ' '
  - action: mqtt.publish
    metadata: {}
    data:
      qos: 0
      topic: cmnd/tasmota_157F88/Rule3
      payload: ' '
- id: '1749115504854'
  alias: AnkerMake M5C Resource & Lifecycle Manage
  description: "# \U0001F5A8️ **AnkerMake M5C Resource & Lifecycle Manager**\n\n---\n\n###
    \U0001F4CB Intelligent 3D Printer Control\nThis automation orchestrates the lifecycle
    of the **AnkerMake M5C** printer, ensuring that supporting software resources
    (Add-ons) are synchronized with hardware power states. It utilizes a **resource-efficient**
    operational strategy to manage system overhead while prioritizing data integrity
    through robust shutdown sequences and automated media generation.\n\n**Key Objectives:**\n*
    **Dynamic Resource Allocation:** Starts/Stops the **Ankerctl Addon** only when
    required.\n* **Autonomous Power Management:** Safely powers down the printer hardware
    after print completion or prolonged inactivity.\n* **Data Capture:** Orchestrates
    a high-frequency timelapse capture during active print jobs.\n* **System Resilience:**
    Employs a backoff-retry mechanism for critical power-off commands to ensure the
    hardware reaches the desired state.\n\n---\n\n### Trigger Overview Table\n\n|
    Type | Entity / Condition | ID | Purpose |\n| :--- | :--- | :--- | :--- |\n| **State**
    | `switch.ankermake_1` | `ON` | Detects when the printer is manually or externally
    powered on. |\n| **State** | `switch.ankermake_1` | `OFF` | Detects when the printer
    is powered off. |\n| **Time Pattern** | Every 2 hours | `2h` | Periodic maintenance
    heartbeat for the control bridge. |\n| **Numeric State** | `sensor.ankermake_m5c_progress`
    > 99.9% | `Switch Off` | Detects completion of a print job (15-minute soak). |\n|
    **Numeric State** | `sensor.ankermake_power` < 15W | `Switch Off` | Detects idle
    state/cooldown completion (30-minute soak). |\n| **Time Pattern** | Every 15 seconds
    | `Timelapse` | High-frequency snapshot trigger for progress tracking. |\n\n---\n\n####
    \U0001F680 System Initialization\n* **Purpose:** Synchronize software services
    with hardware availability.\n* **Logic Overview:** Triggered immediately when
    **switch.ankermake_1** transitions to **on**.\n* **Effect:** Executes a service
    call to start the **cff83567_ankerctl** (Ankerctl) Addon.\n\n#### \U0001F4C9 Shutdown
    & Cleanup\n* **Purpose:** Automated decommissioning of services and power.\n*
    **Logic Overview:** Triggered by hardware power-off (**OFF** ID) or detected completion/idle
    states (**Switch Off** ID). \n* **Effect:** Stops the **Ankerctl** Addon. If triggered
    by completion, it initiates `script.create_timelapse` and executes a managed shutdown
    of **switch.ankermake_1**.\n\n#### \U0001F4F8 Media Acquisition (Timelapse)\n*
    **Purpose:** Generate a visual record of the printing process.\n* **Logic Overview:**
    Runs every 15 seconds, but only if **binary_sensor.ankerctl_lauft** is **on**
    and **sensor.ankermake_power** is above **15W**.\n* **Effect:** Takes a snapshot
    from **camera.ankermake_m5c_camera_mainstream** and saves it to media storage
    with a timestamped filename based on the current job name.\n\n#### \U0001F6E0️
    Maintenance & Stability\n* **Purpose:** Prevent stale connections between Home
    Assistant and the printer.\n* **Logic Overview:** Every 2 hours, provided the
    control addon is active.\n* **Effect:** Presses **button.ankermake_m5c_reload_ankerctl**
    to refresh the integration bridge.\n\n---\n\n### Technical Overview\n* **Automation
    Mode:** `queued` (Max: 10) - Ensures sequential execution of snapshots and power
    commands without overlap interference.\n* **Execution Method:** Utilizes `script.retry_action_with_backoff`
    for power-off reliability.\n* **Key Inputs:** Power consumption (Watts), Print
    Progress (%), and Addon Status.\n* **Controlled Entities:** `switch.ankermake_1`,
    `button.ankermake_m5c_reload_ankerctl`, `camera.ankermake_m5c_camera_mainstream`.\n*
    **Safety Mechanisms:** Employs a 10-retry backoff strategy with notifications
    to **notify.duncan** if the printer fails to power off.\n\n---\n\n### \U0001F4A1
    Notes\n* **Idle Detection:** The 30-minute delay on the **15W** power trigger
    ensures the hotend has sufficient time to cool down before the main power is cut,
    protecting the hardware.\n* **Conditional Snapshots:** The timelapse logic includes
    a power-draw check (**> 15W**) to prevent filling storage with identical images
    of an idle or failed printer.\n* **Reliability:** The use of a backoff script
    for the final power-down addresses potential Zigbee/Wi-Fi mesh instability during
    high-traffic periods.\n"
  triggers:
  - trigger: state
    entity_id:
    - switch.ankermake_1
    to: 'on'
    id: 'ON'
  - trigger: state
    entity_id:
    - switch.ankermake_1
    to: 'off'
    id: 'OFF'
  - trigger: time_pattern
    hours: /2
    id: 2h
  - entity_id:
    - sensor.ankermake_m5c_progress
    for:
      hours: 0
      minutes: 15
      seconds: 0
    above: 99.9
    trigger: numeric_state
    id: Switch Off
  - trigger: numeric_state
    entity_id:
    - sensor.ankermake_power
    for:
      hours: 0
      minutes: 30
      seconds: 0
    below: 15
    id: Switch Off
  - trigger: state
    entity_id:
    - binary_sensor.ankermake_snapshot_pulse
    to:
    - 'on'
    id: Timelapse
  - trigger: state
    entity_id:
    - sensor.job_name_2
    id: Instant Timelapse
  conditions:
  - condition: or
    conditions:
    - condition: trigger
      id:
      - 'ON'
      - 'OFF'
      - Switch Off
      - Instant Timelapse
      - Timelapse
    - condition: and
      conditions:
      - condition: trigger
        id:
        - 2h
      - condition: state
        entity_id: binary_sensor.ankerctl_lauft
        state: 'on'
      alias: Ankerctl reload
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - 'ON'
      sequence:
      - action: hassio.addon_start
        metadata: {}
        data:
          addon: cff83567_ankerctl
      - action: homeassistant.enable_config_entry
        metadata: {}
        data:
          config_entry_id: 01K16ZV8ZK8F30YK3AJFNQ1Z7K
      - delay:
          hours: 0
          minutes: 0
          seconds: 3
          milliseconds: 0
      - action: homeassistant.reload_config_entry
        metadata: {}
        target:
          device_id: 7a2e848cbb1668e8091c9a5fdbb4c36d
        data: {}
      alias: Start Ankerctl Addon When Printer Turned On
    - conditions:
      - condition: trigger
        id:
        - 'OFF'
      sequence:
      - action: hassio.addon_stop
        metadata: {}
        data:
          addon: cff83567_ankerctl
      alias: Stop Ankerctl Addon When Printer Turned Off
    - conditions:
      - condition: trigger
        id:
        - 2h
      - condition: state
        entity_id: binary_sensor.ankerctl_lauft
        state: 'on'
      sequence:
      - metadata: {}
        data: {}
        target:
          entity_id: button.ankermake_m5c_reload_ankerctl
        action: button.press
        enabled: true
      alias: 'Reload ankerctl if running '
    - conditions:
      - condition: trigger
        id:
        - Switch Off
      - condition: state
        entity_id: switch.ankermake_1
        state:
        - 'on'
      sequence:
      - action: homeassistant.disable_config_entry
        metadata: {}
        data:
          config_entry_id: 01K16ZV8ZK8F30YK3AJFNQ1Z7K
      - action: script.retry_action_with_backoff
        metadata: {}
        data:
          action_domain: switch
          action_type: turn_off
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: simple
          notify_on_failure: true
          notify_service: notify.duncan
          entity_id: switch.ankermake_1
          target_state: 'off'
      - action: script.create_timelapse
        metadata: {}
        data: {}
      alias: Turn AnkerMake Plug OFF if print finished
    - conditions:
      - condition: trigger
        id:
        - Timelapse
      sequence:
      - metadata: {}
        data:
          filename: "/media/m5ccam/pictures/{{\n  states('sensor.job_name_2')\n  |
            default('unknown_job', true)\n  | regex_replace('[^A-Za-z0-9._-]+', '_')\n}}_{{
            now().strftime(\"%Y%m%d-%H%M%S\") }}.jpg"
        target:
          entity_id:
          - camera.ankermake_m5c_camera_mainstream
        action: camera.snapshot
        enabled: true
    - conditions:
      - condition: not
        conditions:
        - condition: state
          entity_id: sensor.job_name_2
          state:
          - —
      - condition: trigger
        id:
        - Instant Timelapse
      sequence:
      - action: script.create_timelapse
        metadata: {}
        data: {}
      alias: Instant Time lapse new print
  mode: queued
  max: 15
- id: '1749768402037'
  alias: Gang Light Brightness Control
  description: "## \U0001F6B6‍♂️ Gang Light Brightness Control  \n\n### \U0001F4CB
    **Adaptive Stairway Illumination**  \nAutomatically synchronizes the stairway
    light with the brightness sensor value. When brightness is above zero, the light
    adjusts accordingly. If brightness drops to zero, the light switches off — ensuring
    optimal stairway lighting at all times.  \n\n---\n\n### \U0001F506 **Turn ON Trigger**
    \ \n| Condition | Threshold | Note |\n|-----------|-----------|------|\n| **Brightness
    Change** | `sensor.light_brighness` > **0** | Any increase or decrease above zero
    triggers adjustment |\n\n---\n\n### \U0001F319 **Turn OFF Trigger**  \n| Condition
    | Threshold | Note |\n|-----------|-----------|------|\n| **Brightness Sync**
    | `sensor.light_brighness` < **1** | Turns off light if brightness goes to zero
    |\n\n---\n\n### \U0001F3AF **Smart Logic**  \n\n#### **\U0001F506 ON Action**
    \ \n- Checks if light is **OFF** or brightness is **different** from sensor value
    \ \n- If true → `light.turn_on` with brightness percentage = sensor value  \n\n####
    **\U0001F319 OFF Action**  \n- If brightness sensor changes to **0** from a previous
    nonzero value  \n- Then → `light.turn_off`  \n\n---\n\n### \U0001F527 **Technical
    Specs**  \n- **Target:** `light.esp32_c3_mini_treppenhaus_licht`  \n- **Sensor:**
    `sensor.light_brighness`  \n- **Mode:** `single` (one run at a time)  \n- **Conversion:**
    Sensor value (%) × 2.55 → HA light brightness scale"
  triggers:
  - trigger: state
    entity_id:
    - sensor.light_brighness
    id: Change
  - trigger: numeric_state
    entity_id:
    - sensor.light_brighness
    below: 1
    id: Zero
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Change
      - condition: numeric_state
        entity_id: sensor.light_brighness
        above: 0
      sequence:
      - if:
        - condition: or
          conditions:
          - condition: state
            entity_id: light.esp32_c3_mini_treppenhaus_licht
            state: 'off'
          - condition: template
            value_template: '{% set sensor_brightness = (states(''sensor.light_brighness'')
              | float(0) * 2.55) | int(0) %}

              {% set current = state_attr(''light.esp32_c3_mini_treppenhaus_licht'',
              ''brightness'') | int(0) %}

              {{ sensor_brightness != current }}'
        then:
        - action: light.turn_on
          metadata: {}
          data:
            brightness_pct: '{{ states(''sensor.light_brighness'') | int(0) }}'
          target:
            entity_id: light.esp32_c3_mini_treppenhaus_licht
      alias: On with specified Brighness
    - conditions:
      - condition: trigger
        id:
        - Zero
      - condition: template
        value_template: '{{ trigger.from_state.state | int(1) > 0 }}'
      sequence:
      - action: light.turn_off
        metadata: {}
        data: {}
        target:
          entity_id: light.esp32_c3_mini_treppenhaus_licht
      alias: Off if Brightness changes to Zero
  mode: single
- id: '1749938010439'
  alias: Reset Deye Battery Capacity closer to real
  description: "## \U0001F50B Reset Deye Battery Capacity  \n\n### \U0001F4CB **Keeping
    SOC Estimation in Check**  \nThe Deye inverter tends to overshoot its calculated
    battery capacity. This automation corrects the capacity estimate by making small
    adjustments around the true SOC reported by the BMS, keeping values closer to
    reality.  \n\n---\n\n### ⏰ **Triggers**  \n| Condition | Entity/Event | Threshold
    |\n|-----------|--------------|-----------|\n| **Daily Reset** | `sunset` | Exact
    time |\n| **Midnight Reset** | `00:00:00` | Exact time |\n| **SOC Full** | `sensor.felicity_ess_soc_avg`
    | Above **99.9%** |\n\n---\n\n### ✅ **Conditions**  \n- `sensor.inverter_battery_corrected_capacity`
    > `number.inverter_battery_capacity`  \n- `sensor.felicity_ess_soc_avg` > **99%**
    \ \n\n---\n\n### \U0001F3AF **Correction Logic**  \n\n#### **Step 1**  \n- Increase
    inverter’s capacity value by **+1**  \n\n#### **Step 2**  \n- Wait **30s**  \n\n####
    **Step 3**  \n- Decrease inverter’s capacity value by **-1**  \n\n---\n\n### \U0001F527
    **Technical Specs**  \n- **Target Number Entity:** `number.inverter_battery_capacity`
    \ \n- **Sensors Used:**  \n  - `sensor.inverter_battery_corrected_capacity`  \n
    \ - `sensor.felicity_ess_soc_avg`  \n- **Mode:** `single` (no overlap)  \n- **Adjustment
    Logic:** ±1 step correction with short delay"
  triggers:
  - trigger: sun
    event: sunset
    offset: +00:01:00
  - trigger: time
    at: 00:00:00
  - trigger: numeric_state
    entity_id:
    - sensor.felicity_ess_soc_avg
    above: 99.9
  conditions:
  - condition: numeric_state
    entity_id: sensor.inverter_battery_corrected_capacity
    above: number.inverter_battery_capacity
  - condition: numeric_state
    entity_id: sensor.felicity_ess_soc_avg
    above: 99
  actions:
  - action: number.set_value
    metadata: {}
    data:
      value: '


        {{ states(''number.inverter_battery_capacity'')|int(500) + 1 }}'
    target:
      entity_id: number.inverter_battery_capacity
  - delay:
      hours: 0
      minutes: 0
      seconds: 30
      milliseconds: 0
  - action: number.set_value
    metadata: {}
    data:
      value: '


        {{ states(''number.inverter_battery_capacity'')|int(500) - 1 }}'
    target:
      entity_id: number.inverter_battery_capacity
  mode: single
  max_exceeded: silent
- id: '1750196437853'
  alias: Octopus night usage, turn battery off
  description: "\n  ## ⚡ Octopus Night Usage Automation\n\n  ### \U0001F4CB **EV &
    Battery Management for Octopus Tariffs**\n\n  This automation intelligently manages
    **battery charging and discharging**, as well as **EV charging behavior**, during
    **Octopus night tariff periods**. It supports both **Dumb** (time-based) and **Intelligent**
    (Octopus-controlled) modes to ensure the most efficient and conflict-free use
    of power.  \n  It also prevents battery discharge if EVs are drawing more than
    the grid can supply and handles multiple EVs dynamically.\n\n  ---\n\n  ### ⏱
    **Trigger Overview**\n\n  | Trigger | Description | ID |\n  |----------|--------------|----|\n
    \ | `00:01` | Begin night cycle (turn battery off, start EV charging) | On_time
    |\n  | `04:59` | End night cycle (stop EV charging, restore battery) | Off_time
    |\n  | `binary_sensor.octopus_a_10a76963_cupra_tavascan_intelligent_dispatching`
    → `on` | Intelligent dispatch begins | On_dispatch |\n  | `binary_sensor.octopus_a_10a76963_cupra_tavascan_intelligent_dispatching`
    → `off` | Intelligent dispatch ends | Off_dispatch |\n  | `sensor.renault_zoe_batterie
    > 98.1% for 15 min` | Zoe battery full | car_full_zoe |\n  | `sensor.cupra_tavascan_battery_level
    > 99% for 1 min` | Tavascan battery full | car_full_tavascan |\n  | `sensor.lsjwh4097rn105299_soc
    > 99.9% for 3 min` | MG4 battery full | car_full_mg4 |\n  | Template trigger |
    Prevents battery discharge if EVs draw > grid power | prevent_battery_discharge
    |\n\n  ---\n\n  ### ✅ **Mode Logic**\n\n  - **Dumb Mode:** Follows a fixed time-based
    routine for battery and EV control between 00:00 – 05:00.  \n  - **Intelligent
    Mode:** Reacts dynamically to Octopus dispatch signals for charging and discharging
    windows.  \n  - **Safety Logic:** Prevents battery from turning on if EVs are
    drawing significant power, with retry intervals at 1, 3, and 5 minutes.\n\n  ---\n\n
    \ ### ⚙️ **Action Workflow**\n\n  #### Dumb Mode (Scheduled Control)\n\n  - **Start
    of Night (00:01):**\n    - Turns off the home battery using retry logic for reliability.\n
    \   - Starts EV charging if cars are connected to either Go-eCharger (11 kW or
    22 kW).\n    - Waits for power draw to confirm successful start.\n    - If EV
    fails to charge, restores the battery and stops charging to prevent energy waste.\n\n
    \ - **End of Night or EV Fully Charged (04:59 / EV Full):**\n    - Restores mode
    to *Intelligent*.\n    - Stops EV charging, waiting until power draw drops below
    5 W.\n    - Turns the battery back on once safe to do so.\n    - If still unsafe,
    sends a notification and retries at 1, 3, and 5 minute intervals before giving
    up.\n\n  #### Intelligent Mode (Octopus Dispatch Control)\n\n  - **Dispatch On:**
    Turns off the battery and starts EV charging as directed by Octopus.\n  - **Dispatch
    Off:** Stops EV charging, waits for safe discharge levels, then turns battery
    back on.\n  - Notifications sent if EV load prevents battery activation.\n  -
    Preventive template ensures battery never discharges while EVs draw more power
    than the grid can provide.\n\n  ---\n\n  ### \U0001F527 **Technical Details**\n\n
    \ - **Mode:** `single`\n  - **Battery Switch:** `switch.esp32_s3_zero_deye8k_time_of_use`\n
    \ - **EV Chargers:**  \n    - `select.go_echarger_270862_frc` (11 kW)  \n    -
    `select.go_echarger_252682_frc` (22 kW)\n  - **Monitored Sensors:**  \n    - Octopus
    dispatch  \n    - Charger power sensors  \n    - EV battery SOC sensors  \n  -
    **Retry System:** Up to 10 attempts for state confirmations (battery or charger)\n
    \ - **Notifications:** Sent via `notify.duncan` when automation cannot safely
    restore battery\n\n  ---\n\n  ### ⚡ **Design Notes**\n\n  - Dumb mode ensures
    maximum use of cheap tariff power overnight.\n  - Intelligent mode yields control
    to Octopus dispatch for adaptive savings.\n  - Safety logic prevents battery from
    re-engaging while EVs draw significant power.\n  - Multiple retry layers ensure
    reliability and reduce manual intervention.\n  - Notifications provide transparency
    when automation requires attention."
  triggers:
  - trigger: time
    at: 00:01:00
    enabled: true
    id: On_time
  - trigger: state
    entity_id:
    - input_select.octopus_night_time
    from:
    - Intelligent
    to:
    - Dumb
    id: On_time_change
  - trigger: time
    at: 04:59:00
    id: Off_time
    enabled: true
  - trigger: state
    entity_id:
    - binary_sensor.octopus_a_10a76963_cupra_tavascan_intelligent_dispatching
    to: 'on'
    id: On_dispatch
  - trigger: state
    entity_id:
    - binary_sensor.octopus_a_10a76963_cupra_tavascan_intelligent_dispatching
    to: 'off'
    id: Off_dispatch
  - trigger: numeric_state
    entity_id:
    - sensor.renault_zoe_batterie
    id: car_full_zoe
    for:
      hours: 0
      minutes: 15
      seconds: 0
    above: 98.1
  - trigger: numeric_state
    entity_id:
    - sensor.cupra_tavascan_battery_level
    id: car_full_tavascan
    for:
      hours: 0
      minutes: 1
      seconds: 0
    above: 99
    enabled: false
  - trigger: numeric_state
    entity_id:
    - sensor.lsjwh4097rn105299_soc
    for:
      hours: 0
      minutes: 3
      seconds: 0
    above: 99.9
    id: car_full_mg4
  - trigger: template
    value_template: "    {% set car_22kw = is_state('binary_sensor.go_echarger_252682_car','on')
      %}\n    {% set car_11kw = is_state('binary_sensor.go_echarger_270862_car','on')
      %}\n    {% set power_goes = (((states('sensor.go_echarger_252682_nrg_12')|float(0))
      if car_22kw else 0) + ((states('sensor.go_echarger_270862_nrg_12')|float(0))
      if car_11kw else 0)) %}\n    {% set grid = states('sensor.grid_import') | float(0)
      %}\n    {% set octopus = is_state('binary_sensor.octopus_a_10a76963_cupra_tavascan_intelligent_dispatching','on')
      or is_state('input_select.octopus_night_time','Dumb') %}\n    {% set battery_discharging
      = states('sensor.battery_discharge')| float(0) > 50 %}\n    {% set night_time
      = now().hour < 5 or now().hour >= 22 %}\n    {{ (car_22kw or car_11kw) and octopus
      and power_goes > 50 and grid < power_goes and battery_discharging and night_time
      }}"
    for:
      hours: 0
      minutes: 0
      seconds: 30
    id: prevent_battery_discharge
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id:
          - On_time
        - condition: and
          conditions:
          - condition: time
            after: 00:00:00
            before: 04:30:00
          - condition: trigger
            id:
            - On_time_change
      - condition: state
        entity_id: input_select.octopus_night_time
        state: Dumb
      - condition: time
        after: 00:00:00
        before: 05:00:00
      sequence:
      - action: script.retry_action_with_backoff
        metadata: {}
        data:
          action_domain: switch
          action_type: turn_off
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: simple
          notify_on_failure: true
          notify_service: notify.duncan
          entity_id: switch.esp32_s3_zero_deye8k_time_of_use
          target_state: 'off'
        alias: 'Turn Battery Off via retry Script '
      - alias: Allow Charging for 11kW Go-eCharger if any Car is connected
        if:
        - condition: not
          conditions:
          - condition: state
            entity_id: sensor.go_e_11kw_car
            state: No card selected
        then:
        - action: script.retry_action_with_backoff
          metadata: {}
          data:
            max_retries: 10
            base_delay: 5
            max_delay: 60
            backoff_type: simple
            notify_on_failure: true
            notify_service: notify.duncan
            entity_id: select.go_echarger_270862_frc
            target_state: custom
            custom_action:
            - action: select.select_option
              metadata: {}
              data:
                option: Charge
              target:
                entity_id: select.go_echarger_270862_frc
            custom_target_state: Charge
      - alias: Allow Charging for 22kW Go-eCharger if any Car is connected
        if:
        - condition: not
          conditions:
          - condition: state
            entity_id: sensor.go_e_22kw_car
            state: No card selected
        then:
        - action: script.retry_action_with_backoff
          metadata: {}
          data:
            max_retries: 10
            base_delay: 5
            max_delay: 60
            backoff_type: simple
            notify_on_failure: true
            notify_service: notify.duncan
            entity_id: select.go_echarger_252682_frc
            target_state: custom
            custom_action:
            - action: select.select_option
              metadata: {}
              data:
                option: Charge
              target:
                entity_id:
                - select.go_echarger_252682_frc
            custom_target_state: Charge
      - alias: Car Update MG4
        choose:
        - conditions:
          - condition: or
            conditions:
            - condition: state
              entity_id: sensor.go_e_11kw_car
              state:
              - MG4
            - condition: state
              entity_id: sensor.go_e_22kw_car
              state:
              - MG4
          sequence:
          - action: switch.turn_on
            metadata: {}
            target:
              entity_id: switch.lsjwh4097rn105299_charging
            data: {}
          alias: 'Start Charging MG4 and force the update '
        continue_on_error: true
      - alias: Car Update Zoe
        choose:
        - conditions:
          - condition: or
            conditions:
            - condition: state
              entity_id: sensor.go_e_11kw_car
              state:
              - Zoe
            - condition: state
              entity_id: sensor.go_e_22kw_car
              state:
              - Zoe
          sequence:
          - action: button.press
            metadata: {}
            target:
              entity_id: button.renault_zoe_ladevorgang_starten
            data: {}
          alias: 'Start Charging Zoe and force the update '
        continue_on_error: true
      - alias: Car Update Tavascan
        choose:
        - conditions:
          - condition: or
            conditions:
            - condition: state
              entity_id: sensor.go_e_11kw_car
              state:
              - Tavascan
            - condition: state
              entity_id: sensor.go_e_22kw_car
              state:
              - Tavascan
          sequence:
          - action: switch.turn_on
            metadata: {}
            target:
              entity_id: switch.cupra_tavascan_charging
            data: {}
          alias: 'Start Charging Tavascan and force the update '
        continue_on_error: true
      - alias: Only wait for Power to Rise if not already risen
        if:
        - condition: and
          conditions:
          - condition: numeric_state
            entity_id: sensor.go_echarger_270862_nrg_12
            below: 50
          - condition: numeric_state
            entity_id: sensor.go_echarger_252682_nrg_12
            below: 50
        then:
        - alias: Wait up to 5 mins for power to rise above 50W, indicating a successful
            Charging Start
          wait_for_trigger:
          - trigger: numeric_state
            entity_id:
            - sensor.go_echarger_270862_nrg_12
            - sensor.go_echarger_252682_nrg_12
            above: 50
          timeout:
            hours: 0
            minutes: 5
            seconds: 0
            milliseconds: 0
          continue_on_timeout: true
        - alias: Fallback if not charging then re-enable Battery
          if:
          - condition: template
            value_template: '{{ not wait.completed }}'
          then:
          - alias: If Car is connected to 22kW Charger then stop charging
            if:
            - condition: state
              entity_id: binary_sensor.go_echarger_252682_car
              state: 'on'
            then:
            - action: script.retry_action_with_backoff
              metadata: {}
              data:
                max_retries: 10
                base_delay: 5
                max_delay: 60
                backoff_type: simple
                notify_on_failure: true
                notify_service: notify.duncan
                entity_id: select.go_echarger_252682_frc
                target_state: custom
                custom_action:
                - action: select.select_option
                  metadata: {}
                  data:
                    option: Don't charge
                  target:
                    entity_id:
                    - select.go_echarger_252682_frc
                custom_target_state: Don't charge
          - alias: If Car is connected to 11kW Charger then stop charging
            if:
            - condition: state
              entity_id: binary_sensor.go_echarger_270862_car
              state: 'on'
            then:
            - action: script.retry_action_with_backoff
              metadata: {}
              data:
                max_retries: 10
                base_delay: 5
                max_delay: 60
                backoff_type: simple
                notify_on_failure: true
                notify_service: notify.duncan
                entity_id: select.go_echarger_270862_frc
                target_state: custom
                custom_action:
                - action: select.select_option
                  metadata: {}
                  data:
                    option: Don't charge
                  target:
                    entity_id:
                    - select.go_echarger_270862_frc
                custom_target_state: Don't charge
          - alias: Only wait for power if above threshold
            if:
            - condition: or
              conditions:
              - condition: numeric_state
                entity_id: sensor.go_echarger_270862_nrg_12
                above: 5
              - condition: numeric_state
                entity_id: sensor.go_echarger_252682_nrg_12
                above: 5
            then:
            - wait_for_trigger:
              - trigger: numeric_state
                entity_id:
                - sensor.go_echarger_270862_nrg_12
                below: 5
              - trigger: numeric_state
                entity_id:
                - sensor.go_echarger_252682_nrg_12
                below: 5
              timeout:
                hours: 0
                minutes: 1
                seconds: 0
                milliseconds: 0
              continue_on_timeout: true
          - if:
            - condition: and
              conditions:
              - condition: numeric_state
                entity_id: sensor.go_echarger_270862_nrg_12
                below: 5
              - condition: numeric_state
                entity_id: sensor.go_echarger_252682_nrg_12
                below: 5
            then:
            - action: script.retry_action_with_backoff
              metadata: {}
              data:
                action_domain: switch
                action_type: turn_on
                max_retries: 10
                base_delay: 5
                max_delay: 60
                backoff_type: simple
                notify_on_failure: true
                notify_service: notify.duncan
                entity_id: switch.esp32_s3_zero_deye8k_time_of_use
                target_state: 'on'
              alias: Turn Battery On via retry Script
            else:
            - action: notify.duncan
              data:
                title: Octopus night recovery
                message: 'Skipping battery ON: EV still >5 W (wait timed out). Will
                  retry in 1, 3, and 5 minutes.'
                data:
                  tag: octopus_night_recovery
            - alias: Retry Battery ON after timeout (1, 3, 5 min)
              repeat:
                sequence:
                - choose:
                  - conditions:
                    - condition: template
                      value_template: '{{ repeat.index == 1 }}'
                    sequence:
                    - delay: 00:01:00
                  - conditions:
                    - condition: template
                      value_template: '{{ repeat.index == 2 }}'
                    sequence:
                    - delay: 00:03:00
                  - conditions:
                    - condition: template
                      value_template: '{{ repeat.index == 3 }}'
                    sequence:
                    - delay: 00:05:00
                  alias: 1, 3 or 5 Minute Delay between retries
                - alias: Turn Battery on if no EV Power Draw, if not notify about
                    it
                  if:
                  - condition: and
                    conditions:
                    - condition: numeric_state
                      entity_id: sensor.go_echarger_270862_nrg_12
                      below: 5
                    - condition: numeric_state
                      entity_id: sensor.go_echarger_252682_nrg_12
                      below: 5
                  then:
                  - alias: 'Turn Battery On via retry Script '
                    action: script.retry_action_with_backoff
                    metadata: {}
                    data:
                      action_domain: switch
                      action_type: turn_on
                      max_retries: 10
                      base_delay: 5
                      max_delay: 60
                      backoff_type: simple
                      notify_on_failure: true
                      notify_service: notify.duncan
                      entity_id: switch.esp32_s3_zero_deye8k_time_of_use
                      target_state: 'on'
                  else:
                  - action: notify.duncan
                    data:
                      title: Octopus night recovery
                      message: 'Retry {{ repeat.index }}: EV still >5 W; trying next
                        slot (1/3/5 min).'
                      data:
                        tag: octopus_night_recovery
                until:
                - condition: or
                  conditions:
                  - condition: state
                    entity_id: switch.esp32_s3_zero_deye8k_time_of_use
                    state: 'on'
                  - condition: template
                    value_template: '{{ repeat.index >= 3 }}'
                  alias: Either battery is on or we retried 3 or more times
      alias: Start EV Charging, Octopus Dumb Mode
    - conditions:
      - alias: Triggered by off time or EV full
        condition: or
        conditions:
        - condition: trigger
          id:
          - Off_time
        - condition: or
          conditions:
          - condition: and
