- id: '1744046298527'
  alias: Enya kommt heim
  description: "\U0001F3E0 **Enya Arrival Tracking**\n\n### \U0001F4CB Intelligent
    Presence & Notification Control\n\nThis automation manages proximity-based notifications
    to provide real-time updates on Enya's arrival. It utilizes geofencing to alert
    household members of an estimated time of arrival (ETA) when she enters an outer
    perimeter, then automatically cleans up stale notifications once she successfully
    arrives at home.\n\nThe operational strategy is **notification-centric**, ensuring
    that information is delivered when relevant and removed when no longer needed
    to maintain a clean device notification tray.\n\n---\n\n### Trigger Overview Table\n\n|
    Type | Entity / Condition | ID | Purpose |\n| :--- | :--- | :--- | :--- |\n| **Zone**
    | **person.enya** entering **zone.big_home_2** | `Enter` | Trigger arrival alert
    and ETA calculation. |\n| **Zone** | **person.enya** entering **zone.home** |
    `Home` | Trigger notification dismissal upon arrival. |\n\n---\n\n### Operational
    Logic Sections\n\n#### Proximity Alert (Outer Zone)\n* **Purpose**: Notify that
    Enya is approaching and provide a travel time estimate.\n* **Logic Overview**:
    Triggered when **person.enya** enters the **Big Home 2** zone, provided the system
    has been stable for at least **120 seconds**.\n* **Effect**: Sends a notification
    to **notify.duncan** containing the current value of **sensor.enyas_iphone_travel_time**.\n\n####
    Arrival Cleanup (Home Zone)\n* **Purpose**: Remove the now-obsolete arrival notification.\n*
    **Logic Overview**: Triggered when **person.enya** enters the **Home** zone.\n*
    **Effect**: Issues a `clear_notification` command to **notify.duncan** targeting
    the specific tag `home_arrival_enya`.\n\n---\n\n### Technical Overview\n\n* **Automation
    Mode**: `queued` (Max 3)\n* **Execution Method**: Direct Action / Notification
    Service\n* **Key Inputs**: `person.enya`, `sensor.enyas_iphone_travel_time`\n*
    **Controlled Entities**: `notify.duncan`\n* **Safety Mechanisms**: A **Template
    Condition** ensures the automation does not fire during the first **120 seconds**
    of system uptime to prevent false triggers during Home Assistant restarts.\n\n---\n\n###
    \U0001F4A1 Notes\n\n* **Notification Tagging**: By using the `home_arrival_enya`
    tag, the automation can overwrite or dismiss the specific arrival message without
    affecting other notifications on the recipient's device.\n* **Uptime Guard**:
    The logic includes a safety check against `sensor.uptime` to ensure that geofence
    \"flapping\" during a reboot doesn't trigger accidental notifications.\n* **Contextual
    Links**: The notification includes a `clickAction` that directs the user straight
    to the **Maps** dashboard for visual tracking."
  triggers:
  - trigger: zone
    entity_id: person.enya
