      hours: 0
      minutes: 45
      seconds: 0
  - trigger: numeric_state
    entity_id:
    - sensor.light_brighness
    below: 40
    id: Off_below_40
  - trigger: numeric_state
    entity_id:
    - sensor.light_brighness
