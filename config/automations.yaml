- id: '1716929359492'
  alias: Terrarium Climate Control
  description: "## \U0001F321️ Terrarium Climate Control Automation\n\n### \U0001F4CB
    Purpose\nManages the terrarium environment by controlling the heat lamp and humidifier\nbased
    on time, sunlight, and sensor readings to maintain optimal daytime\nconditions.\n\n---\n\n###
    ⏰ Triggers\n- Every minute (time pattern) to check general daytime conditions\n-
    Humidifier sensor (`binary_sensor.luftbefeuchter_on_windows`) turns on\n- Sunrise
    plus 30 minutes offset\n- Sunset minus 30 minutes offset\n\n---\n\n### ✅ Conditions\n-
    Only operates during daytime (between sunrise and sunset)\n- Automation respects
    the terrarium master switch (`input_boolean.terrarium_on`)\n\n---\n\n### \U0001F3AF
    Actions / Workflow\n**Daytime Heat Lamp Control:**\n- Runs `script.warmelampe`
    every minute during daytime if terrarium is on\n\n**Humidifier Control:**\n- Runs
    `script.luftbefeuchter` when humidifier sensor triggers and terrarium is on\n\n**Sunrise
    Routine:**\n- Activates `script.terra_sunrise` 30 minutes after sunrise\n\n**Sunset
    Routine:**\n- Activates `script.terra_sunset` 30 minutes before sunset\n\n---\n\n###
    \U0001F527 Technical Specs\n- Mode: `parallel` with max 10 to allow multiple overlapping
    triggers\n- Uses `choose` blocks to separate daytime, sunrise, sunset, and sensor-based
    actions\n- Integrates both scheduled time checks and sensor events for robust
    control"
  triggers:
  - minutes: /1
    id: '1'
    trigger: time_pattern
  - trigger: state
    entity_id:
    - binary_sensor.luftbefeuchter_on_windows
    to: 'on'
    id: Luftbefeuchter
  - trigger: sun
    event: sunrise
    offset: +00:30:00
    id: sunrise
  - trigger: sun
    event: sunset
    offset: -00:30:00
    id: sunset
  conditions:
  - condition: sun
    before: sunset
    after: sunrise
  actions:
  - choose:
    - conditions:
      - condition: and
        conditions:
        - condition: sun
          after: sunrise
          before: sunset
          before_offset: -01:00:00
          after_offset: +01:00:00
        - condition: state
          entity_id: input_boolean.terrarium_on
          state: 'on'
        - condition: trigger
          id:
          - '1'
        enabled: true
      sequence:
      - data: {}
        action: script.warmelampe
      alias: Wärmelampe
    - conditions:
      - condition: trigger
        id:
        - Luftbefeuchter
      - condition: state
        entity_id: input_boolean.terrarium_on
        state: 'on'
      sequence:
      - data: {}
        action: script.luftbefeuchter
      alias: Luftbefeuchter
    - conditions:
      - condition: trigger
        id:
        - sunrise
      sequence:
      - action: script.turn_on
        metadata: {}
        data: {}
        target:
          entity_id: script.terra_sunrise
      alias: Sunrise
    - conditions:
      - condition: trigger
        id:
        - sunset
      sequence:
      - action: script.turn_on
        metadata: {}
        data: {}
        target:
          entity_id: script.terra_sunset
      alias: Sunset
  mode: parallel
  max: 10
- id: '1717951712000'
  alias: Pool Heating Control for Optimal Temperature
  description: "  ## ☀️ Pool Heating Control for Optimal Temperature\n\n  ### \U0001F4CB
    **Purpose**\n  Automatically manages the solar heating of the pool to maintain
    an optimal\n  temperature while maximizing energy efficiency. The automation evaluates\n
    \ current pool temperature, solar conditions, and time triggers to decide\n  when
    to turn the solar heating valves on or off.\n\n  ---\n\n  ### ⏰ **Triggers**\n
    \ | Trigger Type             | Details / Thresholds                         |\n
    \ |--------------------------|---------------------------------------------|\n
    \ | Solar Azimuth            | Between 95° and 100°                        |\n
    \ | Scheduled Time Checks    | 11:00 – 16:00 at hourly intervals          |\n
    \ | Pool Temperature Input   | Changes in `input_number.pool_temp_start`   |\n
    \ | Actual Pool Temperature  | Changes crossing `input_number.pool_heating_stop`
    |\n\n  ---\n\n  ### ✅ **Conditions**\n  - No global conditions; logic is handled
    in action-level checks.  \n  - Heating only activates when pool temperature is
    below thresholds.  \n  - Solar or power conditions (cloud coverage, solar radiation,
    total solar power) must indicate heating is beneficial.\n\n  ---\n\n  ### \U0001F3AF
    **Actions / Workflow**\n  **1. Solar Heating ON**\n  - Activated by time triggers
    or solar azimuth during the day.  \n  - Conditions to start:\n      - Pool temp
    below stop threshold.\n      - Start temp not too hot (>28.5 °C).  \n      - Adequate
    solar power, low cloud coverage, or sufficient radiation.  \n  - Steps:\n      -
    If first trigger of the day, open main solar valve.  \n      - Turn on smart valve
    controller.  \n      - Wait for any unavailable states to recover (max 1 minute).
    \ \n\n  **2. Solar Heating OFF**\n  - Triggered by temperature above stop threshold
    or poor solar conditions.  \n  - Steps:\n      - Turn off smart valve controller.
    \ \n\n  **3. Disable Solar Heating if Too Hot**\n  - Triggered if pool start temperature
    exceeds 28.5 °C.  \n  - Steps:\n      - Turn off smart valve controller and main
    solar valve.  \n      - Notify user via notification that heating is skipped due
    to high temperature.  \n\n  ---\n\n  ### \U0001F527 **Technical Specs**\n  - **Mode:**
    `single` (prevents overlapping operations)  \n  - Valves controlled:  \n      -
    `switch.pool_ventil_solar` (main solar valve)  \n      - `switch.smart_valve_controller_schalter_1`
    (smart valve controller)  \n  - Monitored entities: solar azimuth, pool temperature
    sensors, cloud coverage, solar power, solar radiation, and pool start temperature
    input.  \n\n  ---\n\n  ### ⚡ **Best Practices / Notes**\n  - Adjust temperature
    thresholds and solar power limits for your climate and pool setup.  \n  - Ensure
    all valve switches and sensors are correctly configured for reliable automation.
    \ \n  - Can be extended with additional safety checks, such as maximum daily heating
    duration or pump runtime limits."
  triggers:
  - entity_id:
    - sensor.sun_solar_azimuth
    above: 95
    id: 'On'
    below: 100
    trigger: numeric_state
    enabled: true
  - trigger: time
    at: '11:00:00'
    id: 'On'
  - trigger: time
    at: '12:00:00'
    id: 'On'
  - trigger: time
    at: '13:00:00'
    id: 'On'
  - trigger: time
    at: '14:00:00'
    id: 'On'
  - trigger: time
    at: '15:00:00'
    id: 'On'
  - trigger: time
    at: '16:00:00'
    id: 'On'
  - trigger: numeric_state
    entity_id:
    - sensor.esp32_c3_mini_pool_temperature_pool_temperature
    above: input_number.pool_heating_stop
    id: Off if to hot
  - entity_id:
