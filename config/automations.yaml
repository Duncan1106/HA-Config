    trigger: numeric_state
  - entity_id:
    - sensor.esp32_c3_zero_epever_pv_array_input_power
    below: 125
    id: off day
    trigger: numeric_state
  - entity_id:
    - sensor.esp32_c3_zero_epever_pv_array_input_power
    below: 75
    id: off day
    trigger: numeric_state
  - entity_id:
    - sensor.inverter_pv_power
    id: off day
    below: 2250
    trigger: numeric_state
  - entity_id:
    - sensor.inverter_pv_power
    id: off day
    below: 2000
    trigger: numeric_state
  - event: sunset
    offset: -00:15:00
    id: on night
    trigger: sun
  - event: sunrise
    offset: +00:15:00
    id: off night
    trigger: sun
  - id: on day
    enabled: true
    trigger: time_pattern
    minutes: '*'
  - trigger: numeric_state
    entity_id:
    - sensor.bkw_outlet_1_energy_power
    below: 50
    id: off night
  conditions:
  - condition: or
    conditions:
    - condition: or
      conditions:
      - condition: state
        entity_id: input_boolean.battery_full
        state: 'on'
      - condition: or
        conditions:
        - condition: numeric_state
          entity_id: sensor.esp32_c3_zero_epever_battery_soc
          above: 95
        - condition: numeric_state
          entity_id: sensor.esp32_c3_zero_epever_battery_voltage
          above: 27.75
    - condition: and
      conditions:
      - condition: numeric_state
        entity_id: sensor.inverter_pv_power
        below: 2001
      - condition: device
        type: is_on
        device_id: f7afa3f7d75d54c713ea1d78071ff30c
        entity_id: 12403f847e9caae174f8b14a11ab9c19
        domain: switch
  actions:
  - alias: on day
    if:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - on day
      - condition: state
        entity_id: sensor.scb_inverter_state
        state: FeedIn
      - condition: state
        entity_id: input_boolean.battery_full
        state: 'on'
      - condition: numeric_state
        entity_id: sensor.esp32_c3_zero_epever_battery_soc
        above: 80
      - condition: numeric_state
        entity_id: sensor.inverter_pv_power
        above: 2000
    then:
    - metadata: {}
