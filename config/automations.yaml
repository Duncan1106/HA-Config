        - action: input_select.select_option
          metadata: {}
          data:
            option: Intelligent
          target:
            entity_id: input_select.octopus_night_time
        alias: Turn back to Intelligent Mode on Time Off Trigger
      - alias: If Car is connected to 11kW Charger then stop charging
        if:
        - condition: state
