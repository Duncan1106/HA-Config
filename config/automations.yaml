    - sensor.tibber_bridge_0100020800ff_in_k
    to: unknown
  - trigger: state
    entity_id:
    - sensor.tibber_bridge_0100020800ff_in_k
    to: unknown
    for:
      hours: 0
      minutes: 3
      seconds: 0
  - trigger: state
    entity_id:
    - sensor.tibber_bridge_0100020800ff_in_k
    to: unknown
    for:
      hours: 0
      minutes: 10
      seconds: 0
  - trigger: state
    entity_id:
    - sensor.tibber_bridge_0100020800ff_in_k
    to: unknown
    for:
      hours: 0
      minutes: 30
      seconds: 0
  - trigger: numeric_state
