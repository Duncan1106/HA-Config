- id: '1747048995618'
  alias: Coffee Machine Power Control
  description: "## ☕ Coffee Machine Power Control\n\n### \U0001F4CB **Automatic Smart-Plug
    Management for Coffee Machine**  \nMonitors the coffee machine's power draw and
    automatically powers the smart plug when an initial draw is detected. If the expected
    brewing power level isn't reached within **5 minutes**, the plug is turned off
    to avoid prolonged idle consumption (e.g., kettle-like standby or false triggers).\n\n---\n\n###
    ⏰ **Triggers**\n| Entity | Event |\n|--------|-------|\n| `sensor.kaffeemaschine_philips_energy_power`
    | Any state change (used to detect the initial power-up spike) |\n\n---\n\n###
    ✅ **Conditions**\n- Template ensures this automation only reacts when the sensor
    crosses from near-zero to a small positive draw (initial start):\n  - Detects
    transition: `from < 0.5` → `to > 0.5`\n\n---\n\n### \U0001F3AF **Actions / Workflow**\n\n1.
    **Initial detection**  \n   - When initial draw detected (template condition passes)
    → `switch.kaffeemaschine_tasmota` **turn_on** immediately.\n\n2. **Wait for brewing
    power**  \n   - Wait for `sensor.kaffeemaschine_energy_power` to rise **above
    50 W** (numeric_state trigger).\n   - Timeout: **5 minutes** (continue_on_timeout:
    true).\n\n3. **Fail-safe**  \n   - If the wait **timed out** (i.e., brewing threshold
    not reached within 5 minutes) → turn **off** `switch.kaffeemaschine_tasmota` to
    prevent idle power draw.\n\n---\n\n### \U0001F527 **Technical Specs**\n- **Trigger
    Sensor:** `sensor.kaffeemaschine_philips_energy_power`  \n- **Brewing Detection
    Sensor:** `sensor.kaffeemaschine_energy_power`  \n- **Controlled Device:** `switch.kaffeemaschine_tasmota`
    \ \n- **Initial-detect threshold:** ~**0.5 W** (transition from near-zero to >0.5)
    \ \n- **Brewing threshold:** **50 W** (tunable)  \n- **Timeout:** **5 minutes**
    \ \n- **Mode:** `queued` (max 3 concurrent) — allows overlapping short starts
    but limits runaway executions\n\n---\n\n### ⚡ **Notes & Best Practices**\n- Thresholds
    (`0.5` for initial start, `50` for brewing) and timeout (5 min) are tuned heuristics
    — adapt them to your machine's real measured behavior to avoid false positives/negatives.
    \ \n- Consider adding small hysteresis or a minimum-on-time if the coffee machine
    briefly toggles during brew to avoid rapid on/off cycles.  \n- Useful to log occasional
    timeouts to check whether the coffee machine often fails to reach brew power (could
    indicate a device issue).  \n- This keeps the smart plug honest: power it on when
    action begins, but don't let an accidental small draw sit forever.\n"
  triggers:
  - entity_id:
    - sensor.kaffeemaschine_philips_energy_power
    trigger: state
  conditions:
  - condition: template
    value_template: "{{ trigger.from_state.state | float(default=0) < 0.5 and\n   trigger.to_state.state
      | float(default=0) > 0.5 }}\n"
  actions:
  - target:
      entity_id:
      - switch.kaffeemaschine_tasmota
    action: switch.turn_on
    data: {}
  - wait_for_trigger:
    - trigger: numeric_state
      entity_id:
      - sensor.kaffeemaschine_energy_power
      above: 50
    timeout:
      hours: 0
      minutes: 5
      seconds: 0
      milliseconds: 0
    continue_on_timeout: true
  - if:
    - condition: template
      value_template: '{{ not wait.completed }}'
    then:
    - action: switch.turn_off
      metadata: {}
      data: {}
      target:
        entity_id: switch.kaffeemaschine_tasmota
  mode: queued
  max: 3
- id: '1747074473799'
  alias: Restart Add-ons at 01:00 daily
  description: "## \U0001F504 Daily Add-on Restart Automation\n\n### \U0001F4CB Purpose\nThis
    automation restarts a set of Home Assistant add-ons daily at **01:00 AM**. \nIts
    goal is to ensure the add-ons are refreshed, which helps recover from updates
    or minor issues.\n\n---\n\n### ⏱ Trigger\n- Daily at `01:00:00`.\n\n---\n\n###
    ✅ Conditions\n- No additional conditions; the restart occurs every day.\n\n---\n\n###
    \U0001F3AF Actions / Workflow\nRestart add-on\n---\n\n### \U0001F527 Technical
    Notes\n- Mode: `single` (prevents overlapping runs if the automation triggers
    again unexpectedly).\n- Uses short delays between add-on restarts to avoid potential
    conflicts or overload."
  triggers:
  - trigger: time
    at: 01:00:00
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: binary_sensor.frigate_full_access_aktiv
        state: 'off'
      - condition: state
        entity_id: sensor.ups0_status
        state: Online
      sequence:
      - action: hassio.addon_start
        metadata: {}
        data:
          addon: ccab4aaf_frigate-fa
      alias: Start Frigate if not running
    - conditions:
      - condition: state
        entity_id: binary_sensor.frigate_full_access_aktiv
        state: 'on'
      - condition: state
        entity_id: sensor.ups0_status
        state: Online
      sequence:
      - action: hassio.addon_restart
        metadata: {}
        data:
          addon: ccab4aaf_frigate-fa
      alias: Restart Frigate if running
  mode: single
- id: '1747573166845'
  alias: Boiler Timer
  description: "## \U0001F4A7 Boiler Timer  \n\n### \U0001F4CB **Hot Water Circulation
    Control**  \nThis automation controls the hot water circulation pump (`switch.zirkulationspumpe_zigbee`)
    based on the `boiler_on_demand` timer.  \n\nWhen the timer becomes active, the
    pump is switched on. When the timer finishes and goes idle, the pump is turned
    off.  \n\n---\n\n### ⏰ **Triggers**  \n\n| Trigger Entity | Event / Condition
    | Trigger ID |\n|----------------|-----------------|------------|\n| `timer.boiler_on_demand`
    | State changes from `idle` → `active` | \"Start\" |\n| `timer.boiler_on_demand`
    | State changes from `active` → `idle` | \"Stop\" |\n\n> **Note:** The pump operation
    is fully synchronized with the timer.  \n\n---\n\n### ✅ **Conditions**  \n- None;
    all triggers execute the actions directly.  \n\n---\n\n### \U0001F3AF **Actions
    / Workflow**  \n\n1. **Start Trigger** (`timer.boiler_on_demand` → active)  \n
    \  - Turns on `switch.zirkulationspumpe_zigbee`  \n\n2. **Stop Trigger** (`timer.boiler_on_demand`
    → idle)  \n   - Turns off `switch.zirkulationspumpe_zigbee`  \n\n---\n\n### \U0001F527
    **Technical Specs**  \n- **Mode:** `single` (prevents overlapping executions)
    \ \n- **Device Controlled:** Hot water circulation pump (`switch.zirkulationspumpe_zigbee`)
    \ \n\n---\n\n### ⚡ **Notes / Best Practices**  \n- Ensures pump only runs when
    needed, saving energy.  \n- Simple and reliable control synced to the `boiler_on_demand`
    timer.  \n"
  triggers:
  - trigger: state
    entity_id:
    - timer.boiler_on_demand
    to: active
    from: idle
    id: Start
  - trigger: state
    entity_id:
    - timer.boiler_on_demand
    to: idle
    from: active
    id: Stop
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Start
      sequence:
      - action: script.retry_action_with_backoff
        metadata: {}
        data:
          action_domain: switch
          action_type: turn_on
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: simple
          notify_on_failure: true
          notify_service: notify.duncan
          entity_id: switch.zirkulationspumpe_zigbee
          target_state: 'on'
    - conditions:
      - condition: trigger
        id:
        - Stop
      sequence:
      - action: script.retry_action_with_backoff
        metadata: {}
        data:
          action_domain: switch
          action_type: turn_off
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: simple
          notify_on_failure: true
          notify_service: notify.duncan
          entity_id: switch.zirkulationspumpe_zigbee
          target_state: 'off'
  mode: single
- id: '1748530213618'
  alias: Allergie und Aufgaben Benachrichtigung
  description: "## \U0001F33F Allergie und Aufgaben Benachrichtigung  \n\n### \U0001F4CB
    **Daily Allergy & Task Reminder with AI Fallback System**  \n\nThis automation
    generates a **daily morning notification** combining:  \n1. **Pollen information**
    (Grass, Roggen, Hausstaubmilben, etc.)  \n2. **A random to-do task** from `todo.to_do_duncan`
    \ \n3. **A short AI-generated German message** with practical advice and medication
    hints  \n\nThe automation now includes an **enhanced dual-agent retry system**
    to maximize reliability of the AI output.  \n\n---\n\n### ⏰ **Triggers**  \n\n|
    Time | Event |\n|------|-------|\n| `08:05:00` | Daily scheduled reminder |\n\n---\n\n###
    ✅ **Conditions**  \n- None; runs automatically every morning.  \n\n---\n\n###
    \U0001F3AF **Workflow / Logic**  \n\n1. **Fetch To-Do Task**  \n   - Retrieves
    all tasks with status `needs_action` from `todo.to_do_duncan`.  \n   - Randomly
    selects one task to include in the notification.  \n\n2. **Prepare Prompts**  \n
    \  - **Pollen Prompt:** Uses today’s values from all relevant pollen sensors,
    focusing only on dosage recommendation in the format  \n     `base amount: additional
    amount`.  \n     - Keeps dosage conservative.  \n     - No explanations, causes,
    or air-quality text.  \n   - **To-Do Prompt:** Embeds the random task *unaltered*
    and adds practical, helpful suggestions for completing it today.  \n   - **Main
    Prompt:** Instructs the AI to produce a short, clean, readable message (in **German**,
    max **255 words**).  \n\n3. **AI Processing (Primary Agent)**  \n   - Uses `{{
    states('input_select.conversation_agents') }}`.  \n   - Retries up to **10 times**,
    but waits **only when a failure occurs**.  \n   - Recognizes failure phrases such
    as:  \n     - `\"Unable to get response\"`  \n     - `\"Sorry, I had a problem
    getting a response from Google Generative AI.\"`  \n     - `\"The message got
    blocked due to content violations\"`  \n\n4. **AI Fallback (Secondary Agent)**
    \ \n   - If the primary agent fails after retries, switches to  \n     `conversation.google_ai_conversation_2_5_flash`.
    \ \n   - Applies the same conditional retry logic and 5s delay on failed attempts.
    \ \n   \n5. **Send Notification**  \n   - **Success:** Sends the generated message
    to `notify.duncan`, with title including today’s weekday.  \n   - **Failure (after
    all retries):** Sends a fallback message  \n     *“Heute konnte leider keine Nachricht
    generiert werden.”*  \n\n---\n\n### \U0001F527 **Technical Specs**  \n\n- **To-Do
    Entity:** `todo.to_do_duncan`  \n- **Primary AI Agent:** `states('input_select.conversation_agents')`
    \ \n- **Fallback AI Agent:** `conversation.google_ai_conversation_2_5_flash`  \n-
    **Notification Target:** `notify.duncan`  \n- **Retries:** Up to 10 per agent
    \ \n- **Retry Delay:** 5 seconds  \n- **AI Token Limit:** 300 tokens  \n- **Pollen
    Sensors:**  \n  - `sensor.pollenflug_graeser_111`  \n  - `sensor.pollenflug_roggen_111`
    \ \n  - `sensor.pollenflug_ambrosia_111`  \n  - `sensor.pollenflug_beifuss_111`
    \ \n  - `sensor.pollenflug_hasel_111`  \n  - `sensor.pollenflug_esche_111`  \n\n---\n\n###
    ⚡ **Notes & Best Practices**  \n- Task text is **never altered or translated**,
    only supplemented.  \n- Medication recommendation stays on the conservative side.
    \ \n- The system prioritizes **robustness** — automatic retry + fallback agent
    ensure high success rate.  \n- The final message is always **concise, actionable,
    and in natural German**, formatted cleanly for mobile reading.\n"
  triggers:
  - trigger: time
    at: 08:05:00
  conditions: []
  actions:
  - action: todo.get_items
    metadata: {}
    data:
      status: needs_action
    target:
      entity_id: todo.to_do_duncan
    response_variable: to_do_duncan
  - variables:
      prompt: 'Please generate text for a notification that will be sent to the users
        smartphone with helpful information. keep it simple and short but precise.
        simply provide the notification and nothing else! don''t use any Benachrichtigung
        or something like that just the message! if you like you can format it to
        make it more readable . Only provide the message and not more.


        - Your answers are not technical, and do not include Home Assistant internal
        details such as entities in responses.

        Provide your answer in German and make it precise and efficient as a German
        would like it. Bitte Duzen nicht Siezen limit your answer to at most 255 tokens.
        keep it simple and short. rember it is a notification so no ''notification:''
        or something like that.  Simply the text of it and not more. limit yourself
        to 255 words! not one more!'
      pollen_prompt: 'I''m quite allergic to Grass pollen, Hausstaubmilben and Roggen.  Here
        are the today sensor values of these pollen and any other Gräser: {{ states(''sensor.pollenflug_graeser_111'')
        }}   Roggen: {{ states(''sensor.pollenflug_roggen_111'') }}  Ambrosia: {{
        states(''sensor.pollenflug_ambrosia_111'') }}  Beifuss {{ states(''sensor.pollenflug_beifuss_111'')
        }}  Hasel: {{ states(''sensor.pollenflug_hasel_111'') }}  Esche: {{ states(''sensor.pollenflug_esche_111'')
        }}  Legend: \nIndex\tDescription (in German) 0\tkeine Belastung 0.5\tkeine
        bis geringe Belastung 1\tgeringe Belastung 1.5\tgeringe bis mittlere Belastung
        2\tmittlere Belastung 2.5\tmittlere bis hohe Belastung 3\thohe Belastung\n

        Based on these, how much anti allergic medication should i take, my typical
        dose would be 2 tablets on bad days. My doctor says i can take as much as
        10 per day. Give me a base count i should take and suggest how many more i
        could take over the day. Keep it short, only tell the amount, and the amount
        i should take with me, based on the pollen pollution. dont tell me why, dont
        tell me what is happening in the air. like: 2 Tabletten, + 3 Tabletten. thats
        it not anymore, no argumentation or anything like that. dont even tell me
        what will bither me be it  grass or anything else keep the pollen stuff to
        a minimum.  also keep the amount to the lower end and dont tend to overshoot
        please. i dont want to build resistance against this anti allergy medication!!!
        keep in mind the schema: ''base amount: additional amount'' nothing else about
        pollen.'
      todo_prompt: "{% set items = to_do_duncan['todo.to_do_duncan']['items'] | default([],
        true) %} {% if items | length > 0 %}\n  Also here’s a random task from my
        todo list:\n  \"\" {% set task = items | random %} \"\"\n  {{ task.summary
        }}\n  feel free to make suggestions on how to do this today. Also keep the
        task\n  itself as is and only add helpful instructions or information. Also
        keep\n  it in the language it is and don’t translate it. The rest will be
        translated\n  later as requested. Very important: add the task exactly as-is
        and nothing\n  more to the generated message. Only add helpful instructions
        or information,\n  never replace, translate, or manipulate the task in any
        way. make good suggestions on how to do the task.\n{% endif %}"
  - repeat:
      sequence:
      - alias: Conversation Agent Notification Text
        data:
          text: '{{ pollen_prompt }}


            {{ todo_prompt }}


            {{ prompt }}'
          agent_id: '{{ states(''input_select.conversation_agents'') }}'
        response_variable: agent_gemini
        action: conversation.process
      - alias: Wait only if failed
        if:
        - condition: template
          value_template: "{% set bad_phrases = [\n  \"Unable to get response\",\n
            \ \"Sorry, I had a problem getting a response\",\n  \"The message got
            blocked due to content violations\"\n] %}\n{{ (bad_phrases | select('in',
            agent_gemini.response.speech.plain.speech) | list | count > 0) }}"
        then:
        - delay:
            hours: 0
            minutes: 0
            seconds: 5
            milliseconds: 0
      until:
      - condition: template
        value_template: "{% set bad_phrases = [\n      \"Unable to get response\",\n
          \     \"Sorry, I had a problem getting a response\",\n      \"The message
          got blocked due to content violations\"\n] %}\n{{ (bad_phrases | select('in',
          agent_gemini.response.speech.plain.speech) | list | count == 0)\n   or repeat.index
          >= 10 }}"
  - if:
    - condition: template
      value_template: "{% set bad_phrases = [\n        \"Unable to get response\",\n
        \       \"Sorry, I had a problem getting a response\",\n        \"The message
        got blocked due to content violations\"\n] %}\n{{ (bad_phrases | select('in',
        agent_gemini.response.speech.plain.speech) | list | count) > 0 }}"
    then:
    - repeat:
        sequence:
        - alias: Conversation Agent Notification Text
          data:
            text: '{{ pollen_prompt }}


              {{ todo_prompt }}


              {{ prompt }}'
            agent_id: conversation.google_ai_conversation_2_5_flash
          response_variable: agent_gemini
          action: conversation.process
        - alias: Wait only if failed
          if:
          - condition: template
            value_template: "{% set bad_phrases = [\n  \"Unable to get response\",\n
              \ \"Sorry, I had a problem getting a response\",\n  \"The message got
              blocked due to content violations\"\n] %}\n{{ (bad_phrases | select('in',
              agent_gemini.response.speech.plain.speech) | list | count > 0) }}"
          then:
          - delay:
              hours: 0
              minutes: 0
              seconds: 5
              milliseconds: 0
        until:
        - condition: template
          value_template: "{% set bad_phrases = [\n  \"Unable to get response\",\n
            \ \"Sorry, I had a problem getting a response\",\n  \"The message got
            blocked due to content violations\"\n] %}\n{{ (bad_phrases | select('in',
            agent_gemini.response.speech.plain.speech) | list | count == 0)\n   or
            repeat.index >= 10 }}"
  - choose:
    - conditions:
      - condition: template
        value_template: "{% set bad_phrases = [\n    \"Unable to get response\",\n
          \   \"Sorry, I had a problem getting a response\",\n    \"The message got
          blocked due to content violations\"\n  ] %}\n\n{{ (bad_phrases | select('in',
          agent_gemini.response.speech.plain.speech) | list | count) > 0 }}"
      sequence:
      - action: notify.duncan
        metadata: {}
        data:
          title: '{{ now().strftime(''%A'') }} Allergie und Aufgaben'
          message: Heute konnte leider keine Nachricht generiert werden.
          data:
            tag: allergie_and_tasks_failure
    default:
    - alias: Send notification
      data:
        title: '{{ now().strftime(''%A'') }} Allergie und Aufgaben'
        message: '{{ agent_gemini.response.speech.plain.speech }}'
        data:
          tag: allergie_and_tasks
      action: notify.duncan
  mode: single
- id: '1748645782485'
  alias: Request Tasmota Rule States on HA Startup
  description: "## \U0001F4E1 Request Tasmota Rule States on HA Startup  \n\n### \U0001F4CB
    **Synchronize Tasmota Rules**  \nEnsures Home Assistant has the latest state of
    Tasmota rules on startup and periodically every 12 hours.  \nThis helps avoid
    mismatches between the device state and HA’s internal representation.  \n\n---\n\n###
    ⏰ **Triggers**  \n\n| Trigger | Event / Schedule |\n|---------|-----------------|\n|
    HA Startup | `homeassistant.start` |\n| Periodic Refresh | Every 12 hours (`time_pattern:
    hours=/12`) |\n| Kaffemaschine Solis | Changes from Unavailable |\n\n---\n\n###
    ✅ **Conditions**  \n- None — the automation always runs on the triggers above.
    \ \n\n---\n\n### \U0001F3AF **MQTT Publish Mapping**  \n\n| Topic | Payload |\n|-------|---------|\n|
    `cmnd/tasmota_157F88/Rule1` | `\" \"` (requests current rule state) |\n| `cmnd/tasmota_157F88/Rule2`
    | `\" \"` (requests current rule state) |\n| `cmnd/tasmota_157F88/Rule3` | `\"
    \"` (requests current rule state) |\n> **Note:** Sending an empty payload to Tasmota
    rule topics requests the current state without modifying the rule itself.  \n\n---\n\n###
    \U0001F527 **Technical Specs**  \n\n- **Mode:** `single` (prevents overlap during
    startup)  \n- **MQTT QoS:** 0 (fire-and-forget)  \n- **Devices:** Tasmota device
    `157F88` \n- **Purpose:** Ensures rule states are synchronized in HA immediately
    and refreshed every 12 hours"
  triggers:
  - trigger: homeassistant
    event: start
    id: start
  - trigger: time_pattern
    hours: /12
  - trigger: state
    entity_id:
    - sensor.kaffeemaschine_energy_power
    from:
    - unavailable
  actions:
  - if:
    - condition: trigger
      id:
      - start
    then:
    - delay:
        hours: 0
        minutes: 1
        seconds: 0
        milliseconds: 0
    alias: 'Delay when triggered by startup '
  - action: mqtt.publish
    metadata: {}
    data:
      qos: 0
      topic: cmnd/tasmota_157F88/Rule1
      payload: ' '
  - action: mqtt.publish
    metadata: {}
    data:
      qos: 0
      topic: cmnd/tasmota_157F88/Rule2
      payload: ' '
  - action: mqtt.publish
    metadata: {}
    data:
      qos: 0
      topic: cmnd/tasmota_157F88/Rule3
      payload: ' '
- id: '1749115504854'
  alias: Adjust Addon Status based on AnkerMake M5C Usage
  description: "## ⚡ Adjust Addon Status based on AnkerMake M5C Usage\n\n### \U0001F4CB
    **Purpose**\n\nThis automation manages the Ankerctl Home Assistant addon based
    on the usage of the AnkerMake M5C 3D printer.  \nIt ensures the addon runs only
    when the printer is active, reducing unnecessary resource usage.\n\n---\n\n###
    ⏰ **Triggers**\n\n| Trigger Entity       | State Change | Trigger ID |\n|---------------------|--------------|------------|\n|
    `switch.ankermake_1` | `→ on`   | \"ON\"       |\n| `switch.ankermake_1` | `→
    off`   | \"OFF\"      |\n\n> **Note:** The triggers monitor the printer's main
    switch, starting or stopping the addon accordingly.  \n\n---\n\n### ✅ **Conditions**\n\n-
    None. The automation acts directly on the switch triggers.  \n\n---\n\n### \U0001F3AF
    **Actions / Workflow**\n\n1. **Printer Turned On (\"ON\")**  \n   - Triggered
    when `switch.ankermake_1` changes to `\"on\"`.  \n   - Action: Starts the `cff83567_ankerctl`
    addon.  \n\n2. **Printer Turned Off (\"OFF\")**  \n   - Triggered when `switch.ankermake_1`
    changes to `\"off\"`.  \n   - Action: Stops the `cff83567_ankerctl` addon.  \n\n>
    **Rationale:** Keeps the addon running only when needed, preventing unnecessary
    load on Home Assistant.  \n\n---\n\n### \U0001F527 **Technical Specs**\n\n- **Addon
    Target:** `cff83567_ankerctl`  \n- **Mode:** `single` (ensures only one instance
    runs at a time; prevents overlapping addon start/stop commands)  \n\n---\n\n###
    ⚡ **Notes / Best Practices**\n\n- This approach is ideal for addons tied to specific
    hardware usage.  \n- Ensures efficient resource management on your Home Assistant
    system.  \n- Can be extended to other devices by duplicating triggers and adjusting
    the addon target."
  triggers:
  - trigger: state
    entity_id:
    - switch.ankermake_1
    to: 'on'
    id: 'ON'
  - trigger: state
    entity_id:
    - switch.ankermake_1
    to: 'off'
    id: 'OFF'
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - 'ON'
      sequence:
      - action: hassio.addon_start
        metadata: {}
        data:
          addon: cff83567_ankerctl
      alias: Start Ankerctl Addon When Printer Turned On
    - conditions:
      - condition: trigger
        id:
        - 'OFF'
      sequence:
      - action: hassio.addon_stop
        metadata: {}
        data:
          addon: cff83567_ankerctl
      alias: Stop Ankerctl Addon When Printer Turned Off
  mode: single
- id: '1749768402037'
  alias: Gang Light Brightness Control
  description: "## \U0001F6B6‍♂️ Gang Light Brightness Control  \n\n### \U0001F4CB
    **Adaptive Stairway Illumination**  \nAutomatically synchronizes the stairway
    light with the brightness sensor value. When brightness is above zero, the light
    adjusts accordingly. If brightness drops to zero, the light switches off — ensuring
    optimal stairway lighting at all times.  \n\n---\n\n### \U0001F506 **Turn ON Trigger**
    \ \n| Condition | Threshold | Note |\n|-----------|-----------|------|\n| **Brightness
    Change** | `sensor.light_brighness` > **0** | Any increase or decrease above zero
    triggers adjustment |\n\n---\n\n### \U0001F319 **Turn OFF Trigger**  \n| Condition
    | Threshold | Note |\n|-----------|-----------|------|\n| **Brightness Sync**
    | `sensor.light_brighness` < **1** | Turns off light if brightness goes to zero
    |\n\n---\n\n### \U0001F3AF **Smart Logic**  \n\n#### **\U0001F506 ON Action**
    \ \n- Checks if light is **OFF** or brightness is **different** from sensor value
    \ \n- If true → `light.turn_on` with brightness percentage = sensor value  \n\n####
    **\U0001F319 OFF Action**  \n- If brightness sensor changes to **0** from a previous
    nonzero value  \n- Then → `light.turn_off`  \n\n---\n\n### \U0001F527 **Technical
    Specs**  \n- **Target:** `light.esp32_c3_mini_treppenhaus_licht`  \n- **Sensor:**
    `sensor.light_brighness`  \n- **Mode:** `single` (one run at a time)  \n- **Conversion:**
    Sensor value (%) × 2.55 → HA light brightness scale"
  triggers:
  - trigger: state
    entity_id:
    - sensor.light_brighness
    id: Change
  - trigger: numeric_state
    entity_id:
    - sensor.light_brighness
    below: 1
    id: Zero
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Change
      - condition: numeric_state
        entity_id: sensor.light_brighness
        above: 0
      sequence:
      - if:
        - condition: or
          conditions:
          - condition: state
            entity_id: light.esp32_c3_mini_treppenhaus_licht
            state: 'off'
          - condition: template
            value_template: '{% set sensor_brightness = (states(''sensor.light_brighness'')
              | float(0) * 2.55) | int(0) %}

              {% set current = state_attr(''light.esp32_c3_mini_treppenhaus_licht'',
              ''brightness'') | int(0) %}

              {{ sensor_brightness != current }}'
        then:
        - action: light.turn_on
          metadata: {}
          data:
            brightness_pct: '{{ states(''sensor.light_brighness'') | int(0) }}'
          target:
            entity_id: light.esp32_c3_mini_treppenhaus_licht
      alias: On with specified Brighness
    - conditions:
      - condition: trigger
        id:
        - Zero
      - condition: template
        value_template: '{{ trigger.from_state.state | int(1) > 0 }}'
      sequence:
      - action: light.turn_off
        metadata: {}
        data: {}
        target:
          entity_id: light.esp32_c3_mini_treppenhaus_licht
      alias: Off if Brightness changes to Zero
  mode: single
- id: '1749938010439'
  alias: Reset Deye Battery Capacity closer to real
  description: "## \U0001F50B Reset Deye Battery Capacity  \n\n### \U0001F4CB **Keeping
    SOC Estimation in Check**  \nThe Deye inverter tends to overshoot its calculated
    battery capacity. This automation corrects the capacity estimate by making small
    adjustments around the true SOC reported by the BMS, keeping values closer to
    reality.  \n\n---\n\n### ⏰ **Triggers**  \n| Condition | Entity/Event | Threshold
    |\n|-----------|--------------|-----------|\n| **Daily Reset** | `sunset` | Exact
    time |\n| **Midnight Reset** | `00:00:00` | Exact time |\n| **SOC Full** | `sensor.felicity_ess_soc_avg`
    | Above **99.9%** |\n\n---\n\n### ✅ **Conditions**  \n- `sensor.inverter_battery_corrected_capacity`
    > `number.inverter_battery_capacity`  \n- `sensor.felicity_ess_soc_avg` > **99%**
    \ \n\n---\n\n### \U0001F3AF **Correction Logic**  \n\n#### **Step 1**  \n- Increase
    inverter’s capacity value by **+1**  \n\n#### **Step 2**  \n- Wait **30s**  \n\n####
    **Step 3**  \n- Decrease inverter’s capacity value by **-1**  \n\n---\n\n### \U0001F527
    **Technical Specs**  \n- **Target Number Entity:** `number.inverter_battery_capacity`
    \ \n- **Sensors Used:**  \n  - `sensor.inverter_battery_corrected_capacity`  \n
    \ - `sensor.felicity_ess_soc_avg`  \n- **Mode:** `single` (no overlap)  \n- **Adjustment
    Logic:** ±1 step correction with short delay"
  triggers:
  - trigger: sun
    event: sunset
    offset: +00:01:00
  - trigger: time
    at: 00:00:00
  - trigger: numeric_state
    entity_id:
    - sensor.felicity_ess_soc_avg
    above: 99.9
  conditions:
  - condition: numeric_state
    entity_id: sensor.inverter_battery_corrected_capacity
    above: number.inverter_battery_capacity
  - condition: numeric_state
    entity_id: sensor.felicity_ess_soc_avg
    above: 99
  actions:
  - action: number.set_value
    metadata: {}
    data:
      value: '


        {{ states(''number.inverter_battery_capacity'')|int(500) + 1 }}'
    target:
      entity_id: number.inverter_battery_capacity
  - delay:
      hours: 0
      minutes: 0
      seconds: 30
      milliseconds: 0
  - action: number.set_value
    metadata: {}
    data:
      value: '


        {{ states(''number.inverter_battery_capacity'')|int(500) - 1 }}'
    target:
      entity_id: number.inverter_battery_capacity
  mode: single
  max_exceeded: silent
- id: '1750196437853'
  alias: Octopus night usage, turn battery off
  description: "\n  ## ⚡ Octopus Night Usage Automation\n\n  ### \U0001F4CB **EV &
    Battery Management for Octopus Tariffs**\n\n  This automation intelligently manages
    **battery charging and discharging**, as well as **EV charging behavior**, during
    **Octopus night tariff periods**. It supports both **Dumb** (time-based) and **Intelligent**
    (Octopus-controlled) modes to ensure the most efficient and conflict-free use
    of power.  \n  It also prevents battery discharge if EVs are drawing more than
    the grid can supply and handles multiple EVs dynamically.\n\n  ---\n\n  ### ⏱
    **Trigger Overview**\n\n  | Trigger | Description | ID |\n  |----------|--------------|----|\n
    \ | `00:01` | Begin night cycle (turn battery off, start EV charging) | On_time
    |\n  | `04:59` | End night cycle (stop EV charging, restore battery) | Off_time
    |\n  | `binary_sensor.octopus_a_10a76963_volkswagen_id_4_intelligent_dispatching`
    → `on` | Intelligent dispatch begins | On_dispatch |\n  | `binary_sensor.octopus_a_10a76963_volkswagen_id_4_intelligent_dispatching`
    → `off` | Intelligent dispatch ends | Off_dispatch |\n  | `sensor.renault_zoe_batterie
    > 98.1% for 15 min` | Zoe battery full | car_full_zoe |\n  | `sensor.wvgzzze2zpe005371_battery_level
    > 99% for 1 min` | ID.4 battery full | car_full_id4 |\n  | `sensor.lsjwh4097rn105299_soc
    > 99.9% for 3 min` | MG4 battery full | car_full_mg4 |\n  | Template trigger |
    Prevents battery discharge if EVs draw > grid power | prevent_battery_discharge
    |\n\n  ---\n\n  ### ✅ **Mode Logic**\n\n  - **Dumb Mode:** Follows a fixed time-based
    routine for battery and EV control between 00:00 – 05:00.  \n  - **Intelligent
    Mode:** Reacts dynamically to Octopus dispatch signals for charging and discharging
    windows.  \n  - **Safety Logic:** Prevents battery from turning on if EVs are
    drawing significant power, with retry intervals at 1, 3, and 5 minutes.\n\n  ---\n\n
    \ ### ⚙️ **Action Workflow**\n\n  #### Dumb Mode (Scheduled Control)\n\n  - **Start
    of Night (00:01):**\n    - Turns off the home battery using retry logic for reliability.\n
    \   - Starts EV charging if cars are connected to either Go-eCharger (11 kW or
    22 kW).\n    - Waits for power draw to confirm successful start.\n    - If EV
    fails to charge, restores the battery and stops charging to prevent energy waste.\n\n
    \ - **End of Night or EV Fully Charged (04:59 / EV Full):**\n    - Restores mode
    to *Intelligent*.\n    - Stops EV charging, waiting until power draw drops below
    5 W.\n    - Turns the battery back on once safe to do so.\n    - If still unsafe,
    sends a notification and retries at 1, 3, and 5 minute intervals before giving
    up.\n\n  #### Intelligent Mode (Octopus Dispatch Control)\n\n  - **Dispatch On:**
    Turns off the battery and starts EV charging as directed by Octopus.\n  - **Dispatch
    Off:** Stops EV charging, waits for safe discharge levels, then turns battery
    back on.\n  - Notifications sent if EV load prevents battery activation.\n  -
    Preventive template ensures battery never discharges while EVs draw more power
    than the grid can provide.\n\n  ---\n\n  ### \U0001F527 **Technical Details**\n\n
    \ - **Mode:** `single`\n  - **Battery Switch:** `switch.esp32_s3_zero_deye8k_time_of_use`\n
    \ - **EV Chargers:**  \n    - `select.go_echarger_270862_frc` (11 kW)  \n    -
    `select.go_echarger_252682_frc` (22 kW)\n  - **Monitored Sensors:**  \n    - Octopus
    dispatch  \n    - Charger power sensors  \n    - EV battery SOC sensors  \n  -
    **Retry System:** Up to 10 attempts for state confirmations (battery or charger)\n
    \ - **Notifications:** Sent via `notify.duncan` when automation cannot safely
    restore battery\n\n  ---\n\n  ### ⚡ **Design Notes**\n\n  - Dumb mode ensures
    maximum use of cheap tariff power overnight.\n  - Intelligent mode yields control
    to Octopus dispatch for adaptive savings.\n  - Safety logic prevents battery from
    re-engaging while EVs draw significant power.\n  - Multiple retry layers ensure
    reliability and reduce manual intervention.\n  - Notifications provide transparency
    when automation requires attention."
  triggers:
  - trigger: time
    at: 00:01:00
    enabled: true
    id: On_time
  - trigger: state
    entity_id:
    - input_select.octopus_night_time
    from:
    - Intelligent
    to:
    - Dumb
    id: On_time_change
  - trigger: time
    at: 04:59:00
    id: Off_time
    enabled: true
  - trigger: state
    entity_id:
    - binary_sensor.octopus_a_10a76963_volkswagen_id_4_intelligent_dispatching
    to: 'on'
    id: On_dispatch
  - trigger: state
    entity_id:
    - binary_sensor.octopus_a_10a76963_volkswagen_id_4_intelligent_dispatching
    to: 'off'
    id: Off_dispatch
  - trigger: numeric_state
    entity_id:
    - sensor.renault_zoe_batterie
    id: car_full_zoe
    for:
      hours: 0
      minutes: 15
      seconds: 0
    above: 98.1
  - trigger: numeric_state
    entity_id:
    - sensor.wvgzzze2zpe005371_battery_level
    id: car_full_id4
    for:
      hours: 0
      minutes: 1
      seconds: 0
    above: 99
    enabled: false
  - trigger: numeric_state
    entity_id:
    - sensor.lsjwh4097rn105299_soc
    for:
      hours: 0
      minutes: 3
      seconds: 0
    above: 99.9
    id: car_full_mg4
  - trigger: template
    value_template: "    {% set car_22kw = is_state('binary_sensor.go_echarger_252682_car','on')
      %}\n    {% set car_11kw = is_state('binary_sensor.go_echarger_270862_car','on')
      %}\n    {% set power_goes = (((states('sensor.go_echarger_252682_nrg_12')|float(0))
      if car_22kw else 0) + ((states('sensor.go_echarger_270862_nrg_12')|float(0))
      if car_11kw else 0)) %}\n    {% set grid = states('sensor.grid_import') | float(0)
      %}\n    {% set octopus = is_state('binary_sensor.octopus_a_10a76963_volkswagen_id_4_intelligent_dispatching','on')
      or is_state('input_select.octopus_night_time','Dumb') %}\n    {% set battery_discharging
      = states('sensor.battery_discharge')| float(0) > 50 %}\n    {% set night_time
      = now().hour < 5 %}\n    {{ (car_22kw or car_11kw) and octopus and power_goes
      > 50 and grid < power_goes and battery_discharging and night_time }}"
    for:
      hours: 0
      minutes: 0
      seconds: 30
    id: prevent_battery_discharge
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id:
          - On_time
        - condition: and
          conditions:
          - condition: time
            after: 00:00:00
            before: 04:30:00
          - condition: trigger
            id:
            - On_time_change
      - condition: state
        entity_id: input_select.octopus_night_time
        state: Dumb
      - condition: time
        after: 00:00:00
        before: 05:00:00
      sequence:
      - action: script.retry_action_with_backoff
        metadata: {}
        data:
          action_domain: switch
          action_type: turn_off
          max_retries: 10
          base_delay: 5
          max_delay: 60
          backoff_type: simple
          notify_on_failure: true
          notify_service: notify.duncan
          entity_id: switch.esp32_s3_zero_deye8k_time_of_use
          target_state: 'off'
        alias: 'Turn Battery Off via retry Script '
      - alias: Allow Charging for 11kW Go-eCharger if any Car is connected
        if:
        - condition: not
          conditions:
          - condition: state
            entity_id: sensor.go_e_11kw_car
            state: No card selected
        then:
        - action: script.retry_action_with_backoff
          metadata: {}
          data:
            max_retries: 10
            base_delay: 5
            max_delay: 60
            backoff_type: simple
            notify_on_failure: true
            notify_service: notify.duncan
            entity_id: select.go_echarger_270862_frc
            target_state: custom
            custom_action:
            - action: select.select_option
              metadata: {}
              data:
                option: Charge
              target:
                entity_id: select.go_echarger_270862_frc
            custom_target_state: Charge
      - alias: Allow Charging for 22kW Go-eCharger if any Car is connected
        if:
        - condition: not
          conditions:
          - condition: state
            entity_id: sensor.go_e_22kw_car
            state: No card selected
        then:
        - action: script.retry_action_with_backoff
          metadata: {}
          data:
            max_retries: 10
            base_delay: 5
            max_delay: 60
            backoff_type: simple
            notify_on_failure: true
            notify_service: notify.duncan
            entity_id: select.go_echarger_252682_frc
            target_state: custom
            custom_action:
            - action: select.select_option
              metadata: {}
              data:
                option: Charge
              target:
                entity_id:
                - select.go_echarger_252682_frc
            custom_target_state: Charge
      - alias: Car Update MG4
        choose:
        - conditions:
          - condition: or
            conditions:
            - condition: state
              entity_id: sensor.go_e_11kw_car
              state:
              - MG4
            - condition: state
              entity_id: sensor.go_e_22kw_car
              state:
              - MG4
          sequence:
          - action: switch.turn_on
            metadata: {}
            target:
              entity_id: switch.lsjwh4097rn105299_charging
            data: {}
          alias: 'Start Charging MG4 and force the update '
      - alias: Car Update Zoe
        choose:
        - conditions:
          - condition: or
            conditions:
            - condition: state
              entity_id: sensor.go_e_11kw_car
              state:
              - Zoe
            - condition: state
              entity_id: sensor.go_e_22kw_car
              state:
              - Zoe
          sequence:
          - action: button.press
            metadata: {}
            target:
              entity_id: button.renault_zoe_ladevorgang_starten
            data: {}
          alias: 'Start Charging Zoe and force the update '
      - alias: Car Update ID.4
        choose:
        - conditions:
          - condition: or
            conditions:
            - condition: state
              entity_id: sensor.go_e_11kw_car
              state:
              - ID.4
            - condition: state
              entity_id: sensor.go_e_22kw_car
              state:
              - ID.4
          sequence:
          - action: switch.turn_on
            metadata: {}
            target:
              entity_id: switch.wvgzzze2zpe005371_charging
            data: {}
          alias: 'Start Charging ID.4 and force the update '
      - alias: Wait up to 5 mins for power to rise above 50W, indicating a successful
          Charging Start
        wait_for_trigger:
        - trigger: numeric_state
          entity_id:
          - sensor.go_echarger_270862_nrg_12
          - sensor.go_echarger_252682_nrg_12
          above: 50
        timeout:
          hours: 0
          minutes: 5
          seconds: 0
          milliseconds: 0
        continue_on_timeout: true
      - alias: Fallback if not charging then re-enable Battery
        if:
        - condition: template
          value_template: '{{ not wait.completed }}'
        then:
        - alias: If Car is connected to 22kW Charger then stop charging
          if:
          - condition: state
            entity_id: binary_sensor.go_echarger_252682_car
            state: 'on'
          then:
          - action: script.retry_action_with_backoff
            metadata: {}
            data:
              max_retries: 10
              base_delay: 5
              max_delay: 60
              backoff_type: simple
              notify_on_failure: true
              notify_service: notify.duncan
              entity_id: select.go_echarger_252682_frc
              target_state: custom
              custom_action:
              - action: select.select_option
                metadata: {}
                data:
                  option: Don't charge
                target:
                  entity_id:
                  - select.go_echarger_252682_frc
              custom_target_state: Don't charge
        - alias: If Car is connected to 11kW Charger then stop charging
          if:
          - condition: state
            entity_id: binary_sensor.go_echarger_270862_car
            state: 'on'
          then:
          - action: script.retry_action_with_backoff
            metadata: {}
            data:
              max_retries: 10
              base_delay: 5
              max_delay: 60
              backoff_type: simple
              notify_on_failure: true
              notify_service: notify.duncan
              entity_id: select.go_echarger_270862_frc
              target_state: custom
              custom_action:
              - action: select.select_option
                metadata: {}
                data:
                  option: Don't charge
                target:
                  entity_id:
                  - select.go_echarger_270862_frc
              custom_target_state: Don't charge
        - alias: Only wait for power if above threshold
          if:
          - condition: or
            conditions:
            - condition: numeric_state
              entity_id: sensor.go_echarger_270862_nrg_12
              above: 5
            - condition: numeric_state
              entity_id: sensor.go_echarger_252682_nrg_12
              above: 5
          then:
          - wait_for_trigger:
            - trigger: numeric_state
              entity_id:
              - sensor.go_echarger_270862_nrg_12
              below: 5
            - trigger: numeric_state
              entity_id:
              - sensor.go_echarger_252682_nrg_12
              below: 5
            timeout:
              hours: 0
              minutes: 1
              seconds: 0
              milliseconds: 0
            continue_on_timeout: true
        - if:
          - condition: and
            conditions:
            - condition: numeric_state
              entity_id: sensor.go_echarger_270862_nrg_12
              below: 5
            - condition: numeric_state
              entity_id: sensor.go_echarger_252682_nrg_12
              below: 5
          then:
          - action: script.retry_action_with_backoff
            metadata: {}
            data:
              action_domain: switch
              action_type: turn_on
              max_retries: 10
              base_delay: 5
              max_delay: 60
              backoff_type: simple
              notify_on_failure: true
              notify_service: notify.duncan
              entity_id: switch.esp32_s3_zero_deye8k_time_of_use
              target_state: 'on'
            alias: Turn Battery On via retry Script
          else:
          - action: notify.duncan
            data:
              title: Octopus night recovery
