    - sensor.total_money_generated
    below: 1
  - trigger: numeric_state
    entity_id:
    - sensor.total_money_generated
    for:
      hours: 0
      minutes: 3
      seconds: 0
    below: 1
  - trigger: numeric_state
    entity_id:
    - sensor.total_money_generated
    for:
      hours: 0
      minutes: 10
      seconds: 0
    below: 1
  - trigger: numeric_state
