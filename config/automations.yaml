- id: '1734549334887'
  alias: Nightly Battery Energy Charged
  description: ''
  triggers:
  - event: sunrise
    offset: 0
    id: Rise
    trigger: sun
  - event: sunset
    offset: 0
    id: Set
    trigger: sun
  conditions: []
  actions:
  - alias: 'Save last night '
    if:
    - condition: trigger
      id:
      - Rise
    then:
    - action: input_number.set_value
      metadata: {}
      data:
        value: '{{ states(''sensor.day_night_battery_charged_energy'') | float(0)
          | round(2) }}

          '
      target:
        entity_id: input_number.last_night_battery_charged
    - delay:
        hours: 0
        minutes: 10
        seconds: 0
        milliseconds: 0
    - action: homeassistant.turn_on
      metadata: {}
      data: {}
      target:
        entity_id: input_boolean.day_or_night
  - alias: Save last day
    if:
    - condition: trigger
      id:
      - Set
    then:
    - action: input_number.set_value
      metadata: {}
      data:
        value: '{{ states(''sensor.day_night_battery_charged_energy'') | float(0)
          | round(2) }}

          '
      target:
        entity_id: input_number.last_day_battery_charged
    - action: homeassistant.turn_off
      metadata: {}
      data: {}
      target:
        entity_id: input_boolean.day_or_night
  - alias: Reset at sunrise or sunset
    if:
    - condition: trigger
      id:
      - Set
      - Rise
    then:
    - delay:
        hours: 0
        minutes: 0
        seconds: 1
        milliseconds: 0
    - action: utility_meter.reset
      data: {}
      target:
        entity_id: sensor.day_night_battery_charged_energy
  mode: parallel
  max: 10
