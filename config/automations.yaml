- id: '1709073413848'
  alias: Auto Boiler
  description: "## \U0001F525 Auto Boiler  \n\n### \U0001F4CB **Boiler Automation
    and Energy Management**  \nThis automation controls the boiler based on a schedule,
    optimizes energy usage, and notifies if the water temperature is too low.  \n\nIt
    automatically runs the energy-saving script when the boiler turns on and ensures
    notifications are sent if the water temperature drops below 30°C.  \n\n---\n\n###
    ⏰ **Triggers**  \n\n| Trigger Entity | Event / Condition | Trigger ID |\n|----------------|-----------------|------------|\n|
    `schedule.boiler_pumpe` | State changes from `null` → `on` | \"On\" |\n| `schedule.boiler_pumpe`
    | State changes from `null` → `off` | \"Off\" |\n| `script.boiler_save_energy_script`
    | State changes from `on` → `off` | \"Script finished\" |\n\n> **Note:** The first
    trigger starts the automation when the boiler schedule turns on, the second triggers
    when the schedule turns off, and the third ensures the energy-saving script is
    re-executed if needed.  \n\n---\n\n### ✅ **Conditions**  \n- No explicit conditions;
    triggers execute actions directly.  \n- Internal checks exist in actions, e.g.,
    numeric state for water temperature.  \n\n---\n\n### \U0001F3AF **Actions / Workflow**
    \ \n\n1. **On Trigger** (`schedule.boiler_pumpe` → on)  \n   - Checks if `sensor.boiler_temperature`
    < 30°C  \n     - Sends notification:  \n       `Das Wasser hat nur {{ states('sensor.boiler_temperature')
    | float(0)| round(0) }}°C!`  \n   - Executes `script.boiler_save_energy_script`
    to optimize energy usage  \n\n2. **Off Trigger** (`schedule.boiler_pumpe` → off)
    \ \n   - Turns off the boiler switch (`switch.zirkulationspumpe_zigbee`)  \n\n3.
    **Script Finished Trigger** (`script.boiler_save_energy_script` → off)  \n   -
    If `schedule.boiler_pumpe` is still on, re-executes the energy-saving script  \n
    \  - Ensures boiler remains optimized if still in the scheduled timeframe  \n\n---\n\n###
    \U0001F527 **Technical Specs**  \n- **Mode:** `queued` (max 10 concurrent)  \n-
    **Energy Management:** Uses `script.boiler_save_energy_script` to optimize consumption
    \ \n- **Notifications:** Sends a message to `notify.duncan` if water < 30°C  \n-
    **Devices Controlled:** Boiler switch device (`switch.zirkulationspumpe_zigbee`)
    \ \n\n---\n\n### ⚡ **Notes / Best Practices**  \n- Minimizes energy waste by automating
    the boiler only when needed.  \n- Notification threshold can be adjusted for personal
    preference.  \n- Queued mode prevents overlapping executions if triggers occur
    in rapid succession.\n"
  triggers:
  - entity_id:
    - schedule.boiler_pumpe
    from:
    to: 'on'
    id: 'On'
    for:
      hours: 0
      minutes: 0
      seconds: 0
    trigger: state
  - entity_id:
    - schedule.boiler_pumpe
    from:
    to: 'off'
    id: 'Off'
    trigger: state
  - trigger: state
    entity_id:
    - script.boiler_save_energy_script
    to: 'off'
    from: 'on'
    id: Script finished
  - trigger: homeassistant
    event: start
    id: HA Start
  conditions: []
  actions:
  - if:
    - condition: trigger
      id:
      - HA Start
    then:
    - delay:
        hours: 0
        minutes: 0
        seconds: 30
        milliseconds: 0
    alias: HA Startup Delay
  - alias: On Schedule
    if:
    - condition: trigger
      id:
      - 'On'
    then:
    - action: script.boiler_save_energy_script
      metadata: {}
      data: {}
    - alias: Notify of not enough warm water
      if:
      - condition: numeric_state
        entity_id: sensor.boiler_temperature
        below: 30
      then:
      - metadata: {}
        data:
          message: Das Wasser hat nur {{ states('sensor.boiler_temperature') | float(0)|
            round(0) }}°C!
          data:
            tag: boiler_low_temp
        action: notify.duncan
      - wait_for_trigger:
        - trigger: numeric_state
          entity_id:
          - sensor.boiler_temperature
          above: 35
        timeout:
          hours: 0
          minutes: 5
          seconds: 0
          milliseconds: 0
        continue_on_timeout: true
      - if:
        - condition: template
          value_template: '{{ wait.completed }}'
        then:
        - metadata: {}
          data:
            message: clear_notification
            data:
              tag: boiler_low_temp
          action: notify.duncan
  - alias: Off Schedule
    if:
    - condition: trigger
      id:
      - 'Off'
    then:
    - action: script.retry_action_with_backoff_power_monitoring
      metadata: {}
      data:
        action_domain: switch
        action_type: turn_off
        max_retries: 10
        base_delay: 5
        max_delay: 60
        backoff_type: simple
        notify_on_failure: true
        notify_service: notify.duncan
        entity_id: switch.zirkulationspumpe_zigbee
        target_state: 'off'
      alias: Turn off outlet
    - action: script.turn_off
      metadata: {}
      target:
        entity_id: script.boiler_save_energy_script
      data: {}
      alias: Stopp running script
  - alias: Re Execute if Still in Time Frame
    if:
    - condition: trigger
      id:
      - Script finished
      - HA Start
    - condition: state
      entity_id: schedule.boiler_pumpe
      state: 'on'
    then:
    - action: script.boiler_save_energy_script
      metadata: {}
      data: {}
    else:
    - action: script.retry_action_with_backoff_power_monitoring
      metadata: {}
      data:
        action_domain: switch
        action_type: turn_off
        max_retries: 10
        base_delay: 5
        max_delay: 60
        backoff_type: simple
        notify_on_failure: true
        notify_service: notify.duncan
        target_state: 'off'
        entity_id: switch.zirkulationspumpe_zigbee
  mode: queued
  max: 10
- id: '1710427927351'
  alias: 'Daily Energy Summary '
  description: "## \U0001F31E Daily Energy Summary Automation\n\n### \U0001F4CB **Purpose**\n\nThis
    automation provides a comprehensive daily energy summary for your household. It
    sends notifications at sunrise, sunset, and midnight with summaries of energy
    usage, appliance activity, EV charging, and solar forecasts. The automation can
    be selectively enabled or disabled via input booleans.\n\n---\n\n### ⏰ **Triggers**\n\n|
    Trigger | Description | Trigger ID |\n|---------|------------|------------|\n|
    Time | 23:59:55 (end of day) | Day End |\n| Sun | Sunrise | Rise |\n| Sun | Sunset
    | Set |\n\n> Note: Sunrise and sunset triggers provide summaries and forecasts,
    while the midnight trigger ensures end-of-day summaries and appliance logging.\n\n---\n\n###
    ✅ **Conditions**\n\n- Conditional notifications are controlled via input booleans:
    \ \n  - `input_boolean.automation_enable_sunrise`  \n  - `input_boolean.automation_enable_sunset`
    \ \n  - `input_boolean.automation_enable_midnight`  \n  - `input_boolean.automation_enable_appliance`
    \ \n  - `input_boolean.automation_enable_go_echarger`  \n  - `input_boolean.automation_enable_forecast`
    \ \n\n---\n\n### \U0001F3AF **Actions / Workflow**\n\n1. **Sunrise Message**  \n
    \  - Sends `sensor.energy_summary_1st_block` and `sensor.energy_summary_1st_block_2`
    if enabled.  \n\n2. **Sunset Message**  \n   - Sends the same energy summary as
    sunrise if enabled.  \n\n3. **Midnight Message**  \n   - Sends energy summary
    at day end if enabled.  \n\n4. **Appliance Summary (Day End)**  \n   - Sends `sensor.appliance_used`
    if appliance reporting is enabled.  \n\n5. **EV Charging Notification (Sunset)**
    \ \n   - Checks `sensor.daily_energy_goe_11kw` and `sensor.daily_energy_goe_22kw`.
    \ \n   - Sends notification detailing 11kW, 22kW, and total charged energy if
    enabled.  \n   - Adds a 5-second delay before reporting to ensure data availability.
    \ \n\n6. **Reset EV Messages Counter (Day End)**  \n   - Resets `counter.ev_charging_messages`
    to 0.  \n\n7. **Solar Forecast Notifications**  \n   - Sunset: Sends tomorrow's
    solar forecast (`sensor.solar_forecast_text_tomorrow`) if enabled.  \n   - Sunrise:
    Sends today's solar forecast (`sensor.solar_forecast_text_today`) if enabled.
    \ \n\n---\n\n### \U0001F527 **Technical Specs**\n\n- **Mode:** `parallel` (max
    10 concurrent notifications)  \n- **Notification Target:** `notify.duncan`  \n-
    **Controlled Input Booleans:** Enables/disables specific message categories.  \n-
    **Counters:** Tracks EV charging messages and resets daily.\n\n---\n\n### ⚡ **Notes
    / Best Practices**\n\n- Conditional triggers prevent unnecessary messages if certain
    summaries are disabled.  \n- Includes slight delays where necessary to ensure
    sensor data is accurate before notification.  \n- Forecast and EV notifications
    provide actionable insights for daily energy planning.  \n- Easily extendable
    with new summary sensors or notification channels.\n"
  triggers:
  - at: '23:59:55'
    id: Day End
    trigger: time
  - event: sunrise
    offset: 0
    id: Rise
    trigger: sun
  - event: sunset
    offset: 0
    id: Set
    trigger: sun
  conditions: []
  actions:
  - alias: 'Message rise '
    if:
    - condition: trigger
      id:
      - Rise
    - condition: state
      entity_id: input_boolean.automation_enable_sunrise
      state: 'on'
    then:
    - data:
        title: 'Daily Energy Summary:'
        message: '{{ states(''sensor.energy_summary_1st_block'') }}


          {{ states(''sensor.energy_summary_1st_block_2'') }}

          '
        data:
          tag: summary_sunrise
      action: notify.duncan
  - alias: 'Message sunset '
    if:
    - condition: trigger
      id:
      - Set
    - condition: state
      entity_id: input_boolean.automation_enable_sunset
      state: 'on'
    then:
    - data:
        title: 'Daily Energy Summary:'
        message: '{{ states(''sensor.energy_summary_1st_block'') }}


          {{ states(''sensor.energy_summary_1st_block_2'') }}

          '
        data:
          tag: summary_sunset
      action: notify.duncan
  - parallel:
    - alias: 'Message midnight '
      if:
      - condition: trigger
        id:
        - Day End
      - condition: state
        entity_id: input_boolean.automation_enable_midnight
        state: 'on'
      then:
      - data:
          title: Daily Energy Summary
          message: '{{ states(''sensor.energy_summary_1st_block'') }}


            {{ states(''sensor.energy_summary_1st_block_2'') }}

            '
          data:
            tag: summary_midnight
        action: notify.duncan
    - alias: Appliances
      if:
      - condition: trigger
        id:
        - Day End
      - condition: state
        entity_id: input_boolean.automation_enable_appliance
        state: 'on'
      then:
      - data:
          title: 'Appliance Summary:'
          message: '{{ states(''sensor.appliance_used'') }}

            '
          data:
            tag: appliances
        action: notify.duncan
  - alias: Sunset Notification
    if:
    - condition: trigger
      id:
      - Set
    then:
    - alias: 'Go-eCharger '
      if:
      - condition: state
        entity_id: input_boolean.automation_enable_go_echarger
        state: 'on'
      then:
      - delay:
          hours: 0
          minutes: 0
          seconds: 5
          milliseconds: 0
      - alias: Goe
        if:
        - condition: or
          conditions:
          - condition: numeric_state
            entity_id: sensor.daily_energy_goe_11kw
            above: 0
          - condition: numeric_state
            entity_id: sensor.daily_energy_goe_22kw
            above: 0
        then:
        - metadata: {}
          data:
            title: Charged Energy
            message: '{{ "- 11kW: " + states(''sensor.daily_energy_goe_11kw'')|float(0)|round(2)|string
              + ''kWh'' if states(''sensor.daily_energy_goe_11kw'')|float(0)|round(2)
              > 0 else ''''}}

              {{ "- 22kW: " + states(''sensor.daily_energy_goe_22kw'')|float(0)|round(2)|string
              + ''kWh'' if states(''sensor.daily_energy_goe_22kw'')|float(0)|round(2)
              > 0 else ''''}}

              {{ " Total: " + (states(''sensor.daily_energy_goe_22kw'')|float(0)|round(2)
              + states(''sensor.daily_energy_goe_11kw'')|float(0)|round(2))|round(2)|string
              + "kWh" if states(''sensor.daily_energy_goe_22kw'')|float(0)|round(2)
              > 0 and states(''sensor.daily_energy_goe_11kw'')|float(0)|round(2) >
              0}}

              '
            data:
              tag: goe_energy_today
          action: notify.duncan
  - alias: Reset EV Messages Counter
    if:
    - condition: trigger
      id:
      - Day End
    then:
    - metadata: {}
      data: {}
      target:
        entity_id: counter.ev_charging_messages
      action: counter.reset
    - action: counter.reset
      metadata: {}
      data: {}
      target:
        entity_id:
        - counter.db_purge_failure
        - counter.db_purge_success
  - alias: Forecast tomorrow
    if:
    - condition: trigger
      id:
      - Set
    - condition: state
      entity_id: input_boolean.automation_enable_forecast
      state: 'on'
    then:
    - data:
        title: 'Solar Forecast Tomorrow:'
        message: '{{ states(''sensor.solar_forecast_text_tomorrow'') }}

          '
        data:
          tag: forecast_tomorrow
      action: notify.duncan
  - alias: Forecast today
    if:
    - condition: trigger
      id:
      - Rise
    - condition: state
      entity_id: input_boolean.automation_enable_forecast
      state: 'on'
    then:
    - data:
        title: 'Solar Forecast Today:'
        message: '{{ states(''sensor.solar_forecast_text_today'') }}

          '
        data:
          tag: forecast_today
      action: notify.duncan
  mode: parallel
  max: 10
- id: '1710589916637'
  alias: Fire Detection from Temperature Sensors
  description: This automation monitors temperature sensors for potential fire conditions.
    It sends notifications if the temperature exceeds a specified threshold, helping
    to ensure safety by alerting when fire risk is detected.
  triggers:
  - seconds: /15
    trigger: time_pattern
  conditions:
  - condition: template
    value_template: '{{ sensors != '''' }}'
  actions:
  - choose: []
    default:
    - metadata: {}
      data:
        message: Fire detected in {{sensors}}
      action: notify.duncan
    - metadata: {}
      data:
        message: Feuer erkannt bei {{sensors}}
      action: notify.familie
      enabled: false
  variables:
    threshold: 45
    include:
      entity_id:
      - sensor.esp32_c3_mini_terra_duncan_room_temperature
      - sensor.esp32_c3_zero_epever_bme280_temperature
      - sensor.inverter_battery_temperature
      - sensor.esphome_az_envy_2_temperature_gartenhaus
      - sensor.esphome_az_envy_1_temperature_heizraum
      - sensor.esphome_az_envy_3_temperature_3d_printer
      - sensor.gw1100a_indoor_temperature
      - sensor.t_h_duncan_zigbee_temperature
      - sensor.t_h_waschkuche_zigbee_temperature
      - sensor.t_h_weinkeller_zigbee_temperature
      - sensor.t_h_bad_zigbee_temperature
      - sensor.t_h_kinderbad_zigbee_temperature
      - sensor.t_h_garage_zigbee_temperature
      - sensor.t_h_gasteklo_zigbee_temperature
      - sensor.t_h_hobbyraum_zigbee_temperature
      - sensor.treppenhaus_temperature
      - sensor.esp32_c3_zero_epever_battery_temperature
      - sensor.og_temperatur
      - sensor.eg_temperatur
      - sensor.kg_temperatur
    sensors: "{% set result = namespace(sensors=[]) %} {% for s in expand(include.entity_id)
      %}\n  {% if s.domain == 'sensor' %}\n    {% set u = s.attributes.unit_of_measurement
      | default('', true) %}\n    {% set v_raw = s.state | float(-999) %}\n    {%
      if v_raw != -999 %}\n      {% set v = (v_raw - 32) * 5/9 if u in ['°F','F','Fahrenheit']
      else v_raw %}\n      {% if v >= 0 and v > (threshold | float) %}\n        {%
      set result.sensors = result.sensors + [ s.name ~ ' (' ~ (v | round(2)) ~ ' °C)'
      ] %}\n      {% endif %}\n    {% endif %}\n  {% elif s.domain == 'binary_sensor'
      and s.state == 'on' %}\n    {% set result.sensors = result.sensors + [ s.name
      ] %}\n  {% endif %}\n{% endfor %} {{ result.sensors | join(', ') }}"
  mode: single
- id: '1710856538174'
  alias: Count Battery Full
  description: "  ## \U0001F50B Count Battery Full Automation\n\n  ### \U0001F4CB
    **Battery State Monitoring**\n  Monitors `sensor.esp32_c3_zero_epever_battery_voltage`
    to track **battery full/empty states**.  \n  Updates `input_boolean.battery_full`
    and logs charged energy when full.\n\n  ---\n\n  ### ⏰ **Triggers**\n  - **Full:**
    Voltage rises above **28.3 V**  \n  - **Empty:** Voltage drops below **24 V**
    \ \n\n  ---\n\n  ### ✅ **Conditions**\n  - **Full Trigger:** Executes if `battery_full`
    is **off**.  \n  - **Empty Trigger:** Executes only if `battery_full` is **on**.\n\n
    \ ---\n\n  ### \U0001F3AF **Actions**\n  - **Full:**  \n    - Turn on `input_boolean.battery_full`.
    \ \n    - Save current charged energy to `input_number.last_charged_energy_to_bkw_battery`.
    \ \n  - **Empty:**  \n    - Turn off `input_boolean.battery_full`.  \n\n  ---\n\n
    \ ### \U0001F527 **Specs**\n  - **Mode:** `single`  \n  - **Controlled Entities:**
    \ \n    - `input_boolean.battery_full`  \n    - `input_number.last_charged_energy_to_bkw_battery`
    \ \n  - **Monitored Entities:**  \n    - `sensor.esp32_c3_zero_epever_battery_voltage`
    \ \n    - `sensor.charged_energy_to_bkw_battery`"
  triggers:
  - entity_id:
    - sensor.esp32_c3_zero_epever_battery_voltage
    above: 28.3
    id: Full
    trigger: numeric_state
  - entity_id:
    - sensor.esp32_c3_zero_epever_battery_voltage
    below: 24
    id: Empty
    trigger: numeric_state
  conditions: []
  actions:
  - alias: Full
    if:
    - condition: trigger
      id:
      - Full
    - condition: state
      entity_id: input_boolean.battery_full
      state: 'off'
    - condition: numeric_state
      entity_id: sensor.charged_energy_to_bkw_battery
      above: 1.8
    then:
    - target:
        entity_id:
        - input_boolean.battery_full
      data: {}
      action: input_boolean.turn_on
    - action: input_number.set_value
      metadata: {}
      data:
        value: '{{ states(''sensor.charged_energy_to_bkw_battery'') | float(0) | round(3)
          }}

          '
      target:
        entity_id: input_number.last_charged_energy_to_bkw_battery
  - alias: Empty
    if:
    - condition: state
      entity_id: input_boolean.battery_full
      state: 'on'
    - condition: trigger
      id:
      - Empty
    then:
    - metadata: {}
      data: {}
      target:
        entity_id: input_boolean.battery_full
      action: input_boolean.turn_off
  mode: single
- id: '1711468239502'
  alias: BKw Control
  description: "## ⚡ BKW Control Automation\n\n### \U0001F4CB **Intelligent Solar
    & Battery Management**\n\nThis automation dynamically controls both the **BKW
    outlet** and the **Epever load output**\nto achieve maximum **solar self-consumption**
    and **battery utilization efficiency**.  \nIt continuously evaluates **PV generation**,
    **battery SoC**, **inverter operating mode**, and\n**system temperature**, deciding
    when to enable or disable loads — ensuring a safe and\noptimized power flow between
    solar, battery, and grid.\n\nAll switching operations are executed through  \n**`script.retry_action_with_backoff`**,
    providing **up to 10 retries** with **linear delay (1–60 s)**  \nto guarantee
    reliable command execution even in case of transient ZigBee or MQTT issues.\n\n---\n\n###
    ⏰ **Trigger Overview**\n\n| Type | Entity / Condition | ID | Purpose |\n|------|--------------------|----|----------|\n|
    `template` | *See detailed description below* | `on day` | Enable daytime loads
    under optimal solar/battery conditions |\n| `template` | *See detailed description
    below* | `off day` | Disable daytime loads when solar generation or inverter output
    drops |\n| `sun` | `sunset -00:15` | `on night` | Begin night-time discharge routine
    |\n| `numeric_state` | BKW outlet power < 50 W | `off night` | End discharge when
    no load remains |\n| `numeric_state` | Battery voltage < 24.45 V | `off night`
    | Battery safety cutoff |\n| `sun` | `sunrise +00:15` | `off night` | Reset after
    sunrise |\n\n---\n\n### \U0001F9E9 **Template Triggers Explained**\n\n#### ☀️
    `on day` — **Daytime Activation**\n**Purpose:**  \nEnables the **BKW outlet**
    and **Epever load** when solar and battery conditions are ideal,  \nensuring that
    excess energy is used locally instead of exported to the grid.\n\n**Logic Overview:**\n-
    Triggered when:\n  - **Inverter mode** = “FeedIn” (solar surplus available)  \n
    \ - **Battery SoC ≥ 80 %**  \n  - **PV production > 2000 W**  \n  - **Temperature
    < 44 °C**  \n  - **Battery Full flag active** (`input_boolean.battery_full = on`)
    \ \n  - **BKW outlet currently off**\n\nOnce all conditions are true, the system
    safely enables both outputs to maximize\nsolar utilization while avoiding unnecessary
    grid feed-in.\n\n**Effect:**\n- Turns **on**:\n  - `switch.esp32_c3_zero_epever_manual_control_the_load`\n
    \ - `switch.bkw_outlet_1_bkw_outlet_1`\n- Uses `script.retry_action_with_backoff`
    for reliable command execution.\n- Transitions to *“active solar usage”* mode.\n\n---\n\n####
    \U0001F324️ `off day` — **Daytime Deactivation**\n**Purpose:**  \nDisables the
    **BKW outlet** when solar generation or inverter output becomes insufficient  \nto
    maintain stable self-powering, avoiding oscillation and unnecessary battery drain.\n\n**Logic
    Overview:**\n- Triggered when:\n  - **PV power < 175 W** **or**\n  - **Inverter
    PV power < 2000 W**  \n- **AND**:\n  - **BKW outlet is currently on**\n  - **Sun
    is above the horizon**\n\nThis ensures that low or unstable solar production causes
    a controlled shutdown  \nof the BKW outlet.\n\n**Effect:**\n- Turns **off** `switch.bkw_outlet_1_bkw_outlet_1`\n-
    Keeps **Epever load active**\n- Uses retry script to ensure safe command execution\n-
    Prevents power oscillations under transient PV conditions (e.g. cloud cover)\n\n---\n\n###
    \U0001F319 **Nighttime Operation**\n\n#### \U0001F314 `on night`\n- Triggered
    **15 minutes before sunset** when `input_boolean.battery_full` = `on`.\n- Enables
    **both loads**, increments `counter.battery_full`, and resets charge/discharge
    meters.\n- Waits up to **30 s** for outlet power > 10 W — otherwise notifies `notify.duncan`
    of a possible issue.\n\n#### \U0001F318 `off night`\n- Deactivates outlet and
    load if:\n  - Power < 50 W, or\n  - Battery < 24.45 V, or\n  - After sunrise (+15
    min).\n- Updates counters and energy records accordingly.\n\n---\n\n### ⚙️ **Technical
    Overview**\n\n- **Mode:** `queued` (max 15)\n- **Execution:** via `script.retry_action_with_backoff`\n-
    **Template Logic:**  \n  - “On Day” = activation under high PV + full battery
    \ \n  - “Off Day” = deactivation under low PV or inverter power  \n- **Controlled
    Entities:**\n  - `switch.bkw_outlet_1_bkw_outlet_1`\n  - `switch.esp32_c3_zero_epever_manual_control_the_load`\n-
    **Key Inputs:**\n  - `sensor.epever_pv_power`\n  - `sensor.inverter_pv_power`\n
    \ - `sensor.epever_battery_soc`\n  - `sensor.epever_temperature`\n  - `input_boolean.battery_full`\n
    \ - `sun.sun`\n- **Safety Mechanisms:**\n  - Retry/backoff on all switch actions\n
    \ - Power and voltage thresholds for cutoff\n  - Separate night/day operation
    paths\n\n---\n\n### \U0001F4A1 **Notes**\n- Both **template triggers** replace
    older numeric thresholds, reducing complexity and improving reliability.  \n-
    The system adapts dynamically to inverter and PV data, not fixed wattage cutoffs.
    \ \n- No `last_changed` or manual cooldown logic is used — stability is achieved
    purely through\n  **conditional evaluation within the template triggers**.  \n-
    Designed for continuous operation with **safe fallback states** after restarts.\n"
  triggers:
  - alias: On Day
    trigger: template
    value_template: "    {{\n      is_state('sensor.scb_inverter_state', 'FeedIn')\n
      \     and is_state('input_boolean.battery_full', 'on')\n      and states('sensor.esp32_c3_zero_epever_battery_soc')|float(0)
      >= 80\n      and states('sensor.inverter_pv_power')|float(0) > 2125\n      and
      states('sensor.esp32_c3_zero_epever_device_temperature')|float(0) < 44\n      and
      is_state('switch.bkw_outlet_1_bkw_outlet_1','off')\n    }}"
    id: on day
    for:
      hours: 0
      minutes: 0
      seconds: 30
  - alias: Off Day (Unified Template)
    id: off day
    trigger: template
    value_template: "      {% set pv_array = states('sensor.esp32_c3_zero_epever_pv_array_input_power')
      | float(0) %}\n      {% set inverter_pv = states('sensor.inverter_pv_power')
      | float(0) %}\n      {% set outlet_on = is_state('switch.bkw_outlet_1_bkw_outlet_1','on')
      %}\n      {% set sun_above = is_state('sun.sun','above_horizon') %}\n      {{\n
      \       outlet_on\n        and sun_above\n        and \n        (\n          pv_array
      < 175\n          or inverter_pv < 2250\n        )\n      }}"
    for:
      hours: 0
      minutes: 0
      seconds: 30
  - event: sunset
    offset: -00:15:00
    id: on night
    trigger: sun
    alias: On Night sunset
  - trigger: numeric_state
    entity_id:
    - sensor.bkw_outlet_1_energy_power
    below: 50
    id: off night
    alias: Off Night Power output
  - entity_id:
    - sensor.esp32_c3_zero_epever_battery_voltage
    id: off night
    below: 24.45
    trigger: numeric_state
    alias: Off Night Battery
  - event: sunrise
    offset: +00:15:00
    id: off night
    trigger: sun
    enabled: true
    alias: Off Night sunrise
  conditions:
  - condition: or
    conditions:
    - condition: or
      conditions:
      - condition: state
        entity_id: input_boolean.battery_full
        state: 'on'
      - condition: numeric_state
        entity_id: sensor.esp32_c3_zero_epever_battery_voltage
        above: 27.75
    - condition: and
      conditions:
      - condition: numeric_state
        entity_id: sensor.inverter_pv_power
        below: 2001
      - condition: state
        entity_id: switch.bkw_outlet_1_bkw_outlet_1
        state: 'on'
  actions:
  - alias: on day
    if:
    - condition: trigger
      id:
      - on day
    then:
    - action: script.retry_action_with_backoff
      metadata: {}
      data:
        action_domain: switch
        action_type: turn_on
        max_retries: 10
        base_delay: 1
        max_delay: 60
        backoff_type: linear
        entity_id: switch.esp32_c3_zero_epever_manual_control_the_load
        target_state: 'on'
    - action: script.retry_action_with_backoff
      metadata: {}
      data:
        action_domain: switch
        action_type: turn_on
        max_retries: 10
        base_delay: 1
        max_delay: 60
        backoff_type: linear
        entity_id: switch.bkw_outlet_1_bkw_outlet_1
        target_state: 'on'
  - alias: off day
    if:
    - condition: and
      conditions:
      - condition: sun
        before: sunset
        after: sunrise
        after_offset: -00:16:00
        before_offset: -00:16:00
      - condition: trigger
        id:
        - off day
    then:
    - action: script.retry_action_with_backoff
      metadata: {}
      data:
        action_domain: switch
        action_type: turn_off
        max_retries: 10
        base_delay: 1
        max_delay: 60
        backoff_type: linear
        entity_id: switch.bkw_outlet_1_bkw_outlet_1
        target_state: 'off'
  - alias: on night
    if:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - on night
      - condition: state
        entity_id: input_boolean.battery_full
        state: 'on'
    then:
    - action: script.retry_action_with_backoff
      metadata: {}
      data:
        action_domain: switch
        action_type: turn_on
        max_retries: 10
        base_delay: 1
        max_delay: 60
        backoff_type: linear
        entity_id: switch.esp32_c3_zero_epever_manual_control_the_load
        target_state: 'on'
    - action: script.retry_action_with_backoff
      metadata: {}
      data:
        action_domain: switch
        action_type: turn_on
        max_retries: 10
        base_delay: 1
        max_delay: 60
        backoff_type: linear
        entity_id: switch.bkw_outlet_1_bkw_outlet_1
        target_state: 'on'
    - metadata: {}
      data: {}
      target:
        entity_id: counter.battery_full
      action: counter.increment
    - action: utility_meter.calibrate
      metadata: {}
      data:
        value: '0.0'
      target:
        entity_id:
        - sensor.charged_energy_to_bkw_battery
        - sensor.discharged_energy_from_bkw_battery
    - if:
      - condition: numeric_state
        entity_id: sensor.bkw_outlet_1_energy_power
