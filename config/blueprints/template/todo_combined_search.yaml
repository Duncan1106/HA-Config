blueprint:
  name: "Combined & Filtered To-do Lists"
  description: "Creates a combined sensor from multiple To-do lists with search/filter capabilities."
  domain: template
  input:
    todo_lists:
      name: To-do Lists
      selector:
        entity:
          filter:
            - domain: todo
          multiple: true
    search_input:
      name: Search Input (Text)
      selector:
        entity:
          filter:
            - domain: input_text
    update_button:
      name: Update Button
      selector:
        entity:
          filter:
            - domain: input_button
variables:
  todo_lists_var: !input todo_lists
  search_input_var: !input search_input
  update_button_var: !input update_button
trigger:
  - platform: event
    event_type: event_template_reloaded
  - platform: homeassistant
    event: start
  - platform: state
    entity_id: !input search_input
  - platform: state
    entity_id: !input update_button
  - platform: state
    entity_id: !input todo_lists

action:
  - action: todo.get_items
    data:
      status: needs_action
    target:
      entity_id: !input todo_lists
    response_variable: all_todo_items
    
sensor:
  - name: "Combined Filtered Items"
    unique_id: "combined_todo_{{ search_input_var | replace('.', '_') }}"
    state: >
      {% set input = states(search_input_var) | default('') | lower %}
      {% set has_filter = 'todo:' in input %}
      {% set filter_key = (input.split('todo:')[1].split(' ')[0]) if has_filter else '' %}
      {% set search_term = input.split('todo:' ~ filter_key)[1] | trim if has_filter else input %}
      
      {% if all_todo_items is not defined or all_todo_items is not mapping %}
        unknown
      {% else %}
        {% set available = all_todo_items.keys() | list %}
        {% set missing = todo_lists_var | reject('in', available) | list %}
        {% if missing | length > 0 %}
          unknown
        {% else %}
          {% set filtered_lists = todo_lists_var | select('search', filter_key) | list if filter_key else todo_lists_var %}
          {% if filtered_lists | length == 0 %}{% set filtered_lists = todo_lists_var %}{% endif %}
          {% set count = namespace(total=0) %}
          {% set terms = search_term.split() %}
          {% for list_id in filtered_lists %}
            {% for item in all_todo_items[list_id].get('items', []) %}
              {% if item.summary is defined %}
                {% if search_term == '' or (terms | select('in', (item.summary | lower)) | list | count == terms | count) %}
                  {% set count.total = count.total + 1 %}
                {% endif %}
              {% endif %}
            {% endfor %}
          {% endfor %}
          {{ count.total }}
        {% endif %}
      {% endif %}
    attributes:
      source_map: >
        {% set ns = namespace(source_map={}) %}
        {% for entity_id in todo_lists_var %}
          {% set fn_raw = state_attr(entity_id, 'friendly_name') | default(entity_id.split('.')[-1] | replace('_', ' ') | title, true) %}
          {% set fn = fn_raw | replace('"', '') | replace("'", '') | regex_replace('\\s+', ' ') | trim %}
          {% set ns.source_map = ns.source_map | combine({ (loop.index|string): {'entity_id': entity_id, 'friendly_name': fn} }) %}
        {% endfor %}
        {{ ns.source_map | to_json }}
      filtered_items: >
        {% set input = states(search_input_var) | default('') | lower %}
        {% set has_filter = 'todo:' in input %}
        {% set filter_key = (input.split('todo:')[1].split(' ')[0]) if has_filter else '' %}
        {% set search_term = input.split('todo:' ~ filter_key)[1] | trim if has_filter else input %}
        {% if all_todo_items is defined and all_todo_items is mapping %}
          {% set ns2 = namespace(index_map={}) %}
          {% for entity_id in todo_lists_var %}
            {% set ns2.index_map = ns2.index_map | combine({ (entity_id): loop.index|string }) %}
          {% endfor %}
          {% set filtered_lists = todo_lists_var | select('search', filter_key) | list if filter_key else todo_lists_var %}
          {% if filtered_lists | length == 0 %}{% set filtered_lists = todo_lists_var %}{% endif %}
          {% set combined = namespace(items=[]) %}
          {% set terms = search_term.split() %}
          {% for list_id in filtered_lists %}
            {% for item in all_todo_items[list_id].get('items', []) %}
              {% if item.summary is defined %}
                {% if (search_term == '' or (terms | select('in', (item.summary | lower)) | list | count == terms | count)) %}
                  {% set combined.items = combined.items + [{
                    'u': item.uid,
                    's': item.summary,
                    'd': item.get('description', '') | string,
                    'c': ns2.index_map[list_id]
                  }] %}
                {% endif %}
              {% endif %}
            {% endfor %}
          {% endfor %}
          {{ combined.items | sort(attribute='s', case_sensitive=False) | to_json }}
        {% else %} []
        {% endif %}