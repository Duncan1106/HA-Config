template:
  # Ambient Lights
  - trigger:
      - trigger: homeassistant
        event: start
      - platform: event
        event_type: event_template_reloaded
      - platform: state
        entity_id:
          - binary_sensor.workday_sensor
          - sun.sun
      - platform: time
        at:
          - "04:30:01"
          - "06:00:01"
          - "10:00:01"
          - "22:30:01"
          - "23:00:01"
      - platform: sun
        event: sunrise
        offset: "+00:15:01"
      - platform: sun
        event: sunset
        offset: "-00:29:59"
      - platform: sun
        event: sunset
        offset: "-00:44:59"
    binary_sensor:
      - name: Ambient Lights
        unique_id: ambient_lights_schedule
        icon: mdi:led-strip
        variables:
          time: "{{ now().strftime('%H:%M') }}"
          workday: "{{ is_state('binary_sensor.workday_sensor', 'on') }}"
          next_rising: "{{ state_attr('sun.sun', 'next_rising') }}"
          next_setting: "{{ state_attr('sun.sun', 'next_setting') }}"
          sunrise_15_hhmm: >
            {% set dt = next_rising | as_datetime %}
            {{ (dt | as_local + timedelta(minutes=15)).strftime('%H:%M') if dt is not none else '00:00' }}
          sunset_30_hhmm: >
            {% set dt = next_setting | as_datetime %}
            {{ (dt | as_local - timedelta(minutes=30)).strftime('%H:%M') if dt is not none else '00:00' }}
          sunset_45_hhmm: >
            {% set dt = next_setting | as_datetime %}
            {{ (dt | as_local - timedelta(minutes=45)).strftime('%H:%M') if dt is not none else '00:00' }}
          weekday_morning_on: '04:30'
          weekday_evening_off: '22:30'
          weekend_morning_on: '06:00'
          weekend_morning_off: '10:00'
          weekend_evening_off: '23:00'
        availability: >
          {{ 
            states('binary_sensor.workday_sensor') not in ['unknown', 'unavailable']
            and states('sun.sun') not in ['unknown', 'unavailable']
            and next_rising is not none 
            and next_setting is not none 
          }}
        state: >
          {% if workday %}
            {% set morning_on = weekday_morning_on <= time < sunrise_15_hhmm %}
            {% set evening_on = sunset_30_hhmm <= time < weekday_evening_off %}
          {% else %}
            {% set morning_on = weekend_morning_on <= time < weekend_morning_off %}
            {% set evening_on = sunset_45_hhmm <= time < weekend_evening_off %}
          {% endif %}
          {{ morning_on or evening_on }}
        attributes:
          schedule_type: "{{ 'workday' if workday else 'weekend' }}"
          period: >
            {% if workday %}
              {% if weekday_morning_on <= time < sunrise_15_hhmm %} morning
              {% elif sunset_30_hhmm <= time < weekday_evening_off %} evening
              {% else %} off {% endif %}
            {% else %}
              {% if weekend_morning_on <= time < weekend_morning_off %} morning
              {% elif sunset_45_hhmm <= time < weekend_evening_off %} evening
              {% else %} off {% endif %}
            {% endif %}
          reason: >
            {% if workday %}
              {% if weekday_morning_on <= time < sunrise_15_hhmm %} Workday morning window: {{ weekday_morning_on }} - {{ sunrise_15_hhmm }}
              {% elif sunset_30_hhmm <= time < weekday_evening_off %} Workday evening window: {{ sunset_30_hhmm }} - {{ weekday_evening_off }}
              {% else %} Outside workday schedule {% endif %}
            {% else %}
              {% if weekend_morning_on <= time < weekend_morning_off %} Weekend morning window: {{ weekend_morning_on }} - {{ weekend_morning_off }}
              {% elif sunset_45_hhmm <= time < weekend_evening_off %} Weekend evening window: {{ sunset_45_hhmm }} - {{ weekend_evening_off }}
              {% else %} Outside weekend schedule {% endif %}
            {% endif %}
          updated: "{{ time }}"
          updated_by: "{{ trigger.description | default('manual') }}"
          