template:
# Timelapse 15s Pulse
  - trigger:
      - trigger: time_pattern
        seconds: "/15"
    binary_sensor:
      - name: "AnkerMake Snapshot Pulse"
        unique_id: ankermake_snapshot_pulse_15s
        state: >-
          {{ is_state('binary_sensor.ankerctl_lauft', 'on') 
             and states('sensor.ankermake_power') | float(0) > 15 }}
        auto_off: '00:00:01'