template:
  - trigger:
      - trigger: time
        at: "00:00:00"
        id: reset
      - trigger: state
        entity_id:
          - sensor.esp32_c3_zero_epever_bme280_temperature
          - sensor.bme280_temperature_min
          - sensor.solar_power_total
          - sensor.felicity_ess_soc_avg
          - sensor.gartenhaus_technik_energy_1
          - switch.gartenhaus_technik_1
        id: update

    binary_sensor:
      - name: "Garden House Heating Demand"
        default_entity_id: binary_sensor.garden_house_heating_demand
        unique_id: garden_house_heating_demand

        variables:
          # ── Thresholds (change here only) ───────────────────
          t_freeze:   1.5    # °C — current temp at/below → emergency
          t_min:      0.5    # °C — 24h min at/below → emergency (with t_cool)
          t_cool:     8.0    # °C — guard: 24h-min rule only if still cooler than this
          t_warm:     6.0    # °C — upper bound for opportunistic heating window
          t_hard_off: 11.0   # °C — hard thermal cutoff
          p_solar:    2000   # W  — solar power needed for opportunistic
          soc_min:    50     # %  — minimum battery SoC for opportunistic
          e_budget:   1.5    # kWh — daily heater energy budget

          # ── Inputs ──────────────────────────────────────────
          auto_on: >-
            {{ is_state('automation.garden_house_freeze_protection_heating', 'on') }}
          valid: >-
            {{ auto_on
               and states('sensor.esp32_c3_zero_epever_bme280_temperature') | is_number
               and states('sensor.solar_power_total') | is_number
               and states('sensor.gartenhaus_technik_energy_1') | is_number }}
          temp:       "{{ states('sensor.esp32_c3_zero_epever_bme280_temperature') | float(99) | round(2) }}"
          tmin:       "{{ states('sensor.bme280_temperature_min') | float(99) | round(2) }}"
          solar:      "{{ states('sensor.solar_power_total') | float(0) }}"
          battery:    "{{ states('sensor.felicity_ess_soc_avg') | float(0) }}"
          energy_now: "{{ states('sensor.gartenhaus_technik_energy_1') | float(0) }}"
          current_on: "{{ is_state('switch.gartenhaus_technik_1', 'on') }}"

          # ── Daily energy budget (self-resetting) ────────────
          # `this` is NOT available inside `variables:` for trigger-based
          # template entities. Read the previous attribute via state_attr()
          # instead — the new state hasn't been written yet during variable
          # rendering, so this returns the previous render's value.
          energy_start: >-
            {% set prev = state_attr('binary_sensor.garden_house_heating_demand',
                                     'energy_start_of_day') %}
            {{ energy_now | float(0) if (trigger.id | default('')) == 'reset'
               else (prev | float(0) if prev is not none else energy_now | float(0)) }}
          energy_today: "{{ (energy_now | float(0)) - (energy_start | float(0)) }}"

          # ── Rules ───────────────────────────────────────────
          r_hard_off:   "{{ temp | float(0) >= t_hard_off | float(0) }}"
          r_freeze_now: "{{ temp | float(0) <= t_freeze | float(0) }}"
          r_freeze_min: >-
            {{ tmin | float(0) <= t_min | float(0)
               and temp | float(0) < t_cool | float(0) }}
          r_opp: >-
            {{ t_freeze | float(0) < temp | float(0) < t_warm | float(0)
               and solar | float(0) >= p_solar | float(0)
               and energy_today | float(0) < e_budget | float(0)
               and battery | float(0) > soc_min | float(0) }}

          # ── Outcome ─────────────────────────────────────────
          branch: >-
            {%- if   current_on and r_hard_off -%}hard_cutoff
            {%- elif current_on                -%}latch_keep_on
            {%- elif r_freeze_now              -%}freeze_current
            {%- elif r_freeze_min              -%}freeze_24h_min
            {%- elif r_opp                     -%}opportunistic_solar
            {%- elif r_hard_off                -%}above_ceiling
            {%- else                          -%}idle{%- endif -%}
          decision: >-
            {{ (current_on and not r_hard_off)
               or (not current_on and not r_hard_off
                   and (r_freeze_now or r_freeze_min or r_opp)) }}

          # ── Trace metadata ──────────────────────────────────
          trig: >-
            {%- if trigger is not defined or trigger is none -%}startup
            {%- elif (trigger.id | default('')) == 'reset' -%}midnight_reset
            {%- elif trigger.platform == 'state' -%}{{ trigger.entity_id }}
            {%- else -%}{{ trigger.platform }}{%- endif -%}

        availability: "{{ valid }}"
        icon: "{{ 'mdi:fire' if decision else 'mdi:fire-off' }}"
        state: "{{ decision }}"
        attributes:
          energy_start_of_day: "{{ energy_start }}"
          energy_today_kwh:     "{{ energy_today | round(3) }}"
          budget_kwh:           "{{ e_budget }}"
          branch:               "{{ branch }}"
          trace: |
            {{ now().strftime('%H:%M:%S') }} → {{ 'ON' if decision else 'OFF' }} [{{ branch }}] via {{ trig }}
            in: temp={{ temp }}/{{ t_freeze }} tmin={{ tmin }}/{{ t_min }} solar={{ solar }}/{{ p_solar }} batt={{ battery }}/{{ soc_min }} E={{ energy_today | round(2) }}/{{ e_budget }} sw={{ 'on' if current_on else 'off' }}
            rules: hard_off{{ '✓' if r_hard_off else '✗' }} freeze_now{{ '✓' if r_freeze_now else '✗' }} freeze_min{{ '✓' if r_freeze_min else '✗' }} opp{{ '✓' if r_opp else '✗' }}