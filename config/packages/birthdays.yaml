template:
  # Birthdays
  - triggers:
    - trigger: homeassistant
      event: start
    - platform: event
      event_type: event_template_reloaded
    - platform: time_pattern
      hours: "/12"
    binary_sensor:
        - name: "Upcoming Birthdays"
          unique_id: upcoming_birthdays
          icon: mdi:cake-variant-outline
          variables:
            today_str: "{{ now().date() }}"
            birthday_entities: "{{ label_entities('birthday') | list }}"
            yr: "{{ now().year }}"
            nyr: "{{ now().year + 1 }}"
            is_leap: "{{ (now().year % 4 == 0 and now().year % 100 != 0) or (now().year % 400 == 0) }}"
            n_is_leap: "{{ ((now().year + 1) % 4 == 0 and (now().year + 1) % 100 != 0) or ((now().year + 1) % 400 == 0) }}"
          availability: "{{ label_entities('birthday') | count > 0 }}"
          state: >
              {% set today = as_datetime(today_str).date() %}
              {% set ns = namespace(active=false) %}
              {% for entity in birthday_entities %}
                {% set s = states(entity) %}
                {% if s and s | length >= 10 %}
                  {% set dob = strptime(s[:10], '%Y-%m-%d').date() %}
                  {% set b_day = dob.day if not (dob.month == 2 and dob.day == 29 and not is_leap | bool) else 28 %}
                  {% set next_birthday = dob.replace(year=yr|int, month=dob.month, day=b_day) %}
                  {% if next_birthday < today %}
                    {% set nb_day = dob.day if not (dob.month == 2 and dob.day == 29 and not n_is_leap | bool) else 28 %}
                    {% set next_birthday = dob.replace(year=nyr|int, month=dob.month, day=nb_day) %}
                  {% endif %}
                  {% if (next_birthday - today).days <= 4 %}
                    {% set ns.active = true %}
                  {% endif %}
                {% endif %}
              {% endfor %}
              {{ ns.active }}
          attributes:
              upcoming: >
                {% set today = as_datetime(today_str).date() %}
                {% set ns = namespace(data=[]) %}
                {% for entity in birthday_entities %}
                  {% set s = states(entity) %}
                  {% if s and s | length >= 10 %}
                    {% set dob = strptime(s[:10], '%Y-%m-%d').date() %}
                    {% set eff_m, eff_d = (dob.month, dob.day) if not (dob.month == 2 and dob.day == 29 and not is_leap | bool) else (2, 28) %}
                    {% set next_birthday = dob.replace(year=yr|int, month=eff_m, day=eff_d) %}
                    {% if next_birthday < today %}
                      {% set nb_day = dob.day if not (dob.month == 2 and dob.day == 29 and not n_is_leap | bool) else 28 %}
                      {% set next_birthday = dob.replace(year=nyr|int, month=dob.month, day=nb_day) %}
                    {% endif %}
                    
                    {% set days_until = (next_birthday - today).days %}
                    {% set age = next_birthday.year - dob.year %}
                    {% set label = '🎉 HEUTE' if days_until == 0 else ('MORGEN' if days_until == 1 else days_until ~ ' Tage') %}
                    {% set name = state_attr(entity, 'friendly_name') or entity %}
                    
                    {# Store as a list: [days_remaining, formatted_string] #}
                    {% set ns.data = ns.data + [[days_until, '🎂 ' ~ name ~ ': ' ~ label ~ ' – Alter: ' ~ age]] %}
                  {% endif %}
                {% endfor %}
                
                {# Sort by days, take the first one, and extract the string #}
                {% set sorted_list = ns.data | sort(attribute=0) %}
                {{ sorted_list[0][1] if sorted_list | count > 0 else 'Keine Geburtstage' }}
              ages: >
                {% set today = as_datetime(today_str).date() %}
                {% set ns = namespace(dict={}) %}
                {% for entity in birthday_entities %}
                  {% set s = states(entity) %}
                  {% if s and s | length >= 10 %}
                    {% set dob = strptime(s[:10], '%Y-%m-%d').date() %}
                    {% set eff_m, eff_d = (dob.month, dob.day) if not (dob.month == 2 and dob.day == 29 and not is_leap | bool) else (2, 28) %}
                    {% set age = yr|int - dob.year - (1 if (today.month, today.day) < (eff_m, eff_d) else 0) %}
                    {% set ns.dict = dict(ns.dict, **{(state_attr(entity, 'friendly_name') or entity): age}) %}
                  {% endif %}
                {% endfor %}
                {{ ns.dict }}