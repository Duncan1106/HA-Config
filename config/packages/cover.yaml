template:
  - cover:
      - device_class: window
        unique_id: wintergarten_dachfenster
        optimistic: false
        open_cover:
        - action: script.send_ir_remote_command
          data:
              button_label: window_open
        close_cover:
        - action: script.send_ir_remote_command
          data:
              button_label: window_close
        stop_cover:
        - action: script.send_ir_remote_command
          data:
              button_label: window_stop
        name: Wintergarten Dachfenster
        state: '{{ is_state(''binary_sensor.dachfenster_wintergarten'',''on'')  }}'

      - device_class: blind
        unique_id: wintergarten_rolladen_dachfenster
        optimistic: false
        open_cover:
            - action: script.send_ir_remote_command
              data:
                  button_label: rollo_open
        close_cover:
            - action: script.send_ir_remote_command
              data:
                  button_label: rollo_close
        stop_cover:
            - action: script.send_ir_remote_command
              data:
                  button_label: rollo_stop
        name: Wintergarten Rolladen Dachfenster
        state: "{{ is_state('input_boolean.rollo_state', 'off') }}"