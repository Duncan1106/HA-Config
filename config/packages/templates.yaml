template:
  # Ambient Lights
  - trigger:
      - trigger: homeassistant
        event: start
      - platform: event
        event_type: event_template_reloaded
      - platform: state
        entity_id:
          - binary_sensor.workday_sensor
          - sun.sun
      - platform: time
        at:
          - "04:30:01"
          - "06:00:01"
          - "10:00:01"
          - "22:30:01"
          - "23:00:01"
      - platform: sun
        event: sunrise
        offset: "+00:15:01"
      - platform: sun
        event: sunset
        offset: "-00:29:59"
      - platform: sun
        event: sunset
        offset: "-00:44:59"
    binary_sensor:
      - name: Ambient Lights
        unique_id: ambient_lights_schedule
        icon: mdi:led-strip
        variables:
          time: "{{ now().strftime('%H:%M') }}"
          workday: "{{ is_state('binary_sensor.workday_sensor', 'on') }}"
          next_rising: "{{ state_attr('sun.sun', 'next_rising') }}"
          next_setting: "{{ state_attr('sun.sun', 'next_setting') }}"
          sunrise_15_hhmm: >
            {% set dt = next_rising | as_datetime %}
            {{ (dt | as_local + timedelta(minutes=15)).strftime('%H:%M') if dt is not none else '00:00' }}
          sunset_30_hhmm: >
            {% set dt = next_setting | as_datetime %}
            {{ (dt | as_local - timedelta(minutes=30)).strftime('%H:%M') if dt is not none else '00:00' }}
          sunset_45_hhmm: >
            {% set dt = next_setting | as_datetime %}
            {{ (dt | as_local - timedelta(minutes=45)).strftime('%H:%M') if dt is not none else '00:00' }}
          weekday_morning_on: '04:30'
          weekday_evening_off: '22:30'
          weekend_morning_on: '06:00'
          weekend_morning_off: '10:00'
          weekend_evening_off: '23:00'
        availability: >
          {{ 
            states('binary_sensor.workday_sensor') not in ['unknown', 'unavailable']
            and states('sun.sun') not in ['unknown', 'unavailable']
            and next_rising is not none 
            and next_setting is not none 
          }}
        state: >
          {% if workday %}
            {% set morning_on = weekday_morning_on <= time < sunrise_15_hhmm %}
            {% set evening_on = sunset_30_hhmm <= time < weekday_evening_off %}
          {% else %}
            {% set morning_on = weekend_morning_on <= time < weekend_morning_off %}
            {% set evening_on = sunset_45_hhmm <= time < weekend_evening_off %}
          {% endif %}
          {{ morning_on or evening_on }}
        attributes:
          schedule_type: "{{ 'workday' if workday else 'weekend' }}"
          period: >
            {% if workday %}
              {% if weekday_morning_on <= time < sunrise_15_hhmm %} morning
              {% elif sunset_30_hhmm <= time < weekday_evening_off %} evening
              {% else %} off {% endif %}
            {% else %}
              {% if weekend_morning_on <= time < weekend_morning_off %} morning
              {% elif sunset_45_hhmm <= time < weekend_evening_off %} evening
              {% else %} off {% endif %}
            {% endif %}
          reason: >
            {% if workday %}
              {% if weekday_morning_on <= time < sunrise_15_hhmm %} Workday morning window: {{ weekday_morning_on }} - {{ sunrise_15_hhmm }}
              {% elif sunset_30_hhmm <= time < weekday_evening_off %} Workday evening window: {{ sunset_30_hhmm }} - {{ weekday_evening_off }}
              {% else %} Outside workday schedule {% endif %}
            {% else %}
              {% if weekend_morning_on <= time < weekend_morning_off %} Weekend morning window: {{ weekend_morning_on }} - {{ weekend_morning_off }}
              {% elif sunset_45_hhmm <= time < weekend_evening_off %} Weekend evening window: {{ sunset_45_hhmm }} - {{ weekend_evening_off }}
              {% else %} Outside weekend schedule {% endif %}
            {% endif %}
          updated: "{{ time }}"
          updated_by: "{{ trigger.description | default('manual') }}"

  # Battery
  - trigger:
      - trigger: homeassistant
        event: start
      - platform: time_pattern
        minutes: "/5"
      - platform: time
        at: "00:00:30"
      - platform: event
        event_type: event_template_reloaded
      - platform: state
        entity_id:
          - sensor.felicity_ess_soc_avg
          - input_number.night_charge_target
          - input_number.night_charge_minimum_soc_percent
          - input_number.night_charge_dynamic_margin_percent
          - input_number.battery_charge_percent_offset
    binary_sensor:
      - name: Charge Battery at Night (dynamically)
        unique_id: charge_battery_at_night
        variables:
          # Basic Inputs
          soc: "{{ states('sensor.felicity_ess_soc_avg') | float(0) }}"
          cap: "{{ states('sensor.inverter_battery_capacity') | float(0) }}"
          target_kwh: "{{ states('input_number.night_charge_target') | float(0) }}"
          potential_target: "{{ (((states('sensor.home_consumption_total_day') | float(0)) - (states('sensor.daily_energy_goe_11kw') | float(0) + states('sensor.daily_energy_goe_22kw') | float(0))) + 1.25) | clamp(15, state_attr('input_number.night_charge_target','max') | float(999)) | round(2) }}"

          # Forecast Selection Logic
          f_today: "{{ states('sensor.solcast_pv_forecast_prognose_heute') | float(0) }}"
          f_tomorrow: "{{ states('sensor.solcast_pv_forecast_prognose_morgen') | float(0) }}"
          forecast_kwh: "{{ f_today if now().hour < 5 else f_tomorrow }}"
          
          # Margin & Buffer Calculations
          margin_pct: "{{ states('input_number.night_charge_dynamic_margin_percent') | float(0) }}"
          min_soc_pct: "{{ states('input_number.night_charge_minimum_soc_percent') | float(0) }}"
          
          battery_usable_kwh: "{{ cap * (soc / 100.0) }}"
          battery_missing_kwh: "{{ cap - battery_usable_kwh }}"
          dyn_margin_kwh: "{{ forecast_kwh * (margin_pct / 100) }}"
          min_soc_kwh: "{{ cap * (min_soc_pct / 100) }}"
          buffer_kwh: "{{ [dyn_margin_kwh, min_soc_kwh] | max }}"
          
          # Resulting Energy State
          net_energy: "{{ battery_usable_kwh + forecast_kwh - buffer_kwh }}" # available battery + solar - buffers
          charge_needed: "{{ (target_kwh - net_energy) }}" #raw
          
          # Offset
          charge_offset: "{{ states('input_number.battery_charge_percent_offset') | float(0) }}"
          charge_offset_base_kwh: "{{ ((cap|float(0)) * (charge_offset|float(0) / 100)) }}"
          effective_target_kwh: "{{ (target_kwh|float(0)) + (charge_offset_base_kwh|float(0)) }}"
          effective_missing_kwh: "{{ effective_target_kwh - net_energy }}"
          charge_offset_kwh: "{{ charge_offset_base_kwh | clamp(0, effective_missing_kwh) }}"
          effective_charge_needed: "{{ (charge_needed + charge_offset_kwh ) | clamp(0, battery_missing_kwh) }}"
          
          # Charging Power Calculation Inputs
          battery_voltage: 51.2
          efficiency: 0.95
          min_amps: 20
          max_amps: 120

          # Night charge window (today)
          window_start_ts: "{{ as_timestamp(today_at('00:05')) }}"
          window_end_ts: "{{ as_timestamp(today_at('04:55')) }}"
          now_ts: "{{ as_timestamp(now()) }}"

          # Remaining hours inside the night window
          remaining_hours: >
            {% set now_val = now_ts | float %}
            {% set start_val = window_start_ts | float %}
            {% set end_val = window_end_ts | float %}
            {% set full_window = (end_val - start_val) / 3600 %}
        
            {% if now_val < start_val %}
              {{ full_window }}
            {% elif now_val <= end_val %}
              {{ (end_val - now_val) / 3600 }}
            {% else %}
              {{ full_window }}
            {% endif %}
          raw_amps: >
            {% set charge_kwh = effective_missing_kwh | float(0) %}
            {% if charge_kwh > 0 %}
              {% set voltage = battery_voltage | float %}
              {% set efficiency_val = efficiency | float %}
              {% set hours = remaining_hours | float(0) | clamp(0.1, 5) %}
              {{ (charge_kwh * 1000) / (voltage * hours * efficiency_val) }}
            {% else %}
              0
            {% endif %}
          actual_amps: >
            {{ ((raw_amps | float(0) // 10 + 1) * 10) | clamp(min_amps|int(20), max_amps|int(120)) }}

        state: "{{ net_energy|float < effective_target_kwh|float }}"
        availability: >
          {% set f_entity = 'sensor.solcast_pv_forecast_prognose_heute' if now().hour < 5 else 'sensor.solcast_pv_forecast_prognose_morgen' %}
          {{ states('sensor.felicity_ess_soc_avg') not in ['unknown','unavailable']
             and states(f_entity) not in ['unknown','unavailable'] }}
        attributes:
          decision_formula: "battery_usable_kwh + forecast_kwh - buffer_kwh < target_kwh + charge_offset_kwh"
          battery_state: ''
          soc_percent: "{{ soc }}"
          usable_kwh: "{{ battery_usable_kwh | round(2) }}"
          battery_missing_kwh: "{{ battery_missing_kwh | round(2) }}"
          forecast: ''
          forecast_heute_kwh: "{{ f_today | round(2) }}"
          forecast_morgen_kwh: "{{ f_tomorrow | round(2) }}"
          forecast_selected_kwh: "{{ forecast_kwh | round(2) }}"
          target: ''
          total_energy_kwh: "{{ [net_energy, 0] | max | round(2) }}"
          target_kwh: "{{ target_kwh }}"
          effective_target_kwh: "{{ effective_target_kwh | round(2) }}"
          potential_target: "{{ potential_target | round(2) }}"
          charge_kwh: ''
          charge_needed_kwh: "{{ charge_needed | round(2) }}"
          charge_offset_kwh: "{{ charge_offset_base_kwh | round(2) }}"
          effective_missing_kwh: "{{ effective_missing_kwh | round(2)}}"
          charge_target: ''
          charge_target_percent: >
            {% set target_pct = ((battery_usable_kwh + charge_needed) / cap) * 100 if cap > 0 else 0 %}
            {{ target_pct | clamp(0, 100) | round(0, 'ceil', 100) }}
          battery_charge_percent_offset: "{{ charge_offset }}"
          offset_charge_target_percent: >
            {% set target_pct = (((battery_usable_kwh + effective_missing_kwh) / cap) * 100) if cap > 0 else 0 %}
            {{ target_pct | clamp(0, 100) | round(0, 'ceil', 100) }}
          buffer: ''
          dynamic_margin_kwh: "{{ dyn_margin_kwh | round(2) }}"
          minimum_soc_kwh: "{{ min_soc_kwh | round(2) }}"
          applied_buffer_kwh: "{{ buffer_kwh | round(2) }}"
          saved_cost_eur: >
            {% set night_tariff = 0.187425 %}
            {% set day_tariff = 0.302379 %}
            {{ ((day_tariff - night_tariff) * effective_charge_needed|float(0)) | round(2) }}
          charging_window: ''
          remaining_hours: "{{ remaining_hours | round(2) }}"
          amps: ''
          required_charge_amps_raw: "{{ raw_amps | round(1) }}"
          required_charge_amps: "{{ actual_amps }}"
          updated_by: "{{ trigger.description | default('manual') }}"

  # Humidifier
  - trigger:
      - trigger: homeassistant
        event: start
      - platform: event
        event_type: event_template_reloaded
      - platform: time_pattern
        minutes: "/1"
      - platform: state
        entity_id:
          - input_number.max_humidifier_activations_per_day
    binary_sensor:
      - name: "Luftbefeuchter On-Windows"
        unique_id: humidifier_trigger_window
        variables:
          current_time: "{{ now() | as_local }}"
          match_window_seconds: 65
          nr_offset_hours: 2
          ns_offset_hours: 1.25
          nr_str: >
            {% set current_time_dt = as_datetime(current_time) %}
            {% set next_rising = as_datetime(state_attr('sun.sun','next_rising')) | as_local %}
            {% set nr_today = next_rising if next_rising.day == current_time_dt.day else next_rising - timedelta(days=1) %}
            {{ nr_today + timedelta(hours=(nr_offset_hours|float)) }}
          ns_str: >
            {% set current_time_dt = as_datetime(current_time) %}
            {% set next_setting = as_datetime(state_attr('sun.sun','next_setting')) | as_local %}
            {% set ns_today = next_setting if next_setting.day == current_time_dt.day else next_setting - timedelta(days=1) %}
            {{ ns_today - timedelta(hours=ns_offset_hours|float) }}
          actual_triggers_today: "{{states('sensor.daily_luftbefeuchter') | int(0)}}"
          max_activations_per_day: "{{ states('input_number.max_humidifier_activations_per_day') | int(15) }}"
          remaining_activations: "{{ [0, max_activations_per_day|int - actual_triggers_today|int] | max }}"
          last_changed_utility_meter: "{{ as_datetime((states.sensor.daily_luftbefeuchter.last_changed) + timedelta(minutes=10)) | as_local }}"
          distribution_anchor_time_str: >
            {% set nr = as_datetime(nr_str) | as_local %}
            {% if actual_triggers_today|int == 0 %}
              {{ nr }}
            {% else %}
              {{ [as_datetime(last_changed_utility_meter) | as_local, nr] | max }}
            {% endif %}
          span: >
            {% set ns = as_datetime(ns_str) | as_local %}
            {% set distribution_anchor_time = as_datetime(distribution_anchor_time_str) | as_local %}
            {% set span = ns - distribution_anchor_time %}
            {{ span.total_seconds() }}
          interval: "{{ span|int / (remaining_activations|int + 1) }}"
          all_ptts: >
            {% set distribution_anchor_time_str = as_datetime(distribution_anchor_time_str) | as_local %}
            {% set count = remaining_activations|int %}
            {% set out = namespace(items=[]) %}
            {% if count > 0 and span|float > 0 %}
              {% for i in range(count) %}
                {% set ptt = distribution_anchor_time_str + timedelta(seconds=(i + 1) * interval|float) %}
                {% set out.items = out.items + [ptt.isoformat()] %}
              {% endfor %}
            {% endif %}
            {{ out.items }}
        availability: >
          {{ states('sun.sun') not in ['unknown', 'unavailable']
             and state_attr('sun.sun', 'next_rising') is not none
             and state_attr('sun.sun', 'next_setting') is not none
             and states('sensor.daily_luftbefeuchter') not in ['unknown', 'unavailable'] }}
        state: >
          {% set current_time_dt = as_datetime(current_time) | as_local%}
          {% set match_window = timedelta(seconds=match_window_seconds|int) %}
          {% set result = namespace(match=false) %}
          {% for t_str in all_ptts %}
            {% set ptt = as_datetime(t_str) | as_local %}
            {% if (ptt - match_window) <= current_time_dt <= (ptt + match_window) %}
              {% set result.match = true %}
            {% endif %}
          {% endfor %}
          {{ result.match }}
        attributes:
          status: >
            {% set curr = as_datetime(current_time) %}
            {% set nr = as_datetime(nr_str) %}
            {% set ns = as_datetime(ns_str) %}
            {% if curr < nr %} Outside Window: Night/Morning
            {% elif curr > ns %} Outside Window: Night/Evening
            {% elif remaining_activations|int <= 0 %} Outside Window: Daily Limit Reached
            {% else %} Active: Calculating Slots {% endif %}
          next_sunrise_offset_start: "{{ as_datetime(nr_str).strftime('%Y-%m-%d %H:%M:%S') }}"
          next_sunset_offset_end: "{{ as_datetime(ns_str).strftime('%Y-%m-%d %H:%M:%S') }}"
          actual_triggers_today: "{{ actual_triggers_today }}"
          max_activations_per_day: "{{ max_activations_per_day }}"
          remaining_activations: "{{ remaining_activations }}"
          distribution_anchor_time: "{{ distribution_anchor_time_str }}"
          window_duration: "{{ time_until(now() + (as_datetime(ns_str) - as_datetime(nr_str)), 2) }}"
          trigger_interval: "{{ (time_until(now() + timedelta(seconds=interval|int), 3)) if remaining_activations|int > 0 else 'N/A' }}"
          trigger_times: >
            {% set current_time_dt = as_datetime(current_time) | as_local %}
            {% set out = namespace(times=[]) %}
            {% for t_str in all_ptts %}
              {% set ptt = as_datetime(t_str) | as_local %}
              {% if ptt > current_time_dt %}
                {% set out.times = out.times + [ptt.strftime('%H:%M:%S')] %}
              {% endif %}
            {% endfor %}
            {{ out.times if out.times|length > 0 else ["No future slots"] }}
          all_trigger_times: >
            {% set out = namespace(times=[]) %}
            {% for t_str in all_ptts %}
              {% set ptt = as_datetime(t_str) | as_local %}
              {% set out.times = out.times + [ptt.strftime('%H:%M:%S')] %}
            {% endfor %}
            {{ out.times if out.times|length > 0 else [" No Slots Today"] }}
          updated_at: "{{ as_datetime(current_time).strftime('%H:%M:%S') }} by {{ trigger.description | default('manual') }}"

  # Heizraum Lüftung
  - trigger:
      - trigger: homeassistant
        event: start
      - platform: event
        event_type: event_template_reloaded
      - platform: state
        entity_id:
          - sensor.inverter_temperature
          - sensor.heizraum_lufter_abluft_power
          - sensor.esphome_az_envy_1_temperature_heizraum
          - sensor.gw1100a_outdoor_temperature
    binary_sensor:
      - name: Heizraum Zuluft Trigger
        unique_id: heizraum_zuluft_trigger
        variables:
          outdoor_temp_offset_percent: 0.8
          inverter_temp: "{{ states('sensor.inverter_temperature') | float(0) | round(1) }}"
          abluft_power: "{{ states('sensor.heizraum_lufter_abluft_power') | float(0) | round(1) }}"
          heizraum_temp: "{{ states('sensor.esphome_az_envy_1_temperature_heizraum') | float(0) | round(1) }}"
          heizraum_temp_offset: "{{ (heizraum_temp * outdoor_temp_offset_percent) | round(1) }}"
          outdoor_temp: "{{ states('sensor.gw1100a_outdoor_temperature') | float(0) | round(1) }}"
          inverter_level: >
            {% if inverter_temp|float >= 55 %}
              notfall
            {% elif inverter_temp|float >= 50 %}
              aktiv
            {% elif inverter_temp|float >= 40 %}
              okay
            {% else %}
              normal
            {% endif %}
          abluft_level: >
            {% if abluft_power|float >= 5.0 %}
              hoch
            {% elif abluft_power|float >= 3.0 %}
              normal
            {% else %}
              niedrig
            {% endif %}
          zuluft_needed: >
            {{
              (outdoor_temp | float(0)) >= (heizraum_temp_offset | float(0))
              and (
                inverter_level == 'notfall'
                or (inverter_level == 'aktiv' and abluft_level == 'hoch')
                or (inverter_level == 'okay' and abluft_level in ['normal', 'hoch'])
              )
            }}
        state: "{{ iif(zuluft_needed, 'on', 'off', none) }}"
        availability: >
          {{ states('sensor.inverter_temperature') not in ['unknown','unavailable']
             and states('sensor.heizraum_lufter_abluft_power') not in ['unknown','unavailable']
             and states('sensor.esphome_az_envy_1_temperature_heizraum') not in ['unknown','unavailable'] 
             and states('sensor.gw1100a_outdoor_temperature') not in ['unknown','unavailable'] 
          }}
        attributes:
          inverter_temp: "{{ inverter_temp }}"
          inverter_level: "{{ inverter_level }}"
          abluft_power: "{{ abluft_power }}"
          abluft_level: "{{ abluft_level }}"
          heizraum_temp: "{{ heizraum_temp }}"
          outdoor_temp: "{{ outdoor_temp }}"
          zuluft_needed: "{{ zuluft_needed }}"
          decision_reason: >
            {% if (outdoor_temp|float(0)) < (heizraum_temp | float(0)) %}
              Gesperrt: Außentemperatur zu niedrig ({{ outdoor_temp }}°C < {{ heizraum_temp_offset }}°C [{{(outdoor_temp_offset_percent|float(0.8) * 100)|int(80)}}% von {{ heizraum_temp }}°C])
            {% elif inverter_level == 'notfall' %}
              KRITISCH: Inverter Überhitzung ({{ inverter_temp }}°C)
            {% elif inverter_level == 'aktiv' and abluft_level == 'hoch' %}
              Unterstützung: Inverter warm ({{ inverter_temp }}°C) & Abluft Maximum
            {% elif inverter_level == 'okay' and abluft_level in ['normal','hoch'] %}
              Standard: Inverter okay & Abluft aktiv
            {% elif not zuluft_needed %}
              Standby: Grenzwerte nicht erreicht
            {% else %}
              Unbekannter Status
            {% endif %}
          updated_by: "{{ trigger.description | default('manual') }}"

  # Kellervorraete
  - trigger:
      - platform: event
        event_type: event_template_reloaded
      - platform: homeassistant
        event: start
    sensor:
      - name: "Todo Lists Config"
        unique_id: todo_lists_config
        state: "static"
        attributes:
          todo_lists: >-
            {{ ['todo.kellervorrate', 'todo.kellervorrate_katzenfutter', 'todo.kellervorrate_safe', 'todo.kellervorrate_marmelade_selbstgemachtes', 'todo.kuhltruhe_keller', 'todo.kuhltruhe_garage'] }}
  - trigger:
      - platform: event
        event_type: event_template_reloaded
      - platform: homeassistant
        event: start
      - platform: state
        entity_id: input_text.search_todo_list
      - platform: state
        entity_id: input_button.update_kellervorrate
      - platform: state
        entity_id: &todo_lists
          - todo.kellervorrate
          - todo.kellervorrate_katzenfutter
          - todo.kellervorrate_safe
          - todo.kellervorrate_marmelade_selbstgemachtes
          - todo.kuhltruhe_keller
          - todo.kuhltruhe_garage
    actions:
      - action: todo.get_items
        data:
          status: needs_action
        target:
          entity_id: *todo_lists
        response_variable: all_todo_items
    sensor:
      - name: "Kellervorrate Combined Filtered Items"
        unique_id: kellervorrate_combined_filtered_items
        state: >
            {% set input = states('input_text.search_todo_list') | default('') | lower %}
            {% set has_filter = 'todo:' in input %}
            {% set filter_key = (input.split('todo:')[1].split(' ')[0]) if has_filter else '' %}
            {% set search_term = input.split('todo:' ~ filter_key)[1] | trim if has_filter else input %}
            
            {% set lists = state_attr('sensor.todo_lists_config', 'todo_lists') | default([]) %}
            {% if all_todo_items is not defined or all_todo_items is not mapping %}
              unknown
            {% else %}
              {% set available = all_todo_items.keys() | list %}
              {% set missing = lists | reject('in', available) | list %}
              {% if missing | length > 0 %}
                unknown
              {% else %}
                {% set filtered_lists = lists  
                  | select('search', filter_key)  
                  | list if filter_key else lists %}  
                
                {% if filtered_lists | length == 0 %}
                  {% set filtered_lists = lists %}
                {% endif %}
                  {% set count = namespace(total=0) %}
                  {% set terms = search_term.split() %}
                  {% for list_id in filtered_lists %}
                    {% set items = all_todo_items[list_id].get('items', []) %}
                    {% for item in items %}
                      {% if item.summary is defined and item.summary is string %}
                        {% if search_term == '' or (terms | select('in', (item.summary | lower)) | list | count == terms | count) %}
                          {% set count.total = count.total + 1 %}
                        {% endif %}
                      {% endif %}
                    {% endfor %}
                  {% endfor %}
                  
                  {{ count.total }}
                {% endif %}
            {% endif %}
        attributes:
          source_map: >
            {% set lists = state_attr('sensor.todo_lists_config', 'todo_lists') | default([]) %}

            {% set ns = namespace(source_map={}) %}

            {% for entity_id in lists %}
              {# get raw friendly name (or build fallback from entity_id) #}
              {% set fn_raw = state_attr(entity_id, 'friendly_name')
                | default(entity_id.split('.')[-1] | replace('_', ' ') | title, true) %}

              {# remove straight and smart quotes, collapse double spaces and trim #}
              {% set fn = fn_raw
                | replace('"', '')
                | replace("'", '')
                | replace('“', '')
                | replace('”', '')
                | replace('’', '')
                | regex_replace('\\s+', ' ')
                | trim %}

              {% set ns.source_map = ns.source_map | combine({
                (loop.index|string): {
                  'entity_id': entity_id,
                  'friendly_name': fn
                }
              }) %}
            {% endfor %}

            {{ ns.source_map | to_json }}
          filtered_items: >
            {% set input = states('input_text.search_todo_list') | default('') | lower %}
            {% set has_filter = 'todo:' in input %}
            {% set filter_key = (input.split('todo:')[1].split(' ')[0]) if has_filter else '' %}
            {% set search_term = input.split('todo:' ~ filter_key)[1] | trim if has_filter else input %}

            {% set lists = state_attr('sensor.todo_lists_config', 'todo_lists') | default([]) %}
            {% if all_todo_items is not defined or all_todo_items is not mapping %}
              []
            {% else %}
              {% set available = all_todo_items.keys() | list %}
              {% set missing = lists | reject('in', available) | list %}
              {% if missing | length > 0 %}
                []
              {% else %}
                {% set ns2 = namespace(index_map={}) %}
                {% for entity_id in lists %}
                  {% set ns2.index_map = ns2.index_map | combine({ (entity_id): loop.index|string }) %}
                {% endfor %}
                {% set list_index = ns2.index_map %}
                {% set filtered_lists = lists
                  | select('search', filter_key)
                  | list if filter_key else lists %}
                {% if filtered_lists | length == 0 %}
                  {% set filtered_lists = lists %}
                {% endif %}
                {% set combined = namespace(items=[]) %}
                {% set terms = search_term.split() %}
                {% for list_id in filtered_lists %}
                  {% set items = all_todo_items[list_id].get('items', []) %}
                  {% for item in items %}
                    {% if item.summary is defined and item.summary is string %}
                      {% if (search_term == '' or (terms | select('in', (item.summary | lower)) | list | count == terms | count)) %}
                        {% set minimal_item = {
                          'u': item.uid,
                          's': item.summary,
                          'd': item.get('description', '') | string,
                          'c': list_index[list_id]
                        } %}
                        {% set combined.items = combined.items + [minimal_item] %}
                      {% endif %}
                    {% endif %}
                  {% endfor %}
                {% endfor %}
                {# combined.items #}
                {# ---- SORTING STEP ---- #}
                {% set sorted_items = combined.items | sort(attribute='s', case_sensitive=False) %}
                {{ sorted_items | to_json}}
              {% endif %}
            {% endif %}
  - trigger: 
      - platform: state
        entity_id: sensor.kellervorrate_combined_filtered_items
      - platform: state
        entity_id: sensor.kellervorrate_combined_filtered_items
        attribute: filtered_items
      - platform: homeassistant
        event: start
