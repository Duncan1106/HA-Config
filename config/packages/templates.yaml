            }}

  # Rollo Sommer
  - triggers:
      - platform: state
        entity_id: input_boolean.rollo_summer_override
      - platform: state
        entity_id: sensor.sun_solar_azimuth
      - platform: state
        entity_id: sensor.sun_solar_elevation
      - platform: event
        event_type: event_template_reloaded
      - platform: homeassistant
        event: start
    binary_sensor:
      - name: "Rollo Summer Should Close"
        unique_id: rollo_summer_should_close
        variables:
          sunrise_open_delay_minutes: 15
          sunset_close_delay_minutes: 15
          sun_window_azimuth_threshold: 150
          sun_window_elevation_threshold: 16
          rain_rate_threshold: 0.1
          uv_index_threshold_strong: 4.0
          temp_outside_threshold: 22.0
          uv_threshold_temp_diff: 25000.0
          uv_threshold_strong: 60000.0
          temp_diff_threshold: 2.5
          baseline: 20.0
          extreme_temp_threshold: 28.0
          heat_risk_score: 1.9
          current_time: "{{ now() | as_timestamp | timestamp_local | as_datetime }}"
          relevant_sunrise_dt: >
            {% set current_time_dt = as_datetime(current_time) %}
            {% set next_rising_raw_dt = states('sensor.sun_next_rising') | as_timestamp | timestamp_local | as_datetime %}
            {{ next_rising_raw_dt if next_rising_raw_dt.day == current_time_dt.day else (next_rising_raw_dt - timedelta(days=1)) }}
          relevant_sunset_dt: >
            {% set current_time_dt = as_datetime(current_time) %}
            {% set next_setting_raw_dt = states('sensor.sun_next_setting') | as_timestamp | timestamp_local | as_datetime %}
            {{ next_setting_raw_dt if next_setting_raw_dt.day == current_time_dt.day else (next_setting_raw_dt - timedelta(days=1)) }}
          open_after: >
            {% set delay = sunrise_open_delay_minutes | int(15) %}
            {{ as_datetime(relevant_sunrise_dt) + timedelta(minutes=delay) }}
          close_before: >
            {% set delay = sunset_close_delay_minutes | int(15) %}
            {{ as_datetime(relevant_sunset_dt) - timedelta(minutes=delay) }}
          azimuth: "{{ states('sensor.sun_solar_azimuth') | default(0, true) | float }}"
          elevation: "{{ states('sensor.sun_solar_elevation') | default(0, true) | float }}"
          temp_inside: "{{ states('sensor.gw1100a_indoor_temperature') | float(0) }}"
          temp_outside: "{{ states('sensor.gw1100a_outdoor_temperature') | float(0) }}"
          temp_diff: "{{ (temp_outside|float - temp_inside|float) | round(2)}}"
          rain_rate: "{{states('sensor.gw1100a_rain_rate') | float(0) }}"
          rain_sunflower: "{{ is_state('binary_sensor.rain_sun_flower_rain', 'on') }}"
          weather: "{{ states('weather.irauen33') | lower | default('') }}"
          weather_says_rain: >
            {% set RAIN_KEYWORDS = ['rain', 'shower'] %}
            {{ RAIN_KEYWORDS | select('in', weather) | list | count > 0 }}
          uv_lux: "{{ states('sensor.gw1100a_solar_lux') | float(0) }}"
          uv_index: "{{ states('sensor.gw1100a_uv_index') | float(0) }}"
          manual: "{{ 1 if is_state('input_boolean.rollo_summer_override', 'on') else 0 }}"
          summer: >
            {% set summer_months = [5,6,7,8,9] %}
            {% set month = now().month %}
            {{ 1 if (month in summer_months) else 0 }}
          within_daylight: >
            {% set current_time_dt = as_datetime(current_time|string) %}
            {% set open_after_dt = as_datetime(open_after|string) %}
            {% set close_before_dt = as_datetime(close_before|string) %}
            {{ 1 if ((current_time_dt > open_after_dt) and (current_time_dt < close_before_dt)) else 0 }}
          sun_hits_window: "{{ 1 if ((azimuth|float > sun_window_azimuth_threshold|float) and (elevation|float > sun_window_elevation_threshold|float)) else 0 }}"
          not_raining: >
              {% set rain_conditions = [
                rain_rate|float > rain_rate_threshold|float,
                rain_sunflower|bool,
                weather_says_rain|bool
              ] %}
            
              {% set count_true = rain_conditions | select('equalto', true) | list | count %}
            
              {{ 1 if (count_true < 2) else 0 }}
          strong_uv_index: >
            {% if temp_outside|float <= temp_outside_threshold|float %}
              0.0
            {% else %}
              {% set ratio = uv_index|float / uv_index_threshold_strong|float if uv_index_threshold_strong|float > 0 else 0 %}
              {{ 1.0 if ratio >= 1 else (0.0 if ratio <= 0 else ratio) }}
            {% endif %}
          strong_uv_lux: >
            {% if temp_outside|float <= temp_outside_threshold|float %}
              0.0
            {% else %}
              {% set ratio = uv_lux|float / uv_threshold_strong|float if uv_threshold_strong|float > 0 else 0 %}
              {{ ratio | clamp(0.0, 1.0) }}
            {% endif %}
          high_temp_diff: >
            {% if temp_outside|float <= temp_outside_threshold|float or uv_lux|float <= uv_threshold_temp_diff|float %}
              0.0
            {% else %}
              {% set ratio = temp_diff|float / temp_diff_threshold|float if temp_diff_threshold|float > 0 else 0 %}
              {{ ratio | clamp(0.0, 1.0) }}
            {% endif %}
          extreme_temp: >
            {% set denom = (extreme_temp_threshold|float - baseline|float) if (extreme_temp_threshold|float - baseline|float) != 0 else 1 %}
            {{ ((temp_outside|float - baseline|float) / denom) | clamp(0.0, 1.0)}}
        state: >
          {% if manual|int > 0 or summer|int < 1 %}
            None
          {% elif (summer|int + within_daylight|int + sun_hits_window|int + not_raining|int) < 4 %}
            false
          {% else %}
            {% set sum = strong_uv_index|float + strong_uv_lux|float + high_temp_diff|float + extreme_temp|float %}
            {% if sum >= heat_risk_score|float %}
              true
            {% else %}
              false
            {% endif %}
          {% endif %}
        attributes:
          manual_mode: "{{ manual }}"
          first_blockers: ''
          summer: "{{ summer }}"
          within_daylight: "{{ within_daylight }}"
          sun_hits_window: "{{ sun_hits_window }}"
          not_raining: "{{ not_raining }}"
          heat_reasons: ''
          strong_uv_index: "{{ strong_uv_index }}"
          strong_uv_lux: "{{ strong_uv_lux }}"
          high_temp_diff: "{{ high_temp_diff }}"
          extreme_temp: "{{ extreme_temp }}"
          Reason: ''
          reason: >
              {% set ns = namespace(reasons=[]) %}
            
              {# Manual override #}
              {% if manual %}
                {% set ns.reasons = ns.reasons + ['Manual override active, auto open/close disabled.'] %}
              {% else %}
                {# Summer check #}
                {% if summer < 1 %}
                  {% set ns.reasons = ns.reasons + ['Not summer month'] %}
                {% endif %}
                
                {# Within daylight #}
                {% if within_daylight < 1 %}
                  {% set ns.reasons = ns.reasons + ['Outside daylight window'] %}
                {% endif %}
            
                {# Sun hits window #}
                {% if sun_hits_window < 1%}
                  {% set ns.reasons = ns.reasons + ['Sun not hitting window'] %}
                {% endif %}
            
                 {% if not_raining | int < 1 %}
                  {# Calculating the count for the string display #}
                  {% set rain_conditions = [ rain_rate|float > rain_rate_threshold|float, rain_sunflower|bool, weather_says_rain|bool ] %}
                  {% set count_true = rain_conditions | select('equalto', true) | list | count %}
                  {% set ns.reasons = ns.reasons + ['Raining detected (' ~ count_true ~ ' of 3)'] %}
                {% endif %}
            
                {# 3. Heat Risk Scores (The decision criteria) #}
                {% set s_uv_index = strong_uv_index | float %}
                {% set s_uv_lux = strong_uv_lux | float %}
                {% set h_temp_diff = high_temp_diff | float %}
                {% set e_temp = extreme_temp | float %}
                {% set total_score = (s_uv_index + s_uv_lux + h_temp_diff + e_temp) | round(2) %}
                {% set count_nonzero = [s_uv_index, s_uv_lux, h_temp_diff, e_temp] | select('gt', 0) | list | count %}
                
                {% set ns.reasons = ns.reasons + ['Heat risk score: ' ~ total_score ~ ' (Threshold:' ~ heat_risk_score ~ ')' ~ ' (components: ' ~ count_nonzero ~ '/4)'] %}
                {% set ns.reasons = ns.reasons + [
                  'UV Index Score: ' ~ s_uv_index,
                  'UV Lux Score: ' ~ s_uv_lux,
                  'Temp Diff Score: ' ~ h_temp_diff,
                  'Extreme Temp Score: ' ~ e_temp
                ] %}
              {% endif %}
            
              {{ ns.reasons | join(',\n') }}
          Time: ''
          open_after: "{{ as_datetime(open_after).strftime('%H:%M') }}"
          close_before: "{{ as_datetime(close_before).strftime('%H:%M') }}"
          Sensors: ''
          temp_inside: "{{ temp_inside }}"
          temp_outside: "{{ temp_outside | round(1) }} (> {{ extreme_temp_threshold }})"
          temp_diff: "{{ temp_diff| round(1) }} (> {{ temp_diff_threshold }})"
          rain_rate: "{{ rain_rate }} (> {{ rain_rate_threshold }})"
          rain_sunflower: "{{ 'Wet' if rain_sunflower|bool else 'Dry' }} (== Wet)"
          weather: "{{ weather }}"
          uv_lux: "{{ uv_lux | round(0) }} (> {{ uv_threshold_strong }})"
          uv_index: "{{ uv_index | round(0) }} (> {{ uv_index_threshold_strong }})"
          elevation: "{{ elevation | round(0) }} (> {{ sun_window_elevation_threshold }})"
          azimuth: "{{ azimuth | round(0) }} (> {{ sun_window_azimuth_threshold }})"
          updated_by: "{{ trigger.description | default('manual') }}"

  # Known Energy, Unmonitored Energy, PV Kosten
  - trigger:
      - platform: time_pattern
        minutes: "/1"
      - platform: event
        event_type: event_template_reloaded
      - platform: homeassistant
        event: start
    sensor:
      - name: "Known Energy"
        unique_id: known_energy
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total
        state: >
          {{ label_entities('known_energy')
             | map('states')
             | map('float', 0)
             | sum
             | round(3) }}
        availability: >
          {{ label_entities('known_energy') | list | length > 0 }}
        attributes:
          total_entity_count: >
            {{ label_entities('known_energy') | list | length }}
          active_entity_count: >
            {{ label_entities('known_energy')
               | map('states')
               | select('is_number')
               | map('float')
               | select('>', 0)
               | list
               | length }}
      - name: "Unmonitored Consumption"
        unique_id: unmonitored_consumption
        state: >
          {% set home = states('sensor.home_consumption_total_day') | float(0) %}
          {% set known = states('sensor.known_energy') | float(0) %}
          {% set unmetered = (home - known) | round(3) %}
          {{ unmetered if unmetered > 0 else 0 }}
        availability: >
          {{ states('sensor.home_consumption_total_day') not in ['unavailable','unknown'] and states('sensor.known_energy') not in ['unavailable','unknown'] }}
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total
        icon: mdi:power-plug-off
      - name: "Gesamt Kosten Pv Active Moving"
        unique_id: gesamtkosten_pv
        unit_of_measurement: "€"
        state_class: measurement
        availability: >
          {{ states('sensor.solar_to_home_daily_energy_cost') not in ['unknown','unavailable']
             and states('sensor.battery_charge_from_solar_daily_energy_cost') not in ['unknown','unavailable']
             and states('sensor.inverter_total_battery_discharge_daily_energy_cost') not in ['unknown','unavailable']
             and states('sensor.daily_money_generated_solar') not in ['unknown','unavailable']
             and states('sensor.bkw_outlet_1_total_daily_energy_cost') not in ['unknown','unavailable']
             and states('input_number.gesamte_pv_kosten') not in ['unknown','unavailable'] }}
        state: |
          {% set solar_home = states('sensor.solar_to_home_daily_energy_cost') | float(0) %}
          {% set solar_bat = states('sensor.battery_charge_from_solar_daily_energy_cost') | float(0) %}
          {% set bat_home = states('sensor.inverter_total_battery_discharge_daily_energy_cost') | float(0) %}
          {% set solar_grid = states('sensor.daily_money_generated_solar') | float(0) %}
          {% set bkw = states('sensor.bkw_outlet_1_total_daily_energy_cost') | float(0) %}
          {% set gesamt = states('input_number.gesamte_pv_kosten') | float(0) %}
          {{ (gesamt - solar_home - solar_bat - bat_home - solar_grid - bkw) | round(2) }}
        attributes:
          daily_change: >
            {% set before = states('input_number.after_gesamt_pv_kosten') | float(0) %}
            {% set after = states('sensor.gesamt_kosten_pv_active_moving') | float(0) %}
            {{ (before - after) | round(2) }}€

  # Home Power, Home Energy, Battery Charge Power from Solar
  - trigger:
      - platform: time_pattern
        seconds: "/10"
    sensor:
      - name: "Home Power"
        unique_id: home_power
        unit_of_measurement: "W"
        state_class: measurement
        device_class: power
        availability: >
          {% set sensors = [
            'sensor.grid_import',
            'sensor.grid_export',
            'sensor.battery_charge',
            'sensor.battery_discharge',
            'sensor.inverter_power_losses',
            'sensor.inverter_pv_power',
            'sensor.scb_ac_power',
            'sensor.bkw_outlet_1_energy_power',
            'sensor.known_power'
          ] %}
          {{ sensors | map('states') | reject('in', ['unavailable','unknown','none']) | list | length == sensors | length }}

        state: |
          {% set grid_import = states('sensor.grid_import') | float(0) %}
          {% set grid_export = states('sensor.grid_export') | float(0) %}
          {% set battery_charge = states('sensor.battery_charge') | float(0) %}
          {% set battery_discharge = states('sensor.battery_discharge') | float(0) %}
          {% set losses = states('sensor.inverter_power_losses') | float(0) %}
          {% set deye = states('sensor.inverter_pv_power') | float(0) %}
          {% set kostal = states('sensor.scb_ac_power') | float(0) %}
          {% set solar = (deye + kostal) | round(2) %}
          {% set bkw = states('sensor.bkw_outlet_1_energy_power') | float(0) %}
          {% set known_power = states('sensor.known_power') | float(0) %}
          {% set home = (solar - grid_export + grid_import + bkw - battery_charge + (battery_discharge - losses) ) | round(2) %}
          {{ home | clamp(known_power, 33000) }}
      - name: "Home Consumption Total Day"
        unique_id: home_consumption_total_day
        unit_of_measurement: "kWh"
        state_class: total
        device_class: energy
        availability: >
          {% set sensors = [
            'sensor.daily_solar_production',
            'sensor.bkw_outlet_1_energy_today',
            'sensor.inverter_today_battery_charge',
            'sensor.daily_battery_discharged_energy',
            'sensor.daily_netzbezug',
            'sensor.daily_netzeinspeisung',
            'sensor.inverter_today_energy_losses'
          ] %}
          {{ sensors | map('states') | reject('in', ['unavailable','unknown','none']) | list | length == sensors | length }}
        state: |
            {% set pv = states('sensor.daily_solar_production') | float(0) %}
            {% set bkw = states('sensor.bkw_outlet_1_energy_today') | float(0) %}
            {% set bat_charge = states('sensor.inverter_today_battery_charge') | float(0) %}
            {% set bat_discharge = states('sensor.daily_battery_discharged_energy') | float(0) %}
            {% set grid_import = states('sensor.daily_netzbezug') | float(0) %}
            {% set grid_export = states('sensor.daily_netzeinspeisung') | float(0) %}
            {% set loss_deye= states('sensor.inverter_today_energy_losses') | float(0) %}
            {% set losses = loss_deye %} 
            {% set total= ((pv + bkw + grid_import + bat_discharge) - (grid_export + bat_charge + losses )) | round(3) %}
            {{ total if total > 0 else 0 }}
      - name: "Battery Charge Power from Solar"
        unique_id: battery_charge_power_from_solar
        state: >
          {% set bat_charge = states('sensor.battery_charge') | float(0) | round(0) %}
          {% set charge_from_solar = is_state('binary_sensor.battery_charging_from_solar','on') %}
          {{ iif(charge_from_solar, bat_charge, 0, 0)}}
        availability: >
          {{ states('sensor.battery_charge') not in ['unavailable','unknown'] and states('binary_sensor.battery_charging_from_solar') not in ['unavailable','unknown'] }}
        device_class: power
        unit_of_measurement: "W"
        state_class: measurement
        icon: mdi:solar-power

  # Known Power, Unmonitored Power, Grid Power, Power Consumption Ranking
  - trigger:
      - platform: time_pattern
        seconds: "/5"
    sensor:
      - name: "Known Power"
        unique_id: known_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        variables:
          ranked_power: >
            {% set exclude = expand('sensor.exclude_from_power_ranking') | map(attribute='entity_id') | list %}
            {% set sensors = label_entities('known_power') | reject('in', exclude) | list %}
            {% set ns = namespace(items=[]) %}
            {% for s in sensors %}
              {% set v = states(s) | float(0) %}
              {% if v > 0 %}
                {% set ns.items = ns.items + [ {'id': s, 'v': v} ] %}
              {% endif %}
            {% endfor %}
            {{ ns.items | sort(attribute='v', reverse=true) }}
        state: >
          {{ label_entities('known_power')
             | map('states')
             | map('float', 0)
             | sum
             | round(3) }}
        availability: >
          {{ label_entities('known_power') | list | length > 0 }}
        attributes:
          top_1: "{{ ranked_power[0].id if ranked_power | count > 0 else none }}"
          top_2: "{{ iif((ranked_power | count > 1 and states(ranked_power[1].id) | float(0) > 10), ranked_power[1].id, none, none) }}"
          total_entity_count: >
            {{ label_entities('known_power') | list | length }}
          active_entity_count: >
            {{ label_entities('known_power')
               | map('states')
               | select('is_number')
               | map('float')
               | select('>', 0)
               | list
               | length }}
      - name: "Unmonitored"
        unique_id: unmonitored
        state: >
          {% set known = states('sensor.known_power') | float(0) %}
          {% set home = states('sensor.home_power') | float(0) %}
          {% set diff = (home - known) | round(2) %}
          {{ diff if diff > 0 else 0 }}
        availability: >
          {{ has_value('sensor.known_power') and has_value('sensor.home_power') }}
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:flash-outline
      - name: "Grid Power"
        unique_id: grid_power
        state: >
          {% set tibber = states('sensor.tibber_bridge_0100100700ff') %}
          {% if tibber not in ['unavailable', 'unknown', 'none'] %}
            {{ tibber | float(0) }}
          {% else %}
            {{ states('sensor.smart_meter_mqtt_grid_power') | float(0) }}
          {% endif %}
        availability: >
          {% set tibber = states('sensor.tibber_bridge_0100100700ff') %}
          {% set smart = states('sensor.smart_meter_mqtt_grid_power') %}
          {{ tibber not in ['unavailable', 'unknown', 'none'] or smart not in ['unavailable', 'unknown', 'none'] }}
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:transmission-tower

  # AI Beta Release Notes Summary
  - triggers:
      - trigger: homeassistant
        event: start
      - platform: event
        event_type: event_template_reloaded
    binary_sensor:
      - unique_id: home_assistant_beta_release_notes_window
        name: Home Assistant Beta Release Notes Window
        icon: mdi:home-assistant
        state: >
            {% set today = now().date() %}
            {% if today.day <= 7 %}
              {% set fdom = today.replace(day=1) %}
            {% else %}
              {% set fdom = (today.replace(day=28) + timedelta(days=5)).replace(day=1) %}
            {% endif %}
            {% set first_wed = fdom + timedelta(days=(2 - fdom.weekday() + 7) % 7) %}
            {{ first_wed - timedelta(days=7) <= today <= first_wed }}
  - triggers:
      - trigger: homeassistant
        event: start
      - platform: event
        event_type: event_template_reloaded
      - trigger: state
        entity_id:
         - input_button.update_beta_release_notes
         - input_select.conversation_agents
    conditions:
      - condition: state
        entity_id: binary_sensor.home_assistant_beta_release_notes_window
        state:
          - "on"
    actions:
      - action: multiscrape.scrape
        response_variable: beta_scrape
        data:
          name: beta_release_scraper
          resource: https://rc.home-assistant.io/latest-release-notes/
          sensor:
            - unique_id: beta_url
              name: Beta Release URL
              select: link[rel='canonical']
              attribute: href
              value_template: |
                {!{ value | trim | replace('www.home','rc.home') }!}
            - unique_id: beta_notes_content
              name: Beta Notes Content
              select: body
              value_template: |
                {!{ value | trim | replace('\n', ' ') }!}
      - action: conversation.process
        response_variable: agent
        data:
          text: >-
            You are an expert software release notes summarizer.

            The release notes below are for the Home Assistant release found at
            this URL: {{ beta_scrape.beta_url.value }}

            Based on the following raw release notes text, please:

            1. Extract and list **New Features** introduced in this release. 2.
            Identify and list any **Breaking Changes** (features or behaviors
            that require user attention because they may break existing setups).
            3. Highlight **Backward-Incompatible Changes** or deprecations. 4.
            Optionally include other important notes, like bug fixes or notable
            improvements.

            Structure your output in a clear, organized format with headings
            like this:

            **New Features:**   \n- Feature 1   \n- Feature 2 ...

            **Breaking Changes:**   \n- Change 1   \n- Change 2 ...

            **Backward-Incompatible Changes:**   \n- Change 1   \n- Change 2 ...

            **Other Notes:**   \n- Note 1   \n- Note 2 ...

            Only include points actually mentioned in the release notes. Be
            concise but informative, avoid filler.
            The summary is intended to be used in a markdown display.
            Only provide the summary and nothing else like heres the summary or any other form of introduction.

            Here is the release notes text:   
            
            {{ beta_scrape.beta_notes_content }}
            
          agent_id: "{{ states('input_select.conversation_agents')}}"
      - action: conversation.process
        response_variable: agent_short
        data:
          agent_id: "{{ states('input_select.conversation_agents')}}"
          text: >-
            Summarize this to a length be no more than 250 Words long. 
            If you need to shorten the text then keep the most important things and discard the less important ones but keep hnder the 250 Words length!
            Alternatively a maximum of 750 Characters or 250 Words what ever is less!
            to achieve this remove any unnecessary fill words.
            
            {{ agent.response.speech.plain.speech }}
    sensor:
      - unique_id: home_assistant_beta_release_notes
        name: Home Assistant Beta Release Notes
        icon: mdi:home-assistant
        state: >
            {% if beta_scrape is defined and beta_scrape.beta_url is defined and beta_scrape.beta_url.value %}
              {% set url = beta_scrape.beta_url.value|string|trim %}
              {% if 'release-' in url %}
                {% set build = url.split('/')[-2]|trim %}
                {% set year = build.split('-')[1][0:4] %}
                {% set month = build.split('-')[1][4:]|int %}
                {{ year ~ '.' ~ ('%02d'|format(month)) ~ '.0'}}
              {% else %}
                Invalid URL
              {% endif %}
            {% else %}
              Unknown
            {% endif %}
        attributes:
          beta_url: >
            {% if beta_scrape is defined and beta_scrape.beta_url is defined and beta_scrape.beta_url.value %}
              {{beta_scrape.beta_url.value|string }}
            {% endif %}
          ai_summary: "{{ agent.response.speech.plain.speech | default('AI summary not available or failed to generate.') }}" 
          ai_summary_short: "{{ agent_short.response.speech.plain.speech }}"
          updated_by: "{{ trigger.description | default('manual') }}"

  # Birthdays
  - triggers:
    - trigger: homeassistant
      event: start
    - platform: event
      event_type: event_template_reloaded
    - platform: time_pattern
      hours: "/12"
    binary_sensor:
        - name: "Upcoming Birthdays"
          unique_id: upcoming_birthdays
          icon: mdi:cake-variant-outline
          variables:
            today_str: "{{ now().date() }}"
            birthday_entities: "{{ label_entities('birthday') | list }}"
            yr: "{{ now().year }}"
            nyr: "{{ now().year + 1 }}"
            is_leap: "{{ (now().year % 4 == 0 and now().year % 100 != 0) or (now().year % 400 == 0) }}"
            n_is_leap: "{{ ((now().year + 1) % 4 == 0 and (now().year + 1) % 100 != 0) or ((now().year + 1) % 400 == 0) }}"
          availability: "{{ label_entities('birthday') | count > 0 }}"
          state: >
              {% set today = as_datetime(today_str).date() %}
              {% set ns = namespace(active=false) %}
              {% for entity in birthday_entities %}
                {% set s = states(entity) %}
                {% if s and s | length >= 10 %}
                  {% set dob = strptime(s[:10], '%Y-%m-%d').date() %}
                  {% set b_day = dob.day if not (dob.month == 2 and dob.day == 29 and not is_leap | bool) else 28 %}
                  {% set next_birthday = dob.replace(year=yr|int, month=dob.month, day=b_day) %}
                  {% if next_birthday < today %}
                    {% set nb_day = dob.day if not (dob.month == 2 and dob.day == 29 and not n_is_leap | bool) else 28 %}
                    {% set next_birthday = dob.replace(year=nyr|int, month=dob.month, day=nb_day) %}
                  {% endif %}
                  {% if (next_birthday - today).days <= 4 %}
                    {% set ns.active = true %}
                  {% endif %}
                {% endif %}
              {% endfor %}
              {{ ns.active }}
          attributes:
              upcoming: >
                {% set today = as_datetime(today_str).date() %}
                {% set ns = namespace(data=[]) %}
                {% for entity in birthday_entities %}
                  {% set s = states(entity) %}
                  {% if s and s | length >= 10 %}
                    {% set dob = strptime(s[:10], '%Y-%m-%d').date() %}
                    {% set eff_m, eff_d = (dob.month, dob.day) if not (dob.month == 2 and dob.day == 29 and not is_leap | bool) else (2, 28) %}
                    {% set next_birthday = dob.replace(year=yr|int, month=eff_m, day=eff_d) %}
                    {% if next_birthday < today %}
                      {% set nb_day = dob.day if not (dob.month == 2 and dob.day == 29 and not n_is_leap | bool) else 28 %}
                      {% set next_birthday = dob.replace(year=nyr|int, month=dob.month, day=nb_day) %}
                    {% endif %}
                    
                    {% set days_until = (next_birthday - today).days %}
                    {% set age = next_birthday.year - dob.year %}
                    {% set label = '🎉 HEUTE' if days_until == 0 else ('MORGEN' if days_until == 1 else days_until ~ ' Tage') %}
                    {% set name = state_attr(entity, 'friendly_name') or entity %}
                    
                    {# Store as a list: [days_remaining, formatted_string] #}
                    {% set ns.data = ns.data + [[days_until, '🎂 ' ~ name ~ ': ' ~ label ~ ' – Alter: ' ~ age]] %}
                  {% endif %}
                {% endfor %}
                
                {# Sort by days, take the first one, and extract the string #}
                {% set sorted_list = ns.data | sort(attribute=0) %}
                {{ sorted_list[0][1] if sorted_list | count > 0 else 'Keine Geburtstage' }}

          
              ages: >
                {% set today = as_datetime(today_str).date() %}
                {% set ns = namespace(dict={}) %}
                {% for entity in birthday_entities %}
                  {% set s = states(entity) %}
                  {% if s and s | length >= 10 %}
                    {% set dob = strptime(s[:10], '%Y-%m-%d').date() %}
                    {% set eff_m, eff_d = (dob.month, dob.day) if not (dob.month == 2 and dob.day == 29 and not is_leap | bool) else (2, 28) %}
                    {% set age = yr|int - dob.year - (1 if (today.month, today.day) < (eff_m, eff_d) else 0) %}
                    {% set ns.dict = dict(ns.dict, **{(state_attr(entity, 'friendly_name') or entity): age}) %}
                  {% endif %}
                {% endfor %}
                {{ ns.dict }}

