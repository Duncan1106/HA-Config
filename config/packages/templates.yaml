template:
  # Battery
  - trigger:
      - trigger: homeassistant
        event: start
      - platform: time_pattern
        minutes: "/5"
      - platform: time
        at: "00:00:30"
      - platform: event
        event_type: event_template_reloaded
      - platform: state
        entity_id:
          - sensor.felicity_ess_soc_avg
          - input_number.night_charge_target
          - input_number.night_charge_minimum_soc_percent
          - input_number.night_charge_dynamic_margin_percent
          - input_number.battery_charge_percent_offset
    binary_sensor:
      - name: Charge Battery at Night (dynamically)
        unique_id: charge_battery_at_night
        variables:
          # Basic Inputs
          soc: "{{ states('sensor.felicity_ess_soc_avg') | float(0) }}"
          cap: "{{ states('sensor.inverter_battery_capacity') | float(0) }}"
          target_kwh: "{{ states('input_number.night_charge_target') | float(0) }}"
          potential_target: "{{ (((states('sensor.home_consumption_total_day') | float(0)) - (states('sensor.daily_energy_goe_11kw') | float(0) + states('sensor.daily_energy_goe_22kw') | float(0))) + 1.25) | clamp(15, state_attr('input_number.night_charge_target','max') | float(999)) | round(2) }}"

          # Forecast Selection Logic
          f_today: "{{ states('sensor.solcast_pv_forecast_prognose_heute') | float(0) }}"
          f_tomorrow: "{{ states('sensor.solcast_pv_forecast_prognose_morgen') | float(0) }}"
          forecast_kwh: "{{ f_today if now().hour < 5 else f_tomorrow }}"
          
          # Margin & Buffer Calculations
          margin_pct: "{{ states('input_number.night_charge_dynamic_margin_percent') | float(0) }}"
          min_soc_pct: "{{ states('input_number.night_charge_minimum_soc_percent') | float(0) }}"
          
          battery_usable_kwh: "{{ cap * (soc / 100.0) }}"
          battery_missing_kwh: "{{ cap - battery_usable_kwh }}"
          dyn_margin_kwh: "{{ forecast_kwh * (margin_pct / 100) }}"
          min_soc_kwh: "{{ cap * (min_soc_pct / 100) }}"
          buffer_kwh: "{{ [dyn_margin_kwh, min_soc_kwh] | max }}"
          
          # Resulting Energy State
          net_energy: "{{ battery_usable_kwh + forecast_kwh - buffer_kwh }}" # available battery + solar - buffers
          charge_needed: "{{ (target_kwh - net_energy) }}" #raw
          
          # Offset
          charge_offset: "{{ states('input_number.battery_charge_percent_offset') | float(0) }}"
          charge_offset_base_kwh: "{{ ((cap|float(0)) * (charge_offset|float(0) / 100)) }}"
          effective_target_kwh: "{{ (target_kwh|float(0)) + (charge_offset_base_kwh|float(0)) }}"
          effective_missing_kwh: "{{ effective_target_kwh - net_energy }}"
          charge_offset_kwh: "{{ charge_offset_base_kwh | clamp(0, effective_missing_kwh) }}"
          effective_charge_needed: "{{ (charge_needed + charge_offset_kwh ) | clamp(0, battery_missing_kwh) }}"
          
          # Charging Power Calculation Inputs
          battery_voltage: 51.2
          efficiency: 0.95
          min_amps: 20
          max_amps: 120

          # Night charge window (today)
          window_start_ts: "{{ as_timestamp(today_at('00:05')) }}"
          window_end_ts: "{{ as_timestamp(today_at('04:55')) }}"
          now_ts: "{{ as_timestamp(now()) }}"

          # Remaining hours inside the night window
          remaining_hours: >
            {% set now_val = now_ts | float %}
            {% set start_val = window_start_ts | float %}
            {% set end_val = window_end_ts | float %}
            {% set full_window = (end_val - start_val) / 3600 %}
        
            {% if now_val < start_val %}
              {{ full_window }}
            {% elif now_val <= end_val %}
              {{ (end_val - now_val) / 3600 }}
            {% else %}
              {{ full_window }}
            {% endif %}
          raw_amps: >
            {% set charge_kwh = effective_missing_kwh | float(0) %}
            {% if charge_kwh > 0 %}
              {% set voltage = battery_voltage | float %}
              {% set efficiency_val = efficiency | float %}
              {% set hours = remaining_hours | float(0) | clamp(0.1, 5) %}
              {{ (charge_kwh * 1000) / (voltage * hours * efficiency_val) }}
            {% else %}
              0
            {% endif %}
          actual_amps: >
            {{ ((raw_amps | float(0) // 10 + 1) * 10) | clamp(min_amps|int(20), max_amps|int(120)) }}

        state: "{{ net_energy|float < effective_target_kwh|float }}"
        availability: >
          {% set f_entity = 'sensor.solcast_pv_forecast_prognose_heute' if now().hour < 5 else 'sensor.solcast_pv_forecast_prognose_morgen' %}
          {{ states('sensor.felicity_ess_soc_avg') not in ['unknown','unavailable']
             and states(f_entity) not in ['unknown','unavailable'] }}
        attributes:
          decision_formula: "battery_usable_kwh + forecast_kwh - buffer_kwh < target_kwh + charge_offset_kwh"
          battery_state: ''
          soc_percent: "{{ soc }}"
          usable_kwh: "{{ battery_usable_kwh | round(2) }}"
          battery_missing_kwh: "{{ battery_missing_kwh | round(2) }}"
          forecast: ''
          forecast_heute_kwh: "{{ f_today | round(2) }}"
          forecast_morgen_kwh: "{{ f_tomorrow | round(2) }}"
          forecast_selected_kwh: "{{ forecast_kwh | round(2) }}"
          target: ''
          total_energy_kwh: "{{ [net_energy, 0] | max | round(2) }}"
          target_kwh: "{{ target_kwh }}"
          effective_target_kwh: "{{ effective_target_kwh | round(2) }}"
          potential_target: "{{ potential_target | round(2) }}"
          charge_kwh: ''
          charge_needed_kwh: "{{ charge_needed | round(2) }}"
          charge_offset_kwh: "{{ charge_offset_base_kwh | round(2) }}"
          effective_missing_kwh: "{{ effective_missing_kwh | round(2)}}"
          charge_target: ''
          charge_target_percent: >
            {% set target_pct = ((battery_usable_kwh + charge_needed) / cap) * 100 if cap > 0 else 0 %}
            {{ target_pct | clamp(0, 100) | round(0, 'ceil', 100) }}
          battery_charge_percent_offset: "{{ charge_offset }}"
          offset_charge_target_percent: >
            {% set target_pct = (((battery_usable_kwh + effective_missing_kwh) / cap) * 100) if cap > 0 else 0 %}
            {{ target_pct | clamp(0, 100) | round(0, 'ceil', 100) }}
          buffer: ''
          dynamic_margin_kwh: "{{ dyn_margin_kwh | round(2) }}"
          minimum_soc_kwh: "{{ min_soc_kwh | round(2) }}"
          applied_buffer_kwh: "{{ buffer_kwh | round(2) }}"
          saved_cost_eur: >
            {% set night_tariff = 0.187425 %}
            {% set day_tariff = 0.302379 %}
            {{ ((day_tariff - night_tariff) * effective_charge_needed|float(0)) | round(2) }}
          charging_window: ''
          remaining_hours: "{{ remaining_hours | round(2) }}"
          amps: ''
          required_charge_amps_raw: "{{ raw_amps | round(1) }}"
          required_charge_amps: "{{ actual_amps }}"
          updated_by: "{{ trigger.description | default('manual') }}"

  # Humidifier
  - trigger:
      - trigger: homeassistant
        event: start
      - platform: event
        event_type: event_template_reloaded
      - platform: time_pattern
        minutes: "/1"
      - platform: state
        entity_id:
          - input_number.max_humidifier_activations_per_day
    binary_sensor:
      - name: "Luftbefeuchter On-Windows"
        unique_id: humidifier_trigger_window
        variables:
          current_time: "{{ now() | as_local }}"
          match_window_seconds: 65
          nr_offset_hours: 2
          ns_offset_hours: 1.25
          nr_str: >
            {% set current_time_dt = as_datetime(current_time) %}
            {% set next_rising = as_datetime(state_attr('sun.sun','next_rising')) | as_local %}
            {% set nr_today = next_rising if next_rising.day == current_time_dt.day else next_rising - timedelta(days=1) %}
            {{ nr_today + timedelta(hours=(nr_offset_hours|float)) }}
          ns_str: >
            {% set current_time_dt = as_datetime(current_time) %}
            {% set next_setting = as_datetime(state_attr('sun.sun','next_setting')) | as_local %}
            {% set ns_today = next_setting if next_setting.day == current_time_dt.day else next_setting - timedelta(days=1) %}
            {{ ns_today - timedelta(hours=ns_offset_hours|float) }}
          actual_triggers_today: "{{states('sensor.daily_luftbefeuchter') | int(0)}}"
          max_activations_per_day: "{{ states('input_number.max_humidifier_activations_per_day') | int(15) }}"
          remaining_activations: "{{ [0, max_activations_per_day|int - actual_triggers_today|int] | max }}"
          last_changed_utility_meter: "{{ as_datetime((states.sensor.daily_luftbefeuchter.last_changed) + timedelta(minutes=10)) | as_local }}"
          distribution_anchor_time_str: >
            {% set nr = as_datetime(nr_str) | as_local %}
            {% if actual_triggers_today|int == 0 %}
              {{ nr }}
            {% else %}
              {{ [as_datetime(last_changed_utility_meter) | as_local, nr] | max }}
            {% endif %}
          span: >
            {% set ns = as_datetime(ns_str) | as_local %}
            {% set distribution_anchor_time = as_datetime(distribution_anchor_time_str) | as_local %}
            {% set span = ns - distribution_anchor_time %}
            {{ span.total_seconds() }}
          interval: "{{ span|int / (remaining_activations|int + 1) }}"
          all_ptts: >
            {% set distribution_anchor_time_str = as_datetime(distribution_anchor_time_str) | as_local %}
            {% set count = remaining_activations|int %}
            {% set out = namespace(items=[]) %}
            {% if count > 0 and span|float > 0 %}
              {% for i in range(count) %}
                {% set ptt = distribution_anchor_time_str + timedelta(seconds=(i + 1) * interval|float) %}
                {% set out.items = out.items + [ptt.isoformat()] %}
              {% endfor %}
            {% endif %}
            {{ out.items }}
        availability: >
          {{ states('sun.sun') not in ['unknown', 'unavailable']
             and state_attr('sun.sun', 'next_rising') is not none
             and state_attr('sun.sun', 'next_setting') is not none
             and states('sensor.daily_luftbefeuchter') not in ['unknown', 'unavailable'] }}
        state: >
          {% set current_time_dt = as_datetime(current_time) | as_local%}
          {% set match_window = timedelta(seconds=match_window_seconds|int) %}
          {% set result = namespace(match=false) %}
          {% for t_str in all_ptts %}
            {% set ptt = as_datetime(t_str) | as_local %}
            {% if (ptt - match_window) <= current_time_dt <= (ptt + match_window) %}
              {% set result.match = true %}
            {% endif %}
          {% endfor %}
          {{ result.match }}
        attributes:
          status: >
            {% set curr = as_datetime(current_time) %}
            {% set nr = as_datetime(nr_str) %}
            {% set ns = as_datetime(ns_str) %}
            {% if curr < nr %} Outside Window: Night/Morning
            {% elif curr > ns %} Outside Window: Night/Evening
            {% elif remaining_activations|int <= 0 %} Outside Window: Daily Limit Reached
            {% else %} Active: Calculating Slots {% endif %}
          next_sunrise_offset_start: "{{ as_datetime(nr_str).strftime('%Y-%m-%d %H:%M:%S') }}"
          next_sunset_offset_end: "{{ as_datetime(ns_str).strftime('%Y-%m-%d %H:%M:%S') }}"
          actual_triggers_today: "{{ actual_triggers_today }}"
          max_activations_per_day: "{{ max_activations_per_day }}"
          remaining_activations: "{{ remaining_activations }}"
          distribution_anchor_time: "{{ distribution_anchor_time_str }}"
          window_duration: "{{ time_until(now() + (as_datetime(ns_str) - as_datetime(nr_str)), 2) }}"
          trigger_interval: "{{ (time_until(now() + timedelta(seconds=interval|int), 3)) if remaining_activations|int > 0 else 'N/A' }}"
          trigger_times: >
            {% set current_time_dt = as_datetime(current_time) | as_local %}
            {% set out = namespace(times=[]) %}
            {% for t_str in all_ptts %}
              {% set ptt = as_datetime(t_str) | as_local %}
              {% if ptt > current_time_dt %}
                {% set out.times = out.times + [ptt.strftime('%H:%M:%S')] %}
              {% endif %}
            {% endfor %}
            {{ out.times if out.times|length > 0 else ["No future slots"] }}
          all_trigger_times: >
            {% set out = namespace(times=[]) %}
            {% for t_str in all_ptts %}
              {% set ptt = as_datetime(t_str) | as_local %}
              {% set out.times = out.times + [ptt.strftime('%H:%M:%S')] %}
            {% endfor %}
            {{ out.times if out.times|length > 0 else [" No Slots Today"] }}
          updated_at: "{{ as_datetime(current_time).strftime('%H:%M:%S') }} by {{ trigger.description | default('manual') }}"

