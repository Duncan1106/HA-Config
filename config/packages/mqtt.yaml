mqtt:
  switch:
    - name: "Tasmota Rule 1"
      unique_id: tasmota_157F88_rule1_switch
      command_topic: "cmnd/tasmota_157F88/Rule1"
      # We define the anchor (&) right here inside the first valid item
      <<: &tasmota_rule_base
        payload_on: "ON"
        payload_off: "OFF"
        state_topic: "stat/tasmota_157F88/RESULT"
        optimistic: false
        icon: mdi:script
        availability_topic: "tele/tasmota_157F88/LWT"
        payload_available: "Online"
        payload_not_available: "Offline"
        device:
          connections:
            - ["mac", "C8C9A3157F88"]
          identifiers:
            - "C8C9A3157F88"
      value_template: >
        {% if value_json.Rule1 is defined %}
          {{ value_json.Rule1.State if value_json.Rule1.State in ['ON','OFF'] else None }}
        {% endif %}

    - name: "Tasmota Rule 2"
      unique_id: tasmota_157F88_rule2_switch
      command_topic: "cmnd/tasmota_157F88/Rule2"
      value_template: >
        {% if value_json.Rule2 is defined %}
          {{ value_json.Rule2.State if value_json.Rule2.State in ['ON','OFF'] else None }}
        {% endif %}
      <<: *tasmota_rule_base

    - name: "Tasmota Rule 3"
      unique_id: tasmota_157F88_rule3_switch
      command_topic: "cmnd/tasmota_157F88/Rule3"
      value_template: >
        {% if value_json.Rule3 is defined %}
          {{ value_json.Rule3.State if value_json.Rule3.State in ['ON','OFF'] else None }}
        {% endif %}
      <<: *tasmota_rule_base

  binary_sensor:
    - name: "Smart Meter MQTT Data"
      state_topic: "smartmeter-em420/"
      value_template: "{{ iif(value_json.get('smart-meter', {}).get('status', 0) | int == 1, 'OFF', 'ON', 'ON') }}"
      unique_id: smart_meter_mqtt_data
      device_class: problem
      expire_after: 30
      availability:
      - topic: "smartmeter-em420/"
        value_template: >
          {{ iif(value_json.get('smart-meter') is defined, 'online', 'offline') }}
      json_attributes_topic: "smartmeter-em420/"
      json_attributes_template: "{{ value_json.get('smart-meter', {}) | tojson }}"
      device:
        name: "Smart Meter"
        identifiers: 
         - "em420"

  sensor:
    - name: "Tibber Node Pulse Battery Voltage"
      unique_id: tibber_node_battery_voltage
      state_topic: "tibber/out/TFD01/50325ffffe29475c/metric"
      value_template: "{{ value_json.node_status.node_battery_voltage | float(0) | round(3) }}"
      unit_of_measurement: "V"
      device_class: voltage
      state_class: measurement
      icon: mdi:battery
      json_attributes_topic: "tibber/out/TFD01/50325ffffe29475c/metric"
      json_attributes_template: >
        {% set ns = value_json.node_status | default({}) %}
        {% set ha = value_json.hub_attachments | default({}) %}
        {% if ns %}
          {% set uptime_ms = ns.node_uptime_ms | float(0) / 1000 %}
          {% set ts = (now() - timedelta(seconds=uptime_ms)) | time_since(4) %}
          {% set parts = ts | regex_findall('(\d+)\\s*(\\w+)') %}
          {% set ns_shorts = namespace(short_parts=[]) %}
          {% for p in parts %}
            {% set ns_shorts.short_parts = ns_shorts.short_parts + [p[0] ~ p[1][:1]] %}
          {% endfor %}
          {% set uptime_human = ns_shorts.short_parts | join(' ') %}
          {% set lqi = ns.node_avg_lqi | float(-1) %}
          {% set lqi_quality = (
              "Unknown" if lqi < 0 else
              "Excellent" if lqi >= 200 else
              "Good" if lqi >= 175 else
              "Fair" if lqi >= 150 else
              "Weak"
          ) %}
          {{ (ns | combine(ha) | combine({"uptime_human": uptime_human, "lqi_quality": lqi_quality})) | tojson }}
        {% else %}
          {{ {} | tojson }}
        {% endif %}
      device:
        name: "Tibber Pulse+Bridge"
        connections:
          - ["mac", "4091511E1B10"]
        identifiers:
          - "4091511E1B10"

    - name: "Tibber Node Bridge Status"
      unique_id: "tibber_bridge_status_sensor"
      state_topic: "tibber/out/TJH01/4091511e1b100/metric"
      value_template: "{{ value_json.status.vcc | float(0) | round(3) }}"
      unit_of_measurement: "V"
      device_class: voltage
      state_class: measurement
      json_attributes_topic: "tibber/out/TJH01/4091511e1b100/metric"
      json_attributes_template: >
        {% set s = value_json.status | default({}) %}
        {% set ota = s.ota | default([]) %}
        {% if s %}
          {% set uptime_sec = s.uptime | float(0) %}
          {% set ts = (now() - timedelta(seconds=uptime_sec)) | time_since(4) %}
          {% set parts = ts | regex_findall('(\d+)\\s*(\\w+)') %}
          {% set ns_shorts = namespace(short_parts=[]) %}
          {% for p in parts %}
            {% set ns_shorts.short_parts = ns_shorts.short_parts + [p[0] ~ p[1][:1]] %}
          {% endfor %}
          {% set uptime_human = ns_shorts.short_parts | join(' ') %}
          {% set uptime_days = ((s.uptime | float(0)) / 86400) | round(2)%}
          {# ---- WiFi quality ---- #}
          {% set rssi = s.rssi | int(-100) %}
          {% set wifi_quality = (
              "Excellent" if rssi > -55 else
              "Good" if rssi > -67 else
              "Fair" if rssi > -75 else
              "Weak"
          ) %}

          {# ---- Combine everything ---- #}
          {{ s | combine({"uptime_human": uptime_human, "uptime_days": uptime_days, "wifi_quality": wifi_quality, "ota": ota}) | tojson }}
        {% else %}
          {{ {} | tojson }}
        {% endif %}
      device:
        name: "Tibber Pulse+Bridge"
        connections:
          - ["mac", "4091511E1B10"]
        identifiers:
          - "4091511E1B10"

    - name: "Fully Kiosk Device Info"
      state_topic: fully-single-app/deviceInfo/a9641507-a9641507
      unique_id: fully_kiosk_device_info
      json_attributes_topic: fully-single-app/deviceInfo/a9641507-a9641507
      value_template: "{{ value_json.get('deviceName', 'Unknown') }}"
      device:
        connections:
          - ["mac", "0838E60CA328"]
        identifiers:
          - "fully_kiosk_a9641507"
  
    - name: "MQTT_Stats_Messages_Received"
      state_topic: "$SYS/brokers/emqx@homeassistant.local/metrics/messages/received"
      unit_of_measurement: messages
      unique_id: mqtt_stats_messages_received
      <<: &mqtt_broker_sensor_base
          state_class: total
          entity_category: diagnostic
          device:
            name: "EMQX Broker"
            identifiers:
              - "emqx_homeassistant_local"
            manufacturer: "EMQ"
            model: "EMQX"
    - name: "MQTT_Stats_Messages_Sent"
      state_topic: "$SYS/brokers/emqx@homeassistant.local/metrics/messages/sent"
      unit_of_measurement: messages
      unique_id: mqtt_stats_messages_sent
      <<: *mqtt_broker_sensor_base
    - name: "MQTT_Stats_Bytes_Received"
      state_topic: "$SYS/brokers/emqx@homeassistant.local/metrics/bytes/received"
      unit_of_measurement: B
      unique_id: mqtt_stats_bytes_received
      device_class: data_size
      <<: *mqtt_broker_sensor_base
    - name: "MQTT_Stats_Bytes_Sent"
      state_topic: "$SYS/brokers/emqx@homeassistant.local/metrics/bytes/sent"
      unit_of_measurement: B
      unique_id: mqtt_stats_bytes_sent
      device_class: data_size
      <<: *mqtt_broker_sensor_base
    - name: "MQTT_Stats_Uptime"
      state_topic: "$SYS/brokers/emqx@homeassistant.local/uptime"
      unit_of_measurement: ms
      unique_id: mqtt_stats_uptime
      device_class: duration
      <<: *mqtt_broker_sensor_base