mqtt:
  switch:
    - name: "Tasmota Rule 1"
      unique_id: tasmota_157F88_rule1_switch
      command_topic: "cmnd/tasmota_157F88/Rule1"
      payload_on: "ON"
      payload_off: "OFF"
      state_topic: "stat/tasmota_157F88/RESULT"
      value_template: >
        {% if value_json.Rule1 is defined and value_json.Rule1.State in ['ON','OFF'] %}
          {{ value_json.Rule1.State }}
        {% else %}
          None
        {% endif %}
      optimistic: false
      icon: mdi:script
      availability_topic: "tele/tasmota_157F88/LWT"
      payload_available: "Online"
      payload_not_available: "Offline"
      device:
        connections:
          - ["mac", "C8C9A3157F88"]
        identifiers:
          - "C8C9A3157F88"

