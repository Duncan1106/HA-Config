template: 
  # AI Beta Release Notes Summary
  - triggers:
      - trigger: homeassistant
        event: start
      - platform: event
        event_type: event_template_reloaded
      - trigger: state
        entity_id:
         - input_button.update_beta_release_notes
         - input_select.conversation_agents
    binary_sensor:
      - unique_id: home_assistant_beta_release_notes_window
        name: Home Assistant Beta Release Notes Window
        icon: mdi:home-assistant
        state: >
            {% set today = now().date() %}
            {% if today.day <= 7 %}
              {% set fdom = today.replace(day=1) %}
            {% else %}
              {% set fdom = (today.replace(day=28) + timedelta(days=5)).replace(day=1) %}
            {% endif %}
            {% set first_wed = fdom + timedelta(days=(2 - fdom.weekday() + 7) % 7) %}
            {{ first_wed - timedelta(days=7) <= today <= first_wed }}
  - triggers:
      - trigger: homeassistant
        event: start
      - platform: event
        event_type: event_template_reloaded
      - trigger: state
        entity_id:
         - input_button.update_beta_release_notes
         - input_select.conversation_agents
    conditions:
      - condition: state
        entity_id: binary_sensor.home_assistant_beta_release_notes_window
        state:
          - "on"
    actions:
      - action: multiscrape.scrape
        response_variable: beta_scrape
        data:
          name: beta_release_scraper
          resource: https://rc.home-assistant.io/latest-release-notes/
          sensor:
            - unique_id: beta_url
              name: Beta Release URL
              select: link[rel='canonical']
              attribute: href
              value_template: |
                {!{ value | trim | replace('www.home','rc.home') }!}
            - unique_id: beta_notes_content
              name: Beta Notes Content
              select: body
              value_template: |
                {!{ value | trim | replace('\n', ' ') }!}
      - action: conversation.process
        response_variable: agent
        data:
          agent_id: "{{ states('input_select.conversation_agents') }}"
          text: >-
            You are an expert software release notes summarizer.

            The release notes below are for the Home Assistant release found at
            this URL: {{ beta_scrape.beta_url.value }}

            Based on the following raw release notes text, please:

            1. Extract and list **New Features** introduced in this release. 2.
            Identify and list any **Breaking Changes** (features or behaviors
            that require user attention because they may break existing setups).
            3. Highlight **Backward-Incompatible Changes** or deprecations. 4.
            Optionally include other important notes, like bug fixes or notable
            improvements.

            Structure your output in a clear, organized format with headings
            like this:

            **New Features:**   \n- Feature 1   \n- Feature 2 ...

            **Breaking Changes:**   \n- Change 1   \n- Change 2 ...

            **Backward-Incompatible Changes:**   \n- Change 1   \n- Change 2 ...

            **Other Notes:**   \n- Note 1   \n- Note 2 ...

            Only include points actually mentioned in the release notes. Be
            concise but informative, avoid filler.
            The summary is intended to be used in a markdown display.
            Only provide the summary and nothing else like heres the summary or any other form of introduction.

            Here is the release notes text:   
            
            {{ beta_scrape.beta_notes_content }}
      - action: conversation.process
        response_variable: agent_short_try
        data:
          agent_id: "{{ states('input_select.conversation_agents') }}"
          text: >-
            Summarize the provided text to a maximum of 250 words or 750 characters — whichever is shorter.
            Extract and retain only the core concepts and essential information.
            Aggressively remove all filler words, redundant phrases, and secondary details.
            Ensure the summary is grammatically correct, coherent, and preserves the original meaning.
            Do not exceed the limit under any circumstance.
             
            {% if beta_scrape is defined and beta_scrape.beta_url is defined and beta_scrape.beta_url.value %}
              {% set url = beta_scrape.beta_url.value|string|trim %}
              {% if 'release-' in url %}
                {% set build = url.split('/')[-2]|trim %}
                {% set year = build.split('-')[1][0:4] %}
                {% set month = build.split('-')[1][4:]|int %}
                Homeassistant {{ year ~ '.' ~ ('%02d'|format(month)) ~ '.0'}}
              {% else %}
                Invalid URL
              {% endif %}
            {% else %}
              Unknown
            {% endif %}
            
            {{ agent.response.speech.plain.speech }}
      - action: conversation.process
        response_variable: agent_short
        data:
          agent_id: "{{ states('input_select.conversation_agents') }}"
          text: >-
            Summarize the following text to a maximum of 250 words or 750 characters — whichever is shorter.
            Extract only the most critical features, integrations, and breaking changes.
            Remove all filler, examples, UI details, minor notes, and secondary information.
            Preserve clarity and grammar.
            Do not explain, justify, or comment.
            Do not include any text before or after the summary.
            Output ONLY the condensed summary.
            
            {% if beta_scrape is defined and beta_scrape.beta_url is defined and beta_scrape.beta_url.value %}
              {% set url = beta_scrape.beta_url.value|string|trim %}
              {% if 'release-' in url %}
                {% set build = url.split('/')[-2]|trim %}
                {% set year = build.split('-')[1][0:4] %}
                {% set month = build.split('-')[1][4:]|int %}
                Homeassistant {{ year ~ '.' ~ ('%02d'|format(month)) ~ '.0'}}
              {% else %}
                Invalid URL
              {% endif %}
            {% else %}
              Unknown
            {% endif %}
            
            {{ agent_short_try.response.speech.plain.speech }}
    sensor:
      - unique_id: home_assistant_beta_release_notes
        name: Home Assistant Beta Release Notes
        icon: mdi:home-assistant
        state: >
            {% if beta_scrape is defined and beta_scrape.beta_url is defined and beta_scrape.beta_url.value %}
              {% set url = beta_scrape.beta_url.value|string|trim %}
              {% if 'release-' in url %}
                {% set build = url.split('/')[-2]|trim %}
                {% set year = build.split('-')[1][0:4] %}
                {% set month = build.split('-')[1][4:]|int %}
                {{ year ~ '.' ~ ('%02d'|format(month)) ~ '.0'}}
              {% else %}
                Invalid URL
              {% endif %}
            {% else %}
              Unknown
            {% endif %}
        attributes:
          beta_url: >
            {% if beta_scrape is defined and beta_scrape.beta_url is defined %}
              {{ beta_scrape.beta_url.value }}
            {% else %}
              {{ state_attr('sensor.home_assistant_beta_release_notes', 'beta_url') }}
            {% endif %}
          ai_summary: >
            {% if agent is defined %}
              {{ agent.response.speech.plain.speech }}
            {% else %}
              {{ state_attr('sensor.home_assistant_beta_release_notes', 'ai_summary') | default('Pending...') }}
            {% endif %}
          ai_summar_short_try: >
            {% if agent_short_try is defined %}
              {{ agent_short_try.response.speech.plain.speech }}
            {% else %}
              {{ state_attr('sensor.home_assistant_beta_release_notes', 'ai_summar_short_try') | default('Pending...') }}
            {% endif %}
          ai_summary_short: >
            {% if agent_short is defined %}
              {{ agent_short.response.speech.plain.speech }}
            {% else %}
              {{ state_attr('sensor.home_assistant_beta_release_notes', 'ai_summary_short') | default('Pending...') }}
            {% endif %}