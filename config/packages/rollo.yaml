template:
  # Rollo Sommer
  - triggers:
      - platform: state
        entity_id: input_boolean.rollo_summer_override
      - platform: state
        entity_id: sensor.sun_solar_azimuth
      - platform: state
        entity_id: sensor.sun_solar_elevation
      - platform: event
        event_type: event_template_reloaded
      - platform: homeassistant
        event: start
    binary_sensor:
      - name: "Rollo Summer Should Close"
        unique_id: rollo_summer_should_close
        variables:
          sunrise_open_delay_minutes: 15
          sunset_close_delay_minutes: 15
          sun_window_azimuth_threshold: 148
          sun_window_elevation_threshold: 15
          rain_rate_threshold: 0.1
          uv_index_threshold_strong: 5.0
          temp_outside_threshold: 22.0
          uv_threshold_temp_diff: 25000.0
          uv_threshold_strong: 80000.0
          temp_diff_threshold: 2.5
          baseline: 20.0
          extreme_temp_threshold: 30.0
          heat_risk_score: 2.2
          current_time: "{{ now() | as_timestamp | timestamp_local | as_datetime }}"
          relevant_sunrise_dt: >
            {% set current_time_dt = as_datetime(current_time) %}
            {% set next_rising_raw_dt = states('sensor.sun_next_rising') | as_timestamp | timestamp_local | as_datetime %}
            {{ next_rising_raw_dt if next_rising_raw_dt.day == current_time_dt.day else (next_rising_raw_dt - timedelta(days=1)) }}
          relevant_sunset_dt: >
            {% set current_time_dt = as_datetime(current_time) %}
            {% set next_setting_raw_dt = states('sensor.sun_next_setting') | as_timestamp | timestamp_local | as_datetime %}
            {{ next_setting_raw_dt if next_setting_raw_dt.day == current_time_dt.day else (next_setting_raw_dt - timedelta(days=1)) }}
          open_after: >
            {% set delay = sunrise_open_delay_minutes | int(15) %}
            {{ as_datetime(relevant_sunrise_dt) + timedelta(minutes=delay) }}
          close_before: >
            {% set delay = sunset_close_delay_minutes | int(15) %}
            {{ as_datetime(relevant_sunset_dt) - timedelta(minutes=delay) }}
          azimuth: "{{ states('sensor.sun_solar_azimuth') | default(0, true) | float }}"
          elevation: "{{ states('sensor.sun_solar_elevation') | default(0, true) | float }}"
          temp_inside: "{{ states('sensor.gw1100a_indoor_temperature') | float(0) }}"
          temp_outside: "{{ states('sensor.gw1100a_outdoor_temperature') | float(0) }}"
          temp_diff: "{{ (temp_outside|float - temp_inside|float) | round(2)}}"
          rain_rate: "{{states('sensor.gw1100a_rain_rate') | float(0) }}"
          rain_sunflower: "{{ is_state('binary_sensor.rain_sun_flower_rain', 'on') }}"
          weather: "{{ states('weather.weather_fusion_ai_home') | lower | default('') }}"
          weather_says_rain: >
            {% set RAIN_KEYWORDS = ['rain', 'shower'] %}
            {{ RAIN_KEYWORDS | select('in', weather) | list | count > 0 }}
          uv_lux: "{{ states('sensor.gw1100a_solar_lux') | float(0) }}"
          uv_index: "{{ states('sensor.gw1100a_uv_index') | float(0) }}"
          manual: "{{ 1 if is_state('input_boolean.rollo_summer_override', 'on') else 0 }}"
          summer: >
            {% set summer_months = [5,6,7,8,9] %}
            {% set month = now().month %}
            {{ 1 if (month in summer_months) else 0 }}
          within_daylight: >
            {% set current_time_dt = as_datetime(current_time|string) %}
            {% set open_after_dt = as_datetime(open_after|string) %}
            {% set close_before_dt = as_datetime(close_before|string) %}
            {{ 1 if ((current_time_dt > open_after_dt) and (current_time_dt < close_before_dt)) else 0 }}
          sun_hits_window: "{{ 1 if ((azimuth|float > sun_window_azimuth_threshold|float) and (elevation|float > sun_window_elevation_threshold|float)) else 0 }}"
          not_raining: >
              {% set rain_conditions = [
                rain_rate|float > rain_rate_threshold|float,
                rain_sunflower|bool,
                weather_says_rain|bool
              ] %}
            
              {% set count_true = rain_conditions | select('equalto', true) | list | count %}
            
              {{ 1 if (count_true < 2) else 0 }}
          strong_uv_index: >
            {% if temp_outside|float <= temp_outside_threshold|float %}
              0.0
            {% else %}
              {% set ratio = uv_index|float / uv_index_threshold_strong|float if uv_index_threshold_strong|float > 0 else 0 %}
              {{ ratio | clamp(0.0, 1.0) | round(2) }}
            {% endif %}
          strong_uv_lux: >
            {% if temp_outside|float <= temp_outside_threshold|float %}
              0.0
            {% else %}
              {% set ratio = uv_lux|float / uv_threshold_strong|float if uv_threshold_strong|float > 0 else 0 %}
              {{ ratio | clamp(0.0, 1.0) |round(2) }}
            {% endif %}
          high_temp_diff: >
            {% if temp_outside|float <= temp_outside_threshold|float or uv_lux|float <= uv_threshold_temp_diff|float %}
              0.0
            {% else %}
              {% set ratio = temp_diff|float / temp_diff_threshold|float if temp_diff_threshold|float > 0 else 0 %}
              {{ ratio | clamp(0.0, 1.0) |round(2) }}
            {% endif %}
          extreme_temp: >
            {% set denom = (extreme_temp_threshold|float - baseline|float) if (extreme_temp_threshold|float - baseline|float) != 0 else 1 %}
            {{ ((temp_outside|float - baseline|float) / denom) | clamp(0.0, 1.0) | round(2) }}
        state: >
          {% if manual|int > 0 or summer|int < 1 %}
            None
          {% elif (summer|int + within_daylight|int + sun_hits_window|int + not_raining|int) < 4 %}
            false
          {% else %}
            {% set sum = strong_uv_index|float + strong_uv_lux|float + high_temp_diff|float + extreme_temp|float %}
            {% if sum >= heat_risk_score|float %}
              true
            {% else %}
              false
            {% endif %}
          {% endif %}
        attributes:
          manual_mode: "{{ manual }}"
          first_blockers: ''
          summer: "{{ summer }}"
          within_daylight: "{{ within_daylight }}"
          sun_hits_window: "{{ sun_hits_window }}"
          not_raining: "{{ not_raining }}"
          heat_reasons: ''
          strong_uv_index: "{{ strong_uv_index }}"
          strong_uv_lux: "{{ strong_uv_lux }}"
          high_temp_diff: "{{ high_temp_diff }}"
          extreme_temp: "{{ extreme_temp }}"
          Reason: ''
          reason: >
              {% set ns = namespace(reasons=[]) %}
            
              {# Manual override #}
              {% if manual %}
                {% set ns.reasons = ns.reasons + ['Manual override active, auto open/close disabled.'] %}
              {% else %}
                {# Summer check #}
                {% if summer < 1 %}
                  {% set ns.reasons = ns.reasons + ['Not summer month'] %}
                {% endif %}
                
                {# Within daylight #}
                {% if within_daylight < 1 %}
                  {% set ns.reasons = ns.reasons + ['Outside daylight window'] %}
                {% endif %}
            
                {# Sun hits window #}
                {% if sun_hits_window < 1%}
                  {% set ns.reasons = ns.reasons + ['Sun not hitting window'] %}
                {% endif %}
            
                 {% if not_raining | int < 1 %}
                  {# Calculating the count for the string display #}
                  {% set rain_conditions = [ rain_rate|float > rain_rate_threshold|float, rain_sunflower|bool, weather_says_rain|bool ] %}
                  {% set count_true = rain_conditions | select('equalto', true) | list | count %}
                  {% set ns.reasons = ns.reasons + ['Raining detected (' ~ count_true ~ ' of 3)'] %}
                {% endif %}
            
                {# 3. Heat Risk Scores (The decision criteria) #}
                {% set s_uv_index = strong_uv_index | float %}
                {% set s_uv_lux = strong_uv_lux | float %}
                {% set h_temp_diff = high_temp_diff | float %}
                {% set e_temp = extreme_temp | float %}
                {% set total_score = (s_uv_index + s_uv_lux + h_temp_diff + e_temp) | round(2) %}
                {% set count_nonzero = [s_uv_index, s_uv_lux, h_temp_diff, e_temp] | select('gt', 0) | list | count %}
                
                {% set ns.reasons = ns.reasons + ['Heat risk score: ' ~ total_score ~ ' (Threshold:' ~ heat_risk_score ~ ')' ~ ' (components: ' ~ count_nonzero ~ '/4)'] %}
                {% set ns.reasons = ns.reasons + [
                  'UV Index Score: ' ~ s_uv_index,
                  'UV Lux Score: ' ~ s_uv_lux,
                  'Temp Diff Score: ' ~ h_temp_diff,
                  'Extreme Temp Score: ' ~ e_temp
                ] %}
              {% endif %}
            
              {{ ns.reasons | join(',\n') }}
          Time: ''
          open_after: "{{ as_datetime(open_after).strftime('%H:%M') }}"
          close_before: "{{ as_datetime(close_before).strftime('%H:%M') }}"
          Sensors: ''
          temp_inside: "{{ temp_inside }}"
          temp_outside: "{{ temp_outside | round(1) }} (> {{ extreme_temp_threshold }})"
          temp_diff: "{{ temp_diff| round(1) }} (> {{ temp_diff_threshold }})"
          rain_rate: "{{ rain_rate }} (> {{ rain_rate_threshold }})"
          rain_sunflower: "{{ 'Wet' if rain_sunflower|bool else 'Dry' }} (== Wet)"
          weather: "{{ weather }}"
          uv_lux: "{{ uv_lux | round(0) }} (> {{ uv_threshold_strong }})"
          uv_index: "{{ uv_index | round(0) }} (> {{ uv_index_threshold_strong }})"
          elevation: "{{ elevation | round(0) }} (> {{ sun_window_elevation_threshold }})"
          azimuth: "{{ azimuth | round(0) }} (> {{ sun_window_azimuth_threshold }})"
          updated_by: "{{ trigger.description | default('manual') }}"