script:
  pool_rain_counter_reset:
    alias: Pool Regenzähler zurücksetzen
    icon: mdi:counter
    mode: single
    sequence:
      - event: pool_rain_pump_reset

template:
  - triggers:
      # conductivity: wet immediately, dry only after 10 min below
      # (keep 2500 in sync with wet_mv, and the 10 min with dry_hold_s)
      - trigger: numeric_state
        entity_id: sensor.rain_sun_flower_rain_intensity
        above: 2500
        id: wet
      - trigger: numeric_state
        entity_id: sensor.rain_sun_flower_rain_intensity
        below: 2500
        for:
          minutes: 10
        id: dried
      # sensor failure counts as wet (fail-safe)
      - trigger: state
        entity_id: sensor.rain_sun_flower_rain_intensity
        to:
          - unavailable
          - unknown
        id: wet
      # rain rate: wet immediately, dry after 10 min below 0.1
      - trigger: numeric_state
        entity_id: sensor.gw1100a_rain_rate
        above: 0
        id: wet
      - trigger: numeric_state
        entity_id: sensor.gw1100a_rain_rate
        below: 0.1
        for:
          minutes: 10
        id: dried
      - trigger: time_pattern
        minutes: "/5"
        id: tick
      - trigger: homeassistant
        event: start
        id: start
      - trigger: event
        event_type: pool_rain_pump_reset
        id: reset
      - trigger: event
        event_type: pool_rain_pump_partial
        id: partial
      - trigger: event
        event_type: pool_rain_pump_adjust
        id: adjust
    variables:
      # ---- tuning ----
      me: binary_sensor.pool_regenwasserpumpe_erforderlich
      area_m2: 27               # 3 x 9 m
      flow_l_min: 10            # starting guess, the sensor learns the real value
      collection_factor: 0.90   # starting guess
      startup_overhead_s: 10
      min_rain_mm: 1.0
      max_runtime_s: 3600
      wet_mv: 2500              # conductivity above this = wet
      dry_hold_s: 600           # must stay dry this long before pump may run
      min_air_temp_c: 1         # no pumping below this temperature at the basin
      ice_block_dh: 3           # ice index (degree-hours) above which water counts as frozen
      ice_max_dh: 60            # cap of the ice index
      melt_factor: 1.0          # <1 = ice melts slower than it forms
      solar_deg_per_100w: 1.5   # effective temperature bonus per 100 W/m2
      basin_offset_c: 3.0       # basin is this much colder than the weather station at night
      rim_depth_m: 0.45         # water/cover sits this far below the rim
      pool_width_m: 3.0         # horizontal distance the sun has to clear the wall
      min_sun_elevation: 0      # degrees; pump only runs while the sun is above this
      learn_alpha: 0.2          # weight of each new measurement (0-1)
      learn_min_mm: 4.0         # only learn from runs with at least this much rain
      force_mm: 20              # at this much rain, pump in daytime regardless of wet
      timer_add: 90
      # ---- daytime ----
      sun_elevation: "{{ state_attr('sun.sun', 'elevation') | float(-90) }}"
      daytime: "{{ sun_elevation > min_sun_elevation }}"
      # ---- frost gate (degree-hour ice model, cold basin) ----
      temp_c: "{{ states('sensor.gw1100a_outdoor_temperature') | float(none) }}"
      solar_w: "{{ states('sensor.gw1100a_solar_radiation') | float(0) }}"
      shade_min_elev: "{{ ((rim_depth_m / pool_width_m) | atan) * 180 / pi }}"
      sun_gain: "{{ [[(sun_elevation - shade_min_elev) / 10, 0] | max, 1] | min }}"
      temp_basin: >-
        {{ (temp_c - basin_offset_c * (1 - [solar_w * sun_gain / 200, 1] | min)) if temp_c is not none else none }}
      t_eff: "{{ (temp_basin + solar_w / 100 * solar_deg_per_100w * sun_gain) if temp_c is not none else 0 }}"
      ice_prev: "{{ state_attr(me, 'ice_index') | float(0) }}"
      ice_ts_prev: "{{ state_attr(me, 'ice_ts') | float(0) }}"
      ice_dt_h: >-
        {{ ([[(now().timestamp() - ice_ts_prev) / 3600, 0] | max, 1] | min) if ice_ts_prev > 0 else 0 }}
      ice_index: >-
        {%- if temp_c is none -%}
          {{ ice_prev }}
        {%- elif t_eff < 0 -%}
          {{ [ice_prev - t_eff * ice_dt_h, ice_max_dh] | min }}
        {%- else -%}
          {{ [ice_prev - t_eff * melt_factor * ice_dt_h, 0] | max }}
        {%- endif -%}
      frost_block: "{{ temp_basin is none or temp_basin < min_air_temp_c or ice_index | float(0) > ice_block_dh }}"
      # ---- self-calibration: seconds of pumping per mm of rain ----
      nominal_spm: "{{ area_m2 * collection_factor / flow_l_min * 60 }}"
      prev_spm: "{{ state_attr(me, 'seconds_per_mm') | float(0) }}"
      prev_nominal: "{{ state_attr(me, 'nominal_seconds_per_mm') | float(0) }}"
      nominal_changed: "{{ (nominal_spm - prev_nominal) | abs > 0.02 }}"
      partial_runs: "{{ state_attr(me, 'partial_runs') | int(0) }}"
      is_reset: "{{ trigger.id == 'reset' }}"
      is_partial: "{{ trigger.id == 'partial' }}"
      ev_actual_s: "{{ trigger.event.data.get('actual_s', 0) | float(0) if is_reset else 0 }}"
      ev_rain_mm: "{{ trigger.event.data.get('rain_mm', 0) | float(0) if is_reset else 0 }}"
      ev_removed_s: "{{ trigger.event.data.get('removed_s', 0) | float(0) if is_partial else 0 }}"
      ev_adjust_mm: "{{ trigger.event.data.get('rain_mm', 0) | float(0) if trigger.id == 'adjust' else 0 }}"
      cal_reset: "{{ trigger.event.data.get('reset_calibration', false) if is_reset else false }}"
      learn: "{{ is_reset and not cal_reset and partial_runs == 0 and ev_actual_s >= startup_overhead_s + 20 and ev_rain_mm >= learn_min_mm }}"
      spm_base: "{{ nominal_spm if (prev_spm <= 0 or cal_reset or nominal_changed) else prev_spm }}"
      measured_spm: "{{ ((ev_actual_s - startup_overhead_s) / ev_rain_mm) if learn else 0 }}"
      spm: >-
        {%- if learn -%}
          {%- set blended = (1 - learn_alpha) * spm_base + learn_alpha * measured_spm -%}
          {{ [[blended, nominal_spm * 2] | min, nominal_spm * 0.5] | max }}
        {%- else -%}
          {{ spm_base }}
        {%- endif -%}
      removed_mm: "{{ (([ev_removed_s - startup_overhead_s, 0] | max) / spm_base) if is_partial else 0 }}"
      # ---- rain amount ----
      unit: "{{ state_attr('sensor.gw1100a_total_rain', 'unit_of_measurement') }}"
      total_ok: "{{ is_number(states('sensor.gw1100a_total_rain')) }}"
      total_mm: >-
        {%- if total_ok -%}
          {%- set v = states('sensor.gw1100a_total_rain') | float(0) -%}
          {{ (v * 25.4) if unit == 'in' else v }}
        {%- else -%}
          {{ state_attr(me, 'total_rain_mm') | float(0) }}
        {%- endif -%}
      baseline_mm: >-
        {%- set pb = state_attr(me, 'baseline_mm') | float(none) -%}
        {%- if trigger.id == 'reset' or pb is none -%}
          {{ total_mm | float(0) }}
        {%- elif trigger.id == 'adjust' -%}
          {{ [total_mm | float(0) - ev_adjust_mm, 0] | max }}
        {%- elif total_mm | float(0) < pb -%}
          0
        {%- elif is_partial -%}
          {{ [pb + removed_mm, total_mm | float(0)] | min }}
        {%- else -%}
          {{ pb }}
        {%- endif -%}
      rain_mm: "{{ [total_mm | float(0) - baseline_mm | float(0), 0] | max }}"
      force: "{{ rain_mm | float(0) >= force_mm }}"
      volume_l: "{{ rain_mm | float(0) * area_m2 * collection_factor }}"
      # ---- runtime ----
      runtime_s: >-
        {%- if rain_mm | float(0) < min_rain_mm -%}
          0
        {%- else -%}
          {{ (rain_mm | float(0) * spm | float(0) + startup_overhead_s) | round(0) }}
        {%- endif -%}
      runtime_capped_s: "{{ [runtime_s | float(0), max_runtime_s] | min | int }}"
      timer_s: "{{ (runtime_capped_s | int + timer_add | int) if runtime_capped_s | int > 0 else 0 }}"
      # ---- rain gate ----
      mv: "{{ states('sensor.rain_sun_flower_rain_intensity') }}"
      rate: "{{ states('sensor.gw1100a_rain_rate') }}"
      wet_now: >-
        {{ not is_number(mv)
           or (mv | float(0)) > wet_mv
           or (is_number(rate) and (rate | float(0)) > 0) }}
      last_wet: >-
        {%- set prev = state_attr(me, 'last_wet') | float(0) -%}
        {%- if wet_now -%}
          {{ now().timestamp() | int }}
        {%- elif trigger.id == 'dried' -%}
          {{ [prev, now().timestamp() - dry_hold_s] | max | int }}
        {%- else -%}
          {{ prev | int }}
        {%- endif -%}
      dry_s: >-
        {%- if wet_now -%}
          0
        {%- elif last_wet | int(0) == 0 -%}
          99999
        {%- else -%}
          {{ (now().timestamp() - last_wet | int(0)) | int }}
        {%- endif -%}
    binary_sensor:
      - name: Pool Regenwasserpumpe erforderlich
        unique_id: pool_regenwasserpumpe_erforderlich
        icon: mdi:pump
        state: >-
          {{ runtime_s | float(0) > 0 and daytime and not frost_block and (force or (not wet_now and dry_s | int(0) >= dry_hold_s)) }}
        attributes:
          block_reason: >-
            {%- if runtime_s | float(0) <= 0 -%}no pumping needed
            {%- elif not daytime -%}night
            {%- elif temp_c is none -%}temperature sensor unavailable
            {%- elif frost_block -%}frost / ice
            {%- elif force -%}forced (rain above limit)
            {%- elif not is_number(mv) -%}conductivity sensor unavailable
            {%- elif (mv | float(0)) > wet_mv -%}sensor wet
            {%- elif is_number(rate) and (rate | float(0)) > 0 -%}rain rate above 0
            {%- elif dry_s | int(0) < dry_hold_s -%}waiting for dry hold
            {%- else -%}ok
            {%- endif -%}
          pumping_needed: "{{ runtime_s | float(0) > 0 }}"
          exceeds_max: "{{ runtime_s | float(0) > max_runtime_s }}"
          force_active: "{{ force and daytime }}"
          daytime: "{{ daytime }}"
          sun_elevation: "{{ sun_elevation | round(1) }}"
          rain_since_reset_mm: "{{ rain_mm | float(0) | round(2) }}"
          volume_l: "{{ volume_l | float(0) | round(0) }}"
          runtime_seconds: "{{ runtime_s | float(0) | int }}"
          runtime_capped_seconds: "{{ runtime_capped_s | int }}"
          runtime_time: >-
            {{ '%02d:%02d:%02d' | format(runtime_capped_s | int // 3600, (runtime_capped_s | int % 3600) // 60, runtime_capped_s | int % 60) }}
          timer_time: >-
            {{ '%02d:%02d:%02d' | format(timer_s | int // 3600, (timer_s | int % 3600) // 60, timer_s | int % 60) }}
          seconds_per_mm: "{{ spm | float(0) | round(2) }}"
          nominal_seconds_per_mm: "{{ nominal_spm | float(0) | round(2) }}"
          last_measured_s_per_mm: >-
            {{ measured_spm | float(0) | round(2) if learn else state_attr(me, 'last_measured_s_per_mm') | float(0) }}
          calibration_runs: >-
            {{ 0 if cal_reset else (state_attr(me, 'calibration_runs') | int(0)) + (1 if learn else 0) }}
          partial_runs: "{{ 0 if (is_reset or trigger.id == 'adjust') else partial_runs + (1 if is_partial else 0) }}"
          conductivity_mv: "{{ mv }}"
          rain_rate: "{{ rate }}"
          wet_now: "{{ wet_now }}"
          last_wet: "{{ last_wet }}"
          dry_for_min: "{{ ([dry_s | int(0), 99999] | min / 60) | round(1) }}"
          wet_threshold_mv: "{{ wet_mv }}"
          dry_hold_min: "{{ (dry_hold_s / 60) | round(0) }}"
          baseline_mm: "{{ baseline_mm | float(0) | round(3) }}"
          total_rain_mm: "{{ total_mm | float(0) | round(3) }}"
          area_m2: "{{ area_m2 }}"
          flow_l_min: "{{ flow_l_min }}"
          collection_factor: "{{ collection_factor }}"
          frost_block: "{{ frost_block }}"
          ice_index: "{{ ice_index | float(0) | round(2) }}"
          ice_ts: "{{ now().timestamp() | int }}"
          temp_c: "{{ temp_c }}"
          solar_w: "{{ solar_w }}"
          t_eff: "{{ t_eff | float(0) | round(1) }}"
          temp_basin: "{{ temp_basin | float(0) | round(1) if temp_basin is not none else none }}"
          sun_gain: "{{ sun_gain | float(0) | round(2) }}"
          last_reset: >-
            {{ now().timestamp() | int if trigger.id == 'reset' else state_attr(me, 'last_reset') }}